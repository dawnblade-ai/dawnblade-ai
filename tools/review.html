<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dawnblade — The Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--r:#C4302B;--y:#E8B33C;--b:#3B6FB0;--ink:#14100E;--forge:#241B16;--forge2:#2E241D;
 --bone:#E8DFD0;--bone-dim:#B8AC98;--line:#4A3B2E;--ok:#7BA05B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--bone);font-family:'Spline Sans',sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px}
h1,h2,h3,.disp{font-family:'Big Shoulders Display',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.mono{font-family:'Spline Sans Mono',monospace}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(20,16,14,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.brand{font-family:'Big Shoulders Display';font-weight:800;font-size:21px;letter-spacing:.06em}
.brand em{font-style:normal;color:var(--y)}
.spacer{flex:1}
.btn{padding:7px 14px;border:1px solid var(--line);border-radius:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:'Big Shoulders Display';font-weight:700;color:var(--bone-dim);white-space:nowrap}
.btn:hover{border-color:var(--y);color:var(--y)}
.btn.go{background:var(--y);color:var(--ink);border-color:var(--y)}
.btn.go:hover{background:#f2c256}
.bar{height:3px;background:var(--forge2)}
.bar i{display:block;height:100%;background:var(--y);transition:width .3s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);padding-bottom:10px}
.pill{padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.08em}
.pill.st{color:var(--y);border-color:#5c4a2a}
.pill.n{color:var(--bone)}
h1.title{font-size:44px;font-weight:800;margin:18px 0 6px;line-height:1}
.note{color:var(--bone-dim);max-width:70ch;margin-bottom:6px}
.decks{font-size:12px;color:var(--bone-dim);margin-bottom:20px}
.decks b{color:var(--bone);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-bottom:26px}
.card{background:var(--forge);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;display:block;background:var(--forge2)}
.cbody{padding:12px 13px 14px}
.cname{font-family:'Big Shoulders Display';font-weight:700;font-size:19px;line-height:1.1}
.ctt{font-size:11px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.08em;margin:3px 0 9px}
.ctx{font-family:'Spline Sans Mono';font-size:12px;line-height:1.55;white-space:pre-wrap;color:#d6cbb8;background:var(--ink);border:1px solid #362a20;border-radius:4px;padding:9px 10px}
.gap{margin-top:8px;font-size:11.5px;line-height:1.45;color:#f0a9a5;display:flex;gap:7px}
.gap b{color:var(--r);font-weight:600;flex:none}
.fup{border:1px solid var(--r);border-left:3px solid var(--r);border-radius:4px;background:rgba(196,48,43,.09);padding:12px 14px;margin-bottom:18px}
.fup .fl{font-family:'Big Shoulders Display';font-weight:800;font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:#f0a9a5;margin-bottom:7px}
.fup .fq{font-size:14.5px;line-height:1.55}
.fup dl{margin-top:10px;font-size:12px;line-height:1.5;color:var(--bone-dim)}
.fup dt{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#8a7f6f;margin-top:7px}
.prior{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:16px;font-size:12.5px;line-height:1.55;color:var(--bone-dim)}
.prior b{display:block;font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin-bottom:5px;font-weight:500}
.tokref{margin-top:11px;border-top:1px solid #362a20;padding-top:10px}
.tokref .lab{font-family:'Big Shoulders Display';font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:7px}
.tok{display:flex;gap:9px;margin-bottom:9px}
.tok img{width:46px;flex:none;border-radius:3px;align-self:flex-start;background:var(--forge2)}
.tokb{min-width:0}
.tokn{font-family:'Big Shoulders Display';font-weight:700;font-size:14px;line-height:1.15}
.tokt{font-size:9.5px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.tokx{font-family:'Spline Sans Mono';font-size:11px;line-height:1.5;color:#c3bbaa;white-space:pre-wrap}
.kws{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.kw{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--forge2);border:1px solid var(--line);color:var(--bone-dim)}
.asklab{font-family:'Big Shoulders Display';font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--y);margin-bottom:8px}
textarea{width:100%;min-height:190px;background:var(--forge);color:var(--bone);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:'Spline Sans Mono';font-size:13.5px;line-height:1.6;resize:vertical}
textarea:focus{outline:none;border-color:var(--y)}
.hint{font-size:11.5px;color:#8a7f6f;margin-top:8px;line-height:1.6}
.hint kbd{font-family:'Spline Sans Mono';font-size:10.5px;background:var(--forge2);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(20,16,14,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:20}
.frow{display:flex;align-items:center;gap:10px;padding:12px 0}
.saved{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
select{background:var(--forge);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-family:'Spline Sans Mono';font-size:11.5px;max-width:230px}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 10px}
.prog .cov{flex:1;min-width:190px;height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--forge2);border:1px solid var(--line)}
.prog .cov i{display:block;height:100%}
.prog .cov .cf{background:var(--ok)}
.prog .cov .cp{background:var(--y)}
.prog .cov .cn{background:#6B6258}
.prog .lab{font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--bone-dim);white-space:nowrap}
.prog .lab b{color:var(--ok)}
.prog .lab i{color:var(--y);font-style:normal}
.prog .lab s{color:#8a7f6f;text-decoration:none}
.done{text-align:center;padding:80px 20px}
.done h1{font-size:50px;color:var(--y)}
.pill{white-space:nowrap}
@media(max-width:640px){
  h1.title{font-size:32px}.cards{grid-template-columns:1fr}.wrap{padding:0 12px}
  .brand{font-size:17px}#count{font-size:9px;padding:2px 7px}
  /* the jump menu gets its own full-width row rather than being crushed
     to a bare chevron between the brand and the export button */
  .hrow{gap:7px;flex-wrap:wrap;padding-bottom:10px}
  select{max-width:none;flex:1 0 100%;order:5;font-size:11.5px;padding:8px}
  .btn{padding:6px 10px;font-size:11px}
}
</style></head><body>
<header><div class="wrap">
  <div class="hrow">
    <span class="brand">DAWN<em>BLADE</em></span>
    <span class="pill mono" id="count"></span>
    <span class="spacer"></span>
    <select id="jump"></select>
    <button class="btn go" id="export">Export JSON</button>
  </div></div>
  <div class="wrap"><div class="prog" id="cov"></div></div>
  <div class="bar"><i id="prog"></i></div>
</header>
<main class="wrap" id="main"></main>
<footer><div class="wrap"><div class="frow">
  <button class="btn" id="prev">← Prev</button>
  <span class="saved" id="saved">saved</span>
  <span class="spacer"></span>
  <button class="btn" id="skip">Skip</button>
  <button class="btn go" id="next">Save &amp; Next →</button>
</div></div></footer>
<script>
const DATA = [{"slug":"charge","kind":"mechanic","title":"charge","note":"RULED 2026-07-25 (spec in tools/rulings.json) — Boltyn's soul engine","status":"pending","ask":null,"followup":{"built":"Nothing. Listed here because Crow's Nest and the deck -> arsenal path belong to Azalea's reload identity rather than to the arsenal trigger itself.","stuck":"Crow's Nest: 'Whenever an arrow is put face up into your arsenal from your deck, you may pay {r}. If you do, put an aim counter on it.' The optional-cost machinery for this exists (v2.28) and the aim op exists; only the deck->arsenal move is missing.","question":"Is the deck -> arsenal path worth building for the solo trainer at all, given the dummy never uses it, or does it wait for a real Azalea pass? If it is built, does the arrow go face up immediately (visible to both players) — which is what 'face up' implies and what makes Crow's Nest's aim counter a real decision?"},"priorRuling":"So you first need to evaluate boltyn's hero ability to truly understand this - as a light hero he has a soul - players usually stack this under their hero card - cards in soul can be used for different effects - 'charging' is a mechanic defined by the official rules where you put a card from hand to soul and having done so qualifies you for bonuses on these cards.","decks":["Boltyn"],"cards":[{"name":"Roaring Beam","pitch":2,"tt":"Light Warrior Attack Reaction","cost":0,"power":null,"def":3,"kw":["Charge"],"gkw":[],"tier":"part","tx":"Create a Courage token.\nIf there are no cards in your soul, return this to its owner's hand, then charge your soul.","gaps":["If there are no cards in your soul, return this to its owner's hand, then charge your soul."],"img":"https://legendstory-production-s3-public.s3.amazonaws.com/media/cards/large/GEM129.webp","refs":["Courage"]},{"name":"V of the Vanguard","pitch":2,"tt":"Light Warrior Action - Attack","cost":1,"power":3,"def":3,"kw":["Boltyn Specialization","Charge"],"gkw":[],"tier":"part","tx":"Boltyn Specialization\nAs an additional cost to play V of the Vanguard, you may charge your hero's soul any number of times.\nAttacks on this combat chain gain +1{p} for each Light card charged this way.","gaps":["Attacks on this combat chain gain +1{p} for each Light card charged this way."],"img":"https://storage.googleapis.com/fabmaster/cardfaces/2024-ARMORY-ASB/EN/ASB023.png","refs":[]}]}];
const SEED = {"token-library":"Each player has a section on their board where tokens (and items and allies and auras) can live. If the card conditions are satisfied - put 1 copy of the specific token on the correct player's board.","arsenal-triggers":"These cards have a bonus effect if they are 'played from arsenal' - all cards that are 'arrow attack's can *only* be played from arsenal - arsenal card is 'face-down' (but you are allowed to look at it) when you set it at end of turn - other card effects and turn it face up or face down.","charge":"So you first need to evaluate boltyn's hero ability to truly understand this - as a light hero he has a soul - players usually stack this under their hero card - cards in soul can be used for different effects - 'charging' is a mechanic defined by the official rules where you put a card from hand to soul and having done so qualifies you for bonuses on these cards.","opt":"When you opt x you look at the top x cards of your deck and then you can choose to put them on the top or bottom in any order.","auras":"auras are non-attack actions - they stay in play until their specific abilities (or the ability of another card) say otherwise.","clash-payoffs":"per the official rules compare the attack value (bottom left) of each card revealed - the higher card wins the clash. the conditional effects on the card will depend on whether the player wins or not\n\nupdate - if there is a tie there is no winner","stealth":"Stealth is a unique ability that does nothing on its own - other cards check to see if an attack has stealth as a qualifier for other abilities","the-crowd-boos":"This is a unique ability to reviled heroes that synchronizes with lyath's hero ability\n\nupdate - the boo does nothing on its own - reviled is the hero/card talent and is static and doesn't change. nothing happens besides certain other abilities become active","draconic-chain":"this is when the chain really matters - when you play attack actions in a row - they stay on the chain - the first attack each turn is chain link 1 - certain cards will look for a certain chain link number. some cards will also have the addtional qualifier of requiring 'draconic chains' draconic cards say draconic next to their other typings - this is considered a 'talent' per the official rules","deck-peek":"when you are looking at the top of your deck a popup screen should appear and give the player instructions - sometimes they will have the option to put some of the cards on the bottom so a few buttons may need to be available. Make sure the player's hand is still visible below the popup","power-counters":"+1 attack power or other modification counters will sometimes be added to cards that are in play. they persist turn to turn until a card effect says otherwise.  in real life players often represent this with dice and special dice with the attack symbol are a hot item!","mark":"marking is a specific ability to arachni and assassins - having a mark does nothing on its own but is a qualifier for many other abilities.","ice-fusion":"to gain an extra effect on these cards you must reveal an ice card from your hand - if your opponent uses this effect you will get a popup with their card in it and you'll have to hit 'ok'","steam-counters":"steam counters will be added to cards that are 'in play' they persist until the card effect says otherwise. often times the abilities will remove steam counters but also they are removed at the beginning of turn. having no steam counters usually means that the item is destroyed at the end of the next turn. many of these 'steam powered' items work very similar but it is still important to read the conditions carefully.","watery-grave":"Because gravy can often play allies from the grave - they must be turned face down when they die so they can not be used infinitely. allow the player to check their own faced down cards but not their opponents\n\nupdate - gravy bones' hero ability allows you to play watery grave cards","suspense":"just like the other 'counters' these are often represented by dice and 'tick' down at the beginning of the turn. unlike steam-powered it is destroyed immediately when it has none. The effect activates when the aura is destroyed\n\nupdate - suspense always comes in with 2 counters - that number is in the rules text and is the same for every suspense card","phantasm":"phantasm is a drawback for these above rate illusionist cards - if the opponent is able to block with a card that has 6+ power - the attack is destroyed and no further blocks are needed. \n\nupdate - check the attack power - a single blocker with 6+ attack will destroy the attack - this is especially relevant for spears of surreality for example because it is destroyed the go again will not resolve and the action point will not be refunded. phantasmal haze creates a spectral shield token if you manage to 'pop' it. players in real life call 6+ power attacks 'poppers' for this reason.","transcend":"these 'trancend' cards are the cornerstone of the mystic talent identity. on the back there is a card called inner-chi - we'll have to pull it from fabrary.net - the inner chi can be used to activate the hero's hero ability\n\nupdate - the inner chi is printed literally on the back of the card in real life - when you transcend via one of these cards abilities the card is flipped over and becomes inner chi and is returned to your hand instead of going to the graveyard as it normally would upon resolution.","soul-charge":"3 of 5 now resolve generically once the soul zone + 'charged this turn' cond existed (built for the 'charge' mechanic): Raydn Duskbane, Courageous Steelhand and Valiant Thrust all just read 'if you've charged this turn, gains +3{p}' against the same hist.charged flag charge-cost cards set — no new machinery needed once that flag existed, plus a fix to the self-reference rewrite so a subtitled name ('Raydn, Duskbane') printed short ('Raydn') in its own text still normalizes to 'this'. Two remain and need genuinely new machinery, not the charge cost pattern: Halo of Illumination is an equipment ability ('Instant - {r}, destroy this: Put a card from your hand into your hero's soul. If it's a Light card, draw a card') needing a 'put a card from hand into soul' EFFECT (not an additional cost — this fires as the ability's own payload, likely a prompts.js pick with to:'soul'). Radiant Touch spends soul as part of an ACTIVATION COST ('Instant - Banish this and a card from your hero's soul: Prevent the next 2 damage...') which is the reverse direction — soul as a resource paid, not a destination — and the existing 'soulSpend' op (engine op kind already wired for spending N soul cards) may already cover the payment half; the gap is wiring destroy/banish-plus-soul as a COMBINED cost the equipment reader recognizes.","graveyard":"sometimes a card in the graveyard will be able to be played - it should appear in the hero's hand - when these cards interact with the graveyard we must show the player a pop up with their whole graveyard and they must choose a qualified card. the necro chest checks if a card has been put into the grave this turn - we may have to install a new variable on the board for gravy to check this.","aim-counters":"aim counters do nothing on their own but activate extra abilities printed on the card","action-points":"action points allow a player to play actions - the player should get a little notification each time they get +1 action points - each time a card with 'go again' resolves an action point is added.","pitch-zone":"pitched cards go to the pitch zone and stay on the player's board face up until the end of turn - when the player should be given the option to order them before putting them on the bottom of their deck","verse-counters":"same as other counters they are often represented by dice these only tick down when an attack is played, they create a runechant. it is important to note that the runechant will *not* be destroyed by the attack and will persist after the attack resolves - ready to be used","reload":"azelea *needs* to get arrows into her arsenal to attack - these reload cards assist with that - the player should get a 'reload' pop up and choose a card from their hand to put into Arsenal - but only if they don't have a card in there already","retrieve":"the 'retrieve' pop up will show all available daggers in grave - if one is selected a player will be need to pitch if they do not have 1 resource to be consumed.","meld":"These are tricky - these are 2 cards with the same cost and same pitch but different effects. the 'meld' popup will allow the player to choose 1 or both sides of the card to player - the cost must be paid for each side chosen. review the official rules.","lightning-fusion":"similar to ice fusion - fusion pop up will show the cards in hand that have the 'lightning' talent in the players hand - they choose one and the opponent will get a pop up to see it - if they are able to do so the card has an extra effect","card-look-tuff-1":"the 'look tuff' popup should give the player the option to pay 1 resource to avoid the attack power of the card being reduced by 1 - if they hit yes they will have to pitch to move forward or cancel if they do not have a resource available.","card-oasis-respite-1":"damage prevention effects are a buffer before damage is subtracted - this will have to be a little check before life is lost each time - is a prevention effect active? - this card will prevent the next 4 damage (arcane *or* physical) - it has an additional effect, if you have less life than your opponent you gain 1 life. the player should also get a popup to confirm they want to target themselves, though in a 1v1 there is no good reason they wouldn't so make it hard for them to target the opponent by mistake!","card-scar-for-a-scar-1":"this card has go again under the condition that your life is less than your opponents - go again, of course means when the card resolves you gain one action point.","card-arcane-polarity-1":"this is a card to use against arcane damage heroes like rune blade and wizard and illusionist - it is an instant so you do not need to pay an action point. it gains you 1 life unless the condition is met - to meet the condition your hero must have lost life due to arcane damage the turn the card is played","card-crucible-of-aetherweave-0":"this is a weapon that can be activated once per turn - at instant speed - for the price of 1 resource - when the player activates it the next effect they resolve that deals arcane damage does that much plus 1 - wizards will need a 'bonus arcane damage' variable that is checked before arcane damage is resolved.","card-spellfire-cloak-0":"instants can be activated without an action point - don't cost an action point - *and* can be activated whenever priority is passed to you on your opponents turn per the rules - this one can activated for no cost and adds 1 resource to your 'pool' - resource pool clears at the end of every turn. wizards often can do things on the opponents turn so this could be very useful","card-absorb-in-aether-1":"this is similar to the crucible - this adds 2 bonus arcane damage the next time arcane damage resolves.","card-fyendal-s-fighting-spirit-1":"this ability is active when the card attacks *or* is used as a defending card - first it checks if you have less life than your opponent - if you do then you gain 1 life","card-wounded-bull-1":"when this attacks it checks if you have less life than your opponent - if you do it gains +1 power and goes up to 8 power -","card-arcane-twining-3":"this is a normal 1 damage arcane damage non-attack action but it has an extra ability that is active when it is in your hand. when this card is pressed it will have to have a special popup that gives the player the choice to discard it for the alternate ability - the 'amp 1' ability give the player +1 bonus arcane damage","card-brothers-in-arms-3":"defending with this card needs to trigger a popup that gives the player the choice to pay 1 resource - if yes is pressed 1 resource will be consumed automatically or they will need to pitch or cancel - if they do it will go from 2 block value up to 4 block value","card-emeritus-scolding-3":"this has a bonus effect if played on opponent's turn - if it is your turn 2 arcane damage - if opponents turn 4 arcane damage - isylander's hero ability allows her to take advantage of this well as it can be played as an instant","card-photon-splicing-3":"this is important to note - 'any target' means we need a pop up for this card - player can select between the opposing hero and any allies they might have in play. it also has an additional ability so before that we need a pop up to choose if they play it as an action or use its instant ability and discard it to amp 1 (+1 bonus arcane)","card-sigil-of-suffering-1":"so sigil is a 0 cost defense reaction - it is not defended with in the blocking step - reaction step only - when it is played in the reaction step you deal 1 arcane damage to the hero attacking you - if they do not prevent this damage the block value of the card increases to 4","card-flying-high-3":"this gives your next attack go again and if the pitch color is blue it also gives it +1 power - it is a non-attack action so it must be played *before* you attack - it'll need to leave a 'macro' around on the player's board that activates when the player plays an attack next and is cleared if one is not played by the end of turn","card-hope-merchant-s-hood-0":"when this is equipped you will always see it next to your hand cards until you use it - it can destroy itself when you activate it and you will get a pop up that allows you to choose cards from your hand - the cards will be added to your deck and your deck will be shuffled. once you shuffle your deck you draw cards equal to the number of cards you shuffled into it","card-quick-clicks-0":"these feet have a very specific condition - you must have played the card 'nimblism' - nimblism has a lot of synergistic abilities we need nimblism to leave behind an extra 'played nimblism macro - cleared at end of turn' - when you have the macro and this is equipped then you will be able to activate it from your \"hand+extras\" section - when you do activate it it gives you a 'macro-next attack you play this turn ( could be a weapon attack) add go again to it. '","card-ravenous-rabble-1":"this creates a popup for both players - it shows the top card of the deck - if its red you attack for 4 (5 base attack printed on card -1 pitch value of top card that was just revealed) , if its yellow 3 , if its blue 2","card-put-in-context-3":"before this defense reaction is able to be activated we must check the attack power of the attack it will be defending - if the base attack power (what is printed on the actual card) is 3 or less it is able to be activated. if it is pressed but the attack is 4 or greater the player should get a pop up to quickly explain that they can't play this","dice":"kayo specialization means nothing to us - the activated ability cost an action point - once activated there will need to be a 'die roll' popup that both players see - your base intelligence becomes the result until the end of turn - your intelligence determines how many cards you draw at the end of the turn so for example if you roll a 6 you will draw 6 cards at the end of turn. there will need to be a macro that lingers and resets your intelligence after you've drawn up","crowd":"the \"crowd boos you\" doesn't mean anything on it's own - it triggers other abilities - this is the only time a crowd is referenced and isn't a significant aspect of the game.","card-mandible-claw-0":"cards in grave will have to have a 'turn added to grave' characteristic - when this card is attacked with the unread ability activates - it checks if any cards in grave that have been added this turn have 6+ power and if they do, the go again is added to the attack","card-predatory-plating-0":"this will be conditionally active if you are currently attacking or blocking with a card that has 6+ attack power. when you activate it at instant speed you will gain one resource.","card-pulping-1":"check if any cards in grave have 6+ power and were added to grave this turn - if so, add dominate to this attack","card-bear-hug-3":"this is conditionally active to be played - you must have pitched a card with 6+ attack power - pitch cards don't need an extra characteristic of 'pitched this turn' because they go to the bottom at the end of every turn. we also don't need to worry about cards ending up in the pitch zone without being pitched. so just check the pitch zone, if a card has 6+ attack - we're good to go","card-rally-the-coast-guard-3":"this has an extra ability that can be conditionally activated when it is defending - the player can discard a card and increase the defense value from 2 to 5.","card-reincarnate-3":"this has an ability that is triggered when the effect of another card causes the player to discard *this* card - it helps the player keep their deck size up by returning to the bottom of the deck *instead* of the graveyard where a discarded card would normally go.","card-run-roughshod-3":"this card is conditionally playable - it checks the grave for cards discarded this turn, then if there is one with 6+ attack this card will be able to be played. if pressed and no 6+ power card is present a pop up could be triggered.","card-smash-instinct-3":"intimidate creates a pop up that shows the opponents hand (face down) and randomly selects 1 card - that card goes to their banish zone (face down but the opponent is allowed to check it) - at the beginning of the end phase that card is returned to the opponents hand.","freeze":"this gives the opponent a pop up that allows them to pay 1 resource to avoid the negative effect of the card. if they don't pay the player gets a pop up and they can choose the arsenal or an ally - whatever they choose cannot be played or activated until the start of your next turn.","card-pyroglyphic-protection-3":"this is a card mainly to defend against rune chants - you see as each runechant deals 1 damage to you, if this is in play it would reduce the damage of each by 1 so 10 runechants popping would threaten 0 arcane damage with this in play. it is an aura so it stays in play until its effect destroys it in the beginning of your next action phase.","card-stir-the-aetherwinds-3":"this gives +1 bonus arcane damage next time you deal arcane *and* creates a macro that gives wizard non-attack action cards in your hand the ability to be played at instant speed -","card-reaping-blade-0":"this ability adds an extra step before any life can be gained - we must check if the hero gaining life has more life than their opponent - if they do the life cannot be gained and the life gain ability will 'fizzle'","card-amplify-the-arknight-1":"when this is played - check how many runechant tokens the player has on the board - reduce the cost by the number of rune chants - can't go below 0.","card-reduce-to-runechant-1":"when played check the number of rune chants in play - if there is 1 or more this card is free to play!","card-achilles-accelerator-0":"many of dashes attacks have 'boost' dash needs a 'boost counter' that resets each turn and this card can be conditionally active when boost is 1+ - when it is activated you gain +1 action point.","rust-counters":"this is a generic weapon (possibly the only one) that attacks for 4 and cost only 2 resources which is a really good rate - as a drawback you may only attack with it 3 times before it is destroyed - the rust counter mechanic helps the player track this - usually represented with a die","crank":"crank - this takes place after it enters with a steam counter - the player should get a pop up if they want to 'crank' - if they do - remove the steam counter and give the player an action point.\n\nit is destroyed at start of turn if it does not have a steam counter.\n\nbefore attacks fully resolve - if they have dealt damage to the other hero - they need to be checked for on-hit effects - boom grenade is an on-hit effect that is added to every attack until one hits - once one hits it is destroyed and deals 4 additional damage to the hero that was hit.","card-fender-bender-1":"before resolution - check the types of cards that the opponent has added on defense - count the number of separate equipment cards - this gets +1 power for each equipment the opponent defended with","card-jump-start-1":"Hyper Driver - is an item card in the deck - having one in play gives this card an extra effect - the cost is reduced by one - when it is played you need to check if there is a hyper driver on the player's board - if there is a hyper driver in play jump start only cost 1 to play.","card-out-pace-1":"when this card is the active chain link - and the opponent is given the chance to add defending cards, we must restrict them from being able to add equipment cards per this ability.","card-overblast-1":"this goes back to dash's 'boost counter' each turn will need a boost counter starting at 0 to keep track of how many times attacks have boosted - this card checks the 'boost count' and adds +1 power for each boost.","card-rev-up-1":"Check board if card 'Hyper Driver' (in any color) is in play - if so - when played it 2 resources are required (instead of 3)","card-under-loop-1":"on hit effect - check if card did damage before it is resolved - if so, remove if from play and put it on the bottom of the players deck - this does not collapse the combat chain - on a side note here I remembered an important function of the chain - when an equipment is added to the chain as a defending card, it cannot be defended with again until the chain is broken.","card-jump-start-2":"when this card is played check the player's board for a hyper driver - if one is present reduce the cost by 1 - it goes from 2 to 1.","card-jump-start-3":"when this card is played - before the player pitches for it - check the player's board for a hyper driver - if one is present reduce the cost by 1 - it goes from 2 to 1.","card-pummel-1":"pummel can target a club/hammer weapon attack *0r* an attack action card - either way it gives +4 power - but for attack action cards it has an extra ability, an on hit effect is added - if the 'pummel'd attack hits, the opponent gets a pop-up and must choose one of their cards in hand to be discarded.","card-staunch-response-1":"when you play staunch response you get a pop up - it gives you the option to pay 4 additional resources, if you select yes, resources will be consumed and the player will have to pitch if additional resources are required - if they do, the defense value increases from 7 to 10 .","heave":"Heave 3 is active when thunder quake is in your hand at the end of turn - instead of putting it into your arsenal as normal, the player will get a popup and have the option to pay 3 resources - if they do - add 3 seismic surge tokens to their board.","card-bolt-n-boots-0":"this card is active in the player's reaction step - it cost 1 resource to activate and destroys itself as an additional cost - once activated the player must choose a target but is restricted to an arrow attack that has had it's base power (the number printed on the card) increased by the effects of other cards or +1 counters for example. once the price is paid and a valid target is selected - add 'go again' to the targeted attack. (multiple instances of go again are redundant so make sure 'go again' only resolves if the attack didn't already go-again.","piercing":"before this resolves check the types of the opp's defending cards - if an equipment is defending this add 1 attack power to it.","card-refraction-bolters-0":"on hit effect - player gets a pop up each time they hit with this card in play - if they choose to activate it (the cost is that the legs will destroy themselves) - then 'go again' is added to the weapon attack that dealt damage","card-blood-scent-0":"this ability is conditionally active - it becomes available after the player play's a 'crouching tiger' - the cost is the chest destroying itself - 1 resource is added to the player's pool.","card-double-cross-strap-0":"this ability is conditionally active - check the turn's active combat chain - count the number of attacks that 'have hit' - if the count is 2+ this ability becomes available - at instant speed it destroys itself and adds 1 resource to the players's pool.","card-pouncing-paws-0":"if you haven't already - we need to pull the 'crouching tiger' card from fabrary and associate it with this card - it is much like a token but it is an attack that goes in hand or in this case banish - the crouching tiger card can be attacked with from banish until the end of turn. \n\nactivate pouncing paws at instant - it destroys itself as the cost - add 1 crouching tiger card to the player's banish zone - it may be played this turn only.","card-rune-flash-1":"cost reduction effect - when the player plays this check the number of 'runechant's they have on their board - this cost 2/1/0 to play instead of 3 if they have 1/2/3 runechants in play.","card-fire-that-burns-within-1":"THIS NEEDS TO CREATE A POPUP WHEN IT IS PLAYED AS AN ATTACKING CARD - CHECK PLAYERS HAND FOR CARDS NAMED 'PHOENIX FLAME' AND ALLOW THEM TO SELECT 1 - IF THEY DO - PLAYER DRAWS A CARD AND ATTACK POWER OF 'FIRE THAT BURNS WITHIN' IS INCREASED BY 2 FROM 2 TO 4.","card-flamecall-awakening-1":"CONDITIONAL EXTRA EFFECT - REVIEW LOG FOR CARDS PLAYED THIS TURN AND CHECK IF ANY HAVE 'RED' (1) PITCH - IF SO , PLAYER GETS A POP UP - ENTIRE REMAINING DECK REVEALED TO PLAYER ONLY - 1 'PHOENIX FLAME' CAN BE SELECTED - ONCE CONFIRMED ADD THE PHOENIX FLAME TO PLAYERS HAND - shuffle player's deck.","card-wax-on-1":"EXTRA CONDITIONAL EFFECT - CHECK THE COST OF THE ATTACKING CARD ON THE CHAIN LINK - IF IT IS 0 , INCREASE DEFENSE FROM 3 TO 5.","cloaked":"CLOAKED - EQUIPPED FACE DOWN - SHOW CARD BACK ON THE PLAYERS BOARD\n\nINSTANT ABILITY - ALWAYS ACTIVE - COST 1 RESOURCE - POP UP - SHOW AURAS IN PLAY - SELECT 1 - ADD A +1 ATTACK POWER COUNTER TO IT","overpower":"EXTRA CONDITIONAL ABILITY WHEN PLAYED - CHECK BOARD FOR 'SPECTRAL SHIELD' - IF YES ADD OVERPOWER TO SPECTRAL RIDER","card-danger-digits-0":"active in the reaction step - destroys itself as cost - pop up - check if the attacking card on the chainlink is a dagger if so only display a dagger if the player has another equipped. otherwise, show both of the player's equipped daggers and allow them to choose 1. deal 1 damage to opponent - as long as the damage is not prevented, trigger any 'on hit effect' the dagger has. destroy the dagger.","card-stalker-s-steps-0":"active in reaction step - destroys itself as cost - check if the attacking card has 'stealth' if it does add go again to the attack.","card-topsy-turvy-0":"ALWAYS ACTIVE - INSTANT - COST DESTROYS ITSELF - CHAOTIC - ADDS MACRO THAT CHECKS EVERY ABILITY THAT RESOLVES - WE WILL PROBABLY HAVE TO FIND EVERY CARD THIS POTENTIALLY INTERACTS WITH OVER TIME BUT DO YOUR BEST TO FIND ALL INSTANCES OF A CARD BEING PUT ON TOP OF THE DECK AND CREATE THE MACRO THAT PUTS IT ON THE BOTTOM INSTEAD - STAYS UNTIL END OF TURN","card-den-of-the-spider-1":"EXTRA CONDITIONAL ABILITY - CHECK PRINTED ATTACK POWER ON ATTACKING CARD AND CHECK EFFECTIVE ATTACK POWER OF ATTACKING CARD , IF THE LATTER IS GREATER - ADD MARK TO OPPONENT","card-lair-of-the-spider-1":"CONDITIONAL EXTRA ABILITY ON DEFENSE - CHECK ATTACKING CARD FOR 'GO AGAIN' - IF PRESENT, ADD MARK TO OPPONENT","card-mark-of-the-black-widow-1":"CONDITIONAL ON HIT ABILITY - CHECK FOR 'MARK' ON OPPONENT - IF PRESENT OPP GETS POP-UP - SELECT CARD FROM HAND - MOVE IT TO OPPONENT BANISH ZONE","card-orb-weaver-spinneret-1":"CONDITIONAL EXTRA ABILITY - CHECK FOR OPEN EQUIPMENT SLOT - IF YES , CREATE 'GRAPHENE CHELICERA' TOKEN AND ADD IT TO OPEN EQUIPMENT SLOT.","card-stains-of-the-redback-1":"conditional cost reduction ability - check opponent for 'mark' - if yes cost reduced from 1 to 0","card-two-sides-to-the-blade-1":"this is the same structure as pummel - start by adding 3 attack power to the attacking card - then there is an extra conditional ability - check attacking card type - if 'attack action' then add on-hit effect - check if opponent has mark, if not add 'mark'","card-mark-of-the-black-widow-3":"CONDITIONAL ON HIT EFFECT - CHECK IF OPPONENT HAS 'MARK' - IF YES THEY GET A POP-UP - SHOW CARDS IN THEIR HAND - THEY MUST SELECT ONE - MOVE IT TO THEIR BANISH ZONE","card-night-s-embrace-3":"ADD MACRO - CHECK EVERY ATTACK FOR 'STEALTH' ONCE - IF YES - ADD +1 ATTACK POWER - GOES AWAY AT END OF TURN","card-reaper-s-call-3":"EXTRA INSTANT ABILITY ACTIVE FROM HAND - COST DISCARDS ITSELF - ADD MARK TO OPPONENT","card-shred-3":"PLAYER GETS CONDITIONAL POPUP - CHECK ATTACKING CARD TYPE FOR 'ASSASSIN' - IF YES - SHOW ALL DEFENDING CARDS ON ACTIVE CHAIN LINK IN POP UP - PLAYER SELECTS 1 AND ITS DEFENSE VALUE IS REDUCED BY 2.","card-cindering-foresight-1":"EFFECTIVE CARD TYPE CONDITIONALLY CHANGED - ON OPPONENT'S TURN BECOMES AN INSTANT - CAN BE PLAYED DURING PRIORITY WINDOW WITHOUT ACTION POINT.","card-snapback-1":"EFFECTIVE CARD TYPE CONDITIONALLY CHANGED - CHECK LOG FOR PLAYED CARDS - CHECK TYPES FOR 'ACTION' & NOT 'ATTACK' - DEFINED NON-ATTACK ACTION - IF YES - BECOMES 'INSTANT'","card-cindering-foresight-2":"EFFECTIVE CARD TYPE CONDITIONALLY CHANGED - ON OPPONENT'S TURN BECOMES AN 'INSTANT' (gains properties of an instant)","card-cindering-foresight-3":"EFFECTIVE CARD TYPE CONDITIONALLY CHANGED - ON OPPONENT'S TURN BECOMES AN 'INSTANT' (gains properties of an instant)","sharpen":"POP UP - SHOW EQUIPPED WEAPONS - CHOOSE 1 - ADD +1 ATTACK POWER COUNTER - ADD 'AT END OF TURN, REMOVE ALL +1 ATTACK POWER COUNTERS\n\nEXTRA CONDITIONAL ABILITY - CHECK SELECTED SWORD FOR +1 ATTACK POWER COUNTER - IF YES 'CREATE' FLURRY TOKEN AND ADD IT TO PLAYER'S BOARD","card-star-fall-0":"CONDITIONAL EXTRA ABILITY - CHECK PLAYED CARDS IN LOG - CHECK TYPES FOR 'LIGHTNING' - IF YES - INCREASE POWER FROM 1 TO 2 AND ADD 'GO AGAIN'","steal":"CONDITIONAL EXTRA ABILITY - CHECK GRAVEYARD FOR 'NIMBLISM' - IF YES - POPUP : SHOW ALL NIMBLISM IN GRAVEYARD - PLAYER SELECTS 1 - MOVE IT TO BANISH ZONE - ADD 1 ATTACK POWER - ADD 'GO AGAIN' \n\nON HIT EFFECT - CHAOTIC! - CHECK OPPONENTS BOARD FOR 'ALLY' IF YES - POP UP : SELECT ALLY FROM OPPONENT'S BOARD - UNTAP ALLY (IF TAPPED) - MOVE ALLY FROM OPPONENT'S BOARD TO YOUR BOARD - ADD MACRO : RETURN THE ALLY TO OPPONENT AT END OF ACTION PHASE.","card-path-of-same-ends-1":"EXTRA EFFECT ON ATTACK - DEAL 1 ARCANE DAMAGE TO OPPONENT - CONDITIONAL ADDITIONAL EFFECT - CHECK LOG IF ARCANE DAMAGE FROM PATH OF SAME ENDS WAS PREVENTED - IF NO - ADD 'GO AGAIN'","fusion":"CR: '[SUPERTYPES] Fusion' means 'as an additional cost to play this, you may reveal a [SUPERTYPES] card from your hand' — nothing moves zones (a reveal, not a spend), so unlike Charge there is no real strategic reason to decline, and the engine auto-fuses whenever a qualifying card (matched by type-line word, e.g. 'ice'/'lightning' in card.tt) is in hand. Read generically: the bare 'X Fusion' / 'X and Y Fusion' / 'X and/or Y Fusion' line hoists fx.fusionCost (paragraph-scanned, same layout rule as a standalone Go again line); riders read as cond 'fused' via classifyClause's if/when handler. A compound gate ('...was fused AND deals damage to a hero') is read as one unit and routes through the condOnHit dispatcher built for Charge, so it only fires when the attack actually connects. 6 cards now resolve: Aether Icevein (x3 pitches) and Polar Cap resolve via PRE-EXISTING ops (foeDiscard already ignores the 'unless they pay' escape, which is faithful because the dummy never pays optional costs anyway; frostbite-token creation was already a deliberate noop since the dummy has no action phase to tax) reached through the new fused/condOnHit gate; Entwine Lightning and Arcanic Shockwave are newly wired end to end (conditional go-again, conditional arcane damage). Two remain and need more than the fusion cost pattern itself: Brain Freeze's rider targets the OPPONENT's revealed hand for a pick-and-deck-top ('put an action card with cost 0 from their hand on top of their deck') which needs prompts.js's reveal/pick wired to the foe's hand as source; Ice Eternal's rider is a DYNAMIC arcane amount ('deal arcane damage equal to the number of Frostbites they control') which needs a new op that reads the target's frostbite counter at resolution rather than a fixed number.","card-carrion-crown-0":"CONDITIONAL ACTIVATION 'ACTION' - CHECK HAND FOR ALLY - IF YES - CAN BE ACTIVATED - DESTROYS SELF AS COST - PLAYER GETS POPUP : SELECT ALLY CARD FROM HAND - PLAYER DRAWS CARD. GO AGAIN.","card-scuttle-toes-0":"CONDITIONALLY ACTIVE INSTANT - CHECK IF ALLY IN PLAY - IF YES - IS ACTIVE COST 2 RESOURCES - DESTROYS SELF AS COST - POPUP: SELECT ALLY - UNTAP THE SELECTED ALLY - ADD MACRO - DESTROY THE ALLY AT END OF TURN","card-washed-up-wave-0":"EXTRA ABILITY ON DEFENSE - POPUP: PLAYER SELECTS BETWEEN TOP CARD OF DECK (FACEDOWN) AND A CARD IN THEIR HAND - CHECK IF THE DISCARDED CARD HAS 'WATERY GRAVE' - IF YES - ADD 2 DEFENSE","card-saltwater-swell-1":"EXTRA ABILITY ON ATTACK - POPUP FOR BOTH PLAYER AND OPPONENT : SHOW TOP CARD OF PLAYERS DECK - CHECK IF IT IS BLUE - IF YES MOVE IT TO THE PITCH ZONE - ADD 3 RESOURCES TO PLAYER -","card-jittery-bones-3":"EXTRA ABILITY ON ATTACK - POPUP: PLAYER SELECTS BETWEEN TOP CARD OF DECK (FACEDOWN) AND A CARD IN THEIR HAND - CHECK IF THE DISCARDED CARD HAS 'WATERY GRAVE' - IF YES - ADD GO AGAIN","card-saltwater-swell-3":"EXTRA ABILITY ON ATTACK - POPUP FOR BOTH PLAYER AND OPPONENT : SHOW TOP CARD OF PLAYERS DECK - CHECK IF IT IS BLUE - IF YES MOVE IT TO THE PITCH ZONE - ADD 3 RESOURCES TO PLAYER -","card-throw-caution-to-the-wind-3":"POPUP TO PLAYER & OPPONENT : REVEAL TOP CARD OF PLAYER'S DECK - CHECK PITCH VALUE OF CARD - ADD 1/2/3 DAMAGE PREVENTION (CLEARS AT END OF TURN)","card-line-crossers-0":"EXTRA EFFECT - CHAOS! - CARDS THAT COMPARE LIFE NEED TO BE FLAGGED TO CHECK IF THIS IS IN PLAY - IF IT IS - AND THE RESULTING COMPARISON IS A TIE - THE ABILITY WILL STILL TRIGGER AS THOUGH THE REQUIRED OUTCOME HAD BEEN MET","high-tide":"If there are 2 or more blue (pitch-3) cards in your pitch zone, the attack gains go again. Read generically as a named-keyword-gated condition, same shape as Reprise: classifyClause matches 'High Tide - If there are N or more blue cards in your pitch zone, <effect>' and stores the threshold N in the cond name (pitchBlueN) so a future card with a different N reads correctly. Wired in index.html's execute() cond switch against act(n).pitch.filter(c=>c.pitch===3).length.","surge":"If this deals more than its own printed damage, it gains go again. Amp (the parser's own 'amp' op / bonus-arcane-pool mechanic) is the only thing in this pool that can push a non-attack arcane effect above its printed base, so 'did this deal more than base' reduces to 'is an Amp bonus live right now', checked before the arcane op consumes it. classifyClause captures the printed N into cond surgeOverN for future cards; wired in index.html's execute() cond switch as act(n).amp>0."};

const PRIOR = {"token-library":{"at":"2026-07-25","mechanic":"token library","status":"unmodelled","cards":["High Pitched Howl (1)","Agile Windup (3)","Magmatic Carapace (0)","Crash and Bash (1)","Agile Engagement (1)","Lead with Speed (1)","Goblet of Bloodrun Wine (3)","Waning Vengeance (1)","Frailty Trap (1)","Inertia Trap (1)","Turn to Mindfire (1)","Flat Trackers (0)","Toe the Line (1)","Golden Tipple (1)","Golden Tipple (2)","Golden Tipple (3)","Loot the Arsenal (3)","Loot the Hold (3)","Portside Exchange (3)","Stand Strong (0)","Full of Bravado (3)"],"ruling":"Each player has a section on their board where tokens (and items and allies and auras) can live. If the card conditions are satisfied - put 1 copy of the specific token on the correct player's board."},"arsenal-triggers":{"at":"2026-07-25","mechanic":"arsenal triggers","status":"unmodelled","cards":["Fault Line (1)","Bull's Eye Bracers (0)","Death Dealer (0)","Call in the Big Guns (1)","Dry Powder Shot (1)","Entangling Shot (1)","Swift Shot (1)","Wreck Havoc (1)","Springboard Somersault (2)","Unmovable (1)","Unmovable (3)","Concoct Disorder (1)","Lightning Surge (1)","Power Play (3)"],"ruling":"These cards have a bonus effect if they are 'played from arsenal' - all cards that are 'arrow attack's can *only* be played from arsenal - arsenal card is 'face-down' (but you are allowed to look at it) when you set it at end of turn - other card effects and turn it face up or face down."},"charge":{"at":"2026-07-25","mechanic":"charge","status":"pending","cards":["Beaming Bravado (1)","Bolt of Courage (1)","Engulfing Light (1)","Light the Way (1)","Take Flight (1)","Beaming Bravado (2)","Bolt of Courage (2)","Engulfing Light (2)","Light the Way (2)","Roaring Beam (2)","Take Flight (2)","V of the Vanguard (2)"],"ruling":"So you first need to evaluate boltyn's hero ability to truly understand this - as a light hero he has a soul - players usually stack this under their hero card - cards in soul can be used for different effects - 'charging' is a mechanic defined by the official rules where you put a card from hand to soul and having done so qualifies you for bonuses on these cards."},"opt":{"at":"2026-07-25","mechanic":"opt","status":"unreviewed","cards":["Read the Glide Path (1)","Ridge Rider Shot (1)","Aether Spindle (1)","Cindering Foresight (1)","Whisper of the Oracle (1)","Cindering Foresight (2)","Whisper of the Oracle (2)","Aether Spindle (3)","Cindering Foresight (3)","Whisper of the Oracle (3)"],"ruling":"When you opt x you look at the top x cards of your deck and then you can choose to put them on the top or bottom in any order."},"auras":{"at":"2026-07-25","mechanic":"auras","status":"unmodelled","cards":["Beckoning Haunt (0)","Condemn to Slaughter (1)","Hit the High Notes (1)","Runerager Swarm (1)","Runic Fellingsong (1)","Shrill of Skullform (1)","Shrill of Skullform (2)","Condemn to Slaughter (3)","Shrill of Skullform (3)","Sigil of Silphidae (3)"],"ruling":"auras are non-attack actions - they stay in play until their specific abilities (or the ability of another card) say otherwise."},"clash-payoffs":{"at":"2026-07-25","mechanic":"clash payoffs","status":"unmodelled","cards":["Clash of Agility (1)","Clash of Might (1)","Test of Might (1)","Clash of Might (2)","Unexpected Backhand (3)","Clash of Vigor (3)","Test of Strength (1)","Stonewall Impasse (0)"],"ruling":"per the official rules compare the attack value (bottom left) of each card revealed - the higher card wins the clash. the conditional effects on the card will depend on whether the player wins or not\n\nupdate - if there is a tie there is no winner"},"stealth":{"at":"2026-07-25","mechanic":"stealth","status":"unreviewed","cards":["Art of Desire: Body (1)","Infect (1)","Mark of the Black Widow (1)","Mark of the Funnel Web (1)","Mark the Prey (1)","Art of Desire: Mind (3)","Mark of the Black Widow (3)","Reaper's Call (3)"],"ruling":"Stealth is a unique ability that does nothing on its own - other cards check to see if an attack has stealth as a qualifier for other abilities"},"the-crowd-boos":{"at":"2026-07-25","mechanic":"the crowd boos","status":"unreviewed","cards":["Mocking Blow (1)","Prime the Crowd (1)","Villainous Pose (1)","Mocking Blow (2)","Booze! (3)","Concealed Object (3)","Goon Beatdown (3)","Mocking Blow (3)"],"ruling":"This is a unique ability to reviled heroes that synchronizes with lyath's hero ability\n\nupdate - the boo does nothing on its own - reviled is the hero/card talent and is static and doesn't change. nothing happens besides certain other abilities become active"},"draconic-chain":{"at":"2026-07-25","mechanic":"draconic chain","status":"unmodelled","cards":["Searing Emberblade (0)","Display Loyalty (1)","Enflame the Firebrand (1)","Mounting Anger (1)","Phoenix Flame (1)","Rising Resentment (1)","Cinderskin Devotion (3)"],"ruling":"this is when the chain really matters - when you play attack actions in a row - they stay on the chain - the first attack each turn is chain link 1 - certain cards will look for a certain chain link number. some cards will also have the addtional qualifier of requiring 'draconic chains' draconic cards say draconic next to their other typings - this is considered a 'talent' per the official rules"},"deck-peek":{"at":"2026-07-25","mechanic":"deck peek","status":"unmodelled","cards":["On the Horizon (1)","Talismanic Lens (0)","Scout the Periphery (1)","Spire Sniping (2)","Seeker's Mitts (0)","Compass of Sunken Depths (0)"],"ruling":"when you are looking at the top of your deck a popup screen should appear and give the player instructions - sometimes they will have the option to put some of the cards on the bottom so a few buttons may need to be available. Make sure the player's hand is still visible below the popup"},"power-counters":{"at":"2026-07-25","mechanic":"power counters","status":"unmodelled","cards":["Dawnblade (0)","Cosmo, Scroll of Ancestral Tapestry (0)","Astral Etchings (1)","Spectral Manifestations (1)","Waxing Specter (1)","Glisten (1)"],"ruling":"+1 attack power or other modification counters will sometimes be added to cards that are in play. they persist turn to turn until a card effect says otherwise.  in real life players often represent this with dice and special dice with the attack symbol are a hot item!"},"mark":{"at":"2026-07-25","mechanic":"mark","status":"unreviewed","cards":["Hot on Their Heels (1)","Mark of the Huntsman (0)","Den of the Spider (1)","Lair of the Spider (1)","Mark the Prey (1)","Two Sides to the Blade (1)"],"ruling":"marking is a specific ability to arachni and assassins - having a mark does nothing on its own but is a qualifier for many other abilities."},"ice-fusion":{"at":"2026-07-25","mechanic":"ice fusion","status":"unreviewed","cards":["Aether Icevein (1)","Polar Cap (1)","Aether Icevein (2)","Aether Icevein (3)","Brain Freeze (3)","Ice Eternal (3)"],"ruling":"to gain an extra effect on these cards you must reveal an ice card from your hand - if your opponent uses this effect you will get a popup with their card in it and you'll have to hit 'ok'"},"steam-counters":{"at":"2026-07-25","mechanic":"steam counters","status":"unmodelled","cards":["Plasma Barrel Shot (0)","Crankshaft (1)","Hyper Driver (1)","Re-Charge! (1)","Big Bertha (3)","Crankshaft (3)"],"ruling":"steam counters will be added to cards that are 'in play' they persist until the card effect says otherwise. often times the abilities will remove steam counters but also they are removed at the beginning of turn. having no steam counters usually means that the item is destroyed at the end of the next turn. many of these 'steam powered' items work very similar but it is still important to read the conditions carefully."},"watery-grave":{"at":"2026-07-25","mechanic":"watery grave","status":"unreviewed","cards":["Barnacle (2)","Cutty Shark, Quick Clip (2)","Limpit, Hop-a-long (2)","Oysten, Heart of Gold (2)","Riggermortis (2)","Swabbie (2)"],"ruling":"Because gravy can often play allies from the grave - they must be turned face down when they die so they can not be used infinitely. allow the player to check their own faced down cards but not their opponents\n\nupdate - gravy bones' hero ability allows you to play watery grave cards"},"suspense":{"at":"2026-07-25","mechanic":"suspense","status":"unreviewed","cards":["Edge of Their Seats (3)","The Suspense is Killing Me (3)","Act of Glory (1)","Edge of Their Seats (1)","Tension in the Air (1)"],"ruling":"just like the other 'counters' these are often represented by dice and 'tick' down at the beginning of the turn. unlike steam-powered it is destroyed immediately when it has none. The effect activates when the aura is destroyed\n\nupdate - suspense always comes in with 2 counters - that number is in the rules text and is the same for every suspense card"},"phantasm":{"at":"2026-07-25","mechanic":"phantasm","status":"unreviewed","cards":["Enigma Chimera (1)","Enigma Chimera (2)","Phantasmal Haze (3)","Spears of Surreality (3)","Spectral Rider (3)"],"ruling":"phantasm is a drawback for these above rate illusionist cards - if the opponent is able to block with a card that has 6+ power - the attack is destroyed and no further blocks are needed. \n\nupdate - check the attack power - a single blocker with 6+ attack will destroy the attack - this is especially relevant for spears of surreality for example because it is destroyed the go again will not resolve and the action point will not be refunded. phantasmal haze creates a spectral shield token if you manage to 'pop' it. players in real life call 6+ power attacks 'poppers' for this reason."},"transcend":{"at":"2026-07-25","mechanic":"transcend","status":"unreviewed","cards":["A Drop in the Ocean (3)","Homage to Ancestors (3)","Pass Over (3)","Preserve Tradition (3)","Rising Sun, Setting Moon (3)"],"ruling":"these 'trancend' cards are the cornerstone of the mystic talent identity. on the back there is a card called inner-chi - we'll have to pull it from fabrary.net - the inner chi can be used to activate the hero's hero ability\n\nupdate - the inner chi is printed literally on the back of the card in real life - when you transcend via one of these cards abilities the card is flipped over and becomes inner chi and is returned to your hand instead of going to the graveyard as it normally would upon resolution."},"soul-charge":{"at":"2026-08-01","mechanic":"soul charge","status":"unmodelled","cards":["Halo of Illumination (0)","Radiant Touch (0)"],"ruling":"3 of 5 now resolve generically once the soul zone + 'charged this turn' cond existed (built for the 'charge' mechanic): Raydn Duskbane, Courageous Steelhand and Valiant Thrust all just read 'if you've charged this turn, gains +3{p}' against the same hist.charged flag charge-cost cards set — no new machinery needed once that flag existed, plus a fix to the self-reference rewrite so a subtitled name ('Raydn, Duskbane') printed short ('Raydn') in its own text still normalizes to 'this'. Two remain and need genuinely new machinery, not the charge cost pattern: Halo of Illumination is an equipment ability ('Instant - {r}, destroy this: Put a card from your hand into your hero's soul. If it's a Light card, draw a card') needing a 'put a card from hand into soul' EFFECT (not an additional cost — this fires as the ability's own payload, likely a prompts.js pick with to:'soul'). Radiant Touch spends soul as part of an ACTIVATION COST ('Instant - Banish this and a card from your hero's soul: Prevent the next 2 damage...') which is the reverse direction — soul as a resource paid, not a destination — and the existing 'soulSpend' op (engine op kind already wired for spending N soul cards) may already cover the payment half; the gap is wiring destroy/banish-plus-soul as a COMBINED cost the equipment reader recognizes."},"graveyard":{"at":"2026-07-25","mechanic":"graveyard","status":"unmodelled","cards":["Crown of Dichotomy (0)","Memorial Ground (2)","Rise from the Ashes (1)","Mournful Casket (0)"],"ruling":"sometimes a card in the graveyard will be able to be played - it should appear in the hero's hand - when these cards interact with the graveyard we must show the player a pop up with their whole graveyard and they must choose a qualified card. the necro chest checks if a card has been put into the grave this turn - we may have to install a new variable on the board for gravy to check this."},"aim-counters":{"at":"2026-07-25","mechanic":"aim counters","status":"unmodelled","cards":["Crow's Nest (0)","Infecting Shot (1)","Murkmire Grapnel (1)","Infecting Shot (2)"],"ruling":"aim counters do nothing on their own but activate extra abilities printed on the card"},"action-points":{"at":"2026-07-25","mechanic":"action points","status":"unmodelled","cards":["Beaten Trackers (0)","Silent Stilettos (0)","Back Alley Breakline (3)"],"ruling":"action points allow a player to play actions - the player should get a little notification each time they get +1 action points - each time a card with 'go again' resolves an action point is added."},"pitch-zone":{"at":"2026-07-25","mechanic":"pitch zone","status":"unmodelled","cards":["Rough Up (1)","Titan's Fist (0)","Zealous Belting (1)"],"ruling":"pitched cards go to the pitch zone and stay on the player's board face up until the end of turn - when the player should be given the option to order them before putting them on the bottom of their deck"},"verse-counters":{"at":"2026-07-25","mechanic":"verse counters","status":"unmodelled","cards":["Malefic Incantation (1)","Malefic Incantation (2)"],"ruling":"same as other counters they are often represented by dice these only tick down when an attack is played, they create a runechant. it is important to note that the runechant will *not* be destroyed by the attack and will persist after the attack resolves - ready to be used"},"reload":{"at":"2026-07-25","mechanic":"reload","status":"pending","cards":["Bolt'n' Shot (1)","Take Aim (1)"],"ruling":"azelea *needs* to get arrows into her arsenal to attack - these reload cards assist with that - the player should get a 'reload' pop up and choose a card from their hand to put into Arsenal - but only if they don't have a card in there already"},"retrieve":{"at":"2026-07-25","mechanic":"retrieve","status":"unreviewed","cards":["Pick Up the Point (1)","Up Sticks and Run (1)"],"ruling":"the 'retrieve' pop up will show all available daggers in grave - if one is selected a player will be need to pitch if they do not have 1 resource to be consumed."},"meld":{"at":"2026-07-25","mechanic":"meld","status":"unreviewed","cards":["Arcane Seeds // Life (1)","Burn Up // Shock (1)"],"ruling":"These are tricky - these are 2 cards with the same cost and same pitch but different effects. the 'meld' popup will allow the player to choose 1 or both sides of the card to player - the cost must be paid for each side chosen. review the official rules."},"lightning-fusion":{"at":"2026-07-25","mechanic":"lightning fusion","status":"unreviewed","cards":["Arcanic Shockwave (1)","Entwine Lightning (1)"],"ruling":"similar to ice fusion - fusion pop up will show the cards in hand that have the 'lightning' talent in the players hand - they choose one and the opponent will get a pop up to see it - if they are able to do so the card has an extra effect"},"card-look-tuff-1":{"at":"2026-07-25","mechanic":"Look Tuff · pitch 1","status":"one-off","cards":["Look Tuff (1)"],"ruling":"the 'look tuff' popup should give the player the option to pay 1 resource to avoid the attack power of the card being reduced by 1 - if they hit yes they will have to pitch to move forward or cancel if they do not have a resource available."},"card-oasis-respite-1":{"at":"2026-07-25","mechanic":"Oasis Respite · pitch 1","status":"one-off","cards":["Oasis Respite (1)"],"ruling":"damage prevention effects are a buffer before damage is subtracted - this will have to be a little check before life is lost each time - is a prevention effect active? - this card will prevent the next 4 damage (arcane *or* physical) - it has an additional effect, if you have less life than your opponent you gain 1 life. the player should also get a popup to confirm they want to target themselves, though in a 1v1 there is no good reason they wouldn't so make it hard for them to target the opponent by mistake!"},"card-scar-for-a-scar-1":{"at":"2026-07-25","mechanic":"Scar for a Scar · pitch 1","status":"one-off","cards":["Scar for a Scar (1)"],"ruling":"this card has go again under the condition that your life is less than your opponents - go again, of course means when the card resolves you gain one action point."},"card-arcane-polarity-1":{"at":"2026-07-25","mechanic":"Arcane Polarity · pitch 1","status":"one-off","cards":["Arcane Polarity (1)"],"ruling":"this is a card to use against arcane damage heroes like rune blade and wizard and illusionist - it is an instant so you do not need to pay an action point. it gains you 1 life unless the condition is met - to meet the condition your hero must have lost life due to arcane damage the turn the card is played"},"card-crucible-of-aetherweave-0":{"at":"2026-07-25","mechanic":"Crucible of Aetherweave · pitch 0","status":"one-off","cards":["Crucible of Aetherweave (0)"],"ruling":"this is a weapon that can be activated once per turn - at instant speed - for the price of 1 resource - when the player activates it the next effect they resolve that deals arcane damage does that much plus 1 - wizards will need a 'bonus arcane damage' variable that is checked before arcane damage is resolved."},"card-spellfire-cloak-0":{"at":"2026-07-25","mechanic":"Spellfire Cloak · pitch 0","status":"one-off","cards":["Spellfire Cloak (0)"],"ruling":"instants can be activated without an action point - don't cost an action point - *and* can be activated whenever priority is passed to you on your opponents turn per the rules - this one can activated for no cost and adds 1 resource to your 'pool' - resource pool clears at the end of every turn. wizards often can do things on the opponents turn so this could be very useful"},"card-absorb-in-aether-1":{"at":"2026-07-25","mechanic":"Absorb in Aether · pitch 1","status":"one-off","cards":["Absorb in Aether (1)"],"ruling":"this is similar to the crucible - this adds 2 bonus arcane damage the next time arcane damage resolves."},"card-fyendal-s-fighting-spirit-1":{"at":"2026-07-25","mechanic":"Fyendal's Fighting Spirit · pitch 1","status":"one-off","cards":["Fyendal's Fighting Spirit (1)"],"ruling":"this ability is active when the card attacks *or* is used as a defending card - first it checks if you have less life than your opponent - if you do then you gain 1 life"},"card-wounded-bull-1":{"at":"2026-07-25","mechanic":"Wounded Bull · pitch 1","status":"one-off","cards":["Wounded Bull (1)"],"ruling":"when this attacks it checks if you have less life than your opponent - if you do it gains +1 power and goes up to 8 power -"},"card-arcane-twining-3":{"at":"2026-07-25","mechanic":"Arcane Twining · pitch 3","status":"one-off","cards":["Arcane Twining (3)"],"ruling":"this is a normal 1 damage arcane damage non-attack action but it has an extra ability that is active when it is in your hand. when this card is pressed it will have to have a special popup that gives the player the choice to discard it for the alternate ability - the 'amp 1' ability give the player +1 bonus arcane damage"},"card-brothers-in-arms-3":{"at":"2026-07-25","mechanic":"Brothers in Arms · pitch 3","status":"one-off","cards":["Brothers in Arms (3)"],"ruling":"defending with this card needs to trigger a popup that gives the player the choice to pay 1 resource - if yes is pressed 1 resource will be consumed automatically or they will need to pitch or cancel - if they do it will go from 2 block value up to 4 block value"},"card-emeritus-scolding-3":{"at":"2026-07-25","mechanic":"Emeritus Scolding · pitch 3","status":"one-off","cards":["Emeritus Scolding (3)"],"ruling":"this has a bonus effect if played on opponent's turn - if it is your turn 2 arcane damage - if opponents turn 4 arcane damage - isylander's hero ability allows her to take advantage of this well as it can be played as an instant"},"card-photon-splicing-3":{"at":"2026-07-25","mechanic":"Photon Splicing · pitch 3","status":"one-off","cards":["Photon Splicing (3)"],"ruling":"this is important to note - 'any target' means we need a pop up for this card - player can select between the opposing hero and any allies they might have in play. it also has an additional ability so before that we need a pop up to choose if they play it as an action or use its instant ability and discard it to amp 1 (+1 bonus arcane)"},"card-sigil-of-suffering-1":{"at":"2026-07-25","mechanic":"Sigil of Suffering · pitch 1","status":"one-off","cards":["Sigil of Suffering (1)"],"ruling":"so sigil is a 0 cost defense reaction - it is not defended with in the blocking step - reaction step only - when it is played in the reaction step you deal 1 arcane damage to the hero attacking you - if they do not prevent this damage the block value of the card increases to 4"},"card-flying-high-3":{"at":"2026-07-25","mechanic":"Flying High · pitch 3","status":"one-off","cards":["Flying High (3)"],"ruling":"this gives your next attack go again and if the pitch color is blue it also gives it +1 power - it is a non-attack action so it must be played *before* you attack - it'll need to leave a 'macro' around on the player's board that activates when the player plays an attack next and is cleared if one is not played by the end of turn"},"card-hope-merchant-s-hood-0":{"at":"2026-07-25","mechanic":"Hope Merchant's Hood · pitch 0","status":"one-off","cards":["Hope Merchant's Hood (0)"],"ruling":"when this is equipped you will always see it next to your hand cards until you use it - it can destroy itself when you activate it and you will get a pop up that allows you to choose cards from your hand - the cards will be added to your deck and your deck will be shuffled. once you shuffle your deck you draw cards equal to the number of cards you shuffled into it"},"card-quick-clicks-0":{"at":"2026-07-25","mechanic":"Quick Clicks · pitch 0","status":"one-off","cards":["Quick Clicks (0)"],"ruling":"these feet have a very specific condition - you must have played the card 'nimblism' - nimblism has a lot of synergistic abilities we need nimblism to leave behind an extra 'played nimblism macro - cleared at end of turn' - when you have the macro and this is equipped then you will be able to activate it from your \"hand+extras\" section - when you do activate it it gives you a 'macro-next attack you play this turn ( could be a weapon attack) add go again to it. '"},"card-ravenous-rabble-1":{"at":"2026-07-25","mechanic":"Ravenous Rabble · pitch 1","status":"one-off","cards":["Ravenous Rabble (1)"],"ruling":"this creates a popup for both players - it shows the top card of the deck - if its red you attack for 4 (5 base attack printed on card -1 pitch value of top card that was just revealed) , if its yellow 3 , if its blue 2"},"card-put-in-context-3":{"at":"2026-07-25","mechanic":"Put in Context · pitch 3","status":"one-off","cards":["Put in Context (3)"],"ruling":"before this defense reaction is able to be activated we must check the attack power of the attack it will be defending - if the base attack power (what is printed on the actual card) is 3 or less it is able to be activated. if it is pressed but the attack is 4 or greater the player should get a pop up to quickly explain that they can't play this"},"dice":{"at":"2026-07-25","mechanic":"dice","status":"unmodelled","cards":["Knucklehead (0)"],"ruling":"kayo specialization means nothing to us - the activated ability cost an action point - once activated there will need to be a 'die roll' popup that both players see - your base intelligence becomes the result until the end of turn - your intelligence determines how many cards you draw at the end of the turn so for example if you roll a 6 you will draw 6 cards at the end of turn. there will need to be a macro that lingers and resets your intelligence after you've drawn up"},"crowd":{"at":"2026-07-25","mechanic":"crowd","status":"unmodelled","cards":["Booze! (3)","Goon Beatdown (3)"],"ruling":"the \"crowd boos you\" doesn't mean anything on it's own - it triggers other abilities - this is the only time a crowd is referenced and isn't a significant aspect of the game."},"card-mandible-claw-0":{"at":"2026-07-25","mechanic":"Mandible Claw · pitch 0","status":"one-off","cards":["Mandible Claw (0)"],"ruling":"cards in grave will have to have a 'turn added to grave' characteristic - when this card is attacked with the unread ability activates - it checks if any cards in grave that have been added this turn have 6+ power and if they do, the go again is added to the attack"},"card-predatory-plating-0":{"at":"2026-07-25","mechanic":"Predatory Plating · pitch 0","status":"one-off","cards":["Predatory Plating (0)"],"ruling":"this will be conditionally active if you are currently attacking or blocking with a card that has 6+ attack power. when you activate it at instant speed you will gain one resource."},"card-pulping-1":{"at":"2026-07-25","mechanic":"Pulping · pitch 1","status":"one-off","cards":["Pulping (1)"],"ruling":"check if any cards in grave have 6+ power and were added to grave this turn - if so, add dominate to this attack"},"card-bear-hug-3":{"at":"2026-07-25","mechanic":"Bear Hug · pitch 3","status":"one-off","cards":["Bear Hug (3)"],"ruling":"this is conditionally active to be played - you must have pitched a card with 6+ attack power - pitch cards don't need an extra characteristic of 'pitched this turn' because they go to the bottom at the end of every turn. we also don't need to worry about cards ending up in the pitch zone without being pitched. so just check the pitch zone, if a card has 6+ attack - we're good to go"},"card-r
