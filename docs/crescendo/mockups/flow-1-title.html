<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawnblade — F1 Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="flow.css">
<script src="stage.js"></script>
<style>
/* F1 only: the wordmark scale per height band; the blade; the stack of the call to action */
.f1 .frame{display:flex;flex-direction:column}
.f1 .top{height:52px;flex:none;position:relative}
.f1 .top .lab{position:absolute;left:var(--gut);top:20px;color:var(--brass)}
.f1 .top .ib{position:absolute;right:var(--gut);top:4px}
.f1 .mark{position:relative;flex:none;height:calc(var(--wm)*1.82 + 20px)}
.f1 .mark .wm{left:var(--gut)}
.f1 .mark .w1{top:0}
.f1 .mark .blade{position:absolute;left:0;right:0;top:calc(var(--wm)*.86 + 2px);height:22px;filter:drop-shadow(0 0 7px rgba(242,198,110,.7))}
.f1 .mark .w2{top:calc(var(--wm)*.86 + 26px)}
.f1 .shade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to top,rgba(10,14,16,.92),transparent)}
.f1 .tag{flex:none;padding:0 var(--gut);font:var(--t-body);color:var(--ink-1);height:22px}
.f1 .band{position:relative;flex:1;min-height:96px;margin:4px 0 10px}
.f1 .cta{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0 0}
.f1 .cta .btn{width:248px;height:56px;font-size:26px}
.f1 .cta small{font:var(--t-small);color:var(--ink-1)}
.f1 .row3{flex:none;margin-top:2px}
.f1 .foot{flex:none;height:30px;text-align:center;font:var(--t-label);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-2);padding-top:4px}
html[data-band=compact] .stage{--wm:92px}
html[data-band=regular] .stage{--wm:112px}
html[data-band=tall] .stage{--wm:132px}
html[data-band=compact] .f1 .tag{display:none}
</style>
</head>
<body>
<div class="stage f1">
  <div class="bg">
    <div class="sunglow"></div>
    <div class="sun"></div>
    <svg class="rays" viewBox="-210 -210 420 420" aria-hidden="true"><g stroke="#F2C66E" stroke-width="1.2" stroke-linecap="round" opacity=".55">
      <path d="M0 -96V-196M0 96V196M-96 0H-196M96 0H196M68 -68L138 -138M-68 -68L-138 -138M68 68L138 138M-68 68L-138 138"/>
      <path d="M37 -89L75 -181M-37 -89L-75 -181M89 -37L181 -75M-89 -37L-181 -75M89 37L181 75M-89 37L-181 75M37 89L75 181M-37 89L-75 181" opacity=".5"/></g>
      <circle r="88" fill="none" stroke="#D8A23E" stroke-opacity=".35" stroke-width="1.2"/></svg>
  </div>
  <div class="frame">
    <div class="top">
      <span class="lab">Fan-made · free forever</span>
      <button class="ib" aria-label="Settings" data-href="flow-8-menu.html"><svg class="ico"><use href="#i-gear"/></svg></button>
    </div>

    <div class="mark">
      <div class="wm w1">Dawn</div>
      <svg class="blade" viewBox="0 0 393 22" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="bl" x1="0" x2="1"><stop offset="0" stop-color="#CFCABD"/><stop offset=".6" stop-color="#F5F0E4"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>
        <circle cx="12" cy="11" r="4.5" fill="#D8A23E"/><rect x="14" y="9" width="30" height="4" rx="1.5" fill="#8A6420"/><rect x="42" y="2.5" width="7" height="17" rx="2.5" fill="#F2C66E"/>
        <path d="M49 8H356L386 11L356 14H49Z" fill="url(#bl)"/><path d="M52 11H352" stroke="#0A0E10" stroke-opacity=".28" stroke-width=".9"/><path d="M49 8H356L386 11" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".7"/>
        <path d="M386 4.5L387.6 9.4L392.5 11L387.6 12.6L386 17.5L384.4 12.6L379.5 11L384.4 9.4Z" fill="#F2C66E"/>
      </svg>
      <div class="wm w2">Blade</div>
    </div>
    <p class="tag">Spar the Silver Age precons. Your hero, your deck.</p>

    <div class="band">
      <button class="artband hero" aria-label="Change your hero" data-href="flow-3-hero.html"
        style="top:0;bottom:0;background-image:url(https://legendstory-production-s3-public.s3.amazonaws.com/media/cards/large/SIY001.webp);background-size:132% auto;background-position:50% 23%"></button>
      <div class="shade"></div><div class="who"><span class="lab" style="color:var(--ink-1)">Your hero</span><b>Iyslander</b></div>
      <span class="chip br" style="position:absolute;right:var(--gut);bottom:8px">Change ›</span>
    </div>

    <div class="cta">
      <button class="btn" data-href="flow-4-sitdown.html">Play</button>
      <small>Against an AI hero, drawn by fate</small>
    </div>
    <div class="row3">
      <button class="link" data-href="flow-2-ways.html">Ways to play</button>
      <button class="link">Your record</button>
      <button class="link">Learn the rules</button>
    </div>
    <div class="foot">Fan-made · non-profit · no ads, ever</div>
  </div>
</div>
<script src="flow.js"></script>
</body>
</html>
