   is still moving when the tap that opens the preview lands: measured in
   that tick at 393x852 the offset came out 146px against a rail that came
   to rest at 628, leaving the preview 44px INSIDE it. Same bug, different
   instant.

   Listening for the events that move it does not work, and this was tried:
   the rail slid 86px with `scrollTop` UNCHANGED, because what moved it was
   content above it settling, not a scroll. Between snap, image and font
   loads, rotation and React's own re-layout there is no list of events to
   subscribe to that is provably complete — so while the preview is open it
   simply re-measures every frame and writes only when the number changes.
   A peek lasts until the second tap, so the loop is short-lived and costs
   one `getBoundingClientRect` a frame.

   When no rail is on screen it returns to the flat clearance rather than
   chasing a rail that has flicked away. */
function PeekDock({card, verb, onClose}){
  uE(()=>{
    if(!(card && card.uid)) return;
    const root = document.documentElement;
    let last = null, raf = 0;
    const place = () => {
      raf = requestAnimationFrame(place);
      /* THE RAIL ON *THIS* SCREEN, not the first one in the document. The
         table stacks three scrolling screens, so `querySelector` returned
         the CHAIN screen's rail while you were peeking from your board —
         and because that rail sits mostly-but-not-quite off the top, it
         cleared the old "is it off screen" guard and produced a ~893px
         offset. The preview rendered at y ≈ -365: entirely above the
         viewport, invisible, on every card interaction on that screen.

         Most-visible-wins needs no refs and no knowledge of which board is
         rendering, which is what keeps one component serving both. */
      let r = null, seen = -1, railEl = null;
      for(const el of document.querySelectorAll(".phand, .chand, .hand")){
        const b = el.getBoundingClientRect();
        const vis = Math.min(b.bottom, window.innerHeight) - Math.max(b.top, 0);
        if(vis > seen){ seen = vis; r = b; railEl = el; }
      }
      /* nothing on screen to sit above: the old flat action-bar clearance is
         both right and safe, because there is no rail for it to cover.
         Otherwise the distance from the viewport bottom to the rail's TOP
         edge, plus a small gap — never less than that clearance. */
      /* AND ABOVE THE STATUS LINE THAT SITS ON IT (1.0 polish audit). The
         line right over the rail holds this mode's controls — "skip" at the
         arsenal step, "✕ cancel" while paying — and the dock covered them, so
         their tap closed the preview instead. Any `.statusline` / pip `.rail`
         stacked directly on the rail is part of what the dock must clear. */
      let el = r && railEl;
      /* and YOUR STRIP (v7.15), which sits between the hand and the status line now */
      while(el && el.previousElementSibling && el.previousElementSibling.matches(".statusline, .rail, .bstrip.mine")){
        el = el.previousElementSibling;
        const t = el.getBoundingClientRect();
        if(t.height && t.top < r.top) r = {top: t.top};
      }
      const bot = (!r || seen <= 0)
        ? 112 : Math.max(112, Math.round(window.innerHeight - r.top) + 8);
      if(bot !== last){ last = bot; root.style.setProperty("--peekbot", bot + "px"); }
    };
    place();
    return () => cancelAnimationFrame(raf);
  },[card && card.uid]);
  if(!card) return null;
  return (
    <div className="peekwrap" onClick={onClose}>
      <div className="peekcard"><CardFrame card={card}/></div>
      <div className="peekbar">
        <span className="pknm">{card.name}</span>
        <PeekKw card={card}/>
        <span className="pkhint">{verb}</span>
      </div>
    </div>
  );
}

/* THE PEEK NAMES THE CARD'S KEYWORDS (v6.63) — a newcomer mid-game meets
   "Phantasm" here first. Plain text, NOT chips: the whole dock is one
   tap-to-close surface (POLISH condition 1), so nothing on it may take a tap
   of its own. The full card — the next tap — carries the chips that open
   each keyword's Comprehensive Rules sentence (`CardKw`). Same reader and
   filter as `CardKw`, so the two never disagree. */
function PeekKw({card}){
  const rows = card ? deckKeywords([Object.assign({}, card, {q: 1})]).filter(r => crKeyword(r.k, CRKW)) : [];
  if(!rows.length) return null;
  return <span className="pkkw" aria-label="Keywords on this card">{rows.map(r => r.k).join(" · ")}</span>;
}

/* ============================================================
   JUDGE!! — THE SHEET, FOR BOTH BOARDS (v2.51)

   `navigator.clipboard.writeText` REJECTS WITH NotAllowedError even on a
   real tap, in a secure context, with the document focused. Verified on
   the deployed site: clipboard-write is a permission, and where it is not
   granted the async API simply refuses. The old code had no fallback and
   told the player "copy failed — use Download", so the fastest path from
   noticing a bug to reporting it was broken. Worse, its `else` branch
   claimed SUCCESS when the API was absent entirely — a report that was
   never copied, reported as copied.

   So: try the async API, fall back to the legacy execCommand path (which
   needs no permission), and if BOTH fail select the text so it can be
   copied by hand and SAY so. Never claim a copy that did not happen.
   ============================================================ */
function copyText(txt){
  const legacy = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt;
      /* Off-screen but focusable, and readOnly so a phone keyboard does
         not slide up over the sheet on the way past. */
      ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, txt.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok ? "copied" : "manual";
    } catch(e){ return "manual"; }
  };
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).then(()=>"copied", legacy);
  return Promise.resolve(legacy());
}

const COPY_MSG = {copied:"Copied to clipboard.",
  manual:"This browser blocked the clipboard — use Save report instead.",
  downloaded:"Saved to your downloads."};

/* ============================================================
   THE PROMPT SHEET — ONE BODY, BOTH BOARDS (v4.44)

   `judge.js` has carried four prompt ACTIONS since v2.78 and its own
   comment says why an unanswerable sheet is not a missing screen but a
   missing RULE: "several cards defer their whole payload into the
   answer — `arcaneHit` rides the damage out on a soak, a printed
   'unless they pay' hangs its consequence off a toll." THE TABLE HAD NO
   SHEET AT ALL. Measured: the word "prompt" did not appear once in
   `TableBoard`, and `judge.legal` freezes the game for BOTH seats while
   one is live — so a card that asked its controller a question was a
   hard livelock on the board this project calls CR-exact.

   v3.01's shape at the scale of a whole interaction layer, and this was
   stated the other way round ("prompts are answerable there too") for
   sixteen versions: a doc claim is a test with no assertion (v3.41).
   Found while adding a SEVENTH variant, which would have been
   unanswerable there in exactly the same way.

   PROPS ONLY, like `ArmorGrid` and `PeekDock` (v2.50) — the two boards
   speak different state vocabularies and the sheet needs neither. `me`
   is the VIEWER's seat, so it renders for both players (a table where
   you cannot see what your opponent is being asked is a table that has
   silently stopped) and its controls are inert unless the sheet is
   addressed to you, which is what `judge.legal` already enforces.
   ============================================================ */
/* A SHEET'S STAT (v6.49, UX step 7) — EndPanel's big-number line at sheet scale:
   the one number the decision turns on, a label, and a quiet sub line. */
function PStat({n, of, lbl, sub, bad}){
  return <div className={"pstat"+(bad?" bad":"")}>
    <span className="pn">{n}{of!=null && <small>/{of}</small>}</span>
    <span className="pl">{lbl}{sub && <span className="ps"><PipLine s={sub}/></span>}</span>
  </div>;
}

function PromptSheet({p, me, onToggle, onPick, onTakeBack, onMove, onDecline, onConfirm}){
  if(!p) return null;
  /* `viewer`, NEVER `seat` — CLAUDE.md names that collision by name:
     `priority.js` exports a `seat` helper meaning "seat a game", and a
     local one meaning "which chair is this client in" is the
     same-name-different-meaning trap `KNOWN_COLLISIONS` polices. The
     guard caught this on its first run, exactly as it caught `tapTwice`'s
     `act` in v2.25. */
  const viewer = me || 0;
  const mine = (p.side || 0) === viewer;
  /* A DEAD CONTROL READS AS A BROKEN SCREEN RATHER THAN AS A RULE
     (v2.83's "Done defending"), so a sheet that is not yours takes no
     taps at all instead of taking them and being refused. */
  const go = fn => mine ? fn : undefined;
  const ready = promptReady(p);
  /* AN `alloc`'s SELECTION IS A MULTISET (v4.44) — one entry per counter
     placed — so the per-card tally is a count and not a tick, and the
     rail must be able to show two on one permanent. */
  const put = i => p.tag==="alloc" ? p.sel.filter(j=>j===i).length : 0;
  /* AND A MULTI-TARGET PICK'S TAG IS ITS POSITION, NOT A TICK (v4.59). Crown
     of Dichotomy prints "in any order" and `sel` is tap-ordered, so the
     ORDER is the decision the card offers — "✓ chosen" on both cards tells
     the player nothing about which one they will draw first. The hint says
     the rule; this says what they have actually chosen. */
  const ord = k => ["1st","2nd","3rd"][k] || (k+1)+"th";
  return <div className="psheet">
    <div className="ph"><span className="pt">{p.title}</span>
      <span className="psrc">{p.src}</span>
      {!mine && <span className="pside">opponent's call</span>}</div>
    <div className="phint"><PipLine s={p.hint}/></div>

    {/* AN OPT IS DRAWN IN THE ORDER THE PLAYER CHOOSES (v5.45, QUEUE v4
        S12). The cards stand in their RESULTING order, left to right as
        they will be drawn, each labelled with its draw; a tap still sends
        one to the bottom (under the rest for a reorder), and each kept
        card carries arrows that move it one draw earlier or later through
        `promptMove`, the one reader both boards send. */}
    {p.tag==="opt" && !!p.cards.length && (()=>{
      const ord0 = optOrder(p);
      const kept = ord0.filter(i=>!p.down.includes(i));
      const seq = [...kept, ...ord0.filter(i=>p.down.includes(i))];
      return <div className="prow2">
        {seq.map((i, pos)=>{
          const c = p.cards[i], down = p.down.includes(i), at = kept.indexOf(i);
          return <div key={c.uid||i} className="poptcol">
            <button className={"pcard"+(down?" down":"")} onClick={go(()=>onToggle(i))}>
              <CardFrame card={c} className="sm"/>
              <span className="ptag">{down && !p.keepTop ? "bottom" : ord(pos)+" draw"}</span>
            </button>
            {!down && kept.length > 1 && <div className="parrows">
              <button disabled={!mine || at===0} onClick={go(()=>onMove(i,-1))}>◀</button>
              <button disabled={!mine || at===kept.length-1} onClick={go(()=>onMove(i,1))}>▶</button>
            </div>}
          </div>;
        })}
      </div>;
    })()}

    {(p.tag==="pick" || p.tag==="reveal" || p.tag==="alloc")
      && !!p.cards.length &&
      <div className="prow2">
        {p.cards.map((c,i)=>{
          const sel  = p.tag==="pick" && p.sel.includes(i);
          const n    = put(i);
          const tap = p.tag==="reveal" ? undefined : go(()=>onToggle(i));
          return <button key={c.uid||i}
            className={"pcard"+((sel||n>0)?" sel":"")+(p.tag==="reveal"?" flat":"")}
            onClick={tap}>
            <CardFrame card={c} className="sm"/>
            {p.tag==="pick" && sel && <span className="ptag">
              {p.filters ? ord(p.sel.indexOf(i)) : "✓ chosen"}</span>}
            {p.tag==="alloc" && n>0 && <span className="ptag">+{n}</span>}
          </button>;
        })}
      </div>}

    {/* A TARGET SHEET DREW NO CARDS (v6.49). `buildPrompt` deals `cards` and
        `promptChoose` takes an index into them, but this sheet rendered only the
        title, so Confirm stayed dark forever — a livelock waiting for its first
        producer. A tap is the choice; the chosen card says so. */}
    {p.tag==="target" && !!p.cards.length &&
      <div className="prow2">
        {p.cards.map((c,i)=>(
          <button key={c.uid||i} className={"pcard"+(p.choice===i?" sel":"")} onClick={go(()=>onPick(i))}>
            <CardFrame card={c} className="sm"/>
            {p.choice===i && <span className="ptag">target</span>}
          </button>))}
      </div>}

    {p.tag==="modal" && <div className="pmodal">
      {p.options.map((o,i)=>(
        <button key={i} className={"popt"+(p.choice===i?" on":"")} onClick={go(()=>onPick(i))}>
          <PipLine s={o.label || String(o)}/>
        </button>
      ))}
      {/* AN OPTIONAL MODAL HAD NO WAY OUT ON EITHER BOARD (v4.61).

          v3.90 built `optional` so a "you may … OR …" could be refused,
          in its own words: "a modal with no way out would make a 'you
          may' MANDATORY — stronger than printed, and the free-ability
          rule v2.04 fixed read from the other end." The module honoured
          it, `promptDecline` gated it, `judge.reduce` accepted the
          action and `test/mill.test.js` drove all three — and THIS
          SHEET, the one body both boards render, offered no control, so
          `promptReady` held Confirm dark until a mode was chosen and the
          only answer either board could send was to pay.

          Four pool records, two cards, Gravy Bones' list, every one
          `tier: full`: Jittery Bones' "you may discard a card OR
          destroy the top card of your deck" and Washed Up Wave's, so a
          printed choice was spent every time it was offered. v3.50's
          sentence with a BUTTON as the missing caller.

          IT IS A `popt` BESIDE THE MODES, not a footer button like
          `pick`'s "Choose none", because for a modal declining IS a
          choice — `promptDecline` is literally `promptChoose(p,
          "decline")` — so it highlights and confirms exactly as a mode
          does, which is the treatment the `pay` sheet below already
          gives its own Decline.

          AND IT GOES THROUGH `onDecline`, never `onPick("decline")`:
          `promptDecline` carries the `optional` gate, so a mandatory
          modal cannot be refused even if this guard is ever widened. */}
      {p.optional &&
        <button className={"popt"+(p.choice==="decline"?" on":"")} onClick={go(onDecline)}>
          Decline<span className="sub">neither mode resolves</span>
        </button>}
    </div>}

    {p.tag==="pay" && <div className="pmodal">
      <button className={"popt"+(p.choice==="pay"?" on":"")}
        disabled={p.avail < p.cost} onClick={go(()=>onPick("pay"))}>
        {p.destroyUid!=null && !p.cost ? "Destroy it" : <>Pay {p.cost}</>}
        {/* `avail` IS THE POOL PLUS WHAT THE HAND CAN PITCH (v2.75), never the pool
            alone — "5 floating" over an empty pool read as a number that was not
            there. Pitching is on demand, so the sub says where the price comes from. */}
        <span className="sub">{p.destroyUid!=null && !p.cost ? "the piece itself is the price" : p.avail < p.cost ? `only ${p.avail} from pool and hand` : `${p.avail} from pool and hand`}</span>
      </button>
      <button className={"popt"+(p.choice==="decline"?" on":"")} onClick={go(()=>onPick("decline"))}>
        {/* AN "UNLESS" PRICE HAS NO RIDER — declining is what lets its penalty land (v5.24's
            line in `applyPrompt`), so the sub must not say the rider "does not resolve". */}
        Decline<span className="sub">{(p.elseOps||[]).length && !(p.ops||[]).length ? "the penalty lands" : "the rider does not resolve"}</span>
      </button>
    </div>}

    {/* SOAK — arcane incoming, and the iron that could stop it. Every
        option is a separate trigger, so this is multi-select and
        "take none" is always legal: the running total says how much
        is still getting through, because THAT is the number the
        decision is actually about. A barrier that costs more than it
        prevents is still offered (Arcane Barrier 2 costs 2 to stop 1)
        — it is printed that way and the player may still want it at
        lethal. */}
    {p.tag==="soak" && (()=>{
      const spent  = p.sel.reduce((a,i)=>a+(p.options[i].cost||0),0);
      const soaked = p.sel.reduce((a,i)=>a+(p.options[i].amount||0),0);
      const through = Math.max(0, p.amount - soaked);
      return <div className="pmodal">
        {p.options.map((o,i)=>{
          const on = p.sel.includes(i);
          const afford = on || o.kind==="spellvoid" || spent + (o.cost||0) <= p.avail;
          return <button key={o.uid+o.kind} className={"popt"+(on?" on":"")}
            disabled={!afford} onClick={go(()=>onToggle(i))}>
            {o.name} — stops {o.amount}
            <span className="sub">{o.kind==="spellvoid"
              ? "spellvoid: destroy it"
              : `arcane barrier: pay ${o.cost}${afford?"":" — can't reach it"}`}</span>
          </button>;
        })}
        {/* THE NUMBER THE DECISION IS ABOUT, AS THE SHEET'S STAT (v6.49, UX step 7):
            the EndPanel grammar of headline / stat / one primary button. Its cost line
            goes through PipLine — v6.48 and earlier printed a literal "{r}" here. */}
        <PStat n={through} of={p.amount} lbl={through>0 ? "still gets through" : "all prevented"}
          bad={through>0} sub={spent>0 ? `costs ${spent}{r} of ${p.avail} reachable` : `${p.avail} reachable from pool and hand`}/>
      </div>;
    })()}

    <div className="pact">
      {p.tag==="pick" && p.optional &&
        <button onClick={go(onDecline)}>Choose none</button>}
      {p.tag==="pick" && p.max>1 &&
        <span className="pcount">{p.sel.length}/{p.max}</span>}
      {/* AN ALLOCATION IS PLACE-THEN-CONFIRM, so the undo is the one
          control the other sheets have no need of: `onToggle` adds a
          counter every time, which is what "distribute" means. And
          "Place none" is not a DECLINE — "up to four" permits zero, so
          confirming with nothing placed is a complete answer (v2.04's
          split, one sheet over), which is why it clears the selection
          rather than ending the sheet. */}
      {p.tag==="alloc" && <>
        <button disabled={!p.sel.length} onClick={go(onTakeBack)}>Take back</button>
        {!!p.sel.length && <button onClick={go(onDecline)}>Clear</button>}
        <span className="pcount">{p.sel.length}/{p.max}</span>
      </>}
      <button className={"go"+(ready&&mine?"":" off")} disabled={!ready||!mine}
        onClick={go(onConfirm)}>
        {p.tag==="reveal" ? "OK" : p.tag==="alloc" && !p.sel.length ? "Place none" : "Confirm"}
      </button>
    </div>
  </div>;
}

/* One sheet, both boards. `report` is a thunk so the state is read at the
   moment the player presses the button, not when the sheet opened. */
function JudgeSheet({open, onClose, report, meta, warn}){
  const [note,setNote] = uS("");
  const [said,setSaid] = uS(null);
  if(!open) return null;
  const run = fn => { setSaid(null); fn(); };
  const doCopy = () => run(()=>copyText(DawnReport.text(...report(note))).then(setSaid));
  const doSave = () => run(()=>{
    const [g,ctx] = report(note);
    const blob = new Blob([DawnReport.text(g,ctx)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = DawnReport.filename(g,ctx);
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    setSaid("downloaded");
  });
  return (
    <div className="bugwrap" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="bugsheet clip">
        <div className="bugh">
          <span className="bugt">Judge!!</span>
          <span className="bugmeta">{meta}{warn>0 ? ` · ⚠ ${warn} invariant${warn>1?"s":""}` : " · state clean"}</span>
        </div>
        <p className="bughint">What looked wrong? The whole board — zones, counters, chain,
          the feed and any invariant violations — is captured with it, so one line is plenty.</p>
        <textarea className="bugta" autoFocus placeholder="e.g. Look Tuff attacked for 4, should have been 3 — I never got asked to pay"
          value={note} onChange={e=>{ setNote(e.target.value); setSaid(null); }}/>
        {said && <div className={"bugok"+(said==="manual"?" warn":"")}>{COPY_MSG[said]||said}</div>}
        <div className="bugrow">
          <button className="bigbtn alt" onClick={onClose}>Close</button>
          <button className="bigbtn alt" onClick={doCopy}>Copy</button>
          <button className="bigbtn" onClick={doSave}>Save report</button>
        </div>
      </div>
    </div>
  );
}

/* HOW TO PLAY (v6.57) — the roster's door for a player who has never held a Flesh
   and Blood card. Six short paragraphs, the spine of the game and nothing the feed
   will not teach on the first turn: the goal, the three uses of a card, the action
   point, combat, the end of turn, and how this app is driven. Every rule here is
   one the engine plays, said the way the feed says it. */
function HowToPlay({open, onClose}){
  if(!open) return null;
  return (
    <div className="bugwrap" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="bugsheet clip howsheet">
        <div className="bugh"><span className="bugt howt">How to play</span>
          <span className="bugmeta">Flesh and Blood in two minutes</span></div>
        <p className="bughint">The rest you will learn from the feed: it writes every step down.</p>
        <h4 className="howh">The goal</h4>
        <p className="howp">Two heroes, one fight. Bring the other hero's life to 0. Your hero card gives
          you two numbers: your life, and your intellect, the number of cards you draw up to.</p>
        <h4 className="howh">Every card is three things</h4>
        <p className="howp">Play it for what it does. Pitch it to pay for other cards: the coloured stripe
          says how much it pays (red 1, yellow 2, blue 3). Or defend with it, for the number on its shield.
          Choosing which, every turn, is the whole game.</p>
        <h4 className="howh">Your turn</h4>
        <p className="howp">You get one action point. Playing an attack or an action spends it, unless the
          card has go again, which gives it back. Instants cost no action point. Pay a cost by pitching
          cards from your hand.</p>
        <h4 className="howh">Combat</h4>
        <p className="howp">When you attack, your opponent may defend with cards from hand and with their
          equipment. Then both sides may react: attack reactions make the attack bigger, defence
          reactions add defence. Whatever power gets past the defence is damage.</p>
        <h4 className="howh">The end of your turn</h4>
        <p className="howp">You may set one card from hand face down in your arsenal, to play on a later
          turn. The cards you pitched go to the bottom of your deck, then you draw back up to your
          intellect. What you keep in hand is your defence on their turn, so every turn asks the same
          question: swing now, or hold cards to block?</p>
        <h4 className="howh">Here, in Dawnblade</h4>
        <p className="howp">Pick a hero, tap Battle, and start with Fight the dummy: it swings on a fixed
          pattern while you learn your deck. When you are ready, pick an AI hero as your foe and it plays a
          real precon against you. Tap a card once to see it large, and again to play it.
          The Coach's call says the play it would make, and why. If something looks wrong, tap JUDGE!!
          and it saves the whole board with your note.</p>
        <div className="bugrow"><button className="bigbtn" onClick={onClose}>Got it</button></div>
      </div>
    </div>
  );
}

/* WHERE ARE WE? — the turn and the phase, on the log screen (v3.19).
   Reported from play: the feed says what just happened and the board says
   what you hold, and nothing on screen says which part of the turn you are
   standing in. In a training sim the phase IS the lesson — "you cannot play
   that here" only teaches something if the player can see where "here" is.

   IT READS THE TRAINER'S VOCABULARY, DELIBERATELY. `mode`/`bphase` are
   authoritative in `Battle` and the derived `phase`/`step` are the v2.27
   shadow; at the TABLE it is the other way round and `mode` is seeded once
   and never written again. So this takes the label it needs from the board
   that owns it rather than sniffing, which is the rule `advise` was one
   line from breaking (v2.83) — a frozen field reads as an answer.

   Pure, and it takes each board's own words. */
function phaseLabel(mode, bphase, over){
  if(over) return "game over";
  if(mode === "block") return bphase === "react" ? "reaction step" : "defend step";
  if(mode === "stack") return "attack — reaction step";
  if(mode === "pay") return "paying a cost";
  if(mode === "arsenal") return "end phase — arsenal";
  if(mode === "boostpick") return "boost?";
  if(mode === "fusepick")  return "fusion?";
  if(mode === "chargepick") return "charge?";
  if(mode === "usurppick") return "usurp?";
  if(mode === "bancostpick") return "additional cost?";

   out of `priority.js`; `mode` is seeded into its opening state and never
   written again, so calling `phaseLabel` here would print "your action
   phase" for the whole game — present, plausible, and frozen, which is
   worse than absent (v2.83).

   "your action phase" is NOT `phase === "action"`: the combat chain lives
   inside the TURN PLAYER's action phase, so while you defend against their
   swing the phase is still action and simply is not yours. `seat` is what
   tells them apart. */
function stepLabel(g, seat){
  if(g.over) return "game over";
  const mine = g.turnPlayer === seat;
  if(g.phase === "start") return mine ? "your start phase" : "their start phase";
  if(g.phase === "end")   return mine ? "your end phase"   : "their end phase";
  if(g.step && g.step !== "layer")
    return (mine ? "your attack — " : "their attack — ") + g.step + " step";
  return mine ? "your action phase" : "their action phase";
}

/* THE HAND ROW — both boards (v7.16; it replaces v7.13's hand wheel). The user, 2026-11-26: "the
   current hand 'wheel' really doesn't work well, we need a better more fluid system — maybe ... we just
   need to make the hand endlessly scrollable in the old flat layout." So the hand is flat again, and it
   SCROLLS THE WAY THE PHONE SCROLLS: a native horizontal scroller, with the phone's own momentum and
   rubber band, no snap (a snap fights a flick), every card the same size and upright, and nothing
   hidden behind a spin — a long hand is one flick away end to end. What the wheel taught stays:

   IT IS A LAYOUT, NOT A SECOND RAIL. Each board still builds its own cells (the trainer's `handCell` +
   `playables`, the table's `handCell` + `railPlays` + the arsenal) with their own dims, verbs and taps,
   and passes them in as children. The two-tap rule is untouched: the first tap peeks (the card lifts,
   the dock names it), the second commits. Scrolling never taps: a native scroll swallows the click.
   THE PEEK IS ALWAYS IN VIEW: when the peeked card changes and it is cut by an edge, the row glides
   until it is whole. Otherwise the row stays where the thumb left it.
   Cards are bigger than the old rail's 80 px (a quarter of the phone's width, 76..104 px; 76 under
   700 px tall, where the stage needs the room). A card cut off at either edge is counted on that edge
   (`+N`), so the row says how much more there is. On a desktop a mouse wheel scrolls it sideways and
   a mouse drag pulls it. */
function HandRow({children}){
  const cells = React.Children.toArray(children).filter(c => c && c.props);
  const n = cells.length;
  const has = (c, k) => (" " + (c.props.className || "") + " ").includes(" " + k + " ");
  const peekIdx = cells.findIndex(c => has(c, "peek"));
  const peekKey = peekIdx >= 0 ? String(cells[peekIdx].key) : null;
  const box = uR(null);
  const drag = uR(null);
  const [more, setMore] = uS([0, 0]);
  /* the +N on each edge: cells whose middle is out of view; measured on scroll (once a frame), resize and render */
  const count = useCallback(() => {
    const el = box.current; if(!el) return;
    const b = el.getBoundingClientRect();
    let l = 0, r = 0;
    for(const c of el.querySelectorAll(".hrin > .hc")){
      const q = c.getBoundingClientRect(), m = (q.left + q.right) / 2;
      if(m < b.left) l++; else if(m > b.right) r++;
    }
    setMore(o => (o[0] === l && o[1] === r) ? o : [l, r]);
  }, []);
  uE(() => { count(); });
  uE(() => {
    const el = box.current; if(!el) return;
    let raf = 0;
    const onScroll = () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; count(); }); };
    /* a mouse wheel's vertical turn scrolls the row sideways (the board itself never scrolls vertically) */
    const onWheel = e => {
      if(el.scrollWidth <= el.clientWidth + 1 || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
      el.scrollLeft += e.deltaY; e.preventDefault();
    };

    el.addEventListener("wheel", onWheel, {passive:false});

    return () => { el.removeEventListener("scroll", onScroll); el.removeEventListener("wheel", onWheel); if(ro) ro.disconnect(); if(raf) cancelAnimationFrame(raf); };
  }, [n > 0]);
  /* the peek glides into view when it is cut by an edge (a tap on a half-shown card, or a peek set elsewhere) */
  uE(() => {
    const el = box.current; if(!el || !peekKey) return;
    const c = el.querySelector(".hrin > .hc.peek"); if(!c) return;
    /* 28: clear of the edge's fade and its +N, which sit over the last 24 px */
    const b = el.getBoundingClientRect(), q = c.getBoundingClientRect(), pad = 28;
    let dx = 0;
    if(q.left < b.left + pad) dx = q.left - b.left - pad;
    else if(q.right > b.right - pad) dx = q.right - b.right + pad;
    if(!dx) return;
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { el.scrollBy({left: dx, behavior: calm ? "auto" : "smooth"}); } catch(err) { el.scrollLeft += dx; }
  }, [peekKey]);
  /* a mouse drag pulls the row (touch and pen scroll natively); a drag never also taps the card it started on */
  const down = e => {
    if(e.pointerType !== "mouse" || e.button !== 0 || !box.current) return;
    drag.current = {x: e.clientX, left: box.current.scrollLeft, moved: false};
  };
  const move = e => {
    const d = drag.current; if(!d || !box.current) return;
    const dx = e.clientX - d.x;
    if(!d.moved && Math.abs(dx) < 6) return;
    d.moved = true;
    box.current.scrollLeft = d.left - dx;
  };
  const up = () => { const d = drag.current; if(d && !d.moved) drag.current = null; else if(d) setTimeout(() => { if(drag.current === d) drag.current = null; }, 0); };
  const clickCap = e => { const d = drag.current; if(d && d.moved){ e.stopPropagation(); e.preventDefault(); drag.current = null; } };
  if(!n) return <div ref={box} className="phand hrow wempty"><div className="hrin"><span className="hlbl">Hand</span><span className="hrnone">no cards</span></div></div>;
  return (
    <div ref={box} className="phand hrow" onPointerDown={down} onPointerMove={move} onPointerUp={up}
      onPointerLeave={up} onClickCapture={clickCap}>
      <div className="hrin">
        <span className={"hrmore l" + (more[0] ? " on" : "")} aria-hidden="true">{more[0] ? <b>+{more[0]}</b> : null}</span>
        <span className="hlbl">Hand</span>
        {cells}
        <span className={"hrmore r" + (more[1] ? " on" : "")} aria-hidden="true">{more[1] ? <b>+{more[1]}</b> : null}</span>
      </div>
    </div>
  );
}
/* THE HUB — both boards' action bar (v7.14, GRAPHICS-PLAN G1c; design/STAGE.md App. C.1 on
   branch design/stage). The primary button moves into the THUMB LANE, the middle of the bottom
   edge, which a left or a right thumb reaches equally; a secondary sits in a corner, where a
   thumb does not hit it by accident (the first beside the right thumb, a second on the left).
   EACH BOARD NAMES ITS PRIMARY, per mode, with the class `hubp` on the button (or the waiting
   note) that is the turn's next move: the bar does not guess from colour, because the table's
   Pass and End turn can both wear `go`. A mode that names none, or offers more than three
   controls — the cost pickers, one button per card, where WHICH card is the decision — keeps

function Ticker({feed}){
  const [idx,setIdx]=uS(0);

    const backlog = feed.length-1-idx;
    const t=setTimeout(()=>setIdx(i=>i+1), backlog>2?1200:1900);
    return ()=>clearTimeout(t);
  },[idx,feed.length]);
  const shown = feed[Math.min(idx,feed.length-1)]||"";
  const backlog = Math.max(0,feed.length-1-idx);
  return (
    <div className="ticker">
      <span className="live"><span className="dot"/>LIVE</span>
      <span className="cap" key={idx}><PipLine s={shown}/></span>
      {backlog>1 && <span className="more">+{backlog}</span>}
    </div>
  );
}

     the powCard as UI and the table could not reach it. v3.01's shape, and
     the last of the family (v3.04's seventeen equipment abilities, v3.39's
     hero branch, v3.44's ally, v3.84's aura attack).

     It is `build.js`'s THIRD powCard builder and both of the others'
     comment blocks have named it since v3.79 — so v3.63's rule (when you
     add a flag to one builder, grep for the others) is now a grep in ONE
     file rather than across two, one of which no drill could reach. */
  const boardPow = DawnBuild.boardPow;
  /* ---- A CARD IN HAND WITH AN ACTIVATED ABILITY (v2.61) ----------------
     Two pool cards print one and NEITHER had any route to it: only gear
     (build.js) and arena permanents (boardPow) ever got a powCard, so
     "Instant - Discard this: …" on a card in hand was unreachable even
     though its effect parses perfectly.

       Agile Windup           Instant - Discard this: Create an Agility token
       Rally the Coast Guard  Once per Turn Instant - Discard a card:
                              This gets +3{d}   (+ "only while defending")

     Same shape as boardPow — a synthetic card standing for the ability, so
     the two-tap peek shows the ABILITY's text, which is what you are
     deciding about rather than the card it hangs on. Three more pool cards
     come online with it (Arcane Twining, Photon Splicing, Reaper's Call);
     nothing here is special-cased by name. */
  const handPow = c => {
    const ha = c && fxParse(c).handAbility;
    if(!ha) return null;
    return {name:c.name+" — ability", pitch:0, cost:0, power:null, def:null,
      tt:"Card Ability", kw:[], tx:ha.eff, _instant:true,
      img:c.img, dbImg:c.dbImg, _gearArt:true, uid:"ha"+c.uid, _forUid:c.uid};
  };
  /* CAN IT BE ACTIVATED RIGHT NOW? The rule is `effects.handAbilityOK`
     (v3.05) — shared, so judge.js can ask the identical question. This
     adds only the trainer's own busy-modes, which are not a rule about
     the ability: a sheet is open, so nothing else may start. */
  const handAbilityOK = (s, c) => {
    if(["pay","arsenal","boostpick","fusepick","chargepick","discpick","soulpick","boardpick","targetpick","usurppick","bancostpick"].indexOf(s.mode) >= 0) return false;
    return DawnEffects.handAbilityOK(s, c);
  };
  /* THE PAYMENT, THE OPS **AND** THE DEFENCE BUFF ARE ALL SHARED (v4.53).
     This used to route the +{d} itself, into a per-uid map called
     `defBonus` that only this board kept — a SECOND record of the fact
     `applyDefMod` has held since v3.89 and `defendValue` reads on both
     boards. Two records of one fact, in one file, is the no-mirror rule
     broken where nothing watches; and the same stale reason is what made
     judge refuse Rally the Coast Guard by name. `activateHandAbility`
     lands it now, so there is nothing here to route. */
  const activateHand = c => setG(s=>{
    { const _w = sheetFirst(s); if(_w) return _w; }
    if(["pay","arsenal","boostpick","fusepick","chargepick","discpick","soulpick","boardpick","targetpick","usurppick","bancostpick"].indexOf(s.mode) >= 0) return s;
    /* WHICH CARD "Discard a card:" SPENDS (v4.87) — Rally the Coast
       Guard's, asked through the one reader both boards ask
       (`discCostChoice`), and answered by `confirmDiscCost`, which comes
       back HERE rather than through `tryPlay` (`redo`), because this is
       an ability on a card in hand and `tryPlay` would PLAY the card. */
    if(s._discCostUid == null){
      const _dcq = DawnPrompts.discCostChoice(c, act(s));
      if(_dcq) return L({...s, mode:"discpick", discPick:{card:c, from:"hand", idx:null, uids:_dcq, back:s.mode,
                                                          name:c.name, sub:"card", redo:"hand"}},
        `${c.name}'s ability costs a discard — which card?`);
    }
    /* AND ITS TAXES (v4.87): Frostbite prints "abilities cost you an
       additional {r} to activate". Raised at instant speed the way
       `activateInstant` raises an instant ability's cost — `autoPitch`,
       sparing the card itself and the card declared for the discard. */
    const _hat = DawnParser.handAbilityTax(c, act(s), costCtx(s, actorOf(s)));
    const s0 = s;
    if(act(s).res < _hat){
      const paid = autoPitch(s, _hat, [c.uid, s._discCostUid]);
      if(!paid) return L(s, `${c.name}'s ability costs ${_hat} to activate — not enough in hand to pitch for it.`);
      s = paid;
    }
    const r = _EFX.activateHandAbility(s, c);
    /* A REFUSAL KEEPS THE PITCH IN HAND: nothing is spent for a play
       that did not happen (v4.49), and a stale declared discard goes too. */
    if(r.why){ const back = {...s0}; delete back._discCostUid; return L(back, r.why + "."); }
    return winCheck(openPrompt(r.game));
  });
  /* AN ALLY ATTACKS THROUGH THE ONE COMBAT PATH (v3.44).

     This used to be a FABRICATION, in the same family as `foeVanilla`'s
     [3,4,5]: it took the ally's printed power straight off the opposing
     hero's life. No cost was charged though every ally prints one, `{t}`
     and `Once per Turn` were collapsed into one blanket `spent`, the
     printed go again on Limpit was dropped, and — the expensive part —
     there was NO DEFEND STEP, so a 7-power Swabbie was unblockable, free
     and repeatable every turn. The log even said "(ally — simplified, no
     action point)".

     It is `tryPlay(card, "ally", …)` now, which is the same door a weapon
     swing goes through, so the ally gets a real `pend`, a real wall, its
     on-hit text, its action point (charged at resolution, kept on go
     again) and every next-attack grant that names it — which is what
     makes Avast Ye! and Yo Ho Ho! real cards. */
  const closeChain = () => setG(s=>{
    { const _w = sheetFirst(s); if(_w) return _w; }   /* a live sheet stops the game (v4.80), and says so (v4.88) */
    if(s.mode!=="act" || !s.chainOpen) return s;
    const hEntry = s.chain.length ? [{turn:s.turn, links:s.chain}, ...(s.chainHist||[])].slice(0,8) : (s.chainHist||[]);
    /* A GRANT THAT PRINTS "THIS COMBAT CHAIN" EXPIRES WITH IT (v3.87) —
       the same shared body judge.closeChain calls, because a schedule
       written on one board is the bug this project keeps paying for. */
    const cleared = DawnEffects.closeChainGrants({...s, chain:[], chainHist:hEntry, chainOpen:false, boostChain:0, featured:null});
    return L(cleared, `Chain closed — ${s.chain.length} link${s.chain.length!==1?"s":""} banked. Non-attacks free to play.`);
  });
  /* ===================================================================
     THE END PHASE — CR 4.4, in the CR's own fixed order.

     CR 4.4.1: "Players do not get priority during the End Phase."
     CR 4.4.3 is an ORDERED procedure and the order is load-bearing:

       a  all allies' life totals reset to base
       b  the turn-player may put a card face-down into an empty arsenal
       c  pitch zones go to the bottom of their owners' decks
       d  the turn-player untaps all permanents they control
       e  ALL PLAYERS lose all action points and resource points
       f  the turn-player draws to intellect (others on turn one only)

     What was here before ran e -> c -> b -> f, and (a) and (d) did not
     happen in the end phase at all: ally life was never reset anywhere,
     and the untap was folded into the next turn's setup. It also lost
     only the TURN-PLAYER's resources, where the CR says all players —
     invisible today because the dummy floats nothing, and a real bug the
     moment a second hero can bank a resource during your turn.
     =================================================================== */
  const endTurn = () => setG(s=>{
    if(s.over) return s;
    { const _w = sheetFirst(s); if(_w) return _w; }   /* a live sheet stops the game (v4.80), and says so (v4.88) */
    if(s.mode!=="act") return s;
    let n = L({...s}, "— End phase (CR 4.4). No priority. —");

    /* Beginning-of-end-phase triggers, ahead of (a). */
    n = beginEndPhase(n, 0);
    /* ONE OF THEM CAN END THE GAME (v6.38): blood debt is life loss at the
       beginning of the end phase, and the table asks the same question at
       the same beat (`judge.doEndTurn`). */
    if(you(n).hp<=0){ n.over={win:false}; return L(n,`You hit the boards. ${opp(n).name} remains standing.`); }

    /* A TRIGGER THAT ASKS HOLDS THE END PHASE (v5.71) — Bloodrot Pox's "…
       unless you pay {r}{r}{r}" queues the shared pay sheet, and this
       procedure never drained a queue, so the payment was floating-only.
       `_endPending` is `_wallPending`'s twin: `openPrompt` resumes from step (a)
       when the LAST sheet drains (a sheet that skips itself resumes at
       once). The sheet is not a priority window — see `selfPayOr`. */
    if((n.promptQ || []).length) return openPrompt({...n, _endPending: {si: 0}});
    return endTurnRest(n);
  });
  function endTurnRest(s){
    let n = s;
    /* (a) CR 4.4.3a — ally life resets to base. Allies heal every turn, so
       ally damage is a per-turn RACE rather than attrition, which is what
       makes attacking one a real decision (CR 1.4.5). */
    n = endPhaseAllies(n);

    /* (b) CR 4.4.3b — the arsenal set. It is the turn-player's CHOICE, so
       it pauses here; steps c-f resume in afterArsenal. */
    if(!you(n).arsenal && you(n).hand.length)
      return L({...n, mode:"arsenal"}, "(b) Arsenal — set one card face down, or skip.");
    if(you(n).arsenal) n = L(n, `(b) Arsenal already holds ${you(n).arsenal.name} — nothing to set.`);
    else n = L(n, "(b) No cards in hand — nothing to arsenal.");
    return afterArsenal(n);
  }
  /* CR 4.4.2 — THE BEGINNING OF THE END PHASE, before (a). The EVENT lives
     in `DawnEffects.beginEndPhase`, pure and seat-relative, so a drill can
     drive it instead of grepping for it and the table runs the same one.
     This is the trainer's half: log the messages, run the ops.

     It is genuinely earlier than the (c)-(f) block `endPhaseCF` owns —
     Inertia sweeps hand and arsenal, so it has to land before (b) invites
     this seat to arsenal a card about to go to the bottom of the deck
     anyway. Same final state either way, which is exactly why putting it
     in the wrong place would never have been noticed.

     THREE MORE EVENTS USED TO SIT OUTSIDE IT (v3.17), inline in `endTurn`
     and written against `you(n)`: rust destruction, the idle counter wipe
     and intimidate's return. Seat 0, one board. Anything added here goes
     in the shared body, not beside the call. */
  function beginEndPhase(s, si){
    /* THE DATABASE IS THIS BOARD'S ANSWER (v3.76). The shared body is
       module-level and pure, so it holds none — and Arakni's Agents of
       Chaos are records no deck lists, which have to be resolved out of
       one. Passed here, once, so both of this file's call sites get it. */
    const r = DawnEffects.beginEndPhase(s, si, db);
    let n = r.game;
    r.msgs.forEach(m => { n = L(n, m); });
    /* THE OPS RUN AS THE SEAT WHOSE END PHASE IT IS (v5.71), as `judge.doEndTurn`
       runs them (`actor: seat`). Without it a dummy's Bloodrot Pox billed the
       PLAYER — `selfPayOr` and its damage are actor-relative — and the payment
       sheet it queues came up for the wrong seat. */
    if(r.ops.length){
      const was = n.actor || 0;
      n = {..._EFX.runOps({...n, actor: si}, r.ops, r.fired.join(", ")), actor: was};
    }
    return n;
  }

  /* CR 4.4.3a. Runs over BOTH seats: an ally the opponent controls heals on
     their controller's schedule too, and building it one-sided now would be
     a bug to find later rather than a line to write now. */
  function endPhaseAllies(s){
    let n = s, healed = 0;
    for(const si of [0,1]){
      const sd = n.sides[si]; if(!sd || !sd.board) continue;
      /* count BEFORE, from the same predicate resetAllyLife uses: an ally
         carrying less than its printed life. `life` is the current total and
         `card.life` the base — the reset is the engine's, not a second copy. */
      const hurt = sd.board.filter(b => b && b.kind==="ally" && b.card &&
                                        b.card.life!=null && b.life!=null && b.life < b.card.life).length;
      if(!hurt) continue;
      n = resetAllyLife(n, si);
      healed += hurt;
    }
    n = L(n, healed ? `(a) ${healed} all${healed>1?"ies":"y"} heal to base life.`
                    : "(a) No allies to heal.");
    return n;
  }
  const pickArsenal = idx => setG(s=>{
    { const _w = sheetFirst(s); if(_w) return _w; }
    if(s.mode!=="arsenal") return s;
    let n = {...s};
    const arSide = youMut(n);
    arSide.arsenal = you(s).hand[idx];
    arSide.hand = you(s).hand.filter((_,i)=>i!==idx);
    return afterArsenal(L(n,`(b) ${DawnGame.sv(you(n), "set")} a card face down in the arsenal.`));
  });
  const skipArsenal = () => setG(s=> sheetFirst(s) || (s.mode==="arsenal" ? afterArsenal(L(s,"(b) Arsenal left empty — nothing set.")) : s));
  /* HEAVE — THE ARSENAL SET THAT PAYS (v3.32). The gate, the payment, the
     face-up put and the mint all live in `DawnEffects.heave`; this is the
     trainer's half of the CHOICE, and judge.js asks the identical body
     from its own arsenal pause. A rule restated here would be a second
     description of it. */
  const doHeave = () => setG(s=>{
    { const _w = sheetFirst(s); if(_w) return _w; }
    if(s.mode!=="arsenal") return s;
    const off = DawnEffects.heaveOffer(s, 0);
    if(!off) return L(s, "Nothing in hand can be heaved right now.");
    const h = DawnEffects.heave(s, 0, off.uid);
    let n = h.game;
    for(const m of h.msgs) n = L(n, m);
    /* THE THIRD FACE-UP SITE FIRES ITS TRIGGER NOW (v4.05). `heave` is
       module-level and cannot reach `faceUpArsenal`, so v3.71 recorded
       this as the one put that fired nothing. The zone is "hand" — heave
       takes the card from there, and a default of "deck" would fire the
       from-the-deck trigger off it (v3.72). */
    n = faceUpArsenal({...n, actor:0}, [], "Heave", "hand", true);
    if(h.ops.length) n = runOps({...n, actor:0}, h.ops, "Heave");
    return afterArsenal(n);
  });
  /* Steps (c) through (f), for WHICHEVER SEAT is ending its turn. Split
     from endTurn only because (b) is a choice that has to pause for the
     player; this is the same procedure continuing.

     ONE END PHASE, NOT TWO (v2.71). Until now this procedure existed for
     seat 0 alone, and seat 1's "end phase" was a stand-in refill buried
     in newTurn — the same two-unrelated-bodies shape that let clash fire
     on the wrong trigger for five versions, and the reason effects keyed
     to the opponent's turn had nothing to expire on. It is actor-relative
     throughout and `foeEnd` runs it with the actor borrowed to seat 1,
     exactly the way the solo mirror borrowed it for a card's own effects
     before v2.83 burned it.

     Everything that genuinely DIFFERS by seat is named as a difference
     rather than as a second copy: the invented fatigue loss stays seat
     0's (the dummy reshuffles instead, which is a training affordance and
     is logged), and CR 4.4.3f's second sentence — the first-turn refill
     for all OTHER players — is asked of whichever seat is not ending. */
  function endPhaseCF(s, si){
    const _prevActor = s.actor||0;
    let n = {...s, actor:si};
    const _me = () => act(n).name, _you = () => /^you$/i.test(act(n).name||"");

    /* FROSTBITE'S END-PHASE EXPIRY MOVED TO `beginEndPhase` (v3.17), and
       the reason is worth keeping. It sat here, a step or two after "the
       beginning", with a comment arguing that (a) ally life and (b) the
       arsenal set are all that run ahead of it and neither plays a card,
       so nothing in the pool can tell the difference. That was true of
       the STATE and false of the FEED: Frostbite's printed line is "at
       the beginning of your end phase, destroy this", so the token is
       minted with `sd:"end"` and the arena sweep — which DOES run at the
       beginning — took it first. The thaw then found nothing and its line
       never printed, so the player was told a token "is destroyed" rather
       than what it cost them. Two readers of one rule, and the order
       decided which one spoke.
       Both now sit in `DawnEffects.beginEndPhase`, in that order. */

    /* (c) CR 4.4.3c — pitch zones to the BOTTOM of their owners' decks.
       Both seats: it says "their pitch zone", not the turn-player's. */
    let pitched = 0;
    for(const si of [0,1]){
      const sd = n.sides[si]; if(!sd || !sd.pitch || !sd.pitch.length) continue;
      pitched += sd.pitch.length;
      n = {...n, sides: n.sides.map((x,i)=> i!==si ? x : {...x, deck:[...x.deck, ...x.pitch], pitch:[]})};
    }
    n = L(n, pitched
      ? `(c) ${pitched} pitched card${pitched>1?"s":""} to the bottom of the deck.`
      : "(c) Pitch zones are empty.");

    /* (d) CR 4.4.3d — the turn-player untaps all permanents they control.
       `weaponUsed` is what "tapped" means here: a weapon that has swung and
       an equipment ability that has been activated. It used to happen at the
       top of the next turn, which is the same thing today and is NOT once a
       second seat has a turn between yours. */
    const tapped = Object.keys(act(n).weaponUsed||{}).length;
    actMut(n).weaponUsed = {};
    /* THE HERO UNTAPS HERE TOO (v3.48). RULING (user, 2026-08-25): a
       tapped hero "cannot be tapped again to pay a cost", and this is the
       step that lifts it — the turn-player's own, so a hero tapped by an
       opponent stays tapped for the rest of that turn and no longer. */
    if(act(n).heroTapped) actMut(n).heroTapped = false;
    /* AND THE ARENA'S PERMANENTS (v6.75). CR 4.4.3d (rules.fabtcg.com/en/cr/04-game-structure/,
       verbatim): "The turn-player untaps all permanents they control." An ally that tapped to
       attack untapped at the start of its controller's NEXT turn here and at the end phase at the
       table (judge (d)), so it sat tapped through the opponent's turn on this board alone. Latent
       today (no ally in the pool prints an Instant {t} ability) and one rule now: the start-of-turn
       untaps in `newTurn` and `foeBegin` are gone. */
    actMut(n).board = (act(n).board||[]).map(b => b && b.spent ? {...b, spent:false} : b);
    n = L(n, tapped ? `(d) ${_me()} untap${_you()?"":"s"} ${tapped} permanent${tapped>1?"s":""}.`
                    : `(d) Nothing of ${_you()?"yours":_me()+"'s"} is tapped.`);
    /* THE OTHER SEAT KEEPS ITS TAPS AND LOSES ITS ALLOWANCE. CR 4.4.3d
       untaps the TURN-PLAYER's permanents only, but `Once per Turn` is a
       per-turn allowance that comes back at every turn boundary for
       everyone — and `weaponUsed` conflates the two. They coincide for a
       weapon swing (action speed, so a seat only reaches it on its own
       turn) and stop coinciding at the first `Instant - Once per Turn`
       equipment ability, which is Crucible of Aetherweave, which is in
       Iyslander's gear and is now activatable on the opponent's turn.
       Without this, using it on their turn would make it once per ROUND. */
    foeMut(n).weaponUsed = perTurnCleared(foe(n));

    /* (e) CR 4.4.3e — "All players lose all action points and resource
       points." ALL, not just the turn-player. Score counts wasted resources,
       so the fizzle is tallied as it happens. */
    let fizzled = 0;
    for(const si of [0,1]){
      const sd = n.sides[si]; if(!sd) continue;
      const lost = sd.res||0; fizzled += lost;
      n = {...n, sides: n.sides.map((x,i)=> i!==si ? x : {...x, res:0, ap:0, wasted:(x.wasted||0)+lost})};
    }
    n = L(n, fizzled
      ? `(e) All players lose their points — ${fizzled} floating resource${fizzled>1?"s":""} wasted.`
      : "(e) All players lose their points — nothing was floating.");
    /* THE "THIS TURN" GRANTS EXPIRE IN `beginEndPhase` NOW (v3.34), where
       both boards reach them and both seats are covered. This line cleared
       two of the five, for one seat, on one board. */

    /* (f) CR 4.4.3f — the turn-player draws up to intellect.

       THE RESHUFFLE IS SEAT 1'S ONLY, AND IT IS A TRAINING AFFORDANCE.
       "A sparring partner that decked out would stop sparring" — true of
       the prop, false of a hero, so it is gated on `_dummy` and logged.
       SEEDED, because the recycle decides every card the opponent draws
       for the rest of the game and an unseeded shuffle there breaks
       replay exactly when the game gets interesting. */
    let need = Math.max(0, act(n).int - act(n).hand.length);
    if(need > 0 && act(n).deck.length < need && (act(n).grave||[]).length && bOf(n, si)._dummy){
      const _gs = rngShuffle(n.rng, act(n).grave); n.rng = _gs.rng;
      const rc = actMut(n); rc.deck = [...act(n).deck, ..._gs.arr]; rc.grave = [];
      n = L(n, "The dummy gathers its spent cards and shuffles them back — it never tires.");
    }
    const drawn = act(n).deck.slice(0,need);
    actMut(n).hand=[...act(n).hand,...drawn]; actMut(n).deck=act(n).deck.slice(need);
    n = L(n, drawn.length ? `(f) ${_me()} draw${_you()?"":"s"} ${drawn.length} back up to intellect ${act(n).int}.`
                          : `(f) Hand is already at intellect ${act(n).int} — no draw.`);
    /* RULING (Knucklehead): the rolled intellect governs THIS draw, then the
       lingering macro clears — restore the printed value once cards are in.
       ONE BODY, BOTH BOARDS (v3.49). This was written out here and nowhere
       else, so at the table the rolled value never came back at all. */
    { const _si = DawnEffects.settleIntellect(n, actorOf(n));
      n = _si.game; for(const m of _si.msgs) n = L(n, m); }
    n.revealed = null;

    /* CR 4.4.3f, second sentence — "If it is the first turn of the game,
       ALL OTHER PLAYERS draw cards until the number of cards in their
       hand is equal to their hero's intellect." This is what pays the
       second player back for blocking the opening swing. It used to live
       in finishBlock's `_opening` branch, which could only ever say it
       for seat 0; asked of whichever seat is NOT ending, it covers both
       seatings with one rule. */
    const firstTurn = si===0 ? n.turn===1 : !!n._opening;
    if(firstTurn){
      const oNeed = Math.max(0, foe(n).int - foe(n).hand.length);
      if(oNeed > 0){
        const os = foeMut(n); const take = foe(n).deck.slice(0,oNeed);
        os.hand = [...foe(n).hand, ...take]; os.deck = foe(n).deck.slice(take.length);
        if(take.length) n = L(n, `${DawnGame.sv(foe(n),"draw")} back up to ${foe(n).int} — first turn of the game (CR 4.4.3f).`);
      }
    }

    /* THERE IS NO DECK-OUT LOSS (retired at v4.26): CR 4.5.3 lists three ways to lose (life zero or no hero, an effect, a concession) and an empty
       deck is not one. A hero who runs out keeps playing and loses only at life 0; the dummy still swings, so the game ends the way the CR says.
       (Rule numbers lead on purpose: test/sync.test.js scans raw source, comments included. Full history: LESSONS.md.) */
    if(drawn.length < need)
      n = L(n, `${_me()} draw${_you()?"":"s"} ${drawn.length} of ${need} — the deck is empty. (CR 4.5.3: that is not a loss.)`);
    /* THE BLOODROT TICK IS GONE (v3.09). It was a per-turn, unavoidable,
       never-expiring drain standing in for a token that prints a ONE-SHOT
       the controller can buy out of: "at the beginning of your end phase,
       destroy this, then it deals 2 damage to you unless you pay
       {r}{r}{r}". Bloodrot Pox is a real board Aura now, so its own
       schedule fires it (`sweepArena`, both boards) and `selfPayOr` offers
       the escape hatch the tick never did. */
    return {...n, actor:_prevActor};
  }
  /* The player's end phase continues here after the arsenal choice, then
     hands the turn to seat 1. */
  function afterArsenal(s){
    const n = endPhaseCF(s, 0);
    return n.over ? n : foeBegin(n);
  }
  /* PITCH ON DEMAND, AT INSTANT SPEED. Pitching is never proactive (ruling,
     2026-08-01): the pool is filled only when something costs more than you
     hold. On your own turn `mode:"pay"` asks with a sheet; in an instant
     window there is no room to pause for one, so the lowest advisor-valued
     cards go first — the rule auto-pitch has always followed for the
     arsenal instant, stated once here instead of twice. Returns null when
     the cost cannot be reached, so the caller refuses rather than half-
     pitching a card away for nothing. */
  /* `autoPitch` MOVED to engine/effects.js in v2.77 — see the bridge-less

     It was this board's own pause for ONE of the four "when this defends"
     families — `mode: "defpay"`, a queue, an action bar, a statusline and a
     peek chip, all for `payCost` — which is exactly why the other three
     never reached the wall the player raises. The shared `promptQ` carries
     all four now and `PromptSheet` renders them, so `takeIt` pauses once and

     with no pitch, and CR 4.4.3e takes every floating resource from BOTH
     seats at every end phase — so on the opponent's turn, which is the only
     turn this wall is raised on, the player holds 0 and the Pay button was
     disabled. Brothers in Arms' printed +2{d}, built at v4.53 for this exact
     wall, was therefore unreachable unless the player happened to have
     overpaid for an instant in the same window. The shared sheet pitches on
     demand (`applyAnswer`'s `autoPitch`, RULING 2026-08-01) — which is what
     the DUMMY's wall has always done with the identical card.
     WEAKER than printed, so the one-sided fairness sweep cannot see it, and
     `tier: full` throughout, so coverage cannot either. */
  function newTurn(s){
    const hEntry = s.chain.length ? [{turn:s.turn,links:s.chain},...(s.chainHist||[])].slice(0,8) : (s.chainHist||[]);
    /* THE STAND-IN REFILL IS GONE (v2.71), and its removal is the whole
       point of seat 1 having an end phase. It used to top the opponent's
       hand up here, every turn, to stand in for the turn it never took —
       and ROADMAP-OPPONENT.md's warning was explicit that the moment seat
       1 gets a real end phase this draw MOVES there and becomes
       turn-1-only for both seats per CR 4.4.3f. It has moved: `foeEnd`
       runs the same `endPhaseCF` your turn does, and (f) draws seat 1 to
       its own intellect there. Adding that one without removing this one
       draws twice — so this is the removal half. */
    /* THE HEADER FIRST (v5.28, QUEUE item 14 [16]): the thaw, the suspense
       tick and the crumbling auras below are this turn's start-phase
       triggers, and printed above the header they read as the last end
       phase. */
    let n = L({...s}, `— Turn ${s.turn+1}. Start phase (CR 4.2) — no priority. —`);
    /* THE DRACONIC GRANT'S CLEAR LEFT HERE AT v4.06. It was
       `youMut(n).dracNext = false` — seat 0 only, on one board, at a TURN
       boundary when the card prints "this combat CHAIN". All three are now
       `effects.closeChainGrants`, the shared body both boards already call,
       and `newTurn` calls it below — so this line was subsumed rather than
       dropped. A second clear left standing is dead rules code, which reads
       as a rule somebody can reach (v3.67, v3.77, v3.82). */
    const oSide = oppMut(n); oSide.blockedHand = 0; oSide.chainBlocked = [];
    /* the chain the PLAYER blocked on closes with the turn too (v4.96) */
    youMut(n).chainBlocked = [];
    /* SUSPENSE TICKS AT THE BEGINNING OF THE TURN (v3.00), and the rule is
       `DawnEffects.tickSuspense` — pure, so a drill can drive it, and
       shared, so judge.js runs the identical schedule. It hands back the
       payload rather than running it, because "your next attack this turn
       gets +N{p}" is actor-relative and each board reaches runOps its own
       way. */
    /* freeze lifts at the start of the freezing player's turn (Cold Snap) */
    { const fz = DawnEffects.thawFreeze(n, 0);
      if(fz.thawed.length){ n = fz.game; n = L(n, `${fz.thawed.join(", ")} thaws — free to be played again.`); } }
    /* WHAT WAS ARMED AGAINST THIS TURN TURNS ON (v3.29). A separate call
       from the suspense tick, which returns early when nothing is
       suspended — piggybacking there would arm nothing on most turns. */
    { const aw = DawnEffects.armNextTurn(n, 0);
      if(aw.msgs.length){ n = aw.game; aw.msgs.forEach(m => { n = L(n, m); }); } }
    { const sp = DawnEffects.tickSuspense(n, 0);
      if(sp.msgs.length){ n = sp.game; sp.msgs.forEach(m => { n = L(n, m); });
        if(sp.ops.length) n = _EFX.runOps(n, sp.ops, sp.fired.join(", ")); } }
    /* EVERYTHING SCHEDULED TO DIE AT THE TOP OF THE TURN GOES NOW — the
       crumbling auras and the counter tokens alike — and anything they
       were holding up (the arcane shield, the life lock) goes with them.

       IT WAS TWO BLOCKS UNTIL v3.07, and neither was shared. This one was
       written out inline, so the table had no clock on the arena at all
       and Pyroglyphic Protection prevented arcane damage there forever.
       The other re-read the raw printed line to find Might, Agility and
       Vigor — it had to, because "destroy this, THEN X" parsed to X alone
       and left no `sd` stamp to sweep on (v2.56 built that block for
       exactly this reason, when all three tokens were inert and every
       clash payoff in Kayo's deck was decoration). The parser reads both
       halves now and the token mint stamps `sd`, so one call covers both
       and judge.js makes the same one.

       Simplification, carried over and still stated rather than hidden: a
       token that leaves the arena strictly ceases to exist, and these go
       to the graveyard like the crumbling auras. Nothing reads them there
       — Kayo's discard checks require the `_disc` stamp — so it is a
       display difference, not a rules one.

       It hands back the departure payload rather than running it, the
       same contract `tickSuspense` above keeps and for the same reason. */
    { const sw = DawnEffects.sweepArena(n, 0, "turn");
      if(sw.msgs.length){ n = sw.game; sw.msgs.forEach(m => { n = L(n, m); });
        if(sw.ops.length) n = _EFX.runOps(n, sw.ops, sw.fired.join(", ")); } }
    /* The recycle log moved with the recycle, into endPhaseCF's (f). What
       stays is the running-dry notice, which is about the board you are
       looking at now rather than about the draw that caused it. */
    if(opp(n).deck.length < opp(n).int)
      n = L(n, `${opp(n).name} is running dry — ${opp(n).deck.length} left in deck, short of a full hand of ${opp(n).int}.`);
    /* THE TURN BOUNDARY CLOSES THE CHAIN TOO, so the chain-scoped grants
       go here as well (v3.87) — the same shared body. */
    let fresh = DawnEffects.closeChainGrants({...n, turn:s.turn+1,
      chain:[], chainHist:hEntry, chainOpen:false, featured:null, boostChain:0, mode:"act"});
    const nt = youMut(fresh);
    /* THE ACTION POINT IS ISSUED AT THE BEGINNING OF THE ACTION PHASE

       here now happens in the previous end phase where CR 4.4.3d puts it.
       Both were invisible while one seat acted and both are real the moment
       a second seat has a turn between yours. */
    nt.hist = freshHist();

       above ARE those triggers. */
    let out = fresh;

    out = L(out, "— Action phase (CR 4.3). You have 1 action point and priority. —");

  uE(()=>{

  },[]);
  uE(()=>{ if(g.over&&g.over.win) onRecord(h.k, g.over.score); },[g.over]);
  /* a peek is about one card in one window — drop it when either changes, so

  uE(()=>{ setPeek(null); },[g.mode, g.bphase, g.turn]);
  uE(()=>{ if(peek && !peekables().some(c=>c.uid===peek.uid)) setPeek(null); },[g.sides]);

  const toks = [

       and render as the actual token card. A text chip alongside the card
       would just be the old counter wearing a disguise. */
    you(g).buffNext>0 && ["Next atk +"+you(g).buffNext],
    you(g).amp>0 && ["Amp "+you(g).amp],
    /* THE POOL **PLUS** THE PERMANENTS (v4.34). `sd.ward` is only the
       windowed "prevent the next N this turn" family now; a Ward 3 aura
       on the board prevents just as much and used to show as nothing.
       `wardTotal` is the one reader of "what can this seat turn aside". */
    wardTotal(you(g))>0 && ["Ward "+wardTotal(you(g))], you(g).awd>0 && ["ArcWard "+you(g).awd],
    you(g).soul.length>0 && ["Soul ×"+you(g).soul.length]
  ].filter(Boolean);
  const handGear = you(g).gear.map((gr,i)=>({gr,i})).filter(x=>["1h","2h","off","qvr"].includes(slotOf(x.gr).z));
  const armor = you(g).gear.map((gr,i)=>({gr,i})).filter(x=>!["1h","2h","off","qvr"].includes(slotOf(x.gr).z));
  const is2H = handGear[0] && slotOf(handGear[0].gr).z==="2h";
  const featured = (g.mode==="stack" && g.pend) ? {card:g.pend.card, chip:"ON THE STACK — "+g.pend.total} : (g.mode==="boostpick" && g.pending) ? {card:g.pending.card, chip:"BOOST? — banish the top card"} : (g.mode==="fusepick" && g.pending) ? {card:g.pending.card, chip:"FUSION? — reveal a "+g.pending.types.join("/")+" card"} : (g.mode==="chargepick" && g.pending) ? {card:g.pending.card, chip:"CHARGE? — a card from hand to your soul"} : (g.mode==="pay" && g.pending) ? {card:g.pending.card, chip:"PAYING — PITCH "+Math.max(0,payCost(g, g.pending.card, g.pending.from)-you(g).res)+" MORE"}
    : g.featured;
  const prevLinks = g.chain.slice(0,-1).reverse();
  const gearBtn = (gr,i,extra,st,back) => {
    const w = isWeapon(gr), blockable = g.mode==="block" && !DawnGame.gearDeclareWhy(gr);
    const spent = gr.destroyed || (gr.curDef!=null && gr.curDef===0);
    const sel = you(g).blockG.includes(i);
    const tapped = w && !!you(g).weaponUsed[gr.uid] && /\btap\b|\{t\}/i.test(gr.tx||"");
    return (
      <button key={gr.uid} className={"g clip-sm"+(spent?" used":"")+(extra||"")
          +(peek&&(peek.uid===gr.uid||peek.uid===("gp"+gr.uid))?" peek":"")}
        style={Object.assign({}, st||{}, sel?{borderColor:"var(--b)",boxShadow:"0 0 0 1px var(--b)"}:null)}
        onClick={(()=>{
          /* the same two-tap as the hand: peek the thing you are about to
             commit to — the ability's own card when the piece has one. */
          /* IRON DOES TWO THINGS ON THEIR TURN, NOT ONE (v2.71). Defending

             legal in any window you hold priority (CR 8.1.6), and before
             this the reaction step offered nothing but the zoom modal —

             opponent's turn", had no window in which it could ever be

          const instAb = instantAbilityReady(gr, you(g));

          return tapTwice(gr, "tap again for full card", ()=>setZoom(gr));

        <span className={"tapwrap"+(tapped?" tapped":"")}>{back || <CardFrame card={{...gr, def:(gr.def!=null||gr.curDef!=null)?gearDef(gr):null}} className="sm"/>}</span>
        {(()=>{ const ct=you(g).counters[gr.uid]; if(!ct||(!ct.steam&&!ct.rust&&!ct.pow)) return null; return <span className="ctr">{ct.steam?<span className="cc steam">S{ct.steam}</span>:null}{ct.rust?<span className="cc rust">R{ct.rust}</span>:null}{ct.pow?<span className="cc pow">+{ct.pow}</span>:null}</span>; })()}

  /* TWO-TAP HAND. A card in the rail is 80px wide — unreadable on a phone —

     second tap on the same card commits. Works the same for choosing pitch,
     declaring defenders, reactions and the arsenal, because every one of
     those flows through this one cell. Peeking is always allowed, even on a
     card you cannot legally play: looking is free. */
  const handAct = (c,i) => {
    if(g.mode==="block"){
      const fx = fxParse(c);
      /* the react branch hands EVERY tap to playRx rather than pre-screening
         it: playRx names both of its refusals — wrong window (CR 8.1.2a /
         8.1.3a) and not enough floating — and a tap that silently does
         nothing is the one outcome this UI never wants. */

         (v4.96) — pre-screening here made a dimmed card a dead tap */
      else toggleBlock("h",c.uid);

    else if(g.mode==="stack") playRx(i);
    else if(g.mode==="foeturn") playFoeTurnRx(i);
    else if(g.mode==="arsenal") pickArsenal(i);
    else tryPlay(c,"hand",i);
  };
  const peekVerb = c => {
    if(g.inspect) return "inspect";
    if(g.mode==="pay") return you(g).paySel.includes(you(g).hand.indexOf(c)) ? "tap again to unpitch" : "tap again to pitch";
    if(g.mode==="arsenal") return "tap again to set in arsenal";
    if(g.mode==="stack") return "tap again to react";
    if(g.mode==="block") return g.bphase==="react" ? "tap again to react" : "tap again to defend";
    if(g.mode==="foeturn") return "tap again to play at instant speed";
    return "tap again to play";
  };

     equipment abilities in the playable rail. The preview has to be able to
     find any of them, so the lookup spans every zone a tap can originate in.
     An ability is peeked as its powCard rather than the piece, because the
     ability's text is what you are deciding about. */
  const peekables = () => {
    const y = you(g);
    const out = y.hand.slice();
    if(y.arsenal) out.push(y.arsenal);
    y.gear.forEach(gr => { out.push(gr); if(gr.powCard) out.push(gr.powCard); });
    /* A board permanent's ABILITY is peeked as its powCard, the same way an
       equipment ability is — the ability's text is what you are deciding
       about, not the permanent. peekables must span every zone a tap can
       originate in or the preview silently fails while the tap still arms. */
    (y.board||[]).forEach(b => { if(b && b.card){ out.push(b.card); const bp = boardPow(b); if(bp) out.push(bp); } });
    /* a hand card's ABILITY is a separate tappable cell, so it is a
       separate peekable — peekables must span every zone a tap can
       originate in or the preview silently fails while the tap still arms */
    y.hand.forEach(c => { const hp = handPow(c); if(hp) out.push(hp); });

       to him and the discard makes Might. One tap target cannot mean two
       things, so the ability gets its own. */
    const hp = handAbilityOK(g, c) ? handPow(c) : null;
    return [
      <button key={c.uid} className={"hc clip-sm"+(sel?" sel":"")+(dim?" dis":"")+(peek&&peek.uid===c.uid?" peek":"")}
        onClick={tapTwice(c, peekVerb(c), ()=>handAct(c,i))}>
        {sel && g.mode==="block" && <span className="defsel">⛨ DEF</span>}
        <CardFrame card={c} zone="hand"/>
      </button>,
      hp && <button key={hp.uid} className={"hc clip-sm"+(peek&&peek.uid===hp.uid?" peek":"")}

            <div className="hpane vfill">
              <div className="paneflag"><span>Opponent board</span><span>swipe → graveyard</span></div>
              <div className="midrow">
                <ArmorGrid gear={opp(g).gear} own={false} cell={(x,z,back)=>(
                  <button key={x.uid} className={"g clip-sm"+(gearDef(x)===0?" used":"")} style={{gridArea:z}}
                    onClick={()=>{ if(!back) setZoom(x); }}>
                    {back || <CardFrame card={{...x, def:gearDef(x)}} className="sm"/>}
                  </button>)}/>
                <div className="arscol"><div className="slot clip-sm">arsenal —</div><span className="zlbl">holds {opp(g).hand.length} · blocks from hand</span></div>
                <DeckPitchCol deck={opp(g).deck} pitch={opp(g).hand} title="Hand" hidden/>
              </div>

                <div className="wslot clip-sm"><span className="wempty">weapon —</span></div>
                <div className="heromid clip-sm">
                  <div className="dhead" style={{width:36}}><span>✕</span><span>✕</span></div>
                  <span className="hname">{opp(g).name}</span>
                  <LifeNum n={opp(g).hp} className="hlife2"/>
                  {/* THE PREDICTION IS HONEST BECAUSE THE SWING IS SCRIPTED.

            <div className="hpane">

        {/* ---- SCREEN 2: chain command center ---- */}
        <div className="vscreen" ref={chainRef}>
          <div className="hscroll" ref={midRef}>

              <div style={{marginTop:6}}><Ticker feed={g.feed}/></div>
              {/* THE WINDOW IS PASSED, NOT SNIFFED (v2.83). `advise` used to

                  at the table — judge.js seeds `mode` once and never writes
                  it, so a table game would be coached as an action phase from

              <Advisor g={g} ctx={{window:g.mode, incoming:g.incoming, runeDmg:built.runeDmg, hpow:built.HPOW, wateryGrave:built.wateryGrave, noOpWhy:DawnEffects.arsNoOpWhy, arsTurnPays:DawnJudge.arsTurnPays, cloakFor:DawnJudge.cloakFor, arsenalPayable:DawnJudge.arsenalPayable, condGaNow:DawnJudge.condGaNow, effPowerNow:DawnJudge.effPowerNow, boostOn:g.boostOn, dBlk:opp(g).gear.filter(x=>gearDef(x)>0).length + opp(g).hand.filter(c=>(c.def||0)>0).length, dDef:gearDef(opp(g).gear.find(x=>gearDef(x)>0)||{})||1}} read={built.read}/>
              <div className="gamelog" style={{marginTop:8}}>{[...g.feed].reverse().map((l,i)=><div key={i} className="gl"><PipLine s={l}/></div>)}</div>
            </div>
            {/* PANE 2 — PLAY: dummy hand · stack|card|defend · your hand+extras */}
            <div className="hpane playpane">
              <BoardStrip sd={opp(g)} who={opp(g).name.split(",")[0]} open={sheet==="opp"} onOpen={()=>flip("opp")}/>
              <div className="playmid">
                <div className="sidecol stack">
                  <div className="scol-lbl">Stack</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack" && g.pend) ? [g.pend.card] : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
                <div className="centerslot">
                  {featured
                    ? (featured.foe
                        ? <div className="featfoe"><span className="fx2">✕✕</span><b>{featured.dmg}</b><span>Dummy</span></div>

                  <LinkStamp l={featOutcome(featured, g.chain)} seq={g.chain.length}/>
                  <LinkSfx chain={g.chain}/>
                </div>
                <div className="sidecol defend">
                  <div className="scol-lbl">Defend</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack") ? g.stack.filter(l=>l.k==="def").map(l=>l.gi!=null?opp(g).gear[l.gi]:opp(g).hand.find(c=>c.uid===l.uid)).filter(Boolean) : (g.mode==="block") ? [...you(g).blockH.map(uid=>you(g).hand.find(c=>c.uid===uid)), ...you(g).blockG.map(gi=>you(g).gear[gi])].filter(Boolean) : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
              </div>
              {g.mode==="pay" && (()=>{const sel=you(g).paySel.reduce((a,i)=>a+(you(g).hand[i].pitch||0),0); const need=Math.max(0,payCost(g, g.pending.card, g.pending.from)-you(g).res-sel); return <div className="statusline">Paying <b>{g.pending.card.name}</b> — pitch below · {need>0?<span>need <b>{need}</b> more</span>:<span>covered ✓</span>}<button onClick={cancelPay}>✕ cancel</button></div>;})()}
              {g.mode==="block" && <div className="statusline">{g.bphase==="defend" ? <span>Tap hand &amp; equipment to defend — incoming <b>{g.incoming}</b></span> : <span>Reaction step — <b>{you(g).res}</b> floating; a reaction pitches for the rest as you play it</span>}</div>}
