<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>DAWNBLADE — Silver Age Training Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --r:#C4302B; --y:#E8B33C; --b:#3B6FB0;
  --ink:#14100E; --forge:#241B16; --forge2:#2E241D;
  --bone:#E8DFD0; --bone-dim:#B8AC98; --line:#4A3B2E;
  --ok:#7BA05B;
  --tv:calc(100vh - 152px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:'Spline Sans',sans-serif;font-size:15px;line-height:1.45;overscroll-behavior:none}
#root{min-height:100%;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:'Big Shoulders Display',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.mono{font-family:'Spline Sans Mono',monospace}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}
.clip{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.clip-sm{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}

/* shell */
.shell{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px calc(64px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 10px}
.brand{font-family:'Big Shoulders Display';font-weight:800;font-size:22px;letter-spacing:.06em}
.brand em{font-style:normal;color:var(--y)}
.tag{font-size:10px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.14em}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:2px;background:var(--ink);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
.tab{flex:1;max-width:132px;text-align:center;padding:9px 4px;font-family:'Big Shoulders Display';font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
.tab.on{color:var(--ink);background:var(--y)}
.tab.on.fight{background:var(--r);color:var(--bone)}

/* db banner */
.dbbar{display:flex;align-items:center;gap:8px;background:var(--forge);border:1px solid var(--line);padding:8px 10px;margin-bottom:10px;font-size:12px}
.dbbar .dot{width:8px;height:8px;flex:none;background:var(--y);animation:pulse 1.1s infinite alternate}
.dbbar.ok .dot{background:var(--ok);animation:none}
.dbbar.err .dot{background:var(--r);animation:none}
@keyframes pulse{to{opacity:.25}}
.dbbar .retry{margin-left:auto;color:var(--y);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.prog{height:3px;background:var(--forge2);margin-top:5px;width:100%}
.prog i{display:block;height:100%;background:var(--y);transition:width .3s}

/* hero select — full roster on one screen, smash-style */
.hgrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.hgrid .hcard{width:calc((100% - 20px)/6)}
.hcard{position:relative;background:var(--forge);border:1px solid var(--line);padding:0;overflow:hidden;display:flex;flex-direction:column}
.hcard img.art{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 16%;filter:saturate(.92)}
.hcard .fallbackart{aspect-ratio:1/1;font-size:12px}
.hcard .nm{display:block;padding:2px 3px;background:var(--forge2);border-top:1px solid var(--line);font-family:'Big Shoulders Display';font-weight:700;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-top:auto}
.hcard.ch1{box-shadow:inset 0 -2px 0 var(--r)}
.hcard.ch2{box-shadow:inset 0 -2px 0 var(--y)}
.hcard.ch3{box-shadow:inset 0 -2px 0 var(--b)}
.hcard .best{position:absolute;top:2px;right:2px;background:var(--ink);border:1px solid var(--y);color:var(--y);font-size:8px;padding:0 3px;font-family:'Spline Sans Mono'}
.openslot{border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--bone-dim);background:transparent;min-height:64px}
.openslot b{font-family:'Big Shoulders Display';font-size:16px;font-weight:700;line-height:1}
.openslot span{font-size:7.5px;letter-spacing:.14em;text-transform:uppercase}
.roster-legend{display:flex;gap:12px;margin:8px 2px 2px;font-size:10px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.1em;align-items:center;flex-wrap:wrap}
.roster-legend i{width:8px;height:8px;display:inline-block;margin-right:4px}
.fallbackart{width:100%;aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--forge2),var(--ink));font-family:'Big Shoulders Display';font-size:34px;font-weight:800;color:var(--line)}

/* hero sheet */
.sheet{background:var(--forge);border:1px solid var(--line);padding:14px;margin-top:12px}
.sheet h2{font-size:26px;font-weight:800}
.sheet .cls{color:var(--y);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.statrow{display:flex;gap:14px;margin:10px 0;font-family:'Spline Sans Mono';font-size:13px}
.statrow b{color:var(--y)}
.bigbtn{display:block;width:100%;padding:14px;background:var(--r);color:var(--bone);font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-top:12px}
.bigbtn.alt{background:var(--forge2);border:1px solid var(--line);color:var(--bone);font-size:15px;padding:11px}
.bigbtn:disabled{opacity:.4}

/* deck viewer */
.dsec{margin:14px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim)}
.dsec.p1{color:var(--r)}.dsec.p2{color:var(--y)}.dsec.p3{color:var(--b)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cgrid .cc{position:relative;padding:0;background:var(--forge)}
.cgrid img{aspect-ratio:5/7;object-fit:cover;width:100%}
.cc .q{position:absolute;top:4px;left:4px;background:var(--ink);border:1px solid var(--line);font-family:'Spline Sans Mono';font-size:11px;padding:1px 5px}
.ccfall{aspect-ratio:5/7;display:flex;flex-direction:column;justify-content:space-between;padding:8px;border:1px solid var(--line);font-size:11px;line-height:1.25}
.ccfall .pn{font-family:'Big Shoulders Display';font-weight:700;font-size:13px}
.pb1{box-shadow:inset 0 -3px 0 var(--r)}.pb2{box-shadow:inset 0 -3px 0 var(--y)}.pb3{box-shadow:inset 0 -3px 0 var(--b)}

/* battle */
.board{display:flex;flex-direction:column;gap:10px}
.dummy{background:var(--forge);border:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:12px}
.dummy .hp{font-family:'Big Shoulders Display';font-weight:800;font-size:40px;line-height:1;color:var(--r)}
.dummy .lbl{font-size:11px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.1em}
.dummy .incoming{margin-left:auto;text-align:right;font-family:'Spline Sans Mono';font-size:12px;color:var(--y)}
.mystat{display:flex;gap:8px;flex-wrap:wrap;font-family:'Spline Sans Mono';font-size:12px}
.pill{background:var(--forge);border:1px solid var(--line);padding:5px 9px}
.pill b{color:var(--y)}
.pill.hp b{color:var(--r)}
.log{background:var(--forge);border:1px solid var(--line);padding:9px 10px;font-size:12.5px;min-height:44px;color:var(--bone)}
.log .dim{color:var(--bone-dim)}
.zone{font-size:11px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.12em;margin:2px 2px 4px}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hand .hc{position:relative;padding:0;background:var(--forge);border:1px solid var(--line);transition:transform .12s}
.hand .hc img{aspect-ratio:5/7;object-fit:cover;width:100%}
.hand .hc.sel{transform:translateY(-6px);border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.hand .hc.dis{opacity:.45}
.hand .hc .cost{position:absolute;top:3px;left:3px;background:var(--ink);font-family:'Spline Sans Mono';font-size:11px;padding:1px 5px;border:1px solid var(--line)}
.hand .hc .pw{position:absolute;bottom:3px;left:3px;background:var(--ink);font-family:'Spline Sans Mono';font-size:11px;padding:1px 5px;border:1px solid var(--r);color:var(--r)}
.hand .hc .df{position:absolute;bottom:3px;right:3px;background:var(--ink);font-family:'Spline Sans Mono';font-size:11px;padding:1px 5px;border:1px solid var(--b);color:var(--b)}
.arsenalrow{display:flex;gap:8px;align-items:stretch}
.arsenalrow .slot{width:64px;flex:none;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:4px}
.arsenalrow .slot img{aspect-ratio:5/7;object-fit:cover}
.gearrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gearrow .g{flex:none;width:56px;position:relative;padding:0;background:var(--forge);border:1px solid var(--line)}
.gearrow .g img{aspect-ratio:5/7;object-fit:cover}
.gearrow .g.used{opacity:.35}
.gearrow .g .gd{position:absolute;bottom:2px;right:2px;background:var(--ink);font-family:'Spline Sans Mono';font-size:10px;padding:0 4px;border:1px solid var(--b);color:var(--b)}
.actrow{display:flex;gap:8px}
.actrow .a,.actbar .a{flex:1;padding:12px 6px;font-family:'Big Shoulders Display';font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:var(--forge2);border:1px solid var(--line)}
.actrow .a.go,.actbar .a.go{background:var(--r)}
.actrow .a.pay,.actbar .a.pay{background:var(--y);color:var(--ink)}
.actrow .a:disabled,.actbar .a:disabled{opacity:.4}
/* A NON-BUTTON in the action bar: the table uses it to say whose window
   is open, because a permanently dead "Done defending" reads as a broken
   screen rather than as CR 7.3.3. Same box, plainly not pressable. */
.actbar .a.dis,.actrow .a.dis{opacity:.55;font-style:italic;text-transform:none;letter-spacing:.02em;font-size:11.5px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.paymode{border:1px solid var(--y);background:rgba(232,179,60,.07);padding:8px 10px;font-size:12.5px}
.blockmode{border:1px solid var(--b);background:rgba(59,111,176,.08);padding:8px 10px;font-size:12.5px}

/* card modal */
.modal{position:fixed;inset:0;background:rgba(10,8,7,.82);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .inner{max-width:340px;width:100%}
.modal img{width:100%;border:1px solid var(--line)}
.modal .txt{background:var(--forge);border:1px solid var(--line);padding:10px;font-size:13px;margin-top:8px}
.modal .chip{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);border:1px solid var(--line);padding:2px 7px}

/* reveal + judge + misc */
.reveal{position:fixed;inset:0;background:rgba(10,8,7,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;text-align:center;padding:24px}
.reveal .card{width:200px;background:var(--forge);border:1px solid var(--y);padding:18px 14px;position:relative;overflow:hidden}
.reveal .card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--r),var(--y),var(--b));transform:translateX(-101%);animation:bleed 1.1s .15s forwards}
@keyframes bleed{60%{transform:translateX(0)}100%{transform:translateX(101%)}}
.reveal h3{font-size:22px;position:relative}
.reveal .rar{font-size:11px;letter-spacing:.2em;color:var(--y);text-transform:uppercase;position:relative}
.qopt{display:block;width:100%;text-align:left;padding:11px 12px;background:var(--forge);border:1px solid var(--line);margin-top:8px;font-size:14px}
.qopt.right{border-color:var(--ok);color:var(--ok)}
.qopt.wrong{border-color:var(--r);color:var(--r)}
.explain{border-left:3px solid var(--y);padding:8px 10px;background:var(--forge);margin-top:10px;font-size:13px}
.note{font-size:11.5px;color:var(--bone-dim);margin-top:10px;line-height:1.5}
.note a{color:var(--y)}
.win{border:1px solid var(--ok);background:rgba(123,160,91,.08);padding:12px;text-align:center}
.lose{border:1px solid var(--r);background:rgba(196,48,43,.08);padding:12px;text-align:center}
.cdnfail{display:none;padding:40px 20px;text-align:center;font-family:sans-serif;color:#E8DFD0}

/* v5: effects engine UI */
.fxdot{position:absolute;top:4px;right:4px;width:9px;height:9px;border:1px solid var(--ink)}
.fxdot.full{background:var(--ok)}.fxdot.part{background:var(--y)}.fxdot.none{background:#6B6258}
.cov{margin:12px 0 4px;font-size:12px}
.covbar{height:6px;background:var(--forge2);display:flex;margin-top:4px}
.covbar i{height:100%}
.covbar .cf{background:var(--ok)}.covbar .cp{background:var(--y)}.covbar .cn{background:#6B6258}
.fxlist{margin-top:6px;font-size:12px;border-top:1px solid var(--line);padding-top:6px}
.fxlist .fc{display:flex;gap:6px;margin:3px 0;align-items:flex-start}
.fxlist .fs{flex:none;font-family:'Spline Sans Mono';font-size:10px;padding:0 4px;border:1px solid var(--line);margin-top:1px}
.fxlist .fs.run{color:var(--ok);border-color:var(--ok)}
.fxlist .fs.noop{color:var(--y);border-color:var(--y)}
.fxlist .fs.skip{color:var(--bone-dim)}
.boardrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.boardrow .b{flex:none;width:56px;position:relative;padding:0;background:var(--forge);border:1px solid var(--line)}
.boardrow .b img{aspect-ratio:5/7;object-fit:cover}
.boardrow .b .sw{position:absolute;bottom:0;left:0;right:0;background:var(--r);font-family:'Spline Sans Mono';font-size:10px;text-align:center;padding:1px 0}
.boardrow .b.spent{opacity:.4}
.tokpills{display:flex;gap:6px;flex-wrap:wrap;font-family:'Spline Sans Mono';font-size:11px}
.tokpills .tk{border:1px solid var(--y);color:var(--y);padding:2px 7px}
.tokpills .tk.bad{border-color:var(--r);color:var(--r)}

/* vs strip — P1 / P2 slots under the roster */
.hcard.sel{outline:2px solid var(--y);outline-offset:-1px;z-index:1}
.vs{display:flex;align-items:stretch;gap:8px;margin-top:10px}
.vslot{flex:1;background:var(--forge);border:1px solid var(--line);padding:14px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:126px;position:relative;color:inherit}
.vslot.p1{box-shadow:inset 0 -3px 0 var(--r)}
.vslot.p2{box-shadow:inset 0 -3px 0 var(--b)}
.vslot.empty{border-style:dashed;justify-content:center;color:var(--bone-dim)}
.vslot .ptag{position:absolute;top:4px;left:6px;font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.12em}
/* THE P2 PICKER (v2.76). Sits at the foot of the slot so the portrait and
   the name stay the thing you read first; full width because it is a real
   choice, not a footnote. `.vslot.p2` is a div again rather than a button —
   a select inside a button swallows its own clicks — so the dummy keeps its
   poke on a nested button of its own. */
.vslot.p2{justify-content:flex-start}
.vslot .dmybtn{background:none;border:none;padding:0;color:inherit;cursor:pointer}
.foesel2{width:100%;margin-top:auto;background:var(--iron);color:var(--bone);
  border:1px solid var(--line);border-radius:2px;padding:4px 5px;font-size:10.5px;
  font-family:'Spline Sans Mono';letter-spacing:.02em}
.seatline{margin-top:6px;font-size:10.5px;color:var(--y);letter-spacing:.02em}
.vslot .port{width:62px}
.vslot img.art{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 16%}
.vslot .fallbackart{aspect-ratio:1/1;font-size:11px}
.vslot .vname{font-family:'Big Shoulders Display';font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-align:center}
.vslot .taunt{font-size:9px;color:var(--bone-dim);font-style:italic}
.vsmid{display:flex;align-items:center;font-family:'Big Shoulders Display';font-weight:800;font-size:24px;color:var(--y);padding:0 2px}
.dmy{display:flex;flex-direction:column;align-items:center;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
.dmy[data-bonk]{animation:bonk .55s ease-out, sway 3.4s ease-in-out .55s infinite}
.dhead{width:36px;height:30px;border-radius:4px;background:linear-gradient(160deg,#8A7355,#6F5B42);border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Spline Sans Mono';font-size:10px;color:var(--ink)}
.dbody{width:42px;height:16px;background:#5C4B37;border:1px solid var(--ink);border-top:none;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.dpost{width:7px;height:13px;background:var(--forge2);border:1px solid var(--line)}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2.2deg)}}
@keyframes bonk{0%{transform:rotate(0)}30%{transform:rotate(15deg)}60%{transform:rotate(-9deg)}100%{transform:rotate(0)}}

/* battle strip — appears when P1 is locked in */
.battlebtn{display:block;width:100%;margin-top:10px;padding:11px 8px;background:linear-gradient(180deg,#D43A34,var(--r) 55%,#9E2722);color:var(--bone);font-family:'Big Shoulders Display';font-weight:800;font-size:30px;letter-spacing:.24em;text-transform:uppercase;text-align:center;position:relative;overflow:hidden;text-shadow:0 2px 0 rgba(20,16,14,.35)}
.battlebtn::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(20,16,14,.14) 0 10px,transparent 10px 22px)}
.battlebtn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(232,223,208,.28) 50%,transparent 70%);transform:translateX(-120%);animation:bsweep 2.6s ease-in-out infinite}
@keyframes bsweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.battlebtn:disabled{filter:grayscale(.65) brightness(.7)}
.battlebtn span{position:relative;z-index:1}

/* match narration ticker + claude's call */
.ticker{position:sticky;top:0;z-index:35;background:rgba(20,16,14,.97);border:1px solid var(--line);border-left:3px solid var(--r);padding:7px 10px;display:flex;gap:9px;align-items:flex-start;min-height:42px}
.ticker .live{flex:none;display:flex;align-items:center;gap:4px;font-family:'Spline Sans Mono';font-size:9px;color:var(--r);letter-spacing:.14em;padding-top:2px}
.ticker .dot{width:6px;height:6px;border-radius:50%;background:var(--r);animation:pulse 1s infinite alternate}
.ticker .cap{font-size:12.5px;line-height:1.35;animation:capin .25s ease-out}
.ticker .more{margin-left:auto;flex:none;font-family:'Spline Sans Mono';font-size:9px;color:var(--bone-dim);border:1px solid var(--line);padding:1px 4px}
@keyframes capin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.adv{border:1px solid var(--y);background:rgba(232,179,60,.06)}
.advhead{width:100%;text-align:left;padding:7px 10px;font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.14em;color:var(--y);text-transform:uppercase}
.advbody{padding:0 10px 9px;font-size:13px}
.advwhy{font-size:11px;color:var(--bone-dim);margin-top:3px;line-height:1.4}

/* hero plate, combat chain, damage pops, sticky actions */
.heroplate{display:flex;gap:8px;align-items:center;background:var(--forge);border:1px solid var(--line);padding:6px 8px}
.heroplate .hport{width:40px;flex:none;padding:0}
.heroplate img.art{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 16%}
.heroplate .fallbackart{aspect-ratio:1/1;font-size:10px}
.heroplate .hinfo{flex:1;min-width:0}
.heroplate .hinfo b{font-family:'Big Shoulders Display';font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.heroplate .hab{display:block;font-size:10px;color:var(--bone-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heroplate .hlife{text-align:right;font-family:'Spline Sans Mono';flex:none}
.heroplate .hlife span{font-size:8px;color:var(--bone-dim);letter-spacing:.1em}
.heroplate .hlife b{display:block;font-size:22px;line-height:1;color:var(--r);font-family:'Big Shoulders Display'}
.heroplate .hact{flex:none;background:var(--y);color:var(--ink);font-family:'Big Shoulders Display';font-weight:800;font-size:12px;letter-spacing:.06em;padding:8px 9px}
.heroplate .hact:disabled{opacity:.35}
.chainwrap{margin-top:-2px}

/* A SPLIT CARD IS PRINTED SIDEWAYS, so it is TURNED to be read (v3.35).
   The database ships the art portrait with its content rotated; upright
   needs -90deg, which was checked by rendering both directions rather
   than reasoned about — 90deg comes out upside down.

   `--hzr` is the card's real aspect the other way up (546x763 -> 1.3974),
   and the two calcs derive the image box from it: `width` is 100/1.3974%
   of the frame's WIDTH, which equals the frame's height, and `height` is
   1.3974x the frame's HEIGHT, which equals its width. Rotated, that fills
   the landscape frame exactly with no crop. Keep the three in step. */
.cfw.hz{--hzr:1.3974;aspect-ratio:var(--hzr);overflow:hidden}
.cfw.hz>img,.cfw.hz>.ccfall{position:absolute;top:50%;left:50%;display:block;
  width:calc(100% / var(--hzr));height:calc(100% * var(--hzr));
  transform:translate(-50%,-50%) rotate(-90deg)}
/* the corner badges stay UPRIGHT — they are the engine's overlay, not
   part of the printed face, and a rotated pitch pip is unreadable */
.cfw.hz .b-atk,.cfw.hz .b-def{display:none}

.centerslot .featfoe b{font-size:36px}
.centerslot .featfoe .fx2{font-size:12px;padding:1px 7px}
.centerslot .featempty{width:100%;aspect-ratio:5/7;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;color:var(--bone-dim);padding:8px;line-height:1.45}
.centerslot .linkchip{font-size:9px;text-align:center}
.mini{border:1px solid var(--line);background:var(--forge);padding:4px 6px;font-size:10.5px;display:flex;flex-direction:column;gap:1px;line-height:1.3;word-break:normal;overflow-wrap:break-word;hyphens:none}
.mini.atk{border-left:2px solid var(--r)}
.mini.def{border-left:2px solid var(--b)}
.mini.foe{border-left:2px solid var(--r);background:rgba(178,60,60,.08)}
.mini.top{border-color:var(--y)}
.mini .mk{font-family:'Spline Sans Mono';font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim)}
.mini b{color:var(--r)}
.sidecol .mini{width:100%;box-sizing:border-box}
.statusline{flex:none;font-size:10.5px;color:var(--bone-dim);padding:5px 8px;background:var(--forge);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.statusline b{color:var(--y)}
.statusline button{background:none;border:1px solid var(--line);color:var(--y);font-size:9px;padding:1px 6px;margin-left:5px}
.phand{flex:none;display:flex;gap:5px;align-items:stretch;overflow-x:auto;padding:7px 8px;border-top:1px solid var(--line);background:var(--forge2);scroll-snap-type:x proximity}
.phand .hlbl{align-self:center}
.phand .hc{flex:none;width:80px;position:relative;padding:0;background:var(--forge);border:1px solid var(--line);scroll-snap-align:start;transition:transform .12s}
.phand .hc.sel{transform:translateY(-6px);border-color:var(--y);box-shadow:0 0 0 2px var(--y)}
.phand .hc.dis{opacity:.4}

/* v2.07 prompt sheet — the rulings ask for a popup that leaves the hand
   visible, so it docks above the action bar instead of covering the screen. */
.psheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--forge);
  border-top:2px solid var(--y);box-shadow:0 -14px 40px rgba(0,0,0,.6);
  max-height:64vh;display:flex;flex-direction:column;animation:pup .18s ease-out}
@keyframes pup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.psheet .ph{flex:none;display:flex;align-items:baseline;gap:8px;padding:10px 12px 6px}
.psheet .pt{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.psheet .psrc{font-size:10px;color:var(--y);text-transform:uppercase;letter-spacing:.1em}
.psheet .phint{flex:none;padding:0 12px 9px;font-size:11.5px;color:var(--bone-dim);line-height:1.45}
.psheet .prow2{flex:1;min-height:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:0 12px 10px}
.psheet .pcard{flex:none;width:86px;background:none;border:none;padding:0;position:relative;transition:transform .12s}
.psheet .pcard .cfw{border:1px solid var(--line);border-radius:3px;overflow:hidden}
.psheet .pcard.down{opacity:.5;transform:translateY(8px)}
.psheet .pcard.down .cfw{border-color:var(--r)}
.psheet .ptag{position:absolute;top:3px;left:3px;font-family:'Spline Sans Mono';font-size:8.5px;
  letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:2px;
  background:var(--ok);color:var(--ink)}
.psheet .pcard.down .ptag{background:var(--r);color:var(--bone)}
.psheet .pact{flex:none;display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--line);background:var(--forge2)}
.psheet .pact button{flex:1;padding:11px 8px;font-family:'Big Shoulders Display';font-weight:700;
  font-size:15px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;color:var(--bone-dim)}
.psheet .pact button.go{background:var(--y);color:var(--ink);border-color:var(--y)}
/* v2.17 — the other prompt variants: pick, modal, pay-or-decline, reveal */
.psheet .pact button.go.off{background:var(--forge);color:var(--bone-dim);border-color:var(--line)}
.psheet .pcard.sel .cfw{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.psheet .pcard.sel .ptag{background:var(--ok);color:var(--ink)}
.psheet .pcard.flat{opacity:1}
.psheet .pside{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--r);
  border:1px solid var(--r);border-radius:2px;padding:1px 5px;margin-left:auto}
.psheet .pcount{align-self:center;font-family:'Spline Sans Mono';font-size:10px;
  letter-spacing:.08em;color:var(--bone-dim);padding:0 4px}
.psheet .pmodal{flex:none;display:flex;flex-direction:column;gap:6px;padding:0 12px 10px}
.psheet .popt{text-align:left;padding:11px 12px;background:var(--forge2);border:1px solid var(--line);
  border-radius:3px;color:var(--bone);font-family:'Big Shoulders Display';font-weight:700;
  font-size:15px;letter-spacing:.04em}
.psheet .popt.on{border-color:var(--y);background:var(--y);color:var(--ink)}
.psheet .popt:disabled{opacity:.45}
.psheet .popt .sub{display:block;font-family:'Spline Sans Mono';font-weight:400;font-size:9.5px;
  letter-spacing:.05em;opacity:.75;margin-top:2px}

/* active-modifier rail — the engine tracks a lot of state the board never showed */
.rail{display:flex;gap:5px;flex-wrap:wrap;padding:5px 8px;background:var(--forge2);border-bottom:1px solid var(--line)}
.rail .rp{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;background:var(--forge);border:1px solid var(--line);color:var(--bone-dim)}
.rail .rp.on{border-color:var(--y);color:var(--y)}
.rail .rp.warn{border-color:var(--r);color:#f0a9a5}

/* v2.19 — the two-tap hand. First tap peeks the card at a readable size,
   second tap commits. The peek docks above the action bar rather than
   covering the screen, so the rail underneath stays visible and the second
   tap has somewhere to land. */
/* THE WRAPPER MUST NOT EAT THE TAP (v2.36). It spans the full width and is
   mostly empty space, and with pointer-events:auto that empty space sat on
   top of the hand rail and swallowed every tap aimed at a card. On a tall
   window nothing overlapped and it looked fine; on a 393x852 phone the rail
   lands underneath it, the second tap hit the wrapper's dismiss handler
   instead of the card, and hand cards became UNPLAYABLE — tap, peek, tap,
   peek, forever. The comment above always said the rail underneath had to
   stay tappable; this is what makes that true. Only the visible preview
   takes pointer events, so tapping the card art still dismisses. */
/* `--peekbot` is MEASURED off the live hand rail (see the uE in PeekDock, which
   BOTH boards render) so the preview always sits ABOVE the hand rather than on
   top of it. The 112px fallback is the old flat value — the action-bar
   clearance — used only before the first measurement or when no rail is on
   screen. It is NOT a safe resting value: at 393x852 the rail spans y 628..754
   and 112px puts the preview inside it, where it eats the tap it is supposed to
   be explaining (v2.36 / v2.52). */
.peekwrap{position:fixed;left:0;right:0;bottom:var(--peekbot,112px);z-index:55;display:flex;
  flex-direction:column;align-items:center;gap:0;pointer-events:none;
  animation:pkin .14s ease-out}
.peekwrap>*{pointer-events:auto}
@keyframes pkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.peekcard{width:172px;max-width:52vw;filter:drop-shadow(0 10px 26px rgba(0,0,0,.75))}
.peekcard .cfw{border:1px solid var(--y);border-radius:4px;overflow:hidden}
.peekbar{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:5px;
  background:var(--forge);border:1px solid var(--y);border-radius:3px;padding:4px 10px;
  box-shadow:0 6px 18px rgba(0,0,0,.6)}
.peekbar .pknm{font-family:'Big Shoulders Display';font-weight:700;font-size:14px;
  letter-spacing:.03em;text-transform:uppercase;color:var(--bone);line-height:1.1}
.peekbar .pkhint{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--y)}
.hand .hc.peek,.chand .hc.peek,.phand .hc.peek{transform:translateY(-7px);
  outline:1px solid var(--y);outline-offset:-1px}
.hand .hc.peek.dis,.chand .hc.peek.dis,.phand .hc.peek.dis{opacity:.85}

/* v2.14 — the pregame throw. Seating is decided before a card is drawn,
   so this is its own screen rather than a banner on the loadout. */
.rps{padding:14px 12px 18px;display:flex;flex-direction:column;gap:12px}
.rps .rtitle{font-family:'Big Shoulders Display';font-weight:800;font-size:28px;
  letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1}
.rps .rsub{text-align:center;font-size:11.5px;color:var(--bone-dim);line-height:1.5;margin:-6px 0 0}
.rps .rtable{display:flex;align-items:stretch;gap:8px}
.rps .rseat{flex:1;background:var(--forge);border:1px solid var(--line);border-radius:4px;
  padding:10px 8px;text-align:center;min-height:104px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px}
.rps .rseat.win{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
.rps .rseat .rwho{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--bone-dim)}
.rps .rseat .rglyph{font-size:38px;line-height:1}
.rps .rseat .rname{font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--bone)}
.rps .rseat .rscore{font-family:'Big Shoulders Display';font-weight:800;font-size:24px;color:var(--y)}
.rps .rvs{flex:none;align-self:center;font-family:'Big Shoulders Display';font-weight:800;
  font-size:15px;color:var(--bone-dim);letter-spacing:.08em}
.rps .rcall{text-align:center;font-size:12.5px;line-height:1.5;min-height:36px;padding:0 4px}
.rps .rcall b{color:var(--y)}
.rps .rthrows{display:flex;gap:8px}
.rps .rthrows button{flex:1;padding:14px 4px 11px;background:var(--forge2);border:1px solid var(--line);
  border-radius:4px;color:var(--bone);display:flex;flex-direction:column;align-items:center;gap:5px}
.rps .rthrows button:disabled{opacity:.4}
.rps .rthrows button .g{font-size:30px;line-height:1}
.rps .rthrows button .l{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.11em;text-transform:uppercase}
.rps .rseatpick{display:flex;gap:8px}
.rps .rseatpick button{flex:1;padding:13px 8px;font-family:'Big Shoulders Display';font-weight:700;
  font-size:17px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:4px;background:var(--forge2);color:var(--bone)}
.rps .rseatpick button.go{background:var(--y);color:var(--ink);border-color:var(--y)}
.rps .rseatpick button .sub{display:block;font-family:'Spline Sans Mono';font-weight:400;
  font-size:9px;letter-spacing:.06em;text-transform:none;color:inherit;opacity:.75;margin-top:2px}
.rps .rlog{font-family:'Spline Sans Mono';font-size:9.5px;line-height:1.7;color:var(--bone-dim);
  background:var(--forge);border:1px solid var(--line);border-radius:3px;padding:7px 9px;max-height:88px;overflow-y:auto}
.rps .rback{align-self:center;font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bone-dim);background:none;border:none;padding:6px}
/* who is across the table — chosen at the scout panel (v2.41) */
.foepick{display:flex;flex-direction:column;gap:5px;margin:10px 0 0}
.foepick label{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--bone-dim)}
.foepick select{width:100%;background:var(--ink);color:var(--bone);border:1px solid var(--line);
  border-radius:2px;padding:9px;font-family:inherit;font-size:12.5px;min-height:42px}
/* ---- JUDGE!! — the in-game bug report (v2.22) ---- */
.judgebtn{flex:none;background:var(--r);color:var(--bone);border:none;border-radius:2px;
  font-family:'Spline Sans Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.1em;
  padding:3px 8px;cursor:pointer;text-transform:uppercase;line-height:1.4}
.judgebtn:active{transform:translateY(1px)}
.bugwrap{position:fixed;inset:0;z-index:80;background:rgba(8,6,5,.78);
  display:flex;align-items:flex-end;justify-content:center}
.bugsheet{width:100%;max-width:560px;background:var(--forge);border-top:2px solid var(--r);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.bugh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.bugt{font-family:'Big Shoulders Display';font-weight:800;font-size:21px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--r)}
.bugmeta{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:var(--bone-dim);
  letter-spacing:.06em;text-transform:uppercase}
.bughint{font-size:11.5px;color:var(--bone-dim);line-height:1.45;margin:7px 0 8px}
.bugta{width:100%;min-height:96px;background:var(--ink);color:var(--bone);border:1px solid var(--line);
  border-radius:3px;padding:9px 10px;font:13px/1.5 inherit;resize:vertical}
.bugok{margin-top:8px;font-size:11.5px;color:var(--y);font-family:'Spline Sans Mono',monospace;
  letter-spacing:.04em}
/* A blocked clipboard is not a success. Never dressed as one. */
.bugok.warn{color:var(--r)}
.bugrow{display:flex;gap:7px;margin-top:10px}
.bugrow .bigbtn{flex:1;font-size:12px;padding:11px 6px}
/* ---- the table: find an opponent, and the networked board ------------ */
.tblwrap{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.tblhead{font-family:'Big Shoulders Display';font-weight:800;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--y)}
.tblcard{background:var(--forge);border:1px solid var(--line);padding:14px 12px}
.tblcode{font-family:'Spline Sans Mono',monospace;font-size:46px;letter-spacing:.28em;text-align:center;color:var(--y);padding:10px 0 4px;text-shadow:0 2px 0 rgba(20,16,14,.5)}
.tblin{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);font-family:'Spline Sans Mono',monospace;font-size:34px;letter-spacing:.24em;text-align:center;text-transform:uppercase;padding:12px 6px}
.tblin:focus{outline:none;border-color:var(--y)}
.tblstat{font-size:12.5px;color:var(--bone-dim);text-align:center;min-height:18px}
.tblstat.live{color:var(--y)}
.tblerr{font-size:13px;color:var(--r);background:rgba(196,48,43,.12);border:1px solid var(--r);padding:9px 10px}
.tblrow{display:flex;gap:8px}
.tblrow .bigbtn{flex:1}
.tbldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;animation:tblpulse 1.4s ease-in-out infinite}
@keyframes tblpulse{0%,100%{opacity:.35}50%{opacity:1}}

.mboard{display:flex;flex-direction:column;gap:8px}
.mseat{display:flex;align-items:center;justify-content:space-between;background:var(--forge);border:1px solid var(--line);padding:8px 10px}
.mseat.me{border-color:var(--y)}
.mseat .who{font-family:'Big Shoulders Display';font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.mseat .hp{font-family:'Spline Sans Mono',monospace;font-size:22px;color:var(--y)}
.mseat .zn{font-size:11px;color:var(--bone-dim);font-family:'Spline Sans Mono',monospace}
.mstep{display:flex;align-items:center;justify-content:space-between;background:var(--forge2);border:1px solid var(--line);padding:7px 10px;font-size:12px}
.mstep .sv{font-family:'Spline Sans Mono',monospace;color:var(--y);text-transform:uppercase;letter-spacing:.06em}
.mlink{font-style:normal;color:var(--r);animation:tblpulse 1.4s ease-in-out infinite}
.mturn{font-family:'Big Shoulders Display';font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:7px;border:1px solid var(--line)}
.mturn.mine{background:var(--y);color:var(--ink)}
.mturn.theirs{background:var(--forge);color:var(--bone-dim)}
.mhand{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0}
.mcard{flex:0 0 auto;min-width:62px;background:var(--forge);border:1px solid var(--line);padding:6px 7px;text-align:center;font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--bone-dim)}
.mcard .nm{display:block;color:var(--bone);font-size:12px}
.mcard.on{border-color:var(--y);background:var(--forge2);color:var(--y)}
.mcard.blk{border-color:var(--b)}
.macts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.macts .a{padding:11px 4px;font-size:13px}
.mfeed{background:var(--forge);border:1px solid var(--line);padding:8px 10px;font-size:12px;color:var(--bone-dim);min-height:56px;max-height:110px;overflow-y:auto}
.mfeed div:last-child{color:var(--bone)}
.mnote{font-size:11px;color:var(--bone-dim);line-height:1.5;border-left:2px solid var(--line);padding-left:8px}

/* ---- the lobby: hero, throw, seating (v2.49) ---- */
.tblhead .tblseat{float:right;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--bone-dim);text-transform:none;padding-top:10px}
.lobsteps{display:flex;gap:6px}
.lobstep{flex:1;text-align:center;font-family:'Big Shoulders Display';font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 2px;border:1px solid var(--line);color:var(--bone-dim)}
.lobstep.on{border-color:var(--y);color:var(--y);background:var(--forge2)}
.lobstep.done{color:var(--ok);border-color:var(--ok)}
.lobheroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.lobhero{background:var(--forge);border:1px solid var(--line);padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.lobhero.on{border-color:var(--y);background:var(--forge2)}
.lobhero:disabled{opacity:.4}
.lobhero .lhport{width:100%;aspect-ratio:1;overflow:hidden;border:1px solid var(--line)}
.lobhero .lhn{font-family:'Big Shoulders Display';font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone)}
.lobhero.on .lhn{color:var(--y)}
.lobhero .lhc{font-size:9.5px;color:var(--bone-dim);text-align:center;line-height:1.2}
.lobseat{display:flex;flex-direction:column;gap:10px;align-items:center}
.foefixed{background:var(--ink);border:1px solid var(--y);color:var(--y);padding:9px 10px;font-size:14px;text-align:center}

/* ---- the networked board ---- */
.mseat .zn{display:flex;gap:9px}
.mz{display:inline-flex;gap:3px;align-items:baseline}
.mz b{color:var(--bone);font-size:13px}
.mgear{display:flex;gap:4px;flex-wrap:wrap;min-height:24px}
.mpiece{flex:0 0 auto;background:var(--forge);border:1px solid var(--line);padding:4px 7px;font-size:10.5px;color:var(--bone-dim);display:inline-flex;gap:5px;align-items:center}
.mpiece b{font-family:'Spline Sans Mono',monospace;color:var(--b);font-size:12px}
.mpiece.on{border-color:var(--y);color:var(--y)}
.mpiece.blk{border-color:var(--b);color:var(--b)}
.mpiece.dead{opacity:.35;text-decoration:line-through}
.mpiece.dim{opacity:.45}
.mpiece.arena{border-color:var(--ok);color:var(--ok)}
.mpiece.ars{border-color:var(--y)}
.mchain{display:flex;gap:8px;align-items:center;background:var(--forge2);border:1px solid var(--r);padding:6px 9px;font-size:12px}
.mchain .cl{font-family:'Big Shoulders Display';font-weight:800;letter-spacing:.1em;color:var(--r);font-size:12px}
.mchain .cn{flex:1;color:var(--bone)}
.mchain .cp{font-family:'Spline Sans Mono',monospace;color:var(--y);font-size:15px}
.mchain .ct{font-size:11px;color:var(--bone-dim)}
.mhand{align-items:flex-start}
.mhand .mcard{min-width:0;padding:2px;border:1px solid transparent;background:none;position:relative}
.mhand .mcard .cfw{width:66px}
.mhand .mcard.on{border-color:var(--y)}
.mhand .mcard.blk{border-color:var(--b)}
.mhand .mcard.dim{opacity:.42}
.mcard .pv{position:absolute;right:3px;bottom:3px;background:var(--ink);border:1px solid var(--y);color:var(--y);font-family:'Spline Sans Mono',monospace;font-size:10px;padding:0 3px}
.mpay{border:1px solid var(--y);background:var(--forge);padding:8px}
.mpay .payhead{font-size:12px;color:var(--bone-dim);margin-bottom:6px}
.mpay .payhead b{color:var(--y);font-family:'Spline Sans Mono',monospace;font-size:14px}
.mtgt{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--bone-dim)}
.mtgt .a{padding:6px 10px;font-size:12px}
.mover{border:1px solid var(--y);background:var(--forge2);padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px}
.mover b{font-family:'Big Shoulders Display';font-weight:800;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.mover span{font-size:12px;color:var(--bone-dim)}
.phasebar{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:4px;padding:3px 7px;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  font-size:11px;letter-spacing:.02em;opacity:.85}
.phasebar b{font-weight:700}
.phasebar .ph{text-transform:lowercase;opacity:.9}
</style>
</head>

/* HOW SEATING IS DECIDED. "coin" is a TESTING AFFORDANCE (user, 2026-08-08):

   starting your ninth Kayo game of the afternoon, and its ties replay, so a
   run of them can cost half a dozen taps before a game begins.

   `engine/rps.js` IS UNTOUCHED AND STILL DRILLED, and so is every line of
   the throw UI below — this is a flag, not a deletion, because it is going
   back in for launch. Set it to "rps" and the throw returns exactly as it
   was.

   WHAT DOES NOT CHANGE: the flip is drawn from the SAME seeded sub-stream
   the throw used, so a match is still reproducible from its seed; and the
   WINNER STILL CHOOSES, because "the winner decides who goes first" is the
   rule, not a feature of throwing hands. A coin that seated you directly
   would be a rules change wearing a convenience hat. */

window.DATA_VER = "sage-v12"; /* v3.34: cards carry `hz` (`played_horizontally`), which is the database SAYING a card is a SPLIT card — two halves on one card, told apart by `tt`, playable one or both (Meld). A warm sage-v11 cache has no `hz` on any card, so both split cards would silently keep running BOTH halves for free with no choice offered. v2.44: cards carry `ty`, the STRUCTURED type array. `tt` is a display string and the two disagree on 5 database records — it calls Den of the Spider an "Action Defense Reaction", and a reaction cannot be an action. A warm sage-v10 cache has no `ty` on any card, so every type question would fall back to parsing the display string. v2.35: cards carry `prs` (image per SET), which is what lets a card resolve to its Silver Age printing instead of the database's arbitrary first — a warm sage-v9 cache has no `prs` at all and every card would fall back. v2.23: resolveEntry now carries an ally's `life` (the DB's `health`). It used to drop it, so allies had no life and could not be attacked at all — a warm sage-v8 cache has no life on any ally. v2.13: Crouching Tiger + Inner Chi join NEEDED — a warm sage-v7 cache has neither */

<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useMemo,useCallback} = React;

/* ---------- storage ---------- */
const store = {
  get(k,f){ try{const v=localStorage.getItem("dawnblade."+k); return v==null?f:JSON.parse(v);}catch(e){return f;} },
  set(k,v){ try{localStorage.setItem("dawnblade."+k, JSON.stringify(v));}catch(e){} }
};

/* ---------- helpers ---------- */
const PITCH_NAME = {1:"red",2:"yellow",3:"blue"};

const PARSED = {}; HEROES.forEach(h=>{ PARSED[h.k]=parseDeck(DECKS[h.k]); });

/* every card name we need from the database */
const NEEDED = new Set();
Object.values(PARSED).forEach(d=>{
  NEEDED.add(norm(d.hero.name));
  d.gear.forEach(e=>NEEDED.add(norm(e.name)));
  d.deck.forEach(e=>{ NEEDED.add(norm(e.name)); if(e.name.includes("//")) NEEDED.add(norm(e.name.split("//")[0])); });
});

/* print codes + hero name stems for robust DB matching */
const CODES = new Set();
Object.values(PARSED).forEach(d=>{ [d.hero].concat(d.gear,d.deck).forEach(e=>{ if(e.code) CODES.add(e.code); }); });
const HERO_STEMS = HEROES.map(h=>norm(PARSED[h.k].hero.name));
DUMMY_GEAR.forEach(nm=>NEEDED.add(norm(nm)));
DUMMY_DECK.forEach(([nm])=>NEEDED.add(norm(nm)));
/* cards the pool never lists but effects can mint at runtime */
["Crouching Tiger","Inner Chi"].forEach(nm=>NEEDED.add(norm(nm)));

/* ---------- card database (the-fab-cube, open data) ---------- */
function useCardDB(){
  const [state,setState] = useState({status:"idle",pct:0,byNP:{},byName:{},byCode:{},count:0,err:null});
  const load = useCallback(async(force)=>{
    setState(s=>({...s,status:"loading",pct:0,err:null}));
    try{
      let cards = null;
      if(!force){
        const cached = store.get("dbcache_"+DATA_VER, null);
        if(cached && Array.isArray(cached)) cards = cached;
      }
      if(!cards){
        const res = await fetch(DBSRC);
        if(!res.ok) throw new Error("HTTP "+res.status);
        const total = +res.headers.get("content-length") || 0;
        let text;
        if(res.body && total){
          const reader = res.body.getReader(); const chunks=[]; let got=0;
          for(;;){ const {done,value}=await reader.read(); if(done)break;
            chunks.push(value); got+=value.length;
            setState(s=>({...s,pct:Math.min(99,Math.round(got/total*100))})); }
          const buf=new Uint8Array(got); let o=0; chunks.forEach(c=>{buf.set(c,o);o+=c.length;});
          text = new TextDecoder().decode(buf);
        } else { text = await res.text(); }
        const all = JSON.parse(text);
        cards = [];
        all.forEach(c=>{
          if(!c || !c.name) return;
          const nm = norm(c.name);
          const isTok = /token/i.test(c.type_text||"") || /token/i.test((c.types||[]).join(" "));
          /* MIRRORS cards.js mapDbCard — see its header note. `bySet` is what
             lets a card wear its Silver Age face instead of whatever printing
             the database listed first; first printing per set wins, which is
             stable because foiling and art variations share one image_url. */
          const prints={}, bySet={};
          (c.printings||[]).forEach(pr=>{
            const id = pr.id || pr.identifier || pr.set_printing_unique_id || null;
            const url = pr.image_url || pr.image || null;
            if(url){
              if(id) prints[id]=url;
              if(pr.set_id && !bySet[pr.set_id]) bySet[pr.set_id]=url;
              if(!prints._first) prints._first=url;
            }
          });
          const isHero = /hero/i.test(c.type_text||"") && HERO_STEMS.some(st=>nm.includes(st));
          const hasCode = Object.keys(prints).some(id=>id!=="_first" && CODES.has(id));
          if(!NEEDED.has(nm) && !isTok && !isHero && !hasCode) return;
          cards.push({
            n:c.name, p:toNum(c.pitch), c:toNum(c.cost), pw:toNum(c.power),
            d:toNum(c.defense), hp:toNum(c.health), int:toNum(c.intelligence),
            tt:c.type_text||((c.types||[]).join(" ")),
            /* mirrors engine/cards.js mapDbCard — the STRUCTURED type array,
               which is the authority where `tt` is only a display string.
               They disagree on 5 records and it is not cosmetic: `tt` calls
               Den of the Spider an "Action Defense Reaction", which would
               make a defence reaction playable on your own turn. Change
               both, and bump DATA_VER when you do. */
            /* IS THIS A SPLIT CARD? (v3.34) The database says so itself, and the
               flag is the authority — `//` in the type line is how two typeboxes
               are RENDERED, not what makes a card a split card. Exactly two
               records in this pool carry it, and both print Meld.

               A split card is ONE card with two halves: one pitch value, one
               defence value, one card in hand and one card in the graveyard. The
               halves are told apart by `tt`, which is the one place the boundary
               survives — the structured `ty` array flattens both faces into a
               single list (v2.39). */
            hz:!!c.played_horizontally,
            ty:(c.types||[]).slice(),
            kw:(c.card_keywords||[]), gkw:(c.granted_keywords||[]),
            tx:c.functional_text_plain||c.functional_text||"", pr:prints, prs:bySet
          });
        });
        store.set("dbcache_"+DATA_VER, cards);
      }
      const byNP={}, byName={}, byCode={};
      cards.forEach(c=>{
        const k=norm(c.n);
        byNP[k+"|"+(c.p==null?0:c.p)]=c;
        (byName[k]=byName[k]||[]).push(c);
        Object.keys(c.pr||{}).forEach(id=>{ if(id!=="_first") byCode[id]=c; });
      });
      setState({status:"ready",pct:100,byNP,byName,byCode,count:cards.length,err:null});
    }catch(e){ setState(s=>({...s,status:"error",err:String(e&&e.message||e)})); }
  },[]);
  useEffect(()=>{ load(false); },[load]);
  return [state,load];
}

/* ============================================================

function GravePane({sd, who, back, mine}){

/* The peeked card, docked ABOVE the action bar so the hand stays visible

   THE MEASUREMENT LIVES HERE, WITH THE THING IT POSITIONS (v2.52).
   It used to be a `uE` inside `Battle`, so the table — which renders this
   same component — never measured at all and fell back to the CSS's flat

      raf = requestAnimationFrame(place);

         table stacks three scrolling screens, so `querySelector` returned
         the CHAIN screen's rail while you were peeking from your board —
         and because that rail sits mostly-but-not-quite off the top, it
         cleared the old "is it off screen" guard and produced a ~893px

         viewport, invisible, on every card interaction on that screen.

         Most-visible-wins needs no refs and no knowledge of which board is
         rendering, which is what keeps one component serving both. */

/* ============================================================
   JUDGE!! — THE SHEET, FOR BOTH BOARDS (v2.51)

   `navigator.clipboard.writeText` REJECTS WITH NotAllowedError even on a
   real tap, in a secure context, with the document focused. Verified on
   the deployed site: clipboard-write is a permission, and where it is not
   granted the async API simply refuses. The old code had no fallback and
   told the player "copy failed — use Download", so the fastest path from
   noticing a bug to reporting it was broken. Worse, its `else` branch
   claimed SUCCESS when the API was absent entirely — a report that was
   never copied, reported as copied.

   So: try the async API, fall back to the legacy execCommand path (which
   needs no permission), and if BOTH fail select the text so it can be

function copyText(txt){
  const legacy = () => {

    } catch(e){ return "manual"; }

const COPY_MSG = {copied:"Copied to clipboard.",
  manual:"This browser blocked the clipboard — use Save report instead.",
  downloaded:"Saved to your downloads."};

/* One sheet, both boards. `report` is a thunk so the state is read at the

function JudgeSheet({open, onClose, report, meta, warn}){
  const [note,setNote] = uS("");
  const [said,setSaid] = uS(null);

  const run = fn => { setSaid(null); fn(); };
  const doCopy = () => run(()=>copyText(DawnReport.text(...report(note))).then(setSaid));
  const doSave = () => run(()=>{
    const [g,ctx] = report(note);
    const blob = new Blob([DawnReport.text(g,ctx)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = DawnReport.filename(g,ctx);
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    setSaid("downloaded");
  });
  return (
    <div className="bugwrap" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="bugsheet clip">
        <div className="bugh">
          <span className="bugt">Judge!!</span>
          <span className="bugmeta">{meta}{warn>0 ? ` · ⚠ ${warn} invariant${warn>1?"s":""}` : " · state clean"}</span>
        </div>
        <p className="bughint">What looked wrong? The whole board — zones, counters, chain,
          the feed and any invariant violations — is captured with it, so one line is plenty.</p>
        <textarea className="bugta" autoFocus placeholder="e.g. Look Tuff attacked for 4, should have been 3 — I never got asked to pay"
          value={note} onChange={e=>{ setNote(e.target.value); setSaid(null); }}/>
        {said && <div className={"bugok"+(said==="manual"?" warn":"")}>{COPY_MSG[said]||said}</div>}
        <div className="bugrow">
          <button className="bigbtn alt" onClick={onClose}>Close</button>
          <button className="bigbtn alt" onClick={doCopy}>Copy</button>
          <button className="bigbtn" onClick={doSave}>Save report</button>
        </div>
      </div>
    </div>
  );
}

/* WHERE ARE WE? — the turn and the phase, on the log screen (v3.19).
   Reported from play: the feed says what just happened and the board says
   what you hold, and nothing on screen says which part of the turn you are
   standing in. In a training sim the phase IS the lesson — "you cannot play
   that here" only teaches something if the player can see where "here" is.

   IT READS THE TRAINER'S VOCABULARY, DELIBERATELY. `mode`/`bphase` are
   authoritative in `Battle` and the derived `phase`/`step` are the v2.27
   shadow; at the TABLE it is the other way round and `mode` is seeded once
   and never written again. So this takes the label it needs from the board
   that owns it rather than sniffing, which is the rule `advise` was one
   line from breaking (v2.83) — a frozen field reads as an answer.

   Pure, and it takes each board's own words. */
function phaseLabel(mode, bphase, over){
  if(over) return "game over";
  if(mode === "block") return bphase === "react" ? "reaction step" : "defend step";
  if(mode === "stack") return "attack — reaction step";
  if(mode === "pay") return "paying a cost";
  if(mode === "arsenal") return "end phase — arsenal";
  if(mode === "boostpick") return "boost?";
  if(mode === "targetpick") return "choosing a target";
  if(mode === "act") return "your action phase";
  return mode || "—";
}

/* THE SAME QUESTION, IN THE TABLE'S WORDS. judge.js drives `phase`/`step`
   out of `priority.js`; `mode` is seeded into its opening state and never
   written again, so calling `phaseLabel` here would print "your action
   phase" for the whole game — present, plausible, and frozen, which is
   worse than absent (v2.83).

   "your action phase" is NOT `phase === "action"`: the combat chain lives
   inside the TURN PLAYER's action phase, so while you defend against their
   swing the phase is still action and simply is not yours. `seat` is what
   tells them apart. */
function stepLabel(g, seat){
  if(g.over) return "game over";
  const mine = g.turnPlayer === seat;
  if(g.phase === "start") return mine ? "your start phase" : "their start phase";
  if(g.phase === "end")   return mine ? "your end phase"   : "their end phase";
  if(g.step && g.step !== "layer")
    return (mine ? "your attack — " : "their attack — ") + g.step + " step";
  return mine ? "your action phase" : "their action phase";
}

function Ticker({feed}){
  const [idx,setIdx]=uS(0);
  uE(()=>{
    if(idx>=feed.length-1) return;
    const backlog = feed.length-1-idx;
    const t=setTimeout(()=>setIdx(i=>i+1), backlog>2?1200:1900);
    return ()=>clearTimeout(t);
  },[idx,feed.length]);
  const shown = feed[Math.min(idx,feed.length-1)]||"";
  const backlog = Math.max(0,feed.length-1-idx);
  return (
    <div className="ticker">
      <span className="live"><span className="dot"/>LIVE</span>
      <span className="cap" key={idx}>{shown}</span>
      {backlog>1 && <span className="more">+{backlog}</span>}
    </div>
  );
}
function Advisor({g,ctx,read}){
  const [open,setOpen]=uS(()=>store.get("adv",true));
  const rec = uM(()=>{ try{return advise(g,ctx);}catch(e){return {line:"(advisor hiccup)",why:String(e)};} },[g]);
  if(g.over) return null;
  return (
    <div className="adv clip-sm">
      <button className="advhead" onClick={()=>setOpen(o=>{store.set("adv",!o);return !o;})}>✦ Claude's call {open?"▾":"▸"}</button>
      {open && <div className="advbody">
        <div>{rec.line}</div>
        {rec.why ? <div className="advwhy">{rec.why}</div> : null}
        {g.turn===1 && you(g).hist.atk===0 && you(g).hist.non===0 && read ? <div className="advwhy">{read}</div> : null}
      </div>}
    </div>
  );
}

/* ---------- BATTLE (v5: effects live) ---------- */
function ZoneStrip({label,none,hand,arsenal,pitch}){

  return (
    <div className="zstrip">
      <div className="zlbl">{label}</div>
      <div className="zrow"><span className="zk">Hand {hand.length}</span>
        <div className="zthumbs">{hand.map((c,i)=><div key={i} className="mini"><CardImg card={c}/></div>)}</div>
      </div>
      <div className="zrow"><span className="zk">Arsenal</span>
        {arsenal ? <div className="mini"><CardImg card={arsenal}/></div> : <span className="zempty">empty</span>}
      </div>

        <div className="zpitch">{[1,2,3].map(p=><span key={p} className="zpchip" style={{borderColor:PD[p],color:PD[p]}}>{p}:{pitch.filter(c=>c.pitch===p).length}</span>)}</div>
      </div>

/* `first` is the seat decided by the pregame throw: 0 = you, 1 = the
   opponent. Player-as-side-0 / opponent-as-side-1 is the same indexing
   engine/sides.js uses, so this prop already speaks the two-player
   vocabulary the state migration is moving toward. */
/* ============================================================
   buildSide and the equipment slot rules now live in
   **engine/build.js** (Phase 1). They are RULES — a hero build reads
   printed passives off its own text and deals from the seeded stream;
   defaultPicks decides how much iron a hero may legally wear — and
   neither had a drill while they sat in here. That cost the v2.41
   eight-gear bug, which every card-level tool passed straight over
   because no card was misread: the QUANTITY was illegal.
   ============================================================ */

/* `DUMMY_BUILD` LIVED HERE UNTIL v2.81 and is now `build.buildVanilla` —
   one copy, reachable by a drill, holding the same discipline it always
   did: every passive written out rather than defaulted, so a passive
   added to `buildSide` and forgotten reads `undefined` at the call site
   instead of silently reading as false on a real hero's turn. */

function Battle({h,cfg,first,db,onExit,onRecord}){
  const foeFirst = first === 1;
  /* Every log line that used to say "the dummy" now says who is actually
     across the table. One name, read from the seat, so a rename cannot
     drift between the twenty-odd strings that mention it. */
  const foeName = "the dummy";
  const FoeName = "The dummy";
  /* tokens are minted during play, so they need uids the loadout never issued */
  const tokRef = uR(0);
  const tokSeq = () => ++tokRef.current;
  const oppRef=uR(null), chainRef=uR(null), youRef=uR(null), midRef=uR(null);
  const jump = r => r.current && r.current.scrollIntoView({behavior:"smooth",block:"start"});
  uE(()=>{ if(midRef.current) midRef.current.scrollLeft = midRef.current.clientWidth; },[]);
  const built = uM(()=>{
    /* ONE COUNTER AND ONE STREAM, SHARED BY BOTH SEATS.

       The uid counter is passed into every buildSide call rather than
       being a local, so the two seats can never mint the same uid — see
       buildSide's header for why that would be CARD-IN-TWO-ZONES rather
       than a cosmetic clash.

       The rng is threaded seat 0 -> seat 1 -> Battle in that fixed
       order. Two peers dealing from the same table code walk the stream
       identically, which is the whole reason engine/rng.js exists. */
    const ctr = {n:0};
    let rng = rngMake((cfg && cfg.seed != null) ? cfg.seed : Date.now());
    const _s0 = buildSide(h, PARSED[h.k], db, cfg||{}, rng, ctr);
    rng = _s0.rng;

    /* THE RUNECHANT TOKEN IS SHARED, NOT PER-SIDE. It is one printed card
       read out of the database; which hero conjures it is decided at the
       point of minting, not here. Built from the database record so
       nothing about it is invented — the board renders board entries with
       CardFrame, which is what puts real token art on the table instead
       of the text "Runechant x2". `runeApprox` still reports when the
       token is missing from the pool, in which case damage falls back
       to 1. */
    const runeTok = (db.byName["runechant"]||[])[0];
    const runeDmg = runeTok && (clean(runeTok.tx).toLowerCase().match(/deal (\d+) arcane damage/)||[])[1];
    const runeCard = runeTok ? {
      name:"Runechant", pitch:0, cost:null, power:null, def:null,
      tt:runeTok.tt || "Runeblade Token - Aura", kw:runeTok.kw || [], tx:runeTok.tx || "",
      img:runeTok.pr ? runeTok.pr._first : null,
      dbImg:runeTok.pr ? runeTok.pr._first : null,
      _token:true
    } : null;

    /* SEAT 1 IS THE PUNCHING BAG (v2.81, replacing v2.41's chosen hero).

       A seat the dummy fills is always the vanilla pile — 30 Generic
       attack actions with no rules text — and the trainer is the only
       place the dummy sits. A person takes seat 1 by joining a table,
       where they pick their own hero like anyone else.

       THE DEALING MOVED TO `engine/build.js`. It was written out here,
       which made it a second description of a build sitting where no
       drill could reach it — the shape the no-mirror rule exists to
       prevent. `buildVanilla` is the one copy, it takes the pile as
       DATA (the list still lives in the data script beside the hero
       decks), and it writes every passive out rather than defaulting
       them, so a passive added to `buildSide` and forgotten reads
       `undefined` at the call site instead of a silent false. */
    const _s1 = buildVanilla(DUMMY_DECK, DUMMY_GEAR, db, rng, ctr,
                             {hp:42, int:DUMMY_INT});
    rng = _s1.rng;
    const s1 = _s1.b, dDeck = s1.deck, dGear = s1.gear;

    /* `myHP`/`myInt` keep their names: they are seat 0's, they are read at
       a dozen call sites, and renaming them is a separate pass from
       giving seat 1 a build.

       `both` IS THE LEDGER THAT MATTERS. Seat 0's build is also spread at
       the top level, because the UI renders seat 0 by definition and
       `built.HPOW` reads better than `built.both[0].HPOW` at a hero-portrait
       call site. The RULES must not read it that way — they go through
       `bAct`/`bFoe` below, which is the same actor-vs-perspective split
       v2.24 made for zones, one layer up. */
    /* THE RUNECHANT'S DAMAGE RIDES ON BOTH BUILDS, NOT ONLY THE TOP LEVEL
       (v2.77). It is read off the printed token, so it is the same number
       for either hero — but the four sites that read it are RULES sites
       inside effects.js, and they now ask `bAct(n)` like every other
       passive. `built.runeDmg` sat at the top level only, so `both[0]` and
       `both[1]` did not carry it and every one of those reads would have
       fallen through to the `== null ? 1` default: identical today (the
       Silver Age token deals 1) and silently wrong for a token that deals
       more. Stamped onto both seats, the default becomes what it says it
       is — a fallback — rather than the thing that is actually answering. */
    const _rune = {runeDmg:runeDmg?+runeDmg:1, runeApprox:!runeTok, runeCard};
    return {..._s0.b, both:[{..._s0.b, ..._rune}, {...s1, ..._rune}], dGear, dDeck,
      myHP:_s0.b.hp, myInt:_s0.b.int, ..._rune,
      /* the stream AFTER both opening shuffles — Battle continues it */
      rng};
  },[h,db]);

  /* THE HERO PASSIVES ARE ACTOR-RELATIVE, NOT SEAT-0'S (v2.41).

     `built.viseraiPassive` silently meant *the player's* Viserai — the
     exact seat-0-means-the-actor confusion the actor/perspective split
     fixed for zones in v2.24. These are its one-layer-up counterpart, so
     they read the same way: `bAct(s)` is the build of whoever is
     resolving. Every rules site uses it; only the UI may reach `built.*`
     directly.

     There is deliberately no `bFoe` yet. Nothing needs one — a passive
     fires for its own hero — and a dead helper sitting next to a live one
     is how `sides.js`'s seat-hardcoded `you`/`foe` came to be deleted in
     v2.24. Add it when a rule actually asks about the other hero. */
  const bOf  = i => built.both[i];
  const bAct = s => built.both[actorOf(s)];
  /* THE FIRST RULE THAT ASKS ABOUT THE OTHER HERO'S BUILD (v2.56), which is
     the condition CLAUDE.md set for this helper existing at all. CLASH
     compares the power of the top card of BOTH decks, and a hero's static
     buff applies to its OWN cards: Kayo's "attack action cards you own get
     +1{p} while they are in any zone other than the combat chain" covers
     the top of his deck, so his 6 reveals as a 7 — against an opponent
     whose card is read with the opponent's own build. One shared helper
     would silently apply the revealer's buff to both cards. */
  const bFoe = s => built.both[1-actorOf(s)];

  /* L is declared ahead of the state so the opening-swing initializer below
     can reach it — it is a pure (state, message) function with no dependency
     on `g`, so hoisting it costs nothing. */
  /* The on-screen strip keeps the last LOG_KEEP lines; `feed` keeps the whole
     game and is what the Ticker and the JUDGE!! report read. Four was too few
     to see a whole end phase go by now that each CR step announces itself. */
  const LOG_KEEP = 8;
  const L = (s,msg)=>({...s, log:[msg, ...s.log].slice(0,LOG_KEEP), feed:[...(s.feed||[]), msg]});
  const [g,setGRaw] = uS(()=>{
   /* named `initial` rather than `base` so the drill that scans this literal
      out of the file has an unambiguous marker — engine/prompts.js mirrors a
      `const base = {` of its own into this file, higher up. */
   const initial = {
    turn:1, actor:0, rng:built.rng, mode:"act", bphase:"defend", pending:null, incoming:0,
    log:[foeFirst ? "It won the throw and took the first turn. Iron up." : `${FoeName} stirs. ${built.both[1].hp} to carve away — go.`],
    feed:["Tonight in the hall: "+h.n+" versus the Dummy.", built.read,
      foeFirst ? `${FoeName} won the throw and elected to swing first.` : "You won the seating and took the first turn.",
      foeFirst ? "It won the throw and took the first turn. Iron up." : `${FoeName} stirs. ${built.both[1].hp} to carve away — go.`],
    /* BOTH SEATS ARE WHOLE HEROES NOW. Every zone, every counter, every
       per-turn status lives on its own side — nothing about the player is
       privileged and nothing about the dummy is a stub. The dummy's
       resources, action point, arsenal, pitch, banish, soul and hist sit at
       their defaults because it pays no costs and takes no action phase
       yet; inert-but-present is the point, and it is what lets a second
       human occupy slot 1 without a single new field. */
    sides:[makeSide({
      id:0, name:"You", hp:built.myHP, maxHp:built.myHP, int:built.myInt,
      deck:built.deck.slice(built.myInt), hand:built.deck.slice(0,built.myInt),
      gear:built.gear, board:built.startItem?[built.startItem]:[]
    }), makeSide({
      /* SEAT 1 IS BUILT FROM ITS OWN BUILD, not from constants. `int` in
         particular: the opponent draws to ITS hero's intellect, which is
         where DUMMY_INT stops being a number the trainer knows and starts
         being a property of whoever is sitting there. newTurn's refill
         reads the same field — see the landmine note there. */
      id:1, name:"The Dummy",
      hp:built.both[1].hp, maxHp:built.both[1].hp, int:built.both[1].int,
      deck:built.both[1].deck.slice(built.both[1].int),
      hand:built.both[1].deck.slice(0,built.both[1].int),
      gear:built.both[1].gear,
      board:built.both[1].startItem?[built.both[1].startItem]:[]
    })],
    prompt:null, promptQ:[], revealed:null, lastRoll:null,
    boostOn:true, chainOpen:false, featured:null, boostChain:0, stack:[], pend:null, chain:[], chainHist:[], hitSeq:0, lastDmg:0, flags:{}, over:null, inspect:false,
    /* set only when the opponent won the seating: its opening swing happens
       before your first action phase, so the clock has not started yet */
    _opening:foeFirst
   };
   /* THE OPENING SWING CANNOT HAPPEN HERE ANY MORE (v2.63), and the reason
      is the temporal dead zone. `foeSwing` is a hoisted function
      declaration, so CALLING it from this initializer always worked — but
      what it does changed: with a real hero in seat 1 it now plays a real
      card, which reaches for `gy` and `_EFX`, both `const`s declared
      further down the component. During the first render those are still
      in their TDZ, so the call threw `gy is not a function` and took the
      whole match with it. Exactly the shape of the v2.54 clash crash: a
      hoisted-looking name that is not yet initialised.

      So the opening swing moved to a mount effect below. The cost is one
      frame in the action phase before the block step appears, which is
      what this initializer used to avoid — a visible flicker is a fair
      trade for a match that starts. */
   return withPriority(initial);
  });
  /* ---- THE GUARD RAILS -------------------------------------------------
     Every state change in this component funnels through setG, which makes
     it the one place worth auditing. engine/invariants.js reads the state
     and reports anything the rules of Flesh and Blood do not permit — a
     card in two zones at once, a per-side field written to the game object,
     a defending card re-declared on a second chain link (CR 7.3.2b).

     Every bug this cycle was found by eye or in play, never by a red test:
     crumbling auras that came back, defenders never cleared, a pitch
     selection carried into the next payment. All of them were states the
     judge would have named instantly.

     It never throws. A violation must not cost a player their game, so it
     logs, records, and raises a badge; the sim keeps running. Read the
     details in the console or via window.__dawnJudge. */
  const judgeRef = uR([]);
  const [judgeN, setJudgeN] = uS(0);

  /* ---- THE PRIORITY MACHINE, IN SHADOW (v2.27) -------------------------
     ROADMAP-MULTIPLAYER.md Phase A step 4. This is the step that changes
     CONTROL FLOW rather than field names, so it lands in two moves rather
     than one. This is the first: the machine's state is DERIVED from the
     trainer's gates on every state change and carried alongside them. It
     drives nothing yet — `mode`/`bphase` are still the source of truth.

     Why that is worth doing on its own:

       1. Those fields did not exist, and every invariant that reads them
          guards with `!= null` — so BAD-PHASE, BAD-STEP, BAD-PRIORITY and
          PRIORITY-IN-CLOSED-PHASE have been DORMANT since v2.21. Deriving
          them turns four advertised guards on for the first time.
       2. It proves the mapping from mode/bphase to phase/step/priority is
          total and correct BEFORE anything depends on it. Every bug this
          cycle was found by eye rather than by a red test; this is the one
          change where that would be most expensive.

     The MAPPING itself lives in engine/priority.js as `fromTrainer` — it
     is pure, it is a statement about priority, and in here no drill could
     reach it. This is only the merge.

     Declared as a hoisted FUNCTION, not a const arrow, for the same reason
     `foeSwing` is: the useState initializer that builds `initial` runs
     before this point in the source and has to be able to call it. */
  function withPriority(n){
    try {
      const p = DawnPriority.fromTrainer(n, foeFirst);
      const out = {...n};
      for(const k of DawnPriority.PRI_FIELDS) out[k] = p[k];
      return out;
    } catch(e){ return n; }   /* a shadow must never break a real game */
  }

  const setG = updater => setGRaw(s => {
    const n = withPriority(typeof updater === "function" ? updater(s) : updater);
    try {
      const bad = DawnInvariants.errors(n);
      if(bad.length){
        const seen = judgeRef.current;
        for(const v of bad){
          /* one entry per distinct violation, not per render */
          if(seen.some(x => x.code === v.code && x.msg === v.msg)) continue;
          seen.push({turn:n.turn, mode:n.mode, code:v.code, msg:v.msg});
          console.error("[dawnblade judge] " + v.code + " — " + v.msg);
        }
        if(typeof window !== "undefined") window.__dawnJudge = seen;
        setJudgeN(seen.length);
      }
    } catch(e){ /* the judge must never be the thing that breaks play */ }
    return n;
  });
  const [zoom,setZoom]=uS(null);
  /* the JUDGE!! bug-report sheet: null when closed */
  const [bug,setBug]=uS(null);
  /* uid of the card being peeked in the hand rail — see handCell */
  const [peek,setPeek]=uS(null);

  /* ---- JUDGE!! ---------------------------------------------------------
     A bug report written at the table, on the phone, in the moment — which
     is where the bugs actually surface. Every fix this cycle came from
     playing and noticing, so the expensive part was never the noticing, it
     was reconstructing the board afterwards from a screenshot.

     So the report captures the board itself. The note can just be "this
     looked wrong": the zones, counters, chain, prompt, the whole feed and
     any invariant violations travel with it. Card lists are names + uids,
     not the resolved records, so a report stays readable and small. */
  /* JUDGE!! — the report itself now lives in engine/report.js, so the
     TABLE can produce one too and so a drill can reach it. What stays
     here is the CONTEXT the state does not know about itself. */
  const judgeCtx = note => [g, {
    note, source:"trainer", appVer:window.APP_VER, dataVer:window.DATA_VER,
    hero:h.k, heroName:h.n, seating:foeFirst?"opponent first":"you first",
    mySeat:0, invariantsSeen:judgeRef.current
  }];
  /* RULING 2026-07-25: "cards in grave will have to have a 'turn added to
     grave' characteristic". Stamp it on the way in, and every "discarded a
     card with 6 or more {p} this turn" question becomes answerable — for
     either player, which is what multiplayer will need. Reincarnate also
     rides on this path: discarded at random, it bottoms the deck instead. */
  /* Ephemeral, straight off Crouching Tiger's own reminder text: "If it would
     be put into a graveyard from anywhere, instead it ceases to exist." Every
     path into the graveyard goes through here, so this is the place to drop it. */
  const gy = (turn, ...cards) => cards
    .filter(c => !(c && (c.kw||[]).some(k=>/ephemeral/i.test(k))))
    .map(c=>({...c, _gy:turn}));
  /* A DISCARD IS A DIFFERENT EVENT FROM "REACHED THE GRAVEYARD", and only
     this path stamps it. Cards arrive in the graveyard by being played, by
     blocking and by being discarded; the printed text of Kayo's engine asks
     about the last one only. Without the distinction, an attack — which is
     put into the graveyard at DECLARATION — satisfied every "you've
     discarded a card with 6 or more {p} this turn" check by itself. */
  const gyDisc = (turn, ...cards) => gy(turn, ...cards).map(c=>({...c, _disc:true}));
  /* "you've DISCARDED a card with 6 or more {p} this turn" — a discard, not
     a graveyard census. `_disc` is stamped only by an actual discard, which
     matters because an attack card reaches the graveyard AT DECLARATION:
     counting the whole graveyard let any 6-power attack you had already
     played satisfy the condition, and a 6-power attack satisfied it for
     itself. `act`, not `you` — this is a rules question, so it belongs to
     whoever is resolving (v2.24). `pow6` carries Kayo's clause 2. */
  const had6ThisTurn = st => (act(st).grave||[]).some(c=>c._gy===st.turn && c._disc && pow6(c, bAct(st)));
  /* ONE READING OF "PLAY THIS ONLY IF …" (v2.65). `fx.playIf` is a GATE,
     not an effect, and `tryPlay` has refused the player on it since v2.12.
     `foePick` never asked — it filtered on type and affordability alone —
     so seat 1 swung Bear Hug with an empty pitch zone and Run Roughshod
     with an empty graveyard, both against their own printed first line.
     Sev-3 "illegal play allowed", and in the mirror it is 4 deck copies.

     Actor-relative like its neighbour above, so ONE predicate answers for
     either seat: `act`/`bAct` read whoever is resolving, and the opponent
     is asked by borrowing the actor (`{...n, actor:1}`) exactly as
     `foePlay` borrows it around `runOps`. */
  const playIfOk = (st, card) => {
    const pif = fxParse(card).playIf;
    if(!pif) return true;
    return pif.kind==="pitch6"     ? act(st).pitch.some(c=>pow6(c, bAct(st)))

     which could ever see an integer. Minting them as real board entries
     also means the board's own CardFrame renders the actual token art

     aura this turn" reads them. */

       runechant minted took uid 1 and shared it with a deck card, and the

     action has to finish resolving first), and openPrompt drains the head
     of the queue into a live sheet. buildPrompt returns null when there is

  function openPrompt(s){

       variants that is a known limit nobody is depending on. A soak is
       different in kind: `arcaneHit` DEFERS the damage into the answer, so
       a soak sheet that is never confirmed is an arcane hit that never
       lands. Leaving seat 1's to the player would mean asking you whether
       the opponent wants to spend their iron on the damage you just dealt
       them — and if you closed it, they would take nothing.

       a policy quietly answering a modal nobody knew was there is the kind

       never resolves — and asking YOU whether the opponent would like to
       avoid your own card is not a question. This is the noop
       "the dummy pays no costs, so it always declines" finally coming
       off; it is a decision now, and seat 1 can lose the card instead. */
    if(live.side === 1 && live.tag === "pay") return foeAnswerPay({...s, promptQ:rest}, live);

           the consequence lands. An unpaid cost that skips its consequence

  /* SEAT 1 ANSWERING ITS OWN SOAK. The DECISION is
