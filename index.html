<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>DAWNBLADE — Silver Age Training Hall</title>
<!-- ADD TO HOME SCREEN (decision C, CEO 2026-11-02): a proper name and an
     original, self-hosted icon (icons/, from icons/icon.svg by tools/icon.js),
     named relatively so file:// finds it. NOT standalone mode
     (apple-mobile-web-app-capable): iOS keeps a standalone app's storage apart
     from Safari's, and saved games must stay shared with Safari. -->
<meta name="apple-mobile-web-app-title" content="Dawnblade"/>
<meta name="application-name" content="Dawnblade"/>
<meta name="theme-color" content="#14100E"/>
<!-- THE LINK PREVIEW (v6.57): what a messenger shows under a shared link. The image is
     icons/share.png (original art, written by tools/icon.js) and must be an ABSOLUTE url,
     so it names the live page; from file:// it is simply unused. -->
<meta name="description" content="Flesh and Blood sparring on your phone: real Silver Age precons, an AI that plays them, a coach at your side. Fan-made, free, no ads."/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Dawnblade"/>
<meta property="og:title" content="Dawnblade — Flesh and Blood sparring on your phone"/>
<meta property="og:description" content="Real Silver Age precons, an AI that plays them, a coach at your side. Fan-made, free, no ads."/>
<meta property="og:url" content="https://dawnblade-ai.github.io/dawnblade-ai/"/>
<meta property="og:image" content="https://dawnblade-ai.github.io/dawnblade-ai/icons/share.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet"/>
<script>/* CRESCENDO, the release UI (docs/crescendo/README.md): ?ui=crescendo goes to play.html before React and Babel load */if(/[?&]ui=crescendo(&|$)/.test(location.search))location.replace("play.html"+location.search);</script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --r:#BA2C27; --y:#E8B33C; --b:#3B6FB0;
  /* TEXT inks for the two fills (readability sweep): --r and --b stay the FILLS (bone text sits on --r at 4.5:1); red or blue WORDS on the forge panels use these, lifted until they clear WCAG AA (4.5:1) on --forge2 */
  --rt:#F5817B; --bt:#6595D2;
  --ink:#14100E; --forge:#241B16; --forge2:#2E241D;
  --bone:#E8DFD0; --bone-dim:#B8AC98; --line:#4A3B2E;
  --ok:#7BA05B; --hold:#6B4BA3;
  --tv:calc(100vh - 152px);
  /* the type scale (v6.50): the eight sizes the sheet uses most; a half-pixel step stays a literal */
  --fs-xs:10px; --fs-sm:10px; --fs-md:11px; --fs-lg:12px; --fs-xl:13px; --fs-body:15px; --fs-h2:22px; --fs-big:26px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:'Spline Sans',sans-serif;font-size:var(--fs-body);line-height:1.45;overscroll-behavior:none}
#root{min-height:100%;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:'Big Shoulders Display',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.mono{font-family:'Spline Sans Mono',monospace}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}
.clip{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.clip-sm{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}

/* type utilities (v6.50): the scale as classes, for markup that used an inline fontSize; !important keeps the
   inline style's precedence over contextual rules (.sheet h2, .heroplate .hact, .note) */
.fs-md{font-size:var(--fs-md) !important} .fs-lg{font-size:var(--fs-lg) !important} .fs-xl{font-size:var(--fs-xl) !important} .fs-lede{font-size:13.5px !important} .fs-h3{font-size:18px !important} .fs-h2s{font-size:20px !important} .fs-big{font-size:var(--fs-big) !important}

/* shell */
.shell{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px calc(64px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 10px}
.brand{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-h2);letter-spacing:.06em}
.brand em{font-style:normal;color:var(--y)}
.tag{font-size:var(--fs-sm);color:var(--bone-dim);text-transform:uppercase;letter-spacing:.14em}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:2px;background:var(--ink);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
.tab{flex:1;max-width:132px;text-align:center;padding:9px 4px;font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-xl);letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
.tab.on{color:var(--ink);background:var(--y)}
.tab.on.fight{background:var(--r);color:var(--bone)}

/* db banner */
.dbbar{display:flex;align-items:center;gap:8px;background:var(--forge);border:1px solid var(--line);padding:8px 10px;margin-bottom:10px;font-size:var(--fs-lg)}
.dbbar .dot{width:8px;height:8px;flex:none;background:var(--y);animation:pulse 1.1s infinite alternate}
.dbbar.ok .dot{background:var(--ok);animation:none}
.dbbar.err .dot{background:var(--r);animation:none}
@keyframes pulse{to{opacity:.25}}
.dbbar .retry{margin-left:auto;color:var(--y);font-weight:600;text-transform:uppercase;font-size:var(--fs-md);letter-spacing:.08em}

/* hero select — full roster on one screen, smash-style */
.hgrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.hgrid .hcard{width:calc((100% - 20px)/6)}
.hcard{position:relative;background:var(--forge);border:1px solid var(--line);padding:0;overflow:hidden;display:flex;flex-direction:column}
.hcard img.art{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 16%;filter:saturate(.92)}
/* the roster tile shows the ILLUSTRATION, not the card (v6.48): zoomed past
   the frame and the printed name strip; the name label paints over the edge */
.hgrid .hcard img.art{transform:scale(1.42);transform-origin:50% 30%}
.hbanner{position:relative;display:flex;align-items:stretch;min-height:104px;margin-top:10px;background:var(--forge);border:1px solid var(--line);border-left:4px solid var(--chc);overflow:hidden;animation:hbin .28s ease-out}
.hbanner .hbart{position:absolute;left:0;top:0;bottom:0;width:42%;overflow:hidden}
.hbanner .hbart img.art{width:100%;height:100%;object-fit:cover;object-position:50% 16%;transform:scale(1.5);transform-origin:50% 34%;filter:saturate(.95)}
.hbanner .hbart .fallbackart{height:100%}
.hbanner .hbart::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,24,20,0) 55%,var(--forge) 100%)}
.hbanner .hbtxt{position:relative;margin-left:auto;width:60%;padding:10px 12px 10px 6px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.hbanner.mystery .hbtxt{width:100%;padding-left:12px}
.hbanner .hbcls{font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.06em;text-transform:uppercase;color:var(--bone-dim)}
.hbanner .hbcls::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--chc);vertical-align:0}
.hbanner .hbname{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-h2);line-height:1;text-transform:uppercase;letter-spacing:.02em;color:var(--bone)}
.hbanner .hbpitch{font-size:12.5px;line-height:1.3;color:var(--bone-dim)}
.kwrow{display:flex;flex-wrap:wrap;gap:4px 5px;margin-top:2px}
.kwrow .kw{font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.03em;line-height:1.4;min-height:26px;padding:2px 7px;border:1px solid var(--line);background:transparent;color:var(--bone);white-space:nowrap}
.kwrow .kw.on{border-color:var(--y);background:rgba(232,178,58,.12)}
.kwrow b{color:var(--y);font-weight:600}
.kwdef{margin:6px 0 10px;padding:8px 10px;border-left:2px solid var(--y);background:rgba(0,0,0,.25);font-size:var(--fs-lg);line-height:1.45;color:var(--bone)}
.kwdef .kwref{display:block;margin-bottom:3px;font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.06em;text-transform:uppercase;color:var(--bone-dim)}
.kwdef .kwref b{color:var(--y);font-weight:600}
.herotx{margin:10px 0 2px;font-size:var(--fs-lg);line-height:1.45;color:var(--bone)}
.herotx .kwref{display:block;margin-bottom:3px;font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.06em;text-transform:uppercase;color:var(--bone-dim)}
.herotx p{margin:0 0 4px}
.sheet .kwrow{margin:8px 0 2px}.sheet .kwrow .kw{font-size:var(--fs-md)}
@keyframes hbin{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hbanner{animation:none}}
.hcard .fallbackart{aspect-ratio:1/1;font-size:var(--fs-lg)}
.hcard .nm{display:block;position:relative;z-index:1;padding:2px 2px;background:var(--forge2);border-top:1px solid var(--line);font-family:'Big Shoulders Display';font-weight:700;font-size:10.5px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-top:auto}
.hcard.ch1{box-shadow:inset 0 -2px 0 var(--r)}
.hcard.ch2{box-shadow:inset 0 -2px 0 var(--y)}
.hcard.ch3{box-shadow:inset 0 -2px 0 var(--b)}
.hcard.ch4{box-shadow:inset 0 -2px 0 var(--hold)}
/* YOUR RECORD ON THE TILE (v7.10): won–lost with that hero, against the AI and people together; nothing at no games */
.hcard .myrec{position:absolute;bottom:19px;left:2px;background:var(--ink);border:1px solid var(--line);color:var(--bone);font-size:9px;padding:0 3px;font-family:'Spline Sans Mono';white-space:nowrap}
.hcard .best{position:absolute;top:2px;right:2px;background:var(--ink);border:1px solid var(--y);color:var(--y);font-size:9px;padding:0 3px;font-family:'Spline Sans Mono'}
.openslot{border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--bone-dim);background:transparent;min-height:64px}
.openslot b{font-family:'Big Shoulders Display';font-size:16px;font-weight:700;line-height:1}
.openslot span{font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.roster-legend{display:flex;gap:12px;margin:8px 2px 2px;font-size:var(--fs-sm);color:var(--bone-dim);text-transform:uppercase;letter-spacing:.1em;align-items:center;flex-wrap:wrap}
.roster-legend i{width:8px;height:8px;display:inline-block;margin-right:4px}
.fallbackart{width:100%;aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--forge2),var(--ink));font-family:'Big Shoulders Display';font-size:34px;font-weight:800;color:var(--line)}

/* hero sheet */
.sheet{background:var(--forge);border:1px solid var(--line);padding:14px;margin-top:12px}
.sheet h2{font-size:var(--fs-big);font-weight:800}
.sheet .cls{color:var(--y);font-size:var(--fs-lg);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.statrow{display:flex;gap:14px;margin:10px 0;font-family:'Spline Sans Mono';font-size:var(--fs-xl)}
.statrow b{color:var(--y)}
.bigbtn{display:block;width:100%;padding:14px;background:var(--r);color:var(--bone);font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-top:12px}
.bigbtn.alt{background:var(--forge2);border:1px solid var(--line);color:var(--bone);font-size:var(--fs-body);padding:11px;min-height:44px}
.bigbtn:disabled{opacity:.4}

/* deck viewer */
.dsec{margin:14px 0 6px;font-size:var(--fs-lg);letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim)}
.dsec.p1{color:var(--rt)}.dsec.p2{color:var(--y)}.dsec.p3{color:var(--bt)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cgrid .cc{position:relative;padding:0;background:var(--forge)}
.cgrid img{aspect-ratio:5/7;object-fit:cover;width:100%}
.cc .q{position:absolute;top:4px;left:4px;background:var(--ink);border:1px solid var(--line);font-family:'Spline Sans Mono';font-size:var(--fs-md);padding:1px 5px}
.ccfall{aspect-ratio:5/7;display:flex;flex-direction:column;justify-content:space-between;padding:8px;border:1px solid var(--line);font-size:var(--fs-md);line-height:1.25}
.ccfall .pn{font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-xl)}
.pb1{box-shadow:inset 0 -3px 0 var(--r)}.pb2{box-shadow:inset 0 -3px 0 var(--y)}.pb3{box-shadow:inset 0 -3px 0 var(--b)}

/* battle */
.board{display:flex;flex-direction:column;gap:10px}
.dummy{background:var(--forge);border:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:12px}
.dummy .hp{font-family:'Big Shoulders Display';font-weight:800;font-size:40px;line-height:1;color:var(--rt)}
.dummy .lbl{font-size:var(--fs-md);color:var(--bone-dim);text-transform:uppercase;letter-spacing:.1em}
.dummy .incoming{margin-left:auto;text-align:right;font-family:'Spline Sans Mono';font-size:var(--fs-lg);color:var(--y)}
.mystat{display:flex;gap:8px;flex-wrap:wrap;font-family:'Spline Sans Mono';font-size:var(--fs-lg)}
.pill{background:var(--forge);border:1px solid var(--line);padding:5px 9px}
.pill b{color:var(--y)}
.pill.hp b{color:var(--rt)}
.log{background:var(--forge);border:1px solid var(--line);padding:9px 10px;font-size:12.5px;min-height:44px;color:var(--bone)}
.log .dim{color:var(--bone-dim)}
.zone{font-size:var(--fs-md);color:var(--bone-dim);text-transform:uppercase;letter-spacing:.12em;margin:2px 2px 4px}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hand .hc{position:relative;padding:0;background:var(--forge);border:1px solid var(--line);transition:transform .12s}
.hand .hc img{aspect-ratio:5/7;object-fit:cover;width:100%}
.hand .hc.sel{transform:translateY(-6px);border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.hand .hc.dis{opacity:.45}
.hand .hc .cost{position:absolute;top:3px;left:3px;background:var(--ink);font-family:'Spline Sans Mono';font-size:var(--fs-md);padding:1px 5px;border:1px solid var(--line)}
.hand .hc .pw{position:absolute;bottom:3px;left:3px;background:var(--ink);font-family:'Spline Sans Mono';font-size:var(--fs-md);padding:1px 5px;border:1px solid var(--r);color:var(--rt)}
.hand .hc .df{position:absolute;bottom:3px;right:3px;background:var(--ink);font-family:'Spline Sans Mono';font-size:var(--fs-md);padding:1px 5px;border:1px solid var(--b);color:var(--bt)}
.arsenalrow{display:flex;gap:8px;align-items:stretch}
.arsenalrow .slot{width:64px;flex:none;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:var(--bone-dim);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:4px}
.arsenalrow .slot img{aspect-ratio:5/7;object-fit:cover}
.gearrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gearrow .g{flex:none;width:56px;position:relative;padding:0;background:var(--forge);border:1px solid var(--line)}
.gearrow .g img{aspect-ratio:5/7;object-fit:cover}
.gearrow .g.used{opacity:.35}
.gearrow .g .gd{position:absolute;bottom:2px;right:2px;background:var(--ink);font-family:'Spline Sans Mono';font-size:var(--fs-sm);padding:0 4px;border:1px solid var(--b);color:var(--bt)}
.actrow{display:flex;gap:8px}
.actrow .a,.actbar .a{flex:1;padding:12px 6px;font-family:'Big Shoulders Display';font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:var(--forge2);border:1px solid var(--line)}
.actrow .a.go,.actbar .a.go{background:var(--r)}
.actrow .a.pay,.actbar .a.pay{background:var(--y);color:var(--ink)}
/* THE PASS BUTTON SAYS WHAT A PASS COSTS (ruling 2026-11-15). Green: nothing
   else can be started, so passing gives nothing up. Purple: an action point
   is unspent and something could still be started. Only the player's own
   phone shows either, so the opponent learns nothing. */
.actbar .a.free{background:var(--ok);color:var(--ink)}
.actbar .a.hold{background:var(--hold)}
.actrow .a:disabled,.actbar .a:disabled{opacity:.4}
/* A NON-BUTTON in the action bar: the table uses it to say whose window
   is open, because a permanently dead "Done defending" reads as a broken
   screen rather than as CR 7.3.3. Same box, plainly not pressable. */
.actbar .a.dis,.actrow .a.dis{opacity:.55;font-style:italic;text-transform:none;letter-spacing:.02em;font-size:11.5px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.paymode{border:1px solid var(--y);background:rgba(232,179,60,.07);padding:8px 10px;font-size:12.5px}
.blockmode{border:1px solid var(--b);background:rgba(59,111,176,.08);padding:8px 10px;font-size:12.5px}

/* card modal */
.modal{position:fixed;inset:0;background:rgba(10,8,7,.82);display:flex;align-items:center;justify-content:center;z-index:65;padding:20px}
.modal .inner{max-width:340px;width:100%;max-height:100%;overflow-y:auto}
.modal img{width:100%;border:1px solid var(--line)}
.modal .txt{background:var(--forge);border:1px solid var(--line);padding:10px;font-size:var(--fs-xl);margin-top:8px}
.modal .chip{display:inline-block;margin-top:8px;font-size:var(--fs-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);border:1px solid var(--line);padding:2px 7px}

/* reveal + judge + misc */
.reveal{position:fixed;inset:0;background:rgba(10,8,7,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;text-align:center;padding:24px}
.reveal .card{width:200px;background:var(--forge);border:1px solid var(--y);padding:18px 14px;position:relative;overflow:hidden}
.reveal .card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--r),var(--y),var(--b));transform:translateX(-101%);animation:bleed 1.1s .15s forwards}
@keyframes bleed{60%{transform:translateX(0)}100%{transform:translateX(101%)}}
.reveal h3{font-size:var(--fs-h2);position:relative}
.reveal .rar{font-size:var(--fs-md);letter-spacing:.2em;color:var(--y);text-transform:uppercase;position:relative}
/* the result screen (EndPanel): opaque, tinted by the outcome, one clear way out.
   `.reveal.end-lose` must out-rank the plain `.lose` panel rule below, which once
   made the table's loss screen see-through. */
.reveal.end-win{background:radial-gradient(120% 70% at 50% 30%,rgba(232,179,60,.2),transparent 62%),rgba(14,11,9,.97)}
.reveal.end-lose{background:radial-gradient(120% 70% at 50% 30%,rgba(196,48,43,.24),transparent 62%),rgba(14,11,9,.97);border:none;padding:24px}
.reveal.end-draw{background:radial-gradient(120% 70% at 50% 30%,rgba(184,172,152,.14),transparent 62%),rgba(14,11,9,.97)}
.reveal .endtitle{font-size:44px;line-height:1;font-weight:800;margin-bottom:16px;max-width:340px;animation:endin .45s cubic-bezier(.2,1.4,.4,1) both}
.reveal.end-win .endtitle{color:var(--y);text-shadow:0 0 24px rgba(232,179,60,.35)}
.reveal.end-lose .endtitle{color:var(--rt);text-shadow:0 0 24px rgba(196,48,43,.35)}
.reveal.end-lose .card{border-color:var(--r)}
.reveal.end-draw .card{border-color:var(--bone-dim)}
.reveal .card{width:min(260px,100%)}
.reveal .card h3{text-shadow:0 1px 2px rgba(10,8,7,.8)}
.reveal .card .rar{text-shadow:0 1px 2px rgba(10,8,7,.8)}
.endstat{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:16px;color:var(--bone-dim);font-size:var(--fs-lg);letter-spacing:.06em;text-transform:uppercase}
.endstat b{font-size:28px;color:var(--bone);letter-spacing:0}
.endnote{margin-top:12px;font-size:13.5px;max-width:320px;color:var(--bone)}
.reveal .endleave{max-width:300px;min-height:48px;margin-top:22px}
.reveal.end-win .endleave{background:var(--y);color:var(--ink)}
.reveal.end-draw .endleave{background:var(--forge2);border:1px solid var(--line)}
.endhint{margin-top:8px;font-size:var(--fs-md);color:var(--bone-dim);letter-spacing:.08em}
/* THE RECAP (v7.09): one small card on every end screen — two columns, the player's first */
.recap{width:min(300px,100%);margin-top:14px;border:1px solid var(--line);background:rgba(20,16,13,.85);font-size:var(--fs-xl);color:var(--bone)}
.recap .rchead{padding:6px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-lg);letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
.recap table{width:100%;border-collapse:collapse}
.recap th,.recap td{padding:5px 8px;text-align:right;font-weight:400}
.recap th:first-child,.recap td:first-child{text-align:left;color:var(--bone-dim)}
.recap thead th{font-size:var(--fs-lg);color:var(--bone);font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recap td b{font-family:'Spline Sans Mono';font-weight:700}
.recap td small{display:block;font-size:var(--fs-md);color:var(--bone-dim)}
@keyframes endin{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
.qopt{display:block;width:100%;text-align:left;padding:11px 12px;background:var(--forge);border:1px solid var(--line);margin-top:8px;font-size:14px}
.qopt.right{border-color:var(--ok);color:var(--ok)}
.qopt.wrong{border-color:var(--r);color:var(--rt)}
.explain{border-left:3px solid var(--y);padding:8px 10px;background:var(--forge);margin-top:10px;font-size:var(--fs-xl)}
.note{font-size:11.5px;color:var(--bone-dim);margin-top:10px;line-height:1.5}
.note a{color:var(--y)}
.win{border:1px solid var(--ok);background:rgba(123,160,91,.08);padding:12px;text-align:center}
.lose{border:1px solid var(--r);background:rgba(196,48,43,.08);padding:12px;text-align:center}
.cdnfail{display:none;padding:40px 20px;text-align:center;font-family:sans-serif;color:#E8DFD0}

/* v5: effects engine UI */
.fxdot{position:absolute;top:4px;right:4px;width:9px;height:9px;border:1px solid var(--ink)}
.fxdot.full{background:var(--ok)}.fxdot.part{background:var(--y)}.fxdot.none{background:#6B6258}
.cov{margin:12px 0 4px;font-size:var(--fs-lg)}
.covbar{height:6px;background:var(--forge2);display:flex;margin-top:4px}
.covbar i{height:100%}
.covbar .cf{background:var(--ok)}.covbar .cp{background:var(--y)}.covbar .cn{background:#6B6258}
.fxlist{margin-top:6px;font-size:var(--fs-lg);border-top:1px solid var(--line);padding-top:6px}
.fxlist .fc{display:flex;gap:6px;margin:3px 0;align-items:flex-start}
.fxlist .fs{flex:none;font-family:'Spline Sans Mono';font-size:var(--fs-sm);padding:0 4px;border:1px solid var(--line);margin-top:1px}
.fxlist .fs.run{color:var(--ok);border-color:var(--ok)}
.fxlist .fs.noop{color:var(--y);border-color:var(--y)}
.fxlist .fs.skip{color:var(--bone-dim)}
.boardrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.boardrow .b{flex:none;width:56px;position:relative;padding:0;background:var(--forge);border:1px solid var(--line)}
.boardrow .b img{aspect-ratio:5/7;object-fit:cover}
.boardrow .b .sw{position:absolute;bottom:0;left:0;right:0;background:var(--r);font-family:'Spline Sans Mono';font-size:var(--fs-sm);text-align:center;padding:1px 0}
.boardrow .b.spent{opacity:.4}
.tokpills{display:flex;gap:6px;flex-wrap:wrap;font-family:'Spline Sans Mono';font-size:var(--fs-md)}
.tokpills .tk{border:1px solid var(--y);color:var(--y);padding:2px 7px}
.tokpills .tk.bad{border-color:var(--r);color:var(--rt)}

/* vs strip — P1 / P2 slots under the roster */
.hcard.sel{outline:2px solid var(--y);outline-offset:-1px;z-index:1}
.vs{display:flex;align-items:stretch;gap:8px;margin-top:10px}
.vslot{flex:1;background:var(--forge);border:1px solid var(--line);padding:14px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:126px;position:relative;color:inherit}
.vslot.p1{box-shadow:inset 0 -3px 0 var(--r)}
.vslot.p2{box-shadow:inset 0 -3px 0 var(--b)}
.vslot.empty{border-style:dashed;justify-content:center;color:var(--bone-dim)}
.vslot .ptag{position:absolute;top:4px;left:6px;font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.12em}
/* THE P2 PICKER (v2.76). Sits at the foot of the slot so the portrait and
   the name stay the thing you read first; full width because it is a real
   choice, not a footnote. `.vslot.p2` is a div again rather than a button —
   a select inside a button swallows its own clicks — so the dummy keeps its
   poke on a nested button of its own. */
.vslot.p2{justify-content:flex-start}
.vslot .dmybtn{background:none;border:none;padding:0;color:inherit;cursor:pointer}
.foesel2{width:100%;margin-top:auto;background:var(--iron);color:var(--bone);
  border:1px solid var(--line);border-radius:2px;padding:4px 5px;font-size:10.5px;
  font-family:'Spline Sans Mono';letter-spacing:.02em}
.seatline{margin-top:6px;font-size:10.5px;color:var(--y);letter-spacing:.02em}
.vslot .port{width:62px}
.vslot img.art{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 16%}
.vslot .fallbackart{aspect-ratio:1/1;font-size:var(--fs-md)}
.vslot .vname{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-lg);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.vslot .taunt{font-size:var(--fs-xs);color:var(--bone-dim);font-style:italic}
.vsmid{display:flex;align-items:center;font-family:'Big Shoulders Display';font-weight:800;font-size:24px;color:var(--y);padding:0 2px}
.dmy{display:flex;flex-direction:column;align-items:center;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
.dmy[data-bonk]{animation:bonk .55s ease-out, sway 3.4s ease-in-out .55s infinite}
.dhead{width:36px;height:30px;border-radius:4px;background:linear-gradient(160deg,#8A7355,#6F5B42);border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Spline Sans Mono';font-size:var(--fs-sm);color:var(--ink)}
.dbody{width:42px;height:16px;background:#5C4B37;border:1px solid var(--ink);border-top:none;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.dpost{width:7px;height:13px;background:var(--forge2);border:1px solid var(--line)}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2.2deg)}}
@keyframes bonk{0%{transform:rotate(0)}30%{transform:rotate(15deg)}60%{transform:rotate(-9deg)}100%{transform:rotate(0)}}

/* battle strip — appears when P1 is locked in */
.battlebtn{display:block;width:100%;margin-top:10px;padding:11px 8px;background:linear-gradient(180deg,#D43A34,var(--r) 55%,#9E2722);color:var(--bone);font-family:'Big Shoulders Display';font-weight:800;font-size:30px;letter-spacing:.24em;text-transform:uppercase;text-align:center;position:relative;overflow:hidden;text-shadow:0 2px 0 rgba(20,16,14,.35)}
.battlebtn::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(20,16,14,.14) 0 10px,transparent 10px 22px)}
.battlebtn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(232,223,208,.28) 50%,transparent 70%);transform:translateX(-120%);animation:bsweep 2.6s ease-in-out infinite}
@keyframes bsweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.battlebtn:disabled{filter:grayscale(.65) brightness(.7)}
.battlebtn span{position:relative;z-index:1}

/* match narration ticker + claude's call */
.ticker{position:sticky;top:0;z-index:35;background:rgba(20,16,14,.97);border:1px solid var(--line);border-left:3px solid var(--r);padding:7px 10px;display:flex;gap:9px;align-items:flex-start;min-height:42px}
.ticker .live{flex:none;display:flex;align-items:center;gap:4px;font-family:'Spline Sans Mono';font-size:var(--fs-xs);color:var(--rt);letter-spacing:.14em;padding-top:2px}
.ticker .dot{width:6px;height:6px;border-radius:50%;background:var(--r);animation:pulse 1s infinite alternate}
.ticker .cap{font-size:12.5px;line-height:1.35;animation:capin .25s ease-out}
.ticker .more{margin-left:auto;flex:none;font-family:'Spline Sans Mono';font-size:var(--fs-xs);color:var(--bone-dim);border:1px solid var(--line);padding:1px 4px}
@keyframes capin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.adv{border:1px solid var(--y);background:rgba(232,179,60,.06)}
.advhead{width:100%;text-align:left;padding:7px 10px;font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.14em;color:var(--y);text-transform:uppercase}
/* THE ADVISOR HEADER'S HIT AREA (decision B, CEO 2026-11-02). It draws 26px; an
   invisible ::after reaches 44px DOWNWARD only: above it sits the sticky ticker
   (z-index 35, which would eat the taps and must keep painting over the box when
   the log scrolls), below it the advice text, or with the box closed the feed's
   lines, neither a control. The box's cut corners used to be a clip-path on the
   box itself, which clipped that ::after to the closed box's 28px; they are drawn
   by a ::before layer now, the same polygon, border and fill, so nothing moves. */
.adv{position:relative;isolation:isolate;border-color:transparent;background:none}
.adv::before{content:"";position:absolute;inset:-1px;z-index:-1;border:1px solid var(--y);background:rgba(232,179,60,.06);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.advhead{position:relative}
.advhead::after{content:"";position:absolute;inset:0 0 -18px}
.advbody{padding:0 10px 9px;font-size:var(--fs-xl)}
.advwhy{font-size:var(--fs-md);color:var(--bone-dim);margin-top:3px;line-height:1.4}
.advnew{font-size:var(--fs-md);color:var(--y);margin-top:7px;padding-top:6px;border-top:1px dashed rgba(232,179,60,.35);line-height:1.4}

/* hero plate, combat chain, damage pops, sticky actions */
.heroplate{display:flex;gap:8px;align-items:center;background:var(--forge);border:1px solid var(--line);padding:6px 8px}
.heroplate .hport{width:40px;flex:none;padding:0}

.heroplate .hlife{text-align:right;font-family:'Spline Sans Mono';flex:none}

.heroplate .hact{flex:none;background:var(--y);color:var(--ink);font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-lg);letter-spacing:.06em;padding:8px 9px}
.heroplate .hact:disabled{opacity:.35}
.chainwrap{margin-top:-2px}
.chain{display:flex;gap:7px;overflow-x:auto;align-items:center;padding:2px 0 4px}
.clink{position:relative;flex:none;width:34px}
.clink img,.clink .ct{width:100%;aspect-ratio:5/7;object-fit:cover;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display';font-size:14px;color:var(--bone-dim);background:var(--forge)}
.clink b{position:absolute;bottom:-2px;right:-3px;background:var(--ink);border:1px solid var(--r);color:var(--rt);font-family:'Spline Sans Mono';font-size:var(--fs-sm);padding:0 3px;font-weight:400}
.clink.arc b{border-color:var(--b);color:var(--bt)}
.clink i{position:absolute;top:-2px;right:-3px;background:var(--ink);border:1px solid var(--y);color:var(--y);font-style:normal;font-size:var(--fs-xs);padding:0 2px}
.clink.foe img,.clink.foe .ct{border-color:var(--r)}
.clink:not(:last-child)::after{content:"";position:absolute;right:-5px;top:50%;width:4px;height:2px;background:var(--line)}
/* the link's outcome (v6.48): a wall that held dims the link, a prevention rings it blue */
.clink.o-blocked img,.clink.o-blocked .ct{opacity:.5;border-color:var(--bone-dim)}
.clink.o-prevented img,.clink.o-prevented .ct{opacity:.7;border-color:var(--b)}
.clink.o-blocked b{border-color:var(--bone-dim);color:var(--bone-dim);text-decoration:line-through}
.clink.o-prevented b{border-color:var(--b);color:#8FB4E8;text-decoration:line-through}
.centerslot{position:relative}
.lstamp{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%) rotate(-8deg);z-index:3;pointer-events:none;
  font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-big);letter-spacing:.06em;text-transform:uppercase;line-height:1;
  padding:5px 12px 4px;border:3px solid currentColor;border-radius:4px;background:rgba(14,10,8,.82);white-space:nowrap;
  animation:lstamp .45s cubic-bezier(.2,1.6,.4,1) both}
.lstamp.o-hit{color:#FF6B5E;box-shadow:0 0 18px rgba(196,48,43,.55)}
.lstamp.o-blocked{color:var(--bone)}
.lstamp.o-prevented{color:#8FB4E8;box-shadow:0 0 18px rgba(59,111,176,.55)}
@keyframes lstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1.8)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.lstamp{animation:none}}
.dummy{position:relative}
.dmgpop{position:absolute;top:8px;right:10px;font-family:'Big Shoulders Display';font-weight:800;font-size:24px;color:var(--rt);animation:dpop .9s ease-out forwards;pointer-events:none}
@keyframes dpop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.actrow{position:sticky;bottom:calc(6px + env(safe-area-inset-bottom));z-index:28}
.actrow .a{box-shadow:0 -4px 14px rgba(10,8,7,.55)}

/* loadout + dummy gear + equipment abilities */
.dummy{flex-direction:column;align-items:stretch;gap:8px}
.drow{display:flex;align-items:center;gap:12px}
.dgear{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dgear .lblg{font-size:var(--fs-xs);color:var(--bone-dim);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.dg{width:30px;flex:none;position:relative;padding:0;border:1px solid var(--r);background:var(--forge)}
.dg img{aspect-ratio:5/7;object-fit:cover}
.dg span{position:absolute;bottom:-2px;right:-2px;background:var(--ink);border:1px solid var(--b);color:var(--bt);font-family:'Spline Sans Mono';font-size:var(--fs-xs);padding:0 2px}
.dg.used{opacity:.35;filter:grayscale(1)}
.gp{position:absolute;top:2px;left:2px;background:var(--ink);border:1px solid var(--y);color:var(--y);font-size:var(--fs-xs);padding:0 2px}
.lo .sec{margin:14px 0 6px;font-size:var(--fs-md);letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);display:flex;align-items:baseline;gap:8px}
.lo .sec b{color:var(--y);font-family:'Spline Sans Mono';font-size:var(--fs-md)}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick{position:relative;padding:0;border:1px solid var(--line);background:var(--forge)}
.pick img{aspect-ratio:5/7;object-fit:cover;width:100%}
.pick.on{outline:2px solid var(--y);outline-offset:-1px}
.pick .chk{position:absolute;top:2px;right:2px;background:var(--y);color:var(--ink);font-size:var(--fs-sm);font-weight:700;padding:0 4px}
.pick.lock{border-color:var(--r)}
.pick .wtag{position:absolute;bottom:0;left:0;right:0;background:rgba(158,39,34,.92);font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:1px 0}
.cutlist{display:flex;flex-direction:column;gap:3px}
.cutrow{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--forge);border:1px solid var(--line);font-size:12.5px;text-align:left}
.cutrow .pd{width:8px;height:8px;flex:none}
.cutrow .qq{margin-left:auto;font-family:'Spline Sans Mono';font-size:var(--fs-md);color:var(--bone-dim)}
.cutrow.cut{opacity:.5}
.cutrow.cut .nm2{text-decoration:line-through}

.slotb{position:absolute;bottom:0;left:0;right:0;background:rgba(20,16,14,.88);border-top:1px solid var(--line);font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:1px 0;color:var(--bone-dim)}
.pick.on .slotb{color:var(--y)}
.pick.lockout{opacity:.35}

/* the stack — priority windows */
.stackv{border:1px solid var(--b);background:rgba(59,111,176,.07);padding:8px 10px}
.stackv .sh{font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.14em;text-transform:uppercase;color:var(--bt);display:flex;justify-content:space-between;margin-bottom:5px}
.slayer{display:flex;align-items:center;gap:7px;padding:5px 8px;border:1px solid var(--line);background:var(--forge);margin-top:4px;font-size:12.5px}
.slayer.top{border-color:var(--y)}
.slayer .sk{flex:none;font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.1em;padding:0 4px;border:1px solid var(--line);color:var(--bone-dim)}
.slayer.atk .sk{border-color:var(--r);color:var(--rt)}
.slayer.def .sk{border-color:var(--b);color:var(--bt)}
.slayer.rx .sk{border-color:var(--y);color:var(--y)}

/* card frame overlay — real FaB corner order */
.cfw{position:relative;width:100%}
/* the face's box is reserved before the lazy image arrives, so a rail of cards
   does not grow under the finger as the art loads (and the offline stand-in
   takes the room a real face takes) */
.cfw:not(.hz)>img{width:100%;aspect-ratio:5/7;object-fit:cover}
.b-pit,.b-cost,.b-atk,.b-def{position:absolute;font-family:'Spline Sans Mono';font-weight:700;font-size:var(--fs-lg);line-height:1;padding:2px 5px;color:#FFF;background:rgba(16,12,10,.92);border:1px solid var(--line)}
.b-pit{top:2px;left:2px;border:none}
.b-pit.p1{background:var(--r)}
.b-pit.p2{background:var(--y);color:var(--ink)}
.b-pit.p3{background:var(--b)}
.b-cost{top:2px;right:2px;border-color:#E8DFD0}
.b-atk{bottom:2px;left:2px;border-color:var(--r)}
.b-def{bottom:2px;right:2px;border-color:var(--b)}
.b-typ{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.07em;text-transform:uppercase;background:rgba(16,12,10,.9);color:var(--bone-dim);padding:1px 4px;border:1px solid var(--line);white-space:nowrap;pointer-events:none}
.cfw.sm .b-pit,.cfw.sm .b-cost,.cfw.sm .b-atk,.cfw.sm .b-def{font-size:var(--fs-xs);padding:1px 3px}
.cfw.sm .b-typ{padding:0 3px}
/* TEXT FLOOR (v7.00): 8 px is the smallest text on the board; at 8 px the type chip is wider than the gap between the power and defense badges, so on a card that prints either it sits just above them (badge height + 3) instead of covering a number */
.cfw:has(.b-atk,.b-def) .b-typ{bottom:21px}
.cfw.sm:has(.b-atk,.b-def) .b-typ{bottom:17px}
/* A SPLIT CARD IS PRINTED SIDEWAYS, so it is TURNED to be read (v3.35).
   The database ships the art portrait with its content rotated; upright
   needs -90deg, which was checked by rendering both directions rather
   than reasoned about — 90deg comes out upside down.

   `--hzr` is the card's real aspect the other way up (546x763 -> 1.3974),
   and the two calcs derive the image box from it: `width` is 100/1.3974%
   of the frame's WIDTH, which equals the frame's height, and `height` is
   1.3974x the frame's HEIGHT, which equals its width. Rotated, that fills
   the landscape frame exactly with no crop. Keep the three in step. */
.cfw.hz{--hzr:1.3974;aspect-ratio:var(--hzr);overflow:hidden}
.cfw.hz>img,.cfw.hz>.ccfall{position:absolute;top:50%;left:50%;display:block;
  width:calc(100% / var(--hzr));height:calc(100% * var(--hzr));
  transform:translate(-50%,-50%) rotate(-90deg)}
/* the corner badges stay UPRIGHT — they are the engine's overlay, not
   part of the printed face, and a rotated pitch pip is unreadable */
.cfw.hz .b-atk,.cfw.hz .b-def{display:none}
.hand{gap:5px}
.gearrow .g{width:62px}
.boardrow .b{width:62px}
.dg{width:40px}

.hcard.rand .fallbackart{aspect-ratio:1/1;font-size:var(--fs-big);color:var(--y)}
.hcard.rand{box-shadow:inset 0 -2px 0 var(--y)}
.shell{padding-left:8px;padding-right:8px}
.board{gap:8px}
.dummy{padding:10px}
.heroplate{padding:5px 7px}
.ticker{min-height:38px}
.hand{gap:4px}
.gearrow .g{width:64px}
.boardrow .b{width:64px}

/* tabletop — 3 vertical flick screens, each with a horizontal swipe pane */
.tablewrap{height:var(--tv);overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;margin-top:4px;border:1px solid var(--line)}
.vscreen{scroll-snap-align:start;scroll-snap-stop:always;height:var(--tv);min-height:var(--tv);display:flex;flex-direction:column;overflow:hidden;background:var(--ink)}
.vscreen .hscroll{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hpane{flex:0 0 100%;max-width:100%;overflow-y:auto;padding:5px 6px 10px;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always}
.screennav{display:flex;gap:5px;margin:6px 0 0}
.screennav button{flex:1;padding:6px 0;font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;background:var(--forge2);border:1px solid var(--line);color:var(--bone-dim)}
/* ONE LINE, ALWAYS (1.0 polish audit). At the table the first button names the
   foe hero, and "▲ LYATH GOLDMANE" wrapped to two lines at 393px: the row grew
   11px and pushed the fixed-height board down the page. A long name ellipsizes. */
.screennav button{white-space:nowrap;min-width:0;padding-left:3px;padding-right:3px}
.screennav button .navtx{display:block;overflow:hidden;text-overflow:ellipsis}
/* A THUMB-SIZED HIT AREA ON THE JUMP ROW (decision B, CEO 2026-11-02). The row
   draws 25px; an invisible ::after takes the tap over 44px with no layout change.
   Up 16px lands on the board's top margin or the loadout's top bar (no control
   in either); down 4px stops at the top edge of the screens below, whose panes
   scroll controls under their padding. Never sideways: the buttons sit 5px
   apart. This is why the ellipsis lives on an inner span: overflow:hidden on
   the button itself would clip its own ::after. */
.screennav button{position:relative}
.screennav .sndbtn{font-size:var(--fs-xl);display:flex;align-items:center;justify-content:center;line-height:0;color:var(--y)}
.screennav .sndbtn.off{color:var(--bone-dim);opacity:.7}
.screennav button::after{content:"";position:absolute;inset:-17px 0 -5px}   /* inset is from the PADDING box: with the 1px border, -16/-4 measured 43 (R) */
.paneflag{text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);padding:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.modehint{font-size:var(--fs-sm);color:var(--y);text-align:center;padding:3px 0 6px;letter-spacing:.05em;text-transform:uppercase}
button.modehint{display:block;width:100%;min-height:44px;background:none;border:none;font-family:inherit}
.gyrow{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.gyrow .gyc{width:46px;flex:none}
.gyempty{font-size:var(--fs-lg);color:var(--bone-dim);font-style:italic;padding:10px 4px}
.histturn{margin-bottom:10px}
.histturn .htlabel{font-size:var(--fs-sm);color:var(--bone-dim);margin-bottom:3px;font-family:'Spline Sans Mono';letter-spacing:.08em;text-transform:uppercase}
.zstrip{background:var(--forge);border:1px solid var(--line);padding:6px 8px;margin-top:6px}
.zlbl{font-size:var(--fs-sm);letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:4px}
.zrow{display:flex;align-items:center;gap:6px;margin:4px 0}
.zk{font-family:'Spline Sans Mono';font-size:var(--fs-sm);color:var(--bone-dim);flex:none;width:50px}
.zthumbs{display:flex;gap:4px;overflow-x:auto;flex:1}
.mini{width:26px;flex:none}
.mini img,.mini .ct{width:100%;aspect-ratio:5/7;object-fit:cover;border:1px solid var(--line);background:var(--forge)}
.zpitch{display:flex;gap:5px}
.zpchip{font-family:'Spline Sans Mono';font-size:var(--fs-sm);border:1px solid var(--line);padding:0 4px}
.zempty{font-size:11.5px;color:var(--bone-dim);font-style:italic}

/* v1.01 sketch layout — boards + chain command center */
.prow{display:flex;gap:6px;overflow-x:auto;align-items:center;background:var(--forge);border:1px solid var(--line);padding:6px 8px;min-height:52px}
.prow .plbl{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);flex:none;writing-mode:vertical-rl;transform:rotate(180deg)}
.heror{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.wslot{flex:1;min-width:0;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;padding:3px}
.wslot.filled{border-style:solid}
.wslot .wempty{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);text-align:center}
.heromid{flex:1.25;background:var(--forge);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:3px;position:relative}
.heromid .hport2{width:56%;padding:0}
.heromid img.art{aspect-ratio:1/1;object-fit:cover;object-position:50% 16%;width:100%}
.heromid .fallbackart{aspect-ratio:1/1;font-size:16px}
.heromid .hname{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-lg);letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1}
.heromid .hlife2{font-family:'Big Shoulders Display';font-weight:800;font-size:24px;line-height:1;color:var(--rt)}
.heromid .hlbl{font-size:9px;letter-spacing:.12em;color:var(--bone-dim);text-transform:uppercase}
.midrow{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.armorgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;flex:1.1}
.armorgrid .g{width:auto}
.arscol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.arscol .slot{width:100%}
/* an EMPTY arsenal (the slot holds only its words) reads as a slot, not as a
   stray word: a dashed card-shaped outline, like the weapon slots beside it */
.arscol .slot:not(:has(*)){width:min(100%,92px)!important;aspect-ratio:5/7;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);text-align:center;padding:4px}
.rightcol{flex:1;display:flex;flex-direction:column;gap:6px}
.deckbox{background:var(--forge);border:1px solid var(--line);text-align:center;padding:7px 4px}
.deckbox b{display:block;font-family:'Big Shoulders Display';font-weight:800;font-size:24px;line-height:1;color:var(--y)}
.deckbox span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim)}
.pitchbox{background:var(--forge);border:1px solid var(--line);padding:5px}
.pitchbox .zlbl{margin-bottom:3px}
.pitchlist{max-height:118px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.pitchlist .pc{display:flex;align-items:center;gap:5px;font-size:10.5px}
.pitchlist .pc i{width:7px;height:7px;flex:none;font-style:normal}
/* THE STAGE HUD (G1a, docs/GRAPHICS-PLAN.md §3; design/STAGE.md §3.1 on design/stage). Always on, both
   boards, between the nav and the three screens. Two skewed fighting-game bars (±10°, 2px bone border); the
   life NUMERAL is a flat sibling BESIDE each bar's inner end, never over it (the fill, the trail and the
   ticks all move at the bar's ends), and no text node sits under a transformed ancestor (a page.js row
   walks it). The fill snaps on a loss; the red trail holds 350ms, then drains over 500ms; a gain grows
   the fill over 400ms. Height is fixed (--hudh) so the screens below can subtract it. */
:root{--hudh:52px}
.board .tablewrap,.board .vscreen{height:calc(var(--tv) - var(--hudh));min-height:calc(var(--tv) - var(--hudh))}
.stagehud{height:calc(var(--hudh) - 8px);display:flex;flex-direction:column;justify-content:center;gap:3px;padding:3px 8px;background:linear-gradient(180deg,var(--forge2),var(--forge));border:1px solid var(--line)}
.stagehud .shrow{display:flex;align-items:center;gap:4px;min-width:0}
.stagehud .shbar{position:relative;flex:1;min-width:0;height:14px;transform:skewX(-10deg);border:2px solid var(--bone);background:var(--ink);overflow:hidden}
.stagehud .shbar.r{transform:skewX(10deg)}
.stagehud .shbar i{position:absolute;top:0;bottom:0;left:0;display:block}
.stagehud .shbar.r i{left:auto;right:0}
.stagehud .shbar .trail{background:#C4302B;transition:width .5s ease-in .35s}
.stagehud .shbar .fill{background:linear-gradient(90deg,#B4441E,var(--y))}
.stagehud .shbar.r .fill{background:linear-gradient(270deg,#B4441E,var(--y))}
.stagehud .shbar .fill.up{transition:width .4s ease-out}
.stagehud .shbar .tick{width:100%;background-image:linear-gradient(90deg,rgba(20,16,14,.55) 1px,transparent 1px);background-size:var(--tk) 100%;opacity:.7}
.stagehud .shbar.danger{border-color:#FF7A6E;box-shadow:0 0 6px rgba(196,48,43,.8);animation:shdanger 1s ease-in-out 2}
@keyframes shdanger{50%{box-shadow:0 0 12px rgba(255,122,110,1)}}
.stagehud .shnum{flex:none;width:26px;text-align:center;font-family:'Big Shoulders Display';font-weight:800;font-size:20px;line-height:1;color:var(--bone)}
.stagehud .shnum.low{color:var(--rt)}
.stagehud .shover{flex:none;font-family:'Spline Sans Mono';font-size:var(--fs-sm);color:var(--ok)}
.stagehud .shturn{flex:none;min-width:44px;display:flex;align-items:center;justify-content:center;gap:2px;font-family:'Spline Sans Mono';font-size:var(--fs-md);color:var(--bone-dim);border:1px solid var(--line);background:var(--ink);padding:1px 3px;white-space:nowrap}
.stagehud .shturn b{color:var(--bone);font-size:var(--fs-lg)}
.stagehud .shturn .tk{color:var(--y)}
.stagehud .shside{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.stagehud .shside.r{justify-content:flex-end}
.stagehud .shwho{font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stagehud .shside.on .shwho{color:var(--y)}
.stagehud .pips{flex:none;display:flex;align-items:center;gap:2px}
.stagehud .pips i{width:7px;height:7px;border-radius:50%;background:var(--bone-dim);display:block}
.stagehud .pips .xn{font-family:'Spline Sans Mono';font-size:var(--fs-sm);color:var(--bone-dim);margin-left:2px}
.stagehud .shchip{flex:none;font-family:'Spline Sans Mono';font-size:var(--fs-sm);color:var(--bone-dim);white-space:nowrap}
.stagehud .shchip b{color:var(--bone);font-size:var(--fs-lg)}
.stagehud .shchip.on b{color:var(--y)}
@media (prefers-reduced-motion:reduce){.stagehud .shbar .trail,.stagehud .shbar .fill.up{transition:none}.stagehud .shbar.danger{animation:none}}
@keyframes lhhit{0%{transform:scale(1.35);color:var(--bone)}100%{transform:none}}
.scorebar{display:flex;align-items:center;gap:8px;background:var(--forge);border:1px solid var(--line);padding:6px 9px;font-family:'Spline Sans Mono';font-size:var(--fs-md)}
.scorebar .sside{flex:1}
.scorebar .sside.r{text-align:right}
.scorebar b{color:var(--y)}
.scorebar .hpme{color:var(--rt);font-size:var(--fs-body);font-weight:700}
.scorebar .hpopp{color:var(--rt);font-size:var(--fs-body);font-weight:700}
.featwrap{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.featured{width:min(60vw,225px);position:relative}
.linkchip{margin-top:4px;font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.1em;color:var(--y);border:1px solid var(--y);padding:1px 7px;text-transform:uppercase}
.featempty{border:1px dashed var(--line);width:min(60vw,225px);aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs-md);color:var(--bone-dim);padding:12px}
.oppstrip{display:flex;gap:5px;align-items:center;background:var(--forge2);border:1px solid var(--line);padding:5px 8px;font-size:var(--fs-sm);color:var(--bone-dim);letter-spacing:.06em;text-transform:uppercase}
.subchain{display:flex;gap:7px;overflow-x:auto;margin-top:8px;align-items:center}
.gamelog{display:flex;flex-direction:column;gap:5px}
.gamelog .gl{font-size:var(--fs-lg);padding:5px 8px;background:var(--forge);border-left:2px solid var(--line)}
.gamelog .gl:first-child{border-left-color:var(--y)}
/* a printed pip, in words (PipLine): tinted like the icon it stands for */
.pip{font-weight:600}
.pip-p{color:#E0705F} .pip-d{color:#8FB0D8} .pip-h{color:var(--ok)} .pip-i{color:var(--bone)}
.pip-r,.pip-c{color:var(--y)}
.chand{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}

.wslot:not(.filled){flex:.5;min-height:44px}
.featempty{border:1px dashed var(--line);width:100%;aspect-ratio:auto;padding:10px;font-size:var(--fs-md);color:var(--bone-dim);text-align:center}
.hpane.vfill{display:flex;flex-direction:column}
.vfillsp{flex:1;min-height:6px}
/* YOUR BOARD'S FOOTER STAYS ON THE PANE (UX roadmap §3.2). The pills (wasted,
   turn, seat, boost, inspect) sat after the spacer, so a board taller than the
   pane (a row of tokens, a weapon pair, a short phone) pushed them under its
   bottom edge, to be found by scrolling inside the pane. Sticky to the pane's
   bottom, on the ink ground, they ride over the content instead. The hpane's
   10px bottom padding is what -10px gives back. */
.hpane .mystat{position:sticky;bottom:-10px;z-index:2;background:var(--ink);margin-top:0!important;padding:8px 0 10px}
/* the toggles draw 29px; an invisible finger area takes them to 45px, inside
   the footer's own padding and half of the 8px gap on each side */
.mystat button.pill{position:relative}
.mystat button.pill::after{content:"";position:absolute;inset:-8px -4px}

.chand .hc{position:relative;padding:0;background:var(--forge);border:1px solid var(--line);transition:transform .12s}
.chand .hc.sel{transform:translateY(-5px);border-color:var(--y);box-shadow:0 0 0 2px var(--y)}
.chand .hc.dis{opacity:.4}
.defsel{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--b);color:#FFF;font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.08em;padding:1px 6px;z-index:2;white-space:nowrap}
.featfoe{width:min(60vw,225px);aspect-ratio:5/7;border:2px solid var(--r);background:linear-gradient(160deg,var(--forge2),var(--ink));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.featfoe .fx2{font-family:'Spline Sans Mono';font-size:16px;color:var(--ink);background:#8A7355;border:1px solid var(--ink);padding:2px 10px;border-radius:4px}
.featfoe b{font-family:'Big Shoulders Display';font-weight:800;font-size:46px;color:var(--rt);line-height:1}
.featfoe span{font-size:var(--fs-sm);letter-spacing:.14em;color:var(--bone-dim);text-transform:uppercase}

/* v1.06 judge pass: fixed action bar, playmat armor, deck back, tap */
.actbar{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:8px;max-width:544px;margin:0 auto}
.armorgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"head ." "chest arms" "legs .";gap:5px;flex:1.1}
.aslot{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;min-height:56px}
.aslot .wempty{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim)}
.deckback{width:100%;aspect-ratio:5/7;background:linear-gradient(150deg,#5A1310,#2A0908 55%,#1A0605);border:2px solid #7A2A1E;position:relative;display:flex;align-items:center;justify-content:center}
.deckback::before{content:"";width:46%;aspect-ratio:1;border:2px solid #B9542F;transform:rotate(45deg)}
.deckback::after{content:"✦";position:absolute;color:#D98A4A;font-size:17px}
/* a Cloaked piece's back: the same back as the deck, with the word on it */
.deckback.gback{overflow:hidden}
.gbtag{position:absolute;top:3px;left:50%;transform:translateX(-50%);z-index:2;background:var(--ink);border:1px solid #B9542F;color:#D98A4A;font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:0 4px;white-space:nowrap}
.gbname{position:absolute;bottom:2px;left:2px;right:2px;z-index:2;background:rgba(16,12,10,.9);color:var(--bone);font-size:9px;line-height:1.15;text-align:center;padding:1px 2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dcnt{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--y);color:var(--y);font-family:'Spline Sans Mono';font-size:var(--fs-lg);font-weight:700;padding:0 6px;z-index:2}
.tapwrap{display:block;transition:transform .28s}
.tapwrap.tapped{transform:rotate(90deg) scale(.72)}

.armorgrid .g,.armorgrid .aslot{max-width:118px;width:100%}
.wslot .cfw{max-width:118px;margin:0 auto}

/* v1.08 sideboarding table */
/* THE LOADOUT'S ACTION BAR IS A COLUMN, AND THE BOARD'S IS A ROW (v4.28).
   `.actbar` is shared, and `display:flex` with no direction is a ROW —
   right for the board, where `.actbar .a{flex:1}` lays four buttons out
   side by side, and wrong here from the moment v3.51 put a STACK in it:
   a button, its note, a second button, its note. Measured at 393x852 the
   four became four columns — the striped Fight button 66px wide, its
   disclosure squeezed into a 51px ribbon about six characters across.
   v3.51's own lesson was "a doc the player cannot read is not a
   disclosure — put it on the button"; it was put on the button and then
   rendered unreadable, which is the same sentence one layer down.
   The inline margins on those four already spell a stack, so `gap:0`
   lets them govern rather than adding a second spacing rule. */
.lo .actbar{flex-direction:column;gap:0;align-items:stretch}
/* A BAR OF CHOICES WRAPS RATHER THAN RUNNING OFF THE SCREEN (1.0 polish audit).
   The cost pickers put ONE BUTTON PER CARD in the board's row — "Banish <soul
   card>", "Discard <card>", "X = n" — and Boltyn's soul held enough that the
   last button sat at x 348..410 on a 393px screen, 62px wide and 121px tall,
   its name stacked a word per line. Up to four buttons still share one row
   (the board's normal bar); a fifth starts a second row, which grows the
   fixed bar upward. */
.actbar{flex-wrap:wrap}
.actbar>.a{min-width:calc(25% - 7px)}
/* THE HUB (v7.14, `HubBar`): the primary in the thumb lane (x 96..297 at 393, STAGE App. C.1),
   a 54-px plate whose flat edge sits on the bottom of the screen; secondaries in the corners,
   lifted 10 px like the old bar, small type that may wrap ("Defend — no reactions"). */
.actbar.hub{display:grid;grid-template-columns:minmax(0,1fr) min(212px,51vw) minmax(0,1fr);gap:8px;align-items:end;bottom:env(safe-area-inset-bottom)}
.actbar.hub .hubm>.a{display:flex;align-items:center;justify-content:center;width:100%;height:54px;padding:4px 10px;border-radius:30px 30px 0 0;font-size:17px;line-height:1.05;text-align:center;box-shadow:0 -4px 14px rgba(0,0,0,.45)}
.actbar.hub .hubm>.a.dis{font-size:12px}
.actbar.hub .hubl,.actbar.hub .hubr{display:flex;padding-bottom:10px}
.actbar.hub .hubl>.a,.actbar.hub .hubr>.a{width:100%;min-height:48px;padding:4px 5px;font-size:12.5px;letter-spacing:.05em;line-height:1.1;text-align:center}
.actbar.hub .hubl>.a.dis,.actbar.hub .hubr>.a.dis{font-size:10.5px;letter-spacing:.01em}
/* AND THE PRIMARY IS WEARING THE HOME SCREEN'S TYPE. `.battlebtn` is the
   30px striped BATTLE plate, which is right where it is the only thing on
   the screen and oversized here, where it is one of two options with a
   paragraph under each — it alone stood 56px of a 188px bar and pushed the
   scout pane's last line off the bottom. The plate stays (it is the
   signature, and the primary tap should look like one); only the type
   comes down, and only on this screen. */
.lo .actbar .battlebtn{font-size:var(--fs-h2);letter-spacing:.18em;padding:10px 8px}
/* ONE PLATE PER MODE (UX roadmap §3.3): the plate the foe picker chose, the
   other board as a plain button under it, and the two notes folded into a
   one-line disclosure. A hero's name rides on the plate, so it sets tighter
   to stay one line ("Fight Lyath Goldmane — Steady" at 360px). */
.lo .actbar>.battlebtn,.lo .actbar>.bigbtn{margin-top:0}
.lo .actbar>.lo2{margin-top:6px;min-height:44px}
.lo .actbar .battlebtn.lovs{font-size:19px;letter-spacing:.08em;padding:11px 8px}
.lowhy summary{min-height:44px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--bone-dim);line-height:1.35;cursor:pointer;list-style:none}
.lowhy summary::-webkit-details-marker{display:none}
.lowhy summary::after{content:"why?";flex:none;margin-left:auto;font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--y);border:1px solid var(--y);padding:2px 7px}
.lowhy[open] summary::after{content:"less"}
.lowhy p{font-size:11.5px;color:var(--bone-dim);line-height:1.5;margin:0 0 6px}
/* AND THE RESERVE IS MEASURED, NOT STATED. This read `calc(100vh - 236px)`
   — a number written when the bar was one button tall. With two options
   and their disclosure the bar stands 163px at 393x852, so the fixed bar
   painted over the bottom 29px of the pane and struck through the seating
   line. A hardcoded offset is wrong the moment the layout moves, which is
   exactly how `--peekbot` shipped (v2.52); `--lochrome` is measured off
   the live chrome in `Loadout`, and the literal here is only the value
   before the first frame. */
.lo .tablewrap,.lo .vscreen{height:calc(100vh - var(--lochrome, 236px));min-height:calc(100vh - var(--lochrome, 236px))}
.cutgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cutgrid .pick{display:block}
.pick.cut{opacity:.45}
.qstrip{display:block;text-align:center;font-family:'Spline Sans Mono';font-size:var(--fs-sm);background:var(--forge2);border-top:1px solid var(--line);padding:1px 0;color:var(--bone-dim)}
.pick.cut .qstrip{color:var(--rt)}
.cutx{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:var(--r);color:#FFF;font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-xl);letter-spacing:.1em;padding:2px 9px;z-index:2}
.loprev .heromid .hlife2{font-size:20px}

.b-zone{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:rgba(16,12,10,.92);color:var(--y);padding:1px 4px;border:1px solid var(--y);white-space:nowrap;z-index:2}
/* a DECLARED rail piece wears ⛨ DEF on its top edge, where the zone chip sits: the chip steps down under it (v7.11) */
.hc.sel .b-zone{top:13px}

/* v1.09 counters + playables strip */
.ctr{position:absolute;top:2px;left:2px;display:flex;gap:2px;z-index:3}
.ctr .cc{font-family:'Spline Sans Mono';font-size:9px;font-weight:700;padding:0 3px;border:1px solid var(--ink);color:var(--ink);line-height:1.3}
.ctr .cc.steam{background:#8Fb8d8}
.ctr .cc.rust{background:#B26A3C;color:#fff}
/* a +1{p} counter is a permanent gain that rides between turns, so it reads
   as the blade's own gold rather than as a status the way steam and rust do */
.ctr .cc.pow{background:#D9A441;color:#1a1206}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.extras .hc{position:relative}
.exlbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);margin:8px 0 2px}

/* v1.14 — the play-screen sketch: hands top/bottom, stack|card|defend center */
.playpane{display:flex;flex-direction:column;height:100%;padding:0!important;overflow:hidden}
.logpane{padding:6px 8px}
/* ONE SCREEN (v7.15): the board's middle screen is the only one in flow; the other two are sheets laid over it,
   shown one at a time from the jump row or a strip. Nothing scrolls the board vertically any more. */
.board .tablewrap{position:relative;overflow:hidden;scroll-snap-type:none}
/* the screen in flow fills the box INSIDE its border (it was the box's own height, 2 px over, clipped off the hand's
   foot); the board's z-indexed cards stay under a sheet */
.board .tablewrap>.vscreen:not(.side){isolation:isolate;height:100%;min-height:0}
.board .vscreen.side{position:absolute;inset:0;z-index:6;display:none;box-shadow:0 0 0 1px var(--y)}
.board .vscreen.side.open{display:flex;animation:sheetin .16s ease-out}
@keyframes sheetin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.board .vscreen.side.open{animation:none}}
.screennav button.on{border-color:var(--y);color:var(--y)}
/* 44 px DRAWN, the tap floor: a hit area outside the box would be cut by the clipping pane it sits at the edge of */
.bstrip{flex:none;display:block;width:100%;min-height:44px;padding:4px 8px;white-space:nowrap;
  background:var(--forge2);border:none;border-bottom:1px solid var(--line);color:var(--bone);font-family:'Spline Sans Mono';font-size:11px;text-align:left;position:relative}
.bstrip .bsin{display:flex;align-items:center;gap:6px;min-height:36px;overflow:hidden}
.bstrip.mine{border-bottom:none;border-top:1px solid var(--line)}
.bstrip.on{box-shadow:inset 0 0 0 1px var(--y)}
.bstrip .bsw{flex:none;font-family:'Big Shoulders Display';font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--y);max-width:30%;overflow:hidden;text-overflow:ellipsis}
.bstrip .bsc{flex:none;color:var(--bone-dim);text-transform:uppercase;letter-spacing:.04em}
.bstrip .bsc b{color:var(--bone);margin-left:2px}
.bstrip .bsc i{font-style:normal}
.bstrip .bsc .s{display:none}
@media (max-width:374px){.bstrip .bsc .l{display:none}.bstrip .bsc .s{display:inline}.bstrip .bsin{gap:5px}}
.bstrip .bsc.nil b{color:var(--bone-dim)}
.bstrip .bsa{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);padding:1px 5px;color:var(--bone)}
.bstrip .bsa b{color:var(--y);margin-left:3px}
.bstrip .bsgo{flex:none;margin-left:auto;color:var(--y);padding-left:4px}
.dhand{flex:none;display:flex;gap:5px;align-items:center;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--forge2)}
.dhand .hlbl,.phand .hlbl{flex:none;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);writing-mode:vertical-rl;transform:rotate(180deg);opacity:.85}
.dcardph{flex:none;width:40px;aspect-ratio:5/7;border:1px solid #7A2A1E;background:linear-gradient(150deg,#5A1310,#2A0908 55%,#1A0605);position:relative;opacity:.7}
.dcardph::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);width:42%;aspect-ratio:1;border:1px solid #B9542F}
.playmid{flex:1;min-height:0;overflow:hidden;display:flex;align-items:stretch;justify-content:space-between;gap:6px;padding:8px 4px}
.sidecol{flex:0 0 58px;display:flex;flex-direction:column;min-height:0;gap:4px}
.scol-lbl{font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.12em;text-transform:uppercase;padding-bottom:3px;border-bottom:1px solid var(--line)}
.sidecol.stack .scol-lbl{color:var(--rt)}
.sidecol.defend .scol-lbl{color:var(--bt)}
.scol-cards{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-top:2px}
.stackcard{width:100%;aspect-ratio:5/7;border:1px solid var(--line);overflow:hidden;flex:none;background:var(--forge);position:relative}
.stackcard img{width:100%;height:100%;object-fit:cover;display:block}
.stackcard .ccfall{font-size:9px;padding:2px;overflow:hidden;line-height:1.1}
.stackcard .ccfall .mono{display:none}
.chainclose{width:100%;margin-bottom:8px;padding:9px;background:var(--forge2);border:1px solid var(--y);color:var(--y);font-family:'Spline Sans Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.sidecol .dash{text-align:center;color:var(--bone-dim);opacity:.35;padding:14px 0;font-size:var(--fs-xl)}
.centerslot{flex:1 1 auto;max-width:206px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow-y:auto;gap:5px}
.centerslot .featured{width:100%}
.centerslot .featfoe{width:100%;aspect-ratio:5/7;gap:4px}
.centerslot .featfoe b{font-size:36px}
.centerslot .featfoe .fx2{font-size:var(--fs-lg);padding:1px 7px}
/* the empty featured slot is a faint card SILHOUETTE at 60% (UX roadmap §3.1):
   it said "a card lands here" in a dashed box the size of a real card, the
   loudest thing on an empty board */
.centerslot .featempty{width:60%;aspect-ratio:5/7;border:1px solid rgba(232,223,208,.1);border-radius:6px;
  background:linear-gradient(160deg,rgba(232,223,208,.05),rgba(232,223,208,.012));position:relative;
  display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:var(--fs-xs);color:var(--bone-dim);opacity:.8;padding:8px 6px;line-height:1.4}
.centerslot .featempty::before{content:"";position:absolute;top:40%;left:50%;width:28%;aspect-ratio:1;
  transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(232,223,208,.14)}
.centerslot .linkchip{font-size:var(--fs-xs);text-align:center}
.mini{border:1px solid var(--line);background:var(--forge);padding:4px 6px;font-size:10.5px;display:flex;flex-direction:column;gap:1px;line-height:1.3;word-break:normal;overflow-wrap:break-word;hyphens:none}
.mini.atk{border-left:2px solid var(--r)}
.mini.def{border-left:2px solid var(--b)}
.mini.foe{border-left:2px solid var(--r);background:rgba(178,60,60,.08)}
.mini.top{border-color:var(--y)}
.mini .mk{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim)}
.mini b{color:var(--rt)}
.sidecol .mini{width:100%;box-sizing:border-box}
.statusline{flex:none;font-size:10.5px;color:var(--bone-dim);padding:5px 8px;background:var(--forge);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.statusline b{color:var(--y)}
.statusline button{background:var(--ink);border:1px solid var(--y);color:var(--y);font-family:'Spline Sans Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;margin-left:6px;position:relative}
/* A FINGER-SIZED HIT AREA ON A PRINT-SIZED BUTTON (1.0 polish audit). "skip" and
   "✕ cancel" drew 15px tall, a target a thumb misses. The paint stays small; an
   invisible ::after takes the tap. Up 6px stays inside the line's own padding and
   border (nothing tappable above it); down 12px stops short of the hand rail's
   cards, which sit behind its 7px padding. */
.statusline button::after{content:"";position:absolute;inset:-6px -8px -12px}
.phand{flex:none;display:flex;gap:5px;align-items:stretch;overflow-x:auto;padding:7px 8px;border-top:1px solid var(--line);background:var(--forge2);scroll-snap-type:x proximity}
.phand .hlbl{align-self:center}
.phand .hc{flex:none;width:80px;position:relative;padding:0;background:var(--forge);border:1px solid var(--line);scroll-snap-align:start;transition:transform .12s}
.phand .hc.sel{transform:translateY(-6px);border-color:var(--y);box-shadow:0 0 0 2px var(--y)}
/* A CARD YOU CANNOT PLAY DIMS ITS ART, NOT ITS NUMBERS (v7.14, on the wheel; every hand row since v7.16). The rail's
   0.4 on the whole cell put a card's cost, power and defence under AA (3.8:1, "Attack" 2.3:1) in the reaction step,
   where most of a hand cannot be played. The art (or its stand-in's fill) darkens, the frame goes dashed, and the
   badges and the stand-in's words stay at full contrast. */
.board .phand .hc.dis,.board .phand .hc.peek.dis{opacity:1;border-style:dashed}
.phand .hc.dis .cfw>img{filter:brightness(.4) grayscale(.6)}
.phand .hc.dis .ccfall{background:var(--ink)!important}
.phand .hlbl{scroll-snap-align:start}
/* THE HAND ROW (v7.16; `HandRow`): the old flat rail, scrolled the phone's own way. The box is a native horizontal
   scroller (momentum, rubber band, no snap: a snap fights a flick); its one child `.hrin` is the row at its own
   width, centred while it fits (margin auto; a wider row overflows to the right and scrolls). The top padding is the
   peek's lift room: an x-scroller clips y as well. Card width `--hcw`: a quarter of the phone, 78..104 px; 76 px under
   700 px tall, where the stage needs the height. `overscroll-behavior-x` keeps a flick at the end from swiping the
   browser back a page. */
.phand.hrow{display:block;padding:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:none;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;--hcw:clamp(78px,24.5vw,104px)}
.phand.hrow::-webkit-scrollbar{display:none}
@media (max-height:700px){.phand.hrow{--hcw:76px}}
.phand.hrow>.hrin{display:flex;gap:6px;align-items:flex-end;width:max-content;margin:0 auto;padding:11px 10px 8px}
.phand.hrow .hc{width:var(--hcw);scroll-snap-align:none;transition:transform .14s ease-out}
.phand.hrow.wempty>.hrin{align-items:center;padding:8px 10px}
.phand.hrow .hrnone{font-family:'Spline Sans Mono';font-size:var(--fs-sm);color:var(--bone-dim);letter-spacing:.06em;padding:6px 0}
/* the ⛨ DEF badge sits inside the card: at the rail's old -7px the card's own clip-path cut its top off */
.phand.hrow .defsel{top:3px}
.phand.hrow .hc.sel .b-zone{top:23px}
/* a declared defender is ringed in steel and stays down; the yellow ring and the lift are the peek's alone */
.phand.hrow .hc.sel{transform:none;border-color:#9fb3c8;box-shadow:0 0 0 2px #9fb3c8}
.phand.hrow .hc.peek{border-color:var(--y)}
/* the +N on each edge: zero-width and sticky to that edge of the scroller (the old rail's `RailMore`, both sides) */
.phand.hrow .hrmore{flex:none;width:0;align-self:stretch;position:sticky;pointer-events:none;z-index:3}
.phand.hrow .hrmore.l{left:0;margin-right:-6px}
.phand.hrow .hrmore.r{right:0;margin-left:-6px}
.phand.hrow .hrmore.on::before{content:"";position:absolute;top:-11px;bottom:-8px;width:34px}
.phand.hrow .hrmore.l.on::before{left:-10px;background:linear-gradient(90deg,var(--forge2) 20%,rgba(0,0,0,0))}
.phand.hrow .hrmore.r.on::before{right:-10px;background:linear-gradient(270deg,var(--forge2) 20%,rgba(0,0,0,0))}
.phand.hrow .hrmore b{position:absolute;top:50%;transform:translateY(-50%);font-family:'Spline Sans Mono';font-size:var(--fs-sm);
  font-weight:700;color:var(--y);background:var(--ink);border:1px solid var(--y);padding:1px 4px;letter-spacing:.04em}
.phand.hrow .hrmore.l b{left:3px}
.phand.hrow .hrmore.r b{right:3px}
@media (prefers-reduced-motion: reduce){.phand.hrow .hc{transition:none}}

/* v2.07 prompt sheet — the rulings ask for a popup that leaves the hand
   visible, so it docks above the action bar instead of covering the screen. */
.psheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--forge);
  border-top:2px solid var(--y);box-shadow:0 -14px 40px rgba(0,0,0,.6);
  max-height:64vh;display:flex;flex-direction:column;animation:pup .18s ease-out}
@keyframes pup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.psheet .ph{flex:none;display:flex;align-items:baseline;gap:8px;padding:10px 12px 6px}
.psheet .pt{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.psheet .psrc{font-size:var(--fs-sm);color:var(--y);text-transform:uppercase;letter-spacing:.1em}
.psheet .phint{flex:none;padding:0 12px 9px;font-size:11.5px;color:var(--bone-dim);line-height:1.45}
.psheet .prow2{flex:1;min-height:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:0 12px 10px}
.psheet .pcard{flex:none;width:86px;background:none;border:none;padding:0;position:relative;transition:transform .12s}
.psheet .pcard .cfw{border:1px solid var(--line);border-radius:3px;overflow:hidden}
.psheet .pcard.down{opacity:.5;transform:translateY(8px)}
.psheet .pcard.down .cfw{border-color:var(--r)}
.psheet .ptag{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Spline Sans Mono';font-size:var(--fs-xs);
  letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:2px;
  background:var(--ok);color:var(--ink)}
.psheet .pcard.down .ptag{background:var(--r);color:var(--bone)}
.psheet .pact{flex:none;display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--line);background:var(--forge2)}
.psheet .pact button{flex:1;padding:11px 8px;font-family:'Big Shoulders Display';font-weight:700;
  font-size:var(--fs-body);letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;color:var(--bone-dim)}
.psheet .pact button.go{background:var(--y);color:var(--ink);border-color:var(--y)}
/* v2.17 — the other prompt variants: pick, modal, pay-or-decline, reveal */
.psheet .pact button.go.off{background:var(--forge);color:var(--bone-dim);border-color:var(--line)}
.psheet .pcard.sel .cfw{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.psheet .pcard.sel .ptag{background:var(--ok);color:var(--ink)}
.psheet .pcard.flat{opacity:1}
.psheet .poptcol{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:6px}
.psheet .parrows{display:flex;gap:6px}
.psheet .parrows button{min-width:38px;min-height:30px;padding:0;font-size:14px;line-height:1;background:var(--forge2);color:var(--bone);border:1px solid var(--line);border-radius:4px}
.psheet .parrows button:disabled{opacity:.3}
.psheet .pside{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--rt);
  border:1px solid var(--r);border-radius:2px;padding:1px 5px;margin-left:auto}
.psheet .pcount{align-self:center;font-family:'Spline Sans Mono';font-size:var(--fs-sm);
  letter-spacing:.08em;color:var(--bone-dim);padding:0 4px}
.psheet .pstat{flex:none;display:flex;align-items:center;gap:10px;margin:0 12px 9px;padding:6px 10px;border-left:3px solid var(--ok);background:var(--forge2)}
.psheet .pstat.bad{border-left-color:var(--r)}
.psheet .pstat .pn{font-family:'Big Shoulders Display';font-weight:800;font-size:30px;line-height:1;color:var(--ok)}
.psheet .pstat.bad .pn{color:var(--rt)}
.psheet .pstat .pn small{font-size:var(--fs-body);color:var(--bone-dim)}
.psheet .pstat .pl{display:flex;flex-direction:column;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:.08em}
.psheet .pstat .ps{font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--bone-dim)}
.psheet .pmodal{flex:none;display:flex;flex-direction:column;gap:6px;padding:0 12px 10px}
.psheet .popt{text-align:left;padding:11px 12px;background:var(--forge2);border:1px solid var(--line);
  border-radius:3px;color:var(--bone);font-family:'Big Shoulders Display';font-weight:700;
  font-size:var(--fs-body);letter-spacing:.04em}
.psheet .popt.on{border-color:var(--y);background:var(--y);color:var(--ink)}
.psheet .popt:disabled{opacity:.45}
.psheet .popt .sub{display:block;font-family:'Spline Sans Mono';font-weight:400;font-size:9.5px;
  letter-spacing:.05em;opacity:.75;margin-top:2px}

/* active-modifier rail — the engine tracks a lot of state the board never showed */
.rail{display:flex;gap:5px;flex-wrap:wrap;padding:5px 8px;background:var(--forge2);border-bottom:1px solid var(--line)}
.rail .rp{font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;background:var(--forge);border:1px solid var(--line);color:var(--bone-dim)}
.rail .rp.on{border-color:var(--y);color:var(--y)}
.rail .rp.warn{border-color:var(--r);color:#f0a9a5}

/* v2.19 — the two-tap hand. First tap peeks the card at a readable size,
   second tap commits. The peek docks above the action bar rather than
   covering the screen, so the rail underneath stays visible and the second
   tap has somewhere to land. */
/* THE WRAPPER MUST NOT EAT THE TAP (v2.36). It spans the full width and is
   mostly empty space, and with pointer-events:auto that empty space sat on
   top of the hand rail and swallowed every tap aimed at a card. On a tall
   window nothing overlapped and it looked fine; on a 393x852 phone the rail
   lands underneath it, the second tap hit the wrapper's dismiss handler
   instead of the card, and hand cards became UNPLAYABLE — tap, peek, tap,
   peek, forever. The comment above always said the rail underneath had to
   stay tappable; this is what makes that true. Only the visible preview
   takes pointer events, so tapping the card art still dismisses. */
/* `--peekbot` is MEASURED off the live hand rail (see the uE in PeekDock, which
   BOTH boards render) so the preview always sits ABOVE the hand rather than on
   top of it. The 112px fallback is the old flat value — the action-bar
