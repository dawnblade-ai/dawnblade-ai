       the answer becomes a DECLINE rather than a free prevention. An
       unpaid cost that fires its rider is the v2.04 free-ability bug, and
       here it would be silent: the hero would soak arcane with iron they
       never paid for. `avail` is computed at build time now, so this
       should be unreachable — which is exactly the kind of "should" this
       codebase has been bitten by, and the fallback costs one line.

       floating pool first and only pitches the shortfall, which is the

    let r = applyPrompt(n, {...live, sel: DawnEffects.soakPolicy(live, opp(s))});

     `tryPlay(card, "ally", i)` as of v3.44, so `boardPow` deliberately
     returns null for an ally and the cell tries the ally route first. */
  const boardPow = b => {
    if(!b || !b.card || b.kind==="ally" || !b.card.tx) return null;
    const pw = parseHeroPower(b.card.tx, true);
    if(!pw) return null;
    return {name:b.card.name+" — ability", pitch:0, cost:pw.cost, power:null, def:null,
      tt:"Arena Ability", kw:pw.ga?["Go again"]:[], tx:pw.eff, sd:pw.sd,
      /* THE WINDOW FLAG BELONGS ON EVERY ROUTE THAT BUILDS A POWCARD
         (v3.63). Left off here, an arena permanent printing an
         "Attack Reaction - …" ability is built with no window at all and
         is therefore offered at ACTION speed — the exact sev-3 the anchor
         fix removed from `build.js`, waiting in a third place. Bait is the
         pool's only such token and nothing can create it, so this is a
         guard rather than a fix; `fxParse` credits the clause as read, and
         a credit with no route is the no-op blind spot. */
      _instant:pw.kind==="instant", _attackRx:pw.kind==="attackRx",
      img:b.card.img, dbImg:b.card.dbImg,
      _gearArt:true, uid:"bp"+b.uid};
  };
  /* ---- A CARD IN HAND WITH AN ACTIVATED ABILITY (v2.61) ----------------
     Two pool cards print one and NEITHER had any route to it: only gear
     (build.js) and arena permanents (boardPow) ever got a powCard, so
     "Instant - Discard this: …" on a card in hand was unreachable even
     though its effect parses perfectly.

       Agile Windup           Instant - Discard this: Create an Agility token
       Rally the Coast Guard  Once per Turn Instant - Discard a card:
                              This gets +3{d}   (+ "only while defending")

     Same shape as boardPow — a synthetic card standing for the ability, so
     the two-tap peek shows the ABILITY's text, which is what you are
     deciding about rather than the card it hangs on. Three more pool cards
     come online with it (Arcane Twining, Photon Splicing, Reaper's Call);
     nothing here is special-cased by name. */
  const handPow = c => {
    const ha = c && fxParse(c).handAbility;
    if(!ha) return null;
    return {name:c.name+" — ability", pitch:0, cost:0, power:null, def:null,
      tt:"Card Ability", kw:[], tx:ha.eff, _instant:true,
      img:c.img, dbImg:c.dbImg, _gearArt:true, uid:"ha"+c.uid, _forUid:c.uid};
  };
  /* CAN IT BE ACTIVATED RIGHT NOW? The rule is `effects.handAbilityOK`
     (v3.05) — shared, so judge.js can ask the identical question. This
     adds only the trainer's own busy-modes, which are not a rule about
     the ability: a sheet is open, so nothing else may start. */
  const handAbilityOK = (s, c) => {
    if(["pay","arsenal","boostpick","defpay"].indexOf(s.mode) >= 0) return false;
    return DawnEffects.handAbilityOK(s, c);
  };
  /* THE PAYMENT AND THE OPS ARE SHARED; the DEFENCE BUFF is this board's.
     `finishBlock` reads a per-uid bonus map, which is how confirmDefPay
     already routes a +{d} onto a specific defender, and `runOps` has no
     way to raise one — so `activateHandAbility` hands the number back and
     this routes it. Same split as `linkPumps`/`linkPayload`. */
  const activateHand = c => setG(s=>{
    if(["pay","arsenal","boostpick","defpay"].indexOf(s.mode) >= 0) return s;
    const r = _EFX.activateHandAbility(s, c);
    if(r.why) return L(s, r.why + ".");
    let n = r.game;
    if(r.dbuff){
      n.defBonus = {...(n.defBonus||{}), [c.uid]:((n.defBonus||{})[c.uid]||0)+r.dbuff};
      n = L(n, `${c.name} braces — +${r.dbuff} defence on the wall.`);
    }
    return winCheck(openPrompt(n));
  });
  /* AN ALLY ATTACKS THROUGH THE ONE COMBAT PATH (v3.44).

     This used to be a FABRICATION, in the same family as `foeSwing`'s
     [3,4,5]: it took the ally's printed power straight off the opposing
     hero's life. No cost was charged though every ally prints one, `{t}`
     and `Once per Turn` were collapsed into one blanket `spent`, the
     printed go again on Limpit was dropped, and — the expensive part —
     there was NO DEFEND STEP, so a 7-power Swabbie was unblockable, free
     and repeatable every turn. The log even said "(ally — simplified, no
     action point)".

     It is `tryPlay(card, "ally", …)` now, which is the same door a weapon
     swing goes through, so the ally gets a real `pend`, a real wall, its
     on-hit text, its action point (charged at resolution, kept on go
     again) and every next-attack grant that names it — which is what
     makes Avast Ye! and Yo Ho Ho! real cards. */
  const closeChain = () => setG(s=>{
    if(s.mode!=="act" || !s.chainOpen) return s;
    const hEntry = s.chain.length ? [{turn:s.turn, links:s.chain}, ...(s.chainHist||[])].slice(0,8) : (s.chainHist||[]);
    return L({...s, chain:[], chainHist:hEntry, chainOpen:false, boostChain:0, featured:null}, `Chain closed — ${s.chain.length} link${s.chain.length!==1?"s":""} banked. Non-attacks free to play.`);
  });
  /* ===================================================================
     THE END PHASE — CR 4.4, in the CR's own fixed order.

     CR 4.4.1: "Players do not get priority during the End Phase."
     CR 4.4.3 is an ORDERED procedure and the order is load-bearing:

       a  all allies' life totals reset to base
       b  the turn-player may put a card face-down into an empty arsenal
       c  pitch zones go to the bottom of their owners' decks
       d  the turn-player untaps all permanents they control
       e  ALL PLAYERS lose all action points and resource points
       f  the turn-player draws to intellect (others on turn one only)

     What was here before ran e -> c -> b -> f, and (a) and (d) did not
     happen in the end phase at all: ally life was never reset anywhere,
     and the untap was folded into the next turn's setup. It also lost
     only the TURN-PLAYER's resources, where the CR says all players —
     invisible today because the dummy floats nothing, and a real bug the
     moment a second hero can bank a resource during your turn.
     =================================================================== */
  const endTurn = () => setG(s=>{
    if(s.over||s.mode!=="act") return s;
    let n = L({...s}, "— End phase (CR 4.4). No priority. —");

    /* Beginning-of-end-phase triggers, ahead of (a). */
    n = beginEndPhase(n, 0);

    /* (a) CR 4.4.3a — ally life resets to base. Allies heal every turn, so
       ally damage is a per-turn RACE rather than attrition, which is what
       makes attacking one a real decision (CR 1.4.5). */
    n = endPhaseAllies(n);

    /* (b) CR 4.4.3b — the arsenal set. It is the turn-player's CHOICE, so
       it pauses here; steps c-f resume in afterArsenal. */
    if(!you(n).arsenal && you(n).hand.length)
      return L({...n, mode:"arsenal"}, "(b) Arsenal — set one card face down, or skip.");
    if(you(n).arsenal) n = L(n, `(b) Arsenal already holds ${you(n).arsenal.name} — nothing to set.`);
    else n = L(n, "(b) No cards in hand — nothing to arsenal.");
    return afterArsenal(n);
  });
  /* CR 4.4.2 — THE BEGINNING OF THE END PHASE, before (a). The EVENT lives
     in `DawnEffects.beginEndPhase`, pure and seat-relative, so a drill can
     drive it instead of grepping for it and the table runs the same one.
     This is the trainer's half: log the messages, run the ops.

     It is genuinely earlier than the (c)-(f) block `endPhaseCF` owns —
     Inertia sweeps hand and arsenal, so it has to land before (b) invites
     this seat to arsenal a card about to go to the bottom of the deck
     anyway. Same final state either way, which is exactly why putting it
     in the wrong place would never have been noticed.

     THREE MORE EVENTS USED TO SIT OUTSIDE IT (v3.17), inline in `endTurn`
     and written against `you(n)`: rust destruction, the idle counter wipe
     and intimidate's return. Seat 0, one board. Anything added here goes
     in the shared body, not beside the call. */
  function beginEndPhase(s, si){
    const r = DawnEffects.beginEndPhase(s, si);
    let n = r.game;
    r.msgs.forEach(m => { n = L(n, m); });
    if(r.ops.length) n = _EFX.runOps(n, r.ops, r.fired.join(", "));
    return n;
  }

  /* CR 4.4.3a. Runs over BOTH seats: an ally the opponent controls heals on
     their controller's schedule too, and building it one-sided now would be
     a bug to find later rather than a line to write now. */
  function endPhaseAllies(s){
    let n = s, healed = 0;
    for(const si of [0,1]){
      const sd = n.sides[si]; if(!sd || !sd.board) continue;
      /* count BEFORE, from the same predicate resetAllyLife uses: an ally
         carrying less than its printed life. `life` is the current total and
         `card.life` the base — the reset is the engine's, not a second copy. */
      const hurt = sd.board.filter(b => b && b.kind==="ally" && b.card &&
                                        b.card.life!=null && b.life!=null && b.life < b.card.life).length;
      if(!hurt) continue;
      n = resetAllyLife(n, si);
      healed += hurt;
    }
    n = L(n, healed ? `(a) ${healed} all${healed>1?"ies":"y"} heal to base life.`
                    : "(a) No allies to heal.");
    return n;
  }
  const pickArsenal = idx => setG(s=>{
    if(s.mode!=="arsenal") return s;
    let n = {...s};
    const arSide = youMut(n);
    arSide.arsenal = you(s).hand[idx];
    arSide.hand = you(s).hand.filter((_,i)=>i!==idx);
    return afterArsenal(L(n,`${you(n).arsenal.name} set face down in arsenal.`));
  });
  const skipArsenal = () => setG(s=> s.mode==="arsenal" ? afterArsenal(L(s,"(b) Arsenal left empty — nothing set.")) : s);
  /* HEAVE — THE ARSENAL SET THAT PAYS (v3.32). The gate, the payment, the
     face-up put and the mint all live in `DawnEffects.heave`; this is the
     trainer's half of the CHOICE, and judge.js asks the identical body
     from its own arsenal pause. A rule restated here would be a second
     description of it. */
  const doHeave = () => setG(s=>{
    if(s.mode!=="arsenal") return s;
    const off = DawnEffects.heaveOffer(s, 0);
    if(!off) return L(s, "Nothing in hand can be heaved right now.");
    const h = DawnEffects.heave(s, 0, off.uid);
    let n = h.game;
    for(const m of h.msgs) n = L(n, m);
    if(h.ops.length) n = runOps({...n, actor:0}, h.ops, "Heave");
    return afterArsenal(n);
  });
  /* Steps (c) through (f), for WHICHEVER SEAT is ending its turn. Split
     from endTurn only because (b) is a choice that has to pause for the
     player; this is the same procedure continuing.

     ONE END PHASE, NOT TWO (v2.71). Until now this procedure existed for
     seat 0 alone, and seat 1's "end phase" was a stand-in refill buried
     in newTurn — the same two-unrelated-bodies shape that let clash fire
     on the wrong trigger for five versions, and the reason effects keyed
     to the opponent's turn had nothing to expire on. It is actor-relative
     throughout and `foeEnd` runs it with the actor borrowed to seat 1,
     exactly the way foePlay borrows it for a card's own effects.

     Everything that genuinely DIFFERS by seat is named as a difference
     rather than as a second copy: the invented fatigue loss stays seat
     0's (the dummy reshuffles instead, which is a training affordance and
     is logged), and CR 4.4.3f's second sentence — the first-turn refill
     for all OTHER players — is asked of whichever seat is not ending. */
  function endPhaseCF(s, si){
    const _prevActor = s.actor||0;
    let n = {...s, actor:si};
    const _me = () => act(n).name, _you = () => /^you$/i.test(act(n).name||"");

    /* FROSTBITE'S END-PHASE EXPIRY MOVED TO `beginEndPhase` (v3.17), and
       the reason is worth keeping. It sat here, a step or two after "the
       beginning", with a comment arguing that (a) ally life and (b) the
       arsenal set are all that run ahead of it and neither plays a card,
       so nothing in the pool can tell the difference. That was true of
       the STATE and false of the FEED: Frostbite's printed line is "at
       the beginning of your end phase, destroy this", so the token is
       minted with `sd:"end"` and the arena sweep — which DOES run at the
       beginning — took it first. The thaw then found nothing and its line
       never printed, so the player was told a token "is destroyed" rather
       than what it cost them. Two readers of one rule, and the order
       decided which one spoke.
       Both now sit in `DawnEffects.beginEndPhase`, in that order. */

    /* (c) CR 4.4.3c — pitch zones to the BOTTOM of their owners' decks.
       Both seats: it says "their pitch zone", not the turn-player's. */
    let pitched = 0;
    for(const si of [0,1]){
      const sd = n.sides[si]; if(!sd || !sd.pitch || !sd.pitch.length) continue;
      pitched += sd.pitch.length;
      n = {...n, sides: n.sides.map((x,i)=> i!==si ? x : {...x, deck:[...x.deck, ...x.pitch], pitch:[]})};
    }
    n = L(n, pitched
      ? `(c) ${pitched} pitched card${pitched>1?"s":""} to the bottom of the deck.`
      : "(c) Pitch zones are empty.");

    /* (d) CR 4.4.3d — the turn-player untaps all permanents they control.
       `weaponUsed` is what "tapped" means here: a weapon that has swung and
       an equipment ability that has been activated. It used to happen at the
       top of the next turn, which is the same thing today and is NOT once a
       second seat has a turn between yours. */
    const tapped = Object.keys(act(n).weaponUsed||{}).length;
    actMut(n).weaponUsed = {};
    /* THE HERO UNTAPS HERE TOO (v3.48). RULING (user, 2026-08-25): a
       tapped hero "cannot be tapped again to pay a cost", and this is the
       step that lifts it — the turn-player's own, so a hero tapped by an
       opponent stays tapped for the rest of that turn and no longer. */
    if(act(n).heroTapped) actMut(n).heroTapped = false;
    n = L(n, tapped ? `(d) ${_me()} untap${_you()?"":"s"} ${tapped} permanent${tapped>1?"s":""}.`
                    : `(d) Nothing of ${_you()?"yours":_me()+"'s"} is tapped.`);
    /* THE OTHER SEAT KEEPS ITS TAPS AND LOSES ITS ALLOWANCE. CR 4.4.3d
       untaps the TURN-PLAYER's permanents only, but `Once per Turn` is a
       per-turn allowance that comes back at every turn boundary for
       everyone — and `weaponUsed` conflates the two. They coincide for a
       weapon swing (action speed, so a seat only reaches it on its own
       turn) and stop coinciding at the first `Instant - Once per Turn`
       equipment ability, which is Crucible of Aetherweave, which is in
       Iyslander's gear and is now activatable on the opponent's turn.
       Without this, using it on their turn would make it once per ROUND. */
    foeMut(n).weaponUsed = perTurnCleared(foe(n));

    /* (e) CR 4.4.3e — "All players lose all action points and resource
       points." ALL, not just the turn-player. Score counts wasted resources,
       so the fizzle is tallied as it happens. */
    let fizzled = 0;
    for(const si of [0,1]){
      const sd = n.sides[si]; if(!sd) continue;
      const lost = sd.res||0; fizzled += lost;
      n = {...n, sides: n.sides.map((x,i)=> i!==si ? x : {...x, res:0, ap:0, wasted:(x.wasted||0)+lost})};
    }
    n = L(n, fizzled
      ? `(e) All players lose their points — ${fizzled} floating resource${fizzled>1?"s":""} wasted.`
      : "(e) All players lose their points — nothing was floating.");
    /* THE "THIS TURN" GRANTS EXPIRE IN `beginEndPhase` NOW (v3.34), where
       both boards reach them and both seats are covered. This line cleared
       two of the five, for one seat, on one board. */

    /* (f) CR 4.4.3f — the turn-player draws up to intellect.

       THE RESHUFFLE IS SEAT 1'S ONLY, AND IT IS A TRAINING AFFORDANCE.
       "A sparring partner that decked out would stop sparring" — true of
       the prop, false of a hero, so it is gated on `_dummy` and logged.
       SEEDED, because the recycle decides every card the opponent draws
       for the rest of the game and an unseeded shuffle there breaks
       replay exactly when the game gets interesting. */
    let need = Math.max(0, act(n).int - act(n).hand.length);
    if(need > 0 && act(n).deck.length < need && (act(n).grave||[]).length && bOf(si)._dummy){
      const _gs = rngShuffle(n.rng, act(n).grave); n.rng = _gs.rng;
      const rc = actMut(n); rc.deck = [...act(n).deck, ..._gs.arr]; rc.grave = [];
      n = L(n, "The dummy gathers its spent cards and shuffles them back — it never tires.");
    }
    const drawn = act(n).deck.slice(0,need);
    actMut(n).hand=[...act(n).hand,...drawn]; actMut(n).deck=act(n).deck.slice(need);
    n = L(n, drawn.length ? `(f) ${_me()} draw${_you()?"":"s"} ${drawn.length} back up to intellect ${act(n).int}.`
                          : `(f) Hand is already at intellect ${act(n).int} — no draw.`);
    /* RULING (Knucklehead): the rolled intellect governs THIS draw, then the
       lingering macro clears — restore the printed value once cards are in.
       ONE BODY, BOTH BOARDS (v3.49). This was written out here and nowhere
       else, so at the table the rolled value never came back at all. */
    { const _si = DawnEffects.settleIntellect(n, actorOf(n));
      n = _si.game; for(const m of _si.msgs) n = L(n, m); }
    n.revealed = null;

    /* CR 4.4.3f, second sentence — "If it is the first turn of the game,
       ALL OTHER PLAYERS draw cards until the number of cards in their
       hand is equal to their hero's intellect." This is what pays the
       second player back for blocking the opening swing. It used to live
       in finishBlock's `_opening` branch, which could only ever say it
       for seat 0; asked of whichever seat is NOT ending, it covers both
       seatings with one rule. */
    const firstTurn = si===0 ? n.turn===1 : !!n._opening;
    if(firstTurn){
      const oNeed = Math.max(0, foe(n).int - foe(n).hand.length);
      if(oNeed > 0){
        const os = foeMut(n); const take = foe(n).deck.slice(0,oNeed);
        os.hand = [...foe(n).hand, ...take]; os.deck = foe(n).deck.slice(take.length);
        if(take.length) n = L(n, `${foe(n).name} draws back up to ${foe(n).int} — first turn of the game (CR 4.4.3f).`);
      }
    }

    /* THE INVENTED FATIGUE LOSS IS SEAT 0'S, deliberately (CR 4.5.3 lists
       three ways to lose and this is not one of them). Left alone rather
       than generalised: seat 1 reshuffles above, so changing it is a
       decision about solo play, not a rules fix. */
    if(si===0 && drawn.length<need && act(n).hand.length===0){
      n.over={win:false}; return {...L(n,`Deck empty — fatigued. ${foe(n).name} wins by attrition.`), actor:_prevActor};
    }
    /* THE BLOODROT TICK IS GONE (v3.09). It was a per-turn, unavoidable,
       never-expiring drain standing in for a token that prints a ONE-SHOT
       the controller can buy out of: "at the beginning of your end phase,
       destroy this, then it deals 2 damage to you unless you pay
       {r}{r}{r}". Bloodrot Pox is a real board Aura now, so its own
       schedule fires it (`sweepArena`, both boards) and `selfPayOr` offers
       the escape hatch the tick never did. */
    return {...n, actor:_prevActor};
  }
  /* The player's end phase continues here after the arsenal choice, then
     hands the turn to seat 1. */
  function afterArsenal(s){
    const n = endPhaseCF(s, 0);
    return n.over ? n : foeBegin(n);
  }
  /* PITCH ON DEMAND, AT INSTANT SPEED. Pitching is never proactive (ruling,
     2026-08-01): the pool is filled only when something costs more than you
     hold. On your own turn `mode:"pay"` asks with a sheet; in an instant
     window there is no room to pause for one, so the lowest advisor-valued
     cards go first — the rule auto-pitch has always followed for the
     arsenal instant, stated once here instead of twice. Returns null when
     the cost cannot be reached, so the caller refuses rather than half-
     pitching a card away for nothing. */
  /* `autoPitch` MOVED to engine/effects.js in v2.77 — see the bridge-less
     call sites below. Pitching on demand is not a card semantic, but it is
     the thing a prompt's payment reaches for, and the prompt answer moved
     with it. One copy, reached as `_EFX.autoPitch`. */
  const autoPitch = _EFX.autoPitch;
  /* Everything the player could reach in an instant-speed window, counting
     what they could pitch for. Used BOTH to decide whether the window is
     worth opening and to enable the cards in it, so the pause and the tap
     can never disagree — the same reason buildPrompt returns null rather
     than showing an empty sheet. */
  const instantBank = s => you(s).res + you(s).hand.reduce((a,c)=>a+(c.pitch||0),0);
  function foeTurnHasPlay(s){
    const bank = instantBank(s);
    const ars = you(s).arsenal;
    if(ars && bAct(s).arsenalInstant && !isAttack(ars) && (ars.pitch||0)>=3
       && (ars.cost||0) <= bank) return true;
    /* An INSTANT-speed piece of iron is a play (CR 8.1.6), and for
       Spellfire Cloak it is the ONLY window its printed gate allows. The
       gate itself is asked, not assumed: a piece whose activateIf is unmet
       must not open a window it cannot be used in. */
    const gearPlay = you(s).gear.some(gr=>{
      if(!instantAbilityReady(gr, you(s))) return false;
      const afx = fxParse(gr.powCard);
      if(afx.activateIf && !activateIfOk(s, afx.activateIf)) return false;
      return effCost(gr.powCard, you(s)) <= bank;
    });
    if(gearPlay) return true;
    return you(s).hand.some(c => isInstantT(c.tt||"") && fxParse(c).ops.length>0
       && (c.cost||0) <= bank - (c.pitch||0));
  }
  /* ---- SEAT 1'S TURN (v2.71) --------------------------------------------
     It used to be one fabricated swing between two of your turns. It is now
     a turn: a start phase, an action phase with an action point it spends,
     a window in which YOU hold priority, and an end phase that runs the
     same CR 4.4.3 procedure yours does.

     That is not tidiness. "During an opponent's turn", Frostbite's tax,
     Inertia and Freeze were all filed `noop` in parser.js with the same
     justification written out — the dummy has no action phase, the dummy
     pays no costs — and those are statements about the prop, not about the
     rules. This is the phase they were waiting for. */
  function foeBegin(s){
    if(s.over) return s;
    let n = L({...s}, `— ${opp(s).name}'s turn. Start phase (CR 4.2) — no priority. —`);
    /* `hist` is per-turn and per-seat: without this, "…this turn" read
       seat 1's PREVIOUS turn all the way through its current one — CR
       4.4.4's clearing, which the CR review found missing for the
       incoming seat. */
    oppMut(n).hist = freshHist();
    oppMut(n).board = (opp(n).board||[]).map(b=>({...b, spent:false}));
    /* CR 4.3.2 — the action point is issued at the beginning of the action
       phase, for whoever's phase it is. */
    oppMut(n).ap = 1;
    n = L(n, `— ${opp(n).name}'s action phase (CR 4.3) — 1 action point, priority theirs. —`);
    return foeStep(n);
  }
  /* One seat-1 action, or the hand-over. Called again after every attack
     resolves, which is what lets go again chain a second link the way it
     does for you — the escalation could only ever swing once. */
  function foeStep(s){
    if(s.over) return s;
    if(opp(s).ap <= 0) return foeWindowOrEnd(s, "no action points left");
    return foeVanilla(s);
  }
  /* THE VANILLA DUMMY KEEPS THE SCRIPTED ESCALATION — its whole job is to
     be the one deck where nothing can be faked, and the [3,4,5] curve is
     what the difficulty is tuned to. It spends the action point like any
     other play, which is what stops it swinging twice now that foeStep
     runs again after the chain closes. */
  function foeVanilla(s){
    let n = {...s};
    oppMut(n).ap = opp(n).ap - 1;
    const base = [3,4,5][(n.turn-1)%3] + (n.turn>6?1:0);
    /* FRAILTY NO LONGER SHAVES THIS SWING (v3.09), and it never should
       have. The token prints a narrow scope — "attack action cards you've
       played FROM ARSENAL and your WEAPON attacks" — where this applied a
       blanket -1 to any incoming swing at all. It is read off the board by
       `parser.frailtyCount` inside `execute` now, on the side that
       controls the token, so it reaches both engines and only the two
       cases the card names. */

  const armor = you(g).gear.map((gr,i)=>({gr,i})).filter(x=>!["1h","2h","off","qvr"].includes(slotOf(x.gr).z));
  const is2H = handGear[0] && slotOf(handGear[0].gr).z==="2h";
  const featured = (g.mode==="stack" && g.pend) ? {card:g.pend.card, chip:"ON THE STACK — "+g.pend.total} : (g.mode==="boostpick" && g.pending) ? {card:g.pending.card, chip:"BOOST? — banish the top card"} : (g.mode==="pay" && g.pending) ? {card:g.pending.card, chip:"PAYING — PITCH "+Math.max(0,effCost(g.pending.card, you(g))-you(g).res)+" MORE"}
    : (g.mode==="defpay" && (g.defPayQueue||[]).length) ? {card:[...you(g).hand, ...you(g).gear].find(c=>c.uid===g.defPayQueue[0].uid), chip:"PAY "+g.defPayQueue[0].cost+"? — "+g.defPayQueue[0].name}
    : g.featured;
  const prevLinks = g.chain.slice(0,-1).reverse();
  const gearBtn = (gr,i,extra,st) => {
    const w = isWeapon(gr), blockable = g.mode==="block" && gearDef(gr)>0;
    const spent = gr.destroyed || (gr.curDef!=null && gr.curDef===0);
    const sel = you(g).blockG.includes(i);
    const tapped = w && !!you(g).weaponUsed[gr.uid] && /\btap\b|\{t\}/i.test(gr.tx||"");
    return (
      <button key={gr.uid} className={"g clip-sm"+(spent?" used":"")+(extra||"")
          +(peek&&(peek.uid===gr.uid||peek.uid===("gp"+gr.uid))?" peek":"")}
        style={Object.assign({}, st||{}, sel?{borderColor:"var(--b)",boxShadow:"0 0 0 1px var(--b)"}:null)}
        onClick={(()=>{
          /* the same two-tap as the hand: peek the thing you are about to
             commit to — the ability's own card when the piece has one. */
          /* IRON DOES TWO THINGS ON THEIR TURN, NOT ONE (v2.71). Defending
             is the defend step's business; an INSTANT-speed ability is
             legal in any window you hold priority (CR 8.1.6), and before
             this the reaction step offered nothing but the zoom modal —
             so Spellfire Cloak, whose printed gate is "only during an
             opponent's turn", had no window in which it could ever be
             activated. */
          const instAb = instantAbilityReady(gr, you(g));
          if(g.mode==="block" || g.mode==="foeturn"){
            if(g.mode==="block" && blockable && g.bphase==="defend")
              return tapTwice(gr, "tap again to defend", ()=>toggleBlock("g",i));
            if(instAb)
              return tapTwice(gr.powCard, "tap again to activate", ()=>activateInstant(gr.powCard,"hero",i));
            return ()=>setZoom(gr);
          }
          if(w) return tapTwice(gr, "tap again to swing", ()=>tryPlay(gr,"weapon",i));
          if(gr.pow && !gr.destroyed)
            return tapTwice(gr.powCard,
              abWindow(gr.powCard)==="attack-reaction" ? "tap again — attack reaction" : "tap again to activate",
              ()=>tryPlay(gr.powCard,"hero",i));
          /* nothing to commit to — a second tap opens the full card instead */
          return tapTwice(gr, "tap again for full card", ()=>setZoom(gr));
        })()}>
        <span className={"tapwrap"+(tapped?" tapped":"")}><CardFrame card={{...gr, def:(gr.def!=null||gr.curDef!=null)?gearDef(gr):null}} className="sm"/></span>
        {(()=>{ const ct=you(g).counters[gr.uid]; if(!ct||(!ct.steam&&!ct.rust&&!ct.pow)) return null; return <span className="ctr">{ct.steam?<span className="cc steam">S{ct.steam}</span>:null}{ct.rust?<span className="cc rust">R{ct.rust}</span>:null}{ct.pow?<span className="cc pow">+{ct.pow}</span>:null}</span>; })()}
        {gr.pow && !gr.destroyed && <span className="gp">{you(g).weaponUsed["gp"+gr.uid]?"·":"⚡"}</span>}
      </button>);
  };
  /* TWO-TAP HAND. A card in the rail is 80px wide — unreadable on a phone —
     so the first tap PEEKS it (big preview above the action bar) and only a
     second tap on the same card commits. Works the same for choosing pitch,
     declaring defenders, reactions and the arsenal, because every one of
     those flows through this one cell. Peeking is always allowed, even on a
     card you cannot legally play: looking is free. */
  const handAct = (c,i) => {
    if(g.mode==="block"){
      const fx = fxParse(c);
      /* the react branch hands EVERY tap to playRx rather than pre-screening
         it: playRx names both of its refusals — wrong window (CR 8.1.2a /
         8.1.3a) and not enough floating — and a tap that silently does
         nothing is the one outcome this UI never wants. */
      if(g.bphase==="react") playRx(i);
      else if(c.def!=null && !fx.dr) toggleBlock("h",c.uid);
    }
    else if(g.mode==="stack") playRx(i);
    else if(g.mode==="foeturn") playFoeTurnRx(i);
    else if(g.mode==="arsenal") pickArsenal(i);
    else tryPlay(c,"hand",i);
  };
  const peekVerb = c => {
    if(g.inspect) return "inspect";
    if(g.mode==="pay") return you(g).paySel.includes(you(g).hand.indexOf(c)) ? "tap again to unpitch" : "tap again to pitch";
    if(g.mode==="arsenal") return "tap again to set in arsenal";
    if(g.mode==="stack") return "tap again to react";
    if(g.mode==="block") return g.bphase==="react" ? "tap again to react" : "tap again to defend";
    if(g.mode==="foeturn") return "tap again to play at instant speed";
    return "tap again to play";
  };
  /* Everything tappable peeks the same way — hand cards, iron, and the
     equipment abilities in the playable rail. The preview has to be able to
     find any of them, so the lookup spans every zone a tap can originate in.
     An ability is peeked as its powCard rather than the piece, because the
     ability's text is what you are deciding about. */
  const peekables = () => {
    const y = you(g);
    const out = y.hand.slice();
    if(y.arsenal) out.push(y.arsenal);
    y.gear.forEach(gr => { out.push(gr); if(gr.powCard) out.push(gr.powCard); });
    /* A board permanent's ABILITY is peeked as its powCard, the same way an
       equipment ability is — the ability's text is what you are deciding
       about, not the permanent. peekables must span every zone a tap can
       originate in or the preview silently fails while the tap still arms. */
    (y.board||[]).forEach(b => { if(b && b.card){ out.push(b.card); const bp = boardPow(b); if(bp) out.push(bp); } });
    /* a hand card's ABILITY is a separate tappable cell, so it is a
       separate peekable — peekables must span every zone a tap can
       originate in or the preview silently fails while the tap still arms */
    y.hand.forEach(c => { const hp = handPow(c); if(hp) out.push(hp); });
    return out;
  };
  /* First tap previews, second commits. `verb` is captured at tap time and
     the peek is dropped whenever the window changes, so it cannot go stale. */
  /* the third argument is named `commit`, NOT `act`: `act` is the global
     actor helper (act(s) = the side whose effect is resolving), and a
     parameter of that name silently shadows it for this whole closure.
     Harmless while this is pure UI, a genuine trap the moment anything in
     here needs the acting side. Same-name-different-meaning is the class
     of bug test/sync.test.js pins for the engine; keep it out of the UI too. */
  const tapTwice = (card, verb, commit) => () => {
    if(g.inspect){ setZoom(card); return; }
    if(!peek || peek.uid !== card.uid){ setPeek({uid:card.uid, verb}); return; }
    setPeek(null);
    commit();
  };
  const handCell = (c,i) => {
    const fx = fxParse(c);
    /* the dim must ask exactly what playRx asks, or a card looks playable
       and refuses when tapped (CR 8.1.2a / 8.1.3a live in rxAllowed) */
    const rxD = rxAllowed(c, "defense-reaction");
    const rxA = rxAllowed(c, "attack-reaction");
    const canDefend = c.def!=null;
    const sel = g.mode==="pay" ? you(g).paySel.includes(i) : g.mode==="block" ? you(g).blockH.includes(c.uid) : false;
    /* the foeturn dim asks exactly what playFoeTurnRx asks (CR 8.1.6 —
       instants only, and one the engine can actually resolve), because a
       card that looks playable and does nothing when tapped is the failure
       mode this UI cares most about */
    const rxF = isInstantT(c.tt||"") && fx.ops.length>0;
    const dim = (g.mode==="block" && (g.bphase==="defend" ? (!(canDefend && !fx.dr) && !sel) : !rxD))
             || (g.mode==="stack" && !rxA) || (g.mode==="foeturn" && !rxF);
    /* THE ABILITY IS ITS OWN CELL, and only while it can actually be
       activated. Agile Windup is both a playable attack action AND a
       discard-for-a-token instant, and both are legal in your own action
       phase — discarding it is a real Kayo line, since a printed 5 is a 6
       to him and the discard makes Might. One tap target cannot mean two
       things, so the ability gets its own. */
    const hp = handAbilityOK(g, c) ? handPow(c) : null;
    return [
      <button key={c.uid} className={"hc clip-sm"+(sel?" sel":"")+(dim?" dis":"")+(peek&&peek.uid===c.uid?" peek":"")}
        onClick={tapTwice(c, peekVerb(c), ()=>handAct(c,i))}>
        {sel && g.mode==="block" && <span className="defsel">⛨ DEF</span>}
        <CardFrame card={c} zone="hand"/>
      </button>,
      hp && <button key={hp.uid} className={"hc clip-sm"+(peek&&peek.uid===hp.uid?" peek":"")}
        onClick={tapTwice(hp, "tap again to activate", ()=>activateHand(c))}>
        <CardFrame card={hp} zone="hand"/>
      </button>
    ];
  };
  const playables = (()=>{
    if(g.mode==="pay"||g.mode==="arsenal"||g.mode==="stack") return [];
    const out = [];
    if(g.mode==="block"){
      if(g.bphase==="defend"){
        you(g).gear.forEach((gr,i)=>{ if(gearDef(gr)>0 && !gr.destroyed) out.push({card:{...gr,def:gearDef(gr)}, zone:"equip", sel:you(g).blockG.includes(i), verb:"tap again to defend", fn:()=>toggleBlock("g",i)}); });
      } else if(g.bphase==="react" && you(g).arsenal){ const fx=fxParse(you(g).arsenal);
        if(rxAllowed(you(g).arsenal, "defense-reaction")) out.push({card:you(g).arsenal, zone:"arsenal", verb:"tap again to react", fn:playRxA});
        else if(built.arsenalInstant && !isAttack(you(g).arsenal) && (you(g).arsenal.pitch||0)>=3 && fx.ops.length>0) out.push({card:you(g).arsenal, zone:"arsenal", verb:"tap again to react", fn:playArsenalInstant});
      }
      return out;
    }
    if(you(g).arsenal) out.push({card:you(g).arsenal, zone:"arsenal", verb:"tap again to play", fn:()=>tryPlay(you(g).arsenal,"arsenal",0)});
    you(g).gear.forEach((gr,i)=>{ if(isWeapon(gr)&&!gr.destroyed&&!you(g).weaponUsed[gr.uid]) out.push({card:{...gr,def:null}, zone:slotOf(gr).lab, verb:"tap again to swing", fn:()=>tryPlay(gr,"weapon",i)}); });
    you(g).gear.forEach((gr,i)=>{ if(gr.pow&&!gr.destroyed&&!you(g).weaponUsed["gp"+gr.uid]) out.push({card:gr.powCard, zone:slotOf(gr).lab, verb:"tap again to activate", fn:()=>tryPlay(gr.powCard,"hero",i)}); });
    if(built.HPOW && !you(g).weaponUsed["hpow"]) out.push({card:built.HPOW, zone:"hero", verb:"tap again to use the hero power", fn:()=>tryPlay(built.HPOW,"hero",0)});
    /* THE ZONE RULE IS `parser.playableFromZone` (v3.00) — it was written
       out here, in the UI, so `judge.legal` never had it and every card
       in a graveyard was playable at the table. One copy, both boards. */
    const zoneOpts = {wateryGrave: built.wateryGrave, blueGY: you(g).hist.blueGY||0, turn: g.turn};
    you(g).grave.forEach((c,i)=>{
      if(playableFromZone(c, "grave", zoneOpts)) out.push({card:c, zone:"discard", verb:"tap again to play from the graveyard", fn:()=>tryPlay(c,"grave",i)}); });
    you(g).banish.forEach((c,i)=>{
      /* a card minted into banish and marked playable this turn (Crouching Tiger) */
      if(playableFromZone(c, "banish", zoneOpts)) out.push({card:c, zone:"banish", verb:"tap again to play from banish", fn:()=>tryPlay(c,"banish",i)}); });
    return out;
  })();
  return (
    <div className="board">
      <div className="screennav">
        <button onClick={onExit} style={{flex:.7}}>✕ leave</button>
        <button onClick={()=>jump(oppRef)}>▲ Opp</button>
        <button onClick={()=>jump(chainRef)}>Chain</button>
        <button onClick={()=>jump(youRef)}>You ▼</button>
      </div>

      <div className="tablewrap">
        {/* ---- SCREEN 1: opponent board (mirror: active rows nearest the chain) ---- */}
        <div className="vscreen" ref={oppRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>Opponent board</span><span>swipe → graveyard</span></div>
              <div className="midrow">
                <ArmorGrid gear={opp(g).gear} cell={(x,z)=>(
                  <button key={x.uid} className={"g clip-sm"+(gearDef(x)===0?" used":"")} style={{gridArea:z}} onClick={()=>setZoom(x)}>
                    <CardFrame card={{...x, def:gearDef(x)}} className="sm"/>
                  </button>)}/>
                <div className="arscol"><div className="slot clip-sm">arsenal —</div><span className="zlbl">holds {opp(g).hand.length} · blocks from hand</span></div>
                <DeckPitchCol deck={opp(g).deck} pitch={opp(g).hand} title="Hand" hidden/>
              </div>
              <div className="heror">
                <div className="wslot clip-sm"><span className="wempty">weapon —</span></div>
                <div className="heromid clip-sm">
                  <div className="dhead" style={{width:36}}><span>✕</span><span>✕</span></div>
                  <span className="hname">{opp(g).name}</span>
                  <b className="hlife2">{Math.max(0,opp(g).hp)}</b>
                  {/* THE PREDICTION IS HONEST BECAUSE THE SWING IS SCRIPTED.
                      It reads the same [3,4,5] escalation `foeVanilla`
                      swings, so it cannot announce a number the dummy will
                      not throw. While a hero could sit here (v2.41-v2.80)
                      this had to be suppressed for them: read
                      unconditionally it announced "NEXT SWING 3" against a
                      real hand that swung Buckwild for 7, which is the
                      "displayed total is wrong" category — the player TRUSTS
                      this number, and the advisor's race maths sits beside
                      it. With the seat always vanilla the branch is gone
                      and the number is always the one that lands. */}
                  <span className="hlbl">{g.mode==="block" ? "INCOMING "+g.incoming
                    : "next swing "+([3,4,5][(g.turn-1)%3]+(g.turn>6?1:0))}</span>
                  {g.hitSeq>0 && <span className="dmgpop" key={g.hitSeq}>−{g.lastDmg}</span>}
                </div>
                <div className="wslot clip-sm"><span className="wempty">weapon —</span></div>
              </div>
              <div className="vfillsp"/>
              <div style={{marginTop:8}}>
                <InPlayRow entries={opp(g).board||[]} chips={opp(g).marked?[["marked",""]]:[]}
                  empty={"nothing yet — tokens you hand "+opp(g).name+" land here"}
                  cell={b=>(
                    <button key={b.uid} className="b clip-sm" style={{width:52,flex:"none"}} onClick={()=>setZoom(b.card)}>
                      <CardFrame card={b.card} className="sm"/>
                    </button>)}/>
              </div>
            </div>
            <div className="hpane">
              <div className="paneflag"><span>Opponent graveyard / banish</span><span>swipe ← back</span></div>
              <div className="gyempty">{opp(g).name} has discarded nothing yet.</div>
            </div>
          </div>
        </div>

        {/* ---- SCREEN 2: chain command center ---- */}
        <div className="vscreen" ref={chainRef}>
          <div className="hscroll" ref={midRef}>
            {/* PANE 1 — LOG: scoreboard + Claude's call + live feed */}
            <div className="hpane logpane">
              <div className="paneflag">
                <span>log & advisor</span>
                {/* Bug reports from the phone, where the bugs actually show up.
                    Captures the whole board so the note can just be "this
                    looked wrong" — see engine/report.js. */}
                <button className="judgebtn" onClick={()=>setBug({note:"", saved:false})}>
                  JUDGE!!{judgeN>0?` ⚠${judgeN}`:""}
                </button>
                <span>play →</span>
              </div>
              <div className="scorebar clip-sm">
                <span className="sside"><span className="hpme">{you(g).hp}</span> you · R<b>{you(g).res}</b> A<b>{you(g).ap}</b></span>
                <span className="sside r">{opp(g).name.split(",")[0].toLowerCase()} <span className="hpopp">{Math.max(0,opp(g).hp)}</span>{frostCount(opp(g))>0?` · ❄${frostCount(opp(g))}`:""}</span>
              </div>
              {/* the turn and the phase — see phaseLabel */}
              <div className="phasebar clip-sm">
                <span>turn <b>{g.turn}</b></span>
                <span className="ph">{phaseLabel(g.mode, g.bphase, g.over)}</span>
              </div>
              <div style={{marginTop:6}}><Ticker feed={g.feed}/></div>
              {/* THE WINDOW IS PASSED, NOT SNIFFED (v2.83). `advise` used to
                  read `g.mode` itself, which is right here and silently wrong
                  at the table — judge.js seeds `mode` once and never writes
                  it, so a table game would be coached as an action phase from
                  the first draw to the last point of life. The trainer's
                  `mode` is live and authoritative, so it says so out loud;
                  the table derives the same answer with `advView`. */}
              <Advisor g={g} ctx={{window:g.mode, incoming:g.incoming, runeDmg:built.runeDmg, hpow:built.HPOW, boostOn:g.boostOn, dBlk:opp(g).gear.filter(x=>gearDef(x)>0).length + opp(g).hand.filter(c=>(c.def||0)>0).length, dDef:gearDef(opp(g).gear.find(x=>gearDef(x)>0)||{})||1}} read={built.read}/>
              <div className="gamelog" style={{marginTop:8}}>{[...g.feed].reverse().map((l,i)=><div key={i} className="gl">{l}</div>)}</div>
            </div>
            {/* PANE 2 — PLAY: dummy hand · stack|card|defend · your hand+extras */}
            <div className="hpane playpane">
              <div className="dhand"><span className="hlbl">Foe</span>{[0,1,2,3].map(i=><div key={i} className="dcardph"/>)}</div>
              <div className="playmid">
                <div className="sidecol stack">
                  <div className="scol-lbl">Stack</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack" && g.pend) ? [g.pend.card] : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
                <div className="centerslot">
                  {featured
                    ? (featured.foe
                        ? <div className="featfoe"><span className="fx2">✕✕</span><b>{featured.dmg}</b><span>Dummy</span></div>
                        : <div className="featured"><CardFrame card={featured.card}/></div>)
                    : <div className="featempty">Most recently played lands here</div>}
                </div>
                <div className="sidecol defend">
                  <div className="scol-lbl">Defend</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack") ? g.stack.filter(l=>l.k==="def").map(l=>l.gi!=null?opp(g).gear[l.gi]:opp(g).hand.find(c=>c.uid===l.uid)).filter(Boolean) : (g.mode==="block") ? [...you(g).blockH.map(uid=>you(g).hand.find(c=>c.uid===uid)), ...you(g).blockG.map(gi=>you(g).gear[gi])].filter(Boolean) : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
              </div>
              {g.mode==="pay" && (()=>{const sel=you(g).paySel.reduce((a,i)=>a+(you(g).hand[i].pitch||0),0); const need=Math.max(0,effCost(g.pending.card, you(g))-you(g).res-sel); return <div className="statusline">Paying <b>{g.pending.card.name}</b> — pitch below · {need>0?<span>need <b>{need}</b> more</span>:<span>covered ✓</span>}<button onClick={cancelPay}>✕ cancel</button></div>;})()}
              {g.mode==="block" && <div className="statusline">{g.bphase==="defend" ? <span>Tap hand &amp; equipment to defend — incoming <b>{g.incoming}</b></span> : <span>Reaction step — instants from floating <b>{you(g).res}</b></span>}</div>}
              {g.mode==="stack" && <div className="statusline">Priority — react from floating <b>{you(g).res}</b> or pass</div>}
              {g.mode==="arsenal" && (()=>{ const off = DawnEffects.heaveOffer(g, 0); return (
                <div className="statusline">Tap a card below for <b>arsenal</b>
                  {off && <button onClick={doHeave}>heave {off.card.name} ({off.n})</button>}
                  <button onClick={skipArsenal}>skip</button></div>); })()}
              {g.mode==="boostpick" && <div className="statusline">Boost <b>{g.pending.card.name}</b>? Banish the top card of your deck — a Mechanologist card grants go again.</div>}
              {g.mode==="splitpick" && g.splitPick && <div className="statusline">
                <b>{g.splitPick.name}</b> is a split card — one card, two halves.
                {(g.splitPick.halves||[]).map((h,i)=><span key={i}> <b>{h.name}</b> ({h.tt}).</span>)}
                {g.splitPick.meld && <span> Meld plays both.</span>}
              </div>}
              {g.mode==="rxaddpay" && g.rxAdd && <div className="statusline">
                <b>{g.rxAdd.name}</b> — pay <b>{g.rxAdd.cost}</b> more as an additional cost? You have {you(g).res} floating.
              </div>}
              {g.mode==="defpay" && (g.defPayQueue||[]).length>0 && <div className="statusline">
                <b>{g.defPayQueue[0].name}</b> is defending — pay <b>{g.defPayQueue[0].cost}</b> for +{g.defPayQueue[0].ops.filter(o=>o[0]==="defBuff").reduce((a,o)=>a+o[1],0)}{"{d}"}? You have {you(g).res} floating.
                {g.defPayQueue.length>1 && <span> ({g.defPayQueue.length-1} more waiting.)</span>}
              </div>}
              {(()=>{ /* v2.07: the engine tracks all of this; the board never showed it */
                const pips = [];
                if(you(g).amp>0)       pips.push(["amp "+you(g).amp, "on"]);
                if(you(g).buffNext>0)  pips.push(["next atk +"+you(g).buffNext, "on"]);
                if(you(g).gaNext)      pips.push(["next atk go again", "on"]);
                if(you(g).ward>0)      pips.push(["ward "+you(g).ward, "on"]);
                if(you(g).awd>0)       pips.push(["arcane ward "+you(g).awd, "on"]);
                if(runeCount(you(g))>0) pips.push(["runechant ×"+runeCount(you(g)), "on"]);
                if(opp(g).marked)     pips.push(["dummy marked", "on"]);
                /* bloodrot and frailty are board Auras as of v3.09 — the
                   board renders them, so a duplicate pip would be a second
                   description of the same fact. */
                if(you(g).fra>0)       pips.push(["frailty "+you(g).fra, "warn"]);
                const drac = g.chain.filter(l=>l.drac && l.kind==="atk").length;
                if(drac>0)        pips.push(["draconic links "+drac, ""]);
                if((you(g).hist.arc||0)>0)  pips.push(["arcane dealt", ""]);
                if((you(g).hist.aura||0)>0) pips.push(["auras "+you(g).hist.aura, ""]);
                const links = g.chain.filter(l=>l.kind==="atk").length;
                if(links)              pips.push(["chain link "+links, ""]);
                return pips.length ? <div className="rail">{pips.map(([t,cl],i)=>

              {prevLinks.length===0 && g.chainHist.length===0 && <p className="note">No links yet — play an attack to start the chain.</p>}

                <div className="chain">{prevLinks.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>}
              {g.chainHist.map((t,i)=>(
                <div key={i} className="histturn"><div className="htlabel">Turn {t.turn}</div>

        {/* ---- SCREEN 3: your board (the sketch) ---- */}
        <div className="vscreen" ref={youRef}>

            <div className="hpane vfill">
              <div className="paneflag"><span>Your board</span><span>swipe → graveyard</span></div>

              <InPlayRow entries={you(g).board} chips={toks} cell={(b,i)=>(

                  onClick={()=>{

                    const bp = boardPow(b);
                    if(bp) return tapTwice(bp, "activate", ()=>tryPlay(bp,"board",i));

                  }}>
                  <span className={"tapwrap"+((b.spent&&/\btap\b|\{t\}/i.test(b.card.tx||""))?" tapped":"")}><CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/></span>
                  {b.kind==="ally" && b.card.power>0 && <span className="sw">{b.spent?"spent":"⚔ "+b.card.power}</span>}
                </button>)}/>

                </div>
                <div className="heromid clip-sm">
                  <button className="hport2" onClick={()=>setZoom(built.HZOOM)}><span className={"tapwrap"+(you(g).heroTapped?" tapped":"")}><HeroArt h={h} db={db}/></span></button>
                  <span className="hname">{h.n.split(",")[0]}</span>

                  {built.heroPow && <button className="hact clip-sm" style={{padding:"5px 8px",fontSize:11}}

      {/* the peeked card, big enough to actually read, docked above the

      {!g.over && !g.prompt &&

        const ready = promptReady(p);

          <div className="phint">{p.hint}</div>

          {(p.tag==="opt" || p.tag==="pick" || p.tag==="reveal") && !!p.cards.length &&
            <div className="prow2">
              {p.cards.map((c,i)=>{
                const down = p.tag==="opt" && p.down.includes(i);
                const sel  = p.tag==="pick" && p.sel.includes(i);
                const topOrder = p.tag==="opt"
                  ? p.cards.filter((_,j)=>!p.down.includes(j)).indexOf(c)+1 : 0;
                const tap = p.tag==="reveal" ? undefined : ()=>promptToggle(i);
                return <button key={c.uid||i}
                  className={"pcard"+(down?" down":"")+(sel?" sel":"")+(p.tag==="reveal"?" flat":"")}
                  onClick={tap}>
                  <CardFrame card={c} className="sm"/>
                  {p.tag==="opt" && <span className="ptag">{down ? "bottom" : "top "+topOrder}</span>}
                  {p.tag==="pick" && sel && <span className="ptag">✓ chosen</span>}
                </button>;
              })}
            </div>}

          {p.tag==="modal" && <div className="pmodal">
            {p.options.map((o,i)=>(
              <button key={i} className={"popt"+(p.choice===i?" on":"")} onClick={()=>promptPick(i)}>
                {o.label || String(o)}
              </button>
            ))}
          </div>}

          {p.tag==="pay" && <div className="pmodal">
            <button className={"popt"+(p.choice==="pay"?" on":"")}
              disabled={p.avail < p.cost} onClick={()=>promptPick("pay")}>
              Pay {p.cost}
              <span className="sub">{p.avail < p.cost ? `only ${p.avail} floating` : `${p.avail} floating`}</span>
            </button>
            <button className={"popt"+(p.choice==="decline"?" on":"")} onClick={()=>promptPick("decline")}>
              Decline<span className="sub">the rider does not resolve</span>
            </button>
          </div>}

          {/* SOAK — arcane incoming, and the iron that could stop it. Every
              option is a separate trigger, so this is multi-select and
              "take none" is always legal: the running total says how much
              is still getting through, because THAT is the number the
              decision is actually about. A barrier that costs more than it
              prevents is still offered (Arcane Barrier 2 costs 2 to stop 1)
              — it is printed that way and the player may still want it at
              lethal. */}
          {p.tag==="soak" && (()=>{
            const spent  = p.sel.reduce((a,i)=>a+(p.options[i].cost||0),0);
            const soaked = p.sel.reduce((a,i)=>a+(p.options[i].amount||0),0);
            const through = Math.max(0, p.amount - soaked);
            return <div className="pmodal">
              {p.options.map((o,i)=>{
                const on = p.sel.includes(i);
                const afford = on || o.kind==="spellvoid" || spent + (o.cost||0) <= p.avail;
                return <button key={o.uid+o.kind} className={"popt"+(on?" on":"")}
                  disabled={!afford} onClick={()=>promptToggle(i)}>
                  {o.name} — stops {o.amount}
                  <span className="sub">{o.kind==="spellvoid"
                    ? "spellvoid: destroy it"
                    : `arcane barrier: pay ${o.cost}${afford?"":" — can't reach it"}`}</span>
                </button>;
              })}
              <div className="phint">
                {through>0 ? `${through} of ${p.amount} still gets through` : `all ${p.amount} prevented`}
                {spent>0 ? ` · costs ${spent}{r} of ${p.avail} reachable` : ""}
              </div>
            </div>;
          })()}

          <div className="pact">
            {p.tag==="pick" && p.optional &&
              <button onClick={promptDecline}>Choose none</button>}
            {p.tag==="pick" && p.max>1 &&
              <span className="pcount">{p.sel.length}/{p.max}</span>}
            <button className={"go"+(ready?"":" off")} disabled={!ready} onClick={promptConfirm}>
              {p.tag==="reveal" ? "OK" : "Confirm"}
            </button>
          </div>
        </div>;
      })()}
    </div>
  );
}
function WinPanel({score,onExit}){
  const [t] = uS(()=>{
    let pool=[]; TROPHIES.forEach(x=>{for(let i=0;i<x.w;i++)pool.push(x);});
    return pool[Math.floor(Math.random()*pool.length)];
  });
  uE(()=>{ const seen = store.get("case",[]); store.set("case",[...seen,{n:t.n,r:t.r,at:Date.now()}]); },[]);
  return (
    <div className="reveal" onClick={onExit}>
      <h2 className="disp" style={{marginBottom:14}}>DUMMY DESTROYED</h2>

      <p style={{marginTop:14,fontSize:13}}>Efficiency score <b className="mono">{score}</b> — lower is cleaner. Tap anywhere.</p>
    </div>

}

  if(done) return (

}

/* ---------- LOADOUT — the official zones (4 armour slots, 2 hands) live
     in engine/build.js: ARMOR_Z, HAND_Z, applyPick, defaultPicks. One set
     of slot rules governs both seats, or the opponent is quietly stronger
     than printed. ---------- */
/* `netFoe` turns this screen into the TABLE's sideboard step (v2.49).
   The loadout is the same rules problem across the wire as it is against
   the dummy — the printed slot rules, the same 40-card floor — so it is
   the same screen rather than a second one that would drift from it.
   What changes is only that the opponent is already SETTLED: it was
   negotiated in the lobby, so the picker is replaced by the hero across
   the table. Reusing the screen is also what keeps the cut map honest —
   `cuts` is exactly the shape engine/lobby.js normalises and
   build.js rebuilds the deck from, on both phones. */
/* `netOnPlay` is a BOOLEAN — "is this client on the play" — and not the
   seat index that opens the game. Passing the index and reading it as the
   answer told BOTH seats they were on the draw, which is the same
   actor-versus-perspective slip that `you()` meaning seat 0 caused all
   through the migration: a seat INDEX is not an answer to a question
   about THIS client. Named so it cannot be read the other way. */
/* THE SIDEBOARD, AND IT RUNS AFTER THE THROW (v2.76). `first` arrives as
   a PROP because it is settled before this screen opens: the throw
   decided whether you are on the play. That is the whole point of
   boarding here — `engine/lobby.js` has ruled this order since it was
   written (`STEPS = [... "throw", "seat", "board", "ready"]`, "you
   sideboard knowing the matchup AND knowing whether you are on the play"),
   and the solo flow was the only thing in the project still doing it
   backwards.

   `oppH` was the other prop and is gone (v2.81): in the trainer the
   opponent is the vanilla dummy, always. */
function Loadout({h,db,onBack,onStart,netFoe,netOnPlay,onPlay}){
  const d = PARSED[h.k];
  const saSet = (d.hero.code||"").slice(0,3) || null;
  const gearR = uM(()=>d.gear.map((e,i)=>{ const c=resolveEntry(db,e,saSet); return {i, c, s:slotOf(c)}; }),[h,db]);
  const handL = gearR.filter(x=>HAND_Z.includes(x.s.z));
  const armorL = gearR.filter(x=>!HAND_Z.includes(x.s.z));
  const saved = store.get("loadout."+h.k, null);
  const [sel,setSel] = uS(()=>{
    if(saved && saved.sel){ let s=[]; saved.sel.forEach(i=>{ if(gearR.some(x=>x.i===i)) s=applyPick(gearR,s,i); }); if(s.length) return s; }
    return defaultPicks(gearR);
  });
  const [cuts,setCuts] = uS(()=> (saved&&saved.cuts)||{});
  const [zoom,setZoom] = uS(null);
  /* WHO IS ACROSS THE TABLE. `null` is the Dummy and stays the default:
     it is the regression harness for every phase of the opponent work,
     and its vanilla pile is the one deck where nothing can be faked
     (ROADMAP-OPPONENT.md). Deliberately NOT saved per hero the way the
     loadout is — the opponent is a property of the match, not of your
     deck, and a remembered one would silently change a later game. */
  const item = i => gearR.find(x=>x.i===i);
  const hands = sel.filter(i=>["1h","2h","off"].includes(item(i).s.z)).reduce((a,i)=>a+item(i).s.h,0);
  const armorN = sel.filter(i=>ARMOR_Z.includes(item(i).s.z)||item(i).s.z==="misc").length;
  const has2H = sel.some(i=>item(i).s.z==="2h");
  const deckTotal = d.deck.reduce((a,e)=>a+e.q,0);
  const cutN = Object.values(cuts).reduce((a,b)=>a+b,0);
  const size = deckTotal - cutN;
  const tapCut = (ei,q) => setCuts(c=>{
    const cur = c[ei]||0;
    if(cur<q && size>40) return {...c,[ei]:cur+1};
    const n={...c}; delete n[ei]; return n;
  });
  const start = () => { store.set("loadout."+h.k,{sel,cuts}); onStart({gearIdx:sel, cuts}); };
  /* THE MERGED ENGINE, WITHOUT A SECOND PHONE (v2.79). The same board a
     networked table renders, driven by `judge.reduce` — the one rules
     engine — with `sparring.act` in seat 1.

     IT SEATS THE SAME PUNCHING BAG (v2.81). It used to need a real HERO
     across the table, because the dealing for the vanilla pile lived
     inside `Battle` and there was no build to put in a seat. There is
     one now — `build.buildVanilla` — so the two boards face the same
     opponent and the only difference left between them is which engine
     is driving.

     It is a SECOND button rather than a replacement, deliberately.
     `Battle` is the regression harness and does not retire until the
     merged path passes the same drills, and the [3,4,5] escalation it
     runs is TUNED where `sparring.act` is not. */
  const startTable = () => { store.set("loadout."+h.k,{sel,cuts}); onStart({gearIdx:sel, cuts, table:true}); };
  const deckRows = d.deck.map((e,ei)=>({ei, e, c:resolveEntry(db,e,saSet)}));
