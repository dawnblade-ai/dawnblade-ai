    const done = n => { setBusy(false); setCapOpen(l=>l.filter(x=>x!==c)); setCapFreed(true); setMsg(null); setCapNote("Table "+c+n+" You can ask again now."); };
    table.closeOwn(c).then(r=>done(r && r.conceded ? " had a ranked game under way, so closing it counted as a loss." : " is closed."),
      e=>{ if(e && e.why==="no-table") return done(" was already gone."); setBusy(false); setMsg("That table could not be closed just now. Try again in a moment."); });
  };
  const left = asked ? Math.max(0, Math.ceil((REMATCH_WAIT - (Date.now() - asked))/1000)) : 0;
  return <div className="rematch" data-testid="rematch-row" onClick={e=>e.stopPropagation()}>
    {rm.table ? <p className="note" data-testid="rematch-note">Rematch on — sitting down at the new table…</p>
      : rm.mine ? <>
          <p className="note" data-testid="rematch-note">You asked for a rematch. Waiting for {name} to say yes… <span className="mono">{Math.floor(left/60)}:{String(left%60).padStart(2,"0")}</span></p>
          <button className="bigbtn alt" data-testid="rematch-cancel" disabled={busy} onClick={()=>ask(true)}>Take it back</button>
        </>
      : <>
          {rm.theirs && <p className="note" data-testid="rematch-note"><strong>{name}</strong> wants a rematch.</p>}
          <button className="bigbtn" data-testid="rematch" disabled={busy} onClick={()=>ask(false)}>{busy ? "Asking…" : capFreed ? "Ask again" : rm.theirs ? "Rematch — say yes" : "Rematch"}</button>
        </>}
    {msg && <p className="tblerr" data-testid="rematch-msg">{msg}</p>}
    {capNote && !msg && <p className="note" data-testid="rematch-capnote">{capNote}</p>}
    {!rm.table && !rm.mine && capOpen.length>0 && <div className="tblcard" data-testid="rematch-cap-open">
      {capOpen.map(c=><div key={c} className="tblopen"><span className="mono">{c}</span>
        <button disabled={busy} aria-label={"Close table "+c} onClick={()=>setCapAsk(capAsk===c ? null : c)}>Close</button></div>)}
      {capAsk && <div className="tblerr" role="alertdialog" data-testid="rematch-close-warn" aria-label={"Close table "+capAsk+"?"}>
        <p><strong>Counts as a loss</strong> if {capAsk} is a ranked game under way.</p>
        <div className="tblopen"><button disabled={busy} data-testid="rematch-close-yes" onClick={()=>closeCap(capAsk)}>Yes, close it</button>
          <button disabled={busy} data-testid="rematch-close-no" onClick={()=>setCapAsk(null)}>Keep it</button></div>
      </div>}
    </div>}
  </div>;
}
/* THE FORFEIT CLOCK, AS A HOOK AND A BAR (SERVER S5.2): the server stamps when the player the game waits on last moved; this phone shows a calm countdown made of
   that stamp plus its own elapsed time (engine/servertable.js `clock()`), and the claim itself is the server's decision. It says only THAT the game waits on a seat,
   never what is being decided. A friendly table has no clock (clock() answers null). The limit is the server's: the page never restates it. */
function useSrvClock(table){
  const [c,setC] = uS(null);
  uE(()=>{
    if(!table || !table.srv || !table.clock){ setC(null); return; }
    const read = () => setC(table.clock());
    read(); const t = setInterval(read, 1000);
    return ()=>clearInterval(t);
  },[table]);

const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const CLAIM_WHY = {

  "claim-self":"The game is waiting on you, so there is nothing to claim. Make your move.",
  "claim-idle":"The game is not waiting on them any more. Look at the table again.",
  "claim-over":"That game has already finished.",
  "claim-casual":"Only ranked tables have a forfeit clock.",
  unavailable:"That did not go through — the server is not answering. Try again in a moment.",
  auth:"That seat is no longer yours — the table moved on without you.",
  "no-table":"That table is gone."
};

  const c = useSrvClock(table), nm = useSrvNames(table);

  const them = nm[1-seat] || "Your opponent", mins = +(c.limit/60000).toFixed(1);
  if(c.mine){
    if(c.left > 120000) return null;
    return <div className="ffbar mine" role="status" data-testid="forfeit-mine">{c.left > 0
      ? <>The game is waiting on you. {them} may claim the win in <strong>{mmss(c.left)}</strong>. Any move you make carries on as normal.</>
      : <>The game is waiting on you, and {them} may now claim the win. Make your move to keep playing.</>}</div>;
  }
  if(!c.due){
    if(c.limit - c.left < 60000) return null;
    return <div className="ffbar" role="status" data-testid="forfeit-wait">{them} is taking a while. You may claim the win in <strong>{mmss(c.left)}</strong>. Until then the table keeps their seat.</div>;
  }
  const claim = () => { if(busy) return; setBusy(true); setMsg(null);
    table.claimWin().then(()=>setBusy(false), e=>{ setBusy(false); setMsg(CLAIM_WHY[e && e.why] || CLAIM_WHY.unavailable); }); };
  return <div className="ffbar due" role="status" data-testid="forfeit-due">
    <div>{them} has not moved for {mins} minutes. You may claim the win: it counts as a ranked win for you and a loss for them.</div>
    <button data-testid="claim-win" disabled={busy} onClick={claim}>{busy ? "Claiming…" : "Claim the win"}</button>
    {msg && <div className="note" data-testid="claim-msg">{msg}</div>}

/* the player a practising player's match was made for: told plainly why the table is quiet and what happens if they do not come */
function FoundWaitNote({table}){

  if(s.st==="closed" && s.why) return <div className="srvbar bad" role="status">{s.why==="wire"
    ? "The table runs a different version of the game. Reload the page to pick up the latest."
    : s.why==="taken" ? "You sat down at this table on another phone, so this phone gave up the seat. Carry on over there."
    : "This phone's seat at the table is gone. Leave the table and rejoin from Find an opponent."}</div>;

/* ============================================================
   THE ROOM — connect, agree, deal, play. (v2.49)

   Until now this screen connected two phones and dropped them straight
   into engine/actions.js's BLANK decks, because `net.js` needs a
   a pure reducer over state and action, and the trainer has none:
   `Battle` is 2,500
   lines of React closures, not a reducer, and its opponent is a branch
   inside the rules rather than a seat. That is the whole reason a second
   human had nowhere to sit.

   Both halves now exist. `engine/lobby.js` negotiates the four things
   two players must agree on, and `engine/judge.js` is the rules as a
   pure function that either seat can drive.

     TableScreen  find a table          (unchanged)
     TableRoom    the negotiation, and then the game
       - hero     both seats choose a hero
       - throw    rock-paper-scissors; the winner CHOOSES the seating
       - board    both seats sideboard, knowing the matchup and the seat
       - ready    buildMatch -> judge.newMatch -> net.js drives both

   ---- ONE CHANNEL, TWO PROTOCOLS ---------------------------------------

   The lobby and net.js both name a message `hello`. An undemuxed channel
   would hand net.js's handshake to the lobby and the lobby's to net.js,
   and the failure would look like a transport bug rather than a naming
   one. Every frame is therefore tagged with the protocol that owns it.

   ---- WHAT IS AND IS NOT REAL HERE -------------------------------------

   Real: two hero decks off the actual card database, printed life and
   intellect, the CR turn structure, priority, the combat chain, costs
   paid by pitching on demand, defenders from hand and iron, printed
   power against printed defence, the ordered end phase.

   NOT real yet: CARD EFFECTS. `runOps`/`execute`/`resolveStack` — the
   parser's card semantics — are still closures inside `Battle`, so a
   card here moves zones and costs what it prints, and its text box does
   nothing. That limit is judge.js's, stated in its own header, and it is
   the next pass: those three functions become a shared engine/effects.js
   that the trainer and the judge both call.

   SO THE TWO ENGINES DO NOT MEET. Solo play is `Battle` and keeps every
   card effect; table play is `judge.js` and keeps the second seat.
   Nothing routes between them, which is the discipline that kept
   actions.js free of card text: a control-flow bug and a card being read
   wrong must never be confusable.
   ============================================================ */

/* Tagged frames. `ch` names the protocol; `m` is that protocol's own
   message, untouched, so neither module has to know the other exists. */
const CH_LOBBY = "lobby", CH_NET = "net";
/* THE BUILD BOTH HANDSHAKES COMPARE (v4.69): the release and the card data,
   spelled by the lobby module so the two sites cannot disagree. */
const TABLE_BUILD = DawnLobby.buildId(window.APP_VER, window.DATA_VER);

function TableRoom({table, host, code, db, onExit, resume, judged, onAgain, onRematch, onGiveUp}){

     meaning "seat a game with this first player"; a local `seat` meaning
     "which chair is this client in" is the same-name-different-meaning
     trap test/sync.test.js pins, and it caught exactly this name on the
     first build of the table screen. */
  /* AT A JUDGED TABLE (HIDDEN HANDS H3) both phones are guests and the
     judge's device chose this phone's seat. */
  const mySeat = judged ? judged.seat : host ? 0 : 1;
  const [lob,setLob] = uS(()=>DawnLobby.newLobby({code, judge: !!judged}));
  const [pick,setPick] = uS(null);        /* an UNSENT hero choice */
  const [err,setErr] = uS(null);
  const [match,setMatch] = uS(null);      /* the built game, once ready */
  const lobRef = uR(null); lobRef.current = lob;
  const netRef = uR(null);
  const netQ   = uR([]);                  /* net frames that beat the session */
  /* THE THROW'S OPENING, held on this phone until both seats have sealed
     (HIDDEN HANDS H2). It never enters the shared lobby state until then. */
  const openRef = uR(null);
  /* THE HOST'S HALF OF THE SEED (HIDDEN HANDS H2). It never enters the
     shared lobby state: only its commitment does, and the half itself is
     revealed when the game is over so the guest can verify every shuffle. */
  const seedRef = uR(null);
  /* A MATCH MADE FOR A PLAYER WHO IS PRACTISING (the found-match window): they have FOUND_MS to come to this table. If their seat is given back (the table
     closes) or the window is over with nobody heard, this player is not left in an empty lobby: they go back to looking, the same kind, the same clock. */
  const matchRef = uR(null); matchRef.current = match;
  const sk = judged && judged.seek;
  uE(()=>{ if(!sk || !table || !table.srv || !onGiveUp) return; const t0 = Date.now();
    let n = 0;
    const h = setInterval(()=>{
      if(matchRef.current || table.peerHeard()) return;
      if(++n % 3 === 0 && table.refresh) table.refresh();
      const shut = table.status()==="closed" && table.closedWhy()==="no-table", late = Date.now()-t0 > FOUND_MS()+10000;
      if(!shut && !late) return;
      clearInterval(h); try{ table.close(); }catch(_){}
      onGiveUp(sk, shut ? "closed" : "late"); }, 1000);
    return ()=>clearInterval(h); },[]);

  /* Apply locally and put it on the wire. BOTH peers run the same
     reducer over the same messages — the lobby is order-independent and
     write-once, so there is no sequencer and none is needed. */
  const say = m => {
    const r = DawnLobby.reduce(lobRef.current, m);
    if(r.error && !r.error.dup) setErr(r.error.why);
    lobRef.current = r.state; setLob(r.state);
    try { table.send({ch:CH_LOBBY, m}); } catch(e){ setErr(String(e.message||e)); }
  };

  uE(()=>{
    table.listen(f=>{
      if(!f || typeof f !== "object") return;
      if(f.ch === CH_LOBBY){
        const r = DawnLobby.reduce(lobRef.current, f.m);
        /* A duplicate is the write-once rule working, not an error —
           only a real refusal is worth showing a player. */
        if(r.error && !r.error.dup) setErr(r.error.why);
        lobRef.current = r.state; setLob(r.state);
      } else if(f.ch === CH_NET){
        /* THE SESSION IS CREATED WHEN THE LOBBY READIES, AND THE GUEST'S
           HELLO CAN BEAT IT. Both peers reach `ready` from the same
           message, but one phone's React effect runs first — so the
           guest's handshake can arrive before the host has a session to
           answer it. Held and flushed rather than dropped, which is the
           same fix room.js already makes one layer down. */
        if(netRef.current) netRef.current.receive(f.m);
        else netQ.current.push(f.m);
      }
    });
    /* Say hello immediately. The build check has to settle before a
       hero is chosen, because a skew means the two phones would resolve
       the same deck list into different cards, or the same play into
       different rules — silently, and consistently enough that a state
       hash cannot describe it usefully. The release is half of it (v4.69). */
    if(resume){ seedRef.current = resume.seedH; return ()=>{ try{ table.close(); }catch(_){} }; }
    say(DawnLobby.hello(mySeat, TABLE_BUILD));
    if(host){ const sc = DawnLobby.seedCommitMsg(); seedRef.current = sc.seedH; say(sc.msg); }
    return ()=>{ try{ table.close(); }catch(_){} };
  },[]);

  const step = DawnLobby.stepOf(lob);

  /* Both seals are in: open ours. The lobby refuses an open before both
     seals, so this is the earliest moment the throw may be shown. */
  uE(()=>{
    const k = openRef.current;
    if(k && k.round === lob.round && DawnLobby.canOpen(lob, mySeat)){ openRef.current = null; say(k); }
    /* the guest answers the host's seed commitment, never before it */
    /* at a judged table each player answers the judge's commitment */
    if(!host && lob.seedC && (judged ? lob.seedGs[mySeat] == null : lob.seedG == null) && !seedRef.current){
      seedRef.current = "sent"; say(DawnLobby.seedAnswer(undefined, mySeat)); }
  },[lob]);

  /* How a seed becomes the opening, for "verify this game" and a resumed host:
     the lobby's spec, the card database, build.js and judge.newMatch. */
  const dealFrom = (spec, seed) => {
    const m = DawnBuild.buildMatch({...spec, seed}, {
      db, heroes: Object.fromEntries(HEROES.map(h=>[h.k,h])),
      decks: Object.fromEntries(HEROES.map(h=>[h.k,PARSED[h.k]]))});
    return {m, g: DawnJudge.newMatch({builds:m.builds, names:m.names, heroKeys:m.heroKeys, first:m.first, seed:m.seed})};
  };
  /* A RESUMED TABLE: the host rebuilds the match from its saved spec and
     half of the seed, and the session takes back the saved game. */
  uE(()=>{
    if(!resume || match) return;
    try {
      const seed = DawnSHA.seedOf(resume.seedH, resume.spec.seedG);
      const {m, g} = dealFrom(resume.spec, seed);
      setMatch({...m, spec: resume.spec, seedH: resume.seedH, restore: resume.saved, g,
                start: sd => dealFrom(resume.spec, sd).g});
    } catch(e){ setErr("Could not resume the table: " + (e.message||e)); }
  },[]);

  /* ---- ready: build the match, identically on both phones ------------ */
  uE(()=>{
    if(resume || step !== "ready" || match) return;
    /* ONLY THE HOST DEALS (H2). The guest builds a BLIND match from the same
       spec with a seed of its own: the same cards (for the catalog and its
       own build's passives), never the game — the host's referee sends it a
       view of the real one. */
    const spec0 = host ? DawnLobby.matchSpec(lob, seedRef.current) : DawnLobby.matchSpec(lob);
    if(!spec0){ setErr("The seed did not open its commitment — leave and open a new table."); return; }
    const spec = host ? spec0 : {...spec0, seed: "blind|" + spec0.seedC};
    try {
      const m = DawnBuild.buildMatch(spec, {
        db,
        heroes: Object.fromEntries(HEROES.map(h=>[h.k,h])),
        decks:  Object.fromEntries(HEROES.map(h=>[h.k,PARSED[h.k]]))
      });
      setMatch({...m, spec: spec0, seedH: host ? seedRef.current : null,
        start: sd => dealFrom(spec0, sd).g,
        g: DawnJudge.newMatch({builds:m.builds, names:m.names,
        heroKeys:m.heroKeys, first:m.first, seed:m.seed})});
    } catch(e){ setErr("Could not deal the match: " + (e.message||e)); }
  },[step, match]);

  const foeKey = lob.heroes[1-mySeat];
  const foeH   = foeKey ? HEROES.find(h=>h.k===foeKey) : null;
  const myKey  = lob.heroes[mySeat];
  const myH    = myKey ? HEROES.find(h=>h.k===myKey) : null;
  const waiting = DawnLobby.waitingOn(lob).indexOf(mySeat) < 0
                  && DawnLobby.waitingOn(lob).length > 0;

  const lobEnd = useSrvRank(table);
  const head = (<>
    <div className="tblhead">Table {code}
      <span className="tblseat">seat {mySeat} · {host ? "host" : judged ? (judged.srv ? "server table" : "judged table") : "guest"}</span></div>
    <SrvBanner table={table}/>
    {sk && <FoundWaitNote table={table}/>}
    <SrvNames table={table} seat={mySeat}/>
    {!lobEnd.result && <ForfeitBar table={table} seat={mySeat}/>}
  </>);
  /* A forfeit claimed before the match was dealt ends the table in the lobby: nothing was played, the result is the table's */
  if(lobEnd.ranked && lobEnd.result && !match) return (
    <div className="tblwrap">{head}
      <div className="rankchg" data-testid="lobby-ended">This table has ended before the game began.</div>
      <RankChange table={table} seat={mySeat}/>
      <button className="bigbtn alt" onClick={onExit}>Leave the table</button>
    </div>);

  if(step === "fault") return (
    <div className="tblwrap">{head}
      <div className="tblerr">{lob.fault}</div>
      <p className="mnote">Both phones must run the same version of the game.
        Reload the page on the older one to pick up the latest.</p>
      <button className="bigbtn alt" onClick={onExit}>Leave the table</button>
    </div>
  );

  if(match) return <TableBoard match={match} mySeat={mySeat} host={host} code={code} db={db}
    table={table} netRef={netRef} netQ={netQ} onExit={onExit} judged={judged} onAgain={onAgain} onRematch={onRematch}/>;

  /* ---- the sideboard: the trainer's own loadout screen ---------------- */
  if(step === "board" && myH){
    if(lob.boards[mySeat]) return (
      <div className="tblwrap">{head}
        <div className="tblstat live"><span className="tbldot"></span>
          Sideboard locked — waiting on {foeH ? heroShort(foeH) : "them"}…</div>
        <button className="bigbtn alt" onClick={onExit}>Leave the table</button>
      </div>
    );
    return <Loadout h={myH} db={db} netFoe={foeH} netOnPlay={lob.first === mySeat}
      onBack={onExit}
      onStart={cfg=>say(DawnLobby.sideboard(mySeat, cfg.gearIdx, cfg.cuts))}/>;
  }

  return (
    <div className="tblwrap">{head}

      <div className="lobsteps">
        {["hero","throw","board"].map(s=>(
          <span key={s} className={"lobstep"+(s===step?" on":"")
            +(DawnLobby.STEPS.indexOf(s) < DawnLobby.STEPS.indexOf(step)?" done":"")}>{s}</span>
        ))}
      </div>

      {/* ---- 1. the hero ---- */}
      {step === "hero" && <>
        <p className="note" style={{marginTop:0}}>
          Choose your fighter. Neither of you sees the other's pick until both are in.
        </p>
        <div className="lobheroes">
          {HEROES.map(x=>(
            <button key={x.k} className={"lobhero"+(pick===x.k?" on":"")}
              disabled={lob.heroes[mySeat]!=null}
              onClick={()=>setPick(x.k)}>
              <div className="lhport"><HeroArt h={x} db={db}/></div>
              <span className="lhn">{heroShort(x)}</span>
              <span className="lhc">{x.cls}</span>
            </button>
          ))}
        </div>
        {lob.heroes[mySeat]==null
          ? <button className="bigbtn" disabled={!pick}
              onClick={()=>say(DawnLobby.hero(mySeat, pick))}>
              {pick ? "Lock in "+heroShort(HEROES.find(h=>h.k===pick)) : "Pick a hero"}
            </button>
          : <div className="tblstat live"><span className="tbldot"></span>
              Locked. Waiting on the other seat…</div>}
      </>}

      {/* ---- 2. the throw ---- */}
      {step === "throw" && <TableThrow lob={lob} mySeat={mySeat} myH={myH} foeH={foeH}
        onThrow={t=>{ const k = DawnLobby.throwSeal(mySeat, lob.round, t);
                      openRef.current = k.open; say(k.seal); }}/>}

      {/* ---- 3. the seating call ---- */}
      {/* `rps` as well as `lobseat`: .rtitle/.rsub/.rseatpick are all scoped
          under `.rps` in the stylesheet, so without it this screen rendered
          as unspaced run-on text —
          "I go firsttake the initiativeThey go firstkeep the extra card".
          Clickable, and illegible. The solo Pregame wraps in `.rps` and
          always looked right, which is how the table's copy drifted. */}
      {step === "seat" && <div className="lobseat rps">
        <div className="rtitle">{lob.winner===mySeat ? "You won the throw" : "They won the throw"}</div>
        {lob.winner===mySeat
          ? <>
              <p className="rsub">The winner does not go first — the winner <b>chooses</b>.<br/>
                Going first buys initiative; going second keeps a card.</p>
              <div className="rseatpick">
                <button className="go" onClick={()=>say(DawnLobby.seating(mySeat,"first"))}>
                  I go first<span className="sub">take the initiative</span></button>
                <button onClick={()=>say(DawnLobby.seating(mySeat,"second"))}>
                  They go first<span className="sub">keep the extra card</span></button>
              </div>
            </>
          : <div className="tblstat live"><span className="tbldot"></span>
              {(foeH?heroShort(foeH):"They")} is deciding the seating…</div>}
      </div>}

      {step === "board" && !myH && <div className="tblstat">Waiting…</div>}

      {err && <div className="tblerr">{err}</div>}
      <p className="mnote">
        Table play runs <strong>two real hero decks</strong> — the full turn
        structure, priority, the combat chain,
        printed costs and <strong>card text</strong>, read by the same
        engine as the solo trainer. One copy of the rules, two seats.
      </p>
      <button className="bigbtn alt" onClick={onExit}>Leave the table</button>
    </div>
  );
}

/* ============================================================
   THE JUDGE'S DEVICE — a judged table (HIDDEN HANDS H3)

   A third phone or tablet holds the deck: engine/hub.js runs the referee
   with BOTH seats remote, so neither player's phone hosts and both are blind.
   This screen is the judge's: the table code, who has sat down, the lobby's
   progress, and then the game as the PUBLIC sees it (seatView from no seat:
   every hand and deck face down). A judge who wanted to look would have to go
   out of their way — and the copy says plainly that the device could.

   The hub takes channels, not a network: room.js's openJudge hands each new
   PeerJS channel over (`conns` holds any that opened before this mounted).
   The game is kept on the device after every action, so a reload resumes it
   ("Resume judging"), and at the end both phones get the seed and the log.
   ============================================================ */
function JudgeRoom({handle, conns, code, db, resume, onExit}){
  const [info,setInfo] = uS(null);
  const [pub,setPub]   = uS(null);
  const hubRef = uR(null);
  const savedAt = uR(-1);
  /* the deal, as TableRoom's dealFrom: the lobby's spec, the card database,
     build.js and judge.newMatch; the catalog as TableBoard builds it */
  const deal = spec => {
    const m = DawnBuild.buildMatch(spec, {
      db, heroes: Object.fromEntries(HEROES.map(h=>[h.k,h])),
      decks: Object.fromEntries(HEROES.map(h=>[h.k,PARSED[h.k]]))});
    const state = DawnJudge.newMatch({builds:m.builds, names:m.names, heroKeys:m.heroKeys, first:m.first, seed:m.seed});
    const catalog = DawnWire.makeCatalog(m.builds.flatMap(b=>[...(b.deck||[]), ...(b.gear||[]),
                                                              ...(b.startItem?[b.startItem.card]:[])]));
    return {state, catalog};
  };
  uE(()=>{
    /* EVERY CHANGE IS KEPT ON THE DEVICE AT ONCE, not on a timer: a judge
       that reloads must resume at the action the phones last saw */
    const keep = h => { const p = h.persist(), i = h.info();
      if(i.over){ try { lsGet().removeItem("dawnblade.judge." + code); } catch(_){} return; }
      if(p && i.seq !== savedAt.current) try { lsGet().setItem("dawnblade.judge." + code, JSON.stringify(p)); savedAt.current = i.seq; } catch(_){} };
    const refresh = () => { const h = hubRef.current; if(!h) return;
      keep(h); setInfo(h.info()); const ss = h.session(); setPub(ss ? ss.state() : null); };
    let hub;
    try {
      hub = DawnHub.createHub({code, build: TABLE_BUILD, deal, reduce: DawnJudge.reduce, legal: DawnJudge.legal,
        check: DawnInvariants.errors, resume: resume || null, onChange: refresh,
        onEvent: e => { if(e.t === "fault") console.error("[dawnblade judge] " + e.reason); }});
    } catch(e){ setInfo({fault: "Could not open the judged table: " + (e.message || e)}); return ()=>{ try{ handle.close(); }catch(_){} }; }
    hubRef.current = hub;
    const take = ch => { const link = hub.connect({send: f => ch.send(f), close: () => ch.close()});
      ch.listen(f => link.receive(f)); ch.onClose(() => link.closed()); };
    if(conns){ conns.q.splice(0).forEach(take); conns.on = take; }   /* and every later one straight here */
    window.__dawnJudgeTable = {hub, code};
    refresh();
    const watch = setInterval(()=>hub.tick(), 1200);
    return ()=>{ clearInterval(watch); try{ handle.close(); }catch(_){} };
  },[]);

  const lob = info && info.lobby;
  const heroName = k => { const h = k && HEROES.find(x=>x.k===k); return h ? heroShort(h) : null; };
  const seatLine = i => {
    const sat = info && info.seats[i];
    const nm = pub ? pub.sides[i].name.split(",")[0] : lob && heroName(lob.heroes[i]);
    return <div key={i} className="tblstat">{"Seat " + i + " · "}{nm || "—"}{" · "}
      <b>{sat ? "connected" : (info && info.dealt ? "away — the game waits for this phone" : "waiting for a player")}</b>
      {pub ? <span className="mono">{" · " + pub.sides[i].hp + " life"}</span> : null}</div>;
  };
  const shown = pub ? DawnReferee.seatFeed(pub, -1).feed.slice(-6).reverse() : [];
  const over = info && info.over;
  return (
    <div className="tblwrap judgeroom">
      <div className="tblhead">Judging table {code}<span className="tblseat">judge's device</span></div>
      <div className="tblcard">
        <div className="tblstat">Players join with this table number</div>
        <div className="tblcode">{code}</div>
      </div>
      {info && info.fault && <div className="tblerr">{info.fault}</div>}
      {[0,1].map(seatLine)}
      {info && !info.dealt && <div className="lobsteps">
        {["hero","throw","board","seed"].map(st=>(
          <span key={st} className={"lobstep"+(st===info.step?" on":"")
            +(DawnLobby.STEPS.indexOf(st) < DawnLobby.STEPS.indexOf(info.step)?" done":"")}>{st}</span>))}
      </div>}
      {pub && <div className="tblcard">
        <div className="tblstat">{over
          ? (over.winner == null ? "The game is a draw." : pub.sides[over.winner].name.split(",")[0] + " wins.")
          : "Turn " + pub.turn + " · " + pub.phase + (pub.step ? " / " + pub.step : "") + " · action " + info.seq}</div>
        {shown.map((l,i)=><div key={i} className="note" style={{margin:"2px 0"}}>{l}</div>)}
      </div>}
      {over && <p className="mnote">Both phones have been sent this device's half of the seed and every move,
        so each player can verify every shuffle and draw.</p>}
      {/* THE HONEST LINE (H3): who holds the deck, and what that means */}
      <p className="mnote">
        <strong>This device holds the deck.</strong> It deals and runs the game; each player's
        phone is sent only that player's own view, so neither phone holds the other's hand,
        either deck or the next draw. This screen shows only what both players can see — but
        the device itself could look, so the players are trusting the judge. Keep this page
        open until the game ends; if it closes, the game pauses and resumes from here.
      </p>
      <button className="bigbtn alt" onClick={onExit}>{over ? "Close the table" : "Leave (the game pauses)"}</button>
    </div>
  );
}

/* The throw. Both seats commit before either reveals — cheap, and the
   alternative is a screen that shows you the answer before it asks the
   question. Ties replay rather than counting, which is rps.js's rule. */
function TableThrow({lob, mySeat, myH, foeH, onThrow}){
  /* A SEALED throw shows as locked until both are opened (HIDDEN HANDS H2). */
  const mine = lob.throws[mySeat] || (lob.seals[mySeat] ? "sealed" : null);
  const theirs = lob.throws[1-mySeat] || (lob.seals[1-mySeat] ? "sealed" : null);
  const both = lob.throws[mySeat] != null && lob.throws[1-mySeat] != null;
  const last = lob.rounds[lob.rounds.length-1] || null;
  return (
    <div className="rps">
      <div className="rtitle">The Throw</div>
      <p className="rsub">Winner decides who takes the first turn.<br/>
        {lob.ties>0 ? <>Tied <b>{lob.ties}</b> — throw again.</> : "Both throws land at once."}</p>
      <div className="rtable">
        <div className="rseat">
          <span className="rwho">You · {myH?heroShort(myH):"—"}</span>
          <span className="rglyph">{mine ? (both?RPS_GLYPH[mine]:"🔒") : "✊"}</span>
          <span className="rname">{mine ? (both?mine:"locked") : "choose"}</span>
        </div>
        <span className="rvs">VS</span>
        <div className="rseat">
          <span className="rwho">{foeH?heroShort(foeH):"Them"}</span>
          <span className="rglyph">{theirs ? (both?RPS_GLYPH[theirs]:"🔒") : "✊"}</span>
          <span className="rname">{theirs ? (both?theirs:"locked") : "shaking"}</span>
        </div>
      </div>
      <div className="rcall">
        {mine==null && <span>Pick your throw.</span>}
        {mine!=null && !both && <span>Locked in. Waiting on them…</span>}
        {last && <span>{RPS_GLYPH[last[0]]} vs {RPS_GLYPH[last[1]]}</span>}
      </div>
      {mine==null && <div className="rthrows">
        {RPS_THROWS.map(t=>(
          <button key={t} onClick={()=>onThrow(t)}>
            <span className="g">{RPS_GLYPH[t]}</span><span className="l">{t}</span>
          </button>))}
      </div>}
    </div>
  );
}

/* ============================================================
   THE BOARD — two hero decks, one game state, two phones. (v2.50)

   IT IS THE TRAINER'S BOARD, WITH A PERSON IN SEAT 1. Same three flick
   screens, same armour grid, same hero row, same hand rail, same two-tap
   peek, same action bar. The plain diagnostic board this replaces proved
   the transport and looked nothing like the game — and "looks nothing
   like the game" is a real defect in a training sim, because the layout
   IS the lesson.

   The shared pieces are shared for real (ArmorGrid, DeckPitchCol,
   InPlayRow, GravePane, usePeek, CardFrame, ChainLink, Ticker), so the
   two boards cannot drift apart. What is deliberately NOT shared is the
   state language: the trainer speaks `mode`/`bphase`, this speaks the CR
   machine — `phase`/`step`/`priority` out of priority.js. Those are the
   two things the rebuild exists to separate, and folding them back
   together here would undo it.

   Every control is gated by `DawnJudge.legal`, the SAME predicate the
   sequencer applies on the other phone: a button that is live here is an
   action that will be accepted there. That is what makes the hand-dim
   honest, and a card that looks playable and does nothing when tapped is
   the failure mode this codebase cares most about.

   THREE THINGS THE TRAINER SHOWS THAT THIS CANNOT, and each is honest
   rather than hidden: no Advisor (it reads the trainer's `built` and
   coaches card text that does not resolve here), no boost toggle, and no
   next-swing prediction — seat 1 is a person, so there is nothing to
   predict.
   ============================================================ */
function TableBoard({match, mySeat, host, code, db, table, netRef, netQ, onExit, local, heroKey, onRecord, judged, onAgain, onRematch}){
  useWakeLock();   /* the screen stays on while this game is up (v7.06) */
  /* AT A TWO-PHONE TABLE THIS PHONE SHOWS ITS OWN SEAT'S VIEW (HIDDEN HANDS
     H2). The host's referee holds the game; until the guest's first snapshot
     lands, the guest shows its blind deal as seen from NEITHER seat: every
     hand and deck face down, so no card on it is a guess. */
  const [g,setG]     = uS(()=> local ? match.g : DawnReferee.seatView(match.g, host ? mySeat : -1));
  const srvNames = useSrvNames(table);     /* a server table's player names (S4.4): each seat's, beside its hero; nothing at any other table */
  const srvRank = useSrvRank(table);       /* a ranked server table (S5.1): each player's rating beside their name, and the mark on the pane; {ranked:false} anywhere else */
  const [note,setNote] = uS(null);
  const [link,setLink] = uS("connected");
  const [zoom,setZoom] = uS(null);
  const [inspect,setInspect] = uS(false);
  const [bug,setBug] = uS(false);
  const sess = uR(null);
  /* TABLE TALK (TT0, v7.18; docs/TABLE-TALK.md) — the new table, behind a switch (`talkOn`). What each
     accepted action SAID (engine/announce.js) queues in `calls`, its head on the table; the PAD keeps every
     change to a hero's life with its source (TRP 5.8). Both fill at every table, so the switch can be
     thrown mid-game with nothing missing; only the new table shows them. */
  const [talk,setTalk] = uS(()=>talkOn());
  const talkAtMount = uR(talk);
  const [calls,setCalls] = uS([]);
  const [pad,setPad] = uS(()=>({start: g.sides.map(sd => sd ? sd.hp : null), marks: []}));
  const [talkLog,setTalkLog] = uS(false), [talkCoach,setTalkCoach] = uS(false), [, setVoiceTick] = uS(0);
  const lastSeen = uR(null);
  const hearRef = uR(null);
  hearRef.current = st => {
    try {
      const ms = DawnAnnounce.marks(st);
      if(ms.length) setPad(p => ({...p, marks: [...p.marks, ...ms.map(m => ({...m, turn: st.next.turn | 0}))]}));

       "stop defending", the same action) is legal, the tile declares; the
       swing and the ability are on the rail too, so the tile preferring the
       declaration loses nothing. */
    const cellAct = mine(defend) ? defend
                  : mine(swing) ? swing
                  : (ability && mine(ability)) ? ability : null;
    /* THE VERB NAMES THE ROUTE. It read "swing" for every `activate`, so
       tapping any of the 32 ability-only pieces promised a swing the piece
       does not print — and the ability's own card is what the two-tap peek
       shows, so the word and the picture disagreed. */
    const abTap = !!(cellAct && cellAct.t === "activate"
                     && (cellAct === ability || !isWeapon(gr)));
    const verb = cellAct ? (cellAct.t==="activate" ? (abTap ? "activate" : "swing")
                  : blocking ? "stop defending" : "defend") : null;
    return (
      <button key={gr.uid} className={"g clip-sm"+(worn?" used":"")+(blocking?" sel":"")
        /* THE HIGHLIGHT FOLLOWS THE PEEKED CARD, which may be the powCard —
           the trainer's `gearBtn` matches both uids for the same reason, or
           the tile you are peeking looks unpeeked (v2.52). */
        +(peek&&(peek.uid===gr.uid||peek.uid===("gp"+gr.uid))?" peek":"")
        +(cellAct?"":" dis")} style={style}
        /* PEEK THE THING YOU ARE ABOUT TO COMMIT TO — the ability's own
           card when the tap is the ability, which is the trainer's own
           rule in `gearBtn` and the reason the word and the picture must
           agree. `peekables()` has always carried the powCard. */
        onClick={cellAct ? tapTwice(abTap && gr.powCard ? gr.powCard : gr, verb, ()=>fire(cellAct))
                         : ()=>setZoom(gr)}>
        {blocking && <span className="defsel">⛨ DEF</span>}
        <span className={"tapwrap"+(spent&&/\btap\b|\{t\}/i.test(gr.tx||"")?" tapped":"")}>
          {back || <CardFrame card={{...gr, def}} className="sm"/>}</span>
      </button>);
  };

  /* Weapons sit in the hero row, armour in the grid — the same split the
     trainer draws, read off the printed slot. */
  const handsOf = sd => (sd.gear||[]).filter(x=>["1h","2h","off","qvr"].includes(slotOf(x).z));
  const armorOf = sd => (sd.gear||[]).filter(x=>!["1h","2h","off","qvr"].includes(slotOf(x).z));
  const myHands = handsOf(me), foeHands = handsOf(them);

  const handCell = c => {
    const play   = playAct(c, "hand");
    const defend = {t:"defend", uid:c.uid};
    const ars    = {t:"arsenal", uid:c.uid};
    const paySel = {t:"paySel", uid:c.uid};
    const pitched = pay && (me.paySel||[]).indexOf(c.uid) >= 0;
    const blocking = (me.blockH||[]).indexOf(c.uid) >= 0;
    /* THE DIM MUST ASK EXACTLY WHAT THE TAP ASKS, or a card looks
       playable and refuses when tapped. Both come from `legal`. */
    const cellAct = pay ? (mine(paySel) ? paySel : null)
      : myArsStep ? (mine(ars) ? ars : null)
      : mine(play) ? play
      : mine(defend) ? defend : null;
    const verb = !cellAct ? null
      : cellAct.t==="paySel" ? (pitched ? "unpitch" : "pitch")
      : cellAct.t==="arsenal" ? "set in arsenal"
      : cellAct.t==="defend" ? (blocking ? "stop defending" : "defend")
      : DawnParser.isAttack(c) ? "attack" : "play";
    return (
      <button key={c.uid}
        className={"hc clip-sm"+((pitched||blocking)?" sel":"")+(cellAct?"":" dis")
          +(peek&&peek.uid===c.uid?" peek":"")}
        onClick={cellAct ? tapTwice(c, verb, ()=>fire(cellAct)) : ()=>setZoom(c)}>
        {blocking && <span className="defsel">⛨ DEF</span>}
        {pitched && <span className="defsel">◈ {c.pitch}</span>}
        <CardFrame card={c}/>
      </button>);
  };

  /* ---- THE RAIL'S OTHER PLAYS (v5.44, QUEUE v4 S11) -----------------
     The trainer's `playables()` puts every route a seat has besides its
     hand on the rail: each weapon swing, each equipment ability's powCard,
     the hero power, and the cards playable from the graveyard or banish.
     The table had the swing and the ability folded into one tile tap (so
     one of them hid behind the other) and NO route from the graveyard or
     banish at all: Gravy Bones could not replay a watery-grave ally here.

     Each entry is an ACTION and `judge.legal` lights it (v3.84: the UI
     reads no card text). The gear and hero entries are few and show dim
     when refused; a graveyard or banish card appears only when legal, or a
     thirty-card graveyard floods the rail. */
  const liveBuild = (g.builds && g.builds[mySeat]) || myBuild;
  const railPlays = () => {
    if(pay || myArsStep || over) return [];
    const out = [];
    /* EQUIPMENT THAT CAN BLOCK JOINS THE HAND (v7.11; user, 2026-11-25:
       "make sure the equipment is showing up in the hand wheel when it can
       be blocked with"). The trainer's `playables()` has offered each
       declarable piece on the rail since v2; here a piece blocked only from
       its tile on YOUR BOARD, a flick away from the attack it answers.
       `judge.legal` decides, as on the tile: a piece is listed while
       `defend` (or "stop defending", the same action) is legal, first,
       because in the defend step blocking is the play. */
    for(const gr of me.gear){
      if(gr.destroyed) continue;
      const d = {t:"defend", uid:gr.uid};
      if(!mine(d)) continue;
      const on = (me.blockG||[]).indexOf(gr.uid) >= 0;
      out.push({card:{...gr, def:gearDef(gr)}, a:d, verb:on ? "stop defending" : "defend",
                zone:slotOf(gr).lab, sel:on});
    }
    for(const gr of me.gear){
      if(gr.destroyed) continue;
      if(isWeapon(gr)) out.push({card:gr, a:actAct(gr.uid), verb:"swing", zone:slotOf(gr).lab});
      if(gr.pow && gr.powCard) out.push({card:gr.powCard, a:{t:"activate", uid:"gp"+gr.uid},
                                         verb:"activate", zone:slotOf(gr).lab});
    }
    if(liveBuild.HPOW) out.push({card:liveBuild.HPOW, a:{t:"activate", from:"hero", uid:"hpow"},
                                 verb:"use the hero power", zone:"hero"});
    for(const [z, verb, lab] of [["grave", "play from the graveyard", "discard"],
                                 ["banish", "play from banish", "banish"]])
      for(const c of me[z] || []){
        const a = playAct(c, z);
        if(mine(a)) out.push({card:c, a, verb, zone:lab});
      }
    return out;
  };
  const railCell = (p, i) => {
    const ok = mine(p.a);
    return (
      <button key={"rp-"+p.zone+"-"+p.card.uid+"-"+i} data-rail-def={p.a.t==="defend" ? p.card.uid : undefined}
        className={"hc clip-sm"+(ok?"":" dis")+(p.sel?" sel":"")+(peek&&peek.uid===p.card.uid&&peek.verb===p.verb?" peek":"")}
        onClick={ok ? tapTwice(p.card, p.verb, ()=>fire(p.a)) : ()=>setZoom(p.card)}>
        {p.sel && <span className="defsel">⛨ DEF</span>}
        <CardFrame card={p.card} zone={p.zone}/>
      </button>);
  };

  /* The defending wall, as the trainer draws it: whatever each seat has
     actually declared against the open link. */
  const declared = sd => [...(sd.blockH||[]).map(u=>(sd.hand||[]).find(c=>c.uid===u)),
                          ...(sd.blockG||[]).map(u=>(sd.gear||[]).find(c=>c.uid===u))].filter(Boolean);

  const pips = [];
  if(me.res>0)             pips.push(["floating "+me.res, "on"]);
  if(me.ap>0)              pips.push(["action point", "on"]);
  if(runeCount(me)>0)      pips.push(["runechant ×"+runeCount(me), "on"]);
  if(wardTotal(me)>0)      pips.push(["ward "+wardTotal(me), "on"]);
  if(frostCount(them)>0)   pips.push(["they are frostbitten "+frostCount(them), ""]);
  if(g.chain.length)       pips.push(["chain link "+g.chain.length, ""]);
  if(link!=="connected")   pips.push([link, "warn"]);

  const featured = g.featured;
  if(pay && pay.card) Glide.keep(pay.card.uid);   /* the card being paid for keeps its flight from the hand (Glide) */

  /* ---- THE PIECES BOTH LAYOUTS DRAW (Table Talk TT0, v7.18). Built ONCE, here, so the classic board and the
     new table render the very same controls (the no-mirror rule one layer up): the ask (the status line), the
     pips, the attack-target rail, the hand row, the call, your arena's cell, the hub, and everything laid over
     the board. The classic layout below draws them exactly where it always did. ---- */
  const askEl = <>
              {/* The status line says what the CR machine is asking of
                  THIS seat, in the trainer's voice. */}
              {over ? <div className="statusline">{drawText
                  ? drawText.status
                  : <>{over.winner===mySeat?"You win":"You lose"} — {g.sides[over.winner].name} takes it on {over.how}.</>}</div>
                : boost ? <div className="statusline">Boost <b>{boost.card.name}</b>? Banish the top card of your deck as an additional cost — a <b>Mechanologist</b> card grants go again.</div>
                : fuse ? <div className="statusline">Fuse <b>{fuse.card.name}</b>? Reveal a {(fuse.types||[]).join("/")} card from your hand as an additional cost — <b>{them.name} sees it</b>.</div>
                : charge ? <div className="statusline">Charge for <b>{charge.card.name}</b>? A card from your hand goes to your <b>soul</b> as an additional cost — you may decline.</div>
                : usurp ? <div className="statusline">Usurp for <b>{usurp.card.name}</b> — which Runechant is destroyed to pay for it?</div>
                : bancost ? <div className="statusline"><b>{bancost.card.name}</b> has an additional cost — banish a card from your graveyard, or decline.</div>
                /* TABLE TALK (TT1): the ask in a player's words, short; the hub carries Cancel and "Pitch & play", so the line
                   carries no button of its own (the classic line below is unchanged) */
                : pay && talk ? <div className="statusline">{(()=>{const short=Math.max(0,pay.need-me.res-DawnJudge.paySum(me));
                    const why=short>0?null:DawnJudge.legal(g,{t:"payConfirm"},mySeat);
                    return short>0 ? <span>Pitch for <b>{talkShort(pay.card)}</b> · <b>{short}</b> to go</span>
                      : why ? <span>{why}</span> : <span><b>{talkShort(pay.card)}</b> is paid for</span>;})()}</div>
                : pay ? <div className="statusline">Paying <b>{pay.card.name}</b> — tap cards below to pitch · {(()=>{const short=Math.max(0,pay.need-me.res-DawnJudge.paySum(me)); /* COVERED IS NOT CONFIRMABLE when a second question refuses the pitch
     (v4.91 — Savage Feast's additional discard): say `legal`'s reason
     rather than "covered ✓" over a dead button (v2.83, v4.59). */
  const why=short>0?null:DawnJudge.legal(g,{t:"payConfirm"},mySeat); return short>0?<span>need <b>{short}</b> more</span>:why?<span>{why}</span>:<span>covered ✓</span>;})()}
                    <button onClick={()=>fire({t:"payCancel"})}>✕ cancel</button></div>
                : theirPay ? <div className="statusline">{them.name} is paying for something…</div>
                : myArsStep && talk ? <div className="statusline">Tap a card to put in your <b>arsenal</b></div>
                : myArsStep ? <div className="statusline">Tap a card below for <b>arsenal</b>
                    <button onClick={()=>fire({t:"arsenal",uid:null})}>skip</button></div>
                : g.phase==="end" ? <div className="statusline">End phase — {them.name} is finishing their turn.</div>
                : defending ? (talk
                    ? <div className="statusline"><b>{g.pend?g.pend.total:0}</b> coming at you — tap cards to block</div>
                    : <div className="statusline">Defend step — tap hand &amp; equipment to declare · incoming <b>{g.pend?g.pend.total:0}</b></div>)
                /* A CARD WAITING ON THE STACK (v4.66) — CR 7.1.2 / 4.2.2. It
                   resolves when both seats pass, and the one thing either may
                   do first is answer at instant speed. Said so, or the pause
                   reads as a stuck game. */
                : (g.stack||[]).some(l=>l&&l.k==="play") ? <div className="statusline"><b>{(g.stack||[]).filter(l=>l&&l.k==="play").slice(-1)[0].label}</b> — {mine({t:"pass"}) ? "answer at instant speed, or pass to let it resolve" : "waiting on "+them.name.split(",")[0]}</div>
                : myTurn ? <div className="statusline">{g.step==="layer" ? <span>Your window — play, or pass</span>
                    : <span>{g.step} step — react from floating <b>{me.res}</b> or pass</span>}</div>
                : <div className="statusline">Waiting on {them.name} — {g.phase} / {g.step}</div>}
  </>;
  const pipsEl = <>
              {pips.length ? <div className="rail">{pips.map(([t,cl],i)=>
                <span key={i} className={"rp"+(cl?" "+cl:"")}>{t}</span>)}</div> : null}
  </>;
  const targetEl = <>
              {/* CR 1.4.5 — the declaration is MANDATORY, so the rail is the
                  one place the choice is made and every attack route reads
                  it (`tgtSpec`). An attack on an ally cannot be blocked
                  (CR 7.3.2a) and ally life resets at end of turn
                  (CR 4.4.3a), so it is a real decision rather than a worse
                  way to hit the hero.

                  THE LABEL READ `t.kind` AND AN ENTRY KEEPS IT AT
                  `t._target.kind` (v4.45), so it was undefined and BOTH
                  buttons read "ally" — the hero included. The same
                  two-shapes-for-one-fact defect the action carried, in the
                  one place a player looks to tell them apart. And an ally
                  is NAMED: an entry IS the card, so two Swabbies were
                  otherwise two identical buttons. */}
              {needTarget && <div className="rail">
                <span className="rp">attack:</span>
                {targets.map((t,i)=>(
                  <button key={i} className={"rp"+((tgt||targets[0])===t?" on":"")}
                    onClick={()=>setTgt(t)}>{t._target.kind==="hero"
                      ? them.name.split(",")[0]
                      : t.name + (t._life!=null ? " ♥"+t._life : "")}</button>))}
              </div>}
  </>;
  const handRowEl = (
              <HandRow>
                {me.hand.map(handCell)}
                {railPlays().map(railCell)}
                {me.arsenal && (()=>{
                  const a = playAct(me.arsenal, "arsenal");
                  const ok = mine(a);
                  return <button key={me.arsenal.uid}
                    className={"hc clip-sm"+(ok?"":" dis")+(peek&&peek.uid===me.arsenal.uid?" peek":"")}
                    onClick={ok ? tapTwice(me.arsenal,"play from arsenal",()=>fire(a)) : ()=>setZoom(me.arsenal)}>
                    <CardFrame card={me.arsenal} zone="arsenal"/></button>;
                })()}
              </HandRow>);
  const adviceEl = <>
              {/* ---- THE CALL, AT THE TABLE (v2.83) -----------------------
                  This board had no advisor, and the stated reason — that it
                  "would coach card text that does not resolve here" — has
                  been false since v2.77, when judge.js started resolving
                  every card effect through engine/effects.js. What was
                  actually missing was the WINDOW: `advise` read `g.mode`,
                  which judge seeds once and never writes, so it would have
                  coached the action phase in every step of every turn.
                  `advView` derives it from the CR machine instead.

                  LOCAL SESSIONS ONLY, and that is a decision rather than a
                  limit of the machinery. Across a network the seat opposite
                  is a PERSON: `advCardOut` prices your line against the
                  opponent's gear and hand, which at a table is reading a
                  board you can see but coaching against an opponent who is
                  choosing — and the trainer's whole framing is that the
                  advisor reads a punching bag. Turn it on for a person only
                  as a deliberate call.

                  AND SEAT 0 ONLY, stated rather than assumed. `advise` reads
                  its own hand through `you(g)`, which is `sides[0]` — a
                  module-local accessor, not the seat it was handed. Asking
                  `advView` for seat 1 while `advise` coached seat 0's hand
                  would derive the right window for the wrong player, and it
                  would read as ordinary bad advice. A local session always
                  seats you at 0, so this costs nothing today and cannot go
                  quietly wrong if that ever changes. */}
              {/* <HERO>'S CALL (v5.47). The table's call is the seat
                  policy's own move with its reason (`sparring.explain`), so
                  following it never meets a refusal. When this seat has
                  nothing to decide, the box says who is deciding. */}
              {local && mySeat === 0 && <Advisor g={g}
                label={String((myH && myH.n) || me.name).split(",")[0] + "'s call"}
                call={() => {
                  /* the call plays at the table's level: searched when the
                     AI seat is, memoized per state (sparring.explain) */
                  const e = DawnSparring.explain(g, mySeat, {search: !!match.sharp});
                  /* "don't block" (the searched wall) is a call with no action of its own */
                  if(e.action || e.key === "laTake") return {line: e.line, why: e.why};
                  const other = DawnSparring.explain(g, 1 - mySeat, {search: false}).action;
                  return {line: other ? them.name.split(",")[0] + " is deciding." : "Nothing to decide yet."};
                }}
                read={myBuild.read}/>}
  </>;
  const myBoardCell = (b,i)=>{
                const bp = DawnJudge.boardAttackOf(g, mySeat, b.uid);
                const bab = bp ? null : DawnJudge.boardAbilityOf(g, mySeat, b.uid);
                /* AN ABILITY CARRIES NO ATTACK-TARGET, so it sends the bare
                   action rather than `actAct`: CR 1.4.5 is about an attack
                   or an attack-layer, and `doActivate`'s ability branch
                   drops a target anyway — sending one would be a field
                   `legal` never validates (v4.45's two-shapes lesson read
                   from the other end). */
                const swing = bp ? actAct(b.uid) : bab ? {t:"activate", uid:b.uid} : null;
                const can = swing && mine(swing);
                return (
                <button key={b.uid} className={"b clip-sm"+(b.spent?" spent":"")
                    +(peek&&peek.uid===b.uid?" peek":"")} style={{width:52,flex:"none"}}
                  onClick={can ? tapTwice(b.card, bab ? "activate its ability"
                                          : bp.kind==="aura" ? "attack with this aura" : "swing",
                                          ()=>fire(swing))
                               : ()=>setZoom(b.card)}>
                  <span className={"tapwrap"+((b.spent&&/\btap\b|\{t\}/i.test(b.card.tx||""))?" tapped":"")}>
                    <CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/></span>
                  {b.kind==="ally" && b.life!=null && <span className="sw">♥ {b.life}</span>}
                </button>);
              };
  /* TABLE TALK (TT1): a pass that answers the other seat's card on the stack is said as "No response" */
  const theirTop = (()=>{ const st = (g.stack||[]).filter(l=>l&&l.k==="play"); const t = st[st.length-1]; return !!t && t.seat !== mySeat; })();
  const hubEl = (
      <HubBar>
        {over ? <button className="a go hubp" onClick={onExit}>Leave the table</button>
          /* BOOST'S ADDITIONAL COST (v2.84) — asked before the payment
             branch because a boost pending and a pay pending are the same
             field, and this one has no Cancel: by the time it is asked the
             play is committed, and "no" is a complete answer to "you may".
             The two buttons say what they do, in the trainer's own words,
             so a player who learns one board is not relearning the other. */
          : boost ? <>
              <button className="a go hubp" onClick={()=>fire({t:"boost",yes:true})}>⚡ Boost</button>
              <button className="a" onClick={()=>fire({t:"boost",yes:false})}>No boost</button>
            </>
          /* WHICH HALF OF A SPLIT CARD (v3.35). Asked before the payment,
             because melding doubles the base cost — and it is the card's
             whole mechanic, so it is a real choice rather than a sheet. */
          : split ? <>
              {(split.halves||[]).map((h,i)=>
                <button key={i} className="a go" onClick={()=>fire({t:"split",half:i})}>{h}</button>)}
              {DawnParser.hasKw(split.card,"meld") &&
                <button className="a" onClick={()=>fire({t:"split",half:"both"})}>Meld both</button>}
            </>
          /* HOW MUCH X (v4.72) — Ice Eternal's "XX". Asked before the
             payment, because the price is X twice over; one button per value
             the seat can pay, so a choice the rules would refuse is never
             offered (a dead control reads as a broken screen, v2.83). */
          /* WHICH CARD A DISCARD COST SPENDS (v4.85) — one button per card
             that could pay, off `discCostChoice`, the one reader both boards
             ask. No Cancel, for boost's reason: nothing is spent until the
             ability resolves, and the question is which card, not whether. */
          : discost ? <>
              {(discost.uids||[]).map(u => {
                const c = (me.hand||[]).find(x=>x.uid===u);
                const twin = c && (discost.uids||[]).some(v => v !== u && (((me.hand||[]).find(x=>x.uid===v)||{}).name === c.name));
                return <button key={u} className="a go" onClick={()=>fire({t:"discost",uid:u})}>
                  Discard {c ? c.name : "card"}{twin ? " ("+(["","red","yellow","blue"][c.pitch]||"pitch "+c.pitch)+")" : ""}</button>;
              })}
            </>
          /* WHICH SOUL CARD A SOUL COST BANISHES (v5.59) — one button per
             card the cost could take, off `soulCostChoice`, the one reader
             both boards ask. The soul is public, so the buttons name what
             they take. No Cancel, for discost's reason. */
          /* WHICH RUNECHANT USURP DESTROYS (v6.42) — one button per
             different card that could pay, off `parser.usurpOffer`, the one
             reader both boards ask. The arena is public, so the buttons name
             what they destroy. No Cancel and no decline: "if able". */
          : usurp ? <>
              {(usurp.uids||[]).map(u => {
                const b = (me.board||[]).find(x=>x.uid===u);
                return <button key={u} className="a go" onClick={()=>fire({t:"usurp",uid:u})}>
                  Usurp {b ? b.card.name : "Runechant"}</button>;
              })}
            </>
          /* AN OPTIONAL GRAVEYARD BANISH COST (v6.43) — one button per
             different card that could pay, off `prompts.banCostChoice`, the
             one reader both boards ask, and a Decline: "you may". */
          : bancost ? <>
              {(bancost.uids||[]).map(u => {
                const c = (me.grave||[]).find(x=>x.uid===u);
                return <button key={u} className="a go" onClick={()=>fire({t:"bancost",uid:u})}>
                  Banish {c ? c.name : "card"}</button>;
              })}
              <button className="a" onClick={()=>fire({t:"bancost",uid:null})}>Decline</button>
            </>
          /* WHICH PERMANENT A DESTROY COST TAKES (v6.66) — Runebleed Robe with
             a Runechant token and a Runechant of Lust or Sloth: one button per
             different card that could pay, off `parser.boardCostOffer`, the one
             reader both boards ask. The arena is public. No decline: a cost. */
          : boardcost ? <>
              {(boardcost.uids||[]).map(u => {
                const b = (me.board||[]).find(x=>x.uid===u);
                return <button key={u} className="a go" onClick={()=>fire({t:"boardcost",uid:u})}>
                  Destroy {b ? b.card.name : boardcost.name || "it"}</button>;
              })}
            </>
          : soulcost ? <>
              {(soulcost.uids||[]).map(u => {
                const c = (me.soul||[]).find(x=>x.uid===u);
                const twin = c && (soulcost.uids||[]).some(v => v !== u && (((me.soul||[]).find(x=>x.uid===v)||{}).name === c.name));
                return <button key={u} className="a go" onClick={()=>fire({t:"soulcost",uid:u})}>
                  Banish {c ? c.name : "card"}{twin ? " ("+(["","red","yellow","blue"][c.pitch]||"pitch "+c.pitch)+")" : ""}</button>;
              })}
            </>
          /* THE TARGET AN ACTIVATED ABILITY DECLARES (v5.72) — one button per
             card it may name, off `abPickBound`'s pool: the one the legality
             asked, so no refused target is offered. Declared BEFORE the cost
             and before the other seat's window; Cancel withdraws it while
             nothing has been paid. A target whose cost settles an X shows it. */
          : abtarget ? <>
              {(abtarget.uids||[]).map(u => {
                const _tz = [...(me.grave||[]), ...(me.banish||[])];   /* v6.41: the banished zone too (Gate to i'Arathael) */
                const c = _tz.find(x=>x.uid===u);
                const twin = c && (abtarget.uids||[]).some(v => v !== u && ((_tz.find(x=>x.uid===v)||{}).name === c.name));
                return <button key={u} className="a go" onClick={()=>fire({t:"abtarget",uid:u})}>
                  {c ? c.name : "card"}{twin ? " ("+(["","red","yellow","blue"][c.pitch]||"pitch "+c.pitch)+")" : ""}{c && abtarget.card && abtarget.card._xPips ? " · X = "+(c.cost||0) : ""}</button>;
              })}
              <button className="a" onClick={()=>fire({t:"payCancel"})}>Cancel</button>
            </>
          : xval ? <>
              {Array.from({length: (xval.max||0) + 1}, (_, x) =>
                <button key={x} className={"a"+(x===xval.max?" go":"")} onClick={()=>fire({t:"xval",x})}>X = {x}{x ? " · pay "+(x*(xval.per||1)) : ""}</button>)}
            </>
          /* AN OPTIONAL ADDITIONAL COST. No Cancel, for boost's reason:
             the play is committed and "no" is a complete answer. */
          : addPay ? <>
              <button className="a go hubp" onClick={()=>fire({t:"addPay",yes:true})}>Pay {addPay.cost} more</button>
              <button className="a" onClick={()=>fire({t:"addPay",yes:false})}>Decline</button>
            </>
          /* FUSION'S REVEAL (v4.27). ONE BUTTON PER ELIGIBLE CARD, because
             WHICH card is the decision: the price this cost charges is the
             INFORMATION the opponent gains, so revealing a spent blue is
             not the same play as revealing the attack you are holding. The
             uids arrive with the question from `parser.fusionOffer`, the
             one reader both boards ask, so the buttons and the legality of
             the answer cannot disagree. No Cancel, for boost's reason. */
          : fuse ? <>
              {(fuse.uids||[]).map(u => {
                const c = (me.hand||[]).find(x=>x.uid===u);
                return <button key={u} className="a go" onClick={()=>fire({t:"fuse",uid:u})}>
                  Reveal {c ? c.name : "card"}</button>;
              })}
              <button className="a" onClick={()=>fire({t:"fuse",uid:null})}>No reveal</button>
            </>
          /* CHARGE (v4.33) — one button per card in hand, because WHICH
             card is the decision and more so than fusion's: a revealed
             card stays in the hand and a CHARGED one is gone to the soul.
             The uids arrive with the question from `parser.chargeOffer`,
             the one reader both boards ask. No Cancel, for boost's
             reason — but a real "No charge", because upstream's own
             keyword definition says you may elect not to pay. */
          : charge ? <>
              {(charge.uids||[]).map(u => {
                const c = (me.hand||[]).find(x=>x.uid===u);
                return <button key={u} className="a go" onClick={()=>fire({t:"charge",uid:u})}>
                  Charge {c ? c.name : "card"}</button>;
              })}
              <button className="a" onClick={()=>fire({t:"charge",uid:null})}>No charge</button>
            </>
          : pay ? <>
              <button className="a" onClick={()=>fire({t:"payCancel"})}>Cancel</button>
              <button className="a pay hubp" disabled={!mine({t:"payConfirm"})} onClick={()=>fire({t:"payConfirm"})}>Pitch &amp; play</button>
            </>
          : myArsStep ? <>
              <button className="a hubp" onClick={()=>fire({t:"arsenal",uid:null})}>Leave it empty</button>
              <span className="a dis">tap a card to set it</span>
            </>
          /* CR 7.3.3 — IN THE DEFEND STEP THE TURN-PLAYER HOLDS PRIORITY
             while the DEFENDER declares. So the defender really cannot
             pass until the attacker has, and a button reading "Done
             defending" that is permanently dead reads as a broken screen
             rather than as the rule it is. Say which it is. */
          : defending ? <>
              {mine({t:"pass"})
                ? <button className={"a hubp "+(passTone==="free"?"free":"go")} data-pass={passTone} onClick={()=>fire({t:"pass"})}>{talk
                    /* TABLE TALK: your line, as you would say it across the table (docs/TABLE-TALK.md §4.2) */
                    ? ((me.blockH||[]).length + (me.blockG||[]).length ? "Block with " + ((me.blockH||[]).length + (me.blockG||[]).length) : "No block")
                    : "Done defending"}</button>
                : <span className="a dis hubp">declare your blockers — {them.name.split(",")[0]} still holds priority</span>}
              {/* RULING (user, 2026-11-15): no Concede button here. One tap with no
                  confirmation was a ranked loss. Closing a started ranked table is
                  still a concession, and the engine still knows CR 4.5.3c. */}
            </>
          : <>
              {mine({t:"pass"})
                ? (g.step === "defend" && targetCanBeDefended(g.pend && g.pend.target)
                    /* CR 7.3.3 - the turn-player holds priority in the defend step, so the game (and a ranked table's clock) waits on the ATTACKER until it
                       passes; only then is the wait on the defender. RULING (user, 2026-11-15): the clock sits on whoever must decide - so say what this tap does. */
                    ? <button className={"a "+(passTone==="free"?"free":"go")+(mine({t:"endTurn"})?"":" hubp")} data-pass={passTone} data-testid="pass-to-blocks" onClick={()=>fire({t:"pass"})}>{talk ? "Any blocks?" : <>Pass — let {them.name.split(",")[0]} block</>}</button>
                    : <button className={"a"+(passTone?" "+passTone:"")+(mine({t:"endTurn"})?"":" hubp")} data-pass={passTone} data-testid="pass" onClick={()=>fire({t:"pass"})}>{talk && theirTop ? "No response" : "Pass"}</button>)
                : <span className={"a dis"+(mine({t:"endTurn"})?"":" hubp")}>waiting on {them.name.split(",")[0]}</span>}
              <button className={"a "+(mine({t:"endTurn"}) && passTone ? passTone : "go")+(mine({t:"endTurn"})?" hubp":"")} data-pass={mine({t:"endTurn"}) ? passTone : ""} data-testid="end-turn" disabled={!mine({t:"endTurn"})} onClick={()=>fire({t:"endTurn"})}>End turn</button>
            </>}
      </HubBar>);
  const overlaysEl = <>
      {/* WHO YOU BEAT DECIDES WHETHER IT IS A TROPHY (v2.83).

          The rule here has not changed — "a trophy handed out for a real
          match would quietly devalue the case" — but v2.81 changed who is
          sitting opposite. A seat the dummy fills is ALWAYS the vanilla
          pile, so a LOCAL win is a win over the same punching bag the
          trainer's is, scored the same way (turns + wasted, and `wasted`
          is already kept by priority.js's endTurn for both seats). It
          earns the same pull.

          A NETWORKED win is over a person and still gets the honest words
          and no reward. So the distinction is `local`, and it follows the
          existing rule rather than overriding it. */}
      {beatDummy && onRecord
        ? <WinPanel score={g.turn + (me.wasted||0)} onExit={onExit}><Recap g={g} me={mySeat}/></WinPanel>
        /* TABLE TALK: the game's last call ("DASH WINS") is said first; the result comes when it is done (or tapped on) */
        : over && !(talk && calls.some(l => l && l.k === "over")) && <EndPanel tone={drawText ? "draw" : over.winner===mySeat ? "win" : "lose"}
          title={drawText ? drawText.title : over.winner===mySeat ? "YOU TAKE IT" : "THEY TAKE IT"}
          kicker={"turn "+g.turn+" · table "+code}
          names={drawText ? drawText.names : g.sides[over.winner].name+" over "+g.sides[1-over.winner].name}
          stat={me.hp>0 ? me.hp : null} statLbl="life left" onExit={onExit} leave="Leave the table"
          pad={talk ? <TalkResult pad={pad} mySeat={mySeat} them={them} first={match.first != null ? match.first : null} turn={g.turn}
                        winner={drawText ? null : over.winner}/> : null}>
        <p className="endnote">
          {drawText ? drawText.note : over.how==="life" ? "Life to zero." : "The game ended on "+over.how+"."}
        </p>
        {!talk && <Recap g={g} me={mySeat}/>}
        {!local && <RankChange table={table} seat={mySeat}/>}
        {/* PLAY AGAIN (v6.81, NEXT 1): a server game's end screen goes straight back into the queue, the same kind of match (friendly or ranked); the walk
            back through three screens is gone. The finished table no longer counts toward the open-table cap (005), so the new search is never refused for it. */}
        {!local && judged && judged.srv && onRematch && <RematchRow table={table} seat={mySeat} name={srvNames[1-mySeat] || "your opponent"} onGo={c=>onRematch(c, !!srvRank.ranked)}/>}
        {!local && judged && judged.srv && onAgain && <button className={"bigbtn"+(onRematch ? " alt" : "")} data-testid="seek-again" style={{marginTop:10}}
          onClick={e=>{e.stopPropagation(); onAgain(!!srvRank.ranked);}}>{srvRank.ranked ? "Find another ranked match" : "Find another match"}</button>}
        {!local && !host && <div onClick={e=>e.stopPropagation()} style={{marginTop:10}}>
          <p className="fs-lg">{judged ? (judged.srv ? "The server" : "The judge's device") : "The host's phone"} held the deck. It has now sent its half of the seed and every move.</p>
          <button className="bigbtn alt" disabled={verdict==="busy"} onClick={verify}>
            {verdict==="busy" ? "Verifying…" : "Verify this game"}</button>
          {verdict && verdict!=="busy" && <p className={(verdict.ok ? "note" : "tblerr") + " fs-xl"}>
            {verdict.ok
              ? "Verified: every shuffle and draw came from the seed both phones fixed, and every move replays to exactly what you saw."
              : "Not verified: " + verdict.why + "."}</p>}
        </div>}
      </EndPanel>}

      {note && <div className="tblerr">{note}</div>}
      <SrvBanner table={tableRef.current} waitingOnThem={!over && g.priority !== mySeat}/>
      {!local && !over && <ForfeitBar table={tableRef.current} seat={mySeat} over={!!over}/>}
      {/* THE HOST'S PHONE LEFT (HIDDEN HANDS H2): the game waits for it. The
          guest holds no hidden card, so it cannot carry the game on. */}
      {!local && !host && link === "paused" && !over && !(judged && judged.srv) && <div className="tblerr">
        {judged
          ? <>The game is paused: this phone has lost its link to the judge's device, which
              holds the deck. Rejoin once the judge's table {code} is open again.</>
          : <>The game is paused: the host's phone holds the deck and has left the table.
              It resumes when the host reopens table {code}.</>}
        {" "}<button className="a go" disabled={rejoining} onClick={rejoin}>{rejoining ? "Rejoining…" : "Rejoin"}</button>
      </div>}
      <CardModal card={zoom} onClose={()=>setZoom(null)}/>
      <JudgeSheet open={bug} onClose={()=>setBug(false)} warn={judgeN}
        meta={`v${window.APP_VER} · table ${code} · seat ${mySeat} · turn ${g.turn} · ${g.phase}/${g.step}`}
        report={note2 => [g, {
          note: note2, source:"table", appVer:window.APP_VER, dataVer:window.DATA_VER,
          hero: me.heroKey, heroName: me.name, mySeat, table: code,
          seating: g.turnPlayer===mySeat ? "you first" : "opponent first",
          invariantsSeen: judgeRef.current,
          /* WHICH PHONE SAW IT. Two peers on different hashes at the same
             `seq` is a desync stated in one line, and it is the first
             thing to check on any table bug. */
          net: sess.current ? {seat:mySeat, host, status:sess.current.status(),
            seq:sess.current.seq(), hash:sess.current.hash(),
            link, ...sess.current.stats()} : null
        }]}/>
      {!over && !g.prompt && !sheet && <PeekDock card={peek && peekables().find(c=>c.uid===peek.uid)}
        verb={peek && peek.verb} onClose={()=>setPeek(null)}/>}
      {/* THE SHEET THIS BOARD NEVER HAD (v4.44). `judge.legal` stops the
          game for BOTH seats while a prompt is live and refuses every
          action but the five that answer it — so until now a card that
          asked its controller a question froze the table outright. The
          body is the trainer's, unchanged and shared; what is local is
          that every answer travels as an ACTION, because the sheet lives
          in the sequenced state and two peers must agree about what has
          been chosen. Hidden while a prompt is open, the peek dock docks
          in exactly this spot (v2.52's measurement). */}
      {/* while the game is PAUSED (the host's phone left) no sheet can be
          answered, and an open one would cover the Rejoin button */}
      <PromptSheet p={over || link === "paused" ? null : g.prompt} me={mySeat}
        onToggle={i=>fire({t:"promptSel", i})}
        onPick={choice=>fire({t:"promptChoose", choice})}
        onTakeBack={()=>fire({t:"promptTakeBack"})}
        onMove={(i,dir)=>fire({t:"promptMove", i, dir})}
        onDecline={()=>fire({t:"promptDecline"})}
        onConfirm={()=>fire({t:"promptConfirm"})}/>
  </>;

  /* ---- TABLE TALK: the new table (docs/TABLE-TALK.md §3). The ask shows only when something is asked of
     you; the log and the coach live in the menu, and neither exists at a ranked table (TRP 5.1, 5.9). ---- */
  /* TT1: a card on the stack needs no ask line here — it lies on the mat marked "on the stack" and the hub says "No response" */
  const askOn = !over && !!(boost || fuse || charge || usurp || bancost || pay || myArsStep || defending);
  if(talk){
    const voiceOn = !!store.get(TALK_VOICE, false);
    const menuItems = [
      ["Leave the table", onExit, local ? "This game against the AI is not kept." : ranked ? "Leaving a ranked game counts as a loss." : "Your opponent is told you left."],
      ["Voice: " + (voiceOn ? "on" : "off"), ()=>{ store.set(TALK_VOICE, !voiceOn); setVoiceTick(t=>t+1);
        /* iOS lets a page speak only from inside a tap: say "Voice on" in THIS tap, and later lines may follow */
        try { if(!window.speechSynthesis) return; window.speechSynthesis.cancel(); if(!voiceOn) window.speechSynthesis.speak(new SpeechSynthesisUtterance("Voice on")); } catch(_){} },
        voiceOn ? "The opponent's plays are read aloud." : "Hear the opponent's plays read aloud, as if they said them."],
      !ranked && ["The log", ()=>setTalkLog(true), "Every line of the game so far. A ranked table has none: at a real table nobody keeps one."],
      local && mySeat === 0 && [String((myH && myH.n) || me.name).split(",")[0] + "'s call", ()=>setTalkCoach(true), "What the AI would play in your seat, and why. Practice only."],
      ["Classic table", ()=>setTalk(false), "The board as it was, for this game."],
      ["JUDGE!!", ()=>setBug(true), "Something wrong? Send the game as it stands."],
      ["Sound", <SoundBtn/>]];
    const extra = <>
      {talkLog && <div className="tk-sheetwrap" onClick={()=>setTalkLog(false)}><div className="tk-look" onClick={e=>e.stopPropagation()} data-talk-log>
        <div className="tk-padhead">The log · turn {g.turn}</div>
        <div className="tk-log">{[...feedShown].reverse().map((l,i)=><div key={i} className="gl"><PipLine s={l}/></div>)}</div>
        <button className="bigbtn alt" onClick={()=>setTalkLog(false)}>Back to the table</button></div></div>}
      {talkCoach && <div className="tk-sheetwrap" onClick={()=>setTalkCoach(false)}><div className="tk-look" onClick={e=>e.stopPropagation()} data-talk-coach>
        {adviceEl}
        <button className="bigbtn alt" onClick={()=>setTalkCoach(false)}>Back to the table</button></div></div>}
    </>;
    return (
      <div className="board talk" data-talk>
        <TalkTable g={g} mySeat={mySeat} db={db} myH={myH} foeH={foeH} names={g.sides.map(sd=>sd.name)}
          rating={srvRank.ranked && srvRank.ratings ? srvRank.ratings : {}} first={match.first != null ? match.first : null}
          calls={calls} onCallDone={()=>setCalls(q=>q.slice(1))}
          onCallSkip={()=>{ setCalls(q=>q.slice(1)); if(sess.current && sess.current.nudge) sess.current.nudge(); }}
          pad={pad} hand={handRowEl} ask={askOn ? askEl : null} target={targetEl} boardCell={myBoardCell}
          onZoom={setZoom} menuItems={menuItems} extra={extra}
          thinking={!over && (g.priority === 1 - mySeat || !!(g.prompt && g.prompt.side === 1 - mySeat) || !!theirPay)}/>
        {hubEl}
        {overlaysEl}
      </div>);
  }

  return (
    <div className="board">
      <div className="screennav">
        <button onClick={onExit} style={{flex:.7}}>✕ leave</button>
        <button className={sheet==="opp"?"on":""} onClick={()=>flip("opp")}><span className="navtx">▲ {foeH?heroShort(foeH):"Opp"}</span></button>
        <button className={sheet?"":"on"} onClick={()=>setSheet(null)}>Chain</button>
        <button className={sheet==="you"?"on":""} onClick={()=>flip("you")}>You ▼</button>
        <SoundBtn/>
      </div>
      <StageHud me={me} them={them} turn={g.turn} myTurn={g.turnPlayer === mySeat}/>

      <div className="tablewrap">
        {/* ---- SHEET: their board (v7.15; a flick screen until then) ---- */}
        <div className={"vscreen side"+(sheet==="opp"?" open":"")} data-sheet="opp" ref={oppRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>{them.name} · seat {1-mySeat}{srvRank.ranked ? " · ranked" : ""}</span><span>swipe → graveyard</span></div>
              <div className="midrow">
                <ArmorGrid gear={armorOf(them)} own={false} cell={gearTile(false)}/>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{them.arsenal
                    ? ((DawnView.isPh(them.arsenal) || !them.arsenal._faceUp)
                        /* face down: a two-phone view holds a placeholder, never the card;
                           the AI table holds the card and does not show it */
                        ? <div className="dcardph" title="face-down arsenal"/>
                        : <button style={{padding:0,width:"100%"}} onClick={()=>setZoom(them.arsenal)}>
                            <CardFrame card={them.arsenal} className="sm"/></button>)
                    : "arsenal —"}</div>
                  <span className="zlbl">holds {them.hand.length} · blocks from hand</span>
                </div>
                <DeckPitchCol deck={them.deck} pitch={them.pitch} title="Pitch"/>
              </div>
              <div className="heror">
                <div className={"wslot clip-sm"+(foeHands[0]?" filled":"")}>
                  {foeHands[0] ? gearTile(false)(foeHands[0]) : <span className="wempty">weapon —</span>}
                </div>
                <div className="heromid clip-sm">
                  {foeH ? <div className="hport2"><HeroArt h={foeH} db={db}/></div> : null}
                  <span className="hname">{them.name}</span>
                  {srvNames[1-mySeat] && <span className="pname" data-pname="foe" title={srvNames[1-mySeat]}>{srvNames[1-mySeat]}{srvRank.ranked && srvRank.ratings[1-mySeat]!=null && <span className="prate"> {srvRank.ratings[1-mySeat]}</span>}</span>}
                  <LifeNum n={them.hp} className="hlife2"/>
                  <span className="hlbl">{g.turnPlayer===1-mySeat ? "their turn" : "life"}</span>
                </div>
                <div className={"wslot clip-sm"+(foeHands[1]?" filled":"")}>
                  {foeHands[1] ? gearTile(false)(foeHands[1]) : <span className="wempty">weapon —</span>}
                </div>
              </div>
              <div className="vfillsp"/>
              <div style={{marginTop:8}}>
                <InPlayRow entries={them.board||[]} empty={"nothing yet — "+them.name+"'s auras, items and allies land here"}
                  cell={b=>(
                    <button key={b.uid} className="b clip-sm" style={{width:52,flex:"none"}} onClick={()=>setZoom(b.card)}>
                      <CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/>
                      {b.kind==="ally" && b.life!=null && <span className="sw">♥ {b.life}</span>}
