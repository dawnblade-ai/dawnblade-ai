  const tokRef = uR(0);
  const tokSeq = () => ++tokRef.current;
  const oppRef=uR(null), chainRef=uR(null), youRef=uR(null), midRef=uR(null);
  const jump = r => r.current && r.current.scrollIntoView({behavior:"smooth",block:"start"});
  uE(()=>{ if(midRef.current) midRef.current.scrollLeft = midRef.current.clientWidth; },[]);
  const built = uM(()=>{
    /* ONE COUNTER AND ONE STREAM, SHARED BY BOTH SEATS.

       The uid counter is passed into every buildSide call rather than
       being a local, so the two seats can never mint the same uid — see
       buildSide's header for why that would be CARD-IN-TWO-ZONES rather
       than a cosmetic clash.

       The rng is threaded seat 0 -> seat 1 -> Battle in that fixed
       order. Two peers dealing from the same table code walk the stream
       identically, which is the whole reason engine/rng.js exists. */
    const ctr = {n:0};
    let rng = rngMake((cfg && cfg.seed != null) ? cfg.seed : Date.now());
    const _s0 = buildSide(h, PARSED[h.k], db, cfg||{}, rng, ctr);
    rng = _s0.rng;

    /* THE RUNECHANT TOKEN IS SHARED, NOT PER-SIDE. It is one printed card
       read out of the database; which hero conjures it is decided at the
       point of minting, not here. Built from the database record so
       nothing about it is invented — the board renders board entries with
       CardFrame, which is what puts real token art on the table instead
       of the text "Runechant x2". `runeApprox` still reports when the
       token is missing from the pool, in which case damage falls back
       to 1. */
    const runeTok = (db.byName["runechant"]||[])[0];
    const runeDmg = runeTok && (clean(runeTok.tx).toLowerCase().match(/deal (\d+) arcane damage/)||[])[1];
    const runeCard = runeTok ? {
      name:"Runechant", pitch:0, cost:null, power:null, def:null,
      tt:runeTok.tt || "Runeblade Token - Aura", kw:runeTok.kw || [], tx:runeTok.tx || "",
      img:runeTok.pr ? runeTok.pr._first : null,
      dbImg:runeTok.pr ? runeTok.pr._first : null,
      _token:true
    } : null;

    /* SEAT 1 IS A HERO NOW, when one was chosen (v2.41).

       ROADMAP-OPPONENT.md Phase 1. The roadmap's standing warning — "do
       not give it a real deck until the opponent can actually resolve the
       cards in that deck" — is about *playing* cards, and this seat still
       plays none. It blocks, and blocking with printed defence works for
       any card in the game without the parser reading a word of it. So a
       real hero here is strictly more honest than the dummy: real life
       total, real intellect, real equipment, real defence values.

       The dummy stays selectable and is still the default. It is the
       regression harness for every phase above this one, and its vanilla
       pile is the one deck where nothing at all can be faked. */
    let s1, dGear = null, dDeck = null;
    if(oppH){
      /* THE OPPONENT EQUIPS A LEGAL LOADOUT, not its whole gear pool.
         Passing `{}` here handed Azalea all EIGHT printed pieces — two
         helms, a spare weapon, the lot — where the slot rules allow about
         five. That is not cosmetic: `dummyDefence` raises one piece per
         attack and `chainBlocked` only stops a piece re-blocking the SAME
         chain, so every extra piece is another free block later in the
         turn. Strictly stronger than printed, which is the direction that
         steals games (see `npm run fairness`).

         `buildSideDefault` is that one set of slot rules: it equips a hero
         to a legal default loadout and builds it, with no seat argument
         and no branch for "the opponent". The loadout screen reaches the
         same `defaultPicks` for your own iron. */
      const _s1 = buildSideDefault(oppH, PARSED[oppH.k], db, rng, ctr);
      rng = _s1.rng;
      s1 = _s1.b;
    } else {
      dGear = DUMMY_GEAR.map(nm=>({...resolveEntry(db,{name:nm,p:0,code:null,q:1}),uid:++ctr.n,used:false}));
      const _dd = rngShuffle(rng, DUMMY_DECK.reduce((acc,[nm,p,q])=>{
        for(let i=0;i<q;i++) acc.push({...resolveEntry(db,{name:nm,p,code:null,q:1}),uid:++ctr.n});
        return acc;
      },[]).filter(c=>c.resolved));
      rng = _dd.rng;
      dDeck = _dd.arr;
      s1 = DUMMY_BUILD(dDeck, dGear);
    }

    /* `myHP`/`myInt` keep their names: they are seat 0's, they are read at
       a dozen call sites, and renaming them is a separate pass from
       giving seat 1 a build.

       `both` IS THE LEDGER THAT MATTERS. Seat 0's build is also spread at
       the top level, because the UI renders seat 0 by definition and
       `built.HPOW` reads better than `built.both[0].HPOW` at a hero-portrait
       call site. The RULES must not read it that way — they go through
       `bAct`/`bFoe` below, which is the same actor-vs-perspective split
       v2.24 made for zones, one layer up. */
    return {..._s0.b, both:[_s0.b, s1], dGear, dDeck, myHP:_s0.b.hp, myInt:_s0.b.int,
      runeDmg:runeDmg?+runeDmg:1, runeApprox:!runeTok, runeCard,
      /* the stream AFTER both opening shuffles — Battle continues it */
      rng};
  },[h,oppH,db]);

  /* THE HERO PASSIVES ARE ACTOR-RELATIVE, NOT SEAT-0'S (v2.41).

     `built.viseraiPassive` silently meant *the player's* Viserai — the
     exact seat-0-means-the-actor confusion the actor/perspective split
     fixed for zones in v2.24. These are its one-layer-up counterpart, so
     they read the same way: `bAct(s)` is the build of whoever is
     resolving. Every rules site uses it; only the UI may reach `built.*`
     directly.

     There is deliberately no `bFoe` yet. Nothing needs one — a passive
     fires for its own hero — and a dead helper sitting next to a live one
     is how `sides.js`'s seat-hardcoded `you`/`foe` came to be deleted in
     v2.24. Add it when a rule actually asks about the other hero. */
  const bOf  = i => built.both[i];
  const bAct = s => built.both[actorOf(s)];
  /* THE FIRST RULE THAT ASKS ABOUT THE OTHER HERO'S BUILD (v2.56), which is
     the condition CLAUDE.md set for this helper existing at all. CLASH
     compares the power of the top card of BOTH decks, and a hero's static
     buff applies to its OWN cards: Kayo's "attack action cards you own get
     +1{p} while they are in any zone other than the combat chain" covers
     the top of his deck, so his 6 reveals as a 7 — against an opponent
     whose card is read with the opponent's own build. One shared helper
     would silently apply the revealer's buff to both cards. */
  const bFoe = s => built.both[1-actorOf(s)];

  /* L is declared ahead of the state so the opening-swing initializer below
     can reach it — it is a pure (state, message) function with no dependency
     on `g`, so hoisting it costs nothing. */
  /* The on-screen strip keeps the last LOG_KEEP lines; `feed` keeps the whole
     game and is what the Ticker and the JUDGE!! report read. Four was too few
     to see a whole end phase go by now that each CR step announces itself. */
  const LOG_KEEP = 8;
  const L = (s,msg)=>({...s, log:[msg, ...s.log].slice(0,LOG_KEEP), feed:[...(s.feed||[]), msg]});
  const [g,setGRaw] = uS(()=>{
   /* named `initial` rather than `base` so the drill that scans this literal
      out of the file has an unambiguous marker — engine/prompts.js mirrors a
      `const base = {` of its own into this file, higher up. */
   const initial = {
    turn:1, actor:0, rng:built.rng, mode:"act", bphase:"defend", pending:null, incoming:0,
    log:[foeFirst ? "It won the throw and took the first turn. Iron up." : `${FoeName} stirs. ${built.both[1].hp} to carve away — go.`],
    feed:["Tonight in the hall: "+h.n+" versus "+(oppH?oppH.n:"the Dummy")+".", built.read,
      foeFirst ? `${FoeName} won the throw and elected to swing first.` : "You won the seating and took the first turn.",
      foeFirst ? "It won the throw and took the first turn. Iron up." : `${FoeName} stirs. ${built.both[1].hp} to carve away — go.`],
    /* BOTH SEATS ARE WHOLE HEROES NOW. Every zone, every counter, every
       per-turn status lives on its own side — nothing about the player is
       privileged and nothing about the dummy is a stub. The dummy's
       resources, action point, arsenal, pitch, banish, soul and hist sit at
       their defaults because it pays no costs and takes no action phase
       yet; inert-but-present is the point, and it is what lets a second
       human occupy slot 1 without a single new field. */
    sides:[makeSide({
      id:0, name:"You", hp:built.myHP, maxHp:built.myHP, int:built.myInt,
      deck:built.deck.slice(built.myInt), hand:built.deck.slice(0,built.myInt),
      gear:built.gear, board:built.startItem?[built.startItem]:[]
    }), makeSide({
      /* SEAT 1 IS BUILT FROM ITS OWN BUILD, not from constants. `int` in
         particular: the opponent draws to ITS hero's intellect, which is
         where DUMMY_INT stops being a number the trainer knows and starts
         being a property of whoever is sitting there. newTurn's refill
         reads the same field — see the landmine note there. */
      id:1, name: oppH ? oppH.n : "The Dummy",
      hp:built.both[1].hp, maxHp:built.both[1].hp, int:built.both[1].int,
      deck:built.both[1].deck.slice(built.both[1].int),
      hand:built.both[1].deck.slice(0,built.both[1].int),
      gear:built.both[1].gear,
      board:built.both[1].startItem?[built.both[1].startItem]:[]
    })],
    prompt:null, promptQ:[], revealed:null, lastRoll:null,
    boostOn:true, chainOpen:false, featured:null, boostChain:0, stack:[], pend:null, chain:[], chainHist:[], hitSeq:0, lastDmg:0, flags:{}, over:null, inspect:false,
    /* set only when the opponent won the seating: its opening swing happens
       before your first action phase, so the clock has not started yet */
    _opening:foeFirst
   };
   /* THE OPENING SWING CANNOT HAPPEN HERE ANY MORE (v2.63), and the reason
      is the temporal dead zone. `foeSwing` is a hoisted function
      declaration, so CALLING it from this initializer always worked — but
      what it does changed: with a real hero in seat 1 it now plays a real
      card, which reaches for `gy` and `_EFX`, both `const`s declared
      further down the component. During the first render those are still
      in their TDZ, so the call threw `gy is not a function` and took the
      whole match with it. Exactly the shape of the v2.54 clash crash: a
      hoisted-looking name that is not yet initialised.

      So the opening swing moved to a mount effect below. The cost is one
      frame in the action phase before the block step appears, which is
      what this initializer used to avoid — a visible flicker is a fair
      trade for a match that starts. */
   return withPriority(initial);
  });
  /* ---- THE GUARD RAILS -------------------------------------------------
     Every state change in this component funnels through setG, which makes
     it the one place worth auditing. engine/invariants.js reads the state
     and reports anything the rules of Flesh and Blood do not permit — a
     card in two zones at once, a per-side field written to the game object,
     a defending card re-declared on a second chain link (CR 7.3.2b).

     Every bug this cycle was found by eye or in play, never by a red test:
     crumbling auras that came back, defenders never cleared, a pitch
     selection carried into the next payment. All of them were states the
     judge would have named instantly.

     It never throws. A violation must not cost a player their game, so it
     logs, records, and raises a badge; the sim keeps running. Read the
     details in the console or via window.__dawnJudge. */
  const judgeRef = uR([]);
  const [judgeN, setJudgeN] = uS(0);

  /* ---- THE PRIORITY MACHINE, IN SHADOW (v2.27) -------------------------
     ROADMAP-MULTIPLAYER.md Phase A step 4. This is the step that changes
     CONTROL FLOW rather than field names, so it lands in two moves rather
     than one. This is the first: the machine's state is DERIVED from the
     trainer's gates on every state change and carried alongside them. It
     drives nothing yet — `mode`/`bphase` are still the source of truth.

     Why that is worth doing on its own:

       1. Those fields did not exist, and every invariant that reads them
          guards with `!= null` — so BAD-PHASE, BAD-STEP, BAD-PRIORITY and
          PRIORITY-IN-CLOSED-PHASE have been DORMANT since v2.21. Deriving
          them turns four advertised guards on for the first time.
       2. It proves the mapping from mode/bphase to phase/step/priority is
          total and correct BEFORE anything depends on it. Every bug this
          cycle was found by eye rather than by a red test; this is the one
          change where that would be most expensive.

     The MAPPING itself lives in engine/priority.js as `fromTrainer` — it
     is pure, it is a statement about priority, and in here no drill could
     reach it. This is only the merge.

     Declared as a hoisted FUNCTION, not a const arrow, for the same reason
     `foeSwing` is: the useState initializer that builds `initial` runs
     before this point in the source and has to be able to call it. */
  function withPriority(n){
    try {
      const p = DawnPriority.fromTrainer(n, foeFirst);
      const out = {...n};
      for(const k of DawnPriority.PRI_FIELDS) out[k] = p[k];
      return out;
    } catch(e){ return n; }   /* a shadow must never break a real game */
  }

  const setG = updater => setGRaw(s => {
    const n = withPriority(typeof updater === "function" ? updater(s) : updater);
    try {
      const bad = DawnInvariants.errors(n);
      if(bad.length){
        const seen = judgeRef.current;
        for(const v of bad){
          /* one entry per distinct violation, not per render */
          if(seen.some(x => x.code === v.code && x.msg === v.msg)) continue;
          seen.push({turn:n.turn, mode:n.mode, code:v.code, msg:v.msg});
          console.error("[dawnblade judge] " + v.code + " — " + v.msg);
        }
        if(typeof window !== "undefined") window.__dawnJudge = seen;
        setJudgeN(seen.length);
      }
    } catch(e){ /* the judge must never be the thing that breaks play */ }
    return n;
  });
  const [zoom,setZoom]=uS(null);
  /* the JUDGE!! bug-report sheet: null when closed */
  const [bug,setBug]=uS(null);
  /* uid of the card being peeked in the hand rail — see handCell */
  const [peek,setPeek]=uS(null);

  /* ---- JUDGE!! ---------------------------------------------------------
     A bug report written at the table, on the phone, in the moment — which
     is where the bugs actually surface. Every fix this cycle came from
     playing and noticing, so the expensive part was never the noticing, it
     was reconstructing the board afterwards from a screenshot.

     So the report captures the board itself. The note can just be "this
     looked wrong": the zones, counters, chain, prompt, the whole feed and
     any invariant violations travel with it. Card lists are names + uids,
     not the resolved records, so a report stays readable and small. */
  /* JUDGE!! — the report itself now lives in engine/report.js, so the
     TABLE can produce one too and so a drill can reach it. What stays
     here is the CONTEXT the state does not know about itself. */
  const judgeCtx = note => [g, {
    note, source:"trainer", appVer:window.APP_VER, dataVer:window.DATA_VER,
    hero:h.k, heroName:h.n, seating:foeFirst?"opponent first":"you first",
    mySeat:0, invariantsSeen:judgeRef.current
  }];
  /* RULING 2026-07-25: "cards in grave will have to have a 'turn added to
     grave' characteristic". Stamp it on the way in, and every "discarded a
     card with 6 or more {p} this turn" question becomes answerable — for
     either player, which is what multiplayer will need. Reincarnate also
     rides on this path: discarded at random, it bottoms the deck instead. */
  /* Ephemeral, straight off Crouching Tiger's own reminder text: "If it would
     be put into a graveyard from anywhere, instead it ceases to exist." Every
     path into the graveyard goes through here, so this is the place to drop it. */
  const gy = (turn, ...cards) => cards
    .filter(c => !(c && (c.kw||[]).some(k=>/ephemeral/i.test(k))))
    .map(c=>({...c, _gy:turn}));
  /* A DISCARD IS A DIFFERENT EVENT FROM "REACHED THE GRAVEYARD", and only
     this path stamps it. Cards arrive in the graveyard by being played, by
     blocking and by being discarded; the printed text of Kayo's engine asks
     about the last one only. Without the distinction, an attack — which is
     put into the graveyard at DECLARATION — satisfied every "you've
     discarded a card with 6 or more {p} this turn" check by itself. */
  const gyDisc = (turn, ...cards) => gy(turn, ...cards).map(c=>({...c, _disc:true}));
  /* "you've DISCARDED a card with 6 or more {p} this turn" — a discard, not
     a graveyard census. `_disc` is stamped only by an actual discard, which
     matters because an attack card reaches the graveyard AT DECLARATION:
     counting the whole graveyard let any 6-power attack you had already
     played satisfy the condition, and a 6-power attack satisfied it for
     itself. `act`, not `you` — this is a rules question, so it belongs to
     whoever is resolving (v2.24). `pow6` carries Kayo's clause 2. */
  const had6ThisTurn = st => (act(st).grave||[]).some(c=>c._gy===st.turn && c._disc && pow6(c, bAct(st)));
  /* ---- runechants are AURAS on the board ------------------------------
     Not a counter. The printed token is a "Runeblade Token - Aura", and
     seven pool cards ask about auras generically ("3 or more auras",
     "destroy an aura you control", "whenever you play an aura") — none of
     which could ever see an integer. Minting them as real board entries
     also means the board's own CardFrame renders the actual token art
     instead of the text chip that used to read "Runechant ×2".
     `hist.made` / `hist.aura` still tick, because "played or created an
     aura this turn" reads them. */
  const mkRune = (s, count) => {
    if(!(count > 0)) return s;
    /* addRunechants namespaces the uid itself ("rune"+seq), because a raw
       counter collides with the loadout's card numbering — the first
       runechant minted took uid 1 and shared it with a deck card, and the
       invariant judge caught it in play as CARD-IN-TWO-ZONES. */
    /* THE ACTOR mints them, not seat 0. A runechant belongs to whoever
       played the Runeblade card that conjured it, and the `made`/`aura`
       history is that player's too — both were hardcoded to seat 0, the
       same bug class as popRunechants(n, 0, …). */
    let n = built.runeCard ? addRunechants(s, actorOf(s), count, built.runeCard, tokSeq) : s;
    const h = actMut(n);
    h.hist = {...h.hist, made:(h.hist.made||0)+count, aura:(h.hist.aura||0)+count};
    return n;
  };
  const winCheck = s => {
    let n = s;
    if(opp(n).hp<=15 && opp(n).hp>0 && !n.flags.d15) n = L({...n, flags:{...n.flags, d15:true}}, `${foe(n).name} is wobbling — you can smell the sawdust.`);
    if(opp(n).hp<=0 && !n.over) n = L({...n, over:{win:true, score:n.turn+you(n).wasted}}, `${foe(n).name} down on turn ${n.turn}. Score ${n.turn+you(n).wasted} (turns + wasted).`);
    return n;
  };

  /* ---- prompts ---------------------------------------------------------
     Several rulings ask for the same thing: stop and let the player choose,
     with the hand still visible. Effects queue a prompt (they never open one
     inline — the action must finish resolving first), and openPrompt turns
     the head of the queue into a live sheet. One component, many flows. */
  /* Effects QUEUE prompt specs (they must never open one inline — the
     action has to finish resolving first), and openPrompt drains the head
     of the queue into a live sheet. buildPrompt returns null when there is
     nothing to ask, which is how a prompt skips itself rather than showing
     an empty sheet. A spec carries `avail` for pay prompts because
     resources have not migrated onto sides[] yet. */
  function openPrompt(s){
    const q = s.promptQ || [];
    if(!q.length) return {...s, prompt:null, promptQ:[]};
    const [p, ...rest] = q;
    const spec = p.tag === "pay" && p.avail == null ? {...p, avail:you(s).res} : p;
    const live = buildPrompt(s, spec);
    if(!live) return openPrompt({...s, promptQ:rest});
    return {...s, promptQ:rest, prompt:live};
  }
  const promptToggle = i => setG(s=> s.prompt ? {...s, prompt:promptToggleSel(s.prompt, i)} : s);
  const promptPick = choice => setG(s=> s.prompt ? {...s, prompt:promptChoose(s.prompt, choice)} : s);
  const promptConfirm = () => setG(s=>{
    const p = s.prompt;
    if(!p || !promptReady(p)) return s;
    const r = applyPrompt({...s, prompt:null}, p);
    let n = r.game;
    n.prompt = null;
    r.msgs.forEach(m => { n = L(n, m); });
    if(r.pay > 0){ const ps = youMut(n); ps.res = Math.max(0, ps.res - r.pay); }
    if(r.ops && r.ops.length) n = runOps(n, r.ops, p.src || "prompt");
    /* ARSENAL, FACE UP (v2.33). A card put face UP into the arsenal is a
       different event from the end-of-turn arsenal step, which sets face
       DOWN — Azalea's arrows trigger on the face-up one only. The flag
       rides on the card itself, the way a minted card carries _playTurn,
       so no new side field is needed.

       The arrow's own payload is stamped ONTO the card rather than run
       now: "+2{p} this turn" and "go again this turn" have to survive
       until the arrow is actually played, which may be later the same
       turn. `opt` is a real effect and runs immediately. */
    if(p.tag === "pick" && p.to === "arsenal"){
      const put = act(n).arsenal;
      if(put && !put._faceUp){
        const pfx = fxParse(put);
        const up = {...put, _faceUp:true, _upTurn:n.turn};
        for(const op of (pfx.arsenalUp||[])){
          if(op[0] === "self"){ up._arsPow = (up._arsPow||0) + op[1];
            n = L(n, `${put.name} goes face up — +${op[1]} power this turn.`); }
          else if(op[0] === "ga"){ up._arsGA = true;
            n = L(n, `${put.name} goes face up — it will go again this turn.`); }
          else n = runOps(n, [op], put.name);
        }
        /* THE SOURCE'S OWN STAMP, on top of the arrow's trigger (v2.34).
           Bull's Eye Bracers prints "It gains +1{p} until end of turn", where
           "it" is the arrow that was just put. That is a SECOND stamp, and it
           stacks with the arrow's own: an arrow set with the Bracers gets
           both. "Until end of turn" and "this turn" are the same duration, so
           both ride on _upTurn and expire together if the arrow is not
           played. The parser holds this back from fx.self precisely so it
           lands on the arrow instead of on the equipment. */
        for(const op of (p.arsStamp||[])){
          if(op[0] === "self"){ up._arsPow = (up._arsPow||0) + op[1];
            n = L(n, `${p.src}: ${put.name} also gains +${op[1]} power this turn.`); }
        }
        actMut(n).arsenal = up;
        if(!(pfx.arsenalUp||[]).length && !(p.arsStamp||[]).length)
          n = L(n, `${put.name} set face up in arsenal.`);
      }
    }
    return openPrompt(winCheck(n));
  });
  /* Declining is a real choice for optional prompts, not a cancel. */
  const promptDecline = () => setG(s=>{
    const p = s.prompt; if(!p) return s;
    if(p.tag === "pay") return {...s, prompt:promptChoose(p, "decline")};
    if(p.tag === "pick" && p.optional) return {...s, prompt:{...p, sel:[]}};
    return s;
  });

  /* ---- the dummy's defence -------------------------------------------
     It wears iron and now holds cards, so it defends the way an opponent
     does: printed defence only, declared free and simultaneously (CR),
     equipment first and then cards from hand. It ignores chip damage the
     way a real player conserves cards, and spends from hand only while
     the swing still threatens. Dominate genuinely restricts it to one
     card now, and intimidate genuinely costs it an option. */
  const dummyDefence = (s, total, card) => {
    let n = {...s};
    const links = [];
    let soak = 0;
    const cfx = fxParse(card);
    /* RULING (Out Pace): "This can't be defended by equipment" — restrict the
       declare step, not the damage maths. RULING (Under Loop's side note): an
       equipment already used as a defender this chain can't block again until
       the chain breaks, so skip anything that has blocked on this chain. */
    const usedThisChain = new Set((opp(n).chainBlocked||[]));
    const gi = cfx.noEquipDefend ? -1
      : opp(n).gear.findIndex(x=>gearDef(x)>0 && !usedThisChain.has(x.uid));
    if(cfx.noEquipDefend) n = L(n, `${card.name} can't be defended by equipment — the iron stays down.`);
    if(total>=4 && gi>=0){
      links.push({k:"def", label:`${opp(n).name}: ${opp(n).gear[gi].name} — defend ${gearDef(opp(n).gear[gi])}`, gi});
      soak += gearDef(opp(n).gear[gi]);
    }
    /* DOMINATE MUST BE ACTIVE, NOT MERELY MENTIONED. `hasKw` matches the raw
       text as well as card_keywords, so Pulping — "IF a card with 6 or more
       {p} is discarded this way, this gets dominate" — held the defender to
       one card on every swing, its printed gate pure decoration. That is
       v2.31's lesson, which was applied to fx.ga and never to hasKw.
       `hasKwNow` drops a keyword the text only grants under an if/unless;
       `_kwGrant` is how the clause hands it over when the gate DOES fire. */
    const dominating = hasKwNow(card,"dominate") || (n._kwGrant||[]).indexOf("dominate")>=0;
    const cap = dominating ? 1 : 2;
    const pick = opp(n).hand.map((c,i)=>({c,i})).filter(x=>(x.c.def||0)>0)
      .sort((a,b)=>((b.c.def||0)-(a.c.def||0)) || ((a.c.power||0)-(b.c.power||0)));
    const chosen = [];
    for(const x of pick){
      if(chosen.length>=cap || total-soak<=0) break;
      chosen.push(x); soak += (x.c.def||0);
    }
    chosen.forEach(x=>links.push({k:"def", label:`${opp(n).name}: ${x.c.name} — defend ${x.c.def}`, uid:x.c.uid}));

  };

  /* THE CARD SEMANTICS LIVE IN engine/effects.js (v2.53). `runOps` was

     it was byte-identical at the commit that moved it, verified before
     this call site replaced it.
     What test/effects.test.js pins from here on is the SEAM, which is
     the part that can rot: `makeEffects` throws on a missing context
     key rather than capturing a global silently, and the object literal
     below must name exactly DawnEffects.CTX_KEYS — so adding a

     instead of failing on a card nobody plays for a month.

  const _EFX = DawnEffects.makeEffects({L, act, actMut, actorOf, bAct, bFoe, built, db, dummyDefence, foe, foeMut,

  const playRx = i => setG(s=>{

       This used to hand-roll it as `inAtk = s.mode==="stack"`, and that test
       cannot express the rule it is standing in for: the reaction split
       follows the ATTACKER, not the seat number. With one acting side those
       coincide, so the hand-rolled version was right by accident. It is
       behaviour-identical today and correct the moment seat 1 attacks.

       `withPriority` has merged phase/step/priority/attacker into every state
       that passes through setG since v2.27, so this reads real fields rather
       than deriving anything here. */
    const win = DawnPriority.speedAllowed(s, 0);

    if(!inAtk && !inDef){

         priority action, so the defend step allows no plays at all. Naming it
         is the difference between a refusal and a dead tap. */
      if(s.step === "defend") return L(s, "Declare defenders first, then move to reactions.");
      return s;
    }
    const c = act(s).hand[i]; if(!c) return s;
    const fx = fxParse(c);

       attacking player may play attack reactions, the defending player
       defense reactions, and neither may play the other's. `speedAllowed`
       has already split them by attacker; `rxAllowed` answers the card half
       of the same question, so no site here restates it.

       The attack window used to also admit `!isAttack(c) && fx.self>0` — any
       non-attack card carrying a pump. That let three plain ACTION cards
       (Flying High, Hit and Run, Cutty Shark) be played in the reaction step,
       where no action card is legal. */
    const rxWin = inAtk ? "attack-reaction" : "defense-reaction";
    if(!rxAllowed(c, rxWin)){

      return L(s, `${c.name} isn't a reaction or an instant — it can't be played in the reaction step.`);

    if(act(s).res < cost) return L(s, `${c.name} costs ${cost} — float resources before the window opens.`);

    const rxSide = actMut(n);
    rxSide.res = act(s).res - cost;
    rxSide.hand = act(s).hand.filter((_,x)=>x!==i);
    rxSide.grave = [...gy(s.turn, c),...act(s).grave];
    if(inAtk){

         nothing. Reprise is the live case: the dummy blocks from hand now, so
         "defended with a card from their hand this chain link" is a real
         count of the non-equipment defenders already declared on the stack. */
      let condPump = 0;
      (fx.conds||[]).forEach(({cond,op})=>{
        if(cond==="reprise"){
          const fromHand = n.stack.filter(l=>l.k==="def" && l.gi==null).length;

          if(op[0]==="self") condPump += op[1];
          else n = runOps(n,[op],c.name);

        if(cond==="charged"){
          if(!(act(n).hist.charged>0)){ n = L(n, `${c.name}: you haven't charged your hero's soul this turn.`); return; }
          if(op[0]==="self") condPump += op[1];
          else n = runOps(n,[op],c.name);

      const pump = (fx.self||0) + condPump + fx.ops.filter(o=>o[0]==="buffNext").reduce((a,o)=>a+o[1],0);
      n = runOps(n, fx.ops.filter(o=>o[0]!=="buffNext"), c.name);
      n.stack = [...n.stack, {k:"rx", label:`${c.name} — +${pump}`, pump}];

    const dbuff = fx.ops.filter(o=>o[0]==="defBuff").reduce((a,o)=>a+o[1],0);
    const dv = (c.def||0) + dbuff;
    n = runOps(n, fx.ops.filter(o=>o[0]!=="defBuff"), c.name);
    actMut(n).blockRx = [...act(n).blockRx, {label:`${c.name} — defend ${dv}`, def:dv}];
    return L(n, `${c.name} played at instant speed — +${dv} defense.`);
  });
  const playRxA = () => setG(s=>{
    if(s.mode!=="block" || s.bphase!=="react" || !act(s).arsenal) return s;

      : `${c.name} isn't a defense reaction or an instant.`);
    const cost = c.cost||0;
    if(act(s).res < cost) return L(s, `${c.name} costs ${cost} — not enough floating.`);

    const rxaSide = actMut(n);
    rxaSide.res = act(s).res - cost;
    rxaSide.arsenal = null;
    rxaSide.grave = [...gy(s.turn, c),...act(s).grave];
    n = runOps(n, fx.ops.filter(o=>o[0]!=="defBuff"), c.name);
    actMut(n).blockRx = [...act(n).blockRx, {label:`${c.name} (arsenal) — defend ${dv}`, def:dv}];

  });
  const playArsenalInstant = () => setG(s=>{
    if(s.mode!=="block" || s.bphase!=="react" || !act(s).arsenal || !bAct(s).arsenalInstant) return s;
    const c = act(s).arsenal; const fx = fxParse(c);
    if(isAttack(c)) return L(s, `${c.name} is an attack — her ability frees blue non-attacks only.`);

    const cost = c.cost||0;

      const idx = act(n).hand.map((h,i)=>({i,v:advValue(h,n,{runeDmg:built.runeDmg})})).sort((a,b)=>a.v-b.v)[0].i;
      const p = act(n).hand[idx];

    arsRxSide.res = prevRes - cost;

    n = runOps(n, fx.ops, c.name);

  /* resolveStack lives in engine/effects.js (v2.62) — the last of the

     needed its React wrapper peeled off: the BODY was already a pure
     s => s', and that body is what moved, unchanged. */
  const resolveStack = () => setG(_EFX.resolveStack);
  const maybeBoost = (s,card,from,idx) => (s.boostOn!==false && isAttack(card) && hasKw(card,"boost") && act(s).deck.length>0)
    ? {...s, mode:"boostpick", pending:{card,from,idx}}
    : execute({...s,_doBoost:false},card,from,idx);
  const confirmBoost = (doBoost) => setG(s=>{ if(s.mode!=="boostpick"||!s.pending) return s; const {card,from,idx}=s.pending; return execute({...s,mode:"act",pending:null,_doBoost:doBoost},card,from,idx); });
  const tryPlay = (card,from,idx) => setG(s=>{
    if(s.over||s.mode==="block"||s.mode==="arsenal"||s.mode==="stack"||s.mode==="boostpick"||s.mode==="defpay") return s;
    if(s.inspect){ setZoom(card); return s; }
    if(s.mode==="pay"){
      if(from!=="hand" || (s.pending&&s.pending.from==="hand"&&s.pending.idx===idx)) return s;

      const n = {...s}; actMut(n).paySel = sel; return n;

       player who controls the attack during the Reaction Step of combat";
       CR 8.1.3a says the same for a defense reaction and the player whose
       hero is the attack-target. tryPlay is only ever reached in the action
       phase (block/stack return above), which is neither, so the card is
       refused here and told which window it belongs to. 23 pool cards used
       to be playable straight out of the action phase — Reduce to Runechant
       minting a runechant on your own turn, the Warrior reprise reactions
       swinging with no attack to react to. playRx/playRxA are the legal
       doors, and they ask rxAllowed the same question. */
    if(isRx(card))

       and Crash and Bash print no cost, 4 defence and "When this defends,

       Read as an ordinary non-attack, a Block is a FREE 0-cost play that
       spends your action point and does nothing — sev-3 "illegal play
       allowed". `judge.js` has refused this since v2.47 via types.js; the
       trainer never did, and Kayo runs two copies. The STRUCTURED array is
       the authority (v2.44), so ask DawnTypes rather than the display
       string. */
    if(DawnTypes.isBlock(card))
      return L(s, `${card.name} is a Block — it has no play. Pitch it, or declare it as a defender.`);
    /* CR 8.1.6 — an instant "can be played/activated any time the player has

       The gate asks costsAP, the same question execute's arithmetic asks; two
       hand-rolled answers to one rule is how they drift apart. */
    if(costsAP(card) && act(s).ap<1) return L(s,"No action point left — end your turn.");

       all. Bear Hug reads the pitch zone; Run Roughshod reads the graveyard
       for a 6+ power card stamped with this turn. Refuse and say why. */
    {
      const afx = fxParse(card);
      if(afx.activateIf){
        const g2 = afx.activateIf;
        const ok = g2.kind==="atkNamed"  ? (act(s).hist.atkNames||[]).includes(norm(g2.name||""))
                 : g2.kind==="hits"      ? (s.chain||[]).filter(l=>l.dmg>0).length >= g2.n
                 : g2.kind==="boosted"   ? (s.boostChain||0)>0
                 /* WHAT YOU CONTROL, for "only if you control a card with N
                    or more {p}" (Predatory Plating). RULING (user,
                    2026-08-08): the arena and your equipment, PLUS an attack
                    currently on the COMBAT CHAIN — which is what makes a
                    chest piece that pays you for committing to a big swing
                    actually reachable. Reading board+gear alone left Kayo
                    with nothing but Mandible Claw at 3, so the ability was
                    unactivatable in his deck and looked like a dead card.
                    `zonePow` is deliberately NOT used: a card on the chain
                    is in the one zone Kayo's clause 2 excludes, and gear and
                    arena permanents are not attack action cards at all.
                    LIMIT, stated: only the LIVE attack (`pend`) is counted,
                    not links that have already resolved. The trainer's chain
                    history keeps a name and an image, not the card object,
                    and widening it would put a full card on every link —
                    which is what the 16KB table-snapshot budget exists to
                    stop. The live attack is the window this is used in. */
                 : g2.kind==="controlPow"? [...act(s).board.map(b=>b.card), ...act(s).gear,
                     ...(s.pend&&s.pend.card?[s.pend.card]:[])]
                     .some(x=>x&&(x.power||0)>=g2.n)
                 : g2.kind==="defending" ? s.mode==="block"
                 : g2.kind==="foeTurn"   ? s.mode==="block"
                 : true;
        if(!ok) return L(s, `${card.name} can't be activated — ${g2.why}.`);
      }
      const pif = afx.playIf;
      if(pif){
        const ok = pif.kind==="pitch6"    ? act(s).pitch.some(c=>pow6(c, bAct(s)))
                 : pif.kind==="discard6"  ? had6ThisTurn(s)
                 : pif.kind==="soulYellow"? (act(s).soul||[]).some(c=>c.pitch===2)
                 : true;
        if(!ok) return L(s, `${card.name} can't be played — ${pif.why}.`);
      }
    }
    const fx = fxParse(card);
    if(from==="hand" && isAttack(card) && isArrow(card)) return L(s,"Arrows fire from the arsenal. Set it at end of turn.");
    if(from!=="weapon" && from!=="hero" && !isAttack(card) && !fx.playable) return L(s,`${card.name}: no scripted effect yet — pitch it, block with it, or ℹ to read it.`);
    if((from==="weapon"||from==="hero") && act(s).weaponUsed[card.uid]) return L(s, from==="hero" ? "Already used this turn." : `${card.name} already swung this turn.`);

      const avail = act(s).hand.length - (from==="hand" ? 1 : 0);
      if(avail < fx.addCost.discard) return L(s, `${card.name}: additional cost needs ${fx.addCost.discard} to discard — hand's too thin.`);

    if(from==="weapon" && card.needSteam && !((act(s).counters[card.uid]||{}).steam>0)) return L(s, `${card.name} needs a steam counter to fire — build steam first (tap its ⚡).`);
    const cost = effCost(card, act(s));
    if(act(s).res>=cost) return maybeBoost(s,card,from,idx);
    const pn = {...s, mode:"pay", pending:{card,from,idx}, log:[`Pitch ${cost-act(s).res} more for ${card.name}.`,...s.log].slice(0,LOG_KEEP)};
    actMut(pn).paySel = [];

  });
  const confirmPay = () => setG(s=>{
    if(!s.pending) return s;
    const gain = you(s).paySel.reduce((a,i)=>a+(you(s).hand[i].pitch||0),0);
    const need = effCost(s.pending.card, you(s))-you(s).res;
    if(gain<need) return L(s,`Selected pitch ${gain}, need ${need}.`);
    const pitched = you(s).paySel.map(i=>you(s).hand[i]);
    const keepIdx = you(s).hand.map((_,i)=>i).filter(i=>!you(s).paySel.includes(i));
    let pendIdx = s.pending.from==="hand" ? keepIdx.indexOf(s.pending.idx) : s.pending.idx;

    const paySide = youMut(n);
    paySide.res = you(s).res + gain;
    paySide.hand = keepIdx.map(i=>you(s).hand[i]);
    paySide.pitch = [...you(s).pitch,...pitched];

  /* THE ACTIVATED ABILITY OF A CARD IN THE ARENA (v2.35).

     did, so an item with "Action - Destroy this: …" was decoration. Built
     lazily rather than stamped on at play time so nothing new has to be
     carried through every board write, and keyed "bp"+uid so it cannot
     collide with gear's "gp"+uid. Allies keep allySwing for now — their

  const boardPow = b => {
    if(!b || !b.card || b.kind==="ally" || !b.card.tx) return null;
    const pw = parseHeroPower(b.card.tx, true);
    if(!pw) return null;
    return {name:b.card.name+" — ability", pitch:0, cost:pw.cost, power:null, def:null,
      tt:"Arena Ability", kw:pw.ga?["Go again"]:[], tx:pw.eff, sd:pw.sd,
      _instant:pw.kind==="instant", img:b.card.img, dbImg:b.card.dbImg,
      _gearArt:true, uid:"bp"+b.uid};

     (build.js) and arena permanents (boardPow) ever got a powCard, so
     "Instant - Discard this: …" on a card in hand was unreachable even
     though its effect parses perfectly.

       Agile Windup           Instant - Discard this: Create an Agility token
       Rally the Coast Guard  Once per Turn Instant - Discard a card:
                              This gets +3{d}   (+ "only while defending")

     the two-tap peek shows the ABILITY's text, which is what you are
     deciding about rather than the card it hangs on. Three more pool cards
     come online with it (Arcane Twining, Photon Splicing, Reaper's Call);
     nothing here is special-cased by name. */
  const handPow = c => {
    const ha = c && fxParse(c).handAbility;
    if(!ha) return null;
    return {name:c.name+" — ability", pitch:0, cost:0, power:null, def:null,
      tt:"Card Ability", kw:[], tx:ha.eff, _instant:true,
      img:c.img, dbImg:c.dbImg, _gearArt:true, uid:"ha"+c.uid, _forUid:c.uid};
  };

     the player holds priority in; Rally additionally prints "Activate this
     only while this card is defending", already read as fx.activateIf. */
  const handAbilityOK = (s, c) => {
    const fx = fxParse(c), ha = fx.handAbility;
    if(!ha || s.over) return false;
    if(["pay","arsenal","boostpick","defpay"].indexOf(s.mode) >= 0) return false;
    if(ha.oncePerTurn && (act(s).hist.handAb||{})[c.uid]) return false;
    if(fx.activateIf && fx.activateIf.kind==="defending" && act(s).blockH.indexOf(c.uid) < 0) return false;
    /* a cost you cannot pay is not an option — "discard a card" needs
       another card that is not itself committed to the block */

    const fx = fxParse(c), ha = fx.handAbility;
    if(!ha) return s;
    if(!handAbilityOK(s, c)) return L(s, `${c.name}: its ability can't be activated right now.`);
    let n = {...s};
    if(ha.oncePerTurn) actMut(n).hist = {...act(n).hist, handAb:{...(act(n).hist.handAb||{}), [c.uid]:1}};
    /* A DEFENCE BUFF IS NOT AN OP HERE. `finishBlock` reads a per-uid bonus
       map, which is how confirmDefPay already routes a +{d} onto a specific
       defender; runOps has no way to raise one. Same split the defence-
       reaction paths make. */
    const dbuff = ha.ops.filter(o=>o[0]==="defBuff").reduce((a,o)=>a+o[1],0);
    const rest  = ha.ops.filter(o=>o[0]!=="defBuff");
    let paid = [];
    if(ha.cost==="self"){
      paid = [c];
      actMut(n).hand = act(n).hand.filter(x=>x.uid!==c.uid);
      actMut(n).grave = [...gyDisc(n.turn, c), ...act(n).grave];
      n = L(n, `${c.name} is discarded to pay for its own ability.`);
    } else {
      /* "Discard a card" is the player's choice, and the trainer's standing
         approximation is to auto-pick the lowest advisor value rather than
         prompt (CLAUDE.md, known approximations). A card already declared
         as a defender is committed and is not available to spend. */
      const pool = act(n).hand.map((h,i)=>({h,i}))
        .filter(x=>x.h.uid!==c.uid && act(n).blockH.indexOf(x.h.uid)<0)
        .sort((a,b)=>advValue(a.h,n,{runeDmg:bAct(n).runeDmg})-advValue(b.h,n,{runeDmg:bAct(n).runeDmg}));
      if(!pool.length) return L(s, `${c.name}: nothing spare in hand to discard.`);
      const pick = pool[0].h;
      paid = [pick];
      actMut(n).hand = act(n).hand.filter(x=>x.uid!==pick.uid);
      actMut(n).grave = [...gyDisc(n.turn, pick), ...act(n).grave];
      n = L(n, `${c.name}: discarded ${pick.name} to activate.`);
    }
    if(dbuff){
      n.defBonus = {...(n.defBonus||{}), [c.uid]:((n.defBonus||{})[c.uid]||0)+dbuff};
      n = L(n, `${c.name} braces — +${dbuff} defence on the wall.`);
    }
    if(rest.length) n = runOps(n, rest, c.name);
    /* the cost was a DISCARD, so everything that watches a discard sees it —

                <div className="wslot clip-sm"><span className="wempty">weapon —</span></div>
              </div>
              <div className="vfillsp"/>
              <div style={{marginTop:8}}>
                <InPlayRow entries={opp(g).board||[]} chips={opp(g).marked?[["marked",""]]:[]}

                  cell={b=>(
                    <button key={b.uid} className="b clip-sm" style={{width:52,flex:"none"}} onClick={()=>setZoom(b.card)}>
                      <CardFrame card={b.card} className="sm"/>
                    </button>)}/>

            </div>
            <div className="hpane">
              <div className="paneflag"><span>Opponent graveyard / banish</span><span>swipe ← back</span></div>
              <div className="gyempty">{opp(g).name} has discarded nothing yet.</div>
            </div>
          </div>
        </div>

        {/* ---- SCREEN 2: chain command center ---- */}
        <div className="vscreen" ref={chainRef}>
          <div className="hscroll" ref={midRef}>
            {/* PANE 1 — LOG: scoreboard + Claude's call + live feed */}
            <div className="hpane logpane">
              <div className="paneflag">
                <span>log & advisor</span>
                {/* Bug reports from the phone, where the bugs actually show up.
                    Captures the whole board so the note can just be "this
                    looked wrong" — see engine/report.js. */}
                <button className="judgebtn" onClick={()=>setBug({note:"", saved:false})}>

                </button>
                <span>play →</span>
              </div>
              <div className="scorebar clip-sm">
                <span className="sside"><span className="hpme">{you(g).hp}</span> you · R<b>{you(g).res}</b> A<b>{you(g).ap}</b></span>
                <span className="sside r">{opp(g).name.split(",")[0].toLowerCase()} <span className="hpopp">{Math.max(0,opp(g).hp)}</span>{opp(g).frost>0?` · ❄${opp(g).frost}`:""}</span>
              </div>
              <div style={{marginTop:6}}><Ticker feed={g.feed}/></div>
              <Advisor g={g} ctx={{runeDmg:built.runeDmg, hpow:built.HPOW, boostOn:g.boostOn, dBlk:opp(g).gear.filter(x=>gearDef(x)>0).length + opp(g).hand.filter(c=>(c.def||0)>0).length, dDef:gearDef(opp(g).gear.find(x=>gearDef(x)>0)||{})||1}} read={built.read}/>
              <div className="gamelog" style={{marginTop:8}}>{[...g.feed].reverse().map((l,i)=><div key={i} className="gl">{l}</div>)}</div>
            </div>
            {/* PANE 2 — PLAY: dummy hand · stack|card|defend · your hand+extras */}
            <div className="hpane playpane">
              <div className="dhand"><span className="hlbl">Foe</span>{[0,1,2,3].map(i=><div key={i} className="dcardph"/>)}</div>
              <div className="playmid">
                <div className="sidecol stack">
                  <div className="scol-lbl">Stack</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack" && g.pend) ? [g.pend.card] : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
                <div className="centerslot">
                  {featured
                    ? (featured.foe
                        ? <div className="featfoe"><span className="fx2">✕✕</span><b>{featured.dmg}</b><span>Dummy</span></div>
                        : <div className="featured"><CardFrame card={featured.card}/></div>)
                    : <div className="featempty">Most recently played lands here</div>}
                </div>
                <div className="sidecol defend">
                  <div className="scol-lbl">Defend</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack") ? g.stack.filter(l=>l.k==="def").map(l=>l.gi!=null?opp(g).gear[l.gi]:opp(g).hand.find(c=>c.uid===l.uid)).filter(Boolean) : (g.mode==="block") ? [...you(g).blockH.map(uid=>you(g).hand.find(c=>c.uid===uid)), ...you(g).blockG.map(gi=>you(g).gear[gi])].filter(Boolean) : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
              </div>
              {g.mode==="pay" && (()=>{const sel=you(g).paySel.reduce((a,i)=>a+(you(g).hand[i].pitch||0),0); const need=Math.max(0,effCost(g.pending.card, you(g))-you(g).res-sel); return <div className="statusline">Paying <b>{g.pending.card.name}</b> — pitch below · {need>0?<span>need <b>{need}</b> more</span>:<span>covered ✓</span>}<button onClick={cancelPay}>✕ cancel</button></div>;})()}
              {g.mode==="block" && <div className="statusline">{g.bphase==="defend" ? <span>Tap hand &amp; equipment to defend — incoming <b>{g.incoming}</b></span> : <span>Reaction step — instants from floating <b>{you(g).res}</b></span>}</div>}
              {g.mode==="stack" && <div className="statusline">Priority — react from floating <b>{you(g).res}</b> or pass</div>}
              {g.mode==="arsenal" && <div className="statusline">Tap a card below for <b>arsenal</b><button onClick={skipArsenal}>skip</button></div>}
              {g.mode==="boostpick" && <div className="statusline">Boost <b>{g.pending.card.name}</b>? Banish the top card of your deck — a Mechanologist card grants go again.</div>}
              {g.mode==="defpay" && (g.defPayQueue||[]).length>0 && <div className="statusline">
                <b>{g.defPayQueue[0].name}</b> is defending — pay <b>{g.defPayQueue[0].cost}</b> for +{g.defPayQueue[0].ops.filter(o=>o[0]==="defBuff").reduce((a,o)=>a+o[1],0)}{"{d}"}? You have {you(g).res} floating.
                {g.defPayQueue.length>1 && <span> ({g.defPayQueue.length-1} more waiting.)</span>}
              </div>}
              {(()=>{ /* v2.07: the engine tracks all of this; the board never showed it */
                const pips = [];
                if(you(g).amp>0)       pips.push(["amp "+you(g).amp, "on"]);
                if(you(g).buffNext>0)  pips.push(["next atk +"+you(g).buffNext, "on"]);
                if(you(g).gaNext)      pips.push(["next atk go again", "on"]);
                if(you(g).ward>0)      pips.push(["ward "+you(g).ward, "on"]);
                if(you(g).awd>0)       pips.push(["arcane ward "+you(g).awd, "on"]);
                if(runeCount(you(g))>0) pips.push(["runechant ×"+runeCount(you(g)), "on"]);
                if(opp(g).marked)     pips.push(["dummy marked", "on"]);
                if(you(g).rot>0)       pips.push(["bloodrot "+you(g).rot, "warn"]);
                if(you(g).fra>0)       pips.push(["frailty "+you(g).fra, "warn"]);
                const drac = g.chain.filter(l=>l.drac && l.kind==="atk").length;
                if(drac>0)        pips.push(["draconic links "+drac, ""]);
                if((you(g).hist.arc||0)>0)  pips.push(["arcane dealt", ""]);
                if((you(g).hist.aura||0)>0) pips.push(["auras "+you(g).hist.aura, ""]);
                const links = g.chain.filter(l=>l.kind==="atk").length;
                if(links)              pips.push(["chain link "+links, ""]);
                return pips.length ? <div className="rail">{pips.map(([t,cl],i)=>
                  <span key={i} className={"rp"+(cl?" "+cl:"")}>{t}</span>)}</div> : null;
              })()}
              <div className="phand"><span className="hlbl">Hand</span>
                {you(g).hand.flatMap(handCell)}
                {playables.map((p,i)=>(
                  <button key={p.zone+"-"+(p.card.uid||p.card.name)+"-"+i}
                    className={"hc clip-sm"+(p.sel?" sel":"")+(peek&&peek.uid===p.card.uid?" peek":"")}
                    onClick={tapTwice(p.card, p.verb||"tap again to play", p.fn)}>
                    {p.sel && <span className="defsel">⛨ DEF</span>}
                    <CardFrame card={p.card} zone={p.zone}/>
                  </button>))}
              </div>
            </div>
            {/* PANE 3 — CHAIN: the links */}
            <div className="hpane">
              <div className="paneflag"><span>← play</span><span>the chain</span></div>
              {g.chainOpen && <button className="chainclose" onClick={closeChain}>⛓ Close chain — bank {g.chain.length} link{g.chain.length!==1?"s":""}</button>}
              {prevLinks.length===0 && g.chainHist.length===0 && <p className="note">No links yet — play an attack to start the chain.</p>}
              {prevLinks.length>0 && <div className="histturn"><div className="htlabel">This turn</div>
                <div className="chain">{prevLinks.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>}
              {g.chainHist.map((t,i)=>(
                <div key={i} className="histturn"><div className="htlabel">Turn {t.turn}</div>

                  {b.kind==="ally" && b.card.power>0 && <span className="sw">{b.spent?"spent":"⚔ "+b.card.power}</span>}

              <div className="heror">
                <div className={"wslot clip-sm"+(handGear[0]?" filled":"")}>
                  {handGear[0] ? gearBtn(handGear[0].gr, handGear[0].i) : <span className="wempty">weapon 1</span>}
                </div>
                <div className="heromid clip-sm">
                  <button className="hport2" onClick={()=>setZoom(built.HZOOM)}><span className={"tapwrap"+((you(g).weaponUsed["hpow"]&&/\btap\b|\{t\}/i.test(built.heroRec.tx||""))?" tapped":"")}><HeroArt h={h} db={db}/></span></button>
                  <span className="hname">{h.n.split(",")[0]}</span>
                  <b className="hlife2">{you(g).hp}</b>
                  <span className="hlbl">life</span>
                  {built.heroPow && <button className="hact clip-sm" style={{padding:"5px 8px",fontSize:11}} disabled={!!you(g).weaponUsed["hpow"]||g.mode!=="act"||!!g.over}
                    onClick={()=>tryPlay(built.HPOW,"hero",0)}>{you(g).weaponUsed["hpow"]?"USED":"⚡ USE"}</button>}
                </div>
                <div className={"wslot clip-sm"+(handGear[1]?" filled":"")}>
                  {handGear[1] ? gearBtn(handGear[1].gr, handGear[1].i)
                    : <span className="wempty">{is2H ? "2H occupies both hands" : "weapon 2 / off-hand"}</span>}
                </div>
              </div>
              <div className="midrow">
                {/* `armor` carries the gear's INDEX, which gearBtn needs, so
                    the lookup goes through it rather than through the piece.
                    ArmorGrid still owns the empty slots and the grid areas —
                    the half that must match the opponent's side of the table. */}
                <ArmorGrid gear={armor.map(x=>x.gr)} cell={(gr,z)=>{
                  const it = armor.find(x=>x.gr.uid===gr.uid);
                  return gearBtn(it.gr, it.i, "", z==="misc"?undefined:{gridArea:z});
                }}/>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{you(g).arsenal
                    ? <button style={{padding:0,width:"100%"}} onClick={()=> g.mode==="block" ? (g.bphase==="react"&&playRxA()) : g.inspect?setZoom(you(g).arsenal):tryPlay(you(g).arsenal,"arsenal",0)}><CardFrame card={you(g).arsenal} className="sm"/></button>
                    : "arsenal"}</div>
                  <span className="zlbl">Arsenal</span>
                </div>
                <DeckPitchCol deck={you(g).deck} pitch={you(g).pitch}/>
              </div>
              <div className="vfillsp"/>
              <div className="mystat" style={{marginTop:8}}>
                <span className="pill">WASTED <b>{you(g).wasted}</b></span>
                <span className="pill">TURN <b>{g.turn}</b></span>
                {built.hasBoost && <button className={"pill"+(g.boostOn?"":" hp")} onClick={()=>setG(s=>({...s,boostOn:!s.boostOn}))}>BOOST {g.boostOn?"✓":"✗"}</button>}
                <button className={"pill"+(g.inspect?" hp":"")} onClick={()=>setG(s=>({...s,inspect:!s.inspect}))}>ℹ {g.inspect?"inspecting":"inspect"}</button>
              </div>
            </div>
            <GravePane sd={you(g)} who="Your"/>
          </div>
        </div>
      </div>

      <div className="actbar">
        {g.mode==="pay" ? <>
          <button className="a" onClick={cancelPay}>Cancel</button>
          <button className="a pay" onClick={confirmPay}>Pitch & play</button>
        </> : g.mode==="stack" ? (
          <button className="a go" onClick={resolveStack}>Pass — resolve</button>
        ) : g.mode==="block" ? ( g.bphase==="defend" ? <>
          <button className="a" onClick={takeIt}>Take it</button>
          <button className="a go" onClick={moveToReact}>Defend → reactions</button>
        </> : (
          <button className="a go" onClick={takeIt}>Resolve damage</button>
        )) : g.mode==="boostpick" ? (<>
          <button className="a go" onClick={()=>confirmBoost(true)}>⚡ Boost</button>
          <button className="a" onClick={()=>confirmBoost(false)}>No boost</button>
        </>) : g.mode==="defpay" ? (<>
          <button className="a go" disabled={you(g).res < ((g.defPayQueue||[])[0]?.cost||0)} onClick={()=>confirmDefPay(true)}>

          <button className="a" onClick={()=>confirmDefPay(false)}>Decline</button>
        </>) : (<>
          <button className="a go" disabled={g.mode!=="act"||!!g.over} onClick={endTurn}>End turn</button>
        </>)}
      </div>
      {g.over && (g.over.win
        ? <WinPanel score={g.over.score} onExit={onExit}/>
        : <div className="lose clip"><h3 className="disp">Down — but wiser</h3><p style={{fontSize:13}}>Fewer wasted pitches and tighter blocks next run.</p>
            <button className="bigbtn alt" onClick={onExit}>Back to heroes</button></div>)}
      <CardModal card={zoom} onClose={()=>setZoom(null)}/>
      {/* JUDGE!! — write down what looked wrong while it is still on
          screen. The board travels with the note, so the note can be one
          line. One sheet, shared with the table board. */}
      <JudgeSheet open={!!bug} onClose={()=>setBug(null)} report={judgeCtx} warn={judgeN}
        meta={`v${window.APP_VER} · ${h.n} · turn ${g.turn} · ${g.mode}`}/>
      {/* the peeked card, big enough to actually read, docked above the
          action bar so the hand rail stays visible underneath it. THE SAME
          COMPONENT THE TABLE RENDERS (v2.52) — this was a hand-copied
          duplicate of its markup, which is how the table came to be missing
          the `--peekbot` measurement that keeps the preview off the rail.
          Hidden while a prompt sheet is open, because `.psheet` docks in
          exactly this spot. */}
      {!g.over && !g.prompt &&
        <PeekDock card={peek && peekables().find(c=>c.uid===peek.uid)}
          verb={peek && peek.verb} onClose={()=>setPeek(null)}/>}
      {g.prompt && !g.over && (()=>{
        const p = g.prompt;
        /* One sheet, every variant. The side badge is shown whenever the
           prompt is NOT addressed to you — in multiplayer that is the
           difference between "your call" and "waiting on them". */
        const ready = promptReady(p);
        return <div className="psheet">
          <div className="ph"><span className="pt">{p.title}</span>
            <span className="psrc">{p.src}</span>
            {p.side !== 0 && <span className="pside">opponent's call</span>}</div>
          <div className="phint">{p.hint}</div>

          {(p.tag==="opt" || p.tag==="pick" || p.tag==="reveal") && !!p.cards.length &&
            <div className="prow2">
              {p.cards.map((c,i)=>{
                const down = p.tag==="opt" && p.down.includes(i);
                const sel  = p.tag==="pick" && p.sel.includes(i);
                const topOrder = p.tag==="opt"
                  ? p.cards.filter((_,j)=>!p.down.includes(j)).indexOf(c)+1 : 0;
                const tap = p.tag==="reveal" ? undefined : ()=>promptToggle(i);
                return <button key={c.uid||i}
                  className={"pcard"+(down?" down":"")+(sel?" sel":"")+(p.tag==="reveal"?" flat":"")}
                  onClick={tap}>
                  <CardFrame card={c} className="sm"/>
                  {p.tag==="opt" && <span className="ptag">{down ? "bottom" : "top "+topOrder}</span>}
                  {p.tag==="pick" && sel && <span className="ptag">✓ chosen</span>}
                </button>;
              })}
            </div>}

          {p.tag==="modal" && <div className="pmodal">
            {p.options.map((o,i)=>(
              <button key={i} className={"popt"+(p.choice===i?" on":"")} onClick={()=>promptPick(i)}>
                {o.label || String(o)}
              </button>
            ))}
          </div>}

          {p.tag==="pay" && <div className="pmodal">
            <button className={"popt"+(p.choice==="pay"?" on":"")}
              disabled={p.avail < p.cost} onClick={()=>promptPick("pay")}>
              Pay {p.cost}
              <span className="sub">{p.avail < p.cost ? `only ${p.avail} floating` : `${p.avail} floating`}</span>
            </button>
            <button className={"popt"+(p.choice==="decline"?" on":"")} onClick={()=>promptPick("decline")}>
              Decline<span className="sub">the rider does not resolve</span>
            </button>
          </div>}

          <div className="pact">
            {p.tag==="pick" && p.optional &&
              <button onClick={promptDecline}>Choose none</button>}
            {p.tag==="pick" && p.max>1 &&
              <span className="pcount">{p.sel.length}/{p.max}</span>}
            <button className={"go"+(ready?"":" off")} disabled={!ready} onClick={promptConfirm}>
              {p.tag==="reveal" ? "OK" : "Confirm"}
            </button>
          </div>
        </div>;
      })()}
    </div>
  );
}
function WinPanel({score,onExit}){
  const [t] = uS(()=>{
    let pool=[]; TROPHIES.forEach(x=>{for(let i=0;i<x.w;i++)pool.push(x);});
    return pool[Math.floor(Math.random()*pool.length)];
  });
  uE(()=>{ const seen = store.get("case",[]); store.set("case",[...seen,{n:t.n,r:t.r,at:Date.now()}]); },[]);
  return (
    <div className="reveal" onClick={onExit}>
      <h2 className="disp" style={{marginBottom:14}}>DUMMY DESTROYED</h2>
      <div className="card clip"><div className="rar">{t.r} pull</div><h3>{t.n}</h3></div>
      <p style={{marginTop:14,fontSize:13}}>Efficiency score <b className="mono">{score}</b> — lower is cleaner. Tap anywhere.</p>
    </div>
  );
}

/* ---------- JUDGE ---------- */
function Judge(){
  const [i,setI]=uS(0),[pick,setPick]=uS(null),[right,setRight]=uS(0);
  const q = JUDGE_QS[i%JUDGE_QS.length];
  const done = i>=JUDGE_QS.length;
  if(done) return (
    <div className="sheet clip"><h2>Bench cleared</h2>
      <p style={{margin:"8px 0"}}>{right} / {JUDGE_QS.length} correct. Rules and pitch discipline win Silver Age games.</p>
      <button className="bigbtn alt" onClick={()=>{setI(0);setPick(null);setRight(0);}}>Run it again</button>
      <p className="note">Rules per the official Comprehensive Rules — always confirm current bans and errata at fabtcg.com before an event.</p>
    </div>);
  return (
    <div className="sheet clip">
      <div className="tag">Judge call {i+1} / {JUDGE_QS.length}</div>
      <h2 style={{fontSize:18,textTransform:"none",fontFamily:"'Spline Sans'",fontWeight:600,letterSpacing:0,margin:"6px 0"}}>{q.q}</h2>
      {q.a.map((a,ai)=>(
        <button key={ai} className={"qopt clip-sm"+(pick==null?"":ai===q.c?" right":ai===pick?" wrong":"")}
          onClick={()=>{ if(pick==null){ setPick(ai); if(ai===q.c) setRight(r=>r+1);} }}>{a}</button>
      ))}
      {pick!=null && <><div className="explain">{q.x}</div>
        <button className="bigbtn" onClick={()=>{setI(i+1);setPick(null);}}>Next ruling</button></>}
    </div>
  );
}

/* ---------- TROPHIES ---------- */
function Trophies(){
  const pulls = store.get("case",[]);
  const best = store.get("best",{});
  const count = {}; pulls.forEach(p=>{count[p.n]=(count[p.n]||0)+1;});
  return (
    <div>
      <div className="sheet clip">
        <h2>Trophy case</h2>
        <p className="tag" style={{margin:"4px 0 10px"}}>Cosmetic pulls from dummy kills — no gambling, no wallet</p>
        {Object.keys(count).length===0 && <p style={{fontSize:13.5}}>Empty shelves. Destroy a dummy to hang your first trophy.</p>}
        {TROPHIES.filter(t=>count[t.n]).map(t=>(
          <div key={t.n} className="statrow" style={{justifyContent:"space-between"}}>
            <span>{t.n} <span className="tag">{t.r}</span></span><b>×{count[t.n]}</b>
          </div>))}
      </div>
      <div className="sheet clip" style={{marginTop:10}}>
        <h2 style={{fontSize:20}}>Best clears</h2>
        {Object.keys(best).length===0 ? <p style={{fontSize:13.5}}>No clears logged yet.</p> :
          HEROES.filter(h=>best[h.k]!=null).map(h=>(
            <div key={h.k} className="statrow" style={{justifyContent:"space-between"}}>
              <span>{h.n}</span><b className="mono">{best[h.k]}</b>
            </div>))}
      </div>
    </div>
  );
}

/* ---------- LOADOUT — the official zones (4 armour slots, 2 hands) live
     in engine/build.js: ARMOR_Z, HAND_Z, applyPick, defaultPicks. One set
     of slot rules governs both seats, or the opponent is quietly stronger
     than printed. ---------- */
/* `netFoe` turns this screen into the TABLE's sideboard step (v2.49).
   The loadout is the same rules problem across the wire as it is against
   the dummy — the printed slot rules, the same 40-card floor — so it is
   the same screen rather than a second one that would drift from it.
   What changes is only that the opponent is already SETTLED: it was
   negotiated in the lobby, so the picker is replaced by the hero across
   the table. Reusing the screen is also what keeps the cut map honest —
   `cuts` is exactly the shape engine/lobby.js normalises and
   build.js rebuilds the deck from, on both phones. */
/* `netOnPlay` is a BOOLEAN — "is this client on the play" — and not the
   seat index that opens the game. Passing the index and reading it as the
   answer told BOTH seats they were on the draw, which is the same
   actor-versus-perspective slip that `you()` meaning seat 0 caused all
   through the migration: a seat INDEX is not an answer to a question
   about THIS client. Named so it cannot be read the other way. */
function Loadout({h,db,onBack,onStart,netFoe,netOnPlay}){
  const d = PARSED[h.k];
  const saSet = (d.hero.code||"").slice(0,3) || null;
  const gearR = uM(()=>d.gear.map((e,i)=>{ const c=resolveEntry(db,e,saSet); return {i, c, s:slotOf(c)}; }),[h,db]);
  const handL = gearR.filter(x=>HAND_Z.includes(x.s.z));
  const armorL = gearR.filter(x=>!HAND_Z.includes(x.s.z));
  const saved = store.get("loadout."+h.k, null);
  const [sel,setSel] = uS(()=>{
    if(saved && saved.sel){ let s=[]; saved.sel.forEach(i=>{ if(gearR.some(x=>x.i===i)) s=applyPick(gearR,s,i); }); if(s.length) return s; }
    return defaultPicks(gearR);
  });
  const [cuts,setCuts] = uS(()=> (saved&&saved.cuts)||{});
  const [zoom,setZoom] = uS(null);
  /* WHO IS ACROSS THE TABLE. `null` is the Dummy and stays the default:
     it is the regression harness for every phase of the opponent work,
     and its vanilla pile is the one deck where nothing can be faked
     (ROADMAP-OPPONENT.md). Deliberately NOT saved per hero the way the
     loadout is — the opponent is a property of the match, not of your
     deck, and a remembered one would silently change a later game. */
  const [oppH,setOppH] = uS(netFoe||null);
  const item = i => gearR.find(x=>x.i===i);
  const hands = sel.filter(i=>["1h","2h","off"].includes(item(i).s.z)).reduce((a,i)=>a+item(i).s.h,0);
  const armorN = sel.filter(i=>ARMOR_Z.includes(item(i).s.z)||item(i).s.z==="misc").length;
  const has2H = sel.some(i=>item(i).s.z==="2h");
  const deckTotal = d.deck.reduce((a,e)=>a+e.q,0);
  const cutN = Object.values(cuts).reduce((a,b)=>a+b,0);
  const size = deckTotal - cutN;
  const tapCut = (ei,q) => setCuts(c=>{
    const cur = c[ei]||0;
    if(cur<q && size>40) return {...c,[ei]:cur+1};
    const n={...c}; delete n[ei]; return n;
  });
  const start = () => { store.set("loadout."+h.k,{sel,cuts}); onStart({gearIdx:sel, cuts, oppH}); };
  const deckRows = d.deck.map((e,ei)=>({ei, e, c:resolveEntry(db,e,saSet)}));
  const PD = {1:"var(--r)",2:"var(--y)",3:"var(--b)"};
  const Tile = ({x}) => {
    const on = sel.includes(x.i);
    const dead = x.s.z==="qvr" && !on && !has2H;
    return (
      <button className={"pick clip-sm"+(on?" on":"")+(dead?" lockout":"")} onClick={()=>{ if(dead){setZoom(x.c);return;} setSel(s=>applyPick(gearR,s,x.i)); }}>
        <CardImg card={x.c}/>
        <span className="slotb">{x.s.lab}</span>
        {on && <span className="chk">✓</span>}
      </button>);
  };
  const sc1=uR(null), sc2=uR(null), sc3=uR(null);
  const jumpL = r => r.current && r.current.scrollIntoView({behavior:"smooth",block:"start"});
  const selItems = sel.map(i=>gearR.find(x=>x.i===i)).filter(Boolean);
  const selHand = selItems.filter(x=>HAND_Z.includes(x.s.z));
  const selArmor = z => selItems.find(x=>x.s.z===z);
  const p2h = selHand[0] && selHand[0].s.z==="2h";
  const hcv = resolveHero(db, d.hero);
  const hHP = hcv && hcv.hp!=null ? hcv.hp : 20;
  /* Read off the opponent's own hero record, the same way yours is — so
     the scout panel shows the life total the game will actually deal. */
  const oppHP = uM(()=>{
    if(!oppH) return 42;
    const oc = resolveHero(db, PARSED[oppH.k].hero);
    return oc && oc.hp!=null ? oc.hp : 20;
  },[oppH,db]);
  const prevTile = x => (
    <button key={x.i} className="g clip-sm" style={{width:"100%",maxWidth:118}} onClick={()=>setSel(s=>applyPick(gearR,s,x.i))}>
      <CardFrame card={x.c} className="sm"/>
    </button>);
  return (
    <div className="lo">
      <div className="screennav">
        <button onClick={onBack} style={{flex:.7}}>✕ back</button>
        <button onClick={()=>jumpL(sc1)}>▲ Scout</button>
        <button onClick={()=>jumpL(sc2)}>Loadout</button>
        <button onClick={()=>jumpL(sc3)}>Deck ▼</button>
      </div>
      <div className="tablewrap">
        {/* ---- SCOUT: hero card only ---- */}
        <div className="vscreen" ref={sc1}>
          <div className="hpane vfill" style={{flex:1}}>
            <div className="paneflag"><span>Scout the opponent</span><span>hero only — the rest stays hidden</span></div>
            <div className="vfillsp"/>
            <div className="featwrap">
              <div className="featfoe">
                {oppH
                  ? <><div className="port clip-sm" style={{width:96}}><HeroArt h={oppH} db={db}/></div>
                      <b>{oppHP}</b><span>{oppH.n.split(",")[0]} · Life</span></>
                  : <><div className="dmy"><div className="dhead"><span>✕</span><span>✕</span></div><div className="dbody"/><div className="dpost"/></div>
                      <b>{"42"}</b><span>The Dummy · Life</span></>}
              </div>
              <span className="linkchip">Opponent hero</span>
            </div>
            {/* THE PICK BELONGS HERE, NOT AT THE THROW. You scout the
                opponent's hero and THEN you sideboard — putting it after
                the loadout would show you the matchup too late to use it,
                which is the one thing this panel exists to prevent. */}
            {netFoe
              ? <div className="foepick"><label>Across the table</label>
                  <div className="foefixed mono">{netFoe.n} — {netFoe.cls}</div></div>
              : <div className="foepick">
                  <label htmlFor="foesel">Who are you facing?</label>
                  <select id="foesel" value={oppH ? oppH.k : ""}
                    onChange={e=>{
                      const v = e.target.value;
                      setOppH(v==="" ? null
                        : v==="?" ? HEROES[Math.floor(Math.random()*HEROES.length)]
                        : HEROES.find(x=>x.k===v) || null);
                    }}>
                    <option value="">The Dummy — 42 life, vanilla pile</option>
                    <option value="?">Random hero</option>
                    {HEROES.map(x=><option key={x.k} value={x.k}>{x.n} — {x.cls}</option>)}
                  </select>
                </div>}
            <div className="vfillsp"/>
            <p className="note">{netFoe
              ? `${netFoe.n.split(",")[0]} is a person, sitting somewhere else, holding a real hand. `
                + (netOnPlay ? "You are on the play — you take the first turn and spend a card of tempo for it."
                             : "You are on the draw — they swing first, and you keep the extra card.")
              : oppH
              ? `${oppH.n.split(",")[0]} brings a real deck, real equipment and a real life total — and blocks with printed defence. It still takes no action phase, so its swing is the scripted escalation and the log says so every time.`
              : "Real sideboarding shows you only the enemy hero. Their iron, their habits — you learn those in the pit."}</p>
          </div>
        </div>
        {/* ---- LOADOUT: live playmat preview + picks ---- */}
        <div className="vscreen" ref={sc2}>
          <div className="hpane" style={{flex:1}}>
            <div className="paneflag"><span>Your loadout — preview updates live</span><span>tap preview to unequip</span></div>
            <div className="loprev">
              <div className="heror">
                <div className={"wslot clip-sm"+(selHand[0]?" filled":"")}>
                  {selHand[0] ? prevTile(selHand[0]) : <span className="wempty">weapon 1</span>}
                </div>
                <div className="heromid clip-sm">
                  <div className="hport2"><HeroArt h={h} db={db}/></div>
                  <span className="hname">{h.n.split(",")[0]}</span>
                  <b className="hlife2">{hHP}</b>
                  <span className="hlbl">life</span>
                </div>
                <div className={"wslot clip-sm"+(selHand[1]?" filled":"")}>
                  {selHand[1] ? prevTile(selHand[1]) : <span className="wempty">{p2h ? "2H occupies both hands" : "weapon 2 / off-hand"}</span>}
                </div>
              </div>
              <div className="midrow">
                <div className="armorgrid">
                  {["head","chest","arms","legs"].map(z=>{
                    const it = selArmor(z);
                    return it ? <span key={z} style={{gridArea:z}}>{prevTile(it)}</span>
                      : <div key={z} className="aslot clip-sm" style={{gridArea:z}}><span className="wempty">{z}</span></div>;
                  })}
                </div>
                <div style={{flex:1}}/>
                <div style={{flex:1}}/>
              </div>
            </div>
            <div className="sec">Hands <b>{hands} / 2</b> <span style={{textTransform:"none",letterSpacing:0}}>two 1H, or 1H + off-hand, or one 2H{gearR.some(x=>x.s.z==="qvr")?" (+ quiver on a 2H)":""}</span></div>
            <div className="pickgrid">
              {handL.map(x=><Tile key={x.i} x={x}/>)}
              {!handL.length && <span className="tag">no weapons — this hero fights with cards alone</span>}
            </div>
            <div className="sec">Armor <b>{armorN} / 4</b> <span style={{textTransform:"none",letterSpacing:0}}>one each: head · chest · arms · legs</span></div>
            <div className="pickgrid">
              {armorL.map(x=><Tile key={x.i} x={x}/>)}
            </div>
          </div>
        </div>
        {/* ---- DECK: image tiles, tap to cut ---- */}
        <div className="vscreen" ref={sc3}>
          <div className="hpane" style={{flex:1}}>
            <div className="paneflag"><span>Trim the deck · {size}</span><span>min 40 — tap to cut, tap through to restore</span></div>
            <div className="cutgrid">
              {deckRows.map(({ei,e,c})=>{
                const cut = cuts[ei]||0, kept = e.q-cut;
                return (
                  <button key={ei} className={"pick clip-sm"+(cut>0?" cut":"")} onClick={()=>tapCut(ei,e.q)}>
                    <CardFrame card={c}/>
                    {cut>0 && <span className="cutx">CUT {cut}</span>}
                    <span className="qstrip">{cut>0?`${kept} of ${e.q} kept`:`×${e.q}`}</span>
                  </button>);
              })}
            </div>
            <p className="note">Blitz runs exactly 40 — cut what your plan won't miss. Loadout and cuts saved per hero.</p>
          </div>
        </div>
      </div>
      <div className="actbar">
        <button className="battlebtn clip" style={{marginTop:0}} onClick={start}><span>Fight</span></button>
      </div>
      <CardModal card={zoom} onClose={()=>setZoom(null)}/>
    </div>
  );
}
