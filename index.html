/* ============================================================
   PREGAME — the throw for seating.

   Sits between the loadout and the first draw, because seating is
   decided before a card is drawn. The winner CHOOSES; they are not
   simply handed the first turn. Player is side 0, opponent side 1 —
   the same indices the sides[] migration uses, so this screen already
   speaks the two-player vocabulary the rest of the engine is moving to.
   ============================================================ */
const RPS_GLYPH = {rock:"✊", paper:"✋", scissors:"✌"};
const RPS_LOSS = {rock:"Paper smothers it.", paper:"Scissors cut through.", scissors:"Rock shatters them."};

function Pregame({h, seed, onSeated, onBack}){
  const [rounds,setRounds] = uS([]);
  const [live,setLive] = uS(null);
  const [phase,setPhase] = uS("throw");
  /* Who is across the table was decided on the HERO SCREEN (v2.76), which
     is where it belongs now: you pick the matchup, throw for seating, and
     only THEN sideboard — knowing both. This screen only reads it. */
  const foeLabel = "The Dummy";
  const [log,setLog] = uS(["Two hands over the table. Winner calls the seating."]);
  const timer = uR(null);
  const say = m => setLog(l=>[...l,m].slice(-7));
  uE(()=>()=>{ if(timer.current) clearTimeout(timer.current); },[]);
  /* The throw comes off the MATCH seed, on its own derived sub-stream.
     Derived rather than shared so the opponent's hand does not correlate
     with the first card of anyone's deck — same match seed, independent
     sequences. A ref, not state: advancing it must not trigger a render,
     and ties replay by drawing again rather than by re-rendering. */
  const rps = uR(rngMake(rngSeedFrom(String(seed==null?0:seed) + ":rps")));

  /* THE COIN (v2.57) — a testing affordance, see window.THROW_MODE. It draws
     from the same seeded sub-stream the throw uses, so a match is still
     reproducible from its seed, and it cannot tie, which is the whole point.
     The winner still CHOOSES the seating below: that is the rule. */
  const coinMode = window.THROW_MODE !== "rps";
  const [coinWin, setCoinWin] = uS(null);
  const series = rpsSeries(rounds);
  const winner = coinMode ? coinWin : series.winner;

  uE(()=>{
    if(!coinMode || coinWin !== null) return;
    const _c = rngInt(rps.current, 2); rps.current = _c.rng;
    timer.current = setTimeout(()=>{
      setCoinWin(_c.v);
      say(_c.v===0 ? "The coin lands your side of the table." : `The coin lands ${foeLabel}'s way.`);
      setPhase("decide");
    }, 500);
  },[coinMode]);

  const throwIt = mine => {
    if(phase!=="throw") return;
    const _t = rngNext(rps.current); rps.current = _t.rng;
    const theirs = rpsThrow(()=>_t.v);
    setLive({mine, theirs:null});
    setPhase("shaking");
    timer.current = setTimeout(()=>{
      const v = rpsResolve(mine, theirs);
      const next = [...rounds, [mine, theirs]];
      setLive({mine, theirs});
      setRounds(next);
      if(v===0){
        say(`Both ${mine}. Dead level — throw again.`);
        setPhase("throw");
      } else if(v===1){
        say(`${RPS_GLYPH[mine]} beats ${RPS_GLYPH[theirs]}. ${RPS_LOSS[theirs]} The call is yours.`);
        setPhase("decide");
      } else {
        say(`${RPS_GLYPH[theirs]} beats ${RPS_GLYPH[mine]}. ${RPS_LOSS[mine]} ${foeLabel} calls it.`);
        setPhase("decide");
      }
    }, 620);
  };

  /* The dummy's call is a rule, not a coin: a sparring partner that wins
     the throw always elects to swing first. Stated plainly so nobody has
     to wonder whether the trainer is cheating. */
  uE(()=>{
    if(phase!=="decide" || winner!==1) return;
    timer.current = setTimeout(()=>{
      say(`${foeLabel} takes the first turn — it always does. Brace up.`);
      setPhase("done");
      timer.current = setTimeout(()=>onSeated(1), 900);
    }, 500);
  },[phase,winner]);

  const decide = choice => {
    const first = rpsSeat(0, choice);
    say(first===0 ? "You take the first turn. Initiative is yours." : "You hand it the first turn — you keep the extra card.");
    setPhase("done");
    timer.current = setTimeout(()=>onSeated(first), 800);
  };

  const shaking = phase==="shaking";
  return (
    <div className="rps">
      <div className="rtitle">{coinMode ? "The Coin" : "The Throw"}</div>
      <p className="rsub">Winner decides who takes the first turn.<br/>Going first buys initiative; going second keeps a card.
        {coinMode && <><br/><span style={{opacity:.65}}>Coin for speed while testing — the throw returns for launch.</span></>}</p>
      <div className="rtable">
        <div className={"rseat"+(winner===0?" win":"")}>
          <span className="rwho">You · {h.n}</span>
          <span className="rglyph">{coinMode ? (winner===0?"🪙":"·") : shaking ? "✊" : live ? RPS_GLYPH[live.mine] : "·"}</span>
          <span className="rname">{coinMode ? (winner===null?"flipping":winner===0?"wins the flip":"loses the flip")
                                            : shaking ? "shaking" : live ? live.mine : "ready"}</span>
          {!coinMode && <span className="rscore">{series.a}</span>}
        </div>
        <span className="rvs">VS</span>
        <div className={"rseat"+(winner===1?" win":"")}>
          <span className="rwho">{foeLabel}</span>
          <span className="rglyph">{coinMode ? (winner===1?"🪙":"·")
                                             : shaking || !live || live.theirs===null ? "✊" : RPS_GLYPH[live.theirs]}</span>
          <span className="rname">{coinMode ? (winner===null?"flipping":winner===1?"wins the flip":"loses the flip")
                                            : shaking || !live || live.theirs===null ? "shaking" : live.theirs}</span>
          {!coinMode && <span className="rscore">{series.b}</span>}
        </div>
      </div>
      <div className="rcall">
        {phase==="throw" && coinMode && <span>Flipping for the seating…</span>}
        {phase==="throw" && !coinMode && <span>{rounds.length ? <span>Tied <b>{series.ties}</b> — throw again.</span> : "Pick your throw."}</span>}
        {shaking && <span>Rock… paper… scissors…</span>}
        {phase==="decide" && winner===0 && <span>You won the {coinMode?"flip":"throw"}. <b>Your call.</b></span>}
        {phase==="decide" && winner===1 && <span>{foeLabel} won the {coinMode?"flip":"throw"}. It is deciding…</span>}
        {phase==="done" && <span>Seated. Stepping to the table…</span>}
      </div>
      {!coinMode && (phase==="throw"||shaking) && <div className="rthrows">
        {RPS_THROWS.map(t=>(
          <button key={t} disabled={shaking} onClick={()=>throwIt(t)}>
            <span className="g">{RPS_GLYPH[t]}</span><span className="l">{t}</span>
          </button>
        ))}
      </div>}
      {phase==="decide" && winner===0 && <div className="rseatpick">
        <button className="go" onClick={()=>decide("first")}>I go first<span className="sub">take the initiative</span></button>
        <button onClick={()=>decide("second")}>It goes first<span className="sub">keep the extra card</span></button>
      </div>}
      <div className="rlog">{log.map((m,i)=><div key={i}>{m}</div>)}</div>
      {phase!=="done" && <button className="rback" onClick={onBack}>← back to the roster</button>}
    </div>
  );
}

/* ============================================================
   THE TABLE — find an opponent, sit down, play across two phones.

   Roadmap Phase B step 7, wired through to a screen. The rules layer
   underneath is engine/actions.js's BLANK action set, not the card pool:
   `foeSwing` still fabricates the dummy's swing as [3,4,5][(turn-1)%3],
   so seat 1 has no action phase and two hero decks cannot yet cross the
   wire. That is Phase A step 4 plus the judge.js reducer extraction, and
   it is rules work rather than network work — see CLAUDE.md. What this
   screen proves is the whole transport: two phones, a table code, real
   priority handoffs, a real combat chain, and a state hash that agrees.

   Everything below reaches the engine module-qualified (DawnRoom.*,
   DawnNet.*, DawnActions.*) — none of it is bridged to a bare name,
   because `open`, `reduce`, `legal` and `hash` are far too generic to
   own as globals. test/sync.test.js pins that.
   ============================================================ */
function TableScreen({onBack, onSeated}){
  const [mode,setMode] = uS(null);           /* null | "host" | "join" */
  const [code,setCode] = uS("");
  const [stat,setStat] = uS(null);
  const [err,setErr]   = uS(null);
  const [busy,setBusy] = uS(false);
  const live = uR(true);
  uE(()=>()=>{ live.current = false; },[]);

  const PHRASE = {
    loading:"Fetching the transport…", connecting:"Reaching the relay…",
    waiting:"Table open — waiting for your opponent…",
    dialling:"Knocking on the table…", connected:"Seated."
  };

  const sit = (host, c) => {
    setErr(null); setBusy(true); setStat("loading");
    DawnRoom.open({
      code:c, host,
      onStatus:s=>{ if(live.current) setStat(s); },
      onClose:()=>{ if(live.current){ setErr("The other phone left the table."); setBusy(false); } }
    }).then(table=>{
      if(!live.current){ table.close(); return; }
      onSeated({table, host, code:table.code});
    }).catch(e=>{
      if(!live.current) return;
      setErr((e && e.message) || String(e)); setStat(null); setBusy(false);
    });
  };

  const openTable = () => { const c = DawnRoom.makeCode(); setCode(c); setMode("host"); sit(true, c); };
  const joinTable = () => {
    if(!DawnRoom.isValid(code)) return setErr("A table code is "+DawnRoom.CODE_LEN+" characters.");
    sit(false, code);
  };

  return (
    <div className="tblwrap">
      <div className="tblhead">Find an opponent</div>

      {!mode && <>
        <div className="tblcard">
          <p className="note" style={{marginTop:0}}>
            One of you opens a table and reads out the code; the other types it in.
            No account, no server — the two phones talk directly once they have found
            each other.
          </p>
        </div>
        <div className="tblrow">
          <button className="bigbtn" onClick={openTable}>Open a table</button>
          <button className="bigbtn alt" onClick={()=>setMode("join")}>Join a table</button>
        </div>
        {/* This said "the drill decks — blank cards" until v2.52, which was
            true before v2.49 and has been wrong since: the table negotiates a
            hero, a throw and a sideboard and runs two real decks. Stale copy
            that UNDER-sells is still stale copy — it tells a player not to
            bother with the screen. The lobby's own note already said this. */}
        <p className="mnote">
          Table play runs <strong>two real hero decks</strong> — the CR turn structure,
          priority, the combat chain and printed costs. Card text does not resolve
          yet: the parser's effects still live in the solo trainer.
        </p>
      </>}

      {mode==="host" && <>
        <div className="tblcard">
          <div className="tblstat">Your table number</div>
          <div className="tblcode">{code}</div>
        </div>
        <div className={"tblstat"+(stat==="waiting"?" live":"")}>
          {stat==="waiting" && <span className="tbldot"></span>}
          {PHRASE[stat]||"…"}
        </div>
      </>}

      {mode==="join" && <>
        <div className="tblcard">
          <div className="tblstat">Table number</div>
          <input className="tblin mono" value={code} maxLength={8} inputMode="text"
            autoCapitalize="characters" autoCorrect="off" spellCheck={false}
            placeholder="····"
            onChange={e=>{ setErr(null); setCode(DawnRoom.normalize(e.target.value)); }}/>
        </div>
        <button className="bigbtn" disabled={busy||!DawnRoom.isValid(code)} onClick={joinTable}>
          {busy ? (PHRASE[stat]||"…") : "Sit down"}
        </button>
      </>}

      {err && <div className="tblerr">{err}</div>}
      <button className="a" onClick={onBack}>Back</button>
    </div>
  );
}

/* ============================================================
   THE ROOM — connect, agree, deal, play. (v2.49)

   Until now this screen connected two phones and dropped them straight
   into engine/actions.js's BLANK decks, because `net.js` needs a
   a pure reducer over state and action, and the trainer has none:
   `Battle` is 2,500
   lines of React closures, not a reducer, and its opponent is a branch
   inside the rules rather than a seat. That is the whole reason a second
   human had nowhere to sit.

   Both halves now exist. `engine/lobby.js` negotiates the four things
   two players must agree on, and `engine/judge.js` is the rules as a
   pure function that either seat can drive.

     TableScreen  find a table          (unchanged)
     TableRoom    the negotiation, and then the game
       - hero     both seats choose a hero
       - throw    rock-paper-scissors; the winner CHOOSES the seating
       - board    both seats sideboard, knowing the matchup and the seat
       - ready    buildMatch -> judge.newMatch -> net.js drives both

   ---- ONE CHANNEL, TWO PROTOCOLS ---------------------------------------

   The lobby and net.js both name a message `hello`. An undemuxed channel
   would hand net.js's handshake to the lobby and the lobby's to net.js,
   and the failure would look like a transport bug rather than a naming
   one. Every frame is therefore tagged with the protocol that owns it.

   ---- WHAT IS AND IS NOT REAL HERE -------------------------------------

   Real: two hero decks off the actual card database, printed life and
   intellect, the CR turn structure, priority, the combat chain, costs
   paid by pitching on demand, defenders from hand and iron, printed
   power against printed defence, the ordered end phase.

   NOT real yet: CARD EFFECTS. `runOps`/`execute`/`resolveStack` — the
   parser's card semantics — are still closures inside `Battle`, so a
   card here moves zones and costs what it prints, and its text box does
   nothing. That limit is judge.js's, stated in its own header, and it is
   the next pass: those three functions become a shared engine/effects.js
   that the trainer and the judge both call.

   SO THE TWO ENGINES DO NOT MEET. Solo play is `Battle` and keeps every
   card effect; table play is `judge.js` and keeps the second seat.
   Nothing routes between them, which is the discipline that kept
   actions.js free of card text: a control-flow bug and a card being read
   wrong must never be confusable.
   ============================================================ */

/* Tagged frames. `ch` names the protocol; `m` is that protocol's own
   message, untouched, so neither module has to know the other exists. */
const CH_LOBBY = "lobby", CH_NET = "net";

function TableRoom({table, host, code, db, onExit}){
  /* `mySeat`, NOT `seat`. engine/priority.js exports a `seat` helper
     meaning "seat a game with this first player"; a local `seat` meaning
     "which chair is this client in" is the same-name-different-meaning
     trap test/sync.test.js pins, and it caught exactly this name on the
     first build of the table screen. */
  const mySeat = host ? 0 : 1;
  const [lob,setLob] = uS(()=>DawnLobby.newLobby({code}));
  const [pick,setPick] = uS(null);        /* an UNSENT hero choice */
  const [err,setErr] = uS(null);
  const [match,setMatch] = uS(null);      /* the built game, once ready */
  const lobRef = uR(null); lobRef.current = lob;
  const netRef = uR(null);
  const netQ   = uR([]);                  /* net frames that beat the session */

  /* Apply locally and put it on the wire. BOTH peers run the same
     reducer over the same messages — the lobby is order-independent and
     write-once, so there is no sequencer and none is needed. */
  const say = m => {
    const r = DawnLobby.reduce(lobRef.current, m);
    if(r.error && !r.error.dup) setErr(r.error.why);
    lobRef.current = r.state; setLob(r.state);
    try { table.send({ch:CH_LOBBY, m}); } catch(e){ setErr(String(e.message||e)); }
  };

  uE(()=>{
    table.listen(f=>{
      if(!f || typeof f !== "object") return;
      if(f.ch === CH_LOBBY){
        const r = DawnLobby.reduce(lobRef.current, f.m);
        /* A duplicate is the write-once rule working, not an error —
           only a real refusal is worth showing a player. */
        if(r.error && !r.error.dup) setErr(r.error.why);
        lobRef.current = r.state; setLob(r.state);
      } else if(f.ch === CH_NET){
        /* THE SESSION IS CREATED WHEN THE LOBBY READIES, AND THE GUEST'S
           HELLO CAN BEAT IT. Both peers reach `ready` from the same
           message, but one phone's React effect runs first — so the
           guest's handshake can arrive before the host has a session to
           answer it. Held and flushed rather than dropped, which is the
           same fix room.js already makes one layer down. */
        if(netRef.current) netRef.current.receive(f.m);
        else netQ.current.push(f.m);
      }
    });
    /* Say hello immediately. The card-data check has to settle before a
       hero is chosen, because a skew means the two phones would resolve
       the same deck list into different cards — silently, and
       consistently enough that a state hash cannot describe it usefully. */
    say(DawnLobby.hello(mySeat, DATA_VER));
    return ()=>{ try{ table.close(); }catch(_){} };
  },[]);

  const step = DawnLobby.stepOf(lob);

  /* ---- ready: build the match, identically on both phones ------------ */
  uE(()=>{
    if(step !== "ready" || match) return;
    const spec = DawnLobby.matchSpec(lob);
    try {
      const m = DawnBuild.buildMatch(spec, {
        db,
        heroes: Object.fromEntries(HEROES.map(h=>[h.k,h])),
        decks:  Object.fromEntries(HEROES.map(h=>[h.k,PARSED[h.k]]))
      });
      setMatch({...m, g: DawnJudge.newMatch({builds:m.builds, names:m.names,
        heroKeys:m.heroKeys, first:m.first, seed:m.seed})});
    } catch(e){ setErr("Could not deal the match: " + (e.message||e)); }
  },[step, match]);

  const foeKey = lob.heroes[1-mySeat];
  const foeH   = foeKey ? HEROES.find(h=>h.k===foeKey) : null;
  const myKey  = lob.heroes[mySeat];
  const myH    = myKey ? HEROES.find(h=>h.k===myKey) : null;
  const waiting = DawnLobby.waitingOn(lob).indexOf(mySeat) < 0
                  && DawnLobby.waitingOn(lob).length > 0;

  const head = (
    <div className="tblhead">Table {code}
      <span className="tblseat">seat {mySeat} · {host ? "host" : "guest"}</span></div>
  );

  if(step === "fault") return (
    <div className="tblwrap">{head}
      <div className="tblerr">{lob.fault}</div>
      <p className="mnote">Both phones must hold the same card data. Reload the
        page on the older one — the database is cached under its version key,
        so a reload re-fetches it.</p>
      <button className="a" onClick={onExit}>Leave the table</button>
    </div>
  );

  if(match) return <TableBoard match={match} mySeat={mySeat} host={host} code={code} db={db}
    table={table} netRef={netRef} netQ={netQ} onExit={onExit}/>;

  /* ---- the sideboard: the trainer's own loadout screen ---------------- */
  if(step === "board" && myH){
    if(lob.boards[mySeat]) return (
      <div className="tblwrap">{head}
        <div className="tblstat live"><span className="tbldot"></span>
          Sideboard locked — waiting on {foeH ? foeH.n.split(",")[0] : "them"}…</div>
        <button className="a" onClick={onExit}>Leave the table</button>
      </div>
    );
    return <Loadout h={myH} db={db} netFoe={foeH} netOnPlay={lob.first === mySeat}
      onBack={onExit}
      onStart={cfg=>say(DawnLobby.sideboard(mySeat, cfg.gearIdx, cfg.cuts))}/>;
  }

  return (
    <div className="tblwrap">{head}

      <div className="lobsteps">
        {["hero","throw","board"].map(s=>(
          <span key={s} className={"lobstep"+(s===step?" on":"")
            +(DawnLobby.STEPS.indexOf(s) < DawnLobby.STEPS.indexOf(step)?" done":"")}>{s}</span>
        ))}
      </div>

      {/* ---- 1. the hero ---- */}
      {step === "hero" && <>
        <p className="note" style={{marginTop:0}}>
          Choose your fighter. Neither of you sees the other's pick until both are in.
        </p>
        <div className="lobheroes">
          {HEROES.map(x=>(
            <button key={x.k} className={"lobhero"+(pick===x.k?" on":"")}
              disabled={lob.heroes[mySeat]!=null}
              onClick={()=>setPick(x.k)}>
              <div className="lhport"><HeroArt h={x} db={db}/></div>
              <span className="lhn">{x.n.split(",")[0]}</span>
              <span className="lhc">{x.cls}</span>
            </button>
          ))}
        </div>
        {lob.heroes[mySeat]==null
          ? <button className="bigbtn" disabled={!pick}
              onClick={()=>say(DawnLobby.hero(mySeat, pick))}>
              {pick ? "Lock in "+HEROES.find(h=>h.k===pick).n.split(",")[0] : "Pick a hero"}
            </button>
          : <div className="tblstat live"><span className="tbldot"></span>
              Locked. Waiting on the other seat…</div>}
      </>}

      {/* ---- 2. the throw ---- */}
      {step === "throw" && <TableThrow lob={lob} mySeat={mySeat} myH={myH} foeH={foeH}
        onThrow={t=>say(DawnLobby.throwIt(mySeat, lob.round, t))}/>}

      {/* ---- 3. the seating call ---- */}
      {/* `rps` as well as `lobseat`: .rtitle/.rsub/.rseatpick are all scoped
          under `.rps` in the stylesheet, so without it this screen rendered
          as unspaced run-on text —
          "I go firsttake the initiativeThey go firstkeep the extra card".
          Clickable, and illegible. The solo Pregame wraps in `.rps` and
          always looked right, which is how the table's copy drifted. */}
      {step === "seat" && <div className="lobseat rps">
        <div className="rtitle">{lob.winner===mySeat ? "You won the throw" : "They won the throw"}</div>
        {lob.winner===mySeat
          ? <>
              <p className="rsub">The winner does not go first — the winner <b>chooses</b>.<br/>
                Going first buys initiative; going second keeps a card.</p>
              <div className="rseatpick">
                <button className="go" onClick={()=>say(DawnLobby.seating(mySeat,"first"))}>
                  I go first<span className="sub">take the initiative</span></button>
                <button onClick={()=>say(DawnLobby.seating(mySeat,"second"))}>
                  They go first<span className="sub">keep the extra card</span></button>
              </div>
            </>
          : <div className="tblstat live"><span className="tbldot"></span>
              {(foeH?foeH.n.split(",")[0]:"They")} is deciding the seating…</div>}
      </div>}

      {step === "board" && !myH && <div className="tblstat">Waiting…</div>}

      {err && <div className="tblerr">{err}</div>}
      <p className="mnote">
        Table play runs <strong>two real hero decks</strong> through
        engine/judge.js — the CR turn structure, priority, the combat chain,
        printed costs and <strong>card text</strong>, which resolves through
        the same engine/effects.js the solo trainer uses. One copy of the
        rules, two seats.
      </p>
      <button className="a" onClick={onExit}>Leave the table</button>
    </div>
  );
}

/* The throw. Both seats commit before either reveals — cheap, and the
   alternative is a screen that shows you the answer before it asks the
   question. Ties replay rather than counting, which is rps.js's rule. */
function TableThrow({lob, mySeat, myH, foeH, onThrow}){
  const mine = lob.throws[mySeat], theirs = lob.throws[1-mySeat];
  const both = mine != null && theirs != null;
  const last = lob.rounds[lob.rounds.length-1] || null;
  return (
    <div className="rps">
      <div className="rtitle">The Throw</div>
      <p className="rsub">Winner decides who takes the first turn.<br/>
        {lob.ties>0 ? <>Tied <b>{lob.ties}</b> — throw again.</> : "Both throws land at once."}</p>
      <div className="rtable">
        <div className="rseat">
          <span className="rwho">You · {myH?myH.n.split(",")[0]:"—"}</span>
          <span className="rglyph">{mine ? (both?RPS_GLYPH[mine]:"🔒") : "✊"}</span>
          <span className="rname">{mine ? (both?mine:"locked") : "choose"}</span>
        </div>
        <span className="rvs">VS</span>
        <div className="rseat">
          <span className="rwho">{foeH?foeH.n.split(",")[0]:"Them"}</span>
          <span className="rglyph">{theirs ? (both?RPS_GLYPH[theirs]:"🔒") : "✊"}</span>
          <span className="rname">{theirs ? (both?theirs:"locked") : "shaking"}</span>
        </div>
      </div>
      <div className="rcall">
        {mine==null && <span>Pick your throw.</span>}
        {mine!=null && !both && <span>Locked in. Waiting on them…</span>}
        {last && <span>{RPS_GLYPH[last[0]]} vs {RPS_GLYPH[last[1]]}</span>}
      </div>
      {mine==null && <div className="rthrows">
        {RPS_THROWS.map(t=>(
          <button key={t} onClick={()=>onThrow(t)}>
            <span className="g">{RPS_GLYPH[t]}</span><span className="l">{t}</span>
          </button>))}
      </div>}
    </div>
  );
}

/* ============================================================
   THE BOARD — two hero decks, one game state, two phones. (v2.50)

   IT IS THE TRAINER'S BOARD, WITH A PERSON IN SEAT 1. Same three flick
   screens, same armour grid, same hero row, same hand rail, same two-tap
   peek, same action bar. The plain diagnostic board this replaces proved
   the transport and looked nothing like the game — and "looks nothing
   like the game" is a real defect in a training sim, because the layout
   IS the lesson.

   The shared pieces are shared for real (ArmorGrid, DeckPitchCol,
   InPlayRow, GravePane, usePeek, CardFrame, ChainLink, Ticker), so the
   two boards cannot drift apart. What is deliberately NOT shared is the
   state language: the trainer speaks `mode`/`bphase`, this speaks the CR
   machine — `phase`/`step`/`priority` out of priority.js. Those are the
   two things the rebuild exists to separate, and folding them back
   together here would undo it.

   Every control is gated by `DawnJudge.legal`, the SAME predicate the
   sequencer applies on the other phone: a button that is live here is an
   action that will be accepted there. That is what makes the hand-dim
   honest, and a card that looks playable and does nothing when tapped is
   the failure mode this codebase cares most about.

   THREE THINGS THE TRAINER SHOWS THAT THIS CANNOT, and each is honest
   rather than hidden: no Advisor (it reads the trainer's `built` and
   coaches card text that does not resolve here), no boost toggle, and no
   next-swing prediction — seat 1 is a person, so there is nothing to
   predict.
   ============================================================ */
function TableBoard({match, mySeat, host, code, db, table, netRef, netQ, onExit, local, heroKey, onRecord}){
  const [g,setG]     = uS(match.g);
  const [note,setNote] = uS(null);
  const [link,setLink] = uS("connected");
  const [zoom,setZoom] = uS(null);
  const [inspect,setInspect] = uS(false);
  const [bug,setBug] = uS(false);
  const sess = uR(null);

  /* THE INVARIANT JUDGE, ON THE TABLE'S OWN FUNNEL. In the trainer every
     state change passes through `setG`, which is where the judge is
     wired. Here the funnel is net.js's `onState` — it fires for local
     submits, remote commits and snapshot adoptions alike, which is the
     same "exactly one description of how an action becomes a state" the
     session already guarantees. Without this the guard rails are dark on
     precisely the board where a bad state is hardest to reconstruct. */
  const judgeRef = uR([]);
  const [judgeN,setJudgeN] = uS(0);
  const audit = st => {
    try {
      const bad = DawnInvariants.errors(st);
      if(!bad.length) return;
      const seen = judgeRef.current;
      for(const v of bad){
        if(seen.some(x=>x.code===v.code && x.msg===v.msg)) continue;
        seen.push({turn:st.turn, phase:st.phase, step:st.step, code:v.code, msg:v.msg});
        console.error("[dawnblade judge · table] "+v.code+" — "+v.msg);
      }
      window.__dawnJudge = seen;
      setJudgeN(seen.length);
    } catch(e){ /* the judge must never be the thing that breaks play */ }
  };

  const oppRef = uR(null), chainRef = uR(null), youRef = uR(null);
  const jump = r => r.current && r.current.scrollIntoView({behavior:"smooth", block:"start"});

  /* THE CATALOG IS NOT AN OPTIMISATION HERE, IT IS WHAT MAKES THE
     HANDSHAKE FIT DOWN THE PIPE. Without it the opening snapshot ships
     every card's full definition and measured **97KB**, which a WebRTC
     data channel drops on the floor without an error — the guest sat in
     `handshaking` forever, holding a board that looked perfectly correct
     because it had built the same game itself. wire.js already had the
     answer: with a catalog the dictionary ships bare `name|pitch` keys
     and the payload falls by roughly 10x.

     Built from the MATCH's own cards rather than the whole 807-card
     database — every card either seat can hold is in one of these zones,
     and a card the catalog misses still ships its own definition
     (wire.js's per-entry fallback), so a miss costs bytes and never
     correctness. Both peers build identical builds from the lobby spec,
     so both derive an identical catalog; `catalogHash` rides in the
     payload and `decode` refuses a mismatch. */
  const catalog = uM(()=>DawnWire.makeCatalog(
    match.builds.flatMap(b=>[...(b.deck||[]), ...(b.gear||[]),
                             ...(b.startItem?[b.startItem.card]:[])])),[match]);

  uE(()=>{
    /* ---- A SESSION WITH NO NETWORK (v2.79) --------------------------
       The board does not learn a second way to play a game. `local.js`
       exposes exactly the surface net.js does — submit, state, seq,
       hash, stats — so everything below this block is identical whether
       the other seat is a person on another phone or a policy in this
       one. That is the merge finishing: solo and table stop being two
       screens as well as two engines.

       The seat opposite is `sparring.act`, which reads NO card text and
       offers every action to `judge.legal` before proposing it. It is a
       weaker opponent than the trainer's tuned escalation and that is a
       stated trade, not an oversight — the [3,4,5] table was TUNED and
       real cards from a real hand are not. Retuning is a play session. */
    if(local){
      const s = DawnLocal.createLocal({
        seat: mySeat,
        state: match.g,
        reduce: DawnJudge.reduce,
        legal:  DawnJudge.legal,
        policy: (st, i) => DawnSparring.act(st, i),
        hash:   st => st ? DawnWire.hash(st) : null,
        onState: st => { setG(st); setNote(null); audit(st); },
        onEvent: e => {
          if(e.t==="refused") setNote(e.reason);
          /* A POLICY REFUSAL IS A BUG IN THE POLICY, not a move the
             player made — sparring.js asks `legal` before it proposes,
             so this can only mean the two disagreed. It goes on the
             screen rather than into the console, because the console is
             not a thing anyone reads on a phone. */
          else if(e.t==="policy-refused") setNote("The opponent proposed an illegal action: " + e.reason);
          else if(e.t==="stalled") setNote("The opponent could not stop — " + e.reason);
        }
      });
      sess.current = s; netRef.current = null;
      window.__dawnTable = {session: s, seat: mySeat, host: true, code: "local",
        report: () => ({seat: mySeat, local: true, status: s.status(), seq: s.seq(),
                        hash: s.hash(), stats: s.stats(),
                        phase: (s.state()||{}).phase, step: (s.state()||{}).step,
                        priority: (s.state()||{}).priority})};
      setLink("connected");
      s.start();
      return ()=>{};
    }
    const s = DawnNet.createSession({
      seat: mySeat, host,
      reduce: DawnJudge.reduce,
      legal:  DawnJudge.legal,
      catalog,
      /* Pins what "the same game" means at the handshake. The lobby has
         already checked it, so this is the belt to that braces. */
      build:  DATA_VER,
      state:  host ? match.g : null,
      send:   m => table.send({ch:CH_NET, m}),
      onState: st => { setG(st); setNote(null); audit(st); },
      onEvent: e => {
        if(e.t==="refused")             setNote(e.reason);
        else if(e.t==="desync")         setLink("repairing");
        else if(e.t==="snapshot-applied"||e.t==="catchup-applied") setLink("connected");
        else if(e.t==="refused-by-host")setNote("Refused: "+e.reason);
        else if(e.t==="snapshot-failed")setNote("The other phone sent a game this build cannot read.");
      }
    });
    sess.current = s; netRef.current = s;
    /* THE INTERNAL TESTING HOOK. Same reasoning as JUDGE!! in the
       trainer: the expensive part of a two-phone bug is never noticing
       it, it is reconstructing what each side thought was true. One
       console read on either phone gives status, sequence, hash and
       counters — and two phones on different hashes at the same `seq`
       is a desync, stated in one line. */
    window.__dawnTable = {session: s, seat: mySeat, host, code,
      report: () => ({seat: mySeat, host, status: s.status(), seq: s.seq(),
                      hash: s.hash(), stats: s.stats(),
                      phase: (s.state()||{}).phase, step: (s.state()||{}).step,
                      priority: (s.state()||{}).priority})};
    const q = netQ.current; netQ.current = [];
    q.forEach(m => s.receive(m));
    if(!host) s.join();
    /* A HANDSHAKE THAT NEVER COMPLETES MUST NOT LOOK LIKE A QUIET TABLE.
       When the 97KB snapshot was being dropped, every visible thing was
       right — the board was dealt, the feed read correctly, it simply
       said "waiting on them" forever. The status was the only thing that
       knew, so it goes on the screen. */
    const watch = setInterval(()=>{
      const st = s.status();
      setLink(st === "ready" ? l => l==="repairing" ? l : "connected" : st);
    }, 1200);
    return ()=>{ clearInterval(watch); netRef.current = null; };
  },[]);

  const me = g.sides[mySeat], them = g.sides[1-mySeat];
  const myH  = HEROES.find(x=>x.k===me.heroKey);
  const foeH = HEROES.find(x=>x.k===them.heroKey);
  const myBuild = match.builds[mySeat] || {};
  const mine = a => DawnJudge.legal(g, a, mySeat) === null;
  const fire = a => { const why = sess.current.submit(a); setNote(why||null); };
  const over = g.over;
  /* A PENDING IS ONE FIELD AND FOUR KINDS (v3.35), so it is split by kind
     here rather than at each reader.

     WHITELIST, NEVER BLACKLIST. This read `kind !== "boost"` and every
     other kind therefore rendered as a PAYMENT — so the split-card
     declaration opened a pitch sheet that said "covered ✓" for a card
     costing 0, and Pitch & play then sent `payConfirm`, which `legal`
     refuses with "declare which half first". A dead end the player could
     only leave by cancelling: reported from a real table on turn 1.

     The same shape as the migration's own rule about which holders may be
     rewritten, and the reason the fix is a whitelist is that the next
     kind added would have walked into it too. `judge.PENDING_KINDS` is
     the list; a kind with no branch here is a screen with no exit. */
  const myPend = g.pending && g.pending.seat === mySeat ? g.pending : null;
  const kindIs = k => myPend && myPend.kind === k ? myPend : null;
  const pay    = kindIs("pay");
  const boost  = kindIs("boost");
  const addPay = kindIs("addPay");
  const split  = kindIs("split");
  const theirPay  = g.pending && g.pending.seat !== mySeat;
  const myArsStep = g.phase === "end" && g.arsenalFor === mySeat;
  const defending = DawnPriority.canDeclareDefenders(g, mySeat);
  const myTurn = g.priority === mySeat;

  /* A stale peek commits the wrong action on its second tap, so it is
     dropped whenever the window it was armed in closes. */
  const {peek, setPeek, tapTwice} = usePeek(
    g.phase+"/"+g.step+"/"+g.priority+"/"+g.turn+"/"+(pay?"pay":""), inspect, setZoom);

  /* CR 1.4.5 — with an ally in the arena, declaring an attack is a
     mandatory choice. With one candidate the picker never appears, which
     is every game until somebody lands an ally. */
  /* THE SCORE IS THE TRAINER'S, and it is computable here for free: score
     is turns + wasted, and `wasted` has been kept for BOTH seats since
     priority.js's endTurn started fizzling both (CR 4.4.3e). Recorded only
     for a local win — see the reveal block below for why beating a person
     earns no pull. Keyed off `g.over` exactly as the trainer's is, so a
     re-render cannot record twice. */
  uE(()=>{ if(over && local && over.winner===mySeat && onRecord && heroKey)
             onRecord(heroKey, g.turn + (me.wasted||0)); },[g.over]);

  const targets = DawnJudge.targets(g, 1-mySeat, them.heroCard);
  const [tgt,setTgt] = uS(null);
  const needTarget = targets.length > 1;
  const playAct = (c, from) => {
    const a = {t:"play", uid:c.uid, from};
    if(needTarget && DawnParser.isAttack(c)) a.target = tgt || targets[0];
    return a;
  };

  const peekables = () => [...me.hand, ...me.gear, ...(me.arsenal?[me.arsenal]:[]),
                           ...me.board.map(b=>b.card)];

  /* One gear tile, for either seat. Yours is tappable — swing it or
     raise it — theirs opens the card, because it is not actionable and
     there is nothing to commit to (the trainer's own rule). */
  const gearTile = (own) => (gr, z) => {
    const spent = (own?me:them).weaponUsed && (own?me:them).weaponUsed[gr.uid];
    const blocking = own && (me.blockG||[]).indexOf(gr.uid) >= 0;
    /* A PIECE THAT PRINTS NO DEFENCE SHOWS NO DEFENCE BADGE. `gearDef`
       returns 0 for a weapon, and passing that through paints a blue "0"
       on every sword — the trainer's gearBtn asks whether the piece has
       a printed or current defence at all, and so does this. */
    const dshow = gr => (gr.def!=null||gr.curDef!=null) ? gearDef(gr) : null;
    const def = dshow(gr);
    const worn = gearDef(gr)===0 && gr.def!=null;
    const style = z && z!=="misc" ? {gridArea:z} : undefined;
    if(!own) return (
      <button key={gr.uid} className={"g clip-sm"+(worn?" used":"")
        +((them.blockG||[]).indexOf(gr.uid)>=0?" sel":"")} style={style}
        onClick={()=>setZoom(gr)}>
        <span className={"tapwrap"+(spent&&/\btap\b|\{t\}/i.test(gr.tx||"")?" tapped":"")}>
          <CardFrame card={{...gr, def}} className="sm"/></span>
      </button>);
    const swing  = {t:"activate", uid:gr.uid};
    const defend = {t:"defend", uid:gr.uid};
    /* `cellAct`, never `act` — a local named `act` shadows the global actor
       helper for its whole closure. That is not hypothetical: the identical
       shape with `foe` in takeIt's clash loop crashed the trainer outright
       (v2.54). Nothing here needs the acting side today, which is exactly
       how the other one survived unnoticed for so long. */
    const cellAct = mine(swing) ? swing : mine(defend) ? defend : null;
    const verb = cellAct ? (cellAct.t==="activate" ? "swing" : blocking ? "stop defending" : "defend") : null;
    return (
      <button key={gr.uid} className={"g clip-sm"+(worn?" used":"")+(blocking?" sel":"")
        +(peek&&peek.uid===gr.uid?" peek":"")+(cellAct?"":" dis")} style={style}
        onClick={cellAct ? tapTwice(gr, verb, ()=>fire(cellAct)) : ()=>setZoom(gr)}>
        {blocking && <span className="defsel">⛨ DEF</span>}
        <span className={"tapwrap"+(spent&&/\btap\b|\{t\}/i.test(gr.tx||"")?" tapped":"")}>
          <CardFrame card={{...gr, def}} className="sm"/></span>
      </button>);
  };

  /* Weapons sit in the hero row, armour in the grid — the same split the
     trainer draws, read off the printed slot. */
  const handsOf = sd => (sd.gear||[]).filter(x=>["1h","2h","off","qvr"].includes(slotOf(x).z));
  const armorOf = sd => (sd.gear||[]).filter(x=>!["1h","2h","off","qvr"].includes(slotOf(x).z));
  const myHands = handsOf(me), foeHands = handsOf(them);

  const handCell = c => {
    const play   = playAct(c, "hand");
    const defend = {t:"defend", uid:c.uid};
    const ars    = {t:"arsenal", uid:c.uid};
    const paySel = {t:"paySel", uid:c.uid};
    const pitched = pay && (me.paySel||[]).indexOf(c.uid) >= 0;
    const blocking = (me.blockH||[]).indexOf(c.uid) >= 0;
    /* THE DIM MUST ASK EXACTLY WHAT THE TAP ASKS, or a card looks
       playable and refuses when tapped. Both come from `legal`. */
    const cellAct = pay ? (mine(paySel) ? paySel : null)
      : myArsStep ? (mine(ars) ? ars : null)
      : mine(play) ? play
      : mine(defend) ? defend : null;
    const verb = !cellAct ? null
      : cellAct.t==="paySel" ? (pitched ? "unpitch" : "pitch")
      : cellAct.t==="arsenal" ? "set in arsenal"
      : cellAct.t==="defend" ? (blocking ? "stop defending" : "defend")
      : DawnParser.isAttack(c) ? "attack" : "play";
    return (
      <button key={c.uid}
        className={"hc clip-sm"+((pitched||blocking)?" sel":"")+(cellAct?"":" dis")
          +(peek&&peek.uid===c.uid?" peek":"")}
        onClick={cellAct ? tapTwice(c, verb, ()=>fire(cellAct)) : ()=>setZoom(c)}>
        {blocking && <span className="defsel">⛨ DEF</span>}
        {pitched && <span className="defsel">◈ {c.pitch}</span>}
        <CardFrame card={c}/>
      </button>);
  };

  /* The defending wall, as the trainer draws it: whatever each seat has
     actually declared against the open link. */
  const declared = sd => [...(sd.blockH||[]).map(u=>(sd.hand||[]).find(c=>c.uid===u)),
                          ...(sd.blockG||[]).map(u=>(sd.gear||[]).find(c=>c.uid===u))].filter(Boolean);

  const pips = [];
  if(me.res>0)             pips.push(["floating "+me.res, "on"]);
  if(me.ap>0)              pips.push(["action point", "on"]);
  if(runeCount(me)>0)      pips.push(["runechant ×"+runeCount(me), "on"]);
  if(me.ward>0)            pips.push(["ward "+me.ward, "on"]);
  if(frostCount(them)>0)   pips.push(["they are frostbitten "+frostCount(them), ""]);
  if(g.chain.length)       pips.push(["chain link "+g.chain.length, ""]);
  if(link!=="connected")   pips.push([link, "warn"]);

  const featured = g.featured;

  return (
    <div className="board">
      <div className="screennav">
        <button onClick={onExit} style={{flex:.7}}>✕ leave</button>
        <button onClick={()=>jump(oppRef)}>▲ {foeH?foeH.n.split(",")[0]:"Opp"}</button>
        <button onClick={()=>jump(chainRef)}>Chain</button>
        <button onClick={()=>jump(youRef)}>You ▼</button>
      </div>

      <div className="tablewrap">
        {/* ---- SCREEN 1: their board ---- */}
        <div className="vscreen" ref={oppRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>{them.name} · seat {1-mySeat}</span><span>swipe → graveyard</span></div>
              <div className="midrow">
                <ArmorGrid gear={armorOf(them)} cell={gearTile(false)}/>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{them.arsenal
                    ? <button style={{padding:0,width:"100%"}} onClick={()=>setZoom(them.arsenal)}>
                        <CardFrame card={them.arsenal} className="sm"/></button>
                    : "arsenal —"}</div>
                  <span className="zlbl">holds {them.hand.length} · blocks from hand</span>
                </div>
                <DeckPitchCol deck={them.deck} pitch={them.pitch} title="Pitch"/>
              </div>
              <div className="heror">
                <div className={"wslot clip-sm"+(foeHands[0]?" filled":"")}>
                  {foeHands[0] ? gearTile(false)(foeHands[0]) : <span className="wempty">weapon —</span>}
                </div>
                <div className="heromid clip-sm">
                  {foeH ? <div className="hport2"><HeroArt h={foeH} db={db}/></div> : null}
                  <span className="hname">{them.name}</span>
                  <b className="hlife2">{Math.max(0,them.hp)}</b>
                  <span className="hlbl">{g.turnPlayer===1-mySeat ? "their turn" : "life"}</span>
                </div>
                <div className={"wslot clip-sm"+(foeHands[1]?" filled":"")}>
                  {foeHands[1] ? gearTile(false)(foeHands[1]) : <span className="wempty">weapon —</span>}
                </div>
              </div>
              <div className="vfillsp"/>
              <div style={{marginTop:8}}>
                <InPlayRow entries={them.board||[]} empty={"nothing yet — "+them.name+"'s auras, items and allies land here"}
                  cell={b=>(
                    <button key={b.uid} className="b clip-sm" style={{width:52,flex:"none"}} onClick={()=>setZoom(b.card)}>
                      <CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/>
                      {b.kind==="ally" && b.life!=null && <span className="sw">♥ {b.life}</span>}
                    </button>)}/>
              </div>
            </div>
            <GravePane sd={them} who={them.name+"'s"} mine={false}/>
          </div>
        </div>

        {/* ---- SCREEN 2: the chain ---- */}
        <div className="vscreen" ref={chainRef}>
          <div className="hscroll">
            <div className="hpane logpane">
              <div className="paneflag">
                <span>log</span>
                {/* Same button, same sheet, same report shape as the
                    trainer — and here it carries the seat, the table code
                    and net.js's counters, because the first question
                    about a two-phone bug is which phone saw it. */}
                <button className="judgebtn" onClick={()=>setBug(true)}>
                  JUDGE!!{judgeN>0?` ⚠${judgeN}`:""}
                </button>
                <span>play →</span></div>
              <div className="scorebar clip-sm">
                <span className="sside"><span className="hpme">{me.hp}</span> you · R<b>{me.res}</b> A<b>{me.ap}</b></span>
                <span className="sside r">{them.name.split(",")[0].toLowerCase()} <span className="hpopp">{Math.max(0,them.hp)}</span></span>
              </div>
              {/* the turn and the phase — see stepLabel, which reads the CR
                  machine because `mode` is frozen on this board */}
              <div className="phasebar clip-sm">
                <span>turn <b>{g.turn}</b></span>
                <span className="ph">{stepLabel(g, mySeat)}</span>
              </div>
              <div style={{marginTop:6}}><Ticker feed={g.feed}/></div>
              {/* ---- CLAUDE'S CALL, AT THE TABLE (v2.83) ------------------
                  This board had no advisor, and the stated reason — that it
                  "would coach card text that does not resolve here" — has
                  been false since v2.77, when judge.js started resolving
                  every card effect through engine/effects.js. What was
                  actually missing was the WINDOW: `advise` read `g.mode`,
                  which judge seeds once and never writes, so it would have
                  coached the action phase in every step of every turn.
                  `advView` derives it from the CR machine instead.

                  LOCAL SESSIONS ONLY, and that is a decision rather than a
                  limit of the machinery. Across a network the seat opposite
                  is a PERSON: `advCardOut` prices your line against the
                  opponent's gear and hand, which at a table is reading a
                  board you can see but coaching against an opponent who is
                  choosing — and the trainer's whole framing is that the
                  advisor reads a punching bag. Turn it on for a person only
                  as a deliberate call.

                  AND SEAT 0 ONLY, stated rather than assumed. `advise` reads
                  its own hand through `you(g)`, which is `sides[0]` — a
                  module-local accessor, not the seat it was handed. Asking
                  `advView` for seat 1 while `advise` coached seat 0's hand
                  would derive the right window for the wrong player, and it
                  would read as ordinary bad advice. A local session always
                  seats you at 0, so this costs nothing today and cannot go
                  quietly wrong if that ever changes. */}
              {local && mySeat === 0 && <Advisor g={g}
                ctx={{...advView(g, mySeat),
                      runeDmg: myBuild.runeDmg, hpow: myBuild.HPOW, boostOn: false,
                      dBlk: (them.gear||[]).filter(x=>gearDef(x)>0).length
                          + (them.hand||[]).filter(c=>(c.def||0)>0).length,
                      dDef: gearDef((them.gear||[]).find(x=>gearDef(x)>0)||{})||1}}
                read={myBuild.read}/>}
              <div className="gamelog" style={{marginTop:8}}>{[...(g.feed||[])].reverse().map((l,i)=><div key={i} className="gl">{l}</div>)}</div>
            </div>

            <div className="hpane playpane">
              <div className="dhand"><span className="hlbl">{them.name.split(",")[0]}</span>
                {them.hand.map(c=><div key={c.uid} className="dcardph"/>)}</div>
              <div className="playmid">
                <div className="sidecol stack">
                  <div className="scol-lbl">Chain</div>
                  <div className="scol-cards">
                    {g.chainOpen && g.pend
                      ? <div className="stackcard"><CardImg card={g.pend.card}/></div>
                      : <div className="dash">—</div>}
                  </div>
                </div>
                <div className="centerslot">
                  {featured
                    ? <div className="featured"><CardFrame card={featured.card}/></div>
                    : <div className="featempty">Most recently played lands here</div>}
                </div>
                <div className="sidecol defend">
                  <div className="scol-lbl">Defend</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = [...declared(me), ...declared(them)];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>)
                                       : <div className="dash">—</div>; })()}
                  </div>
                </div>
              </div>

              {/* The status line says what the CR machine is asking of
                  THIS seat, in the trainer's voice. */}
              {over ? <div className="statusline">{over.winner===mySeat?"You win":"You lose"} — {g.sides[over.winner].name} takes it on {over.how}.</div>
                : boost ? <div className="statusline">Boost <b>{boost.card.name}</b>? Banish the top card of your deck as an additional cost — a <b>Mechanologist</b> card grants go again.</div>
                : pay ? <div className="statusline">Paying <b>{pay.card.name}</b> — tap cards below to pitch · {(()=>{const short=Math.max(0,pay.need-me.res-DawnJudge.paySum(me)); return short>0?<span>need <b>{short}</b> more</span>:<span>covered ✓</span>;})()}
                    <button onClick={()=>fire({t:"payCancel"})}>✕ cancel</button></div>
                : theirPay ? <div className="statusline">{them.name} is paying for something…</div>
                : myArsStep ? <div className="statusline">Tap a card below for <b>arsenal</b>
                    <button onClick={()=>fire({t:"arsenal",uid:null})}>skip</button></div>
                : g.phase==="end" ? <div className="statusline">End phase — {them.name} is finishing their turn.</div>
                : defending ? <div className="statusline">Defend step — tap hand &amp; equipment to declare · incoming <b>{g.pend?g.pend.total:0}</b></div>
                : myTurn ? <div className="statusline">{g.step==="layer" ? <span>Your window — play, or pass</span>
                    : <span>{g.step} step — react from floating <b>{me.res}</b> or pass</span>}</div>
                : <div className="statusline">Waiting on {them.name} — {g.phase} / {g.step}</div>}

              {pips.length ? <div className="rail">{pips.map(([t,cl],i)=>
                <span key={i} className={"rp"+(cl?" "+cl:"")}>{t}</span>)}</div> : null}

              {needTarget && <div className="rail">
                <span className="rp">attack:</span>
                {targets.map((t,i)=>(
                  <button key={i} className={"rp"+((tgt||targets[0])===t?" on":"")}
                    onClick={()=>setTgt(t)}>{t.kind==="hero"?them.name.split(",")[0]:"ally"}</button>))}
              </div>}

              <div className="phand"><span className="hlbl">Hand</span>
                {me.hand.map(handCell)}
                {me.arsenal && (()=>{
                  const a = {t:"play", uid:me.arsenal.uid, from:"arsenal"};
                  const ok = mine(a);
                  return <button key={me.arsenal.uid}
                    className={"hc clip-sm"+(ok?"":" dis")+(peek&&peek.uid===me.arsenal.uid?" peek":"")}
                    onClick={ok ? tapTwice(me.arsenal,"play from arsenal",()=>fire(a)) : ()=>setZoom(me.arsenal)}>
                    <CardFrame card={me.arsenal} zone="arsenal"/></button>;
                })()}
              </div>
            </div>

            <div className="hpane">
              <div className="paneflag"><span>← play</span><span>the chain</span></div>
              {!g.chain.length && <p className="note">No links yet — play an attack to start the chain.</p>}
              {!!g.chain.length && <div className="histturn"><div className="htlabel">This chain</div>
                <div className="chain">{g.chain.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>}
            </div>
          </div>
        </div>

        {/* ---- SCREEN 3: your board ---- */}
        <div className="vscreen" ref={youRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>Your board · seat {mySeat}</span><span>swipe → graveyard</span></div>
              {!myTurn && !defending && !myArsStep && !over &&
                <div className="modehint">Waiting on {them.name} — flick up to the chain screen</div>}
              <InPlayRow entries={me.board} cell={(b,i)=>(
                <button key={b.uid} className={"b clip-sm"+(b.spent?" spent":"")} style={{width:52,flex:"none"}}
                  onClick={()=>setZoom(b.card)}>
                  <span className={"tapwrap"+((b.spent&&/\btap\b|\{t\}/i.test(b.card.tx||""))?" tapped":"")}>
                    <CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/></span>
                  {b.kind==="ally" && b.life!=null && <span className="sw">♥ {b.life}</span>}
                </button>)}/>
              <div className="heror">
                <div className={"wslot clip-sm"+(myHands[0]?" filled":"")}>
                  {myHands[0] ? gearTile(true)(myHands[0]) : <span className="wempty">weapon 1</span>}
                </div>
                <div className="heromid clip-sm">
                  <button className="hport2" onClick={()=>setZoom(myBuild.HZOOM)}>
                    {myH ? <HeroArt h={myH} db={db}/> : null}</button>
                  <span className="hname">{me.name.split(",")[0]}</span>
                  <b className="hlife2">{Math.max(0,me.hp)}</b>
                  <span className="hlbl">life</span>
                  {/* THE SAME CHIP THE TRAINER DRAWS (v3.39) — a counter
                      the ability spends has to be visible on the board the
                      ability is played on. */}
                  {(()=>{ const ct=(me.counters||{}).hero||{};
                    const ks=Object.keys(ct).filter(k=>ct[k]>0);
                    if(!ks.length) return null;
                    return <span className="ctr">{ks.map(k=>
                      <span key={k} className="cc steam" title={k}>{k[0].toUpperCase()}{ct[k]}</span>)}</span>; })()}
                  {/* AND THE HERO POWER ITSELF, which this board never
                      offered: `doActivate` had no "hero" route until v3.39,
                      so an ACTIVATED hero ability was unreachable here.
                      Dimmed off `legal`, like every other tap at this
                      table, so the button and the rule cannot disagree. */}
                  {myBuild.heroPow && (()=>{ const A={t:"activate",from:"hero",uid:"hpow"};
                    const ok=mine(A);
                    return <button className="hact clip-sm" style={{padding:"5px 8px",fontSize:11}}
                      disabled={!ok} title={ok?"":String(DawnJudge.legal(g,A,mySeat)||"")}
                      onClick={()=>fire(A)}>{(me.weaponUsed||{})["hpow"]?"USED":"⚡ USE"}</button>; })()}
                </div>
                <div className={"wslot clip-sm"+(myHands[1]?" filled":"")}>
                  {myHands[1] ? gearTile(true)(myHands[1])
                    : <span className="wempty">{myHands[0]&&slotOf(myHands[0]).z==="2h" ? "2H occupies both hands" : "weapon 2 / off-hand"}</span>}
                </div>
              </div>
              <div className="midrow">
                <ArmorGrid gear={armorOf(me)} cell={gearTile(true)}/>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{me.arsenal
                    ? <button style={{padding:0,width:"100%"}} onClick={()=>setZoom(me.arsenal)}>
                        <CardFrame card={me.arsenal} className="sm"/></button>
                    : "arsenal"}</div>
                  <span className="zlbl">Arsenal</span>
                </div>
                <DeckPitchCol deck={me.deck} pitch={me.pitch}/>
              </div>
              <div className="vfillsp"/>
              <div className="mystat" style={{marginTop:8}}>
                <span className="pill">TURN <b>{g.turn}</b></span>
                <span className="pill">SEAT <b>{mySeat}</b></span>
                <span className="pill">{host?"HOST":"GUEST"}</span>
                <button className={"pill"+(inspect?" hp":"")} onClick={()=>setInspect(v=>!v)}>ℹ {inspect?"inspecting":"inspect"}</button>
              </div>
            </div>
            <GravePane sd={me} who="Your"/>
          </div>
        </div>
      </div>

      {/* The action bar speaks the CR machine, not the trainer's modes.
          CR 4.3.4: ending a turn is a PASS carrying intent, so it takes
          one from each seat — which is what a table does. */}
      <div className="actbar">
        {over ? <button className="a go" onClick={onExit}>Leave the table</button>
          /* BOOST'S ADDITIONAL COST (v2.84) — asked before the payment
             branch because a boost pending and a pay pending are the same
             field, and this one has no Cancel: by the time it is asked the
             play is committed, and "no" is a complete answer to "you may".
             The two buttons say what they do, in the trainer's own words,
             so a player who learns one board is not relearning the other. */
          : boost ? <>
              <button className="a go" onClick={()=>fire({t:"boost",yes:true})}>⚡ Boost</button>
              <button className="a" onClick={()=>fire({t:"boost",yes:false})}>No boost</button>
            </>
          /* WHICH HALF OF A SPLIT CARD (v3.35). Asked before the payment,
             because melding doubles the base cost — and it is the card's
             whole mechanic, so it is a real choice rather than a sheet. */
          : split ? <>
              {(split.halves||[]).map((h,i)=>
                <button key={i} className="a go" onClick={()=>fire({t:"split",half:i})}>{h}</button>)}
              {DawnParser.hasKw(split.card,"meld") &&
                <button className="a" onClick={()=>fire({t:"split",half:"both"})}>Meld both</button>}
            </>
          /* AN OPTIONAL ADDITIONAL COST. No Cancel, for boost's reason:
             the play is committed and "no" is a complete answer. */
          : addPay ? <>
              <button className="a go" onClick={()=>fire({t:"addPay",yes:true})}>Pay {addPay.cost} more</button>
              <button className="a" onClick={()=>fire({t:"addPay",yes:false})}>Decline</button>
            </>
          : pay ? <>
              <button className="a" onClick={()=>fire({t:"payCancel"})}>Cancel</button>
              <button className="a pay" disabled={!mine({t:"payConfirm"})} onClick={()=>fire({t:"payConfirm"})}>Pitch &amp; play</button>
            </>
          : myArsStep ? <>
              <button className="a" onClick={()=>fire({t:"arsenal",uid:null})}>Leave it empty</button>
              <span className="a dis">tap a card to set it</span>
            </>
          /* CR 7.3.3 — IN THE DEFEND STEP THE TURN-PLAYER HOLDS PRIORITY
             while the DEFENDER declares. So the defender really cannot
             pass until the attacker has, and a button reading "Done
             defending" that is permanently dead reads as a broken screen
             rather than as the rule it is. Say which it is. */
          : defending ? <>
              {mine({t:"pass"})
                ? <button className="a go" onClick={()=>fire({t:"pass"})}>Done defending</button>
                : <span className="a dis">declare your blockers — {them.name.split(",")[0]} still holds priority</span>}
              <button className="a" onClick={()=>fire({t:"concede"})}>Concede</button>
            </>
          : <>
              {mine({t:"pass"})
                ? <button className="a" onClick={()=>fire({t:"pass"})}>Pass</button>
                : <span className="a dis">waiting on {them.name.split(",")[0]}</span>}
              <button className="a go" disabled={!mine({t:"endTurn"})} onClick={()=>fire({t:"endTurn"})}>End turn</button>
            </>}
      </div>

      {/* WHO YOU BEAT DECIDES WHETHER IT IS A TROPHY (v2.83).

          The rule here has not changed — "a trophy handed out for a real
          match would quietly devalue the case" — but v2.81 changed who is
          sitting opposite. A seat the dummy fills is ALWAYS the vanilla
          pile, so a LOCAL win is a win over the same punching bag the
          trainer's is, scored the same way (turns + wasted, and `wasted`
          is already kept by priority.js's endTurn for both seats). It
          earns the same pull.

          A NETWORKED win is over a person and still gets the honest words
          and no reward. So the distinction is `local`, and it follows the
          existing rule rather than overriding it. */}
      {over && local && over.winner===mySeat && onRecord
        ? <WinPanel score={g.turn + (me.wasted||0)} onExit={onExit}/>
        : over && <div className={"reveal"+(over.winner===mySeat?"":" lose")} onClick={onExit}>
        <h2 className="disp" style={{marginBottom:14}}>
          {over.winner===mySeat ? "YOU TAKE IT" : "THEY TAKE IT"}</h2>
        <div className="card clip">
          <div className="rar">turn {g.turn} · table {code}</div>
          <h3>{g.sides[over.winner].name} over {g.sides[1-over.winner].name}</h3>
        </div>
        <p style={{marginTop:14,fontSize:13}}>
          {over.how==="life" ? "Life to zero." : "The game ended on "+over.how+"."}
          {" "}{me.hp>0 ? <>You finished on <b className="mono">{me.hp}</b>.</> : null} Tap anywhere.
        </p>
      </div>}

      {note && <div className="tblerr">{note}</div>}
      <CardModal card={zoom} onClose={()=>setZoom(null)}/>
      <JudgeSheet open={bug} onClose={()=>setBug(false)} warn={judgeN}
        meta={`v${window.APP_VER} · table ${code} · seat ${mySeat} · turn ${g.turn} · ${g.phase}/${g.step}`}
        report={note2 => [g, {
          note: note2, source:"table", appVer:window.APP_VER, dataVer:window.DATA_VER,
          hero: me.heroKey, heroName: me.name, mySeat, table: code,
          seating: g.turnPlayer===mySeat ? "you first" : "opponent first",
          invariantsSeen: judgeRef.current,
          /* WHICH PHONE SAW IT. Two peers on different hashes at the same
             `seq` is a desync stated in one line, and it is the first
             thing to check on any table bug. */
          net: sess.current ? {seat:mySeat, host, status:sess.current.status(),
            seq:sess.current.seq(), hash:sess.current.hash(),
            link, ...sess.current.stats()} : null
        }]}/>
      {!over && <PeekDock card={peek && peekables().find(c=>c.uid===peek.uid)}
        verb={peek && peek.verb} onClose={()=>setPeek(null)}/>}
    </div>
  );
}
function App(){
  const [db,reload] = useCardDB();
  const [tab,setTab]=uS("heroes");
  const [hero,setHero]=uS(null);
  const [fighting,setFighting]=uS(null);
  /* The merged engine, played alone. A separate slot from `fighting`
     because they are two different boards and only one may be up. */
  const [localTable,setLocalTable]=uS(null);
  const [loHero,setLoHero]=uS(null);
  /* seating is decided between the loadout and the first draw */
  const [seating,setSeating]=uS(null);
  /* the table: null -> "find" (the code screen) -> {table,host,code} (seated) */
  const [table,setTable]=uS(null);
  const [best,setBest]=uS(()=>store.get("best",{}));
  const record=(k,score)=>setBest(b=>{
    const nb={...b,[k]: b[k]==null?score:Math.min(b[k],score)}; store.set("best",nb); return nb;
  });
  /* One screen at a time. `idle` is the lobby: no match, no loadout, no
     seating throw and nobody at a table. */
  const idle = !fighting && !loHero && !seating && !table && !localTable;
  return (
    <div className="shell">
      {!fighting && !table && !localTable && <div className="topbar">
        <span className="brand">DAWN<em>BLADE</em></span>
        <span className="tag">v{APP_VER}{db.status==="ready" ? " · "+db.count+" cards" : ""}</span>
      </div>}
      <DbBanner db={db} reload={reload}/>
      {tab==="heroes" && idle && <>
        <HeroGrid best={best} onPick={p=>setHero(p&&p.random ? {...HEROES[Math.floor(Math.random()*HEROES.length)], mystery:true} : p)} db={db} selected={hero}/>
        {hero && <button className="battlebtn clip" disabled={db.status!=="ready"} onClick={()=>setLoHero({...hero, seed:Date.now()})}><span>{db.status==="ready"?"Battle":"Forging…"}</span></button>}
        <button className="bigbtn alt" style={{marginTop:8}} onClick={()=>setTable("find")}>Find an opponent</button>
        <VsStrip hero={hero} db={db}/>
        {hero && !hero.mystery && <HeroSheet h={hero} db={db} best={best} onBack={()=>setHero(null)} onFight={h=>setFighting(h)}/>}
        {hero && hero.mystery && <p className="note" style={{textAlign:"center"}}>Fate holds the card — your fighter is revealed at preparation.</p>}
      </>}
      {table==="find" && <TableScreen onBack={()=>setTable(null)} onSeated={s=>setTable(s)}/>}
      {/* The card database has to be READY before a table is dealt: both
          phones build the same two decks out of it, so a client that is
          still fetching would deal from a half-built map. The lobby's
          DATA_VER check catches a version skew; this catches a client
          that has not finished loading its own. */}
      {table && table!=="find" && (db.status==="ready"
        ? <TableRoom table={table.table} host={table.host} code={table.code} db={db}
            onExit={()=>setTable(null)}/>
        : <div className="tblwrap">
            <div className="tblhead">Table {table.code}</div>
            <div className="tblstat live"><span className="tbldot"></span>Forging the card pool…</div>
            <button className="a" onClick={()=>setTable(null)}>Leave the table</button>
          </div>)}
      {/* THE MATCH SEED is stamped once, here, when the match begins — and
          then everything random in the match derives from it: the pregame
          throw, both opening shuffles, the d6, intimidate, the dummy's
          recycle. One seed per match is what makes a game replayable, and
          it is the value a networked room code will supply instead of the
          clock. It rides in `cfg`, which already flows Loadout → Pregame →
          Battle, so nothing new has to be plumbed. */}
      {/* THE ORDER IS THROW, THEN SIDEBOARD (v2.76) — CR, and what
          `engine/lobby.js` has ruled since it was written: you board
          knowing the matchup and knowing whether you are on the play. The
          solo flow ran Loadout → Pregame, which showed you the seating
          only after every choice that could use it. Reversing it is why
          `Loadout` now takes `onPlay` as a prop. */}
      {loHero && !fighting && <Pregame h={loHero} seed={loHero.seed}
        onBack={()=>setLoHero(null)}
        onSeated={first=>{setSeating({h:loHero, first, seed:loHero.seed}); setLoHero(null);}}/>}
      {seating && !fighting && <Loadout h={seating.h} db={db} onPlay={seating.first===0}
        onBack={()=>{setLoHero(seating.h); setSeating(null);}}
        onStart={cfg=>{
          /* ---- ONE ENGINE, NO NETWORK (v2.79) -----------------------
             The same screen a networked table renders and the same
             reducer behind it; the only difference is that seat 1 is a
             policy in this phone rather than a person in another. The
             solo trainer is untouched and is still the default.

             SEAT 1 IS THE SAME PUNCHING BAG THE TRAINER FACES (v2.81) —
             a NULL hero key, which `buildMatch` reads as the dummy and
             deals the vanilla pile for. It used to require a chosen hero
             because the dealing lived inside `Battle` and there was no
             build to seat; now both boards face the same opponent, and
             the only thing that differs between them is which engine is
             driving. That is exactly what makes them comparable. */
          if(cfg.table){
            try {
              const m = DawnBuild.buildMatch({
                heroes: [seating.h.k, null],
                boards: [{gearIdx: cfg.gearIdx, cuts: cfg.cuts}, {}],
                first: seating.first, seed: String(seating.seed)
              }, {db, heroes: Object.fromEntries(HEROES.map(x=>[x.k,x])),
                  decks: Object.fromEntries(HEROES.map(x=>[x.k,PARSED[x.k]])),
                  vanilla: {deck: DUMMY_DECK, gear: DUMMY_GEAR, hp: 42,
                            int: DUMMY_INT, name: "The Dummy"}});
              setLocalTable({...m, g: DawnJudge.newMatch({builds:m.builds, names:m.names,
                heroKeys:m.heroKeys, first:m.first, seed:m.seed})});
              setSeating(null);
              return;
            } catch(e){
              /* FALL THROUGH TO THE TRAINER RATHER THAN DEAD-ENDING — but
                 SAY SO (v3.51). Silently seating the player at the OTHER
                 board is the "never dress a failure as a success" rule
                 (v2.51's clipboard lesson) in the one place where the two
                 boards are hardest to tell apart: the player taps "the new
                 engine", gets the trainer, and every difference they then
                 notice is attributed to the wrong thing. Not dead-ending
                 is still right; doing it quietly is not. */
              console.warn("[dawnblade] table build failed — seating you at the trainer instead:", e);
              try { window.__dawnTableFail = {when: Date.now(), why: String(e && e.message || e)}; } catch(_){}
              alert("The new engine could not deal this match, so you are at the trainer instead.\n\n"
                    + String(e && e.message || e));
            }
          }
          setFighting({h:seating.h, cfg:{...cfg, seed:seating.seed}, first:seating.first}); setSeating(null);}}/>}
      {localTable && <TableBoard match={localTable} mySeat={0} host={true} code="solo" db={db}
        table={null} netRef={{current:null}} netQ={{current:[]}} local={true}
        heroKey={localTable.heroKeys && localTable.heroKeys[0]} onRecord={record}
        onExit={()=>setLocalTable(null)}/>}
      {fighting && <Battle h={fighting.h} cfg={fighting.cfg} first={fighting.first} db={db} onExit={()=>setFighting(null)} onRecord={record}/>}
      {tab==="judge" && idle && <Judge/>}
      {tab==="trophies" && idle && <Trophies/>}
      {idle && <nav className="tabs">
        <button className={"tab"+(tab==="heroes"?" on":"")} onClick={()=>{setTab("heroes");}}>Heroes</button>
        <button className={"tab"+(tab==="judge"?" on":"")} onClick={()=>setTab("judge")}>Judge</button>
        <button className={"tab"+(tab==="trophies"?" on":"")} onClick={()=>setTab("trophies")}>Trophies</button>
      </nav>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
setTimeout(function(){ if(!window.React || !document.querySelector(".shell")) document.getElementById("cdnfail").style.display="block"; },4000);
</script>
</body>
</html>
