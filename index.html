              {g.mode==="arsenal" && (()=>{ const off = DawnEffects.heaveOffer(g, 0); return (
                <div className="statusline">Tap a card below for <b>arsenal</b>
                  {off && <button onClick={doHeave}>heave {off.card.name} ({off.n})</button>}
                  <button onClick={skipArsenal}>skip</button></div>); })()}
              {g.mode==="boostpick" && <div className="statusline">Boost <b>{g.pending.card.name}</b>? Banish the top card of your deck — a Mechanologist card grants go again.</div>}
              {g.mode==="fusepick" && g.pending && <div className="statusline">Fuse <b>{g.pending.card.name}</b>? Reveal a {g.pending.types.join("/")} card from your hand — <b>your opponent sees it</b>.</div>}
              {g.mode==="usurppick" && g.pending && <div className="statusline">Usurp for <b>{g.pending.card.name}</b> — which Runechant is destroyed to pay for it?</div>}
              {g.mode==="bancostpick" && g.pending && <div className="statusline"><b>{g.pending.card.name}</b> has an additional cost — banish a card from your graveyard, or decline.</div>}
              {g.mode==="chargepick" && g.pending && <div className="statusline">Charge for <b>{g.pending.card.name}</b>? A card from your hand goes to your <b>soul</b> — you may decline.</div>}
              {g.mode==="splitpick" && g.splitPick && <div className="statusline">
                <b>{g.splitPick.name}</b> is a split card — one card, two halves.
                {(g.splitPick.halves||[]).map((h,i)=><span key={i}> <b>{h.name}</b> ({h.tt}).</span>)}
                {g.splitPick.meld && <span> Meld plays both.</span>}
              </div>}
              {g.mode==="xpick" && g.xPick && <div className="statusline">
                <b>{g.xPick.name}</b> costs X {g.xPick.per} times — how much is X? You can pay up to X = {g.xPick.max}.
              </div>}
              {g.mode==="discpick" && g.discPick && <div className="statusline">
                <b>{g.discPick.name}</b> costs a discard — which {g.discPick.sub}?<button onClick={cancelDiscCost}>✕ cancel</button>
              </div>}
              {g.mode==="soulpick" && g.soulPick && <div className="statusline">
                <b>{g.soulPick.name}</b> costs a card from your soul — which one?<button onClick={cancelSoulCost}>✕ cancel</button>
              </div>}
              {g.mode==="boardpick" && g.boardPick && <div className="statusline">
                <b>{g.boardPick.name}</b> costs a {g.boardPick.what} — which one?<button onClick={cancelBoardCost}>✕ cancel</button>
              </div>}
              {g.mode==="targetpick" && g.targetPick && <div className="statusline">
                <b>{g.targetPick.name}</b> — choose its target. It is named now, before the cost is paid.<button onClick={cancelAbTarget}>✕ cancel</button>
              </div>}
              {g.mode==="rxaddpay" && g.rxAdd && <div className="statusline">
                <b>{g.rxAdd.name}</b> — pay <b>{g.rxAdd.cost}</b> more as an additional cost? You have {you(g).res} floating.
              </div>}
              {(()=>{ /* v2.07: the engine tracks all of this; the board never showed it */
                const pips = [];
                if(you(g).amp>0)       pips.push(["amp "+you(g).amp, "on"]);
                if(you(g).buffNext>0)  pips.push(["next atk +"+you(g).buffNext, "on"]);
                if(you(g).gaNext)      pips.push(["next atk go again", "on"]);
                if(wardTotal(you(g))>0) pips.push(["ward "+wardTotal(you(g)), "on"]);
                if(you(g).awd>0)       pips.push(["arcane ward "+you(g).awd, "on"]);
                if(runeCount(you(g))>0) pips.push(["runechant ×"+runeCount(you(g)), "on"]);
                if(opp(g).marked)     pips.push(["dummy marked", "on"]);
                /* bloodrot and frailty are board Auras as of v3.09 — the
                   board renders them, so a duplicate pip would be a second
                   description of the same fact. */
                if(you(g).fra>0)       pips.push(["frailty "+you(g).fra, "warn"]);
                /* the shared reader, so the open attack counts (v5.55) */
                const drac = DawnParser.dracLinksNow(g, 0);
                if(drac>0)        pips.push(["draconic links "+drac, ""]);
                if((you(g).hist.arc||0)>0)  pips.push(["arcane dealt", ""]);
                if((you(g).hist.aura||0)>0) pips.push(["auras "+you(g).hist.aura, ""]);
                const links = g.chain.filter(l=>l.kind==="atk").length;
                if(links)              pips.push(["chain link "+links, ""]);
                return pips.length ? <div className="rail">{pips.map(([t,cl],i)=>
                  <span key={i} className={"rp"+(cl?" "+cl:"")}>{t}</span>)}</div> : null;
              })()}
              <BoardStrip sd={you(g)} who="You" mine open={sheet==="you"} onOpen={()=>flip("you")}/>
              <HandRow>
                {you(g).hand.flatMap(handCell)}
                {playables.map((p,i)=>(
                  <button key={p.zone+"-"+(p.card.uid||p.card.name)+"-"+i}
                    className={"hc clip-sm"+(p.sel?" sel":"")+(peek&&peek.uid===p.card.uid?" peek":"")}
                    onClick={tapTwice(p.card, p.verb||"tap again to play", p.fn)}>
                    {p.sel && <span className="defsel">⛨ DEF</span>}
                    <CardFrame card={p.card} zone={p.zone}/>
                  </button>))}
              </HandRow>
            </div>
            {/* PANE 3 — CHAIN: the links */}
            <div className="hpane">
              <div className="paneflag"><span>← play</span><span>the chain</span></div>
              {g.chainOpen && <button className="chainclose" onClick={closeChain}>⛓ Close chain — bank {g.chain.length} link{g.chain.length!==1?"s":""}</button>}
              {prevLinks.length===0 && g.chainHist.length===0 && <p className="note">No links yet — play an attack to start the chain.</p>}
              {prevLinks.length>0 && <div className="histturn"><div className="htlabel">This turn</div>
                <div className="chain">{prevLinks.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>}
              {g.chainHist.map((t,i)=>(
                <div key={i} className="histturn"><div className="htlabel">Turn {t.turn}</div>
                  <div className="chain">{t.links.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>))}
            </div>
          </div>
        </div>

        {/* ---- SCREEN 3: your board (the sketch) ---- */}
        <div className={"vscreen side"+(sheet==="you"?" open":"")} data-sheet="you" ref={youRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>Your board</span><span>swipe → graveyard</span></div>
              {g.mode!=="act" && <button className="modehint" onClick={()=>setSheet(null)}>Action needed — back to the table ✕</button>}
              <InPlayRow entries={you(g).board} chips={toks} cell={(b,i)=>(
                <button key={b.uid} className={"b clip-sm"+(b.spent?" spent":"")} style={{width:52,flex:"none"}}
                  onClick={(()=>{
                    /* `tapTwice` RETURNS A HANDLER, so this is an IIFE that
                       picks one — `gearBtn`'s shape (v5.01). It was a plain
                       arrow that RETURNED the handler from inside React's
                       click, so every tap on this row was dead: no ally
                       attack, no arena ability (Gold, the potions,
                       Concealed Object) ever ran on this board. Found
                       driving the new aura route at phone dimensions. */
                    if(g.inspect) return ()=>setZoom(b.card);
                    /* AN ALLY ATTACK IS AN ACTIVATION LIKE ANY OTHER
                       (v3.44) — two-tap, then the shared route. It used
                       to call `allySwing`, which fabricated the damage. */
                    if(b.kind==="ally" && DawnParser.allyAttack(b.card))
                      return tapTwice(b.card, "attack", ()=>tryPlay(b.card,"ally",i));
                    /* AN AURA COSMO HAS ARMED SWINGS (v5.01) — asked after
                       the ally reader and never instead of it, as judge does. */
                    if(auraAtkOf(g, b.card))
                      return tapTwice(b.card, "attack", ()=>tryPlay(b.card,"aura",i));
                    const bp = boardPow(b);
                    if(bp) return tapTwice(bp, "activate", ()=>tryPlay(bp,"board",i));
                    return ()=>setZoom(b.card);
                  })()}>
                  <span className={"tapwrap"+((b.spent&&/\btap\b|\{t\}/i.test(b.card.tx||""))?" tapped":"")}><CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/></span>
                  {b.kind==="ally" && b.card.power>0 && <span className="sw">{b.spent?"spent":"⚔ "+b.card.power}</span>}
                </button>)}/>
              <div className="heror">
                <div className={"wslot clip-sm"+(handGear[0]?" filled":"")}>
                  {handGear[0] ? gearBtn(handGear[0].gr, handGear[0].i) : <span className="wempty">weapon 1</span>}
                </div>
                <div className="heromid clip-sm">
                  <button className="hport2" onClick={()=>setZoom(built.HZOOM)}><span className={"tapwrap"+(you(g).heroTapped?" tapped":"")}><HeroArt h={h} db={db}/></span></button>
                  <span className="hname">{heroShort(h)}</span>
                  <LifeNum n={you(g).hp} className="hlife2"/>
                  <span className="hlbl">life</span>
                  {/* A COUNTER THE ABILITY SPENDS MUST BE ON SCREEN (v3.39).
                      Blaze's whole cost is his energy pool, and a pool the
                      player cannot see is a cost they cannot plan around —
                      the ability may as well not exist. Rendered off the
                      hero's own counters, so any future hero counter shows
                      here without another edit. */}
                  {(()=>{ const ct=you(g).counters.hero||{};
                    const ks=Object.keys(ct).filter(k=>ct[k]>0);
                    if(!ks.length) return null;
                    return <span className="ctr">{ks.map(k=>
                      <span key={k} className="cc steam" title={k}>{k[0].toUpperCase()}{ct[k]}</span>)}</span>; })()}
                  {/* AN INSTANT ABILITY IS LEGAL IN AN INSTANT WINDOW (CR
                      8.1.6). This was gated on `mode==="act"`, which is the
                      ACTION phase only — so a hero ability printed
                      "Instant -" could not be used on the opponent's turn,
                      which for Blaze is half of what it is for. */}
                  {/* THE WINDOW IS `abWindow`'s ANSWER, NOT A KIND CHECK
                      (v3.74). Written as `kind==="instant"` this gate had
                      no case for an ATTACK REACTION — so Boltyn's ability
                      would be enabled in the action phase, where `tryPlay`
                      refuses it, and disabled in the stack window, where
                      it is the only legal play. A dead button in both
                      directions at once. v3.63's "when you add a flag to
                      one powCard builder, grep for the others", one site
                      further out: there it was the BUILDERS, here it is
                      the places that OFFER what they built. */}
                  {built.heroPow && <button className="hact clip-sm fs-md" style={{padding:"5px 8px"}}
                    disabled={!!you(g).weaponUsed["hpow"]||!!g.over||!heroPowWindowOK(g)}
                    onClick={()=>tryPlay(built.HPOW,"hero",0)}>{you(g).weaponUsed["hpow"]?"USED":"⚡ USE"}</button>}
                </div>
                <div className={"wslot clip-sm"+(handGear[1]?" filled":"")}>
                  {handGear[1] ? gearBtn(handGear[1].gr, handGear[1].i)
                    : <span className="wempty">{is2H ? "2H occupies both hands" : "weapon 2 / off-hand"}</span>}
                </div>
              </div>
              <div className="midrow">
                {/* `armor` carries the gear's INDEX, which gearBtn needs, so
                    the lookup goes through it rather than through the piece.
                    ArmorGrid still owns the empty slots and the grid areas —
                    the half that must match the opponent's side of the table. */}
                <ArmorGrid gear={armor.map(x=>x.gr)} own cell={(gr,z,back)=>{
                  const it = armor.find(x=>x.gr.uid===gr.uid);
                  return gearBtn(it.gr, it.i, "", z==="misc"?undefined:{gridArea:z}, back);
                }}/>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{you(g).arsenal
                    ? <button style={{padding:0,width:"100%"}} onClick={()=> g.mode==="foeturn" ? playArsenalInstant() : g.mode==="block" ? (g.bphase==="react"&&playRxA()) : g.inspect?setZoom(you(g).arsenal) : g.mode==="stack" ? playRxA() : tryPlay(you(g).arsenal,"arsenal",0)}><CardFrame card={you(g).arsenal} className="sm"/></button>
                    : "empty"}</div>
                  <span className="zlbl">Arsenal</span>
                </div>
                <DeckPitchCol deck={you(g).deck} pitch={you(g).pitch}/>
              </div>
              <div className="vfillsp"/>
              <div className="mystat" style={{marginTop:8}}>
                <span className="pill">WASTED <b>{you(g).wasted}</b></span>
                <span className="pill">TURN <b>{g.turn}</b></span>
                {built.hasBoost && <button className={"pill"+(g.boostOn?"":" hp")} onClick={()=>setG(s=>({...s,boostOn:!s.boostOn}))}>BOOST {g.boostOn?"✓":"✗"}</button>}
                <button className={"pill"+(g.inspect?" hp":"")} onClick={()=>setG(s=>({...s,inspect:!s.inspect}))}>ℹ {g.inspect?"inspecting":"inspect"}</button>
              </div>
            </div>
            <GravePane sd={you(g)} who="Your"/>
          </div>
        </div>
      </div>

      <HubBar>
        {g.over ? (
          <button className="a dis" disabled>The game is over</button>
        ) : g.mode==="pay" ? <>
          <button className="a" onClick={cancelPay}>Cancel</button>
          <button className="a pay hubp" onClick={confirmPay}>Pitch & play</button>
        </> : g.mode==="stack" ? (
          <button className="a go hubp" onClick={resolveStack}>Pass — resolve</button>
        ) : g.mode==="block" ? ( g.bphase==="defend" ? <>
          <button className="a" onClick={takeIt}>{you(g).blockH.length||you(g).blockG.length ? "Defend — no reactions" : "Take it"}</button>
          <button className="a go hubp" onClick={moveToReact}>Defend → reactions</button>
        </> : (
          <button className="a go hubp" onClick={takeIt}>Resolve damage</button>
        )) : g.mode==="boostpick" ? (<>
          <button className="a go hubp" onClick={()=>confirmBoost(true)}>⚡ Boost</button>
          <button className="a" onClick={()=>confirmBoost(false)}>No boost</button>
        </>) : g.mode==="fusepick" ? (<>
          {/* ONE BUTTON PER ELIGIBLE CARD, because WHICH card is the
              decision — the price fusion charges is the information the
              opponent gains, so revealing a spent blue is not the same
              play as revealing the attack you are holding. The uids come
              from `parser.fusionOffer` with the question, so the buttons
              and the legality of the answer cannot disagree. */}
          {(g.pending?.uids||[]).map(u => {
            const c = you(g).hand.find(x=>x.uid===u);
            return <button key={u} className="a go" onClick={()=>confirmFuse(u)}>
              Reveal {c ? c.name : "card"}</button>;
          })}
          <button className="a" onClick={()=>confirmFuse(null)}>No reveal</button>
        </>) : g.mode==="usurppick" ? (<>
          {/* ONE BUTTON PER DIFFERENT RUNECHANT (v6.42), off
              DawnParser.usurpOffer with the question. No decline: usurp
              destroys a Runechant "if able". */}
          {(g.pending?.uids||[]).map(u => {
            const b = (you(g).board||[]).find(x=>x.uid===u);
            return <button key={u} className="a go" onClick={()=>confirmUsurp(u)}>
              Usurp {b ? b.card.name : "Runechant"}</button>;
          })}
        </>) : g.mode==="bancostpick" ? (<>
          {/* ONE BUTTON PER DIFFERENT CARD THAT COULD PAY (v6.43), off
              DawnPrompts.banCostChoice with the question, and a Decline:
              the cost is printed "you may". */}
          {(g.pending?.uids||[]).map(u => {
            const c = (you(g).grave||[]).find(x=>x.uid===u);
            return <button key={u} className="a go" onClick={()=>confirmBanCost(u)}>
              Banish {c ? c.name : "card"}</button>;
          })}
          <button className="a" onClick={()=>confirmBanCost(null)}>Decline</button>
        </>) : g.mode==="chargepick" ? (<>
          {/* ONE BUTTON PER CARD IN HAND, because WHICH card is the
              decision - a charged card is GONE to the soul, so charging
              a spent blue is not the same play as charging the attack
              you are holding for next turn. The uids come from
              DawnParser.chargeOffer with the question, so the buttons and
              the legality of the answer cannot disagree. */}
          {(g.pending?.uids||[]).map(u => {
            const c = you(g).hand.find(x=>x.uid===u);
            return <button key={u} className="a go" onClick={()=>confirmCharge(u)}>
              Charge {c ? c.name : "card"}</button>;
          })}
          <button className="a" onClick={()=>confirmCharge(null)}>No charge</button>
        </>) : g.mode==="splitpick" ? (<>
          {(g.splitPick?.halves||[]).map((h,i)=>
            <button key={i} className="a go" onClick={()=>confirmSplit(i)}>{h.name}</button>)}
          {g.splitPick?.meld && <button className="a" onClick={()=>confirmSplit("both")}>Meld both</button>}
        </>) : g.mode==="xpick" ? (<>
          {Array.from({length: ((g.xPick&&g.xPick.max)||0) + 1}, (_, x) =>
            <button key={x} className={"a"+(g.xPick&&x===g.xPick.max?" go":"")} onClick={()=>confirmX(x)}>X = {x}{x ? " · pay "+(x*((g.xPick&&g.xPick.per)||1)) : ""}</button>)}
        </>) : g.mode==="discpick" ? (<>
          {/* ONE BUTTON PER CARD THAT COULD PAY (v4.85), off
              `discCostChoice`, the one reader both boards ask. Two copies
              of one card are one button; two printings of one NAME are
              told apart by colour, or the buttons read the same. */}
          {(g.discPick?.uids||[]).map(u => {
            const c = you(g).hand.find(x=>x.uid===u);
            const twin = c && (g.discPick.uids||[]).some(v => v !== u && ((you(g).hand.find(x=>x.uid===v)||{}).name === c.name));
            return <button key={u} className="a go" onClick={()=>confirmDiscCost(u)}>
              Discard {c ? c.name : "card"}{twin ? " ("+(["","red","yellow","blue"][c.pitch]||"pitch "+c.pitch)+")" : ""}</button>;
          })}
        </>) : g.mode==="soulpick" ? (<>
          {/* ONE BUTTON PER SOUL CARD THE COST COULD TAKE (v5.59), off
              `soulCostChoice`, the one reader both boards ask — the soul
              is public, so the player sees what they are choosing between.
              Two copies of one card are one button; two printings of one
              NAME are told apart by colour. */}
          {(g.soulPick?.uids||[]).map(u => {
            const c = (you(g).soul||[]).find(x=>x.uid===u);
            const twin = c && (g.soulPick.uids||[]).some(v => v !== u && (((you(g).soul||[]).find(x=>x.uid===v)||{}).name === c.name));
            return <button key={u} className="a go" onClick={()=>confirmSoulCost(u)}>
              Banish {c ? c.name : "card"}{twin ? " ("+(["","red","yellow","blue"][c.pitch]||"pitch "+c.pitch)+")" : ""}</button>;
          })}
        </>) : g.mode==="boardpick" ? (<>
          {/* ONE BUTTON PER DIFFERENT CARD THE COST COULD DESTROY (v6.66), off
              DawnParser.boardCostOffer, the one reader both boards ask. */}
          {(g.boardPick?.uids||[]).map(u => {
            const b = (you(g).board||[]).find(x=>x.uid===u);
            return <button key={u} className="a go" onClick={()=>confirmBoardCost(u)}>
              Destroy {b ? b.card.name : g.boardPick.what}</button>;
          })}
        </>) : g.mode==="targetpick" ? (<>
          {/* ONE BUTTON PER TARGET THE ABILITY MAY NAME (v5.72), off
              `abPickBound`, the pool the legality and `judge.js` ask. A
              target whose cost settles an X shows what it will cost. */}
          {(g.targetPick?.uids||[]).map(u => {
            const _tz = [...(you(g).grave||[]), ...(you(g).banish||[]), ...(you(g).hand||[])];   /* v6.41: the banished zone too */
            const c = _tz.find(x=>x.uid===u);
            const twin = c && (g.targetPick.uids||[]).some(v => v !== u && (((_tz.find(x=>x.uid===v)||{}).name) === c.name));
            return <button key={u} className="a go" onClick={()=>confirmAbTarget(u)}>
              {c ? c.name : "card"}{twin ? " ("+(["","red","yellow","blue"][c.pitch]||"pitch "+c.pitch)+")" : ""}{c && g.targetPick.x ? " · X = "+(c.cost||0) : ""}</button>;
          })}
        </>) : g.mode==="rxaddpay" ? (<>
          <button className="a go hubp" onClick={()=>confirmRxAdd(true)}>Pay {g.rxAdd?g.rxAdd.cost:0} more</button>
          <button className="a" onClick={()=>confirmRxAdd(false)}>Decline</button>
        </>) : g.mode==="foeturn" ? (<>
          {/* NAME WHOSE WINDOW THIS IS. The board looks like your turn and
              it is not — CR 4.3.4 gives you a window before their action
              phase can end, and a bar that still said "End turn" would be
              telling you the wrong thing about whose clock is running. */}
          <button className="a go hubp" onClick={foePassWindow}>Pass — let {opp(g).name.split(",")[0]} end</button>
        </>) : (<>
          <button className="a go hubp" disabled={g.mode!=="act"||!!g.over} onClick={endTurn}>End turn</button>
        </>)}
      </HubBar>
      {g.over && (g.over.win
        ? <WinPanel score={g.over.score} onExit={onExit}><Recap g={g} me={0}/></WinPanel>
        : DawnJudge.drawText(g.over, g.sides)
        ? <DrawPanel text={DawnJudge.drawText(g.over, g.sides)} turn={g.turn} hp={you(g).hp} onExit={onExit}><Recap g={g} me={0}/></DrawPanel>
        : <EndPanel tone="lose" title="Down — but wiser" kicker={"turn "+g.turn+" · training"} names={opp(g).name.split(",")[0]+" over "+you(g).name.split(",")[0]}
            onExit={onExit} leave="Back to heroes"><p className="endnote">Fewer wasted pitches and tighter blocks next run.</p><Recap g={g} me={0}/></EndPanel>)}
      <CardModal card={zoom} onClose={()=>setZoom(null)}/>
      {/* JUDGE!! — write down what looked wrong while it is still on
          screen. The board travels with the note, so the note can be one
          line. One sheet, shared with the table board. */}
      <JudgeSheet open={!!bug} onClose={()=>setBug(null)} report={judgeCtx} warn={judgeN}
        meta={`v${window.APP_VER} · ${h.n} · turn ${g.turn} · ${g.mode}`}/>
      {/* the peeked card, big enough to actually read, docked above the
          action bar so the hand rail stays visible underneath it. THE SAME
          COMPONENT THE TABLE RENDERS (v2.52) — this was a hand-copied
          duplicate of its markup, which is how the table came to be missing
          the `--peekbot` measurement that keeps the preview off the rail.
          Hidden while a prompt sheet is open, because `.psheet` docks in
          exactly this spot. */}
      {!g.over && !g.prompt && !sheet &&
        <PeekDock card={peek && peekables().find(c=>c.uid===peek.uid)}
          verb={peek && peek.verb} onClose={()=>setPeek(null)}/>}
      {/* THE SHEET IS ONE BODY, SHARED WITH THE TABLE (v4.44). It was 90
          lines inline here and the table had none at all, which made every
          prompt a livelock there — see PromptSheet's own header. */}
      <PromptSheet p={g.over ? null : g.prompt} me={0}
        onToggle={promptToggle} onPick={promptPick} onTakeBack={promptTakeBackC}
        onMove={promptMoveC} onDecline={promptDecline} onConfirm={promptConfirm}/>
    </div>
  );
}
/* A DRAWN TRAINER GAME (nobody can win: both decks spent, nothing moving). The words are
   `judge.drawText`'s, the same the table's result screen reads; there is no score and
   no pull, since a draw is not a kill. */
/* THE RESULT SCREEN — one shell for every way a game ends, on BOTH boards
   (UX overhaul, 2026-11-19). It used to be four hand-copies: the trainer's
   win and draw overlays, the trainer's loss as an inline box under the
   board, and the table's overlay, whose ".lose" class picked up the plain
   `.lose` panel rule and painted the board THROUGH the result at 8% opacity.
   `tone` is win / lose / draw and only colours the screen. The heading stays
   the FIRST line of what the overlay reads out, which tools/page.js checks, the whole
   overlay still leaves on a tap, and the button is the visible way out. */
function EndPanel({tone, title, kicker, names, stat, statLbl, onExit, leave, pad, children}){
  /* `pad` (Table Talk's result, the scratch sheet) stands where the names card and the stat stand */
  return (
    <div className={"reveal end-"+tone+(pad?" tk-end":"")} onClick={onExit} role="dialog" aria-label={title}>
      <h2 className="disp endtitle">{title}</h2>
      {pad || <div className="card clip"><div className="rar">{kicker}</div><h3>{names}</h3></div>}
      {!pad && stat!=null && <div className="endstat"><b className="mono">{stat}</b><span>{statLbl}</span></div>}
      {children}
      <button className="bigbtn endleave" onClick={e=>{e.stopPropagation(); onExit();}}>{leave||"Continue"}</button>
      <div className="endhint">or tap anywhere</div>
    </div>
  );
}
/* THE RECAP (v7.09, QUEUE NEXT 2): what happened, in four numbers, from the count `judge.recapStep` keeps on the game
   (life only — never the feed). `me` is the seat this phone plays; its column comes first and is named "You". Turns are the
   game's own count. Nothing shows for a game with no count (an old saved game). */
function Recap({g, me}){
  const r = g && g.recap;
  if(!r || !g.sides || g.sides.length !== 2) return null;
  const seats = [me, 1 - me], name = i => i === me ? "You" : (g.sides[i].name || "").split(",")[0];
  const gained = r.gain[0] + r.gain[1] > 0;
  const big = i => r.big[i] ? <><b>{r.big[i].amt}</b><small>turn {r.big[i].turn}</small></> : <b>—</b>;
  return (
    <div className="recap" data-testid="recap" onClick={e=>e.stopPropagation()}>
      <div className="rchead">{g.turn === 1 ? "1 turn" : g.turn + " turns"}</div>
      <table><thead><tr><th></th>{seats.map(i=><th key={i}>{name(i)}</th>)}</tr></thead>
        <tbody>
          <tr><td>Life lost</td>{seats.map(i=><td key={i}><b>{r.lost[i]}</b></td>)}</tr>
          <tr><td>Most at once</td>{seats.map(i=><td key={i}>{big(i)}</td>)}</tr>
          {gained && <tr><td>Life gained</td>{seats.map(i=><td key={i}><b>{r.gain[i]}</b></td>)}</tr>}
        </tbody></table>
    </div>
  );
}
function DrawPanel({text,turn,hp,onExit,children}){
  return (
    <EndPanel tone="draw" title={text.title} kicker={"turn "+turn+" · training"} names={text.names}
      stat={hp>0 ? hp : null} statLbl="life left" onExit={onExit} leave="Back to heroes">
      <p className="endnote">{text.note}</p>
      {children}
    </EndPanel>
  );
}
function WinPanel({score,onExit,children}){
  const [t] = uS(()=>{
    let pool=[]; TROPHIES.forEach(x=>{for(let i=0;i<x.w;i++)pool.push(x);});

  uE(()=>{ const seen = store.get("case",[]); store.set("case",[...seen,{n:t.n,r:t.r,at:Date.now()}]); },[]);
  return (
    <EndPanel tone="win" title="DUMMY DESTROYED" kicker={t.r+" pull"} names={t.n}
      stat={score} statLbl="efficiency score — lower is cleaner" onExit={onExit} leave="Back to heroes">{children}</EndPanel>
  );
}

/* ============================================================
   FOEPICK — who you are up against, BEFORE the throw and the sideboard.

   Asked for by the user (2026-11-25): "pick the opponent before the sideboard
   screen so if you pick random opp you know who you're up against to
   sideboard." It lived inside Loadout, and Random was settled only at Start,
   so a player boarded blind. Now Random is drawn the moment it is tapped and
   named on this screen, and that same hero is the one dealt (it rides on the
   hero object as `foe`, through Pregame and Loadout, to the table's build).

   `foe` = {k, random, level}: k is a hero key, or null for the Dummy (the
   default; the Dummy still goes to the trainer from Loadout). The opponent is
   deliberately NOT remembered between matches (a remembered one would
   silently change a later game); Sharp / Steady IS, as before — it is the
   player's taste. `initial` is the earlier choice when Back lands here.
   ============================================================ */
function FoePick({h, db, initial, noDummy, onBack, onDone}){
  const [pick,setPick] = uS(()=>initial ? {k:initial.k||null, random:!!initial.random} : {k:null, random:false});
  const [level,setLevelS] = uS(()=>store.get("aiLevel","sharp")==="steady" ? "steady" : "sharp");
  const setLevel = v => { store.set("aiLevel", v); setLevelS(v); };
  const aiRec = uM(()=>DawnLocal.loadRecord(lsGet),[]);
  const recOf = k => { const c = aiRec.foes[k] && aiRec.foes[k][level]; return c && (c.w + c.l + c.d) ? c : null; };
  const anyRec = HEROES.some(x=>recOf(x.k));
  const foeHero = pick.k ? HEROES.find(x=>x.k===pick.k) : null;
  return (
    <div className="foestep">
      <div className="screennav">
        <button onClick={onBack} style={{flex:.7}}>✕ back</button>
        <button disabled style={{flex:2}}>Choose your opponent</button>
      </div>
      <div className="foebody">
        <div className="paneflag"><span>Who are you up against?</span><span>you will know before you sideboard</span></div>
        <div className="aifoe">
          {!noDummy && <button className={!pick.k?"on":""} onClick={()=>setPick({k:null,random:false})} aria-label="The Dummy">
            <div className="fport">✕</div><span className="fname">The Dummy</span></button>}
          <button className={pick.random?"on":""} onClick={()=>setPick({k:HEROES[Math.floor(Math.random()*HEROES.length)].k, random:true})} aria-label="A random hero">
            <div className="fport">?</div><span className="fname">Random</span></button>
          {HEROES.map(x=>{ const r = recOf(x.k);
            return <button key={x.k} className={!pick.random && pick.k===x.k?"on":""} onClick={()=>setPick({k:x.k,random:false})} aria-label={x.n}>
            <div className="fport"><HeroArt h={x} db={db} key={db.status}/></div>
            <span className="fname">{heroShort(x)}</span>
            {r && <span className="frec" title={`${r.w} won, ${r.l} lost${r.d ? ", "+r.d+" drawn" : ""} at ${level==="sharp"?"Sharp":"Steady"}`}>
              {r.w}–{r.l}{r.d ? <span className="frecd"> · {r.d}d</span> : null}</span>}</button>; })}
        </div>
        <p className="foereveal" role="status" data-foe={pick.k||"dummy"}>Your opponent: <b>{foeHero ? foeHero.n : "The Dummy"}</b>{pick.random ? " — drawn at random. Tap Random to draw again." : ""}</p>
        <VsStrip hero={{...h, mystery:false}} db={db} foe={foeHero}/>
        {pick.k && <div className="ailevel" role="group" aria-label="How the AI plays">
          <button className={level==="sharp"?"on":""} aria-pressed={level==="sharp"} onClick={()=>setLevel("sharp")}>
            <span className="lvl">Sharp</span>
            <span className="lsub">Plays out each way to start its turn, then picks the best.</span></button>
          <button className={level==="steady"?"on":""} aria-pressed={level==="steady"} onClick={()=>setLevel("steady")}>
            <span className="lvl">Steady</span>
            <span className="lsub">Plays by its rules of thumb. Quicker to read, easier to beat.</span></button>
        </div>}
        {anyRec && <p className="note frecnote">Under a hero: your wins–losses against it at {level==="sharp"?"Sharp":"Steady"}, and draws as "d". Kept on this device.</p>}
        <div className="foebar">
          <button className="battlebtn clip" data-foe-go style={{marginTop:0}} onClick={()=>onDone({k:pick.k, random:pick.random, level})}>
            <span>{foeHero ? "Face "+heroShort(foeHero) : "Face the Dummy"}</span></button>
        </div>
      </div>
    </div>
  );
}


/* ---------- LOADOUT — the official zones (4 armour slots, 2 hands) live
     in engine/build.js: ARMOR_Z, HAND_Z, applyPick, defaultPicks. One set
     of slot rules governs both seats, or the opponent is quietly stronger
     than printed. ---------- */
/* `netFoe` turns this screen into the TABLE's sideboard step (v2.49).
   The loadout is the same rules problem across the wire as it is against
   the dummy — the printed slot rules, the same 40-card floor — so it is
   the same screen rather than a second one that would drift from it.
   What changes is only that the opponent is already SETTLED: it was
   negotiated in the lobby, so the picker is replaced by the hero across
   the table. Reusing the screen is also what keeps the cut map honest —
   `cuts` is exactly the shape engine/lobby.js normalises and
   build.js rebuilds the deck from, on both phones. */
/* `netOnPlay` is a BOOLEAN — "is this client on the play" — and not the
   seat index that opens the game. Passing the index and reading it as the
   answer told BOTH seats they were on the draw, which is the same
   actor-versus-perspective slip that `you()` meaning seat 0 caused all
   through the migration: a seat INDEX is not an answer to a question
   about THIS client. Named so it cannot be read the other way. */
/* THE SIDEBOARD, AND IT RUNS AFTER THE THROW (v2.76). `first` arrives as
   a PROP because it is settled before this screen opens: the throw
   decided whether you are on the play. That is the whole point of
   boarding here — `engine/lobby.js` has ruled this order since it was
   written (`STEPS = [... "throw", "seat", "board", "ready"]`, "you
   sideboard knowing the matchup AND knowing whether you are on the play"),
   and the solo flow was the only thing in the project still doing it
   backwards.

   `oppH` was the other prop and is gone (v2.81): in the trainer the
   opponent is the vanilla dummy, always. */
function Loadout({h,db,onBack,onStart,netFoe,netOnPlay,onPlay,soloFoe,onFoe}){
  const d = PARSED[h.k];
  const saSet = (d.hero.code||"").slice(0,3) || null;
  const gearR = uM(()=>d.gear.map((e,i)=>{ const c=resolveEntry(db,e,saSet); return {i, c, s:slotOf(c)}; }),[h,db]);
  const handL = gearR.filter(x=>HAND_Z.includes(x.s.z));
  const armorL = gearR.filter(x=>!HAND_Z.includes(x.s.z));
  const saved = store.get("loadout."+h.k, null);
  const [sel,setSel] = uS(()=>{
    if(saved && saved.sel){ let s=[]; saved.sel.forEach(i=>{ if(gearR.some(x=>x.i===i)) s=applyPick(gearR,s,i); }); if(s.length) return s; }
    return defaultPicks(gearR);
  });
  const [cuts,setCuts] = uS(()=> (saved&&saved.cuts)||{});
  const [zoom,setZoom] = uS(null);
  /* WHO IS ACROSS THE TABLE. `null` is the Dummy and stays the default:
     it is the regression harness for every phase of the opponent work,
     and its vanilla pile is the one deck where nothing can be faked
     (ROADMAP-OPPONENT.md). Deliberately NOT saved per hero the way the
     loadout is — the opponent is a property of the match, not of your
     deck, and a remembered one would silently change a later game.

     AND IT CAN BE A HERO NOW (v5.35). RULING (user, 2026-10-18): "Yes it
     is time for the ai to learn to play the heroes - I'm confident the
     cards are suitable :)". `aiFoe` is a hero KEY, "random", or null for
     the Dummy, and it reaches only the new engine's table: the trainer
     keeps its tuned pile. */
  /* v7.xx: THE OPPONENT IS PICKED BEFORE THIS SCREEN (`FoePick`, the step
     in front of the throw), so a player who drew Random boards knowing who
     it is. It arrives here already settled as `soloFoe` = {k, level}: k is a
     real hero key or null (the Dummy), never "random". */
  const aiFoe = soloFoe && soloFoe.k ? soloFoe.k : null;
  /* SHARP OR STEADY (lookahead phase 2). How an AI hero thinks: Sharp plays
     each way to start its turn, and each way to block, out through the engine before it picks one
     (sparring.js, LOOKAHEAD); Steady is the rule policy alone. Unlike the
     opponent it IS remembered — it is the player's taste, not a property of
     one match — and Sharp is the default. */
  const aiLevel = soloFoe && soloFoe.level === "steady" ? "steady" : "sharp";
  /* YOUR RECORD AGAINST EACH AI HERO (v5.84), at the level chosen below. Read
     once per visit; storage that is missing or throws reads as no record. */
  const item = i => gearR.find(x=>x.i===i);
  const hands = sel.filter(i=>["1h","2h","off"].includes(item(i).s.z)).reduce((a,i)=>a+item(i).s.h,0);
  const armorN = sel.filter(i=>ARMOR_Z.includes(item(i).s.z)||item(i).s.z==="misc").length;
  const has2H = sel.some(i=>item(i).s.z==="2h");
  const deckTotal = d.deck.reduce((a,e)=>a+e.q,0);
  const cutN = Object.values(cuts).reduce((a,b)=>a+b,0);
  const size = deckTotal - cutN;
  const tapCut = (ei,q) => setCuts(c=>{
    const cur = c[ei]||0;
    if(cur<q && size>40) return {...c,[ei]:cur+1};
    const n={...c}; delete n[ei]; return n;
  });
  const start = () => { store.set("loadout."+h.k,{sel,cuts}); onStart({gearIdx:sel, cuts}); };
  /* THE MERGED ENGINE, WITHOUT A SECOND PHONE (v2.79). The same board a
     networked table renders, driven by `judge.reduce` — the one rules
     engine — with `sparring.act` in seat 1.

     IT SEATS THE SAME PUNCHING BAG (v2.81). It used to need a real HERO
     across the table, because the dealing for the vanilla pile lived
     inside `Battle` and there was no build to put in a seat. There is
     one now — `build.buildVanilla` — so the two boards face the same
     opponent and the only difference left between them is which engine
     is driving.

     It is a SECOND button rather than a replacement, deliberately.
     `Battle` is the regression harness and does not retire until the
     merged path passes the same drills, and the [3,4,5] escalation it
     runs is TUNED where `sparring.act` is not. */
  const startTable = () => {
    store.set("loadout."+h.k,{sel,cuts});
    /* RANDOM is settled here, at the tap, so the key the match is built
       from is a real hero and a replay of the spec deals the same game. */
    const pickedFoe = aiFoe;
    /* AN AI HERO PLAYS SHARP (lookahead, phase 2): at its own action
       decision it plays each way to start out through the real engine
       and keeps the best (sparring.js, LOOKAHEAD). The Dummy stays on the
       rule policy: it is the regression harness, not a sparring partner. */
    onStart({gearIdx:sel, cuts, table:true, aiFoe: pickedFoe, sharp: !!pickedFoe && aiLevel==="sharp"});
  };
  const foeHero = aiFoe ? HEROES.find(x=>x.k===aiFoe) : null;
  const vsAI = aiFoe !== null;
  const deckRows = d.deck.map((e,ei)=>({ei, e, c:resolveEntry(db,e,saSet)}));
  const PD = {1:"var(--r)",2:"var(--y)",3:"var(--b)"};
  const Tile = ({x}) => {
    const on = sel.includes(x.i);

  /* --lochrome: EVERYTHING THE THREE FLICK SCREENS DO NOT GET, MEASURED.
     It was the literal 236 in the rule above, written when the action bar
     held one button; v3.51 put two options and their disclosure in it and
     the bar stands 163px at 393x852, so the fixed bar painted over the
     bottom of the pane. A hardcoded offset is wrong the moment the layout
     moves — `--peekbot` is in this file for that reason (v2.52) — so the
     reserve is taken off the live chrome.

     BOTH ENDS, because the pane is boxed by both: everything ABOVE it is
     its own distance from the top of the viewport, and everything BELOW is
     the distance from the bar's top edge to the bottom. Neither is derived
     from the header or the nav, so nothing here has to know what the
     chrome is made of.

     A ResizeObserver rather than `--peekbot`'s per-frame walk, and the

                {(netFoe || foeHero)

/* ============================================================
   PREGAME — the throw for seating.

   Sits between the loadout and the first draw, because seating is
   decided before a card is drawn. The winner CHOOSES; they are not
   simply handed the first turn. Player is side 0, opponent side 1 —
   the same indices the sides[] migration uses, so this screen already
   speaks the two-player vocabulary the rest of the engine is moving to.
   ============================================================ */
const RPS_GLYPH = {rock:"✊", paper:"✋", scissors:"✌"};
const RPS_LOSS = {rock:"Paper smothers it.", paper:"Scissors cut through.", scissors:"Rock shatters them."};

function Pregame({h, seed, onSeated, onBack}){
  const [rounds,setRounds] = uS([]);
  const [live,setLive] = uS(null);
  const [phase,setPhase] = uS("throw");
  /* Who is across the table was decided on the HERO SCREEN (v2.76), which
     is where it belongs now: you pick the matchup, throw for seating, and
     only THEN sideboard — knowing both. This screen only reads it. */
  const foeLabel = "The Dummy";
  const [log,setLog] = uS(["Two hands over the table. Winner calls the seating."]);
  const timer = uR(null);
  const say = m => setLog(l=>[...l,m].slice(-7));
  uE(()=>()=>{ if(timer.current) clearTimeout(timer.current); },[]);
  /* The throw comes off the MATCH seed, on its own derived sub-stream.
     Derived rather than shared so the opponent's hand does not correlate
     with the first card of anyone's deck — same match seed, independent
     sequences. A ref, not state: advancing it must not trigger a render,
     and ties replay by drawing again rather than by re-rendering. */
  const rps = uR(rngMake(rngSeedFrom(String(seed==null?0:seed) + ":rps")));

  /* THE COIN (v2.57; permanent against the AI, v6.01) — see window.THROW_MODE. It draws
     from the same seeded sub-stream the throw uses, so a match is still
     reproducible from its seed, and it cannot tie, which is the whole point.
     The winner still CHOOSES the seating below: that is the rule. */
  const coinMode = window.THROW_MODE !== "rps";
  const [coinWin, setCoinWin] = uS(null);
  const series = rpsSeries(rounds);
  const winner = coinMode ? coinWin : series.winner;

  uE(()=>{
    if(!coinMode || coinWin !== null) return;
    const _c = rngInt(rps.current, 2); rps.current = _c.rng;
    timer.current = setTimeout(()=>{
      setCoinWin(_c.v);
      say(_c.v===0 ? "The coin lands your side of the table." : `The coin lands ${foeLabel}'s way.`);
      setPhase("decide");
    }, 500);
  },[coinMode]);

  const throwIt = mine => {
    if(phase!=="throw") return;
    const _t = rngNext(rps.current); rps.current = _t.rng;
    const theirs = rpsThrow(()=>_t.v);
    setLive({mine, theirs:null});
    setPhase("shaking");
    timer.current = setTimeout(()=>{
      const v = rpsResolve(mine, theirs);
      const next = [...rounds, [mine, theirs]];
      setLive({mine, theirs});
      setRounds(next);
      if(v===0){
        say(`Both ${mine}. Dead level — throw again.`);
        setPhase("throw");
      } else if(v===1){
        say(`${RPS_GLYPH[mine]} beats ${RPS_GLYPH[theirs]}. ${RPS_LOSS[theirs]} The call is yours.`);
        setPhase("decide");
      } else {
        say(`${RPS_GLYPH[theirs]} beats ${RPS_GLYPH[mine]}. ${RPS_LOSS[mine]} ${foeLabel} calls it.`);
        setPhase("decide");
      }
    }, 620);
  };

  /* The dummy's call is a rule, not a coin: a sparring partner that wins
     the throw always elects to swing first. Stated plainly so nobody has
     to wonder whether the trainer is cheating. */
  uE(()=>{
    if(phase!=="decide" || winner!==1) return;
    timer.current = setTimeout(()=>{
      say(`${foeLabel} takes the first turn — it always does. Brace up.`);
      setPhase("done");
      timer.current = setTimeout(()=>onSeated(1), 900);
    }, 500);
  },[phase,winner]);

  const decide = choice => {
    const first = rpsSeat(0, choice);
    say(first===0 ? "You take the first turn. Initiative is yours." : "You hand it the first turn — you keep the extra card.");
    setPhase("done");
    timer.current = setTimeout(()=>onSeated(first), 800);
  };

  const shaking = phase==="shaking";
  return (
    <div className="rps">
      <div className="rtitle">{coinMode ? "The Coin" : "The Throw"}</div>
      <p className="rsub">Winner decides who takes the first turn.<br/>Going first buys initiative; going second keeps a card.
        {coinMode && <><br/><span style={{opacity:.8}}>Against the AI a coin decides it. Rock-paper-scissors is saved for the ranked ladder.</span></>}</p>
      <div className="rtable">
        <div className={"rseat"+(winner===0?" win":"")}>
          <span className="rwho">You · {h.n}</span>
          <span className="rglyph">{coinMode ? (winner===0?"🪙":"·") : shaking ? "✊" : live ? RPS_GLYPH[live.mine] : "·"}</span>
          <span className="rname">{coinMode ? (winner===null?"flipping":winner===0?"wins the flip":"loses the flip")
                                            : shaking ? "shaking" : live ? live.mine : "ready"}</span>
          {!coinMode && <span className="rscore">{series.a}</span>}
        </div>
        <span className="rvs">VS</span>
        <div className={"rseat"+(winner===1?" win":"")}>
          <span className="rwho">{foeLabel}</span>
          <span className="rglyph">{coinMode ? (winner===1?"🪙":"·")
                                             : shaking || !live || live.theirs===null ? "✊" : RPS_GLYPH[live.theirs]}</span>
          <span className="rname">{coinMode ? (winner===null?"flipping":winner===1?"wins the flip":"loses the flip")
                                            : shaking || !live || live.theirs===null ? "shaking" : live.theirs}</span>
          {!coinMode && <span className="rscore">{series.b}</span>}
        </div>
      </div>
      <div className="rcall">
        {phase==="throw" && coinMode && <span>Flipping for the seating…</span>}
        {phase==="throw" && !coinMode && <span>{rounds.length ? <span>Tied <b>{series.ties}</b> — throw again.</span> : "Pick your throw."}</span>}
        {shaking && <span>Rock… paper… scissors…</span>}
        {phase==="decide" && winner===0 && <span>You won the {coinMode?"flip":"throw"}. <b>Your call.</b></span>}
        {phase==="decide" && winner===1 && <span>{foeLabel} won the {coinMode?"flip":"throw"}. It is deciding…</span>}
        {phase==="done" && <span>Seated. Stepping to the table…</span>}
      </div>
      {!coinMode && (phase==="throw"||shaking) && <div className="rthrows">
        {RPS_THROWS.map(t=>(
          <button key={t} disabled={shaking} onClick={()=>throwIt(t)}>
            <span className="g">{RPS_GLYPH[t]}</span><span className="l">{t}</span>
          </button>
        ))}
      </div>}
      {phase==="decide" && winner===0 && <div className="rseatpick">
        <button className="go" onClick={()=>decide("first")}>I go first<span className="sub">take the initiative</span></button>
        <button onClick={()=>decide("second")}>It goes first<span className="sub">keep the extra card</span></button>
      </div>}
      <div className="rlog">{log.map((m,i)=><div key={i}>{m}</div>)}</div>
      {phase!=="done" && <button className="rback" onClick={onBack}>← back to the roster</button>}
    </div>
  );
}

/* ============================================================
   THE TABLE — find an opponent, sit down, play across two phones.

   Roadmap Phase B step 7, wired through to a screen. The rules layer
   underneath is engine/actions.js's BLANK action set, not the card pool:
   `foeVanilla` still fabricates the dummy's swing as [3,4,5][(turn-1)%3],
   so seat 1 has no action phase and two hero decks cannot yet cross the
   wire. That is Phase A step 4 plus the judge.js reducer extraction, and
   it is rules work rather than network work — see CLAUDE.md. What this
   screen proves is the whole transport: two phones, a table code, real
   priority handoffs, a real combat chain, and a state hash that agrees.

   Everything below reaches the engine module-qualified (DawnRoom.*,
   DawnNet.*, DawnActions.*) — none of it is bridged to a bare name,
   because `open`, `reduce`, `legal` and `hash` are far too generic to
   own as globals. test/sync.test.js pins that.
   ============================================================ */
/* THE LADDER (SERVER S5.3): the public standings of ranked server tables, and the last few games. Readable by anyone; it never signs a phone in (the caller's own
   line is asked for only when `who` says this phone already has a sign-in). The rows are plain text: nothing here is tappable because nothing here does anything. */
const LAD_END = {life:"won", concession:"conceded", forfeit:"forfeit", stalemate:"draw"};
const ladHero = k => { const h = HEROES.find(x=>x.k===k); return h ? heroShort(h) : String(k||"").replace(/^./,c=>c.toUpperCase()); };
/* A PLAYER'S OWN LINE ABOUT ONE RANKED GAME (V): how it ended, from their side of the table; the rating move with a sign (never colour alone) */
const myHow = (r, how) => how==="life" ? "on life" : how==="stalemate" ? "a dead position" : how==="concession" ? (r==="won" ? "they conceded" : "you conceded") : (r==="won" ? "they left the table" : "the clock ran out");
const myChange = c => c>0 ? "+"+c : c<0 ? "\u2212"+(-c) : "\u00b10";
const ladAgo = at => { const m = Math.floor(Math.max(0, Date.now()-at)/60000); if(m<1) return "just now"; if(m<60) return m+" min ago"; const h = Math.floor(m/60); if(h<48) return h+(h===1?" hour ago":" hours ago"); return Math.floor(h/24)+" days ago"; };
</script>
<script type="text/babel" data-presets="env,react">
function SrvLadder({wire, who}){
  const [st,setSt] = uS({s:"loading"});
  const tick = uR(0), alive = uR(true);
  uE(()=>()=>{ alive.current = false; },[]);
  const load = () => {

      setHostRanked(!!(ch.rank && ch.rank().ranked));
      setMode("srv-host"); setStat("srv-waiting");
      waitRef.current = {ch, go};
    }).catch(e=>{
      if(!live.current) return;
      setStat(null); setBusy(false);
      if(e && e.why==="table-cap") setCapOpen(Array.isArray(e.open) ? e.open : []);
      if(!e || e.why==="unavailable" || !SRV_WHY[e.why]) setGone(true); else setErr(SRV_WHY[e.why]);
    });
  };
  const srvSaved = uM(()=>{ try {
    const ls = window.localStorage, names = [];
    for(let i = 0; i < ls.length; i++){ const k = ls.key(i); if(/^dawnblade\.srv\./.test(k)) names.push(k.slice("dawnblade.".length)); }
    return DawnServerTable.savedSeats(store, names, Date.now(), 3*24*3600*1000).slice(0, 2);
  } catch(_){ return []; } },[]);
  const srvLeave = () => { const w = waitRef.current; waitRef.current = null;
    if(w){ try{ w.ch.forget(); w.ch.close(); }catch(_){} }
    setMode(null); setErr(null); setGone(false); setBusy(false); setStat(null); };

  /* FIND A MATCH (SERVER S6.1): the referee's queue pairs this phone with the next player who taps it. Nobody waiting: the referee opens a table for this
     player, who sits at it and waits (asking again every ~20 s, or the queue forgets them within a minute); somebody waiting: this phone is sent to THEIR
     table and the game starts. Friendly or ranked follows the switch (the first screen's button is always friendly). The server decides every match. */
  const seekRef = uR(null);                  /* {ranked, table, timer, gen}: the live search, or null */
  const [seekRk,setSeekRk] = uS(false);
  const [seekT0,setSeekT0] = uS(0);
  const [seekNote,setSeekNote] = uS(null);
  /* the usual wait in seconds, told by the waiting answer only when the server had enough seeks to say: held in App (typ / onTyp) so the practice bar reads the same number */
  const seekTyp = typ==null ? null : typ, setSeekTyp = n => { if(onTyp) onTyp(n); };
  uE(()=>()=>{ if(onTyp) onTyp(null); },[]);
  const [,setTick] = uS(0);
  uE(()=>{ if(mode!=="srv-seek" || away) return; const h = setInterval(()=>setTick(t=>t+1), 1000); return ()=>clearInterval(h); },[mode, away]);
  uE(()=>()=>{ const k = seekRef.current; seekRef.current = null; if(k && k.timer) clearTimeout(k.timer); },[]);
  const [lookN,setLookN] = uS(null);
  const [seekCrowd,setSeekCrowd] = uS(null);
  /* read on the server table screen only: the first screen makes no request to the server while a player only looks: the lazy rule */
  uE(()=>{ if(!srvOn || mode!=="srv") return; let dead = false;
    DawnServerTable.looking({transport: srvWire()}).then(r=>{ if(!dead && live.current) setLookN(r); }).catch(()=>{});
    return ()=>{ dead = true; }; },[mode, srvOn]);
  const seekStop = () => { const k = seekRef.current; seekRef.current = null; if(k && k.timer) clearTimeout(k.timer); return k; };
  const seekFail = e => {
    if(!live.current) return;
    seekStop(); const w = waitRef.current; waitRef.current = null; if(w){ try{ w.ch.close(); }catch(_){} }
    setStat(null); setBusy(false); setMode("srv");
    if(e && e.why==="table-cap") setCapOpen(Array.isArray(e.open) ? e.open : []);
    if(!e || e.why==="unavailable" || !SRV_WHY[e.why]) setGone(true); else setErr(SRV_WHY[e.why]);
  };
  const seekAsk = (k, table) => DawnServerTable.seek({transport: srvWire(), identity: srvWho}, {ranked: k.ranked, ...(table ? {table} : {})});
  const seekGot = (k, a) => {
    if(!live.current || seekRef.current!==k) return;
    if(a.state==="matched"){
      /* somebody was waiting: their table. A seat of our own that was waiting is let go (the referee closed its table) */
      const w = waitRef.current; waitRef.current = null; if(w){ try{ w.ch.forget(); w.ch.close(); }catch(_){} }
      seekStop(); setStat("srv-seating");
      return DawnServerTable.sitAt({transport: srvWire(), keep: store, code: a.table, identity: srvWho, tune: {pollMs: 20000, fallbackMs: 2000},
        onStatus: s=>{ if(live.current) setStat("srv-"+s); }
      }).then(ch=>{
        if(!live.current){ ch.close(); return; }
        setCode(ch.code); seekFound(awayRef.current); deliver({table: ch, host:false, code: ch.code, judged: {seat: ch.seat, key: null, srv: true, seek: {ranked: !!k.ranked, since: t0Ref.current}}});
      }).catch(e=>{
        if(!live.current) return;
        /* the table filled or closed on the way there: look again */
        if(e && (e.why==="full" || e.why==="no-table")) return seekGo(k.ranked, true);
        seekFail(e);
      });
    }
    const beat = () => { if(seekRef.current!==k) return; k.timer = setTimeout(()=>{ if(seekRef.current!==k) return;
      seekAsk(k, k.table).then(a2=>seekGot(k, a2)).catch(()=>beat()); }, a.beat || 20000); };
    if(a.state==="waiting") setSeekTyp(Number.isInteger(a.typical) && a.typical>=5 ? a.typical : null);
    if(a.state==="waiting") setSeekCrowd(crowdLine(a.looking) ? a.looking : null);
    if(a.state==="taken") setSeekNote("A player was matched with you — they are sitting down.");
    if(k.table===a.table && waitRef.current) return beat();
    /* waiting at our own table: sit down at it (chair one) and wait for the other player, as a host does */
    const old = waitRef.current; waitRef.current = null; if(old){ try{ old.ch.forget(); old.ch.close(); }catch(_){} }
    k.table = a.table;
    DawnServerTable.sitAt({transport: srvWire(), keep: store, code: a.table, identity: srvWho, role: "creator", tune: {pollMs: 20000, fallbackMs: 2000},
      onStatus: s=>{ if(!live.current) return;
        if(s==="seated" && waitRef.current && waitRef.current.seek===k){ const w = waitRef.current; waitRef.current = null; seekStop(); seekFound(awayRef.current); w.go(); } }
    }).then(ch=>{
      if(!live.current){ ch.close(); return; }
      if(seekRef.current!==k){ try{ ch.close(); }catch(_){} return; }
      setCode(ch.code);
      const go = () => deliver({table: ch, host:false, code: ch.code, judged: {seat: ch.seat, key: null, srv: true}});
      if(ch.peerHeard()){ seekStop(); seekFound(awayRef.current); return go(); }
      waitRef.current = {ch, go, seek: k};
      setStat("srv-seeking"); beat();
    }).catch(seekFail);
  };
  const seekGo = (rk, again) => {
    if(!srvOn || !srvWho) return;
    seekStop();
    const k = {ranked: !!rk, table: null, timer: null};
    seekRef.current = k;
    setErr(null); setGone(false); setBusy(true); setCapOpen([]); setCapNote(null); setSeekNote(null);
    setSeekRk(!!rk); if(!again){ t0Ref.current = Date.now(); setSeekT0(t0Ref.current); setSeekTyp(null); setSeekCrowd(null); } setStat("srv-seeking"); setMode("srv-seek");
    seekAsk(k, null).then(a=>seekGot(k, a)).catch(seekFail);
  };
  /* sent here by a finished server game's Find another match (v6.81): start the same kind of search once, as if the player had tapped it on this screen */
  const againRef = uR(false);
  /* opened from a shared link (v7.08): straight to the right table's number screen, filled in; the player still taps Sit down.
     A server number on a phone with the server table switched off has nowhere to go and leaves the screen as it is. */
  uE(()=>{ if(!join) return;
    if(join.srv){ if(srvOn){ setErr(null); setGone(false); setCode(join.code); setMode("srv-join"); } }
    else { setErr(null); setCode(join.code); setMode("join"); } },[]);
  uE(()=>{ if(!again || againRef.current || !srvOn) return;
    /* a REMATCH (v6.83): both players agreed and the referee opened the new table: sit down at it at once (back to the hero pick) */
    if(again.rematch){ againRef.current = true; if(again.ranked) setRanked(true); setCode(again.rematch); return srvSit("join", again.rematch); }
    if(!srvWho) return; againRef.current = true; if(again.ranked) setRanked(true);
    if(again.since){ t0Ref.current = again.since; setSeekT0(again.since); }
    seekGo(!!again.ranked, !!again.since); if(again.note) setSeekNote(again.note); },[again, srvOn, srvWho]);
  const seekCancel = () => {
    const k = seekStop(), w = waitRef.current; waitRef.current = null;
    if(w){ try{ w.ch.forget(); w.ch.close(); }catch(_){} }
    setMode("srv"); setErr(null); setBusy(false); setStat(null); setSeekNote(null);
    if(k && srvWho) DawnServerTable.seek({transport: srvWire(), identity: srvWho}, {cancel: true}).then(r=>{ if(r.table) try{ store.set("srv."+r.table, null); }catch(_){} }).catch(()=>{});
    if(k && k.table) try{ store.set("srv."+k.table, null); }catch(_){}
  };

  const sit = (host, c, resume) => {
    setErr(null); setBusy(true); setStat("loading");
    DawnRoom.open({
      code:c, host,
      onStatus:s=>{ if(live.current) setStat(s); },
      onClose:()=>{ if(live.current){ setErr("The other phone left the table."); setBusy(false); } }
    }).then(table=>{
      if(!live.current){ table.close(); return; }
      if(host) return onSeated({table, host, code:table.code, resume: resume || null});
      /* A PHONE CANNOT TELL A HOST FROM A JUDGE UNTIL IT SPEAKS (H3): a
         judge's first frame offers this phone a seat; a host's is its lobby
         hello. The frame stays queued for the room either way. */
      setStat("seating");
      return table.first(2500).then(f=>{
        if(!live.current){ table.close(); return; }
        if(f && f.ch === "judge" && f.full){ table.close(); setErr("That judged table already has two players."); setStat(null); setBusy(false); return; }
        const judged = f && f.ch === "judge" && (f.seat === 0 || f.seat === 1) ? {seat: f.seat, key: f.key || null} : null;
        onSeated({table, host:false, code:table.code, judged});
      });
    }).catch(e=>{
      if(!live.current) return;
      setErr((e && e.message) || String(e)); setStat(null); setBusy(false);
    });
  };

  const openTable = () => { const c = DawnRoom.makeCode(); setCode(c); setMode("host"); sit(true, c); };
  /* A TABLE THIS PHONE WAS HOSTING (HIDDEN HANDS H2). The host's phone holds
     the deck and saves the game after every action, so a reload does not end
     it: the host reopens the same table and the guest rejoins. */
  const saved = uM(()=>{ try {
    const ls = window.localStorage, out = [];
    for(let i = 0; i < ls.length; i++){ const k = ls.key(i); if(!/^dawnblade\.table\./.test(k)) continue;
      const v = JSON.parse(ls.getItem(k)); if(v && v.saved && v.spec) out.push({code: k.split(".").pop(), resume: v}); }
    return out.slice(0, 1);
  } catch(_){ return []; } },[]);
  const resumeTable = r => { setCode(r.code); setMode("host"); sit(true, r.code, r.resume); };
  /* JUDGE MODE (HIDDEN HANDS H3): this device holds the deck for two players
     who both join as guests. A judged table it was running resumes too. */
  const judgeTable = (c, resume) => {
    setErr(null); setBusy(true); setStat("loading"); setCode(c); setMode("judge");
    /* channels that open before the judge's screen mounts wait in `q` */
    const conns = {q: [], on: null};
    DawnRoom.openJudge({code:c, onStatus:st=>{ if(live.current) setStat(st); },
      onConnection: ch => conns.on ? conns.on(ch) : conns.q.push(ch)
    }).then(handle=>{
      if(!live.current){ handle.close(); return; }
      onSeated({judge:true, handle, code:handle.code, conns, resume: resume || null});
    }).catch(e=>{ if(!live.current) return; setErr((e && e.message) || String(e)); setStat(null); setBusy(false); });
  };
  const savedJudge = uM(()=>{ try {
    const ls = window.localStorage, out = [];
    for(let i = 0; i < ls.length; i++){ const k = ls.key(i); if(!/^dawnblade\.judge\./.test(k)) continue;
      const v = JSON.parse(ls.getItem(k)); if(v && v.saved && v.spec) out.push({code: k.split(".").pop(), resume: v}); }
    return out.slice(0, 1);
  } catch(_){ return []; } },[]);
  const joinTable = () => {
    if(!DawnRoom.isValid(code)) return setErr("A table code is "+DawnRoom.CODE_LEN+" characters.");
    sit(false, code);
  };

  const quietMs = (window.SERVER_TABLE && window.SERVER_TABLE.quietMs) || 60000;
  return (<>
    {ready && <div className="seekbanner" data-testid="match-ready" role="status"><span>Your match is ready — join within <b className="mono" data-testid="match-left">{clockOf(readyUntil-Date.now())}</b></span>
      <button data-testid="match-take" onClick={()=>{ const s = ready; setReady(null); onSeated(s); }}>Join them</button>
      <button className="quiet" data-testid="match-notnow" onClick={()=>giveBack("declined")}>Not now</button></div>}
    <div className="tblwrap" style={away ? {display:"none"} : null}>
      <div className="tblhead">{only==="direct" ? "Two phones, one table" : "Find an opponent"}</div>

      {!mode && <>
        {!only && <div className="tblcard">
          <p className="note" style={{marginTop:0}}>
            Find a match to play the next player who is looking, or meet a friend:
            one of you opens a table and reads out the code, the other types it in. No account needed.
          </p>
        </div>}
        {/* THREE WAYS TO MEET, side by side, each with its own one-line reason (v6.28). The server table (SERVER S2) is the same
            game with the referee on the web, so the two phones never need to reach each other. */}
        {srvOn && only!=="direct" && <div className="tblgroup">
          <div className="tblgname">Server table</div>
          <p className="tblgnote">Get matched with the next player looking, or share a code with a friend — no direct link needed. Works across any network.</p>
          {srvWho && <button className="bigbtn" data-testid="seek-open" onClick={()=>seekGo(false)}>Find a match</button>}
          <div className="tblrow"><button className={"bigbtn"+(srvWho?" alt":"")} onClick={()=>{ setErr(null); setGone(false); setMode("srv"); }}>Join a server table</button>
            <button className="bigbtn alt" data-testid="ladder-open" onClick={()=>{ setErr(null); setGone(false); ladFrom.current = null; setMode("srv-ladder"); }}>The ladder</button></div>
        </div>}
        {only!=="online" && <div className="tblgroup">
          <div className="tblgname">Direct table</div>
          <p className="tblgnote">Two phones talk straight to each other. No server.</p>
          <div className="tblrow">
            <button className="bigbtn alt" onClick={openTable}>Open a table</button>
            <button className="bigbtn alt" onClick={()=>setMode("join")}>Join a table</button>
          </div>
          {saved.length>0 && <div className="tblrow">{saved.map(r=><button key={r.code} className="bigbtn alt" onClick={()=>resumeTable(r)}>Resume table {r.code}</button>)}</div>}
        </div>}
        {only!=="online" && <div className="tblgroup">
          <div className="tblgname">Judge's table</div>
          <p className="tblgnote">A third phone or tablet holds the deck and keeps the game honest.</p>
          <div className="tblrow">
            <button className="bigbtn alt" onClick={()=>judgeTable(DawnRoom.makeCode())}>Judge a table</button>
            {savedJudge.map(r=><button key={"j"+r.code} className="bigbtn alt" onClick={()=>judgeTable(r.code, r.resume)}>Resume judging {r.code}</button>)}
          </div>
        </div>}
        {/* This said "the drill decks — blank cards" until v2.52, which was
            true before v2.49 and has been wrong since: the table negotiates a
            hero, a throw and a sideboard and runs two real decks. Stale copy
            that UNDER-sells is still stale copy — it tells a player not to
            bother with the screen. The lobby's own note already said this.
            And it said "card text does not resolve yet" until the 1.0 polish
            audit, long after effects.js gave both boards one copy of it. */}
        <p className="mnote">
          Table play runs <strong>two real hero decks</strong> — the full turn structure,
          priority, the combat chain, printed costs, and the card text, read by the
          same engine as the trainer.
        </p>
        {/* THE HONEST LINES, ONE TAP AWAY (v6.82, NEXT 4): who holds the deck at each kind of table (HIDDEN HANDS H2/H3, SERVER S2) were four paragraphs
            under the buttons; they are one sheet now, so the choices fit the first screen and the words are still one tap from every player. */}
        <button className="howbtn" data-testid="hands-open" onClick={()=>setHandsOpen(true)}>Who can see your hand? <b>How each table keeps hands hidden</b></button>
        <HiddenHandsSheet open={handsOpen} srvOn={srvOn} onClose={()=>setHandsOpen(false)}/>
      </>}

      {mode==="srv" && <>
        <div className="tblcard">
          <p className="note" style={{marginTop:0}}>
            Find a match to play the next player who is looking. Or open a table and read out its code,
            or type in the code you were given. The referee on the web seats you both and deals the game.
          </p>
        </div>
        {srvWho && !gone && <div className="tblcard tblwho">
          <span>{myName ? <>Playing as <strong>{myName}</strong></> : "No player name yet — your opponent sees no name."}{myRank && <> · rating <strong data-testid="my-rating">{myRank.rating}</strong></>}</span>
          <button disabled={busy} onClick={()=>{ setErr(null); setDraft(myName||""); setMode("srv-name"); }}>{myName ? "Change" : "Choose a name"}</button>
        </div>}
        {srvWho && !gone && <button role="switch" aria-checked={ranked} data-testid="ranked-switch" className={"tblsw"+(ranked?" on":"")} disabled={busy} onClick={()=>setRanked(r=>!r)}>
          <span>{ranked ? "Ranked table" : "Friendly table"}</span>
          <span className="tblswsub">{ranked ? "Counts toward both ratings" : "Just for fun — nothing is recorded"}</span>
        </button>}
        {srvWho && !gone && ranked && <p className="note" data-testid="ranked-note">A ranked table needs a player name for both of you. Everyone starts at 1200. The throw still decides who chooses to go first.</p>}
        {gone ? null : <>
          {srvWho && <button className="bigbtn" data-testid="seek-go" disabled={busy} onClick={()=>seekGo(ranked)}>{ranked ? "Find a ranked match" : "Find a match"}</button>}
          {srvWho && lookN && (ranked ? lookN.ranked : lookN.friendly)>0 && <p className="note" data-testid="looking-srv" style={{marginTop:-4}}>{lookLine(lookN, ranked)}</p>}
          <button className={"bigbtn"+(srvWho?" alt":"")} disabled={busy} onClick={()=>srvSit("create")}>{busy ? (PHRASE[stat]||"…") : ranked ? "Open a ranked table" : "Open a server table"}</button>
          <button className="bigbtn alt" disabled={busy} onClick={()=>{ setCode(""); setMode("srv-join"); }}>Enter a table code</button>
          {srvSaved.map(r=><button key={r.code} className="bigbtn alt" disabled={busy} onClick={()=>{ setCode(r.code); srvSit("reclaim", r.code, r.role); }}>Resume table {r.code}</button>)}
          <button className="bigbtn alt" disabled={busy} data-testid="ladder-open" onClick={()=>{ setErr(null); ladFrom.current = "srv"; setMode("srv-ladder"); }}>See the ladder</button>
        </>}
        {capNote && <div className="tblok" data-testid="cap-note">{capNote}</div>}
        {capOpen.length>0 && <div className="tblcard" data-testid="cap-open">
          <div className="tblstat">Your open tables</div>
          {capOpen.map(c=><div key={c} className="tblopen"><span className="mono">{c}</span>
            <button disabled={busy} aria-label={"Close table "+c} onClick={()=>setCapAsk(capAsk===c ? null : c)}>Close</button></div>)}
          {capAsk && <div className="tblerr" role="alertdialog" data-testid="close-warn" aria-label={"Close table "+capAsk+"?"} ref={el=>{ if(el && el.scrollIntoView) try{ el.scrollIntoView({block:"nearest"}); }catch(_){} }}>
            <p><strong>Closing now counts as a loss</strong> if table {capAsk} is a ranked table with a game under way: it ends the game for both of you, your opponent takes the win, and your rating moves. A ranked table that has not started yet, and any friendly table, closes without a trace.</p>
            <div className="tblopen"><button disabled={busy} data-testid="close-yes" onClick={()=>closeMine(capAsk)}>Yes, close it</button>
              <button disabled={busy} data-testid="close-no" onClick={()=>setCapAsk(null)}>Keep it</button></div>
          </div>}
          <p className="note">Closing a table ends it for both players. A table that nobody plays also closes by itself after two days.</p>
        </div>}
      </>}

      {mode==="srv-seek" && <>
        <div className="tblcard seekcard" data-testid="seek-card">
          <div className="tblstat">{seekRk ? <><span className="tblrk">Ranked</span>Finding a ranked match</> : "Finding a match"}</div>
          <div className="seekclock mono" data-testid="seek-clock">{clockOf(Date.now()-seekT0)}</div>
          <div className={"tblstat"+(stat==="srv-seeking"?" live":"")}>{stat==="srv-seeking" && <span className="tbldot"></span>}{err||gone ? "" : (PHRASE[stat]||"…")}</div>
          {seekNote && <p className="note" data-testid="seek-note">{seekNote}</p>}
          {seekTyp!=null && stat==="srv-seeking" && <p className="note" data-testid="seek-typical">{usualWaitLine(seekTyp)}</p>}
          {seekCrowd && stat==="srv-seeking" && <p className="note" data-testid="seek-crowd">{crowdLine(seekCrowd)}</p>}
          {(Date.now()-seekT0 >= quietMs || seekCrowd==="none") && stat==="srv-seeking" && onPlayAI && <>
            <p className="note" data-testid="seek-quiet">{seekCrowd==="none" ? "It may be a quiet hour. " : "Nobody has sat down yet. Sometimes it takes a few minutes. "}Practise while you wait: your search keeps going, and you will be told the moment someone arrives.</p>
            <button className="bigbtn alt" data-testid="seek-play-ai" onClick={onPlayAI}>Play the AI while you wait</button></>}
          <p className="note">You are matched with the next player who taps {seekRk ? "Find a ranked match" : "Find a match"}. Keep this screen open — the game starts here the moment they arrive.{seekRk && myRank ? <> Your rating is <strong>{myRank.rating}</strong>.</> : null}</p>
        </div>
      </>}

      {mode==="srv-host" && <>
        <div className="tblcard">
          <div className="tblstat">Your table number — read it out</div>
          <div className="tblcode">{code}</div>
          {!hostRanked && code && <ShareCode code={code}/>}
          {hostRanked && <div className="tblstat" data-testid="host-ranked"><span className="tblrk">Ranked</span>{myRank ? <>your rating <strong>{myRank.rating}</strong></> : null}</div>}
        </div>
        <div className={"tblstat"+(stat==="srv-waiting"?" live":"")}>
          {stat==="srv-waiting" && <span className="tbldot"></span>}
          {err||gone ? "" : (PHRASE[stat]||"…")}
        </div>
      </>}

      {mode==="srv-join" && <>
        <div className="tblcard">
          <div className="tblstat">Table number</div>
          <input className="tblin mono" value={code} maxLength={DawnServerTable.CODE_LEN+2} inputMode="text"
            autoCapitalize="characters" autoCorrect="off" spellCheck={false}
            placeholder="······"
            onChange={e=>{ setErr(null); setGone(false); setCode(DawnServerTable.normalize(e.target.value)); }}/>
        </div>
        <button className="bigbtn" disabled={busy||!DawnServerTable.isValid(code)} onClick={()=>srvSit("join", code)}>
          {busy ? (PHRASE[stat]||"…") : "Sit down"}
        </button>
      </>}

      {mode==="srv-ladder" && <SrvLadder wire={srvWire} who={srvWho}/>}

      {mode==="srv-name" && <>
        <div className="tblcard">
          <div className="tblstat">Your player name</div>
          <input className="tblname" value={draft} maxLength={16} autoCapitalize="words" autoCorrect="off" spellCheck={false}
            placeholder="3 to 16 letters" aria-label="Your player name"
            onChange={e=>{ setErr(null); setDraft(e.target.value); }}/>

/* THE SERVER LINE, ON ANY SCREEN OF A SERVER TABLE (SERVER S2): what the link is doing, said at the top of the
   screen where it cannot be missed, and nothing at all while it is fine. The table keeps this phone's seat;
   every word here is what a player does next. */
/* WHO IS AT THE TABLE (SERVER S4.2): the two display names, once the other player has one. Read off the channel
   (they ride the referee's answers), nothing typed here. */
/* THE NAMES AS A HOOK (SERVER S4.4): the board reads the very names the lobby line does. [seat 0's name | null, seat 1's]; always
   [null, null] off a server table. Never part of the game's state: they are the channel's, not the engine's. */
function useSrvNames(table){
  const [n,setN] = uS([null,null]);
  uE(()=>{
    if(!table || !table.srv || !table.names) return;
    const read = () => setN(p=>{ const v = table.names(); return v[0]===p[0] && v[1]===p[1] ? p : v; });
    read(); const t = setInterval(read, 1000);
    return ()=>clearInterval(t);

}
/* THE RANKED STATE AS A HOOK (SERVER S5.1): {ranked, ratings: [seat 0's, seat 1's], result}; {ranked:false} at any other table */
function useSrvRank(table){

  uE(()=>{
    if(!table || !table.srv || !table.rank) return;
    const read = () => setR(p=>{ const v = table.rank(); return v.ranked===p.ranked && v.ratings[0]===p.ratings[0] && v.ratings[1]===p.ratings[1] && !!v.result===!!p.result ? p : v; });

    return ()=>clearInterval(t);
  },[table]);

}
function SrvNames({table, seat}){

  const me = n[seat], them = n[1-seat], rm = rk.ratings[seat], rt = rk.ratings[1-seat];
  return <div className="tblvs" data-testid="vs-line">{rk.ranked && <span className="tblrk" data-testid="ranked-chip">Ranked</span>}{me ? <strong>{me}</strong> : "You"}{rk.ranked && rm!=null && <span className="tblrt" data-testid="rate-me">{rm}</span>} <span>vs</span> {them ? <strong>{them}</strong> : "a player with no name yet"}{rk.ranked && rt!=null && <span className="tblrt" data-testid="rate-foe">{rt}</span>}</div>;
}
/* THE RATING CHANGE, AT THE END OF A RANKED GAME (SERVER S5.1): the function records the result as the game ends; the phone that made the last move
   already holds it, the other asks. Warm and plain: what happened to YOUR rating, nothing else. */

  const rk = useSrvRank(table);
  const [res,setRes] = uS(null);

    if(!table || !table.srv || !table.result || !rk.ranked) return;
    let dead = false;

    {r.how==="forfeit" && <div data-testid="forfeit-how">{r.winner===seat ? "Won by forfeit: your opponent did not come back in time." : "Lost by forfeit: the game waited for you and you did not come back in time."}</div>}
    {d>0 ? <>Well played. Your rating rose from <strong>{c.from}</strong> → <strong>{c.to}</strong> (+{d}).</>
      : d<0 ? <>Your rating moved from <strong>{c.from}</strong> → <strong>{c.to}</strong> ({"\u2212"}{-d}). Every game teaches something.</>
      : <>Your rating stays at <strong>{c.to}</strong>.</>}

/* REMATCH (v6.83): the same two players again. Each taps Rematch on the end screen; the referee opens a NEW table of the same kind once both have (a ranked
   rematch is a new ranked game) and hands both phones its code (engine/servertable.js `askRematch` / `onRematch`), and this phone sits down there at once: back to
   the hero pick. An ask the other player does not answer within two minutes is taken back (the referee forgets it too), and the screen says so plainly. */
const REMATCH_WAIT = TWO_MINUTES_MS;
function RematchRow({table, seat, name, onGo}){
  const [rm,setRm] = uS(()=>table && table.rematch ? table.rematch() : null);
  const [busy,setBusy] = uS(false);
  const [msg,setMsg] = uS(null);
  const [asked,setAsked] = uS(0);                       /* when this phone asked (its own clock), 0 = not asked */
  const [,setTick] = uS(0);
  const went = uR(false);
  const [capOpen,setCapOpen] = uS([]), [capAsk,setCapAsk] = uS(null), [capFreed,setCapFreed] = uS(false), [capNote,setCapNote] = uS(null);   /* v6.88: the cap's open tables, each closable here */
  uE(()=>{ if(!table || !table.onRematch) return; return table.onRematch(r=>{ setRm(r); if(r.theirs) setMsg(null); }); },[table]);
  uE(()=>{ if(rm && rm.table && !went.current && onGo){ went.current = true; onGo(rm.table); } },[rm && rm.table]);
  /* while this phone waits: a calm count, a resync every 10 s in case a push went missing, and the two-minute give-up */
  uE(()=>{ if(!asked || !table) return; const h = setInterval(()=>{
      setTick(t=>t+1);
      const left = REMATCH_WAIT - (Date.now() - asked);
      if(left <= 0){ setAsked(0); setMsg("No answer from "+name+" — they may have left. You can find another match instead."); table.askRematch(true).catch(()=>{}); return; }
      if(Math.floor(left/1000) % 10 === 0 && table.heal) table.heal();

    if(busy) return; setBusy(true); setMsg(null);
    table.askRematch(cancel).then(r=>{ setBusy(false); setRm(table.rematch()); setAsked(r.state==="waiting" ? Date.now() : 0); },
      e=>{ setBusy(false); setAsked(0); setRm(table.rematch());
        const why = e && e.why;
        if(why==="table-cap"){ setCapOpen(Array.isArray(e.open) ? e.open : []); setCapFreed(false); setCapAsk(null); }
        setMsg(why==="table-cap" ? "Your open tables are full, and one player can only keep so many. Close one of these, then tap Ask again."
          : why==="ranked-name" || why==="ranked-signin" || why==="identity" ? "A ranked rematch needs you signed in with a name."
          : why==="no-table" || why==="auth" ? "This table has closed, so a rematch is not possible here. You can find another match instead."
          : "The server is not answering. Try again in a moment."); });
