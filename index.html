   clearance — used only before the first measurement or when no rail is on
   screen. It is NOT a safe resting value: at 393x852 the rail spans y 628..754
   and 112px puts the preview inside it, where it eats the tap it is supposed to
   be explaining (v2.36 / v2.52). */
.peekwrap{position:fixed;left:0;right:0;bottom:var(--peekbot,112px);z-index:55;display:flex;
  flex-direction:column;align-items:center;gap:0;pointer-events:none;
  animation:pkin .14s ease-out}
.peekwrap>*{pointer-events:auto}
@keyframes pkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* the card also fits the height left above the hand, less the jump row, the HUD, their strip and the dock's bar
   (215): on a 568-tall phone a 52vw card stood 292 px and covered the jump row and the HUD (v7.15, one screen's tap
   sweep). v7.15 also hid the card under 700 px tall, because the hand wheel's top card was already magnified; v7.16
   retired the wheel and the hide stayed, so on an iPhone (Safari's view is ~660 px tall) a tapped card showed its
   name bar alone: "the card previews broke" (user, 2026-11-26). v7.17: the card shows at every height, and never
   smaller than 150 px wide (the old three-screen board's glance) where the screen has room for it; on a short phone
   that glance may lie over THEIR strip and the HUD while it is open (a tap anywhere closes it; tools/tapjudge.js
   reports what it covers as exempt). The last term keeps its top under the jump row (bar 46 + jump row 44 + gaps). */
.peekcard{width:min(172px,52vw,max(150px,calc((100vh - var(--peekbot,112px) - 215px) * .714)),calc((100vh - var(--peekbot,112px) - 104px) * .714));filter:drop-shadow(0 10px 26px rgba(0,0,0,.75))}
.peekcard .cfw{border:1px solid var(--y);border-radius:4px;overflow:hidden}
.peekbar{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:5px;
  background:var(--forge);border:1px solid var(--y);border-radius:3px;padding:4px 10px;
  box-shadow:0 6px 18px rgba(0,0,0,.6)}
.peekbar .pknm{font-family:'Big Shoulders Display';font-weight:700;font-size:14px;
  letter-spacing:.03em;text-transform:uppercase;color:var(--bone);line-height:1.1}
.peekbar .pkkw{font-family:'Spline Sans Mono';font-size:var(--fs-xs);color:var(--bone);opacity:.85;
  max-width:70vw;text-align:center;line-height:1.25}
.peekbar .pkhint{font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.09em;
  text-transform:uppercase;color:var(--y)}
.hand .hc.peek,.chand .hc.peek,.phand .hc.peek{transform:translateY(-7px);
  outline:1px solid var(--y);outline-offset:-1px}
.hand .hc.peek.dis,.chand .hc.peek.dis,.phand .hc.peek.dis{opacity:.85}

/* v2.14 — the pregame throw. Seating is decided before a card is drawn,
   so this is its own screen rather than a banner on the loadout. */
.rps{padding:14px 12px 18px;display:flex;flex-direction:column;gap:12px}
.rps .rtitle{font-family:'Big Shoulders Display';font-weight:800;font-size:28px;
  letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1}
.rps .rsub{text-align:center;font-size:11.5px;color:var(--bone-dim);line-height:1.5;margin:-6px 0 0}
.rps .rtable{display:flex;align-items:stretch;gap:8px}
.rps .rseat{flex:1;background:var(--forge);border:1px solid var(--line);border-radius:4px;
  padding:10px 8px;text-align:center;min-height:104px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px}
.rps .rseat.win{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
.rps .rseat .rwho{font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--bone-dim)}
.rps .rseat .rglyph{font-size:38px;line-height:1}
.rps .rseat .rname{font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.08em;
  text-transform:uppercase;color:var(--bone)}
.rps .rseat .rscore{font-family:'Big Shoulders Display';font-weight:800;font-size:24px;color:var(--y)}
.rps .rvs{flex:none;align-self:center;font-family:'Big Shoulders Display';font-weight:800;
  font-size:var(--fs-body);color:var(--bone-dim);letter-spacing:.08em}
.rps .rcall{text-align:center;font-size:12.5px;line-height:1.5;min-height:36px;padding:0 4px}
.rps .rcall b{color:var(--y)}
.rps .rthrows{display:flex;gap:8px}
.rps .rthrows button{flex:1;padding:14px 4px 11px;background:var(--forge2);border:1px solid var(--line);
  border-radius:4px;color:var(--bone);display:flex;flex-direction:column;align-items:center;gap:5px}
.rps .rthrows button:disabled{opacity:.4}
.rps .rthrows button .g{font-size:30px;line-height:1}
.rps .rthrows button .l{font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.11em;text-transform:uppercase}
.rps .rseatpick{display:flex;gap:8px}
.rps .rseatpick button{flex:1;padding:13px 8px;font-family:'Big Shoulders Display';font-weight:700;
  font-size:17px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:4px;background:var(--forge2);color:var(--bone)}
.rps .rseatpick button.go{background:var(--y);color:var(--ink);border-color:var(--y)}
.rps .rseatpick button .sub{display:block;font-family:'Spline Sans Mono';font-weight:400;
  font-size:var(--fs-xs);letter-spacing:.06em;text-transform:none;color:inherit;opacity:.75;margin-top:2px}
.rps .rlog{font-family:'Spline Sans Mono';font-size:9.5px;line-height:1.7;color:var(--bone-dim);
  background:var(--forge);border:1px solid var(--line);border-radius:3px;padding:7px 9px;max-height:88px;overflow-y:auto}
.rps .rback{align-self:center;font-family:'Spline Sans Mono';font-size:var(--fs-sm);letter-spacing:.1em;
  text-transform:uppercase;color:var(--bone-dim);background:none;border:none;padding:6px}
/* who is across the table — chosen at the scout panel (v2.41) */
.foepick{display:flex;flex-direction:column;gap:5px;margin:10px 0 0}
.foepick label{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--bone-dim)}
/* who sits across the new engine's table (v5.35): the Dummy, Random, or a
   hero the AI pilots. Tiles, never a <select> — a select inside a tappable
   slot swallows its own clicks (v2.81). */
.aifoe{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:8px 0 0}
.aifoe button{background:var(--forge);border:1px solid var(--line);border-radius:3px;
  padding:4px 3px 5px;color:var(--bone);display:flex;flex-direction:column;align-items:center;
  gap:3px;min-width:0;cursor:pointer}
.aifoe button.on{border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b)}
.aifoe .fport{width:100%;aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;
  justify-content:center;font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-h2);color:var(--y)}
.aifoe .fport .art,.aifoe .fport .fallbackart{width:100%;height:100%;object-fit:cover}
/* YOUR RECORD under the name (v5.84): quiet, mono, one line; draws dimmer */
.aifoe .frec{font-family:'Spline Sans Mono';font-size:var(--fs-xs);letter-spacing:.02em;color:var(--y);
  line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.aifoe .frec .frecd{color:var(--bone-dim)}
.frecnote{margin:8px 0 0;font-size:var(--fs-md)}
.aifoe .fname{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.04em;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* SHARP / STEADY (lookahead phase 2) — how the AI hero thinks. Two tiles,
   same idiom as the picker above it; the Dummy has no level. */
.foestep{display:flex;flex-direction:column;min-height:calc(100vh - 8px);max-width:100%}
.foebody{padding:5px 6px 12px;box-sizing:border-box;max-width:100%}
.foereveal{margin:10px 0 2px;text-align:center;font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-body);letter-spacing:.04em;color:var(--bone-dim)}
.foereveal b{color:var(--y);letter-spacing:.06em}
.foebar{position:sticky;bottom:0;background:var(--ink);padding:8px 0 10px;margin-top:8px}
.foechange{display:inline-block;margin:2px 0 0;padding:0;min-height:44px;background:none;border:0;color:var(--bone-dim);font-family:'Spline Sans Mono';font-size:var(--fs-md);text-decoration:underline}
.ailevel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 0}
.ailevel button{background:var(--forge);border:1px solid var(--line);border-radius:3px;
  padding:8px 8px 7px;color:var(--bone);text-align:left;min-width:0;min-height:44px;cursor:pointer}
.ailevel button.on{border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b)}
.ailevel .lvl{display:block;font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-body);
  letter-spacing:.04em;text-transform:uppercase}
.ailevel button.on .lvl{color:var(--y)}
.ailevel .lsub{display:block;font-size:var(--fs-md);line-height:1.3;color:var(--bone-dim);margin-top:2px}
/* ---- JUDGE!! — the in-game bug report (v2.22) ---- */
.judgebtn{flex:none;background:var(--r);color:var(--bone);border:none;border-radius:2px;
  font-family:'Spline Sans Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:3px 8px;cursor:pointer;text-transform:uppercase;line-height:1.4}
.judgebtn:active{transform:translateY(1px)}
/* JUDGE!! drew 18px tall: the same invisible hit area, 44px, over text-only
   neighbours (the pane flag's labels, the scoreboard below). It reaches only 8px
   up because the pane clips at its own top edge, 9px above the button. */
.judgebtn{position:relative;z-index:1}   /* above the clipped scoreboard, which paints later */
.judgebtn::after{content:"";position:absolute;inset:-8px -6px -18px}
.bugwrap{position:fixed;inset:0;z-index:80;background:rgba(8,6,5,.78);
  display:flex;align-items:flex-end;justify-content:center}
.bugsheet{width:100%;max-width:560px;background:var(--forge);border-top:2px solid var(--r);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.bugh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.bugt{font-family:'Big Shoulders Display';font-weight:800;font-size:21px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--rt)}
.bugmeta{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:var(--bone-dim);
  letter-spacing:.06em;text-transform:uppercase}
.bughint{font-size:11.5px;color:var(--bone-dim);line-height:1.45;margin:7px 0 8px}
.bugta{width:100%;min-height:96px;background:var(--ink);color:var(--bone);border:1px solid var(--line);
  border-radius:3px;padding:9px 10px;font:13px/1.5 inherit;resize:vertical}
.bugok{margin-top:8px;font-size:11.5px;color:var(--y);font-family:'Spline Sans Mono',monospace;
  letter-spacing:.04em}
/* A blocked clipboard is not a success. Never dressed as one. */
.bugok.warn{color:var(--rt)}
.bugrow{display:flex;gap:7px;margin-top:10px}
/* How to play (v6.57): the Judge sheet's frame, in the gold of a lesson rather than the red of a report */
.howsheet{border-top-color:var(--y)}
.howt{color:var(--y)}
.howh{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-body);letter-spacing:.06em;
  text-transform:uppercase;color:var(--bone);margin:12px 0 3px}
.howbtn{display:block;width:100%;margin-top:8px;padding:12px 6px;background:none;border:0;
  color:var(--bone-dim);font-size:var(--fs-xl);text-align:center;cursor:pointer}
.howbtn b{color:var(--y);font-weight:700}
.howbtn.fresh{border:1px solid var(--y);border-radius:3px;color:var(--bone);background:rgba(232,179,60,.07)}
/* ---- the title screen: the first thing a player sees; every mode one big, separate choice ---- */
.title{display:flex;flex-direction:column;gap:10px;padding:14px 0 8px}
.tbrand{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(44px,15vw,72px);line-height:.95;letter-spacing:.06em;text-align:center;margin-top:6px}
.tbrand em{font-style:normal;color:var(--y)}
.tline{text-align:center;color:var(--bone-dim);font-size:var(--fs-body);line-height:1.45;margin:2px 4px 8px}
.tmodes{display:flex;flex-direction:column;gap:10px}
.tmode{display:block;width:100%;min-height:68px;text-align:left;padding:12px 16px;background:var(--forge2);border:1px solid var(--line);border-left:5px solid var(--r);color:var(--bone)}
.tmode.lead{background:var(--r);border-color:var(--r);border-left-color:var(--y)}
.tmode b{display:block;font-family:'Big Shoulders Display';font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.tmode span{display:block;font-size:var(--fs-body);line-height:1.35;margin-top:2px}
.tmode:not(.lead) span{color:var(--bone-dim)}
.tmore{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
/* YOUR RECORD (v7.00): the rating over the last ranked games, and the heroes played most */
.recline{margin:10px 0 0}
.recline figcaption{display:flex;justify-content:space-between;gap:8px;font-family:'Spline Sans Mono';font-size:var(--fs-xs);color:var(--bone-dim)}
.recfav{margin:8px 0 0;font-size:var(--fs-md);color:var(--bone-dim)}
.recfav b{color:var(--bone)}
.tmore button{flex:1;min-height:44px;padding:8px 4px;border:1px solid var(--line);background:var(--forge);font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-xl);letter-spacing:.08em;text-transform:uppercase;color:var(--bone)}
.tmore button.fresh{border-color:var(--y)}
.totitle{min-height:44px;padding:0 10px;color:var(--bone-dim);font-size:var(--fs-xl);letter-spacing:.06em;text-transform:uppercase;margin-right:auto;margin-left:10px}
.howp{font-size:var(--fs-body);color:var(--bone-dim);line-height:1.5;margin:0}
.bugrow .bigbtn{flex:1;font-size:var(--fs-lg);padding:11px 6px;min-height:44px}
/* ---- the table: find an opponent, and the networked board ------------ */
.tblwrap{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.tblhead{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-big);letter-spacing:.16em;text-transform:uppercase;color:var(--y)}
.tblcard{background:var(--forge);border:1px solid var(--line);padding:14px 12px}
.tblcode{font-family:'Spline Sans Mono',monospace;font-size:46px;letter-spacing:.28em;text-align:center;color:var(--y);padding:10px 0 4px;text-shadow:0 2px 0 rgba(20,16,14,.5)}
.seekclock{font-size:40px;letter-spacing:.08em;text-align:center;color:var(--y);padding:8px 0 2px;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(20,16,14,.5)}
.seekbanner{position:fixed;left:0;right:0;top:0;z-index:90;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--y);color:var(--ink);box-shadow:0 3px 0 rgba(20,16,14,.55)}
.seekbanner span{flex:1;font-weight:700;line-height:1.25}
.seekbanner{flex-wrap:wrap}
.seekbanner span{min-width:12em}
.seekbanner button.quiet{background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:700}
.seekbanner button{min-height:44px;padding:0 16px;background:var(--ink);color:var(--y);border:1px solid var(--ink);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.waitbar{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 12px;background:var(--forge);border:1px solid var(--line)}
.waitbar span{flex:1;line-height:1.3}
.waitbar .waittyp{display:block;margin-top:4px;color:var(--mute,inherit);opacity:.8}
.waitbar button{min-height:44px;padding:0 14px}
.tblin{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);font-family:'Spline Sans Mono',monospace;font-size:34px;letter-spacing:.24em;text-align:center;text-transform:uppercase;padding:12px 6px}
.tblin:focus{outline:none;border-color:var(--y)}
.tblstat{font-size:12.5px;color:var(--bone-dim);text-align:center;min-height:18px}
.tblstat.live{color:var(--y)}
.tblname{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);font-size:20px;text-align:center;padding:12px 6px;margin-top:8px}
.tblname:focus{outline:none;border-color:var(--y)}
.tblrec{font-family:'Spline Sans Mono',monospace;font-size:var(--fs-h2);letter-spacing:.1em;text-align:center;color:var(--y);padding:12px 0 6px;overflow-wrap:anywhere;user-select:all}
.tblrecin{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);font-family:'Spline Sans Mono',monospace;font-size:var(--fs-h2);letter-spacing:.1em;text-align:center;text-transform:uppercase;padding:12px 4px;margin-top:8px}
.tblrecin:focus{outline:none;border-color:var(--y)}
.tblok{font-size:14px;color:var(--bone);background:rgba(80,160,90,.12);border:1px solid var(--line);padding:9px 10px}
.tblwho{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--bone-dim)}
.tblwho strong{color:var(--bone);font-size:var(--fs-body);overflow-wrap:anywhere}
.tblwho button{flex:none;background:none;border:1px solid var(--line);color:var(--y);font-size:var(--fs-xl);padding:8px 12px;min-height:40px}
.tblvs{font-size:var(--fs-xl);color:var(--bone-dim);text-align:center;margin-top:4px;overflow-wrap:anywhere}
.tblvs strong{color:var(--bone)}
.tblrk{display:inline-block;font-size:var(--fs-md);letter-spacing:.12em;text-transform:uppercase;color:var(--y);border:1px solid var(--y);padding:2px 8px;margin-right:6px}
.tblrt{color:var(--y);font-family:'Spline Sans Mono',monospace;font-size:var(--fs-lg);margin-left:4px}
.tblsw{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:1px solid var(--line);color:var(--bone);font-size:var(--fs-body);padding:8px 12px;min-height:44px}
.tblsw.on{border-color:var(--y);color:var(--y)}
.tblsw .tblswsub{font-size:var(--fs-lg);color:var(--bone-dim);text-align:right}
.rankchg{font-size:14px;line-height:1.45;margin-top:10px;padding:9px 10px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.rematch{margin-top:10px}
.rematch .note{margin:0 0 8px}
.rankchg strong{color:var(--y);font-family:'Spline Sans Mono',monospace}
.ffbar{position:fixed;left:12px;right:12px;top:max(8px,env(safe-area-inset-top));z-index:59;max-width:536px;margin:0 auto;padding:9px 10px;border:1px solid var(--line);background:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:14px;line-height:1.45}   /* fixed like the server banner (which, at z 60, covers it when the link is in trouble): a countdown or a claim is never below the fold */
.ffbar strong{color:var(--y);font-family:'Spline Sans Mono',monospace}
.ffbar.mine,.ffbar.due{border-color:var(--y)}
.ffbar button{display:block;margin-top:8px;min-height:44px;padding:8px 14px;background:none;border:1px solid var(--y);color:var(--y);font-size:14px}
.ffbar button:disabled{opacity:.5}
.ffbar .note{margin-top:6px}
.ladnote{margin:0;font-size:12.5px;line-height:1.45;color:var(--bone-dim)}
.ladyou{font-size:14px;line-height:1.45;padding:10px 12px;border:1px solid var(--y);background:rgba(232,179,60,.08);color:var(--bone);overflow-wrap:anywhere}
.ladyou strong{color:var(--y)}
.ladlist{list-style:none;margin:0;padding:0}
.ladrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 6px;min-height:44px;border-top:1px solid var(--line)}
.ladrow:first-child{border-top:0}
.ladrow.me{background:rgba(232,179,60,.12);box-shadow:inset 3px 0 0 var(--y)}
.ladrk{font-family:'Spline Sans Mono',monospace;font-size:var(--fs-xl);color:var(--bone-dim);text-align:right}
.ladnm{min-width:0;overflow-wrap:anywhere;font-size:var(--fs-body);line-height:1.25;color:var(--bone)}
.ladnm small{display:block;margin-top:2px;font-size:11.5px;color:var(--bone-dim);font-family:'Spline Sans Mono',monospace}
.ladrt{font-family:'Spline Sans Mono',monospace;font-size:17px;color:var(--y);text-align:right;min-width:3.4em}
.ladgame{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4;color:var(--bone);overflow-wrap:anywhere}
.ladgame:first-child{border-top:0}
.ladgame small{display:block;font-size:11.5px;color:var(--bone-dim)}
.mygame{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;min-height:44px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4;color:var(--bone);overflow-wrap:anywhere}
.mygame:first-child{border-top:0}
.mygame small{display:block;font-size:11.5px;color:var(--bone-dim)}
.mychg{font-family:'Spline Sans Mono',monospace;font-size:15px;text-align:right;min-width:3em;color:var(--bone-dim)}
.mychg.up{color:var(--y)}
.heromid .pname .prate{color:var(--y);font-family:'Spline Sans Mono',monospace}
.heromid{min-width:0}
.heromid .pname{max-width:100%;font-size:var(--fs-sm);line-height:1.15;letter-spacing:.02em;color:var(--bone-dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblopen{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.tblopen button{flex:none;background:none;border:1px solid var(--line);color:var(--y);font-size:var(--fs-xl);padding:8px 12px;min-height:44px}
.tblopen .mono{font-family:'Spline Sans Mono',monospace;letter-spacing:.1em;font-size:16px}
.tblerr{font-size:var(--fs-xl);color:var(--rt);background:rgba(196,48,43,.12);border:1px solid var(--r);padding:9px 10px}
.tblrow{display:flex;gap:8px;flex-wrap:wrap}
.tblgroup{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:10px}
.tblgname{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-body);letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.tblgnote{margin:0;font-size:var(--fs-lg);line-height:1.4;color:var(--bone-dim)}
.tblrow .bigbtn{flex:1 1 120px}
.tbldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;animation:tblpulse 1.4s ease-in-out infinite}
@keyframes tblpulse{0%,100%{opacity:.35}50%{opacity:1}}

.mboard{display:flex;flex-direction:column;gap:8px}
.mseat{display:flex;align-items:center;justify-content:space-between;background:var(--forge);border:1px solid var(--line);padding:8px 10px}
.mseat.me{border-color:var(--y)}
.mseat .who{font-family:'Big Shoulders Display';font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.mseat .hp{font-family:'Spline Sans Mono',monospace;font-size:var(--fs-h2);color:var(--y)}
.mseat .zn{font-size:var(--fs-md);color:var(--bone-dim);font-family:'Spline Sans Mono',monospace}
.mstep{display:flex;align-items:center;justify-content:space-between;background:var(--forge2);border:1px solid var(--line);padding:7px 10px;font-size:var(--fs-lg)}
.mstep .sv{font-family:'Spline Sans Mono',monospace;color:var(--y);text-transform:uppercase;letter-spacing:.06em}
.mlink{font-style:normal;color:var(--rt);animation:tblpulse 1.4s ease-in-out infinite}
.mturn{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-body);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:7px;border:1px solid var(--line)}
.mturn.mine{background:var(--y);color:var(--ink)}
.mturn.theirs{background:var(--forge);color:var(--bone-dim)}
.mhand{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0}
.mcard{flex:0 0 auto;min-width:62px;background:var(--forge);border:1px solid var(--line);padding:6px 7px;text-align:center;font-family:'Spline Sans Mono',monospace;font-size:var(--fs-md);color:var(--bone-dim)}
.mcard .nm{display:block;color:var(--bone);font-size:var(--fs-lg)}
.mcard.on{border-color:var(--y);background:var(--forge2);color:var(--y)}
.mcard.blk{border-color:var(--b)}
.macts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.macts .a{padding:11px 4px;font-size:var(--fs-xl)}
.mfeed{background:var(--forge);border:1px solid var(--line);padding:8px 10px;font-size:var(--fs-lg);color:var(--bone-dim);min-height:56px;max-height:110px;overflow-y:auto}
.mfeed div:last-child{color:var(--bone)}
.srvbar{position:fixed;left:12px;right:12px;top:max(8px,env(safe-area-inset-top));z-index:60;font-size:var(--fs-xl);line-height:1.4;padding:9px 10px;max-width:536px;margin:0 auto;background:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.srvbar.warn{color:var(--y);border:1px solid var(--y)}
.srvbar.bad{color:var(--rt);border:1px solid var(--r)}
.mnote{font-size:var(--fs-md);color:var(--bone-dim);line-height:1.5;border-left:2px solid var(--line);padding-left:8px}

/* ---- the lobby: hero, throw, seating (v2.49) ---- */
.tblhead .tblseat{float:right;font-family:'Spline Sans Mono',monospace;font-size:var(--fs-md);letter-spacing:.04em;color:var(--bone-dim);text-transform:none;padding-top:10px}
.lobsteps{display:flex;gap:6px}
.lobstep{flex:1;text-align:center;font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-lg);letter-spacing:.14em;text-transform:uppercase;padding:6px 2px;border:1px solid var(--line);color:var(--bone-dim)}
.lobstep.on{border-color:var(--y);color:var(--y);background:var(--forge2)}
.lobstep.done{color:var(--ok);border-color:var(--ok)}
.lobheroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.lobhero{background:var(--forge);border:1px solid var(--line);padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.lobhero.on{border-color:var(--y);background:var(--forge2)}
.lobhero:disabled{opacity:.4}
.lobhero .lhport{width:100%;aspect-ratio:1;overflow:hidden;border:1px solid var(--line)}
.lobhero .lhn{font-family:'Big Shoulders Display';font-weight:700;font-size:var(--fs-xl);letter-spacing:.06em;text-transform:uppercase;color:var(--bone)}
.lobhero.on .lhn{color:var(--y)}
.lobhero .lhc{font-size:9.5px;color:var(--bone-dim);text-align:center;line-height:1.2}
.lobseat{display:flex;flex-direction:column;gap:10px;align-items:center}
.foefixed{background:var(--ink);border:1px solid var(--y);color:var(--y);padding:9px 10px;font-size:14px;text-align:center}

/* ---- the networked board ---- */
.mseat .zn{display:flex;gap:9px}
.mz{display:inline-flex;gap:3px;align-items:baseline}
.mz b{color:var(--bone);font-size:var(--fs-xl)}
.mgear{display:flex;gap:4px;flex-wrap:wrap;min-height:24px}
.mpiece{flex:0 0 auto;background:var(--forge);border:1px solid var(--line);padding:4px 7px;font-size:10.5px;color:var(--bone-dim);display:inline-flex;gap:5px;align-items:center}
.mpiece b{font-family:'Spline Sans Mono',monospace;color:var(--bt);font-size:var(--fs-lg)}
.mpiece.on{border-color:var(--y);color:var(--y)}
.mpiece.blk{border-color:var(--b);color:var(--bt)}
.mpiece.dead{opacity:.35;text-decoration:line-through}
.mpiece.dim{opacity:.45}
.mpiece.arena{border-color:var(--ok);color:var(--ok)}
.mpiece.ars{border-color:var(--y)}
.mchain{display:flex;gap:8px;align-items:center;background:var(--forge2);border:1px solid var(--r);padding:6px 9px;font-size:var(--fs-lg)}
.mchain .cl{font-family:'Big Shoulders Display';font-weight:800;letter-spacing:.1em;color:var(--rt);font-size:var(--fs-lg)}
.mchain .cn{flex:1;color:var(--bone)}
.mchain .cp{font-family:'Spline Sans Mono',monospace;color:var(--y);font-size:var(--fs-body)}
.mchain .ct{font-size:var(--fs-md);color:var(--bone-dim)}
.mhand{align-items:flex-start}
.mhand .mcard{min-width:0;padding:2px;border:1px solid transparent;background:none;position:relative}
.mhand .mcard .cfw{width:66px}
.mhand .mcard.on{border-color:var(--y)}
.mhand .mcard.blk{border-color:var(--b)}
.mhand .mcard.dim{opacity:.42}
.mcard .pv{position:absolute;right:3px;bottom:3px;background:var(--ink);border:1px solid var(--y);color:var(--y);font-family:'Spline Sans Mono',monospace;font-size:var(--fs-sm);padding:0 3px}
.mpay{border:1px solid var(--y);background:var(--forge);padding:8px}
.mpay .payhead{font-size:var(--fs-lg);color:var(--bone-dim);margin-bottom:6px}
.mpay .payhead b{color:var(--y);font-family:'Spline Sans Mono',monospace;font-size:14px}
.mtgt{display:flex;gap:6px;align-items:center;font-size:var(--fs-lg);color:var(--bone-dim)}
.mtgt .a{padding:6px 10px;font-size:var(--fs-lg)}
.mover{border:1px solid var(--y);background:var(--forge2);padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px}
.mover b{font-family:'Big Shoulders Display';font-weight:800;font-size:var(--fs-big);letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.mover span{font-size:var(--fs-lg);color:var(--bone-dim)}
.phasebar{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:4px;padding:3px 7px;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  font-size:var(--fs-md);letter-spacing:.02em;opacity:.85}
.phasebar b{font-weight:700}
.phasebar .ph{text-transform:lowercase;opacity:.9}
/* THE 44px TAP FLOOR (M, tools/tapjudge.js; POLISH.md condition 1). Every control a player meets takes a tap
   at least 44 CSS px tall AND wide: the page.js rows measure it at 393x852 and 320x568. The jump row, JUDGE!!, the
   status line's buttons and "clear fighter" keep their small paint and take the tap through an invisible ::after
   (decision B); the rest grew. The tab bar keeps its 47px: its padding gave way to the buttons. */
.bigbtn,.qopt,.howbtn,.rps .rback,.kwrow .kw{min-height:44px}
.tabs{padding-top:1px;padding-bottom:calc(1px + env(safe-area-inset-bottom))}
.tab{min-height:44px;padding-top:0;padding-bottom:0;display:flex;align-items:center;justify-content:center}
.vslot .dmybtn{min-width:44px}
button.tag{position:relative}
button.tag::after{content:"";position:absolute;inset:-16px -8px -16px}
.screennav .sndbtn{min-width:44px}   /* its inline flex:.42 would draw 33px at 320 */
.statusline button{padding-top:6px;padding-bottom:6px}
.judgebtn::after{inset:-9px -6px -21px}   /* v7.15: at the top of the table's log pane the -9 is cut to -6 (42 px); 21 below keeps 44 */
.psheet .pact button{min-height:44px}
/* the other prompt controls reach the floor too (R, tools/promptsweep.js): a modal / pay option drew 42px, the opt's reorder arrows 38x30 */
.psheet .popt{min-height:44px}
.psheet .poptcol{width:94px}
.psheet .parrows{gap:6px}
.psheet .parrows button{min-width:44px;min-height:44px}
/* THE SHEET'S LIST SCROLLS, ITS BUTTONS STAY (R, tools/promptsweep.js --inject): four barriers on a soak sheet at 320x568 pushed Confirm
   off the screen with nothing to scroll it back. The mode / option list shrinks into the box and scrolls; the header and the action row never move. */
.psheet .pmodal{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* THE END PANEL SCROLLS WHEN IT MUST (M, QUEUE NEXT 6). A ranked server game's end screen stacks the title, the names card, the
   note, the rating change, Find another match, the Verify paragraph and button, and Leave: 523 of 568px at 320 wide, and one more
   button would push Leave off the bottom of a fixed, centred box with no way back (and the title off the top). Centring with
   auto margins keeps the look when it fits and lets the panel scroll when it does not. */
.reveal{overflow-y:auto;justify-content:flex-start}
.reveal>:first-child{margin-top:auto}
.reveal>:last-child{margin-bottom:auto}
@media (max-width:340px){.screennav button{letter-spacing:.06em}}   /* "✕ LEAVE" spilled its box at 320 */
/* PRESS FEEDBACK (UX overhaul, 2026-11-19). Almost no control answered a
   finger: a tap that lands should LOOK like it landed before the game moves.
   Buttons sink a hair and brighten; hand tiles and hero tiles only brighten,
   because their transform already carries the peek / selected lift. */
.bigbtn,.battlebtn,.actbar .a,.tab,.qopt,.statusline button,.screennav button{transition:transform .08s ease-out,filter .08s ease-out}
.bigbtn:active:not(:disabled),.battlebtn:active:not(:disabled),.actbar button.a:active:not(:disabled),.tab:active,.qopt:active,.statusline button:active{transform:scale(.97);filter:brightness(1.15)}
.screennav button:active,.hcard:active,.hc:active,.reveal .endleave:active{filter:brightness(1.3)}
@media (prefers-reduced-motion:reduce){
  .bigbtn:active,.battlebtn:active,.actbar button.a:active,.tab:active,.qopt:active,.statusline button:active{transform:none}
  .reveal .endtitle{animation:none}
  .hlife2.lfdown,.hlife2.lfup,.stagehud .shnum.lfdown,.stagehud .shnum.lfup{animation:none}
}
/* WHICH WAY A LIFE TOTAL MOVED (`LifeNum`, UX roadmap §3.5): a drop flashes red,
   a gain green, on the hero plates and the life HUD alike, once per change */
.hlife2.lfdown,.hlife2.lfup,.stagehud .shnum.lfdown,.stagehud .shnum.lfup{display:inline-block;animation:lfdown .6s ease-out}
.hlife2.lfup,.stagehud .shnum.lfup{animation-name:lfup}
.stagehud .shnum.lfdown{animation-name:shdown}.stagehud .shnum.lfup{animation-name:shup}   /* colour only: HUD text is never under a transform, even for 0.6s */
@keyframes shdown{0%{color:#FF7A6E;text-shadow:0 0 14px rgba(196,48,43,.9)}}
@keyframes shup{0%{color:var(--ok);text-shadow:0 0 14px rgba(123,160,91,.85)}}
@keyframes lfdown{0%{transform:scale(1.4);color:#FF7A6E;text-shadow:0 0 14px rgba(196,48,43,.9)}100%{transform:none}}
@keyframes lfup{0%{transform:scale(1.3);color:var(--ok);text-shadow:0 0 14px rgba(123,160,91,.85)}100%{transform:none}}
/* ================= TABLE TALK (TT0, v7.18; docs/TABLE-TALK.md §3) =================
   The board as a table seen from your seat: the bout (both lives as fighting-game bars) across the top, the mat, their side, the middle where cards
   meet, your side, your hand, your line. Nothing here is chrome except
   the one menu button. Laid out for 393x660 first (an iPhone's real Safari view), then 393x852 and 320x568. */
.board.talk{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:20;display:flex;flex-direction:column;gap:0;
  padding-top:env(safe-area-inset-top);overflow:hidden;--tk-paper:#F2E8CF;--tk-ink:#2A2522;--tk-pencil:#B3261E;--tk-rule:rgba(84,116,170,.28);
  background:radial-gradient(85% 48% at 50% 42%,rgba(232,179,60,.07),transparent 72%),
             radial-gradient(70% 34% at 50% 0%,#2b2019,transparent 78%),
             radial-gradient(70% 34% at 50% 100%,#2b2019,transparent 78%),#130e0c}
.board.talk::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px)}
.tk-upper{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.tk-side{position:relative;flex:none;display:flex;flex-direction:column;gap:2px;padding:4px 8px}
.tk-side.them{padding-top:6px}
.tk-row{display:flex;align-items:center;gap:6px;min-height:44px;min-width:0}
.tk-sp{flex:1 1 auto;min-width:0}
.tk-menubtn{flex:none;width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0}
.tk-menubtn i{display:block;width:16px;height:2px;background:var(--bone-dim);border-radius:1px}
.tk-hero{display:flex;align-items:center;gap:7px;min-width:0;flex:0 1 auto}
.tk-port{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;border:1px solid var(--line);background:var(--forge);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tk-port img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;aspect-ratio:auto}
.tk-ftr .tk-port img{object-position:50% 3%;transform:scale(1.8)}
.tk-name{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.tk-rate{font-style:normal;font-family:'Spline Sans Mono';font-weight:500;font-size:var(--fs-sm);color:var(--bone-dim);margin-left:6px;letter-spacing:0}
.tk-think{display:inline-flex;gap:3px;align-items:center}
.tk-think i{width:5px;height:5px;border-radius:50%;background:var(--y);opacity:.25;animation:tkthink 1s infinite}
.tk-think i:nth-child(2){animation-delay:.15s}.tk-think i:nth-child(3){animation-delay:.3s}
@keyframes tkthink{0%,100%{opacity:.18}50%{opacity:1}}
/* the markers: the action point a gold gem, resources blue coins (TRP 5.8) */
.tk-marks{display:inline-flex;gap:7px;align-items:center;flex:none}
.tk-apw{display:inline-flex;align-items:center;gap:3px;font:700 12px 'Spline Sans Mono';color:var(--y)}
.tk-ap{display:inline-block;width:15px;height:15px;transform:rotate(45deg);background:linear-gradient(135deg,#f6d77a,#b8861d);border:1px solid #f9e6ab;box-shadow:0 0 10px rgba(232,179,60,.55)}
.tk-res{min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:radial-gradient(circle at 35% 30%,#86acdf,#2b5895);border:1px solid #b2cdf0;font:700 12.5px 'Spline Sans Mono';color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
/* card backs: their hand, their arsenal, a deck */
.tk-cback{display:inline-block;flex:none;width:19px;height:27px;border-radius:3px;border:1px solid #9a4a2e;
  background:radial-gradient(circle at 50% 50%,rgba(232,179,60,.35) 0 3px,transparent 4px),repeating-linear-gradient(45deg,#561911 0 3px,#6b2216 3px 6px);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.tk-cback.big{width:100%;height:auto;aspect-ratio:5/7}
.tk-backs{display:inline-flex;align-items:center;flex:none}
.tk-backs .tk-cback+.tk-cback{margin-left:-11px}
.tk-backs .tk-n{margin-left:6px}
.tk-n{font:700 12px 'Spline Sans Mono';color:var(--bone);line-height:1}
.tk-ars{display:inline-flex;align-items:center;flex:none;margin-left:2px}
.tk-ars .tk-cback{width:23px;height:32px;transform:rotate(-5deg);border-color:var(--y)}
/* gear as it lies on the mat (v7.20): small real cards in slot order, a die on each; they close up and overlap
   (the left edge and its die showing) only when the row is narrow. The zone is a printed outline, as on a playmat. */
.tk-geargrp{flex:0 1 auto;min-width:44px;display:inline-flex;align-items:center;gap:3px;min-height:44px;padding:2px 6px 2px 8px;background:transparent;border:1px solid rgba(232,223,208,.09);border-radius:7px}
.tk-gcard{position:relative;flex:0 1 auto;width:28px;min-width:12px;height:39px;transition:transform .2s ease-out}
.tk-gcard:last-child{flex-shrink:0}
.tk-gface{position:absolute;left:0;top:0;width:28px;height:39px;border-radius:3px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.5)}
.tk-gface img,.tk-gface .ccfall{width:100%;height:100%;object-fit:cover;display:block}
.tk-gface .ccfall{font-size:0;padding:0}
.tk-gface .tk-cback{width:100%;height:100%}
.tk-gdie{position:absolute;left:-4px;bottom:-3px;min-width:15px;height:15px;padding:0 2px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  background:#2b5895;border:1px solid #b2cdf0;color:#fff;font:700 10.5px 'Spline Sans Mono';line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.7);z-index:1}
.tk-gcard.w .tk-gdie{background:#8f231f;border-color:#f3c1bd}
.tk-gcard.worn .tk-gface{opacity:.4;filter:grayscale(.7)}
.tk-gcard.worn .tk-gdie{background:#3a332e;border-color:var(--line);color:var(--bone-dim)}
.tk-gcard.on{transform:translateY(-4px)}
.tk-gcard.on .tk-gface{box-shadow:0 6px 10px rgba(0,0,0,.7),0 0 0 2px #6fa0e0,0 0 10px rgba(111,160,224,.6)}
.tk-gcard.spent{flex:0 0 auto;width:39px}
.tk-gcard.spent .tk-gface{left:5.5px;transform:rotate(90deg);filter:brightness(.8)}
.tk-gcard.spent .tk-gdie{left:0;bottom:3px}
/* piles: this turn's pitch, graveyard, banished face up; the deck a back */
.tk-pilegrp{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 6px;background:transparent;border:1px solid rgba(232,223,208,.09);border-radius:7px}
.tk-mpile{position:relative;display:inline-block;width:23px;height:32px;flex:none}
.tk-mpile img,.tk-mpile .ccfall{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block}
.tk-mpile .ccfall{font-size:0;padding:0}
.tk-mpile .tk-cback{width:100%;height:100%}
.tk-mpile.pitch{box-shadow:0 0 0 1px var(--y)}
.tk-mpile .tk-n{position:absolute;right:-5px;bottom:-4px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:1px 3px;font-size:9.5px}
/* permanents: auras, items, allies, tokens */
.tk-perms{display:flex;gap:5px;align-items:center;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none;padding:2px 0}
.tk-perms::-webkit-scrollbar{display:none}
.board.talk .tk-perms>button,.tk-perm{flex:none;width:44px !important;padding:0;background:none;border:0;position:relative}
.board.talk .tk-perms .cfw .b-pit,.board.talk .tk-perms .cfw .b-cost,.board.talk .tk-perms .cfw .b-typ{display:none}
/* the middle: the chain on the mat */
.tk-mid{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 10px}
.tk-mid::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(232,223,208,.09),transparent);pointer-events:none}
.tk-chain{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;min-height:0}
.tk-fight{display:flex;align-items:center;justify-content:center;gap:12px;height:100%;max-height:100%;min-height:0}
.tk-atk,.tk-stackc{position:relative;flex:none;padding:0;background:none;border:0;height:min(100%,250px);aspect-ratio:5/7;max-width:46vw;
  border-radius:7px;box-shadow:0 10px 28px rgba(0,0,0,.7),0 0 0 1px rgba(196,48,43,.55);animation:tkland .28s cubic-bezier(.2,1.4,.4,1)}
.tk-atk.mine{box-shadow:0 10px 28px rgba(0,0,0,.7),0 0 0 1px rgba(232,179,60,.6)}
.tk-atk img,.tk-stackc img,.tk-atk .ccfall,.tk-stackc .ccfall{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
@keyframes tkland{from{transform:translateY(-14px) scale(1.06);opacity:.2}to{transform:none;opacity:1}}
.tk-pow{position:absolute;left:-10px;top:-10px;min-width:40px;height:40px;padding:0 6px;border-radius:20px;background:var(--r);border:2px solid #f3c1bd;color:#fff;
  font:800 25px 'Big Shoulders Display';display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.tk-ga{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;background:var(--ok);color:#10200a;font:700 10px 'Spline Sans Mono';letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.tk-onstack{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;background:var(--forge2);border:1px solid var(--y);color:var(--y);font:600 10px 'Spline Sans Mono';letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.tk-stackc{height:min(78%,190px);animation:tkland .28s ease-out, tkglow 1.6s ease-in-out infinite}
@keyframes tkglow{0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.7),0 0 0 1px rgba(232,179,60,.4)}50%{box-shadow:0 10px 28px rgba(0,0,0,.7),0 0 0 2px rgba(232,179,60,.9),0 0 18px rgba(232,179,60,.35)}}
.tk-walls{display:flex;flex-direction:column;align-items:center;gap:6px;max-height:100%}
.tk-wall{display:inline-flex;align-items:center;gap:3px;font:800 22px 'Big Shoulders Display';color:#cfe0ff}
.tk-wall i{font-style:normal;font-size:16px;color:var(--b)}
.tk-blks{display:flex;flex-direction:column;gap:5px;align-items:center;overflow-y:auto;max-height:100%;scrollbar-width:none}
.tk-blk{flex:none;width:min(62px,15vw);padding:0;background:none;border:0;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.65),0 0 0 1px rgba(59,111,176,.7);animation:tkland .24s ease-out}
.tk-blk .cfw .b-pit,.tk-blk .cfw .b-cost,.tk-blk .cfw .b-atk{display:none}
.tk-links{position:absolute;left:0;top:50%;transform:translateY(-50%);width:44px;padding:0;background:none;border:0;opacity:.75}
.tk-links img,.tk-links .ccfall{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:3px;display:block;box-shadow:3px 3px 0 #2a201a,6px 6px 0 #221a15}
.tk-links .tk-n{position:absolute;right:-6px;bottom:-6px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:1px 4px}
/* the turn token: the turn player's medallion, lying on their half of the mat; it slides across when the turn passes
   (`top`, once a turn: a layout change nobody pays for) and settles in with a small bounce when the chain clears */

.tk-token b .fallbackart{width:100%;height:100%;border-radius:50%}
.tk-token b .fallbackart{display:flex;align-items:center;justify-content:center;font:800 11px 'Big Shoulders Display';background:var(--forge);color:var(--bone)}

.paper{background:linear-gradient(transparent 0 0),repeating-linear-gradient(180deg,transparent 0 17px,var(--tk-rule) 17px 18px),var(--tk-paper);color:var(--tk-ink)}

.tk-bout{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px 2px;position:relative;z-index:3}

.tk-fname>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tk-ftr.r .tk-fname{flex-direction:row-reverse}
.tk-fname .tk-rate{margin-left:0}
.tk-ftr .shbar{position:relative;width:100%;height:13px;transform:skewX(-14deg);border:2px solid var(--bone);background:var(--ink);overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.tk-ftr .shbar.r{transform:skewX(14deg)}
.tk-ftr .shbar i{position:absolute;top:0;bottom:0;left:0;display:block}
.tk-ftr .shbar.r i{left:auto;right:0}
.tk-ftr .shbar .trail{background:#C4302B;transition:width .5s ease-in .35s}
.tk-ftr .shbar .fill{background:linear-gradient(90deg,#B4441E,var(--y))}
.tk-ftr .shbar.r .fill{background:linear-gradient(270deg,#B4441E,var(--y))}
.tk-ftr .shbar .fill.up{transition:width .4s ease-out}
.tk-ftr .shbar .tick{width:100%;background-image:linear-gradient(90deg,rgba(20,16,14,.55) 1px,transparent 1px);background-size:var(--tk) 100%;opacity:.7}
.tk-ftr .shbar.danger{border-color:#FF7A6E;box-shadow:0 0 8px rgba(196,48,43,.85);animation:shdanger 1s ease-in-out 2}
.tk-hp{flex:none;min-width:30px;text-align:center;font-family:'Big Shoulders Display';font-weight:900;font-size:27px;line-height:1;color:var(--bone);text-shadow:0 2px 0 rgba(0,0,0,.6)}

.tk-hp.lfdown{animation:shdown .6s ease-out}.tk-hp.lfup{animation:shup .6s ease-out}
.tk-pop{position:absolute;top:-2px;font:900 22px 'Big Shoulders Display';font-style:normal;color:#FF7A6E;text-shadow:0 2px 0 #000,0 0 10px rgba(196,48,43,.9);pointer-events:none;
  animation:tkpop 1.1s ease-out forwards;opacity:0}
.tk-ftr.you .tk-pop{right:2px}.tk-ftr.r .tk-pop{left:2px}
.tk-pop.up{color:#9be08a;text-shadow:0 2px 0 #000,0 0 10px rgba(123,160,91,.9)}
@keyframes tkpop{0%{opacity:0;transform:translateY(8px) scale(1.5)}15%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-18px)}}

/* the ask: only when something is asked of you (paying, arsenal, defending, a card on the stack) */
.board.talk .statusline{flex:none;margin:0 8px 4px;border-radius:8px;min-height:34px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}

@keyframes tkfade{from{opacity:0}to{opacity:1}}

.tk-call.k-hit .tk-say{background:#e2412f}
.tk-call.k-blocked .tk-say,.tk-call.k-block .tk-say,.tk-call.k-noblock .tk-say{background:var(--b)}

.tk-call.k-turn .tk-head{color:var(--y)}
.tk-call.k-over .tk-say{background:var(--y)}
.tk-call.k-over .tk-say *{color:#241808}
.tk-sayer{font:700 11px 'Spline Sans Mono';letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.82)}

.tk-sub{font:600 15px 'Spline Sans';color:#fff;letter-spacing:.02em}
@keyframes tkslam{0%{transform:skewX(-8deg) translateY(-26px) scale(1.18);opacity:0}70%{transform:skewX(-8deg) translateY(2px) scale(.98);opacity:1}100%{transform:skewX(-8deg)}}

/* THE GLIMPSE IS SIZED BY THE TABLE, NEVER BY ITS IMAGE (an offline stand-in is 50 px; a real face is 450): the row takes
   the call's height left under the slab, and the card the largest 5:7 box that fits it, the phone's width and 330 px */
.tk-call.big{justify-content:flex-start;gap:0;padding-top:4px}

.tk-call.big .tk-glimpse-row{margin-top:-12px}
.tk-glimpse-row{display:flex;align-items:center;justify-content:center;gap:10px;min-height:0;flex:1 1 0;width:100%}

  animation:tkglimpse .26s cubic-bezier(.2,1.25,.4,1)}

.tk-pitched{display:flex;flex-direction:column;gap:8px}
.tk-pitchc{position:relative;width:min(70px,17vw);border-radius:5px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.7);animation:tkglimpse .3s .06s both}
.tk-pitchc img,.tk-pitchc .ccfall{width:100%;aspect-ratio:5/7;object-fit:cover;display:block}
.tk-pitchc i{position:absolute;left:0;right:0;bottom:0;font:700 9.5px 'Spline Sans Mono';font-style:normal;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:#fff;padding:2px 0;background:rgba(0,0,0,.7)}
.tk-pitchc.p1{box-shadow:0 0 0 2px var(--r),0 6px 14px rgba(0,0,0,.7)}
.tk-pitchc.p2{box-shadow:0 0 0 2px var(--y),0 6px 14px rgba(0,0,0,.7)}
.tk-pitchc.p3{box-shadow:0 0 0 2px var(--b),0 6px 14px rgba(0,0,0,.7)}
.tk-blockrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:100%}
.tk-blockc{width:min(86px,22vw);border-radius:6px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.7),0 0 0 2px rgba(59,111,176,.8);animation:tkglimpse .24s both}
.tk-blockc img,.tk-blockc .ccfall{width:100%;aspect-ratio:5/7;object-fit:cover;display:block}
.tk-holdnote{font:600 10px 'Spline Sans Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim)}
.tk-call.held{background:rgba(10,7,6,.8)}

.board.talk>.tblerr{position:fixed;left:12px;right:12px;top:38%;z-index:66;max-width:536px;margin:0 auto;background:#2a0f0d;box-shadow:0 8px 24px rgba(0,0,0,.6);border-radius:8px}

const {useState,useEffect,useMemo,useCallback} = React;
/* A HERO'S SHORT NAME (v6.46). Every label used to cut the name at its comma, which is right for
   fifteen heroes and wrong the day two share a first name: Viserai and Viserai, Between Worlds both
   read "VISERAI" on the roster. A HEROES entry may carry `short`; otherwise the old cut. */
const heroShort = h => h ? (h.short || String(h.n || "").split(",")[0]) : "";

/* THE SCREEN STAYS AWAKE WHILE A GAME IS ON (v7.06). A phone that dims while the other seat
   thinks loses its turn to a lock screen. Held while a board is mounted; the browser drops the
   lock when the page is hidden, so it is asked for again on return. Where the Screen Wake Lock
   API is missing (older iOS, file://) or refuses, nothing happens and nothing is said. */
function useWakeLock(){
  useEffect(()=>{
    const wl = navigator.wakeLock;
    if(!wl || !wl.request) return;
    let lock = null, live = true;
    const ask = () => { if(!live || lock || document.visibilityState !== "visible") return;
      wl.request("screen").then(l => { if(!live){ l.release().catch(()=>{}); return; }
        lock = l; l.addEventListener("release", () => { if(lock === l) lock = null; }); }).catch(()=>{}); };
    const vis = () => ask();
    document.addEventListener("visibilitychange", vis);
    ask();
    return () => { live = false; document.removeEventListener("visibilitychange", vis);
      if(lock){ lock.release().catch(()=>{}); lock = null; } };
  }, []);
}

/* ---------- storage ---------- */
const store = {
  get(k,f){ try{const v=localStorage.getItem("dawnblade."+k); return v==null?f:JSON.parse(v);}catch(e){return f;} },
  set(k,v){ try{localStorage.setItem("dawnblade."+k, JSON.stringify(v));}catch(e){} }
};
/* the record against AI heroes (v5.84) reads and writes through engine/local.js,
   which wraps every touch in try/catch; it is handed this THUNK because on some
   browsers merely reading window.localStorage is what throws */
const lsGet = () => window.localStorage;
/* THE TESTER'S DOOR (v6.26): the server table is off for everyone unless this phone was sent the test address (?server=1);
   the choice is remembered here, and ?server=0 forgets it. Read once per page load. */
const SRV_CHOICE = DawnServerTable.doorChoice(store, window.location.search);
/* JOIN FROM THE LINK (v7.08): a shared table number arrives as `?join=CODE`. Its LENGTH says which table it is (a direct
   table's number is DawnRoom.CODE_LEN characters, a server table's DawnServerTable.CODE_LEN); anything else is ignored. Read
   once per page load and then taken out of the address, so a reload or a home-screen relaunch does not sit down again.
   Returns {code, srv} or null. Never throws. */
const JOIN_ASK = (() => { try {
  const q = new URLSearchParams(window.location.search), raw = q.get("join");
  if(raw == null) return null;
  q.delete("join");
  try { const rest = q.toString(); window.history.replaceState(null, "", window.location.pathname + (rest ? "?" + rest : "") + window.location.hash); } catch(_){}
  const bare = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if(bare.length === DawnServerTable.CODE_LEN && DawnServerTable.isValid(bare)) return {code: DawnServerTable.normalize(bare), srv: true};
  if(bare.length === DawnRoom.CODE_LEN && DawnRoom.isValid(bare)) return {code: DawnRoom.normalize(bare), srv: false};
  return null;
} catch(_){ return null; } })();

   are dealt every run and its screen count is stable; a player never sets it. */
const battleSeed = () => window.__dawnSeedFix != null ? window.__dawnSeedFix : Date.now();

  d.deck.forEach(e=>{ NEEDED.add(norm(e.name)); if(e.name.includes("//")) NEEDED.add(norm(e.name.split("//")[0])); });

/* print codes + hero name stems for robust DB matching */
const CODES = new Set();
Object.values(PARSED).forEach(d=>{ [d.hero].concat(d.gear,d.deck).forEach(e=>{ if(e.code) CODES.add(e.code); }); });
const HERO_STEMS = HEROES.map(h=>norm(PARSED[h.k].hero.name));
DUMMY_GEAR.forEach(nm=>NEEDED.add(norm(nm)));
DUMMY_DECK.forEach(([nm])=>NEEDED.add(norm(nm)));
/* cards the pool never lists but effects can mint at runtime */
["Crouching Tiger","Inner Chi"].forEach(nm=>NEEDED.add(norm(nm)));

/* ---------- card database: the PINNED POOL (data/pool.js) ----------

   load, the user chose the pinned pool over the live the-fab-cube database:
   a phone plays exactly the card text the drills tested, the game survives
   upstream moving or disappearing, and the first load is the pool (~1.4 MB)
   instead of a 22 MB download. Each release cycle re-pins deliberately
   (`node tools/audit.js --refresh`, `node tools/pin-pool.js`), and
   `test/drift.test.js` is where upstream's moves are noticed.

   the records are already in memory when this runs (a `<script src>`
   above), and mapping ~800 of them is instant. The records are RAW

   below mirrors the one in engine/cards.js, guarded by test/loader.test.js. The
   keep-filter stays too: the pool is already only what the pool can

function poolCards(all){
  const cards = [];
  all.forEach(c=>{
    if(!c || !c.name) return;
    const nm = norm(c.name);
    const isTok = /token/i.test(c.type_text||"") || /token/i.test((c.types||[]).join(" "));
    /* A DEMI-HERO IS KEPT BY ITS TYPE (v3.76), the same way a token
       is, and `tools/pin-pool.js` keeps them by the identical test.
       Arakni prints "you become a random Agent of Chaos" and the six
       Agents are Demi-Hero records no deck lists — so without this
       the PHONE could not mint what the pinned pool can see, which
       is v3.21's fixture-and-production split with the sign flipped.

       The name-stem test above cannot reach them: `isHero` requires
       the record's name to CONTAIN a deck hero's full name, and
       "Arakni, Black Widow" does not contain "Arakni, Web of

    const isDemi = /demi-hero/i.test(c.type_text||"")
                || (c.types||[]).some(t=>/^demi-hero$/i.test(t));
    /* MIRRORS cards.js mapDbCard — see its header note. `bySet` is what
       lets a card wear its Silver Age face instead of whatever printing
       the database listed first; first printing per set wins, which is
       stable because foiling and art variations share one image_url. */

      const id = pr.id || pr.identifier || pr.set_printing_unique_id || null;

    cards.push({
      n:c.name, p:toNum(c.pitch), c:toNum(c.cost), pw:toNum(c.power),
      d:toNum(c.defense), hp:toNum(c.health), int:toNum(c.intelligence),
      tt:c.type_text||((c.types||[]).join(" ")),
      /* mirrors engine/cards.js mapDbCard — the STRUCTURED type array,
         which is the authority where `tt` is only a display string.
         They disagree on 5 records and it is not cosmetic: `tt` calls
         Den of the Spider an "Action Defense Reaction", which would
         make a defence reaction playable on your own turn. Change
         both, and bump DATA_VER when you do. */
      /* IS THIS A SPLIT CARD? (v3.34) The database says so itself, and the
         flag is the authority — `//` in the type line is how two typeboxes
         are RENDERED, not what makes a card a split card. Exactly two
         records in this pool carry it, and both print Meld.

         A split card is ONE card with two halves: one pitch value, one
         defence value, one card in hand and one card in the graveyard. The
         halves are told apart by `tt`, which is the one place the boundary
         survives — the structured `ty` array flattens both faces into a
         single list (v2.39). */
      hz:!!c.played_horizontally,
      /* mirrors cards.js (v4.72): the X count of Ice Eternal's "XX". */
      cx:(String(c.cost||"").match(/x/gi)||[]).length||undefined,
      ty:(c.types||[]).slice(),
      kw:(c.card_keywords||[]), gkw:(c.granted_keywords||[]),
      tx:c.functional_text_plain||c.functional_text||"", pr:prints, prs:bySet
    });
  });
  return cards;
}
function loadPool(){
  const all = window.DAWN_POOL;
  if(!Array.isArray(all)) throw new Error("the card pool did not load");
  const cards = poolCards(all);
  const byNP={}, byName={}, byCode={};
  cards.forEach(c=>{
    const k=norm(c.n);
    byNP[k+"|"+(c.p==null?0:c.p)]=c;
    (byName[k]=byName[k]||[]).push(c);
    Object.keys(c.pr||{}).forEach(id=>{ if(id!=="_first" && !(byCode[id] && /_BACK\.[a-z0-9]+$/i.test(String(c.pr[id])))) byCode[id]=c; });  /* a back face never shadows its front under the shared code */
  });
  return {status:"ready",byNP,byName,byCode,count:cards.length,err:null};
}
function useCardDB(){
  /* Ready on the first render — there is nothing to wait for. */
  const [state] = useState(()=>{
    try{
      const db = loadPool();
      /* THE TABLE'S RULES NEED THE CARDS (v6.26): judge.js looks tokens up (Runechant, Vigor, Agility...) in the database it was
         registered with, and until now this page never registered one — so every table game played here made fewer tokens than the
         rules say, and a phone replaying a server table's game ("Verify this game") diverged at the first token the server made.
         Registered once, here, where the pool is read (not inside loadPool, which drills evaluate on their own). */
      DawnJudge.setDb(db);
      return db;
    }
    catch(e){ return {status:"error",byNP:{},byName:{},byCode:{},count:0,err:String(e&&e.message||e)}; }
  });
  /* The live-database era cached its mapped cards under "dbcache_<DATA_VER>";
     nothing reads those keys now, so free the phone's storage once. */
  useEffect(()=>{
    try{ Object.keys(localStorage).forEach(k=>{ if(k.indexOf("dawnblade.dbcache_")===0) localStorage.removeItem(k); }); }catch(e){}
  },[]);
  /* A pool that failed to load is a page that failed to load: Retry reloads it. */
  const reload = useCallback(()=>{ try{ window.location.reload(); }catch(e){} },[]);
  return [state,reload];
}

<script type="text/babel" data-presets="env,react">
const {useState:uS,useMemo:uM,useEffect:uE,useRef:uR} = React;

/* ============================================================
   SIDES — sides[0] is you, sides[1] is the opponent, the same
   indices the pregame throw and engine/sides.js use.

   v2.15 moved the OPPONENT's zones and life here; v2.16 moves the
   PLAYER's. Both seats now carry the same zone set — deck, hand,
   arsenal, pitch, graveyard, banish, soul, gear, board — and life.
   The dummy's arsenal/pitch/banish/soul sit empty because it takes
   no action phase yet; inert-but-present is the point, and it is
   what lets a second human occupy slot 1 without new plumbing.

   READS go through you(s) / opp(s). WRITES must call youMut(n) or
   oppMut(n) FIRST. This matters: the trainer copies state with
   `let n = {...s}`, which is shallow, so n.sides and the side
   objects inside it are still shared with the state React already
   rendered. Mutating one in place would reach back and corrupt it.
   The Mut helpers clone that side into a fresh array and hand it
   back for mutation. Clone once at the top of a function and every
   later write in it is safe — L() spreads only the top level, so it
   carries the fresh array forward untouched.
   ============================================================ */
const you = s => s.sides[0];
const opp = s => s.sides[1];
const youMut = n => { n.sides = [{...n.sides[0]}, n.sides[1]]; return n.sides[0]; };
const oppMut = n => { n.sides = [n.sides[0], {...n.sides[1]}]; return n.sides[1]; };
/* ACTOR vs PERSPECTIVE — ROADMAP-MULTIPLAYER.md, Phase A step 1 ("the whole
   ballgame"). Two concepts are conflated in you()/opp() today only because the
   two readings coincide with one acting seat:
     - PERSPECTIVE — the seat THIS CLIENT renders. That is a UI question, and
       you()/opp() stay as its helpers (seat 0 on a single device).
     - ACTOR — the side whose effect is RESOLVING right now. That is a RULES
       question, and it is not always seat 0: a defence reaction resolves for
       the defender during the attacker's turn.
   act()/foe() read s.actor (default 0), so today act(s)===you(s) and every
   swap of you->act inside a rules function is behaviour-identical. The moment
   seat 1 becomes a real actor, those functions are already correct because
   they resolve relative to s.actor instead of a hardcoded slot 0. The Mut
   helpers delegate to youMut/oppMut so there is exactly ONE clone path.
   Migrate RULES functions (runOps, execute, resolveStack, newTurn, takeIt,
   tryPlay) to act/foe; leave the UI on you/opp. test/actor.test.js
   fails if a migrated function still reaches for you(/opp(. */
const actorOf = s => s.actor||0;
const act    = s => s.sides[actorOf(s)];
const foe    = s => s.sides[1-actorOf(s)];

/* THE CARD GOES WHERE YOU SENT IT (UX roadmap step 6, v6.50). The commit tap of the
