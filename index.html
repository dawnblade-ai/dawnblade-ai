                    </button>)}/>
              </div>
            </div>
            <GravePane sd={them} who={them.name+"'s"} mine={false}/>
          </div>
        </div>

        {/* ---- SCREEN 2: the chain ---- */}
        <div className="vscreen" ref={chainRef}>
          <div className="hscroll" ref={midStart}>
            <div className="hpane logpane">
              <div className="paneflag">
                <span>log</span>
                {/* Same button, same sheet, same report shape as the
                    trainer — and here it carries the seat, the table code
                    and net.js's counters, because the first question
                    about a two-phone bug is which phone saw it. */}
                <button className="judgebtn" onClick={()=>setBug(true)}>
                  JUDGE!!{judgeN>0?` ⚠${judgeN}`:""}
                </button>
                <span>play →</span></div>
              {/* the turn and the phase — see stepLabel, which reads the CR
                  machine because `mode` is frozen on this board */}
              <div className="phasebar clip-sm">
                <span>turn <b>{g.turn}</b></span>
                <span className="ph">{stepLabel(g, mySeat)}</span>
              </div>
              <div style={{marginTop:6}}><Ticker feed={feedShown}/></div>
              {adviceEl}
              <div className="gamelog" style={{marginTop:8}}>{[...feedShown].reverse().map((l,i)=><div key={i} className="gl"><PipLine s={l}/></div>)}</div>
            </div>

            <div className="hpane playpane">
              <BoardStrip sd={them} who={them.name.split(",")[0]} open={sheet==="opp"} onOpen={()=>flip("opp")}/>
              <div className="playmid">
                <div className="sidecol stack">
                  <div className="scol-lbl">Chain</div>
                  <div className="scol-cards">
                    {g.chainOpen && g.pend
                      ? <div className="stackcard"><CardImg card={g.pend.card}/></div>
                      : <div className="dash">—</div>}
                  </div>
                </div>
                <div className="centerslot">
                  {featured
                    ? <FeatCard card={featured.card}/>
                    : <div className="featempty">Most recently played lands here</div>}
                  <LinkStamp l={featOutcome(featured, g.chain)} seq={g.chain.length}/>
                  <LinkSfx chain={g.chain}/>
                </div>
                <div className="sidecol defend">
                  <div className="scol-lbl">Defend</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = [...declared(me), ...declared(them)];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>)
                                       : <div className="dash">—</div>; })()}
                  </div>
                </div>
              </div>

              {askEl}

              {pipsEl}

              {targetEl}

              <BoardStrip sd={me} who="You" mine open={sheet==="you"} onOpen={()=>flip("you")}/>
              {handRowEl}
            </div>

            <div className="hpane">
              <div className="paneflag"><span>← play</span><span>the chain</span></div>
              {!g.chain.length && <p className="note">No links yet — play an attack to start the chain.</p>}
              {!!g.chain.length && <div className="histturn"><div className="htlabel">This chain</div>
                <div className="chain">{g.chain.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>}
            </div>
          </div>
        </div>

        {/* ---- SCREEN 3: your board ---- */}
        <div className={"vscreen side"+(sheet==="you"?" open":"")} data-sheet="you" ref={youRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>Your board · seat {mySeat}</span><span>swipe → graveyard</span></div>
              {!myTurn && !defending && !myArsStep && !over &&
                <button className="modehint" onClick={()=>setSheet(null)}>Waiting on {them.name} — back to the table ✕</button>}
              {/* THE ARENA COULD ONLY ZOOM (v4.45). `judge.doActivate` has had
                  the board-attack route since v3.44 and `legal`'s arena
                  branch since v3.84 — and this row's only handler opened the
                  card, so at the table NOTHING could attack out of the
                  arena: measured, 10 attacking allies in the pool and the
                  four ward-bearing auras Cosmo turns into weapons, which is
                  Enigma's whole engine. v3.50's sentence at the UI: a
                  feature with no caller looks exactly like a feature that
                  works, until you count.

                  `judge.boardAttackOf` IS HOW IT ASKS (v3.84's own reader),
                  so there is still one place that knows an aura's power is
                  its printed ward — the tile reads no card text. */}
              {/* AND AN ARENA PERMANENT'S ABILITY IS THE OTHER HALF OF THAT
                  SENTENCE (v4.47). With only the attack asked, the seven
                  pool records that print an ACTIVATED ABILITY in the arena
                  still had no caller here — v3.50's sentence for the sixth
                  time, in the row v4.45 had just given a handler.

                  `judge.boardAbilityOf` is how it asks, `boardAttackOf`'s
                  sibling: one action (`activate`) covers both, `legal`
                  decides which, and the tile reads no card text. */}
              <InPlayRow entries={me.board} cell={myBoardCell}/>
              <div className="heror">
                <div className={"wslot clip-sm"+(myHands[0]?" filled":"")}>
                  {myHands[0] ? gearTile(true)(myHands[0]) : <span className="wempty">weapon 1</span>}
                </div>
                <div className="heromid clip-sm">
                  <button className="hport2" onClick={()=>setZoom(myBuild.HZOOM)}>
                    {myH ? <HeroArt h={myH} db={db}/> : null}</button>
                  <span className="hname">{me.name.split(",")[0]}</span>
                  {srvNames[mySeat] && <span className="pname" data-pname="me" title={srvNames[mySeat]}>{srvNames[mySeat]}{srvRank.ranked && srvRank.ratings[mySeat]!=null && <span className="prate"> {srvRank.ratings[mySeat]}</span>}</span>}
                  <LifeNum n={me.hp} className="hlife2"/>
                  <span className="hlbl">life</span>
                  {/* THE SAME CHIP THE TRAINER DRAWS (v3.39) — a counter
                      the ability spends has to be visible on the board the
                      ability is played on. */}
                  {(()=>{ const ct=(me.counters||{}).hero||{};
                    const ks=Object.keys(ct).filter(k=>ct[k]>0);
                    if(!ks.length) return null;
                    return <span className="ctr">{ks.map(k=>
                      <span key={k} className="cc steam" title={k}>{k[0].toUpperCase()}{ct[k]}</span>)}</span>; })()}
                  {/* AND THE HERO POWER ITSELF, which this board never
                      offered: `doActivate` had no "hero" route until v3.39,
                      so an ACTIVATED hero ability was unreachable here.
                      Dimmed off `legal`, like every other tap at this
                      table, so the button and the rule cannot disagree. */}
                  {myBuild.heroPow && (()=>{ const A={t:"activate",from:"hero",uid:"hpow"};
                    const ok=mine(A);
                    return <button className="hact clip-sm fs-md" style={{padding:"5px 8px"}}
                      disabled={!ok} title={ok?"":String(DawnJudge.legal(g,A,mySeat)||"")}
                      onClick={()=>fire(A)}>{(me.weaponUsed||{})["hpow"]?"USED":"⚡ USE"}</button>; })()}
                </div>
                <div className={"wslot clip-sm"+(myHands[1]?" filled":"")}>
                  {myHands[1] ? gearTile(true)(myHands[1])
                    : <span className="wempty">{myHands[0]&&slotOf(myHands[0]).z==="2h" ? "2H occupies both hands" : "weapon 2 / off-hand"}</span>}
                </div>
              </div>
              <div className="midrow">
                <ArmorGrid gear={armorOf(me)} own cell={gearTile(true)}/>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{me.arsenal
                    ? <button style={{padding:0,width:"100%"}} onClick={()=>setZoom(me.arsenal)}>
                        <CardFrame card={me.arsenal} className="sm"/></button>
                    : "empty"}</div>
                  <span className="zlbl">Arsenal</span>
                </div>
                <DeckPitchCol deck={me.deck} pitch={me.pitch}/>
              </div>
              <div className="vfillsp"/>
              <div className="mystat" style={{marginTop:8}}>
                <span className="pill">TURN <b>{g.turn}</b></span>
                <span className="pill">SEAT <b>{mySeat}</b></span>
                <span className="pill">{host?"HOST":"GUEST"}</span>
                <button className={"pill"+(inspect?" hp":"")} onClick={()=>setInspect(v=>!v)}>ℹ {inspect?"inspecting":"inspect"}</button>
              </div>
            </div>
            <GravePane sd={me} who="Your"/>
          </div>
        </div>
      </div>

      {/* The action bar speaks the CR machine, not the trainer's modes.
          CR 4.3.4: ending a turn is a PASS carrying intent, so it takes
          one from each seat — which is what a table does. */}
      {hubEl}

      {overlaysEl}
    </div>
  );
}

/* ============================================================
   TABLE TALK (TT0, v7.18) — the new table. docs/TABLE-TALK.md is the vision; §3 is this layout.

   THE TABLE, NOT THE APP: the BOUT across the top (both heroes and both lives as fighting-game bars,
   the turn between them; v7.19, the user's "health bar callout"; a tap opens the pad, TRP 5.8), their
   side (the backs of the cards they hold, a face-down arsenal, their gear as defence chips, their
   permanents, their piles), the middle where cards meet (the chain, the stack, the turn token), your
   side, your hand, your line (the hub). No log: TRP 5.1 gives a player
   Visible, Public and Assisted information, never Historical. What the opponent does is SAID
   (`TalkCall`, read off engine/announce.js) and SHOWN once, large (the glimpse); then it lands where
   it lives and can be read again only where it lies (a tap on the chain, a pile, a gear chip).

   EVERY CONTROL THAT ACTS IS TableBoard's OWN. The hand row (which carries every play: hand, arsenal,
   gear swings and abilities, the hero power, blocks), the ask line, the hub, the prompt sheet, the peek
   dock, the end panel and your arena's cells are built once in TableBoard and handed in, so the two
   layouts cannot disagree about what a tap does (the no-mirror rule, one layer up). These components
   only LAY OUT and DRAW: they read the game and never write it.
   ============================================================ */
const TALK_KEY = "talk", TALK_VOICE = "talkVoice";
/* the switch: `?talk=1` / `?talk=0` wins (a link to try it), else the title screen's choice, kept on this phone */
const talkOn = () => {
  try { const m = String(window.location.search || "").match(/[?&]talk=([01])(?:&|$)/); if(m) return m[1] === "1"; } catch(_){}
  return !!store.get(TALK_KEY, false);
};
const talkShort = s => String((s && s.name) || s || "").split(",")[0];
/* WHAT THE TABLE SHOWS OF A LINE (docs/TABLE-TALK.md §4.1). Life goes to the pad, not the stage. Your own
   plays get a short echo; your own blocks, arsenal and "no block" are not repeated back to you. */
const talkShows = (l, me) => {
  if(!l || l.k === "life") return false;
  if(l.seat !== me) return true;
  if(l.k === "attack") return l.n != null;   /* your attack once, with the power it lands with */
  return ["play", "ability", "hero", "hit", "blocked", "turn", "over"].includes(l.k);
};
/* consecutive blocks by one seat are ONE call ("blocking with 3"), as a player says it */
const talkMerge = q => q.reduce((out, l) => {
  const p = out[out.length - 1];
  if(p && p.k === "block" && l.k === "block" && p.seat === l.seat && !p._on){
    const cards = [...(p.cards || []), ...(l.cards || [])];
    out[out.length - 1] = {...p, cards, sub: "with " + cards.length};
  } else out.push(l.k === "block" ? {...l, sub: "with 1"} : l);
  return out;
}, []);
/* HOW LONG A CALL HOLDS (ms); the AI's pace waits about as long, so play and talk stay together */
const talkHold = (l, me) => !l ? 0
  : l.k === "over" ? 2600
  : l.seat === me ? (l.k === "hit" || l.k === "blocked" ? 900 : 700)
  : l.again ? 900
  : ["attack", "play", "ability", "hero"].includes(l.k) ? 1500
  : l.k === "block" ? 1200 : 850;
/* THE OTHER SEAT'S PACE (engine/local.js `pace`): an action waits for everything it said to be shown in turn (a hit
   and then the turn passing are two calls, one after the other), so the talk never falls behind the table; a quiet
   pass hardly waits at all. A tap on a call brings the next action forward (local.js `nudge`). */
const talkPace = (prev, a, next, seat, me) => {
  if(!a) return 450;
  let ls = [];
  try { ls = talkMerge(DawnAnnounce.say({seat, action: a, prev, next}, me).filter(l => talkShows(l, me))); } catch(_){}
  return ls.length ? ls.reduce((t, l) => t + talkHold(l, me), 0) + 150 : 110;
};
/* THE VOICE (optional, off by default: §4.3) — the opponent's line read aloud */
const talkSay = l => {
  if(!l || !store.get(TALK_VOICE, false)) return;
  try {
    const t = l.k === "block" ? "blocking " + (l.sub || "") : l.k === "turn" ? "" : DawnAnnounce.spoken(l);
    if(!t || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.rate = 1.08; u.pitch = 0.95;
    window.speechSynthesis.speak(u);
  } catch(_){}
};

/* THE BACKS OF THE CARDS THEY HOLD — how many, never which */
function TalkBacks({n}){
  if(!(n > 0)) return null;   /* empty is empty (§2 principle 5) */
  return <span className="tk-backs" aria-label={"cards in hand: " + n}>
    {Array.from({length: Math.min(n, 7)}, (_, i) => <span key={i} className="tk-cback"/>)}
    <b className="tk-n">{n}</b></span>;
}
/* THE MARKERS (TRP 5.8: "markers or dice, to represent remaining resource and action points") */
function TalkMarks({sd}){
  const ap = sd.ap | 0, res = sd.res | 0;
  if(!ap && !res) return null;
  return <span className="tk-marks">
    {ap > 0 && <span className="tk-apw" title="action points"><span className="tk-ap"/>{ap > 1 && <b>×{ap}</b>}</span>}
    {res > 0 && <span className="tk-res" title="resources">{res}</span>}</span>;
}
/* A SIDE'S GEAR, AS IT LIES ON THE MAT (TT1, v7.20: "cards over chips"): each piece a small real card in slot
   order, its weapon last, with a die on it for the number that matters at the table — the defence the piece
   blocks for now (`gearDef`: counters and breaks counted; the engine's number, never the printed one), a
   weapon's power. A piece declared as a blocker lifts off the mat; a broken one (0) lies dim; a weapon that has
   swung (`swingSpentWhy`) is turned sideways, as players turn a permanent to show it was used (TRP 5.8); a
   face-down piece is a back to the other seat. The pieces close up and overlap when the row is narrow, the
   left edge (and its die) always showing, as cards fanned on a mat. One button opens them, large. */
function TalkGear({sd, mine, onOpen}){
  const gear = (sd.gear || []).filter(x => x && !x.destroyed);
  if(!gear.length) return null;
  const arms = gear.filter(x => !isWeapon(x)), weps = gear.filter(x => isWeapon(x));
  const piece = gr => {
    const w = isWeapon(gr), hid = gr._faceDown && !mine;
    const d = w ? (gr.power != null ? gr.power : null) : gr.def != null || gr.curDef != null ? gearDef(gr) : null;
    const on = (sd.blockG || []).indexOf(gr.uid) >= 0, spent = w && !!DawnParser.swingSpentWhy(sd, gr);
    return <span key={gr.uid} className={"tk-gcard" + (w ? " w" : "") + (!w && d === 0 && gr.def > 0 ? " worn" : "") + (on ? " on" : "") + (spent ? " spent" : "")}>
      <span className="tk-gface">{hid ? <span className="tk-cback"/> : <CardImg card={gr}/>}</span>
      {!hid && d != null && <b className="tk-gdie">{d}</b>}</span>;
  };
  return <button className="tk-geargrp" onClick={onOpen} aria-label={(mine ? "your" : "their") + " gear"} data-talk-gear>
    {arms.map(piece)}{weps.map(piece)}
  </button>;
}
/* A SIDE'S PILES, as they lie: this turn's pitch, the graveyard and the banished face up (their top card),
   the deck face down; one button that shows them all (the public zones; docs/TABLE-TALK.md §1.2 quotes the rules). */
function TalkPiles({sd, onOpen}){
  const pile = (cards, cls) => { const n = (cards || []).length; if(!n) return null;
    return <span className={"tk-mpile " + cls}><CardImg card={cards[n - 1]}/><b className="tk-n">{n}</b></span>; };
  return <button className="tk-pilegrp" onClick={onOpen} aria-label="piles: pitch, graveyard, banished, deck" data-talk-piles>
    {pile(sd.pitch, "pitch")}{pile(sd.grave, "grave")}{pile(sd.banish, "ban")}
    <span className="tk-mpile deck"><span className="tk-cback"/><b className="tk-n">{(sd.deck || []).length}</b></span>
  </button>;
}

/* ONE SIDE OF THE TABLE. `boardCell` is TableBoard's own arena cell (yours act); theirs open the card. */
function TalkSide({sd, mine, boardCell, onZoom, onSheet}){
  const perms = (sd.board || []).length > 0 && <span className="tk-perms">
    {(sd.board || []).map((b, i) => mine && boardCell ? boardCell(b, i)
      : <button key={b.uid} className="tk-perm" onClick={()=>onZoom(b.card)}>
          <CardFrame card={b.card} className="sm" noType/>{b.kind === "ally" && b.life != null && <span className="sw">♥ {b.life}</span>}</button>)}
  </span>;
  /* who they are and their life sit in the bout above; a side is only what lies on the table */
  return mine
    ? <div className="tk-side you" data-talk-side="you">
        {perms && <div className="tk-row">{perms}</div>}
        <div className="tk-row"><TalkMarks sd={sd}/><span className="tk-sp"/>
          <TalkGear sd={sd} mine onOpen={()=>onSheet("gear")}/><TalkPiles sd={sd} onOpen={()=>onSheet("piles")}/></div>
      </div>
    : <div className="tk-side them" data-talk-side="them">
        <div className="tk-row"><TalkGear sd={sd} onOpen={()=>onSheet("gear")}/><TalkMarks sd={sd}/><span className="tk-sp"/>
          <TalkBacks n={(sd.hand || []).length}/>
          {sd.arsenal && <span className="tk-ars" aria-label="arsenal: a card, face down"><span className="tk-cback"/></span>}
          <TalkPiles sd={sd} onOpen={()=>onSheet("piles")}/></div>
        {perms && <div className="tk-row">{perms}</div>}
      </div>;
}

/* THE BOUT — the fighting-game callout (user, 2026-11-26: "still with the health bar callout to a fighting
   game"). One strip across the top, as a fighting game draws it: you on the left, them on the right, each
   bar draining toward the middle with the red trail catching up, the numeral at the inner end (the number
   is the truth; the bar is the feel), the turn between you like a round timer, and each hit popping off
   its bar. Life is READ FROM THE PAD, mark by mark (engine/announce.js `lifeMarks`), the one record a player
   keeps (TRP 5.8); a tap opens the pad itself, the whole scratch sheet. Display only. */
function TalkBout({g, mySeat, pad, myH, foeH, db, names, rating, thinking, menu, onPad}){
  /* EACH CHANGE POPS ON ITS OWN: a mark gets the moment it was first seen here, and every mark younger than its pop
     is drawn with its own key, so two quick hits are two pops, the older already rising (a mark the table opened
     with, a rejoin's history, never pops) */
  const seen = uR(null);
  if(!seen.current) seen.current = {n: pad.marks.length, at: {}};
  for(let i = seen.current.n; i < pad.marks.length; i++) seen.current.at[i] = Date.now();
  if(pad.marks.length < seen.current.n) seen.current.at = {};
  seen.current.n = pad.marks.length;
  const fresh = (m, i) => seen.current.at[i] != null && Date.now() - seen.current.at[i] < 1100;
  const fighter = seat => {
    const mine = seat === mySeat, sd = g.sides[seat], h = mine ? myH : foeH;
    const ms = pad.marks.filter(m => m.seat === seat), last = ms[ms.length - 1];
    const hp = last ? last.total : pad.start[seat];
    const max = Math.max(1, sd.maxHp | 0 || pad.start[seat] | 0 || hp);
    const low = hp > 0 && hp <= Math.ceil(max / 4);
    const turn = g.turnPlayer === seat;
    return <span className={"tk-ftr " + (mine ? "you" : "them r") + (turn ? " turn" : "")} data-talk-life={mine ? "you" : "them"}>
      {h ? <span className="tk-port"><HeroArt h={h} db={db}/></span> : <span className="tk-port none"/>}
      <span className="tk-fcol">
        <span className="tk-fname"><span>{mine ? "You" : talkShort(names[seat])}</span>
          {rating[seat] != null && <i className="tk-rate">{rating[seat]}</i>}
          {!mine && thinking && <span className="tk-think" aria-label="deciding"><i/><i/><i/></span>}</span>
        <LifeBar hp={hp} max={max} right={!mine}/>
      </span>
      <LifeNum n={hp} className={"tk-hp" + (low ? " low" : "")}/>
      {pad.marks.map((m, i) => m.seat === seat && fresh(m, i)
        ? <i key={i} className={"tk-pop" + (m.delta > 0 ? " up" : "")} aria-hidden="true">{(m.delta > 0 ? "+" : "") + m.delta}</i> : null)}
    </span>;
  };
  return <div className="tk-bout" data-talk-bout>
    {menu}
    <button className="tk-fight-hud" onClick={onPad} data-talk-pad
      aria-label={"life: you " + (g.sides[mySeat].hp | 0) + ", " + talkShort(names[1 - mySeat]) + " " + (g.sides[1 - mySeat].hp | 0) + ". Open the pad"}>
      {fighter(mySeat)}
      <span className={"tk-round" + (g.turnPlayer === mySeat ? " you" : " them")} aria-hidden="true"><b>{g.turn | 0}</b><i>turn</i></span>
      {fighter(1 - mySeat)}
    </button>
  </div>;
}

/* THE MIDDLE: the chain as it lies on the mat — the attack with its power, the blockers beside it with
   their total, the links before it stacked small; a card on the stack; between attacks, the turn token. */
function TalkChain({g, mySeat, them, myH, foeH, db, onZoom, onLinks}){
  const p = g.chainOpen && g.pend ? g.pend : null;
  const featured = p ? {card: p.card} : null;   /* the attack, as both other boards feature it (LinkStamp's reader) */
  const top = (g.stack || []).filter(l => l && l.k === "play" && l.card).slice(-1)[0] || null;
  const declared = sd => [...(sd.blockH || []).map(u => (sd.hand || []).find(c => c.uid === u)),
                          ...(sd.blockG || []).map(u => (sd.gear || []).find(c => c.uid === u))].filter(Boolean);
  const walls = p ? declared(g.sides[1 - p.by]) : [];
  /* THE WALL'S TOTAL IS THE ENGINE'S (`pend.wall`, set when the link strikes), never a sum of printed
     numbers that a reaction or a buff would make wrong; until then each blocker shows its own corner */
  const wall = p && p.wall != null ? p.wall : null;
  const earlier = (g.chainCards || []).map(e => e && (e.card || e)).filter(c => c && (!p || !p.card || String(c.uid) !== String(p.card.uid)));
  const yourTurn = g.turnPlayer === mySeat;
  /* THE TURN TOKEN is the turn player's medallion (their hero's art in a gold rim), lying on their half of the mat
     and sliding across when the turn passes; the turn's NUMBER is the bout's alone (one number, one place) */
  const tokH = yourTurn ? myH : foeH;
  /* YOUR PLAY FLIES from the hand to where it lands (the stack, then the chain), as the classic board's does */
  const atkRef = uR(null), stackRef = uR(null);
  useGlideIn(atkRef, p && p.card ? p.card.uid : null, 320, true);
  useGlideIn(stackRef, top ? top.card.uid : null, 320, true);
  return (
    <div className="tk-chain">
      {earlier.length > 0 && <button className="tk-links" onClick={onLinks} aria-label={"earlier links: " + earlier.length}>
        <CardImg card={earlier[earlier.length - 1]}/><b className="tk-n">{earlier.length}</b></button>}
      {p ? <div className="tk-fight">
          <button ref={atkRef} className={"tk-atk" + (p.by === mySeat ? " mine" : "")} onClick={()=>onZoom(p.card)} data-talk-attack>
            <CardImg card={p.card}/>
            <span className="tk-pow">{p.total | 0}</span>
            {p.ga && <span className="tk-ga">go again</span>}
            <LinkStamp l={featOutcome(featured, g.chain)} seq={(g.chain || []).length}/>
          </button>
          {walls.length > 0 && <div className="tk-walls">
            {wall != null && <span className="tk-wall"><i>⛨</i>{wall}</span>}
            <span className="tk-blks">{walls.map(c => <button key={c.uid} className="tk-blk" onClick={()=>onZoom(c)}><CardFrame card={c} className="sm" noType/></button>)}</span>
          </div>}
        </div>
        : top ? <div className="tk-fight"><button ref={stackRef} className="tk-stackc" onClick={()=>onZoom(top.card)}>
            <CardImg card={top.card}/><span className="tk-onstack">on the stack</span></button></div>
        : <div className={"tk-token" + (yourTurn ? " you" : " them")} aria-label={"turn " + (g.turn | 0) + (yourTurn ? ", yours" : ", " + talkShort(them) + "'s")} data-talk-token>
            <b>{tokH ? <HeroArt h={tokH} db={db}/> : null}</b><span>{yourTurn ? "your turn" : talkShort(them) + "'s turn"}</span></div>}
      <LinkSfx chain={g.chain}/>
    </div>);
}

/* THE PAD, OPENED (TRP 5.8): the whole scratch sheet — every change since the start, with its source. The bout above
   is its summary; this is where the history lives, as at a real table. */
/* the sheet's columns, as written: you, then them; each change below the last, the superseded total struck through.
   `won` (the result) circles the winner's last total in red pencil, as a player rings it at the end. */
function TalkPadGrid({pad, mySeat, them, won}){
  const cols = [mySeat, 1 - mySeat];
  const lastOf = s => { for(let i = pad.marks.length - 1; i >= 0; i--) if(pad.marks[i].seat === s) return i; return -1; };
  const ring = (s, i) => won === s && lastOf(s) === i ? " ring" : "";
  return <div className="tk-padgrid">
    {cols.map(s => <span key={"h" + s} className="tk-padth">{s === mySeat ? "you" : talkShort(them)}</span>)}
    {cols.map(s => <span key={"s" + s} data-col={s === mySeat ? "you" : "them"} className={"tk-padv" + (pad.marks.some(m => m.seat === s) ? " old" : " now") + ring(s, -1)}><span>{pad.start[s]}</span></span>)}
    {pad.marks.map((m, i) => { const superseded = pad.marks.slice(i + 1).some(x => x.seat === m.seat);
      return cols.map(s => s === m.seat
        ? <span key={i + ":" + s} data-col={s === mySeat ? "you" : "them"} className={"tk-padv" + (superseded ? " old" : " now") + ring(s, i)}>
            <em>{(m.delta > 0 ? "+" : "") + m.delta}{m.source ? " " + m.source : ""}</em><span>{m.total}</span></span>
        : <span key={i + ":" + s} className="tk-padv blank"/>); })}
  </div>;
}
const talkPadHead = (them, first, mySeat, turn) =>
  "vs " + talkShort(them) + (first != null ? " · " + (first === mySeat ? "you went first" : talkShort(them) + " went first") : "") + " · turn " + (turn | 0);
function TalkPadSheet({open, pad, mySeat, them, first, turn, onClose}){
  if(!open) return null;
  return <div className="tk-sheetwrap" onClick={onClose}>
    <div className="tk-padsheet paper" onClick={e=>e.stopPropagation()} data-talk-padsheet>
      <div className="tk-padhead">{talkPadHead(them, first, mySeat, turn)}</div>
      <TalkPadGrid pad={pad} mySeat={mySeat} them={them}/>
      <p className="tk-padnote">Life, each change, and its source: all a player may write down during a game (TRP 5.8).</p>
      <button className="bigbtn alt" onClick={onClose}>Close the pad</button>
    </div></div>;
}
/* THE RESULT IS THE PAD (docs/TABLE-TALK.md §8, TT3's first piece, v7.20): at the end of a game the sheet is what a player
   holds — both columns as they were written, the winner's last total ringed in red pencil, the turn count and who went
   first at the top (TRP 5.8's meta-game facts), and "GG" in the corner. It stands in the end panel where the classic
   board shows the names and the recap (the pad already IS the recap: every change and its source); the panel's own
   buttons — leave, rematch, verify, the rating — are unchanged around it. The sheet scrolls to its last line. */
function TalkResult({pad, mySeat, them, first, turn, winner}){
  const ref = uR(null);
  uE(()=>{ const el = ref.current; if(el) el.scrollTop = el.scrollHeight; }, []);
  return <div className="tk-result paper" onClick={e=>e.stopPropagation()} data-talk-result>
    <div className="tk-padhead">{talkPadHead(them, first, mySeat, turn)}</div>
    <div className="tk-resscroll" ref={ref}><TalkPadGrid pad={pad} mySeat={mySeat} them={them} won={winner}/></div>
    <span className="tk-gg" aria-label="good game">GG</span>
  </div>;
}

/* A SIDE, PICKED UP AND LOOKED THROUGH: its gear (each piece large), or its piles — this turn's pitch,
   the graveyard, the banished (public zones), and the deck by count alone. Face-down cards stay backs. */
function TalkLook({look, onZoom, onClose}){
  if(!look) return null;
  const face = c => c && (c._faceDown && !look.mine || DawnView.isPh(c))
    ? <span className="tk-cback big"/>
    : <button key={c.uid} onClick={()=>onZoom(c)}><CardFrame card={c} className="sm"/></button>;
  const sec = (title, cards) => (cards || []).length > 0 && <div className="tk-looksec" key={title}>
    <div className="tk-lookh">{title} · {cards.length}</div>
    <div className="tk-lookgrid">{[...cards].reverse().map((c, i) => <React.Fragment key={(c && c.uid) + ":" + i}>{face(c)}</React.Fragment>)}</div></div>;
  return <div className="tk-sheetwrap" onClick={onClose}>
    <div className="tk-look" onClick={e=>e.stopPropagation()} data-talk-look={look.kind}>
      <div className="tk-padhead">{look.title}</div>
      {look.kind === "gear" ? sec("gear", (look.sd.gear || []).filter(x => x && !x.destroyed))
        : look.kind === "links" ? sec("earlier links on this chain", look.cards)
        : <>{sec("pitched this turn", look.sd.pitch)}{sec("graveyard", look.sd.grave)}{sec("banished", look.sd.banish)}
            <p className="tk-padnote">Deck: {(look.sd.deck || []).length} cards, face down.{(look.sd.pitch || []).length ? " What was pitched goes to the bottom of the deck at the end of the turn, in an order nobody else sees (CR 4.4.3c)." : ""}</p></>}
      <button className="bigbtn alt" onClick={onClose}>Done</button>
    </div></div>;
}

/* WHAT IS SAID, AND THE GLIMPSE (docs/TABLE-TALK.md §4, §6). The head of the queue, held for its time;
   a tap moves on and brings the next play forward (`onSkip`); a press holds it while you read. */
function TalkCall({line, me, names, onDone, onSkip}){
  const [held, setHeld] = uS(false);
  const timer = uR(null), pressT = uR(null), heldRef = uR(false);
  uE(()=>{ if(!line) return;
    talkSay(line.seat !== me ? line : null);
    if(timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(()=>{ if(!heldRef.current) onDone(); }, talkHold(line, me));
    return ()=>{ if(timer.current) clearTimeout(timer.current); }; }, [line]);
  if(!line) return null;
  const theirs = line.seat !== me;
  const big = theirs && !line.again && ["attack", "play", "ability", "hero"].includes(line.k) && !!line.card;
  const blockCards = theirs && (line.k === "block" || line.k === "pitch") ? (line.k === "pitch" ? line.pitched : line.cards || []).filter(Boolean) : [];
  const who = line.k === "turn" || line.k === "over" ? null : theirs ? names[line.seat] : "You";
  const head = line.k === "turn" ? (line.seat === me ? "YOUR TURN" : talkShort(names[line.seat]).toUpperCase() + "'S TURN")
    : line.k === "over" ? (line.seat === me ? "YOU WIN" : line.seat == null ? "DRAW" : talkShort(names[line.seat]).toUpperCase() + " WINS")
    : line.k === "hit" ? "HIT " + (line.n | 0) : line.head;
  const sub = line.k === "turn" ? "turn " + (line.n | 0) : line.k === "over" ? "" : line.sub;
  const down = () => { pressT.current = setTimeout(()=>{ heldRef.current = true; setHeld(true); }, 320); };
  const up = () => { if(pressT.current) clearTimeout(pressT.current);
    if(heldRef.current){ heldRef.current = false; setHeld(false); onDone(); } };
  const tap = () => { if(heldRef.current) return; if(timer.current) clearTimeout(timer.current); onSkip(); };
  return (
    <div className={"tk-call " + (theirs ? "foe" : "you") + " k-" + line.k + (big ? " big" : "") + (line.again ? " again" : "") + (held ? " held" : "")}
      onClick={tap} onPointerDown={down} onPointerUp={up} onPointerCancel={up} onPointerLeave={up}
      role="status" aria-live="polite" data-talk-call={line.k}>
      <div className="tk-say">
        {who && <span className="tk-sayer">{talkShort(who)}</span>}
        <b className="tk-head">{head}</b>
        {sub ? <span className="tk-sub">{sub}{line.ga ? " · go again" : ""}</span> : null}
      </div>
      {big && <div className="tk-glimpse-row">
        <div className="tk-glimpse"><CardImg card={line.card}/></div>
        {(line.pitched || []).length > 0 && <div className="tk-pitched">
          {line.pitched.map(c => <span key={c.uid} className={"tk-pitchc p" + (c.pitch || 0)}><CardImg card={c}/><i>pitch</i></span>)}</div>}
      </div>}
      {blockCards.length > 0 && <div className="tk-blockrow">
        {blockCards.map(c => <span key={c.uid} className="tk-blockc"><CardImg card={c}/></span>)}</div>}
      {held && <span className="tk-holdnote">holding · let go to continue</span>}
    </div>);
}

/* THE MENU — the only chrome on the table (docs/TABLE-TALK.md §7) */
function TalkMenu({open, onClose, items}){
  if(!open) return null;
  return <div className="tk-sheetwrap" onClick={onClose}>
    <div className="tk-menu" onClick={e=>e.stopPropagation()} data-talk-menu>
      {items.filter(Boolean).map(([label, fn, sub], i) => typeof fn === "function"
        ? <button key={i} className="tk-mi" onClick={()=>{ onClose(); fn(); }}><b>{label}</b>{sub && <span>{sub}</span>}</button>
        : <div key={i} className="tk-mi plain"><b>{label}</b>{fn}</div>)}
      <button className="bigbtn alt" onClick={onClose}>Back to the table</button>
    </div></div>;
}

/* THE TABLE. Everything that acts is handed in by TableBoard. */
function TalkTable({g, mySeat, db, myH, foeH, names, rating, first, calls, onCallDone, onCallSkip, pad,
                    hand, ask, target, boardCell, onZoom, menuItems, thinking, extra}){
  const me = g.sides[mySeat], them = g.sides[1 - mySeat];
  const [padOpen, setPadOpen] = uS(false);
  const [menuOpen, setMenuOpen] = uS(false);
  const [look, setLook] = uS(null);
  const lookAt = (sd, kind, mine) => setLook({sd, kind, mine,
    title: (mine ? "Your " : talkShort(sd) + "'s ") + (kind === "gear" ? "gear" : "piles")});
  const menuBtn = <button className="tk-menubtn" onClick={()=>setMenuOpen(true)} aria-label="menu" data-talk-menubtn><i/><i/><i/></button>;
  return (<>
    <div className="tk-upper">
      <TalkBout g={g} mySeat={mySeat} pad={pad} myH={myH} foeH={foeH} db={db} names={names} rating={rating}
        thinking={thinking} menu={menuBtn} onPad={()=>setPadOpen(true)}/>
      <TalkSide sd={them} onZoom={onZoom} onSheet={k=>lookAt(them, k, false)}/>
      <div className="tk-mid">
        <TalkChain g={g} mySeat={mySeat} them={them} myH={myH} foeH={foeH} db={db} onZoom={onZoom}
          onLinks={()=>setLook({kind: "links", title: "The chain", cards: (g.chainCards || []).map(e => e && (e.card || e)).filter(Boolean)})}/>
      </div>
      <TalkCall line={calls[0] || null} me={mySeat} names={names} onDone={onCallDone} onSkip={onCallSkip}/>
    </div>
    <TalkSide sd={me} mine boardCell={boardCell} onZoom={onZoom} onSheet={k=>lookAt(me, k, true)}/>
    {ask}
    {target}
    {hand}
    <div className="tk-hubspace"/>
    {extra}
    <TalkPadSheet open={padOpen} pad={pad} mySeat={mySeat} them={them} first={first} turn={g.turn} onClose={()=>setPadOpen(false)}/>
    <TalkLook look={look} onZoom={c=>{ setLook(null); onZoom(c); }} onClose={()=>setLook(null)}/>
    <TalkMenu open={menuOpen} onClose={()=>setMenuOpen(false)} items={menuItems}/>
  </>);
}

</script>
<script type="text/babel" data-presets="env,react">
/* ---------- YOUR RECORD (v7.00, QUEUE NEXT 3) — a player's own page, a door on the title screen.
   Built from what is already kept, no new table: the record against the AI (DawnLocal's, on this device), the Dummy's best
   clears (`best`), and, only when this phone already has a server sign-in AND the player taps for it, the ranked games the
   ladder already sends (`mine`, the last ten): the rating over those games, read backwards from today's rating, and the heroes
   played most. Opening the page makes NO request to the server (the title's rule); the ranked card asks only on its button. ---------- */
const recSum = cs => cs.reduce((a,c)=>({w:a.w+c.w, l:a.l+c.l, d:a.d+c.d}), {w:0,l:0,d:0});
const recLine = c => c.w+" won, "+c.l+" lost"+(c.d ? ", "+c.d+" drawn" : "");
/* the rating BEFORE each of the last games and after the newest, oldest first: today's rating with each change taken back */
const ratingPath = (now, mine) => { const out = [now]; let r = now; for(const x of mine){ r -= (x.change||0); out.push(r); } return out.reverse(); };
function RatingLine({pts}){
  if(pts.length<2) return null;
  const W = 280, H = 56, lo = Math.min(...pts), hi = Math.max(...pts), span = Math.max(1, hi-lo);
  const xy = pts.map((p,i)=>[Math.round(i*(W-8)/(pts.length-1))+4, Math.round(H-6-(p-lo)*(H-12)/span)]);
  const first = pts[0], last = pts[pts.length-1];
  return <figure className="recline" data-testid="record-rating-line" aria-label={"Your rating went from "+first+" to "+last+" over your last "+(pts.length-1)+" ranked games"}>
    <svg viewBox={"0 0 "+W+" "+H} width="100%" height={H} role="img" aria-hidden="true">
      <polyline points={xy.map(p=>p.join(",")).join(" ")} fill="none" stroke="var(--y)" strokeWidth="2" strokeLinejoin="round"/>
      {xy.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={i===xy.length-1?3.5:2} fill={i===xy.length-1?"var(--y)":"var(--bone-dim)"}/>)}
    </svg>
    <figcaption><span>{first}</span><span>{last>first ? "up "+(last-first) : last<first ? "down "+(first-last) : "level"} over {pts.length-1} {pts.length-1===1?"game":"games"}</span><span>{last}</span></figcaption>
  </figure>;
}
function RankedRecord(){
  const srvOn = !!(window.SERVER_TABLE && DawnServerTable.doorOpen(SRV_CHOICE, window.SERVER_TABLE.on));
  const cfg = srvOn ? {...window.SERVER_TABLE, on: true} : null;
  const who = uM(()=> cfg ? DawnServerTable.defaultIdentity(cfg, store) : null, [srvOn]);
  const signedIn = !!who && (typeof who.known!=="function" || who.known());
  const [st,setSt] = uS({s:"idle"});
  const alive = uR(true); uE(()=>()=>{ alive.current = false; },[]);
  if(!signedIn) return <div className="sheet clip" data-testid="record-ranked-none" style={{marginTop:10}}>
    <h2 className="fs-h2s">Ranked</h2>
    <p className="fs-lede">No ranked games on this phone yet. Find an opponent and open a ranked table: your rating and your last games will show here.</p></div>;
  const load = () => { setSt({s:"loading"});
    DawnServerTable.ladder({transport: srvTransport(cfg), identity: who})
      .then(r=>{ if(alive.current) setSt({s:"ok", r}); }, ()=>{ if(alive.current) setSt({s:"fail"}); }); };
  const r = st.r, yl = r && r.you, mine = (r && r.mine) || [];
  const fav = {}; mine.forEach(x=>{ fav[x.hero] = (fav[x.hero]||0)+1; });
  const favs = Object.keys(fav).sort((a,b)=>fav[b]-fav[a] || (a<b?-1:1)).slice(0,3);
  return <div className="sheet clip" data-testid="record-ranked" style={{marginTop:10}}>
    <h2 className="fs-h2s">Ranked</h2>
    {st.s==="idle" && <><p className="fs-lede">Your rating and your last ranked games are kept by the server.</p>
      <button className="bigbtn" data-testid="record-ranked-load" onClick={load}>Show my ranked games</button></>}
    {st.s==="loading" && <div className="tblstat live"><span className="tbldot"></span>Reading your games…</div>}
    {st.s==="fail" && <><p className="fs-lede">The server is not answering right now. Check your connection, then try again.</p>
      <button className="bigbtn" onClick={load}>Try again</button></>}
    {st.s==="ok" && !yl && <p className="fs-lede">The server did not know this phone just now. Open a ranked table and try again.</p>}
    {st.s==="ok" && yl && <>
      <div className="statrow" style={{justifyContent:"space-between"}}><span>Rating</span><b className="mono" data-testid="record-rating">{yl.rating}</b></div>
      <div className="statrow" style={{justifyContent:"space-between"}}><span>{yl.listed ? "On the ladder" : "Ranked games"}</span><b className="mono">{yl.listed ? "#"+yl.rank : yl.games}</b></div>
      <div className="statrow" style={{justifyContent:"space-between"}}><span>Record</span><b className="mono">{yl.wins}–{yl.losses}{yl.draws ? "–"+yl.draws : ""}</b></div>
      {mine.length>0 ? <RatingLine pts={ratingPath(yl.rating, mine)}/> : <p className="fs-lede" style={{marginTop:6}}>No ranked games yet.</p>}
      {favs.length>0 && <p className="recfav" data-testid="record-favourites">Played most: {favs.map((k,i)=><span key={k}>{i ? ", " : ""}<b>{ladHero(k)}</b> ×{fav[k]}</span>)}</p>}
    </>}
  </div>;
}
function YourRecord(){
  const rec = uM(()=>DawnLocal.loadRecord(lsGet),[]);
  const best = store.get("best",{});
  const rows = HEROES.map(h=>{ const f = rec.foes[h.k] || {}; const c = recSum([f.sharp, f.steady].filter(Boolean)); return {h, c, n: c.w+c.l+c.d}; })
    .filter(x=>x.n>0).sort((a,b)=>b.n-a.n || (a.h.k<b.h.k?-1:1));
  const all = recSum(rows.map(x=>x.c));
  /* the same games by the hero YOU played; the "unknown" bucket (older games) is never a row */
  const mineRows = HEROES.map(h=>{ const c = rec.mine[h.k]; return c ? {h, c, n:c.w+c.l+c.d} : null; })
    .filter(x=>x && x.n>0).sort((a,b)=>b.n-a.n || (a.h.k<b.h.k?-1:1));
  /* games against PEOPLE, by the hero you played (the same reading as Your heroes), kept apart from the AI's */
  const pvpRows = HEROES.map(h=>{ const c = rec.pvp.mine[h.k]; return c ? {h, c, n:c.w+c.l+c.d} : null; })
    .filter(x=>x && x.n>0).sort((a,b)=>b.n-a.n || (a.h.k<b.h.k?-1:1));
  const pvpAll = recSum(pvpRows.map(x=>x.c));
  /* the same games by the hero THEY played (pvp.foes); shown on a tap so the page stays short */
  const whomRows = HEROES.map(h=>{ const c = rec.pvp.foes[h.k]; return c ? {h, c, n:c.w+c.l+c.d} : null; })
    .filter(x=>x && x.n>0).sort((a,b)=>b.n-a.n || (a.h.k<b.h.k?-1:1));
  const [whom, setWhom] = useState(false);
  const clears = HEROES.filter(h=>best[h.k]!=null);
  return <div data-testid="record-page">
    <div className="sheet clip">
      <h2>Your record</h2>
      <p className="tag" style={{margin:"4px 0 10px"}}>Kept on this phone</p>
      <h3 className="fs-h2s">Against the AI</h3>
      {rows.length===0 ? <p className="fs-lede" data-testid="record-ai-none">No games against an AI hero yet. Play the AI from the title screen.</p> : <>
        <p className="fs-lede" data-testid="record-ai-total">{recLine(all)} in all.</p>
        {rows.map(x=><div key={x.h.k} className="statrow" data-testid="record-ai-row" style={{justifyContent:"space-between"}}>
          <span>{x.h.n}</span><b className="mono" aria-label={recLine(x.c)}>{x.c.w}–{x.c.l}{x.c.d ? "–"+x.c.d : ""}</b></div>)}</>}
      {mineRows.length>0 && <>
        <h3 className="fs-h2s" style={{marginTop:12}}>Your heroes</h3>
        {mineRows.map(x=><div key={x.h.k} className="statrow" data-testid="record-mine-row" style={{justifyContent:"space-between"}}>
          <span>{x.h.n} <span className="mono">×{x.n}</span></span><b className="mono" aria-label={recLine(x.c)}>{x.c.w}–{x.c.l}{x.c.d ? "–"+x.c.d : ""}</b></div>)}</>}
      {pvpRows.length>0 && <>
        <h3 className="fs-h2s" style={{marginTop:12}}>Against people</h3>
        <p className="fs-lede" data-testid="record-pvp-total">{recLine(pvpAll)} in all. Friendly and direct tables; ranked games are under Ranked.</p>
        {pvpRows.map(x=><div key={x.h.k} className="statrow" data-testid="record-pvp-row" style={{justifyContent:"space-between"}}>
          <span>{x.h.n} <span className="mono">×{x.n}</span></span><b className="mono" aria-label={recLine(x.c)}>{x.c.w}–{x.c.l}{x.c.d ? "–"+x.c.d : ""}</b></div>)}
        {whomRows.length>0 && <button className="bigbtn alt" data-testid="record-whom-btn" aria-expanded={whom} onClick={()=>setWhom(v=>!v)}>{whom ? "Hide who you played" : "Against whom?"}</button>}
        {whom && whomRows.length>0 && <div data-testid="record-whom">
          <p className="fs-lede" style={{marginTop:8}}>The same games, by the hero across the table.</p>
          {whomRows.map(x=><div key={x.h.k} className="statrow" data-testid="record-whom-row" style={{justifyContent:"space-between"}}>
            <span>vs {x.h.n} <span className="mono">×{x.n}</span></span><b className="mono" aria-label={recLine(x.c)}>{x.c.w}–{x.c.l}{x.c.d ? "–"+x.c.d : ""}</b></div>)}</div>}</>}
      <h3 className="fs-h2s" style={{marginTop:12}}>The Dummy</h3>
      {clears.length===0 ? <p className="fs-lede">No clears logged yet. Train against the Dummy to set one.</p>
        : <p className="fs-lede" data-testid="record-dummy">{clears.length} {clears.length===1?"hero has":"heroes have"} cleared it; Trophies keeps the best clear for each.</p>}
    </div>
    <RankedRecord/>
  </div>;
}

/* THE TITLE SCREEN (user request, 2026-11-25): the first screen on every load, laying out the modes before a hero is chosen.
   Looking makes no request to the server: the choices only set App's state. Each one routes into an existing screen. */
/* THE NEW TABLE'S SWITCH (Table Talk TT0, v7.18): every table this phone sits at — the AI, a friend, the server */
function TalkSwitch(){
  const [on,setOn] = uS(()=>talkOn());
  return <button role="switch" aria-checked={on} data-testid="talk-switch" className={"tswitch"+(on?" on":"")}
    onClick={()=>{ store.set(TALK_KEY, !on); setOn(!on); }}>
    <span><b>Try the new table</b><span>{on ? "On: the table as it sits in front of you, the opponent's plays announced, life on a pad." : "A preview: the table as it sits in front of you, no log, the opponent's plays announced."}</span></span>
    <i/></button>;
}
function TitleScreen({onMode, onMore, how, onHow, fresh}){
  const modes = [
    ["dummy","Train against the Dummy","Learn your deck against an iron-armored dummy. Coach's call reads the board for you.", true],
    ["ai","Play the AI","Take on a hero piloted by the computer, and see why it makes each move.", false],
    ["online","Find an opponent","Play someone online, friendly or ranked, and climb the ladder.", false],
    ["direct","Two phones, one table","Open or join a table with a friend, or judge one from a third device.", false]];
  return (<div className="title" data-testid="title-screen">
    <h1 className="tbrand">DAWN<em>BLADE</em></h1>
    <p className="tline">A fan-made Flesh and Blood Silver Age sparring simulator. Pick a hero and play for fun.</p>
    <div className="tmodes">{modes.map(m=><button key={m[0]} data-testid={"mode-"+m[0]} className={"tmode clip"+(m[3]?" lead":"")} onClick={()=>onMode(m[0])}><b>{m[1]}</b><span>{m[2]}</span></button>)}</div>
    {/* TABLE TALK (TT0, v7.18): the new table, tried from here; the choice is kept on this phone (docs/TABLE-TALK.md) */}
    <TalkSwitch/>
    <div className="tmore">
      <button data-testid="how-btn" className={fresh?"fresh":""} onClick={onHow}>How to play</button>
      <button data-testid="more-judge" onClick={()=>onMore("judge")}>Judge's quiz</button>
      <button data-testid="more-trophies" onClick={()=>onMore("trophies")}>Trophies</button>
      <button data-testid="more-record" onClick={()=>onMore("record")}>Your record</button>
    </div>
    <p data-testid="format-note" className="note" style={{textAlign:"center",marginTop:6}}>Dawnblade is a fan-made Silver Age format: every precon built here, exactly as printed (the Chapter 1–3 decks and the Usurp the Shadow Throne heroes), and every card in them is legal here — even ones Silver Age has since banned.</p>
  </div>);
}

function App(){
  const [db,reload] = useCardDB();
  const [tab,setTab]=uS("heroes");
  /* the title screen shows first on every load (`?title=0` skips it, for the drives); `soloMode` is what it chose for the hero flow: "dummy" | "ai" */
  const [title,setTitle]=uS(()=>!JOIN_ASK && !/[?&]title=0(&|$)/.test(window.location.search));   /* a shared link (JOIN_ASK) goes past the title, straight to the table */
  const [soloMode,setSoloMode]=uS(null);   /* null = no mode chosen (the title was skipped): Battle shows the opponent step with the Dummy picked */
  const [tableOnly,setTableOnly]=uS(()=>JOIN_ASK ? (JOIN_ASK.srv ? "online" : "direct") : undefined);   /* which half of the table screen the title opened */
  const [tableFrom,setTableFrom]=uS(()=>JOIN_ASK ? "title" : "grid");       /* "title" | "grid": where Back returns to */
  const [hero,setHero]=uS(null);
  const [fighting,setFighting]=uS(null);
  /* The merged engine, played alone. A separate slot from `fighting`
     because they are two different boards and only one may be up. */
  const [localTable,setLocalTable]=uS(null);
  const [loHero,setLoHero]=uS(null);
  /* v7.xx: the opponent step, in front of the throw. Holds the chosen fighter, with its
     seed and `foe` once chosen, while the player picks who to fight. */
  const [foeStep,setFoeStep]=uS(null);
  /* seating is decided between the loadout and the first draw */
  const [seating,setSeating]=uS(null);
  /* the table: null -> "find" (the code screen) -> {table,host,code} (seated) */
  const [table,setTable]=uS(()=>JOIN_ASK ? "find" : null);
  const [joinAsk,setJoinAsk]=uS(JOIN_ASK);   /* the shared link's table, used ONCE: gone as soon as the code screen is left, so a later visit opens as usual */
  uE(()=>{ if(table!=="find" && joinAsk) setJoinAsk(null); },[table]);
  const [gaveBack,setGaveBack]=uS(null);   /* "declined" | "expired": a match held while practising was given back */
  uE(()=>{ if(!gaveBack) return; const h = setTimeout(()=>setGaveBack(null), 12000); return ()=>clearTimeout(h); },[gaveBack]);
  const [awayPlay,setAwayPlay]=uS(false);   /* playing the AI while the table screen keeps searching, hidden (SEEK N) */
  const [waitTyp,setWaitTyp]=uS(null);   /* the usual wait in seconds, from the search that is running (TableScreen tells it up); the practice bar shows it too */
  const [seekAgain,setSeekAgain]=uS(null);   /* {ranked}: the end screen's Find another match opens the table screen already searching (v6.81) */
  const [how,setHow]=uS(false);
  const [howSeen,setHowSeen]=uS(()=>!!store.get("howSeen",false));
  const [best,setBest]=uS(()=>store.get("best",{}));
  const record=(k,score)=>setBest(b=>{
    const nb={...b,[k]: b[k]==null?score:Math.min(b[k],score)}; store.set("best",nb); return nb;
  });
  /* One screen at a time. `idle` is the lobby: no match, no loadout, no
     seating throw and nobody at a table. */
  const idle = !fighting && !foeStep && !loHero && !seating && !table && !localTable;
  const onTitle = idle && title;
  const leaveTable = ()=>{ setTable(null); if(tableFrom==="title"){ setTitle(true); setTableFrom("grid"); setTableOnly(undefined); } };
  const picking = awayPlay && table==="find" && !fighting && !foeStep && !loHero && !seating && !localTable;   /* the hero grid again, search still running */
  /* THE TITLE'S MODE MEETS THE OPPONENT STEP: "Play the AI" opens the step with a hero already drawn at
     random (named before you board); "Train against the Dummy" skips it and goes straight to the throw.
     With no mode (the title skipped), the step opens on the Dummy. Back from the throw or the loadout
     returns to whichever step the run came through. */
  const dummyRun = h => soloMode==="dummy" && !h.foe;
  const goBattle = ()=>{ const b = {...hero, seed:battleSeed()};
    if(soloMode==="ai") setFoeStep({...b, foe:{k:HEROES[Math.floor(Math.random()*HEROES.length)].k, random:true}});
    else if(soloMode==="dummy") setLoHero(b);
    else setFoeStep(b); };
  return (
    <div className="shell">
      {!fighting && !table && !localTable && <div className="topbar">
        {!title && <span className="brand">DAWN<em>BLADE</em></span>}
        {idle && !title && <button className="totitle" data-testid="to-title" onClick={()=>{ setTitle(true); setHero(null); }}>‹ Title</button>}
        <span className="tag">v{APP_VER}{db.status==="ready" ? " · "+db.count+" cards" : ""}</span>
      </div>}
      <DbBanner db={db} reload={reload}/>
      {gaveBack && <div className="seekbanner" data-testid="gave-back" role="status"><span>{gaveBack==="expired"
          ? "Your match was given back: nobody took the seat within "+foundWords()+". Your opponent has gone back to looking."
          : "You gave your match back. Your opponent has gone back to looking."}</span>
        <button className="quiet" data-testid="gave-back-ok" onClick={()=>setGaveBack(null)}>OK</button></div>}
      {onTitle && <TitleScreen fresh={!howSeen && !Object.keys(best).length} how={how}
        onHow={()=>{ setHow(true); if(!howSeen){ store.set("howSeen", true); setHowSeen(true); } }}
        onMore={t=>{ setTab(t); setTitle(false); }}
        onMode={m=>{ setGaveBack(null); setTab("heroes");
          if(m==="dummy"||m==="ai"){ setSoloMode(m); setTitle(false); }
          else { setTableOnly(m); setTableFrom("title"); setTitle(false); setTable("find"); } }}/>}
      {onTitle && <HowToPlay open={how} onClose={()=>setHow(false)}/>}
      {tab==="heroes" && ((idle && !title) || picking) && <>

        {picking && <div className="waitbar" data-testid="wait-bar"><span>Still looking for a match. Pick a hero to practise; you will be told the moment someone arrives.{waitTyp!=null && <small className="waittyp" data-testid="wait-typical">{usualWaitLine(waitTyp)}</small>}</span>
          <button className="bigbtn alt" data-testid="wait-back" onClick={()=>setAwayPlay(false)}>Back to the search</button></div>}
        <HeroGrid mode={soloMode} best={best} onPick={p=>setHero(p&&p.random ? {...HEROES[Math.floor(Math.random()*HEROES.length)], mystery:true} : p)} db={db} selected={hero}/>
        <HeroBanner h={hero} db={db}/>
        {hero && <button className="battlebtn clip" disabled={db.status!=="ready"} onClick={goBattle}><span>{db.status==="ready"?"Battle":"Forging…"}</span></button>}
        {!picking && <button className="bigbtn alt" style={{marginTop:8}} onClick={()=>{ setGaveBack(null); setTableOnly(undefined); setTableFrom("grid"); setTable("find"); }}>Find an opponent</button>}
        {/* A NEW PHONE SEES IT AS A BUTTON (v6.57): until How to play has been opened once on this
            device (and no game has been recorded), it wears a gold frame; after that it is quiet text,
            out of a regular's way. Storage that throws reads as "not seen", which only frames it. */}
        {!picking && <button data-testid="how-btn" className={"howbtn"+(howSeen || Object.keys(best).length ? "" : " fresh")}
          onClick={()=>{ setHow(true); if(!howSeen){ store.set("howSeen", true); setHowSeen(true); } }}>New to Flesh and Blood? <b>How to play</b></button>}
        <HowToPlay open={how} onClose={()=>setHow(false)}/>
        {/* THE FORMAT, SAID WHERE A PLAYER LOOKS (v4.76). Dawnblade does not
            follow Silver Age's rolling ban list or its hero bench — see
            data/formats.json — so a player who knows Silver Age is told why
            a card they cannot bring to an event is legal here. */}
        {!picking && <p data-testid="format-note" className="note" style={{textAlign:"center",marginTop:10}}>Dawnblade is a fan-made Silver Age format: every precon built here, exactly as printed (the Chapter 1–3 decks and the Usurp the Shadow Throne heroes), and every card in them is legal here — even ones Silver Age has since banned.</p>}
        <VsStrip hero={hero} db={db}/>
        {hero && !hero.mystery && <HeroSheet h={hero} db={db} best={best} onBack={()=>setHero(null)} onFight={h=>setFighting(h)}/>}
        {hero && hero.mystery && <p className="note" style={{textAlign:"center"}}>Fate holds the card — your fighter is revealed at preparation.</p>}
      </>}
      {table==="find" && <TableScreen only={tableOnly} join={joinAsk} again={seekAgain} away={awayPlay} typ={waitTyp} onTyp={setWaitTyp} onPlayAI={()=>setAwayPlay(true)} onGaveBack={why=>{ setGaveBack(why); setAwayPlay(false); leaveTable(); }} onBack={()=>{ setSeekAgain(null); setAwayPlay(false); leaveTable(); }}
        onSeated={s=>{ setSeekAgain(null); setAwayPlay(false); setFighting(null); setFoeStep(null); setLoHero(null); setSeating(null); setLocalTable(null); setTable(s); }}/>}
      {/* The card database has to be READY before a table is dealt: both
          phones build the same two decks out of it, so a client that is
          still fetching would deal from a half-built map. The lobby's
          DATA_VER check catches a version skew; this catches a client
          that has not finished loading its own. */}
      {table && table!=="find" && (db.status==="ready"
        ? (table.judge
          ? <JudgeRoom handle={table.handle} conns={table.conns} code={table.code} db={db}
              resume={table.resume} onExit={()=>setTable(null)}/>
          : <TableRoom table={table.table} host={table.host} code={table.code} db={db}
              onGiveUp={(sk, why)=>{ setSeekAgain({ranked: !!sk.ranked, since: sk.since||0, note: "The player matched with you did not make it to the table"+(why==="late" ? " in time" : "")+". You are looking for another match, and the clock carries on."}); setTable("find"); }}
              judged={table.judged || null} resume={table.resume} onExit={()=>setTable(null)}
              onAgain={rk=>{ setSeekAgain({ranked: !!rk}); setTable("find"); }}
              onRematch={(c, rk)=>{ setSeekAgain({ranked: !!rk, rematch: c}); setTable("find"); }}/>)
        : <div className="tblwrap">
            <div className="tblhead">Table {table.code}</div>
            <div className="tblstat live"><span className="tbldot"></span>Forging the card pool…</div>
            <button className="a" onClick={()=>setTable(null)}>Leave the table</button>
          </div>)}
      {/* THE MATCH SEED is stamped once, here, when the match begins — and
          then everything random in the match derives from it: the pregame
          throw, both opening shuffles, the d6, intimidate, the dummy's
          recycle. One seed per match is what makes a game replayable, and
          it is the value a networked room code will supply instead of the
          clock. It rides in `cfg`, which already flows Loadout → Pregame →
          Battle, so nothing new has to be plumbed. */}
      {/* THE ORDER IS THROW, THEN SIDEBOARD (v2.76) — CR, and what
          `engine/lobby.js` has ruled since it was written: you board
          knowing the matchup and knowing whether you are on the play. The
          solo flow ran Loadout → Pregame, which showed you the seating
          only after every choice that could use it. Reversing it is why
          `Loadout` now takes `onPlay` as a prop. */}
      {foeStep && !fighting && <FoePick h={foeStep} db={db} initial={foeStep.foe} noDummy={soloMode==="ai"}
        onBack={()=>setFoeStep(null)}
        onDone={foe=>{setLoHero({...foeStep, foe}); setFoeStep(null);}}/>}
      {loHero && !fighting && <Pregame h={loHero} seed={loHero.seed}
        onBack={()=>{ if(!dummyRun(loHero)) setFoeStep(loHero); setLoHero(null);}}
        onSeated={first=>{setSeating({h:loHero, first, seed:loHero.seed}); setLoHero(null);}}/>}
      {seating && !fighting && <Loadout h={seating.h} db={db} onPlay={seating.first===0}
        soloFoe={seating.h.foe || {k:null, level:"sharp"}}
        onFoe={()=>{setFoeStep(seating.h); setSeating(null);}}
        onBack={()=>{ if(dummyRun(seating.h)) setLoHero(seating.h); else setFoeStep(seating.h); setSeating(null);}}
        onStart={cfg=>{
          /* ---- ONE ENGINE, NO NETWORK (v2.79) -----------------------
             The same screen a networked table renders and the same
             reducer behind it; the only difference is that seat 1 is a
             policy in this phone rather than a person in another. The
             solo trainer is untouched and is still the default.

             SEAT 1 IS THE SAME PUNCHING BAG THE TRAINER FACES (v2.81) —
             a NULL hero key, which `buildMatch` reads as the dummy and
             deals the vanilla pile for. It used to require a chosen hero
             because the dealing lived inside `Battle` and there was no
             build to seat; now both boards face the same opponent, and
             the only thing that differs between them is which engine is
             driving. That is exactly what makes them comparable. */
          if(cfg.table){
            try {
              const m = DawnBuild.buildMatch({
                heroes: [seating.h.k, cfg.aiFoe || null],
                /* AN AI SEAT WEARS THE SELF-PLAY DEFAULT (v5.35). `{}` would
                   deal every printed piece — v2.41's eight-gear bug. */
                boards: [{gearIdx: cfg.gearIdx, cuts: cfg.cuts},
                         cfg.aiFoe ? DawnBuild.defaultBoard(HEROES.find(x=>x.k===cfg.aiFoe),
                                                          PARSED[cfg.aiFoe], db) : {}],
                first: seating.first, seed: String(seating.seed)
              }, {db, heroes: Object.fromEntries(HEROES.map(x=>[x.k,x])),
                  decks: Object.fromEntries(HEROES.map(x=>[x.k,PARSED[x.k]])),
                  vanilla: {deck: DUMMY_DECK, gear: DUMMY_GEAR, hp: 42,
                            int: DUMMY_INT, name: "The Dummy"}});
              setLocalTable({...m, sharp: !!cfg.sharp, g: DawnJudge.newMatch({builds:m.builds, names:m.names,
                heroKeys:m.heroKeys, first:m.first, seed:m.seed})});
              setSeating(null);
              return;
            } catch(e){
              /* FALL THROUGH TO THE TRAINER RATHER THAN DEAD-ENDING — but
                 SAY SO (v3.51). Silently seating the player at the OTHER
                 board is the "never dress a failure as a success" rule
                 (v2.51's clipboard lesson) in the one place where the two
                 boards are hardest to tell apart: the player taps "the new
                 engine", gets the trainer, and every difference they then
                 notice is attributed to the wrong thing. Not dead-ending
                 is still right; doing it quietly is not. */
              console.warn("[dawnblade] table build failed — seating you at the trainer instead:", e);
              try { window.__dawnTableFail = {when: Date.now(), why: String(e && e.message || e)}; } catch(_){}
              alert("The new engine could not deal this match, so you are at the trainer instead.\n\n"
                    + String(e && e.message || e));
            }
          }
          setFighting({h:seating.h, cfg:{...cfg, seed:seating.seed}, first:seating.first}); setSeating(null);}}/>}
      {localTable && <TableBoard match={localTable} mySeat={0} host={true} code="solo" db={db}
        table={null} netRef={{current:null}} netQ={{current:[]}} local={true}
        heroKey={localTable.heroKeys && localTable.heroKeys[0]} onRecord={record}
        onExit={()=>setLocalTable(null)}/>}
      {fighting && <Battle h={fighting.h} cfg={fighting.cfg} first={fighting.first} db={db} onExit={()=>setFighting(null)} onRecord={record}/>}
      {tab==="judge" && idle && !title && <Judge/>}
      {tab==="trophies" && idle && !title && <Trophies/>}
      {tab==="record" && idle && !title && <YourRecord/>}
      {idle && !title && <nav className="tabs">
        <button className={"tab"+(tab==="heroes"?" on":"")} onClick={()=>{setTab("heroes");}}>Heroes</button>
        <button className={"tab"+(tab==="judge"?" on":"")} onClick={()=>setTab("judge")}>Judge</button>
        <button className={"tab"+(tab==="trophies"?" on":"")} onClick={()=>setTab("trophies")}>Trophies</button>
        <button className={"tab"+(tab==="record"?" on":"")} data-testid="tab-record" onClick={()=>setTab("record")}>Record</button>
      </nav>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
setTimeout(function(){ if(!window.React || !document.querySelector(".shell")) document.getElementById("cdnfail").style.display="block"; },4000);
</script>
</body>
</html>
