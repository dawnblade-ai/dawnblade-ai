        <button onClick={()=>jump(youRef)}>You ▼</button>
      </div>

      <div className="tablewrap">
        {/* ---- SCREEN 1: opponent board (mirror: active rows nearest the chain) ---- */}
        <div className="vscreen" ref={oppRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>Opponent board</span><span>swipe → graveyard</span></div>
              <div className="midrow">
                <div className="armorgrid">
                  {["head","chest","arms","legs"].map(z=>{
                    const x = opp(g).gear.find(d=>slotOf(d).z===z);
                    return x ? (
                      <button key={x.uid} className={"g clip-sm"+(gearDef(x)===0?" used":"")} style={{gridArea:z}} onClick={()=>setZoom(x)}>
                        <CardFrame card={{...x, def:gearDef(x)}} className="sm"/>
                      </button>)
                      : <div key={z} className="aslot clip-sm" style={{gridArea:z}}><span className="wempty">{z}</span></div>;
                  })}
                </div>
                <div className="arscol"><div className="slot clip-sm">arsenal —</div><span className="zlbl">holds {opp(g).hand.length} · blocks from hand</span></div>
                <div className="rightcol">
                  <div className="deckback clip-sm"><span className="dcnt">{opp(g).deck.length}</span></div>
                  <div className="pitchbox clip-sm"><div className="zlbl">Hand</div><div className="zempty">{opp(g).hand.length} card{opp(g).hand.length===1?"":"s"}</div></div>
                </div>
              </div>
              <div className="heror">
                <div className="wslot clip-sm"><span className="wempty">weapon —</span></div>
                <div className="heromid clip-sm">
                  <div className="dhead" style={{width:36}}><span>✕</span><span>✕</span></div>
                  <span className="hname">The Dummy</span>
                  <b className="hlife2">{Math.max(0,opp(g).hp)}</b>
                  <span className="hlbl">{g.mode==="block"?"INCOMING "+g.incoming:"next swing "+([3,4,5][(g.turn-1)%3]+(g.turn>6?1:0))}</span>
                  {g.hitSeq>0 && <span className="dmgpop" key={g.hitSeq}>−{g.lastDmg}</span>}
                </div>
                <div className="wslot clip-sm"><span className="wempty">weapon —</span></div>
              </div>
              <div className="vfillsp"/>
              <div className="prow" style={{marginTop:8}}><span className="plbl">In play</span>
                {(opp(g).board||[]).map(b=>(
                  <button key={b.uid} className="b clip-sm" style={{width:52,flex:"none"}} onClick={()=>setZoom(b.card)}>
                    <CardFrame card={b.card} className="sm"/>
                  </button>))}
                {opp(g).marked && <span className="tk">marked</span>}
                {!(opp(g).board||[]).length && !opp(g).marked &&
                  <span className="zempty">nothing yet — tokens you hand the dummy land here</span>}
              </div>
            </div>
            <div className="hpane">
              <div className="paneflag"><span>Opponent graveyard / banish</span><span>swipe ← back</span></div>
              <div className="gyempty">The dummy discards nothing — wired and waiting for a real opponent.</div>
            </div>
          </div>
        </div>

        {/* ---- SCREEN 2: chain command center ---- */}
        <div className="vscreen" ref={chainRef}>
          <div className="hscroll" ref={midRef}>
            {/* PANE 1 — LOG: scoreboard + Claude's call + live feed */}
            <div className="hpane logpane">
              <div className="paneflag">
                <span>log & advisor</span>
                {/* Bug reports from the phone, where the bugs actually show up.
                    Captures the whole board so the note can just be "this
                    looked wrong" — see judgeReport(). */}
                <button className="judgebtn" onClick={()=>setBug({note:"", saved:false})}>
                  JUDGE!!{judgeN>0?` ⚠${judgeN}`:""}
                </button>
                <span>play →</span>
              </div>
              <div className="scorebar clip-sm">
                <span className="sside"><span className="hpme">{you(g).hp}</span> you · R<b>{you(g).res}</b> A<b>{you(g).ap}</b></span>
                <span className="sside r">dummy <span className="hpopp">{Math.max(0,opp(g).hp)}</span>{opp(g).frost>0?` · ❄${opp(g).frost}`:""}</span>
              </div>
              <div style={{marginTop:6}}><Ticker feed={g.feed}/></div>
              <Advisor g={g} ctx={{runeDmg:built.runeDmg, hpow:built.HPOW, boostOn:g.boostOn, dBlk:opp(g).gear.filter(x=>gearDef(x)>0).length + opp(g).hand.filter(c=>(c.def||0)>0).length, dDef:gearDef(opp(g).gear.find(x=>gearDef(x)>0)||{})||1}} read={built.read}/>
              <div className="gamelog" style={{marginTop:8}}>{[...g.feed].reverse().map((l,i)=><div key={i} className="gl">{l}</div>)}</div>
            </div>
            {/* PANE 2 — PLAY: dummy hand · stack|card|defend · your hand+extras */}
            <div className="hpane playpane">
              <div className="dhand"><span className="hlbl">Foe</span>{[0,1,2,3].map(i=><div key={i} className="dcardph"/>)}</div>
              <div className="playmid">
                <div className="sidecol stack">
                  <div className="scol-lbl">Stack</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack" && g.pend) ? [g.pend.card] : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
                <div className="centerslot">
                  {featured
                    ? (featured.foe
                        ? <div className="featfoe"><span className="fx2">✕✕</span><b>{featured.dmg}</b><span>Dummy</span></div>
                        : <div className="featured"><CardFrame card={featured.card}/></div>)
                    : <div className="featempty">Most recently played lands here</div>}
                </div>
                <div className="sidecol defend">
                  <div className="scol-lbl">Defend</div>
                  <div className="scol-cards">
                    {(()=>{ const cs = (g.mode==="stack") ? g.stack.filter(l=>l.k==="def").map(l=>l.gi!=null?opp(g).gear[l.gi]:opp(g).hand.find(c=>c.uid===l.uid)).filter(Boolean) : (g.mode==="block") ? [...you(g).blockH.map(uid=>you(g).hand.find(c=>c.uid===uid)), ...you(g).blockG.map(gi=>you(g).gear[gi])].filter(Boolean) : [];
                      return cs.length ? cs.map((c,i)=><div key={i} className="stackcard"><CardImg card={c}/></div>) : <div className="dash">—</div>; })()}
                  </div>
                </div>
              </div>
              {g.mode==="pay" && (()=>{const sel=you(g).paySel.reduce((a,i)=>a+(you(g).hand[i].pitch||0),0); const need=Math.max(0,effCost(g.pending.card, you(g))-you(g).res-sel); return <div className="statusline">Paying <b>{g.pending.card.name}</b> — pitch below · {need>0?<span>need <b>{need}</b> more</span>:<span>covered ✓</span>}<button onClick={cancelPay}>✕ cancel</button></div>;})()}
              {g.mode==="block" && <div className="statusline">{g.bphase==="defend" ? <span>Tap hand &amp; equipment to defend — incoming <b>{g.incoming}</b></span> : <span>Reaction step — instants from floating <b>{you(g).res}</b></span>}</div>}
              {g.mode==="stack" && <div className="statusline">Priority — react from floating <b>{you(g).res}</b> or pass</div>}
              {g.mode==="arsenal" && <div className="statusline">Tap a card below for <b>arsenal</b><button onClick={skipArsenal}>skip</button></div>}
              {g.mode==="boostpick" && <div className="statusline">Boost <b>{g.pending.card.name}</b>? Banish the top card of your deck — a Mechanologist card grants go again.</div>}
              {g.mode==="defpay" && (g.defPayQueue||[]).length>0 && <div className="statusline">
                <b>{g.defPayQueue[0].name}</b> is defending — pay <b>{g.defPayQueue[0].cost}</b> for +{g.defPayQueue[0].ops.filter(o=>o[0]==="defBuff").reduce((a,o)=>a+o[1],0)}{"{d}"}? You have {you(g).res} floating.
                {g.defPayQueue.length>1 && <span> ({g.defPayQueue.length-1} more waiting.)</span>}
              </div>}
              {(()=>{ /* v2.07: the engine tracks all of this; the board never showed it */
                const pips = [];
                if(you(g).amp>0)       pips.push(["amp "+you(g).amp, "on"]);
                if(you(g).buffNext>0)  pips.push(["next atk +"+you(g).buffNext, "on"]);
                if(you(g).gaNext)      pips.push(["next atk go again", "on"]);
                if(you(g).ward>0)      pips.push(["ward "+you(g).ward, "on"]);
                if(you(g).awd>0)       pips.push(["arcane ward "+you(g).awd, "on"]);
                if(runeCount(you(g))>0) pips.push(["runechant ×"+runeCount(you(g)), "on"]);
                if(opp(g).marked)     pips.push(["dummy marked", "on"]);
                if(you(g).rot>0)       pips.push(["bloodrot "+you(g).rot, "warn"]);
                if(you(g).fra>0)       pips.push(["frailty "+you(g).fra, "warn"]);
                const drac = g.chain.filter(l=>l.drac && l.kind==="atk").length;
                if(drac>0)        pips.push(["draconic links "+drac, ""]);
                if((you(g).hist.arc||0)>0)  pips.push(["arcane dealt", ""]);
                if((you(g).hist.aura||0)>0) pips.push(["auras "+you(g).hist.aura, ""]);
                const links = g.chain.filter(l=>l.kind==="atk").length;
                if(links)              pips.push(["chain link "+links, ""]);
                return pips.length ? <div className="rail">{pips.map(([t,cl],i)=>
                  <span key={i} className={"rp"+(cl?" "+cl:"")}>{t}</span>)}</div> : null;
              })()}
              <div className="phand"><span className="hlbl">Hand</span>
                {you(g).hand.map(handCell)}
                {playables.map((p,i)=>(
                  <button key={p.zone+"-"+(p.card.uid||p.card.name)+"-"+i}
                    className={"hc clip-sm"+(p.sel?" sel":"")+(peek&&peek.uid===p.card.uid?" peek":"")}
                    onClick={tapTwice(p.card, p.verb||"tap again to play", p.fn)}>
                    {p.sel && <span className="defsel">⛨ DEF</span>}
                    <CardFrame card={p.card} zone={p.zone}/>
                  </button>))}
              </div>
            </div>
            {/* PANE 3 — CHAIN: the links */}
            <div className="hpane">
              <div className="paneflag"><span>← play</span><span>the chain</span></div>
              {g.chainOpen && <button className="chainclose" onClick={closeChain}>⛓ Close chain — bank {g.chain.length} link{g.chain.length!==1?"s":""}</button>}
              {prevLinks.length===0 && g.chainHist.length===0 && <p className="note">No links yet — play an attack to start the chain.</p>}
              {prevLinks.length>0 && <div className="histturn"><div className="htlabel">This turn</div>
                <div className="chain">{prevLinks.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>}
              {g.chainHist.map((t,i)=>(
                <div key={i} className="histturn"><div className="htlabel">Turn {t.turn}</div>
                  <div className="chain">{t.links.map((l,j)=><ChainLink key={j} l={l}/>)}</div></div>))}
            </div>
          </div>
        </div>

        {/* ---- SCREEN 3: your board (the sketch) ---- */}
        <div className="vscreen" ref={youRef}>
          <div className="hscroll">
            <div className="hpane vfill">
              <div className="paneflag"><span>Your board</span><span>swipe → graveyard</span></div>
              {g.mode!=="act" && <div className="modehint">Action needed — flick up to the chain screen</div>}
              <div className="prow"><span className="plbl">In play</span>
                {toks.map((t,i)=><span key={"t"+i} className={"tk"+(t[1]?" "+t[1]:"")}>{t[0]}</span>)}
                {you(g).board.map((b,i)=>(
                  <button key={b.uid} className={"b clip-sm"+(b.spent?" spent":"")} style={{width:52,flex:"none"}}
                    onClick={()=>{
                      if(g.inspect) return setZoom(b.card);
                      if(b.kind==="ally") return allySwing(i);
                      const bp = boardPow(b);
                      if(bp) return tapTwice(bp, "activate", ()=>tryPlay(bp,"board",i));
                      return setZoom(b.card);
                    }}>
                    <span className={"tapwrap"+((b.spent&&/\btap\b|\{t\}/i.test(b.card.tx||""))?" tapped":"")}><CardFrame card={b.card} className="sm" noType={b.kind==="ally"&&b.card.power>0}/></span>
                    {b.kind==="ally" && b.card.power>0 && <span className="sw">{b.spent?"spent":"⚔ "+b.card.power}</span>}
                  </button>))}
                {toks.length===0 && you(g).board.length===0 && <span className="zempty">allies, items and tokens live here</span>}
              </div>
              <div className="heror">
                <div className={"wslot clip-sm"+(handGear[0]?" filled":"")}>
                  {handGear[0] ? gearBtn(handGear[0].gr, handGear[0].i) : <span className="wempty">weapon 1</span>}
                </div>
                <div className="heromid clip-sm">
                  <button className="hport2" onClick={()=>setZoom(built.HZOOM)}><span className={"tapwrap"+((you(g).weaponUsed["hpow"]&&/\btap\b|\{t\}/i.test(built.heroRec.tx||""))?" tapped":"")}><HeroArt h={h} db={db}/></span></button>
                  <span className="hname">{h.n.split(",")[0]}</span>
                  <b className="hlife2">{you(g).hp}</b>
                  <span className="hlbl">life</span>
                  {built.heroPow && <button className="hact clip-sm" style={{padding:"5px 8px",fontSize:11}} disabled={!!you(g).weaponUsed["hpow"]||g.mode!=="act"||!!g.over}
                    onClick={()=>tryPlay(built.HPOW,"hero",0)}>{you(g).weaponUsed["hpow"]?"USED":"⚡ USE"}</button>}
                </div>
                <div className={"wslot clip-sm"+(handGear[1]?" filled":"")}>
                  {handGear[1] ? gearBtn(handGear[1].gr, handGear[1].i)
                    : <span className="wempty">{is2H ? "2H occupies both hands" : "weapon 2 / off-hand"}</span>}
                </div>
              </div>
              <div className="midrow">
                <div className="armorgrid">
                  {["head","chest","arms","legs"].map(z=>{
                    const it = armor.find(x=>slotOf(x.gr).z===z);
                    return it ? gearBtn(it.gr,it.i,"",{gridArea:z})
                      : <div key={z} className="aslot clip-sm" style={{gridArea:z}}><span className="wempty">{z}</span></div>;
                  })}
                  {armor.filter(x=>!["head","chest","arms","legs"].includes(slotOf(x.gr).z)).map(x=>gearBtn(x.gr,x.i))}
                </div>
                <div className="arscol">
                  <div className="slot clip-sm" style={{width:"100%"}}>{you(g).arsenal
                    ? <button style={{padding:0,width:"100%"}} onClick={()=> g.mode==="block" ? (g.bphase==="react"&&playRxA()) : g.inspect?setZoom(you(g).arsenal):tryPlay(you(g).arsenal,"arsenal",0)}><CardFrame card={you(g).arsenal} className="sm"/></button>
                    : "arsenal"}</div>
                  <span className="zlbl">Arsenal</span>
                </div>
                <div className="rightcol">
                  <div className="deckback clip-sm"><span className="dcnt">{you(g).deck.length}</span></div>
                  <div className="pitchbox clip-sm">
                    <div className="zlbl">Pitch · {you(g).pitch.length}</div>
                    {you(g).pitch.length===0 ? <div className="zempty">empty</div> :
                      <div className="pitchlist">{[...you(g).pitch].reverse().map((c,i)=>(
                        <div key={i} className="pc"><i style={{background:{1:"var(--r)",2:"var(--y)",3:"var(--b)"}[c.pitch]||"var(--line)"}}/>{c.name}</div>))}
                      </div>}
                  </div>
                </div>
              </div>
              <div className="vfillsp"/>
              <div className="mystat" style={{marginTop:8}}>
                <span className="pill">WASTED <b>{you(g).wasted}</b></span>
                <span className="pill">TURN <b>{g.turn}</b></span>
                {built.hasBoost && <button className={"pill"+(g.boostOn?"":" hp")} onClick={()=>setG(s=>({...s,boostOn:!s.boostOn}))}>BOOST {g.boostOn?"✓":"✗"}</button>}
                <button className={"pill"+(g.inspect?" hp":"")} onClick={()=>setG(s=>({...s,inspect:!s.inspect}))}>ℹ {g.inspect?"inspecting":"inspect"}</button>
              </div>
            </div>
            <div className="hpane">
              <div className="paneflag"><span>Your graveyard / banish</span><span>swipe ← back</span></div>
              {you(g).grave.length===0
                ? <div className="gyempty">Empty — the first card you play or block with lands here.</div>
                : <div className="gyrow">{you(g).grave.map((c,i)=><div key={i} className="gyc"><CardFrame card={c} className="sm"/></div>)}</div>}
              {you(g).banish.length>0 && <><div className="zone" style={{marginTop:10}}>Banished · {you(g).banish.length}</div>
                <div className="gyrow">{you(g).banish.map((c,i)=><div key={i} className="gyc"><CardFrame card={c} className="sm"/></div>)}</div></>}
              {you(g).soul.length>0 && <><div className="zone" style={{marginTop:10}}>Soul · {you(g).soul.length} (face up)</div>
                <div className="gyrow">{you(g).soul.map((c,i)=><div key={i} className="gyc"><CardFrame card={c} className="sm"/></div>)}</div></>}
            </div>
          </div>
        </div>
      </div>

      <div className="actbar">
        {g.mode==="pay" ? <>
          <button className="a" onClick={cancelPay}>Cancel</button>
          <button className="a pay" onClick={confirmPay}>Pitch & play</button>
        </> : g.mode==="stack" ? (
          <button className="a go" onClick={resolveStack}>Pass — resolve</button>
        ) : g.mode==="block" ? ( g.bphase==="defend" ? <>
          <button className="a" onClick={takeIt}>Take it</button>
          <button className="a go" onClick={moveToReact}>Defend → reactions</button>
        </> : (
          <button className="a go" onClick={takeIt}>Resolve damage</button>
        )) : g.mode==="boostpick" ? (<>
          <button className="a go" onClick={()=>confirmBoost(true)}>⚡ Boost</button>
          <button className="a" onClick={()=>confirmBoost(false)}>No boost</button>
        </>) : g.mode==="defpay" ? (<>
          <button className="a go" disabled={you(g).res < ((g.defPayQueue||[])[0]?.cost||0)} onClick={()=>confirmDefPay(true)}>
            Pay {(g.defPayQueue||[])[0]?.cost||0}
          </button>
          <button className="a" onClick={()=>confirmDefPay(false)}>Decline</button>
        </>) : (<>
          <button className="a go" disabled={g.mode!=="act"||!!g.over} onClick={endTurn}>End turn</button>
        </>)}
      </div>
      {g.over && (g.over.win
        ? <WinPanel score={g.over.score} onExit={onExit}/>
        : <div className="lose clip"><h3 className="disp">Down — but wiser</h3><p style={{fontSize:13}}>Fewer wasted pitches and tighter blocks next run.</p>
            <button className="bigbtn alt" onClick={onExit}>Back to heroes</button></div>)}
      <CardModal card={zoom} onClose={()=>setZoom(null)}/>
      {/* JUDGE!! — write down what looked wrong while it is still on screen.
          The board travels with the note, so the note can be one line. */}
      {bug && <div className="bugwrap" onClick={e=>{ if(e.target===e.currentTarget) setBug(null); }}>
        <div className="bugsheet clip">
          <div className="bugh">
            <span className="bugt">Judge!!</span>
            <span className="bugmeta">v{window.APP_VER} · {h.n} · turn {g.turn} · {g.mode}
              {judgeN>0 ? ` · ⚠ ${judgeN} invariant${judgeN>1?"s":""}` : " · state clean"}</span>
          </div>
          <p className="bughint">What looked wrong? The whole board — zones, counters, chain,
            the feed and any invariant violations — is captured with it, so one line is plenty.</p>
          <textarea className="bugta" autoFocus placeholder="e.g. Look Tuff attacked for 4, should have been 3 — I never got asked to pay"
            value={bug.note} onChange={e=>setBug({...bug, note:e.target.value, saved:false})}/>
          {bug.saved && <div className="bugok">{bug.saved === "copied" ? "Copied to clipboard."
            : bug.saved === "downloaded" ? "Saved to your downloads." : bug.saved}</div>}
          <div className="bugrow">
            <button className="bigbtn alt" onClick={()=>setBug(null)}>Close</button>
            <button className="bigbtn alt" onClick={judgeCopy}>Copy</button>
            <button className="bigbtn" onClick={judgeDownload}>Save report</button>
          </div>
        </div>
      </div>}
      {/* the peeked card, big enough to actually read, docked above the
          action bar so the hand rail stays visible underneath it */}
      {(()=>{
        const pc = peek && peekables().find(c=>c.uid===peek.uid);
        if(!pc || g.over || g.prompt) return null;
        return <div className="peekwrap" onClick={()=>setPeek(null)}>
          <div className="peekcard"><CardFrame card={pc}/></div>
          <div className="peekbar">
            <span className="pknm">{pc.name}</span>
            <span className="pkhint">{peek.verb}</span>
          </div>
        </div>;
      })()}
      {g.prompt && !g.over && (()=>{
        const p = g.prompt;
        /* One sheet, every variant. The side badge is shown whenever the
           prompt is NOT addressed to you — in multiplayer that is the
           difference between "your call" and "waiting on them". */
        const ready = promptReady(p);
        return <div className="psheet">
          <div className="ph"><span className="pt">{p.title}</span>
            <span className="psrc">{p.src}</span>
            {p.side !== 0 && <span className="pside">opponent's call</span>}</div>
          <div className="phint">{p.hint}</div>

          {(p.tag==="opt" || p.tag==="pick" || p.tag==="reveal") && !!p.cards.length &&
            <div className="prow2">
              {p.cards.map((c,i)=>{
                const down = p.tag==="opt" && p.down.includes(i);
                const sel  = p.tag==="pick" && p.sel.includes(i);
                const topOrder = p.tag==="opt"
                  ? p.cards.filter((_,j)=>!p.down.includes(j)).indexOf(c)+1 : 0;
                const tap = p.tag==="reveal" ? undefined : ()=>promptToggle(i);
                return <button key={c.uid||i}
                  className={"pcard"+(down?" down":"")+(sel?" sel":"")+(p.tag==="reveal"?" flat":"")}
                  onClick={tap}>
                  <CardFrame card={c} className="sm"/>
                  {p.tag==="opt" && <span className="ptag">{down ? "bottom" : "top "+topOrder}</span>}
                  {p.tag==="pick" && sel && <span className="ptag">✓ chosen</span>}
                </button>;
              })}
            </div>}

          {p.tag==="modal" && <div className="pmodal">
            {p.options.map((o,i)=>(
              <button key={i} className={"popt"+(p.choice===i?" on":"")} onClick={()=>promptPick(i)}>
                {o.label || String(o)}
              </button>
            ))}
          </div>}

          {p.tag==="pay" && <div className="pmodal">
            <button className={"popt"+(p.choice==="pay"?" on":"")}
              disabled={p.avail < p.cost} onClick={()=>promptPick("pay")}>
              Pay {p.cost}
              <span className="sub">{p.avail < p.cost ? `only ${p.avail} floating` : `${p.avail} floating`}</span>
            </button>
            <button className={"popt"+(p.choice==="decline"?" on":"")} onClick={()=>promptPick("decline")}>
              Decline<span className="sub">the rider does not resolve</span>
            </button>
          </div>}

          <div className="pact">
            {p.tag==="pick" && p.optional &&

/* ---------- LOADOUT — official zones: 4 armor slots, 2 hands ---------- */
const ARMOR_Z = ["head","chest","arms","legs"];
const HAND_Z = ["1h","2h","off","qvr"];
function applyPick(list, sel, i){
  const item = idx => list.find(x=>x.i===idx);
  if(sel.includes(i)){
    let out = sel.filter(x=>x!==i);
    if(item(i).s.z==="2h") out = out.filter(x=>item(x).s.z!=="qvr");
    return out;
  }
  const s = item(i).s;
  let out = sel.slice();
  if(ARMOR_Z.includes(s.z) || s.z==="misc"){
    if(ARMOR_Z.includes(s.z)) out = out.filter(x=>item(x).s.z!==s.z);
    const armorN = out.filter(x=>ARMOR_Z.includes(item(x).s.z)||item(x).s.z==="misc").length;
    if(armorN>=4) return sel;
    return [...out,i];
  }
  if(s.z==="qvr"){
    out = out.filter(x=>item(x).s.z!=="qvr");
    if(!out.some(x=>item(x).s.z==="2h")) return sel;
    return [...out,i];
  }
  if(s.z==="2h"){
    out = out.filter(x=>!["1h","off"].includes(item(x).s.z));
    return [...out,i];
  }
  out = out.filter(x=>item(x).s.z!=="2h" && item(x).s.z!=="qvr");
  if(s.z==="off") out = out.filter(x=>item(x).s.z!=="off");
  let hands = out.filter(x=>["1h","off"].includes(item(x).s.z));
  hands.sort((a,b)=>(item(a).s.z==="off"?0:1)-(item(b).s.z==="off"?0:1));
  while(hands.reduce((a,x)=>a+item(x).s.h,0) + s.h > 2){ out = out.filter(x=>x!==hands[0]); hands = hands.slice(1); }
  return [...out,i];
}
function defaultPicks(list){
  let sel = [];
  ARMOR_Z.forEach(z=>{
    const best = list.filter(x=>x.s.z===z).sort((a,b)=>(b.c.def||0)-(a.c.def||0))[0];
    if(best) sel = applyPick(list, sel, best.i);
  });
  const twoH = list.filter(x=>x.s.z==="2h").sort((a,b)=>(b.c.power||0)-(a.c.power||0))[0];
  if(twoH && twoH.c.power!=null){
    sel = applyPick(list, sel, twoH.i);
    const q = list.find(x=>x.s.z==="qvr"); if(q) sel = applyPick(list, sel, q.i);
  } else {
    list.filter(x=>x.s.z==="1h").sort((a,b)=>(b.c.power||0)-(a.c.power||0)).slice(0,2).forEach(x=>{ sel = applyPick(list, sel, x.i); });
    const off = list.filter(x=>x.s.z==="off").sort((a,b)=>(b.c.def||0)-(a.c.def||0))[0];
    if(off) sel = applyPick(list, sel, off.i);
  }
  return sel;
}

/* ============================================================
   PREGAME — the throw for seating.

   Sits between the loadout and the first draw, because seating is
   decided before a card is drawn. The winner CHOOSES; they are not
   simply handed the first turn. Player is side 0, opponent side 1 —
   the same indices the sides[] migration uses, so this screen already
   speaks the two-player vocabulary the rest of the engine is moving to.
   ============================================================ */
const RPS_GLYPH = {rock:"✊", paper:"✋", scissors:"✌"};
const RPS_LOSS = {rock:"Paper smothers it.", paper:"Scissors cut through.", scissors:"Rock shatters them."};

function Pregame({h, seed, onSeated, onBack}){
  const [rounds,setRounds] = uS([]);
  const [live,setLive] = uS(null);
  const [phase,setPhase] = uS("throw");
  const [log,setLog] = uS(["Two hands over the table. Winner calls the seating."]);
  const timer = uR(null);
  const say = m => setLog(l=>[...l,m].slice(-7));
  uE(()=>()=>{ if(timer.current) clearTimeout(timer.current); },[]);
  /* The throw comes off the MATCH seed, on its own derived sub-stream.
     Derived rather than shared so the opponent's hand does not correlate
     with the first card of anyone's deck — same match seed, independent
     sequences. A ref, not state: advancing it must not trigger a render,
     and ties replay by drawing again rather than by re-rendering. */
  const rps = uR(rngMake(rngSeedFrom(String(seed==null?0:seed) + ":rps")));

  const series = rpsSeries(rounds);
  const winner = series.winner;

  const throwIt = mine => {
    if(phase!=="throw") return;
    const _t = rngNext(rps.current); rps.current = _t.rng;
    const theirs = rpsThrow(()=>_t.v);
    setLive({mine, theirs:null});
    setPhase("shaking");
    timer.current = setTimeout(()=>{
      const v = rpsResolve(mine, theirs);
      const next = [...rounds, [mine, theirs]];
      setLive({mine, theirs});
      setRounds(next);
      if(v===0){
        say(`Both ${mine}. Dead level — throw again.`);
        setPhase("throw");
      } else if(v===1){
        say(`${RPS_GLYPH[mine]} beats ${RPS_GLYPH[theirs]}. ${RPS_LOSS[theirs]} The call is yours.`);
        setPhase("decide");
      } else {
        say(`${RPS_GLYPH[theirs]} beats ${RPS_GLYPH[mine]}. ${RPS_LOSS[mine]} The dummy calls it.`);
        setPhase("decide");
      }
    }, 620);
  };

  /* The dummy's call is a rule, not a coin: a sparring partner that wins
     the throw always elects to swing first. Stated plainly so nobody has
     to wonder whether the trainer is cheating. */
  uE(()=>{
    if(phase!=="decide" || winner!==1) return;
    timer.current = setTimeout(()=>{
      say("The dummy takes the first turn — it always does. Brace up.");
      setPhase("done");
      timer.current = setTimeout(()=>onSeated(1), 900);
    }, 500);
  },[phase,winner]);

  const decide = choice => {
    const first = rpsSeat(0, choice);
    say(first===0 ? "You take the first turn. Initiative is yours." : "You hand it the first turn — you keep the extra card.");
    setPhase("done");
    timer.current = setTimeout(()=>onSeated(first), 800);
  };

  const shaking = phase==="shaking";
  return (
    <div className="rps">
      <div className="rtitle">The Throw</div>
      <p className="rsub">Winner decides who takes the first turn.<br/>Going first buys initiative; going second keeps a card.</p>
      <div className="rtable">
        <div className={"rseat"+(winner===0?" win":"")}>
          <span className="rwho">You · {h.n}</span>
          <span className="rglyph">{shaking ? "✊" : live ? RPS_GLYPH[live.mine] : "·"}</span>
          <span className="rname">{shaking ? "shaking" : live ? live.mine : "ready"}</span>
          <span className="rscore">{series.a}</span>
        </div>
        <span className="rvs">VS</span>
        <div className={"rseat"+(winner===1?" win":"")}>
          <span className="rwho">The Dummy</span>
          <span className="rglyph">{shaking || !live || live.theirs===null ? "✊" : RPS_GLYPH[live.theirs]}</span>
          <span className="rname">{shaking || !live || live.theirs===null ? "shaking" : live.theirs}</span>
          <span className="rscore">{series.b}</span>
        </div>
      </div>
      <div className="rcall">
        {phase==="throw" && <span>{rounds.length ? <span>Tied <b>{series.ties}</b> — throw again.</span> : "Pick your throw."}</span>}
        {shaking && <span>Rock… paper… scissors…</span>}
        {phase==="decide" && winner===0 && <span>You won the throw. <b>Your call.</b></span>}
        {phase==="decide" && winner===1 && <span>The dummy won the throw. It is deciding…</span>}
        {phase==="done" && <span>Seated. Stepping to the table…</span>}
      </div>
      {(phase==="throw"||shaking) && <div className="rthrows">
        {RPS_THROWS.map(t=>(
          <button key={t} disabled={shaking} onClick={()=>throwIt(t)}>
            <span className="g">{RPS_GLYPH[t]}</span><span className="l">{t}</span>
          </button>
        ))}
      </div>}
      {phase==="decide" && winner===0 && <div className="rseatpick">
        <button className="go" onClick={()=>decide("first")}>I go first<span className="sub">take the initiative</span></button>
        <button onClick={()=>decide("second")}>It goes first<span className="sub">keep the extra card</span></button>
      </div>}
      <div className="rlog">{log.map((m,i)=><div key={i}>{m}</div>)}</div>
      {phase!=="done" && <button className="rback" onClick={onBack}>← back to loadout</button>}
    </div>
  );
}

/* ============================================================
   THE TABLE — find an opponent, sit down, play across two phones.

   Roadmap Phase B step 7, wired through to a screen. The rules layer
   underneath is engine/actions.js's BLANK action set, not the card pool:
   `foeSwing` still fabricates the dummy's swing as [3,4,5][(turn-1)%3],
   so seat 1 has no action phase and two hero decks cannot yet cross the
   wire. That is Phase A step 4 plus the judge.js reducer extraction, and
   it is rules work rather than network work — see CLAUDE.md. What this
   screen proves is the whole transport: two phones, a table code, real
   priority handoffs, a real combat chain, and a state hash that agrees.

   Everything below reaches the engine module-qualified (DawnRoom.*,
   DawnNet.*, DawnActions.*) — none of it is bridged to a bare name,
   because `open`, `reduce`, `legal` and `hash` are far too generic to
   own as globals. test/sync.test.js pins that.
   ============================================================ */
function TableScreen({onBack, onSeated}){
  const [mode,setMode] = uS(null);           /* null | "host" | "join" */
  const [code,setCode] = uS("");
  const [stat,setStat] = uS(null);
  const [err,setErr]   = uS(null);
  const [busy,setBusy] = uS(false);
  const live = uR(true);
  uE(()=>()=>{ live.current = false; },[]);

  const PHRASE = {
    loading:"Fetching the transport…", connecting:"Reaching the relay…",
    waiting:"Table open — waiting for your opponent…",
    dialling:"Knocking on the table…", connected:"Seated."
  };

  const sit = (host, c) => {
    setErr(null); setBusy(true); setStat("loading");
    DawnRoom.open({
      code:c, host,
      onStatus:s=>{ if(live.current) setStat(s); },
      onClose:()=>{ if(live.current){ setErr("The other phone left the table."); setBusy(false); } }
    }).then(table=>{
      if(!live.current){ table.close(); return; }
      onSeated({table, host, code:table.code});
    }).catch(e=>{
      if(!live.current) return;
      setErr((e && e.message) || String(e)); setStat(null); setBusy(false);
    });
  };

  const openTable = () => { const c = DawnRoom.makeCode(); setCode(c); setMode("host"); sit(true, c); };
  const joinTable = () => {
    if(!DawnRoom.isValid(code)) return setErr("A table code is "+DawnRoom.CODE_LEN+" characters.");
    sit(false, code);
  };

  return (
    <div className="tblwrap">
      <div className="tblhead">Find an opponent</div>

      {!mode && <>
        <div className="tblcard">
          <p className="note" style={{marginTop:0}}>
            One of you opens a table and reads out the code; the other types it in.
            No account, no server — the two phones talk directly once they have found
            each other.
          </p>
        </div>
        <div className="tblrow">
          <button className="bigbtn" onClick={openTable}>Open a table</button>
          <button className="bigbtn alt" onClick={()=>setMode("join")}>Join a table</button>
        </div>
        <p className="mnote">
          Table play runs the <strong>drill decks</strong> — blank cards, real Flesh and
          Blood turn structure. Hero decks need seat 1's action phase before they can
          cross the wire.
        </p>
      </>}

      {mode==="host" && <>
        <div className="tblcard">
          <div className="tblstat">Your table number</div>
          <div className="tblcode">{code}</div>
        </div>
        <div className={"tblstat"+(stat==="waiting"?" live":"")}>
          {stat==="waiting" && <span className="tbldot"></span>}
          {PHRASE[stat]||"…"}
        </div>
      </>}

      {mode==="join" && <>
        <div className="tblcard">
          <div className="tblstat">Table number</div>
          <input className="tblin mono" value={code} maxLength={8} inputMode="text"
            autoCapitalize="characters" autoCorrect="off" spellCheck={false}
            placeholder="····"
            onChange={e=>{ setErr(null); setCode(DawnRoom.normalize(e.target.value)); }}/>
        </div>
        <button className="bigbtn" disabled={busy||!DawnRoom.isValid(code)} onClick={joinTable}>
          {busy ? (PHRASE[stat]||"…") : "Sit down"}
        </button>
      </>}

      {err && <div className="tblerr">{err}</div>}
      <button className="a" onClick={onBack}>Back</button>
    </div>
  );
}

/* The networked board. Deliberately plain: this is the transport's
   proving ground, not the trainer's UI. Every button is gated by
   DawnActions.legal, which is the same predicate the sequencer applies
   on the other phone — so a button that is live here is an action that
   will be accepted there. */
function TableMatch({table, host, code, onExit}){
  /* `mySeat`, NOT `seat`. engine/priority.js already exports a `seat`
     helper, and its meaning is "seat a game with this first player" —
     a local `seat` meaning "which chair is this client in" is the
     same-name-different-meaning trap test/sync.test.js pins for the
     engine, and the one that made `tapTwice`'s `act` parameter shadow
     the actor helper in v2.25. It is also the roadmap's own vocabulary:
     perspective is what THIS CLIENT renders. */
  const mySeat = host ? 0 : 1;
  const [g,setG]     = uS(null);
  const [sel,setSel] = uS(null);
  const [note,setNote] = uS(null);
  const [link,setLink] = uS("connected");
  const sess = uR(null);

  uE(()=>{
    const s = DawnNet.createSession({
      seat: mySeat, host,
      reduce: DawnActions.reduce,
      legal:  DawnActions.legal,
      build:  DATA_VER,
      /* THE TABLE CODE IS THE SEED. rng.js: both peers derive the same
         seed from the same room code without exchanging it, so the game
         is reproducible from the code alone. */
      state:  host ? DawnActions.newMatch({seed: code, first: 0}) : null,
      send:   m => table.send(m),
      onState:st => { setG(st); setSel(null); },
      onEvent:e => {
        if(e.t==="refused")        setNote(e.reason);
        else if(e.t==="desync")    setLink("repairing");
        else if(e.t==="snapshot-applied" || e.t==="catchup-applied") setLink("connected");
        else if(e.t==="refused-by-host") setNote("Refused: "+e.reason);
      }
    });
    sess.current = s;
    table.listen(m => s.receive(m));
    if(!host) s.join(); else setG(s.state());
    return () => { try { table.close(); } catch(_){} };
  },[]);

  if(!g) return (
    <div className="tblwrap">
      <div className="tblhead">Table {code}</div>
      <div className="tblstat live"><span className="tbldot"></span>Dealing…</div>
      <button className="a" onClick={onExit}>Leave the table</button>
    </div>
  );

  const me = g.sides[mySeat], them = g.sides[1-mySeat];
  const mine  = a => DawnActions.legal(g, a, mySeat) === null;
  const fire  = a => { const why = sess.current.submit(a); setNote(why||null); };
  const myPri = g.priority === mySeat;
  const over  = g.over;

  return (
    <div className="mboard">
      <div className="mseat">
        <span className="who">Opponent</span>
        <span className="zn">hand {them.hand.length} · deck {them.deck.length} · gy {them.grave.length}</span>
        <span className="hp">{them.hp}</span>
      </div>

      <div className="mstep">
        <span>Turn {g.turn} · table {code}{link!=="connected" ? " · resyncing" : ""}</span>
        <span className="sv">{g.phase} / {g.step}</span>
      </div>

      <div className={"mturn "+(over ? "theirs" : myPri ? "mine" : "theirs")}>
        {over ? (over.winner===mySeat ? "You win" : "You lose")
              : myPri ? "Your call" : "Waiting on them"}
        {!over && g.chainOpen && g.chain.length ? " · link "+g.chain.length+" ("+g.chain[g.chain.length-1].power+" power)" : ""}
      </div>

      <div className="mfeed">
        {(g.feed||[]).slice(-6).map((f,i)=><div key={i}>{f}</div>)}
      </div>

      <div className="mseat me">
        <span className="who">You (seat {mySeat})</span>
        <span className="zn">res {me.res} · ap {me.ap} · deck {me.deck.length} · gy {me.grave.length}</span>
        <span className="hp">{me.hp}</span>
      </div>

      <div className="mhand">
        {me.hand.map(c=>{
          const blocking = (me.blockH||[]).indexOf(c.uid) >= 0;
          return (
            <button key={c.uid}
              className={"mcard"+(sel===c.uid?" on":"")+(blocking?" blk":"")}
              onClick={()=>setSel(sel===c.uid?null:c.uid)}>
              <span className="nm">{c.name.replace("Blank ","#")}</span>
              {c.power}⚔ {c.def}🛡 {c.pitch}◈
            </button>
          );
        })}
        {!me.hand.length && <span className="zn">hand empty</span>}
      </div>

      <div className="macts">
        <button className="a" disabled={!sel||!mine({t:"attack",uid:sel})} onClick={()=>fire({t:"attack",uid:sel})}>Attack</button>
        <button className="a" disabled={!sel||!mine({t:"pitch",uid:sel})}  onClick={()=>fire({t:"pitch",uid:sel})}>Pitch</button>
        <button className="a" disabled={!sel||!mine({t:"defend",uids:[sel]})} onClick={()=>fire({t:"defend",uids:[sel]})}>Defend</button>
        <button className="a go" disabled={!mine({t:"pass"})}    onClick={()=>fire({t:"pass"})}>Pass</button>
        <button className="a" disabled={!mine({t:"roll",sides:6})} onClick={()=>fire({t:"roll",sides:6})}>Roll d6</button>
        <button className="a" disabled={!mine({t:"endTurn"})}    onClick={()=>fire({t:"endTurn"})}>End turn</button>
      </div>

      {note && <div className="tblerr">{note}</div>}
      <p className="mnote">
        Blank decks — no rules text, no keywords. The turn structure, priority and
        combat chain are the real ones (CR 7.0.1), driven by engine/priority.js on
        both phones. State hash: <span className="mono">{sess.current ? sess.current.hash() : "—"}</span>
      </p>
      <button className="a" onClick={onExit}>Leave the table</button>
    </div>
  );
}

function App(){
  const [db,reload] = useCardDB();
  const [tab,setTab]=uS("heroes");
  const [hero,setHero]=uS(null);
  const [fighting,setFighting]=uS(null);
  const [loHero,setLoHero]=uS(null);
  /* seating is decided between the loadout and the first draw */
  const [seating,setSeating]=uS(null);
  /* the table: null -> "find" (the code screen) -> {table,host,code} (seated) */
  const [table,setTable]=uS(null);
  const [best,setBest]=uS(()=>store.get("best",{}));
  const record=(k,score)=>setBest(b=>{
    const nb={...b,[k]: b[k]==null?score:Math.min(b[k],score)}; store.set("best",nb); return nb;
  });
  /* One screen at a time. `idle` is the lobby: no match, no loadout, no
     seating throw and nobody at a table. */
  const idle = !fighting && !loHero && !seating && !table;
  return (
    <div className="shell">
      {!fighting && !table && <div className="topbar">
        <span className="brand">DAWN<em>BLADE</em></span>
        <span className="tag">v{APP_VER}{db.status==="ready" ? " · "+db.count+" cards" : ""}</span>
      </div>}
      <DbBanner db={db} reload={reload}/>
      {tab==="heroes" && idle && <>
        <HeroGrid best={best} onPick={p=>setHero(p&&p.random ? {...HEROES[Math.floor(Math.random()*HEROES.length)], mystery:true} : p)} db={db} selected={hero}/>
        {hero && <button className="battlebtn clip" disabled={db.status!=="ready"} onClick={()=>setLoHero(hero)}><span>{db.status==="ready"?"Battle":"Forging…"}</span></button>}
        <button className="bigbtn alt" style={{marginTop:8}} onClick={()=>setTable("find")}>Find an opponent</button>
        <VsStrip hero={hero} db={db}/>
        {hero && !hero.mystery && <HeroSheet h={hero} db={db} best={best} onBack={()=>setHero(null)} onFight={h=>setFighting(h)}/>}
        {hero && hero.mystery && <p className="note" style={{textAlign:"center"}}>Fate holds the card — your fighter is revealed at preparation.</p>}
      </>}
      {table==="find" && <TableScreen onBack={()=>setTable(null)} onSeated={s=>setTable(s)}/>}
      {table && table!=="find" && <TableMatch table={table.table} host={table.host} code={table.code}
        onExit={()=>setTable(null)}/>}
      {/* THE MATCH SEED is stamped once, here, when the match begins — and
          then everything random in the match derives from it: the pregame
          throw, both opening shuffles, the d6, intimidate, the dummy's
          recycle. One seed per match is what makes a game replayable, and
          it is the value a networked room code will supply instead of the
          clock. It rides in `cfg`, which already flows Loadout → Pregame →
          Battle, so nothing new has to be plumbed. */}
      {loHero && !fighting && <Loadout h={loHero} db={db} onBack={()=>setLoHero(null)} onStart={cfg=>{setSeating({h:loHero,cfg:{...cfg, seed:(cfg&&cfg.seed!=null)?cfg.seed:Date.now()}}); setLoHero(null);}}/>}
      {seating && !fighting && <Pregame h={seating.h} seed={seating.cfg.seed}
        onBack={()=>{setLoHero(seating.h); setSeating(null);}}
        onSeated={first=>{setFighting({h:seating.h,cfg:seating.cfg,first}); setSeating(null);}}/>}
      {fighting && <Battle h={fighting.h} cfg={fighting.cfg} first={fighting.first} db={db} onExit={()=>setFighting(null)} onRecord={record}/>}
      {tab==="judge" && idle && <Judge/>}
      {tab==="trophies" && idle && <Trophies/>}
      {idle && <nav className="tabs">
        <button className={"tab"+(tab==="heroes"?" on":"")} onClick={()=>{setTab("heroes");}}>Heroes</button>
        <button className={"tab"+(tab==="judge"?" on":"")} onClick={()=>setTab("judge")}>Judge</button>
        <button className={"tab"+(tab==="trophies"?" on":"")} onClick={()=>setTab("trophies")}>Trophies</button>
      </nav>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
setTimeout(function(){ if(!window.React || !document.querySelector(".shell")) document.getElementById("cdnfail").style.display="block"; },4000);
</script>
</body>
